# -----------------------------------------------------------------------------
# Módulos de los diseñadores (2026-10-09, captura del diseñador de aviones:
# "Los nombres de las tecnologías en los diseñadores no cambiaron": seguía
# "2 ametralladoras pesadas"). Los módulos de tanques, barcos y aviones no
# tienen nombre propio por país en el juego: se reescribe el nombre del juego
# para todos con estos términos (en orden, sin distinguir mayúsculas, palabra
# entera). También se aplican a las tecnologías y equipos que no tienen nombre
# de 2100 arriba, así el árbol y el diseñador dicen lo mismo. Los reemplazos
# en español respetan el género del original ("ametralladoras pesadas" ->
# "armas de pulso pesadas"). `modules` pisa el nombre de un módulo puntual.
# -----------------------------------------------------------------------------
