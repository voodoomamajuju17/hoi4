# =============================================================================
# 17_research.yaml — La investigación de 2100 (pedido del usuario, 2026-09-25)
# =============================================================================
# 1. Nombres: pisan los de las tecnologías y el equipo del juego
#    (localisation/<idioma>/replace/). Un id que el juego instalado no tiene se
#    ignora y se lista en el reporte; una tecnología sin entrada acá conserva
#    su nombre vanilla (investigacion.txt las lista para la próxima pasada).
# 2. Años: year_offset se suma al start_year de cada tecnología y al year de
#    cada equipo (1936 -> 2100). Los archivos se reescriben a partir del juego
#    instalado, así que siguen la versión que tengas. También se corren los
#    años escritos en la pantalla de investigación y en los nombres del juego
#    ("1934 ligero"), y cada entrada puede traer short_en/short_es para la
#    casilla del árbol.
# =============================================================================
