# -----------------------------------------------------------------------------
# Armas y tecnologías con nombre e imagen propios por facción (2026-10-03,
# pedido del usuario: "para cada meganación y anarquía hay distintas imágenes,
# y las armas y ciertas tecnologías se tienen que llamar distinto, aunque sean
# lo mismo en el fondo"). El equipo es el mismo para todos; cambia lo que ve
# cada país:
#   - nombre: <TAG>_<equipo> (el juego usa el nombre por país si existe) y
#     <TAG>_<tecnología> para la tecnología que lo habilita. "Fusil Espina II":
#     el número es la generación dentro de la familia.
#   - imagen: assets/<TAG>/tech/<familia>.dds (pedido de arte tech_<TAG>_<familia>)
#     -> GFX_<TAG>_<equipo>_medium y GFX_<TAG>_<tecnología>_medium, al tamaño del
#     ícono del juego. Sin imagen, queda la del juego.
# Satélites: los de su señor. El Santuario de Gaia: los del EFE. Las anarquías
# no tienen flota: sus barcos conservan el nombre común. Lo que es de una
# unidad única (20_unique_units) no se toca.
# -----------------------------------------------------------------------------
by_faction:
  inherit: {ZSG: EFE}
  # Tamaño de los íconos propios (2026-10-06). Si se puede leer el ícono del
  # juego se usa esa medida (1.19.3: 146x54); si no, estas. `scale` agranda o
  # achica todo (1.0 = igual; 1.2 = 20% más grande).
  icon_size: {equipment: [160, 72], tech: [100, 50], scale: 1.0}
  families:
    rifle:       {match: ['^infantry_equipment_(\d+)$'], art: "the faction's standard infantry rifle, side view"}
    support:     {match: ['^support_equipment_(\d+)$'], art: "a squad support kit: drone, tools and radio laid out together"}
    artillery:   {match: ['^artillery_equipment_(\d+)$'], art: "a towed guided howitzer, three-quarter view"}
    anti_air:    {match: ['^anti_air_equipment_(\d+)$'], art: "an air-defence weapon aiming at the sky"}
    anti_tank:   {match: ['^anti_tank_equipment_(\d+)$'], art: "a shoulder or tripod anti-armour missile launcher"}
    rocket:      {match: ['^rocket_artillery_equipment_(\d+)$'], art: "a multiple rocket / missile-swarm launcher vehicle"}
    motorized:   {match: ['^motorized_equipment_(\d+)$'], art: "a wheeled troop transport vehicle"}
    mechanized:  {match: ['^mechanized_equipment_(\d+)$'], art: "a tracked armoured infantry fighting vehicle"}
    amphibious:  {match: ['^amphibious_mechanized_equipment_(\d+)$'], art: "an amphibious armoured vehicle coming out of the water"}
    light_tank:  {match: ['^light_tank_(?:chassis|equipment)_(\d+)$'], art: "a light, fast scout tank"}
    medium_tank: {match: ['^medium_tank_(?:chassis|equipment)_(\d+)$'], art: "a medium battle tank"}
    heavy_tank:  {match: ['^heavy_tank_(?:chassis|equipment)_(\d+)$'], art: "a heavy, thickly armoured tank"}
    modern_tank: {match: ['^modern_tank_(?:chassis|equipment)_(\d+)$'], art: "a sleek main battle tank of the year 2100"}
    super_heavy: {match: ['^super_heavy_tank_(?:chassis|equipment)_(\d+)$'], art: "a colossal land fortress on tracks"}
    destroyer:   {match: ['^ship_hull_light_(\d+)$', '^destroyer_(\d+)$'], art: "a destroyer at sea, side view"}
    cruiser:     {match: ['^ship_hull_cruiser_(\d+)$', '^(?:light|heavy)_cruiser_(\d+)$'], art: "a missile cruiser at sea, side view"}
    capital:     {match: ['^ship_hull_heavy_(\d+)$', '^(?:battleship|battle_cruiser)_(\d+)$'], art: "a huge capital ship with railguns, side view"}
    carrier:     {match: ['^ship_hull_carrier_(\d+)$', '^carrier_(\d+)$'], art: "a drone carrier with a flat deck, side view"}
    submarine:   {match: ['^ship_hull_submarine_(\d+)$', '^submarine_(\d+)$'], art: "a submarine surfacing"}
    # Aviones (2026-10-06, pedido del usuario: "también los aviones por cada
    # facción"). Con By Blood Alone el avión es el fuselaje; el rol (caza,
    # apoyo, naval) sale del diseñador. El fuselaje pesado es la unidad única
    # de la FCU (Ala de Obsidiana): nadie más lo investiga, no lleva familia.
    light_plane:   {match: ['^small_plane_airframe_(\d+)$', '^fighter_equipment_(\d+)$', '^jet_fighter_equipment_(\d+)$'],
                    art: "a light single-seat combat aircraft (fighter / ground attack), three-quarter view in flight"}
    medium_plane:  {match: ['^medium_plane_airframe_(\d+)$', '^tac_bomber_equipment_(\d+)$', '^jet_tac_bomber_equipment_(\d+)$'],
                    art: "a twin-engine medium combat aircraft (tactical bomber / heavy fighter), three-quarter view in flight"}
    carrier_plane: {match: ['^cv_small_plane_airframe_(\d+)$', '^cv_fighter_equipment_(\d+)$'],
                    art: "a carrier-borne aircraft or drone with folding wings and an arrestor hook"}
  # Equipo con una sola imagen para todos los países (2026-10-07, captura del
  # usuario con la locomotora vieja: "uno común para todos"). La imagen va en
  # assets/COMUN/armas/<familia>.dds; los nombres siguen saliendo de `equipment`.
  shared:
    train: {match: ['^train_equipment_(\d+)$'], art: "a maglev freight train of the year 2100"}
