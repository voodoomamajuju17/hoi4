      - {effect: add_variable, var: NAS_inti, value: -1}
    - effect: if
      when: {variable_between: {var: NAS_mes, min: 12, max: 12}}
      then:
      - {effect: dynamic_modifier, id: NAS_sol_alto, days: 90}
    - effect: if
      when: {variable_between: {var: NAS_mes, min: 6, max: 6}}
      then:
      - {effect: dynamic_modifier, id: NAS_sol_bajo, days: 90}
      - {effect: event, id: meganations_nas.901}

  # ---------------------------------------------------------------------------
  - id: APF_pulso_v4
    effects:
    - effect: if
      when:
        <<: *guerra_con_potencia
        not_flag: APF_mandato_de_guerra
