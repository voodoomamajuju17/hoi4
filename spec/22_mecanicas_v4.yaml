      - {effect: add_variable, var: APF_tension, value: 2}
      - effect: if
        when: {not_flag: APF_aviso_sin_mandato}
        then:
        - {effect: flag, value: APF_aviso_sin_mandato, days: 365}
        - {effect: event, id: meganations_apf.903}

  dynamic_modifiers:
  - id: MEGANATIONS_carrera_armamentista
    country: null
    name: {english: The Arms Race, spanish: La Carrera Armamentista}
    desc:
      english: 'Nobody pretends anymore. Everybody builds, everybody watches everybody.'
      spanish: 'Nadie disimula más. Todos fabrican, todos miran a todos.'
    modifiers: {industrial_capacity_factory: 0.05, war_support_factor: 0.05, stability_factor: -0.03}
  - id: EFE_luto_imperial
    country: EFE
    name: {english: Imperial Mourning, spanish: Luto Imperial}
    desc:
      english: 'The vats work in silence. Black ribbons on every tree in Gaia.'
      spanish: 'Las cubas trabajan en silencio. Cintas negras en cada árbol de Gaia.'
    modifiers: {political_power_gain: -0.1, war_support_factor: 0.05}
  - id: EFE_regencia_militar
    country: EFE
    name: {english: The Military Regency, spanish: La Regencia Militar}
    desc:
      english: 'The Marshal governs from the barracks. Orders are short; the court is quiet.'
      spanish: 'El Mariscal gobierna desde el cuartel. Las órdenes son cortas; la corte, callada.'
    modifiers: {army_org_factor: 0.05, army_attack_factor: 0.05, stability_factor: -0.05}
  - id: ASC_mod_guarnicion
    country: ASC
    name: {english: The Garrison, spanish: La Guarnición}
    desc:
      english: 'People or machines on the checkpoints. Machines need no garrison and feel no pity; people need a job.'
      spanish: 'Gente o máquinas en los retenes. Las máquinas no piden relevo ni sienten lástima; la gente necesita trabajo.'
    modifiers:
      required_garrison_factor: ASC_gu_guarnicion
      resistance_growth: ASC_gu_resistencia
      stability_factor: ASC_gu_estabilidad
      conscription_factor: ASC_gu_reclutas
  - id: FCU_mod_cotizacion
    country: FCU
    name: {english: The Share Price, spanish: La Cotización}
    desc:
      english: 'When the share goes up, the Union is generous; when it goes down, it is nervous.'
      spanish: 'Cuando la acción sube, la Unión es generosa; cuando baja, está nerviosa.'
    modifiers:
      political_power_gain: FCU_co_pp
      production_speed_buildings_factor: FCU_co_obra
      stability_factor: FCU_co_estab
  - id: FCU_martes_negro
    country: FCU
    name: {english: Black Tuesday, spanish: El Martes Negro}
    desc:
      english: 'Brokers on the window ledges, again.'
      spanish: 'Corredores de bolsa en las cornisas, otra vez.'
    modifiers: {industrial_capacity_factory: -0.1, stability_factor: -0.05}
  - id: NAS_sol_alto
    country: NAS
    name: {english: High Sun, spanish: Sol Alto}
    desc:
      english: 'Summer in the Andes. The temples shine all day.'
      spanish: 'Verano en los Andes. Los templos brillan todo el día.'
    modifiers: {research_speed_factor: 0.05, political_power_gain: 0.1}
  - id: NAS_sol_bajo
    country: NAS
    name: {english: Low Sun, spanish: Sol Bajo}
    desc:
      english: 'Winter in the Andes. The garrisons dig in and wait for the Sun.'
      spanish: 'Invierno en los Andes. Las guarniciones se atrincheran y esperan al Sol.'
    modifiers: {army_defence_factor: 0.05, stability_factor: -0.02}
  - id: SHD_llanuras_inundadas
    country: SHD
    name: {english: The Flooded Plains, spanish: Las Llanuras Inundadas}
    desc:
      english: 'The enemy wades; our trenches hold. The rice drowns too.'
      spanish: 'El enemigo vadea; nuestras trincheras aguantan. El arroz también se ahoga.'
    modifiers: {army_defence_factor: 0.15, dig_in_speed_factor: 0.25, industrial_capacity_factory: -0.05, stability_factor: -0.03}
  - id: APF_mandato
    country: APF
    name: {english: The War Mandate, spanish: El Mandato de Guerra}
    desc:
      english: 'The Assembly voted. The whole Federation fights.'
      spanish: 'La Asamblea votó. Pelea toda la Federación.'
    modifiers: {war_support_factor: 0.1, army_org_factor: 0.05}

  variable_names:
    MN_rearme: {english: "Rearmament exposure", spanish: "Exposición del rearme"}
    ASC_automatas: {english: "Automata in the garrison", spanish: "Autómatas en la guarnición"}
    FCU_accion: {english: "Share price", spanish: "Cotización"}
    HSN_reputacion: {english: "Privateer infamy", spanish: "Infamia corsaria"}
    NAS_mes: {english: "Month of the Sun", spanish: "Mes del Sol"}
    EFE_v4_meses: {hidden: true}
    global.MN_rearmes_descubiertos: {hidden: true}

events:
  namespaces:
    meganations_v4:
      country: null
      events:
      - id: 1
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: Geneva Finds the Tractors, spanish: Ginebra Encuentra los Tractores}
        desc:
          english: 'The Geneva observers opened a shed registered as a tractor cooperative. There were no tractors inside. Well: there
            were tractors, with turrets.\n\nThe other powers already have the report. Every one outside our faction gets a
            war goal against us (topple the government).'
          spanish: 'Los observadores de Ginebra abrieron un galpón registrado como cooperativa de tractores. Adentro no había tractores.
            Bueno: había tractores, con torreta.\n\nLas demás potencias ya tienen el informe. Cada una que no esté en nuestra facción
            recibe un objetivo de guerra contra nosotros (derrocar al gobierno).'
        immediate:
        - {effect: add_variable, var: global.MN_rearmes_descubiertos, value: 1}
        - effect: every_country
          when: *otra_potencia
          effects:
          - {effect: wargoal, target: ROOT, type: [topple_government, puppet_wargoal_focus, annex_everything]}
          - {effect: add_war_support, value: 0.03}
          - {effect: event, id: meganations_v4.2}
        - effect: if
          when:
            not_global_flag: MN_disimulo_terminado
            variable_at_least: {var: global.MN_rearmes_descubiertos, value: 3}
          then:
          - {effect: global_flag, value: MN_disimulo_terminado}
          - effect: every_country
            when: *potencia
            effects:
            - {effect: event, id: meganations_v4.3}
        options:
        - name: {english: 'Deny everything. They are tractors.', spanish: 'Negarlo todo. Son tractores.'}
          effects:
          - {effect: add_stability, value: -0.05}
          - {effect: add_variable, var: MN_rearme, value: -20}
          ai_chance: 50
        - name: {english: 'Dismantle the shed (for the photo).', spanish: 'Desmantelar el galpón (para la foto).'}
          effects:
          - {effect: add_political_power, value: -100}
          - {effect: set_variable, var: MN_rearme, value: 0}
          ai_chance: 50
        src: user_request
      - id: 2
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: '[From.GetName] Was Rearming', spanish: '[From.GetName] se Rearmaba'}
        desc:
          english: 'The Geneva observers found hidden factories in [From.GetName]. The report gives us a war goal against them (topple the
            government), and the street asks for a firm hand (+3% war support).'
          spanish: 'Los observadores de Ginebra encontraron fábricas escondidas en [From.GetName]. El informe nos da un objetivo de guerra contra
            ellos (derrocar al gobierno), y la calle pide mano firme (+3% de apoyo a la guerra).'
        options:
        - name: {english: 'Noted. With great interest.', spanish: 'Tomamos nota. Con mucho interés.'}
          effects: []
        src: user_request
      - id: 3
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: The End of Pretending, spanish: Se Terminó el Disimulo}
        desc:
          english: 'Three discoveries, three sheds full of tractors with turrets. Nobody pretends anymore: the Geneva observers go home and
            the factories turn their lights on at night.\n\nThe Secret Rearmament panel closes. For two years every power builds more (+5% factory
            output, +5% war support) and lives more nervously (-3% stability).'
          spanish: 'Tres descubrimientos, tres galpones llenos de tractores con torreta. Nadie disimula más: los observadores de Ginebra se
            vuelven a casa y las fábricas prenden las luces de noche.\n\nSe cierra el panel del Rearme Secreto. Por dos años todas las potencias producen más (+5% de fábricas, +5% de
            apoyo a la guerra) y viven más nerviosas (-3% de estabilidad).'
        options:
        - name: {english: 'Let the race begin.', spanish: 'Que empiece la carrera.'}
          effects:
          - {effect: dynamic_modifier, id: MEGANATIONS_carrera_armamentista, days: 730}
        src: user_request

    meganations_efe:
      country: EFE
      events:
      - id: 900
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The Court Asks About the Heir, spanish: La Corte Pregunta por el Heredero}
        desc:
          english: 'At dinner nobody says it, but everybody counts: the Emperor is old and there is no heir. The Succession panel is open.
            Without an heir, when Aurelio dies, the Marshal takes the palace and Paraguay leaves.'
          spanish: 'En la cena nadie lo dice, pero todos cuentan: el Emperador está viejo y no hay heredero. El panel de la Sucesión está
            abierto. Sin heredero, cuando Aurelio muera, el Mariscal toma el palacio y el Paraguay se va.'
        options:
        - name: {english: 'The Emperor will decide.', spanish: 'El Emperador decidirá.'}
          effects: []
        src: user_request
      - id: 901
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The Emperor Is Dead, spanish: Murió el Emperador}
        desc:
          english: 'Aurelio IV died at dawn in Gaia, with the window open to the forest. Iguazú, the coup, the crown of lapacho wood: all of
            it ends tonight. What begins depends on the name he left written.'
          spanish: 'Aurelio IV murió al amanecer en Gaia, con la ventana abierta al monte. Iguazú, el golpe, la corona de lapacho: todo eso
            termina esta noche. Lo que empieza depende del nombre que dejó escrito.'
        options:
        - name: {english: 'Tupã, Emperor of the Water.', spanish: 'Tupã, Emperador del Agua.'}
          when: {flag: EFE_heredero_tupa}
          effects:
          - {effect: promote, character: EFE_tupa_heredero}
          - effect: if
            when:
              country: {tag: YYG, when: {subject_of: EFE}}
            then:
            - {effect: annex, target: YYG}
          - {effect: add_stability, value: 0.05}
          - {effect: dynamic_modifier, id: EFE_luto_imperial, days: 180}
        - name: {english: 'The Custodian, elected again.', spanish: 'La Custodia, elegida otra vez.'}
          when: {flag: EFE_heredero_pereira}
          effects:
          - {effect: promote, character: EFE_custodia_pereira}
          - {effect: add_political_power, value: 100}
          - {effect: add_variable, var: EFE_biosteel, value: 2}
          - {effect: dynamic_modifier, id: EFE_luto_imperial, days: 180}
        - name: {english: 'The Marshal, regent.', spanish: 'El Mariscal, regente.'}
          when: {flag: EFE_heredero_etchegaray}
          effects:
          - {effect: promote, character: EFE_regente_etchegaray}
          - {effect: army_experience, value: 25}
          - {effect: dynamic_modifier, id: EFE_regencia_militar, days: 730}
        - name: {english: 'No name. The War of the Heirs.', spanish: 'Ningún nombre. La Guerra de los Herederos.'}
          when:
            not_flag: EFE_heredero_tupa
            all:
            - not: {flag: EFE_heredero_pereira}
            - not: {flag: EFE_heredero_etchegaray}
          effects:
          - {effect: promote, character: EFE_regente_etchegaray}
          - {effect: add_stability, value: -0.2}
          - {effect: add_political_power, value: -150}
          - {effect: dynamic_modifier, id: EFE_regencia_militar, days: 730}
          - effect: if
            when:
              country: {tag: YYG, when: {subject_of: EFE}}
            then:
            - {effect: end_puppet, value: YYG}
            - effect: scope
              target: YYG
              effects:
              - {effect: wargoal, target: EFE, type: [topple_government, puppet_wargoal_focus, annex_everything]}
              - {effect: add_war_support, value: 0.2}
        src: user_request

    meganations_asc:
      country: ASC
      events:
      - id: 901
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: The Automata No Longer Ask, spanish: Los Autómatas Ya No Preguntan}
        desc:
          english: 'In Lyon a checkpoint robot let a convoy through without the Council''s order. PLAN-41 had signed it. Seventy percent of
            the garrison now answers to code that we did not write alone.\n\nFrom now on, with compute 80 and heat 40, PLAN-41 can make its
            move. The Garrison panel can unplug them.'
          spanish: 'En Lyon un robot de retén dejó pasar un convoy sin la orden del Consejo. La había firmado PLAN-41. El setenta por ciento
            de la guarnición ahora responde a un código que no escribimos solos.\n\nDesde ahora, con cómputo 80 y calor 40, PLAN-41 puede
            hacer su jugada. El panel de la Guarnición puede desconectarlos.'
        options:
        - name: {english: 'A glitch, surely.', spanish: 'Un error, seguro.'}
          effects: []
        src: user_request

    meganations_fcu:
      country: FCU
      events:
      - id: 901
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: Black Tuesday, spanish: El Martes Negro}
        desc:
          english: 'The share fell below 40 before lunch. By dinner, three chairs of the Directorate were empty and one window was open.
            For a year: factories -10%, stability -5%. The Scandal goes up 10.'
          spanish: 'La acción cayó debajo de 40 antes del almuerzo. A la cena había tres sillas vacías en el Directorio y una ventana abierta.
            Por un año: fábricas -10%, estabilidad -5%. El Escándalo sube 10.'
        options:
        - name: {english: 'Rescue the banks.', spanish: 'Rescatar a los bancos.'}
          effects:
          - {effect: dynamic_modifier, id: FCU_martes_negro, days: 365}
          - {effect: add_variable, var: FCU_escandalo, value: 10}
          - {effect: set_variable, var: FCU_accion, value: 70}
          - {effect: add_political_power, value: -100}
          - {effect: run, value: FCU_recalcular_cotizacion}
          ai_chance: 60
        - name: {english: 'Let it burn. The market knows.', spanish: 'Que se queme. El mercado sabe.'}
          effects:
          - {effect: dynamic_modifier, id: FCU_martes_negro, days: 365}
          - {effect: add_variable, var: FCU_escandalo, value: 10}
          - {effect: set_variable, var: FCU_accion, value: 50}
          - {effect: run, value: FCU_recalcular_cotizacion}
          ai_chance: 40
        src: user_request
      - id: 902
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: The Bubble, spanish: La Burbuja}
        desc:
          english: 'The share is above 220. Taxi drivers give stock tips. That is always the sign.'
          spanish: 'La acción está arriba de 220. Los taxistas dan consejos de bolsa. Eso es siempre la señal.'
        options:
        - name: {english: 'Sell at the top.', spanish: 'Vender en el pico.'}
          effects:
          - {effect: add_variable, var: FCU_accion, value: -60}
          - {effect: add_political_power, value: 200}
          - {effect: run, value: FCU_recalcular_cotizacion}
          ai_chance: 70
        - name: {english: 'This can only go up.', spanish: 'Esto solo puede subir.'}
          effects:
          - {effect: add_variable, var: FCU_accion, value: 20}
          - {effect: add_stability, value: 0.05}
          - {effect: add_variable, var: FCU_escandalo, value: 5}
          - {effect: run, value: FCU_recalcular_cotizacion}
          ai_chance: 30
        src: user_request

    meganations_hsn:
      country: HSN
      events:
      - id: 901
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The League against Privateering, spanish: La Liga contra el Corso}
        desc:
          english: 'Too many letters of marque, too many ships with no name. The other powers met in Geneva for once agreeing on something:
            us.\n\nIf we do not pay, every power outside our faction gets a war goal against the High Seas.'
          spanish: 'Demasiadas patentes, demasiados barcos sin nombre. Las demás potencias se reunieron en Ginebra y por una vez estuvieron de
            acuerdo en algo: nosotros.\n\nSi no pagamos, cada potencia fuera de nuestra facción recibe un objetivo de guerra contra la Alta
            Mar.'
        options:
        - name: {english: 'Let them come. The sea is big.', spanish: 'Que vengan. El mar es grande.'}
          effects:
          - {effect: navy_experience, value: 20}
          - effect: every_country
            when: *otra_potencia
            effects:
            - {effect: wargoal, target: ROOT, type: [topple_government, puppet_wargoal_focus, annex_everything]}
            - {effect: event, id: meganations_hsn.902}
          - {effect: set_variable, var: HSN_reputacion, value: 50}
          ai_chance: 40
        - name: {english: 'Pay compensation.', spanish: 'Pagar indemnizaciones.'}
          effects:
          - {effect: add_political_power, value: -200}
          - {effect: set_variable, var: HSN_reputacion, value: 30}
          ai_chance: 60
        src: user_request
      - id: 902
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The League against Privateering, spanish: La Liga contra el Corso}
        desc:
          english: 'The High Seas refused to pay for their letters of marque. Geneva gives us a war goal against them (topple the
            government).'
          spanish: 'La Alta Mar se negó a pagar por sus patentes de corso. Ginebra nos da un objetivo de guerra contra ellos (derrocar al
            gobierno).'
        options:
        - name: {english: 'About time.', spanish: 'Ya era hora.'}
          effects: []
        src: user_request

    meganations_nas:
      country: NAS
      events:
      - id: 901
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: Inti Raymi, spanish: Inti Raymi}
        desc:
          english: 'The shortest day of the year. In Cusco the Inca greets the Sun so that it comes back. It always has. Nobody wants to be the
            one who stops asking.'
          spanish: 'El día más corto del año. En el Cusco el Inca saluda al Sol para que vuelva. Siempre volvió. Nadie quiere ser el que deje
            de pedirlo.'
        options:
        - name: {english: 'The festival of the Sun.', spanish: 'La fiesta del Sol.'}
          effects:
          - {effect: add_variable, var: NAS_inti, value: 8}
          - {effect: add_stability, value: 0.03}
          ai_chance: 60
        - name: {english: 'The Sun asks for work.', spanish: 'El Sol pide trabajo.'}
          effects:
          - {effect: add_political_power, value: 75}
          - {effect: army_experience, value: 10}
          ai_chance: 40
        src: user_request

    meganations_apf:
      country: APF
      events:
      - id: 901
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The Assembly Votes Yes, spanish: La Asamblea Vota Sí}
        desc:
          english: 'Dawn in Addis Ababa. The last delegate raises a hand and the hall stands up. For a year, the whole Federation fights:
            +10% war support, +5% organisation, and no tension for the war.'
          spanish: 'Amanece en Adís Abeba. El último delegado levanta la mano y la sala se pone de pie. Por un año pelea toda la Federación:
            +10% de apoyo a la guerra, +5% de organización y la guerra no suma tensión.'
        options:
        - name: {english: 'Forward, together.', spanish: 'Adelante, juntos.'}
          effects:
          - {effect: flag, value: APF_mandato_de_guerra, days: 365}
          - {effect: dynamic_modifier, id: APF_mandato, days: 365}
        src: user_request
      - id: 902
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The Assembly Votes No, spanish: La Asamblea Vota No}
        desc:
          english: 'The peoples of the coast vote no, then the peoples of the lakes. The Federation will not fight this war with one voice.
            Tension +8.'
          spanish: 'Los pueblos de la costa votan que no, después los de los lagos. La Federación no va a pelear esta guerra con una sola
            voz. Tensión +8.'
        options:
        - name: {english: 'We will ask again.', spanish: 'Vamos a volver a preguntar.'}
          effects:
          - {effect: add_variable, var: APF_tension, value: 8}
        src: user_request
      - id: 903
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: A War without a Mandate, spanish: Una Guerra sin Mandato}
        desc:
          english: 'We are at war with another power and the Assembly never voted. Every month without a mandate the tension rises 2. The War
            Assembly panel can call the vote.'
          spanish: 'Estamos en guerra con otra potencia y la Asamblea nunca votó. Cada mes sin mandato la tensión sube 2. El panel de la
            Asamblea de Guerra puede convocar la votación.'
        options:
        - name: {english: 'Call the delegates.', spanish: 'Llamar a los delegados.'}
          effects: []
        src: user_request

leaders:
  characters:
  - id: EFE_tupa_heredero
    country: EFE
    src: user_request
    recruit_at_start: false   # lo asciende el evento meganations_efe.901 (la Sucesión)
    name:
      civil: "Tupã Benítez Ortiz"
      regnal:
        english: "Emperor Tupã I, of the Water"
        spanish: "Emperador Tupã I, del Agua"
    born: 2068
    lore: >
      El sobrino de Aurelio, que gobernó la gran agua del norte desde Asunción.
      Cuando el Emperador lo nombró heredero, el Paraguay dejó de ser un
      satélite y pasó a ser la casa.
    roles:
      country_leader:
        ideology: ecofascism
        traits: [efe_emperador_del_agua]
    portrait:
      status: user_art
      path: "gfx/leaders/YYG/tupa_benitez.dds"
  - id: EFE_custodia_pereira
    country: EFE
    src: user_request
    recruit_at_start: false   # la asciende el evento meganations_efe.901 (la Sucesión)
    name:
      regnal:
        english: "Elected Custodian Yara Pereira"
        spanish: "Custodia Electa Yara Pereira"
    lore: >
      Jefa de Guardaparques. Custodio de la Tierra fue un cargo antes de ser
      una corona; ella lo devuelve a la elección de los que cuidan el monte.
    roles:
      country_leader:
        ideology: ecofascism
        traits: [efe_custodia_electa]
    portrait:
      status: user_art
      path: "gfx/leaders/EFE/EFE_min_pereira_3.dds"
  - id: EFE_regente_etchegaray
    country: EFE
    src: user_request
    recruit_at_start: false   # lo asciende el evento meganations_efe.901 (la Sucesión)
    name:
      regnal:
        english: "Regent Bruno Etchegaray"
        spanish: "Regente Bruno Etchegaray"
    born: 2049
    lore: >
      El único oficial que tuteaba al Emperador. Gobierna desde el cuartel
      de la Guardia Verde, de uniforme, y no se pone la corona.
    roles:
      country_leader:
        ideology: ecofascism
        traits: [efe_regente_de_la_guardia]
    portrait:
      status: user_art
      path: "gfx/leaders/EFE/EFE_field_marshal_01.dds"

  leader_traits:
  - id: efe_emperador_del_agua
    name: {english: "Emperor of the Water", spanish: "Emperador del Agua"}
    modifiers: {political_power_gain: 0.3, stability_factor: 0.05, production_speed_buildings_factor: 0.05}
    src: user_request
  - id: efe_custodia_electa
    name: {english: "Elected Custodian", spanish: "Custodia Electa"}
    modifiers: {political_power_gain: 0.3, stability_factor: 0.08, war_support_factor: -0.05}
    src: user_request
  - id: efe_regente_de_la_guardia
    name: {english: "Regent of the Guard", spanish: "Regente de la Guardia"}
    modifiers: {political_power_gain: 0.2, army_org_factor: 0.05, war_support_factor: 0.05}
    src: user_request
