    - {effect: clamp, var: HSN_reputacion, min: 0, max: 100}
    - effect: if
      when:
        variable_at_least: {var: HSN_reputacion, value: 75}
        not_flag: HSN_liga_reciente
      then:
      - {effect: flag, value: HSN_liga_reciente, days: 1095}
      - {effect: event, id: meganations_hsn.901}

  # ---------------------------------------------------------------------------
  - id: NAS_pulso_v4
    effects:
    - effect: if
      when: {not_flag: NAS_v4_init}
      then:
      - {effect: flag, value: NAS_v4_init}
