# =============================================================================
# 15_balance.yaml — Balance de arranque entre meganaciones
# =============================================================================
# Aprobado por el usuario (2026-09-23), con dos reglas duras:
#   1. La Anarquía queda con sus recursos e industrias tal cual el juego base.
#   2. El total mundial de cada recurso es INVARIABLE: si el juego base tiene
#      1000 de acero repartidos, siguen existiendo exactamente 1000. Los
#      mínimos por meganación se logran MOVIENDO recursos entre states, nunca
#      creándolos. El generador verifica los totales y falla si no cierran.
# Sin "recursos de identidad" (descartado por el usuario).
# =============================================================================

# -----------------------------------------------------------------------------
# Industrialización inicial: fábricas civiles en slots LIBRES de los states
# de las meganaciones chicas, hasta una IC objetivo. Si no hay slots
# suficientes, llega hasta donde pueda y lo dice el reporte.
# Los slots salen de common/state_category/ vanilla; los edificios que
# comparten slot, de common/buildings/ (shares_slots = yes).
# -----------------------------------------------------------------------------
industrialization:
  src: invented
  # 2026-09-25 (pedido del usuario: "balancea más la industria"): franja de IC
  # por tipo de país. Por debajo del mínimo se agregan fábricas civiles en
  # slots libres; por encima del máximo se sacan fábricas de los states más
  # industriales. `targets` sigue sirviendo para un país puntual.
  band:
    meganation: [95, 115]
    satellite: [0, 35]
  # 2026-09-29: los satélites del EFE eran demasiado débiles (0 y 4 de IC)
  targets: {YYG: 22, PTA: 10}
  building: industrial_complex

# -----------------------------------------------------------------------------
# Construcción (2026-09-29, pedido del usuario): "casi no se puede construir" y
# "el NAS no tiene astilleros". Espacios de construcción extra en cada región
# de los países del mod, y un mínimo de astilleros en regiones con costa.
# -----------------------------------------------------------------------------
construction:
  src: user_request
  extra_slots: {meganation: 3, satellite: 2, anarchy: 1}
  dockyards_min: {meganation: 10, satellite: 2}
  dockyard: dockyard

# -----------------------------------------------------------------------------
# Población (manpower de los states), 2026-09-26: el usuario pidió bajarla al
# 15% y que crezca pareja. Objetivo por país = factor x T^compress x R^(1-compress)
# (T su total, R la mediana de su tipo): con compress 0.5 el SHD (465M) queda
# en ~35M y la NAS (11M) en ~5M, en vez de 43 veces más.
# -----------------------------------------------------------------------------
population:
  src: user_decision
  factor: 0.15
  compress: 0.5
  min_per_state: 1000

# -----------------------------------------------------------------------------
# Leyes de reclutamiento de arranque. Los gigantes en población arrancan con
# poca movilización; los chicos, con mucha. Las leyes se verifican contra
# common/ideas/ vanilla (si una no existe se saltea con aviso).
# -----------------------------------------------------------------------------
conscription:
  src: invented
  # 2026-09-29: el reclutamiento pasó a starting_laws -> overrides, junto con
  # la economía y el comercio de cada país (una sola fuente por país).
  laws: {}

# -----------------------------------------------------------------------------
# Leyes de economía y comercio de arranque (2026-09-28: "estaban todos en
# economía civil"). Las meganaciones arrancan con movilización parcial, los
# satélites con la baja y la Anarquía en economía de guerra. Se verifican
# contra common/ideas/ del juego.
# -----------------------------------------------------------------------------
starting_laws:
  src: user_request
  meganation: [partial_economic_mobilisation, limited_exports]
  satellite: [low_economic_mobilisation, export_focus]
  anarchy: [war_economy, closed_economy, extensive_conscription]
  # 2026-09-29 ("un estado fascista debería tener movilización, la FCU libre
  # mercado"): economía, comercio y reclutamiento según la ideología de cada
  # país. Los gigantes en población (SHD, APF) siguen con voluntarios; los
  # chicos (NAS, EFE), con reclutamiento extensivo. Los satélites siguen la
  # línea de su señor un escalón más abajo y le exportan.
  overrides:
    # Restauración (fascismo): movilizados de entrada
    EFE: [war_economy, limited_exports, extensive_conscription]        # imperio verde en armas
    NRE: [war_economy, limited_exports, service_by_requirement]        # las legiones primero
    PTA: [partial_economic_mobilisation, export_focus, extensive_conscription]
    YYG: [partial_economic_mobilisation, export_focus, extensive_conscription]
    ZHI: [partial_economic_mobilisation, export_focus, extensive_conscription]
    ZDA: [partial_economic_mobilisation, export_focus, extensive_conscription]
    # Orden de Mercado (democracia de mercado): libre comercio, ejército profesional
    FCU: [low_economic_mobilisation, free_trade, limited_conscription]  # el Directorio vende de todo
    HSN: [civilian_economy, free_trade, volunteer_only]                 # el mar es un mercado
    ZNR: [low_economic_mobilisation, free_trade, volunteer_only]
    ZSE: [low_economic_mobilisation, free_trade, volunteer_only]
    ZAF: [civilian_economy, free_trade, volunteer_only]
    ZAS: [civilian_economy, free_trade, volunteer_only]
    # Colectivismo: economía planificada, se exporta poco
    ASC: [partial_economic_mobilisation, closed_economy, limited_conscription]   # la red lo produce todo
    APF: [low_economic_mobilisation, export_focus, volunteer_only]              # federación en desarrollo
    ZBC: [low_economic_mobilisation, limited_exports, limited_conscription]
    ZAL: [low_economic_mobilisation, limited_exports, limited_conscription]
    ZET: [low_economic_mobilisation, export_focus, limited_conscription]
    ZSA: [low_economic_mobilisation, export_focus, limited_conscription]
    # Mandato Trascendente: el Directorio dirige; el Sol consagra
    SHD: [partial_economic_mobilisation, limited_exports, volunteer_only]
    NAS: [low_economic_mobilisation, export_focus, extensive_conscription]
    ZKR: [low_economic_mobilisation, export_focus, limited_conscription]
    ZST: [low_economic_mobilisation, export_focus, limited_conscription]
    ZNG: [low_economic_mobilisation, export_focus, limited_conscription]
    ZLL: [low_economic_mobilisation, export_focus, limited_conscription]
    # La Anarquía: economía de guerra y levas (tipo anarchy). Las Tierras Sin Ley arrancan en paz.
    ZAN: [low_economic_mobilisation, limited_exports, extensive_conscription]
    # El Santuario de Gaia: neutral, vende lo que la selva da, sin levas
    ZSG: [civilian_economy, export_focus, volunteer_only]

# Poder político de arranque (2026-09-28: "falta PP"). Además cada líder de
# meganación suma poder político por día con su rasgo (03_leaders.yaml).
starting_political_power:
  src: user_request
  meganation: 200
  satellite: 50
  anarchy: 50

# -----------------------------------------------------------------------------
# Mínimo de recursos estratégicos por meganación, por TRANSFERENCIA.
# Donantes: states de meganaciones y satélites con excedente (nunca la
# Anarquía), empezando por el país que más tiene de ese recurso y, dentro de
# él, por el state con más. Un donante no baja del mínimo si es meganación.
# Receptor: la capital de la meganación que le falta.
# -----------------------------------------------------------------------------
resource_floor:
  src: invented
  per_meganation: 20
  resources: [oil, steel, aluminium, rubber, tungsten, chromium]
