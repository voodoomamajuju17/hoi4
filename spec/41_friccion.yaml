          english: The High Seas and the Shogunate of the Shipyards are at war. The Market came to collect the fleet Japan kept on the night of the old flag; Japan answered that the fleet had been paid for, with a century of badly paid work.
          spanish: La Alta Mar y el Shogunato de los Astilleros están en guerra. El Mercado vino a cobrar la flota que Japón se quedó la noche de la bandera vieja; Japón contestó que la flota ya estaba pagada, con un siglo de trabajo mal pagado.
