      # --- El Tratado de la Línea (la Alta Mar y el Directorio) ----------------
      - id: 200
        trigger: effect
        picture: GFX_report_event_generic_sign_treaty1
        title: {english: The Proposal of the Line, spanish: La Propuesta de la Línea}
        desc:
          english: 'An embassy from [From.GetName] arrives with a map of the world and a single line on it, from pole to pole, through the China Sea. West of the line, the Indian Ocean, Malacca and the routes to Africa and Europe would belong to the High Seas; east of it, the Pacific, Taiwan and the routes to the Americas, to the Directorate. Hong Kong, a free port. The Sun Kingdom offers to arbitrate, like a pope without a Vatican. Nobody asked the rest of the world.'
          spanish: 'Llega una embajada de [From.GetName] con un mapa del mundo y una sola raya, de polo a polo, que pasa por el mar de la China. Al oeste de la raya, el Índico, Malaca y las rutas a África y Europa serían de la Alta Mar; al este, el Pacífico, Taiwán y las rutas a América, del Directorio. Hong Kong, puerto libre. El Reino del Sol se ofrece de árbitro, como un Papa sin Vaticano. Nadie le preguntó al resto del mundo.'
        options:
        - name: {english: Sign the Line., spanish: Firmar la Línea.}
          ai_chance: 70
          effects:
          - {effect: run, value: MN_linea_firmar}
        - name: {english: Ask for Hong Kong on our side., spanish: Pedir Hong Kong de nuestro lado.}
          ai_chance: 15
          effects:
          - {effect: event, id: meganations_friccion.201, target: FROM}
        - name: {english: The sea is not divided., spanish: El mar no se divide.}
          ai_chance: 15
          effects:
          - {effect: run, value: MN_friccion_malaca_sube_mucho}
        src: user_request
      - id: 201
        trigger: effect
        picture: GFX_report_event_generic_sign_treaty1
        art: meganations_friccion.200
        title: {english: They Want Hong Kong, spanish: Quieren Hong Kong}
        desc:
          english: '[From.GetName] accepts the Line on one condition: Hong Kong falls on their side. If we say yes, the free port stops being free, and they will go and take it from the warlords.'
          spanish: '[From.GetName] acepta la Línea con una condición: Hong Kong cae de su lado. Si decimos que sí, el puerto libre deja de ser libre, y van a ir a sacárselo a los caudillos.'
        options:
        - name: {english: Let them have it, if they can take it., spanish: Que se lo queden, si pueden.}
          ai_chance: 50
          effects:
          - {effect: run, value: MN_linea_firmar}
          - {effect: run, value: MN_linea_hong_kong_FROM}
        - name: {english: Then there is no Line., spanish: Entonces no hay Línea.}
          ai_chance: 50
          effects:
          - {effect: run, value: MN_friccion_malaca_sube_mucho}
        src: user_request
      - id: 202
        trigger: effect
        picture: GFX_report_event_generic_sign_treaty1
        title: {english: The Line, spanish: La Línea}
        desc:
          english: 'In Cusco, under the eyes of the Inca, the envoys of the High Seas and of the Directorate signed the Line. A stroke on the map, from pole to pole: on one side the Indian Ocean, on the other the Pacific. For the first time in a century, the trade of the world has an owner, and there are two of them.\n\nWHILE IT HOLDS: the rivalry over Malacca is frozen; non-aggression between both; the High Seas build ships faster and the Directorate builds factories faster.\n\nIF ONE OF THEM GOES TO WAR AGAINST THE OTHER: the Line breaks, and the rivalry comes back hotter than before.'
          spanish: 'En Cusco, bajo los ojos del Inca, los enviados de la Alta Mar y del Directorio firmaron la Línea. Una raya en el mapa, de polo a polo: de un lado el Índico, del otro el Pacífico. Por primera vez en un siglo, el comercio del mundo tiene dueño, y son dos.\n\nMIENTRAS DURE: la rivalidad por Malaca queda congelada; no agresión entre los dos; la Alta Mar construye barcos más rápido y el Directorio, fábricas.\n\nSI UNO LE HACE LA GUERRA AL OTRO: la Línea se rompe, y la rivalidad vuelve más caliente que antes.'
        options:
        - name: {english: Each one on their side., spanish: Cada uno en su mitad.}
          effects: []
        src: user_request
      - id: 203
        trigger: effect
        picture: GFX_report_event_generic_sign_treaty1
        art: meganations_friccion.202
        title: {english: The World Split in Two, spanish: El Mundo Partido en Dos}
        desc:
          english: The High Seas and the Directorate signed the Line in Cusco. They have divided the trade of the world with a stroke from pole to pole. The rest of us found out from the newspapers.
          spanish: La Alta Mar y el Directorio firmaron la Línea en Cusco. Se repartieron el comercio del mundo con una raya de polo a polo. Los demás nos enteramos por los diarios.
        options:
        - name: {english: Nobody asked us., spanish: Nadie nos preguntó.}
          effects:
          - {effect: run, value: MN_linea_reaccion}
        src: user_request
      - id: 204
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The Betrayal of the Line, spanish: La Traición de la Línea}
        desc:
          english: The Line is broken. The warships crossed the stroke on the map and the trade of the world has no owner again. Whoever signed in Cusco no longer remembers signing.\n\nThe rivalry over Malacca comes back at 70, and each side has a war goal over the other's ports.
          spanish: La Línea se rompió. Los barcos de guerra cruzaron la raya del mapa y el comercio del mundo vuelve a no tener dueño. El que firmó en Cusco ya no se acuerda de la firma.\n\nLa rivalidad por Malaca vuelve a 70, y cada lado tiene un objetivo de guerra sobre los puertos del otro.
        options:
        - name: {english: Never again a line., spanish: Nunca más una raya.}
          effects: []
        src: user_request

