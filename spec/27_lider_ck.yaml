# =============================================================================
# El líder, más Crusader Kings (2026-11-01)
#
# Pedido del usuario: "Salud va del 0-100. Los demás del 0-20. Y cambia para
# todos los líderes, existentes y potenciales: cada líder tiene stats diferentes.
# Cambiar también los efectos de los eventos que modifican esta mecánica. Además,
# agregar en al menos 20% de eventos ya existentes efectos sobre estas stats.
# Cada ministro suma o resta alguna stat al líder."
#
# - MEGANATIONS_lider_detectar: cada mes mira quién gobierna; si cambió, pone
#   las stats de ese líder (Carisma, Astucia, Prestigio, Salud y cuánta Salud
#   pierde por año). Un líder que no es personaje del mod saca uno de 4 perfiles.
# - lider_ck.ministros: lo que suma o resta cada ministro mientras está en el
#   cargo (on_add / on_remove, tools/gen/emitters/characters.py).
# - lider_ck.eventos: cambios de stats en ~20% de los eventos visibles, una
#   entrada por opción (tools/gen/specload.py -> _lider_ck_eventos). Generado con
#   una regla por el nombre de la opción (reprimir: +Prestigio -Carisma;
#   negociar: +Astucia; fiestas: +Carisma -Salud...) y por lo que ya hace la
#   opción (estabilidad -> Carisma, apoyo a la guerra -> Prestigio).
# =============================================================================

