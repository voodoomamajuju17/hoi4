# =============================================================================
# 47_anarquias_finales.yaml — el final de cada anarquía (2026-11-20)
# =============================================================================
# Borrador aprobado: docs/borradores/2026-11-20_anarquias_finales.md ("Nueva Seleucia se forma. Eso
# te da color. Son Seleucid larpers. Guerra. Prefecto Ozyman + Хав'єр Свобода. 3 bombas, Desolador de
# cero. Lo demás perfecto todo."). Regla: nada de mecánicas nuevas para nadie.
#
# 1. Caudillos del Amazonas: el final se atrasa 6 meses y, cumplido, la selva queda en paz PARA SIEMPRE.
#    Antes solo firmaba la paz una vez y ponía una marca (ZWB_intocable) que nada revisaba: en los logs
#    el Reino del Sol le declaraba la guerra en 2102. Ahora: nadie le puede justificar ni ella a nadie,
#    sale de su facción, y si igual empieza una guerra con ella se firma la paz blanca (al declararla y
#    con un control semanal de respaldo).
# 2. Emiratos e Indostán: si los dos terminan su árbol, a los dos les aparece El Puente de Persia; el
#    primero que lo termina puede fundar Nueva Seleucia (el otro acepta, o guerra).
# =============================================================================

# --- 1. el Amazonas ----------------------------------------------------------
extend_focuses:
  ZWB_foco_7_the_jungle_closes_its_gates:
    days: 217
    reward_append:
    - {effect: leave_faction}
    - {effect: dynamic_modifier, id: ZWB_selva_cerrada}
  # 4. Eurasia: un año después de terminar su árbol, si sigue viva, la paranoia atómica
  ZWE_foco_7_the_eternal_horde:
    reward_append:
    - {effect: event, id: meganations_zwe_atomica.1, days: 365}
  # 2. al terminar el árbol, los dos vuelven a mirar el suyo (aparece El Puente de Persia)
  ZWM_foco_7_the_caliphate_of_the_sands:
    reward_append:
    - {effect: refresh_focus_tree}
    - effect: if
      when: {country_exists: ZWI}
      then: [{effect: scope, target: ZWI, effects: [{effect: refresh_focus_tree}]}]
  ZWI_foco_7_the_raj_of_a_thousand_kings:
    reward_append:
    - {effect: refresh_focus_tree}
    - effect: if
      when: {country_exists: ZWM}
      then: [{effect: scope, target: ZWM, effects: [{effect: refresh_focus_tree}]}]

add_branches:
  ZWM:
  - id: seleucia
    name: {english: The Bridge of Persia, spanish: El Puente de Persia}
    focuses:
    - id: ZWM_el_puente_de_persia
      name: {english: The Bridge of Persia, spanish: El Puente de Persia}
      desc:
        english: 'Seleucus once ruled from Babylon to the Indus, and the kings of India paid him in war elephants. The Hindustan warlords
          survived too. If we reach out first, the empire is ours to name.'
        spanish: 'Seleuco gobernó de Babilonia al Indo, y los reyes de la India le pagaron con elefantes de guerra. Los señores del
          Indostán también sobrevivieron. Si tendemos la mano primero, el imperio es nuestro para nombrarlo.'
      days: 70
      icon: GFX_goal_generic_national_unity
      prerequisites: [ZWM_foco_7_the_caliphate_of_the_sands]
      allow_branch_when:
        all:
        - {country_exists: ZWI}
        - country: {tag: ZWI, when: {focus: ZWI_foco_7_the_raj_of_a_thousand_kings}}
      available: {not_global_flag: MN_seleucia_puente}
      reward:
      - effect: if
        when: {not_global_flag: MN_seleucia_puente}
        then:
        - {effect: global_flag, value: MN_seleucia_puente}
        - {effect: flag, value: MN_seleucia_fundador}
        else:
        - {effect: add_political_power, value: 50}
  ZWI:
  - id: seleucia
    name: {english: The Bridge of Persia, spanish: El Puente de Persia}
    focuses:
    - id: ZWI_el_puente_de_persia
      name: {english: The Bridge of Persia, spanish: El Puente de Persia}
      desc:
        english: 'Chandragupta gave Seleucus five hundred elephants for a peace that lasted generations. The desert emirs survived too.
          If we reach out first, the empire is ours to name.'
        spanish: 'Chandragupta le dio a Seleuco quinientos elefantes por una paz que duró generaciones. Los emires del desierto también
          sobrevivieron. Si tendemos la mano primero, el imperio es nuestro para nombrarlo.'
      days: 70
      icon: GFX_goal_generic_national_unity
      prerequisites: [ZWI_foco_7_the_raj_of_a_thousand_kings]
      allow_branch_when:
        all:
        - {country_exists: ZWM}
        - country: {tag: ZWM, when: {focus: ZWM_foco_7_the_caliphate_of_the_sands}}
      available: {not_global_flag: MN_seleucia_puente}
      reward:
      - effect: if
        when: {not_global_flag: MN_seleucia_puente}
        then:
        - {effect: global_flag, value: MN_seleucia_puente}
        - {effect: flag, value: MN_seleucia_fundador}
        else:
        - {effect: add_political_power, value: 50}

cosmetic_tags:
- id: MN_NUEVA_SELEUCIA
  parent: ZWM
  name: {english: 'New Seleucia', spanish: 'Nueva Seleucia'}
  adjective: {english: 'Seleucid', spanish: 'seléucida'}
  art: 'deep royal purple field with a large golden anchor (the old Seleucid emblem) and a small golden war-elephant silhouette above it; a lower band split in desert ochre and monsoon green.'
  src: user_request

decisions:
  dynamic_modifiers:
  - id: ZWB_selva_cerrada
    country: ZWB
    name: {english: 'The Jungle Has Closed', spanish: 'La Selva se Cerró'}
    desc:
      english: 'Nobody can justify a war against the jungle, and the jungle wants war with nobody. Forever.'
      spanish: 'Nadie le puede justificar una guerra a la selva, y la selva no quiere guerra con nadie. Para siempre.'
    modifiers: {enemy_justify_war_goal_time: 1000, justify_war_goal_time: 1000}
  - id: MEGANATIONS_seleucia_elefantes
    country: null
    name: {english: 'The Elephants of Seleucus', spanish: 'Los Elefantes de Seleuco'}
    desc:
      english: 'Phalanx and elephant, desert and monsoon: those who never had water and those who have too much, under one diadem.'
      spanish: 'Falange y elefante, desierto y monzón: los que nunca tuvieron agua y los que tienen demasiada, bajo una misma diadema.'
    modifiers: {army_defence_factor: 0.1, army_attack_factor: 0.05, recruitable_population_factor: 0.2, stability_factor: 0.1}

  - {id: ZWE_mod_paranoia, country: ZWE, name: {english: 'The Atomic Paranoia', spanish: 'La Paranoia Atómica'},
     desc: {english: 'Everyone is an enemy until proven otherwise. Nobody is ever proven otherwise.', spanish: 'Todos son enemigos hasta que se demuestre lo contrario. Nunca se demuestra.'},
     modifiers: {stability_factor: 0.1, war_support_factor: 0.15}}
  - {id: ZWE_mod_espias, country: ZWE, name: {english: 'Everyone Is a Spy', spanish: 'Todos son Espías'},
     desc: {english: 'Denounce your neighbour.', spanish: 'Denunciá a tu vecino.'},
     modifiers: {political_power_gain: 0.15, stability_factor: 0.05}}
  - {id: ZWE_mod_leva_atomica, country: ZWE, name: {english: 'The Atomic Levy', spanish: 'La Leva Atómica'},
     desc: {english: 'Be many.', spanish: 'Sé muchos.'},
     modifiers: {recruitable_population_factor: 0.25}}
  - {id: ZWE_mod_bajo_tierra, country: ZWE, name: {english: 'Underground Factories', spanish: 'Fábricas Bajo Tierra'},
     desc: {english: 'Out of sight, out of the bombs.', spanish: 'Lejos de la vista, lejos de las bombas.'},
     modifiers: {industrial_capacity_factory: 0.1, production_speed_buildings_factor: 0.1}}
  - {id: ZWE_mod_culto_del_atomo, country: ZWE, name: {english: 'The Cult of the Atom', spanish: 'El Culto del Átomo'},
     desc: {english: 'The steppe has a new god, and it glows.', spanish: 'La estepa tiene un dios nuevo, y brilla.'},
     modifiers: {war_support_factor: 0.1, research_speed_factor: 0.05}}
  - {id: ZWE_mod_refugios, country: ZWE, name: {english: 'Shelter Cities', spanish: 'Ciudades Refugio'},
     desc: {english: 'A city under every city.', spanish: 'Una ciudad debajo de cada ciudad.'},
     modifiers: {army_defence_factor: 0.1, max_dig_in: 2}}
  - {id: ZWE_mod_primer_golpe, country: ZWE, name: {english: 'The First-Strike Doctrine', spanish: 'La Doctrina del Primer Golpe'},
     desc: {english: 'Whoever strikes second does not strike at all.', spanish: 'El que golpea segundo no golpea nunca.'},
     modifiers: {army_attack_factor: 0.1, justify_war_goal_time: -0.5, breakthrough_factor: 0.1}}
  - {id: ZWE_mod_horda_atomica, country: ZWE, name: {english: 'The Atomic Horde', spanish: 'La Horda Atómica'},
     desc: {english: 'The steppe marches west under a mushroom cloud.', spanish: 'La estepa marcha hacia el oeste bajo un hongo atómico.'},
     modifiers: {army_attack_factor: 0.1, recruitable_population_factor: 0.15, industrial_capacity_factory: 0.1, production_speed_buildings_factor: 0.1}}

  scripted_effects:
  - id: MN_formar_nueva_seleucia
    effects:
    - {effect: cosmetic_tag, value: MN_NUEVA_SELEUCIA}
    - {effect: dynamic_modifier, id: MEGANATIONS_seleucia_elefantes}
    - {effect: global_flag, value: MN_nueva_seleucia_fundada}
    - effect: if
      when: {not: {idea: ZWM_la_culminacion}}
      then: [{effect: add_ideas, value: ZWM_la_culminacion}]
    - effect: if
      when: {not: {idea: ZWI_la_culminacion}}
      then: [{effect: add_ideas, value: ZWI_la_culminacion}]
    - {effect: add_political_power, value: 100}
    - effect: if
      when: {original_tag: ZWM}
      then:
      - {effect: recruit, character: ZWM_sel_basileus}
      - {effect: promote, character: ZWM_sel_basileus}
      - {effect: recruit, character: ZWM_sel_strategos}
      - {effect: recruit, character: ZWM_sel_dioceta}
      else:
      - {effect: recruit, character: ZWI_sel_basileus}
      - {effect: promote, character: ZWI_sel_basileus}
      - {effect: recruit, character: ZWI_sel_strategos}
      - {effect: recruit, character: ZWI_sel_dioceta}

  categories:
  - id: MN_seleucia_category
    country: [ZWM, ZWI]
    icon_prefer: [generic_political_discourse, generic_army_support]
    name: {english: 'New Seleucia', spanish: 'Nueva Seleucia'}
    desc:
      english: 'The first of the two survivors to cross the Bridge of Persia can proclaim New Seleucia: one diadem from the Tigris to the Ganges.'
      spanish: 'El primero de los dos sobrevivientes que cruce el Puente de Persia puede proclamar Nueva Seleucia: una sola diadema del Tigris al Ganges.'
    visible: {flag: MN_seleucia_fundador}
    src: user_request
    decisions:
    - id: ZWM_fundar_nueva_seleucia
      name: {english: 'Proclaim New Seleucia', spanish: 'Proclamar Nueva Seleucia'}
      desc:
        english: 'We crown a Basileus and send the diadem to the Hindustan warlords. They join us, or we take them.'
        spanish: 'Coronamos a un Basileus y les mandamos la diadema a los señores del Indostán. Se suman, o los tomamos.'
      icon_prefer: [generic_political_discourse]
      cost: 100
      visible: {all: [{original_tag: ZWM}, {not_global_flag: MN_nueva_seleucia_fundada}]}
      available: {all: [{country_exists: ZWI}, {not: {war_with: ZWI}}]}
      effects:
      - {effect: event, id: meganations_seleucia.1, target: ZWI}
      - {effect: run, value: MN_formar_nueva_seleucia}
      ai: {factor: 100}
      src: user_request
    - id: ZWI_fundar_nueva_seleucia
      name: {english: 'Proclaim New Seleucia', spanish: 'Proclamar Nueva Seleucia'}
      desc:
        english: 'We crown a Basileus and send the diadem to the desert emirs. They join us, or we take them.'
        spanish: 'Coronamos a un Basileus y les mandamos la diadema a los emires del desierto. Se suman, o los tomamos.'
      icon_prefer: [generic_political_discourse]
      cost: 100
      visible: {all: [{original_tag: ZWI}, {not_global_flag: MN_nueva_seleucia_fundada}]}
      available: {all: [{country_exists: ZWM}, {not: {war_with: ZWM}}]}
      effects:
      - {effect: event, id: meganations_seleucia.2, target: ZWM}
      - {effect: run, value: MN_formar_nueva_seleucia}
      ai: {factor: 100}
      src: user_request

  on_actions:
  # 2026-11-22 ("adaptá este save para que tenga los nuevos generales"): los mandos de las anarquías
  # (03_leaders, rama cnzwn8) se reclutan en la historia, que solo corre al empezar una partida. En una
  # partida empezada antes, el primer pulso del mes los recluta una sola vez; en las nuevas el arranque
  # pone la marca y el pulso no hace nada.
  - id: MN_mandos_anarquias_arranque
    hook: on_startup
    effects:
    - effect: if
      when: {country_exists: ZWE}
      then: [{effect: scope, target: ZWE, effects: [{effect: flag, value: MN_mandos_anarquia}]}]
    - effect: if
      when: {country_exists: ZWI}
      then: [{effect: scope, target: ZWI, effects: [{effect: flag, value: MN_mandos_anarquia}]}]
    - effect: if
      when: {country_exists: ZWM}
      then: [{effect: scope, target: ZWM, effects: [{effect: flag, value: MN_mandos_anarquia}]}]
    - effect: if
      when: {country_exists: ZWB}
      then: [{effect: scope, target: ZWB, effects: [{effect: flag, value: MN_mandos_anarquia}]}]
    - effect: if
      when: {country_exists: ZAN}
      then: [{effect: scope, target: ZAN, effects: [{effect: flag, value: MN_mandos_anarquia}]}]
  - id: MN_mandos_anarquias_ZWE
    hook: on_monthly_ZWE
    effects:
    - effect: if
      when: {not_flag: MN_mandos_anarquia}
      then: [{effect: recruit, character: ZWE_mariscal_bulava}, {effect: recruit, character: ZWE_gen_zarubina}, {effect: recruit, character: ZWE_gen_tkachenko}, {effect: recruit, character: ZWE_gen_sokolov}, {effect: recruit, character: ZWE_gen_bekov}, {effect: flag, value: MN_mandos_anarquia}]
  - id: MN_mandos_anarquias_ZWI
    hook: on_monthly_ZWI
    effects:
    - effect: if
      when: {not_flag: MN_mandos_anarquia}
      then: [{effect: recruit, character: ZWI_mariscal_chauhan}, {effect: recruit, character: ZWI_gen_iyer}, {effect: recruit, character: ZWI_gen_gurung}, {effect: recruit, character: ZWI_gen_qureshi}, {effect: recruit, character: ZWI_gen_deshmukh}, {effect: flag, value: MN_mandos_anarquia}]
  - id: MN_mandos_anarquias_ZWM
    hook: on_monthly_ZWM
    effects:
    - effect: if
      when: {not_flag: MN_mandos_anarquia}
      then: [{effect: recruit, character: ZWM_mariscal_mazrui}, {effect: recruit, character: ZWM_gen_harbi}, {effect: recruit, character: ZWM_gen_kamali}, {effect: recruit, character: ZWM_gen_obeidi}, {effect: recruit, character: ZWM_gen_khoury}, {effect: flag, value: MN_mandos_anarquia}]
  - id: MN_mandos_anarquias_ZWB
    hook: on_monthly_ZWB
    effects:
    - effect: if
      when: {not_flag: MN_mandos_anarquia}
      then: [{effect: recruit, character: ZWB_mariscal_arruda}, {effect: recruit, character: ZWB_gen_munduruku}, {effect: recruit, character: ZWB_gen_bastos}, {effect: recruit, character: ZWB_gen_silveira}, {effect: recruit, character: ZWB_gen_tikuna}, {effect: flag, value: MN_mandos_anarquia}]
  - id: MN_mandos_anarquias_ZAN
    hook: on_monthly_ZAN
    effects:
    - effect: if
      when: {not_flag: MN_mandos_anarquia}
      then: [{effect: recruit, character: ZAN_mariscal_whitlock}, {effect: recruit, character: ZAN_gen_kuptana}, {effect: recruit, character: ZAN_gen_larsen}, {effect: recruit, character: ZAN_gen_valenzuela}, {effect: recruit, character: ZAN_gen_tzul}, {effect: recruit, character: ZAN_gen_sangare}, {effect: recruit, character: ZAN_gen_hnatiuk}, {effect: flag, value: MN_mandos_anarquia}]
  # el Amazonas: si igual empieza una guerra con la selva cerrada, paz blanca en el acto
  - id: ZWB_selva_cerrada_guerra
    hook: on_declare_war
    effects:
    - effect: if
      when: {all: [{country_exists: ZWB}, {country: {tag: ZWB, when: {flag: ZWB_intocable}}}]}
      then: [{effect: scope, target: ZWB, effects: [{effect: white_peace_back}]}]
  - id: ZWB_selva_cerrada_semanal
    hook: on_weekly_ZWB
    effects:
    - effect: if
      when: {all: [{flag: ZWB_intocable}, {at_war: true}]}
      then: [{effect: white_peace_back}, {effect: leave_faction}]

events:
  namespaces:
    meganations_zwe_atomica:
      country: ZWE
      events:
      - id: 1
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: 'The Ataman Goes Underground', spanish: 'El Atamán Baja al Búnker'}
        desc:
          english: 'A year has passed since the Horde was proclaimed, and nobody has managed to break it. The Ataman does not believe it.
            He believes the Commune hides a weapon, Rome hides a weapon, everyone hides a weapon. So will we: the old reactors of the
            plains still hum, and the steppe is going to learn the dirty fire of the earth.'
          spanish: 'Pasó un año desde que se proclamó la Horda, y nadie pudo quebrarla. El Atamán no se lo cree. Cree que la Comuna esconde
            un arma, que Roma esconde un arma, que todos esconden un arma. Nosotros también: los viejos reactores de la llanura todavía
            zumban, y la estepa va a aprender el fuego sucio de la tierra.'
        options:
        - name: {english: 'Trust no one. Build the fire.', spanish: 'No confiar en nadie. Construir el fuego.'}
          effects:
          - {effect: flag, value: ZWE_atomica}
          - {effect: recruit, character: ZWE_atom_min_kurchatova}
          - {effect: recruit, character: ZWE_atom_gen_sych}
          - {effect: focus_tree, value: meganations_zwe_atomica_focus}
        src: user_request
    meganations_seleucia:
      country: null
      events:
      - id: 1
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: 'The Diadem from the West', spanish: 'La Diadema del Oeste'}
        desc:
          english: 'The desert emirs have crowned a Basileus and call their realm New Seleucia. Their envoy brings us a diadem and a choice:
            join them, from the Tigris to the Ganges, or be taken.'
          spanish: 'Los emires del desierto coronaron a un Basileus y llaman a su reino Nueva Seleucia. Su enviado nos trae una diadema y
            una elección: sumarnos, del Tigris al Ganges, o ser tomados.'
        options:
        - name: {english: 'One diadem, one empire.', spanish: 'Una diadema, un imperio.'}
          effects: [{effect: scope, target: ZWM, effects: [{effect: annex, target: ZWI}]}]
          ai_chance: 100
        - name: {english: 'Hindustan bows to no one.', spanish: 'El Indostán no se arrodilla ante nadie.'}
          effects: [{effect: scope, target: ZWM, effects: [{effect: declare_war, target: ZWI, type: annex_everything}]}]
          ai_chance: 0
        src: user_request
      - id: 2
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: 'The Diadem from the East', spanish: 'La Diadema del Este'}
        desc:
          english: 'The Hindustan warlords have crowned a Basileus and call their realm New Seleucia. Their envoy rides in on an elephant
            with a diadem and a choice: join them, from the Ganges to the Tigris, or be taken.'
          spanish: 'Los señores del Indostán coronaron a un Basileus y llaman a su reino Nueva Seleucia. Su enviado llega en elefante con
            una diadema y una elección: sumarnos, del Ganges al Tigris, o ser tomados.'
        options:
        - name: {english: 'One diadem, one empire.', spanish: 'Una diadema, un imperio.'}
          effects: [{effect: scope, target: ZWI, effects: [{effect: annex, target: ZWM}]}]
          ai_chance: 100
        - name: {english: 'The sands bow to no one.', spanish: 'Las arenas no se arrodillan ante nadie.'}
          effects: [{effect: scope, target: ZWI, effects: [{effect: declare_war, target: ZWM, type: annex_everything}]}]
          ai_chance: 0
        src: user_request


# --- 4. Eurasia: la paranoia atómica (un año después de terminar su árbol) ----------------
focus_trees:
  trees:
    ZWE_ATOMICA:
      id: meganations_zwe_atomica_focus
      default: false
      shared: true
      src: user_request
      branches:
      - id: la_paranoia
        name:
          english: The Atomic Paranoia
          spanish: La Paranoia Atómica
        focuses:
        - id: ZWE_a_el_bunker_del_ataman
          name:
            english: The Ataman's Bunker
            spanish: El Búnker del Atamán
          desc:
            english: The Ataman moves into a bunker under Kharkiv and stops trusting anyone who lives above ground.
            spanish: El Atamán se muda a un búnker bajo Járkov y deja de confiar en cualquiera que viva arriba.
          days: 70
          icon: GFX_goal_generic_defence
          reward:
          - effect: dynamic_modifier
            id: ZWE_mod_paranoia
          - effect: add_political_power
            value: 50
        - id: ZWE_a_los_reactores_olvidados
          name:
            english: The Forgotten Reactors
            spanish: Los Reactores Olvidados
          desc:
            english: The old Soviet reactors on the plains still hum. Nobody remembers how to run them. We will learn.
            spanish: Los viejos reactores soviéticos de la llanura todavía zumban. Nadie se acuerda cómo manejarlos. Vamos
              a aprender.
          days: 70
          icon: GFX_goal_generic_secret_weapon
          reward:
          - effect: tech
            value: atomic_research
          - effect: tech
            value: nuclear_reactor
          - effect: build
            building: nuclear_reactor
            level: 1
            optional: true
          prerequisites:
          - ZWE_a_el_bunker_del_ataman
        - id: ZWE_a_uranio_de_los_urales
          name:
            english: Uranium of the Urals
            spanish: Uranio de los Urales
          desc:
            english: The mines of the east give metal, and something that glows.
            spanish: Las minas del este dan metal, y algo que brilla.
          days: 70
          icon: GFX_goal_generic_construct_infrastructure
          reward:
          - effect: add_resource
            resource: chromium
            amount: 24
          - effect: add_resource
            resource: tungsten
            amount: 16
          prerequisites:
          - ZWE_a_el_bunker_del_ataman
        - id: ZWE_a_todos_son_espias
          name:
            english: Everyone Is a Spy
            spanish: Todos son Espías
          desc:
            english: The Commune's agents, Rome's agents, the neighbour's agents. Everyone. Report them.
            spanish: Los agentes de la Comuna, los de Roma, los del vecino. Todos. Denuncialos.
          days: 70
          icon: GFX_goal_generic_political_pressure
          reward:
          - effect: dynamic_modifier
            id: ZWE_mod_espias
          prerequisites:
          - ZWE_a_los_reactores_olvidados
        - id: ZWE_a_leva_del_invierno_atomico
          name:
            english: The Levy of the Atomic Winter
            spanish: La Leva del Invierno Atómico
          desc:
            english: When the bomb falls, only the many survive. Be many.
            spanish: Cuando caiga la bomba, solo sobreviven los muchos. Sé muchos.
          days: 70
          icon: GFX_goal_generic_army_doctrines
          reward:
          - effect: add_manpower
            value: 400000
          - effect: dynamic_modifier
            id: ZWE_mod_leva_atomica
          prerequisites:
          - ZWE_a_uranio_de_los_urales
        - id: ZWE_a_fabricas_bajo_tierra
          name:
            english: Underground Factories
            spanish: Fábricas Bajo Tierra
          desc:
            english: If they cannot see the factory, they cannot bomb it.
            spanish: Si no ven la fábrica, no la pueden bombardear.
          days: 105
          icon: GFX_goal_generic_production
          reward:
          - effect: build
            building: arms_factory
            level: 3
          - effect: dynamic_modifier
            id: ZWE_mod_bajo_tierra
          prerequisites:
          - ZWE_a_todos_son_espias
        - id: ZWE_a_el_culto_del_atomo
          name:
            english: The Cult of the Atom
            spanish: El Culto del Átomo
          desc:
            english: Priests in lead robes bless the reactors. The steppe has a new god, and it glows.
            spanish: Sacerdotes con túnicas de plomo bendicen los reactores. La estepa tiene un dios nuevo, y brilla.
          days: 70
          icon: GFX_goal_generic_propaganda
          reward:
          - effect: add_war_support
            value: 0.15
          - effect: dynamic_modifier
            id: ZWE_mod_culto_del_atomo
          prerequisites:
          - ZWE_a_todos_son_espias
        - id: ZWE_a_los_desoladores
          name:
            english: The Desolators
            spanish: Los Desoladores
          desc:
            english: Volunteers in lead armour, carrying a cannon that poisons the ground. Where they pass, nothing grows
              for a hundred years.
            spanish: Voluntarios con armadura de plomo y un cañón que envenena la tierra. Por donde pasan, no crece nada en
              cien años.
          days: 105
          icon: GFX_goal_generic_secret_weapon
          reward:
          - effect: tech
            value: ZWE_desolador
          - effect: division_template
            name: Desoladores
            regiments:
            - desolador
            - desolador
            - desolador
            - desolador
            - infantry
            - infantry
          - effect: create_units
            template: Desoladores
            count: 3
          prerequisites:
          - ZWE_a_fabricas_bajo_tierra
        - id: ZWE_a_trenes_blindados_del_reactor
          name:
            english: Armoured Reactor Trains
            spanish: Trenes Blindados del Reactor
          desc:
            english: A reactor on rails powers a factory on rails.
            spanish: Un reactor sobre rieles alimenta una fábrica sobre rieles.
          days: 70
          icon: GFX_goal_generic_production
          reward:
          - effect: build
            building: industrial_complex
            level: 2
          - effect: build
            building: arms_factory
            level: 1
          prerequisites:
          - ZWE_a_fabricas_bajo_tierra
        - id: ZWE_a_el_primer_fuego
          name:
            english: The First Fire
            spanish: El Primer Fuego
          desc:
            english: The Commune hides the fire of the stars. We have the dirty fire of the earth, and it works.
            spanish: La Comuna esconde el fuego de las estrellas. Nosotros tenemos el fuego sucio de la tierra, y funciona.
          days: 140
          icon: GFX_goal_generic_secret_weapon
          reward:
          - effect: nukes
            value: 1
          prerequisites:
          - ZWE_a_los_desoladores
          - ZWE_a_el_culto_del_atomo
        - id: ZWE_a_ciudades_refugio
          name:
            english: Shelter Cities
            spanish: Ciudades Refugio
          desc:
            english: A city under every city.
            spanish: Una ciudad debajo de cada ciudad.
          days: 70
          icon: GFX_goal_generic_defence
          reward:
          - effect: fortify
            level: 2
          - effect: dynamic_modifier
            id: ZWE_mod_refugios
          prerequisites:
          - ZWE_a_el_culto_del_atomo
        - id: ZWE_a_doctrina_del_primer_golpe
          name:
            english: The First-Strike Doctrine
            spanish: La Doctrina del Primer Golpe
          desc:
            english: Whoever strikes second does not strike at all.
            spanish: El que golpea segundo no golpea nunca.
          days: 70
          icon: GFX_goal_generic_attack
          reward:
          - effect: dynamic_modifier
            id: ZWE_mod_primer_golpe
          - effect: flag
            value: ZWE_primer_golpe
          - effect: if
            when:
              country_exists: ASC
            then:
            - effect: wargoal
              target: ASC
              type: take_state
          - effect: if
            when:
              country_exists: ZAN
            then:
            - effect: wargoal
              target: ZAN
              type: take_state
          prerequisites:
          - ZWE_a_el_primer_fuego
        - id: ZWE_a_mas_uranio
          name:
            english: More Uranium
            spanish: Más Uranio
          desc:
            english: There is never enough.
            spanish: Nunca alcanza.
          days: 70
          icon: GFX_goal_generic_construct_infrastructure
          reward:
          - effect: add_resource
            resource: chromium
            amount: 16
          - effect: add_resource
            resource: steel
            amount: 24
          prerequisites:
          - ZWE_a_ciudades_refugio
        - id: ZWE_a_el_segundo_fuego
          name:
            english: The Second Fire
            spanish: El Segundo Fuego
          desc:
            english: Two more. Just in case.
            spanish: Dos más. Por las dudas.
          days: 140
          icon: GFX_goal_generic_secret_weapon
          reward:
          - effect: nukes
            value: 2
          prerequisites:
          - ZWE_a_doctrina_del_primer_golpe
          - ZWE_a_mas_uranio
        - id: ZWE_a_la_horda_atomica
          name:
            english: The Atomic Horde
            spanish: La Horda Atómica
          desc:
            english: The steppe marches west under a mushroom cloud.
            spanish: La estepa marcha hacia el oeste bajo un hongo atómico.
          days: 140
          icon: GFX_goal_generic_attack
          reward:
          - effect: dynamic_modifier
            id: ZWE_mod_horda_atomica
          prerequisites:
          - ZWE_a_el_segundo_fuego

