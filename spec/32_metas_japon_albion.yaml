# =============================================================================
# 32_metas_japon_albion.yaml — lo que persigue cada Casa de Japón y cada camino
# de Albión (2026-11-02)
# =============================================================================
# Pedido del usuario (2026-11-02, después de ver la propuesta): "baja el costo de
# giri a 35 para el Cybershogun y solo tené como requisito previo cumplir con el
# objetivo de su rama en particular. [...] Lo demás sí a todo." (Albión satélite
# con independencia propia quedó "en el tintero": no se hace por ahora.)
#
# Japón (el Shogunato no tiene camino del Shogun: son tres Casas):
#   - Todas: unir el archipiélago. Okinawa y Kitakyushu arrancan en manos de Corea.
#   - Zaibatsu: además, Corea entera (los diques del continente).
#   - Yakuza: además, Taiwán y Hong Kong (los puertos de noche).
#   - SRS: además, Taiwán y las Filipinas (las fábricas de chips y los voluntarios).
#   El primer foco de la Casa da los reclamos y los objetivos de guerra. El
#   CyberShogun ya no pide el último foco del camino: pide 35 de Giri y la meta de
#   su Casa cumplida. Después persigue Singapur y Malaca.
# Albión:
#   - Hacia el Futuro: la Red del Atlántico Norte (Islandia, Feroe, Groenlandia,
#     Terranova). Lo de la Comuna se pide (si es aliada, lo entrega por evento);
#     lo demás, por guerra.
#   - Hacia el Pasado: el Imperio por etapas. 1) el Mediterráneo y el Atlántico Sur;
#     2) la India; 3) donde nunca se pone el sol (Canadá, Australia, Nueva Zelanda,
#     Kenia, Nigeria y el Cabo).
#   - Quedarse Luditas: tercer camino, la Gran Rotura (Países Bajos, Bélgica y el
#     Ruhr, el corazón robótico de la Comuna).
# Regiones: listas de nombres (la primera que exista en el juego), `territory: TAG`
# (todo lo que TAG tenía al arrancar) o `core: TAG` (núcleo en el juego base).
# Un nombre que el juego no conoce queda anotado en el reporte.
# =============================================================================

# -----------------------------------------------------------------------------
# Regiones (anclas, para no repetir listas)
# -----------------------------------------------------------------------------
x_regiones:
  okinawa: &okinawa ["Okinawa", "Ryukyu"]
  kitakyushu: &kitakyushu ["Kitakyūshū", "Kitakyushu", "Kyushu", "Fukuoka"]
  taiwan: &taiwan ["Taiwan"]
  hong_kong: &hong_kong ["Hong Kong"]
  singapur: &singapur ["Singapore", "Straits Settlements"]
  johor: &johor ["Johor", "Unfederated Malay States"]
  penang: &penang ["Penang"]
  perak: &perak ["Perak"]
  islandia: &islandia ["Iceland"]
  feroe: &feroe ["Faroe Islands", "Faroes", "Faroe"]
  groenlandia: &groenlandia ["Greenland"]
  terranova: &terranova ["Newfoundland", "Newfoundland and Labrador"]
  gibraltar: &gibraltar ["Gibraltar"]
  malta: &malta ["Malta"]
  chipre: &chipre ["Cyprus"]
  suez: &suez ["Suez"]
  malvinas: &malvinas ["Falkland Islands", "Malvinas", "Islas Malvinas"]
  delhi: &delhi ["Delhi"]
  bombay: &bombay ["Bombay"]
  bengala: &bengala ["West Bengal", "Bengal"]
  madras: &madras ["Madras"]
  ontario: &ontario ["Southern Ontario", "Ontario"]
  quebec: &quebec ["Southern Quebec", "Quebec"]
  columbia: &columbia ["British Columbia"]
  nueva_gales: &nueva_gales ["New South Wales"]
  victoria: &victoria ["Victoria"]
  isla_norte: &isla_norte ["North Island", "New Zealand"]
  nairobi: &nairobi ["Nairobi"]
  lagos: &lagos ["Lagos", "Southern Nigeria", "Nigeria"]
  el_cabo: &el_cabo ["Cape", "Cape Province", "Western Cape"]
  ruhr: &ruhr ["Ruhr", "Westfalen", "Westphalia"]
  renania: &renania ["Rheinland", "Rhineland", "Rheinprovinz"]

# -----------------------------------------------------------------------------
# Focos que ya existían
# -----------------------------------------------------------------------------
extend_focuses:
  # --- Japón: el primer foco de cada Casa trae su meta -----------------------
  ZJP_zai_1:
    desc:
      english: 'Four industrial families take the seats of the council and put every Japanese on a payroll. Factories +20%, but recruitable
        population -30%, stability -15% and political power -20%: employees do not go to war.\nTHE GOAL OF THE HOUSE: the shipyards of the
        continent. Claims and war goals on all of Korea, Okinawa and Kitakyushu included. With them and 35 Giri, the CyberShogun.'
      spanish: 'Cuatro familias industriales ocupan las sillas del consejo y ponen a cada japonés en una nómina. Fábricas +20%, pero población
        reclutable -30%, estabilidad -15% y poder político -20%: los empleados no van a la guerra.\nLA META DE LA CASA: los diques del
        continente. Reclamos y objetivos de guerra sobre Corea entera, con Okinawa y Kitakyushu. Con eso y 35 de Giri, el CyberShogun.'
    reward_append:
    - {effect: claims, value: ZJP, states: [*okinawa, *kitakyushu, {territory: ZKR}]}
    - effect: wargoal_holders
      type: take_state
      ai_one_at_a_time: true
      ai_defer: true
      ai_key: zaibatsu
      ai_when: {all: [{focus: ZJP_zai_1}, {not: {focus: ZJP_cybershogun}}]}
      states: [*okinawa, *kitakyushu, {territory: ZKR}]
  ZJP_yak_1:
    desc:
      english: 'The clans that ran the ports for Singapore now run the country for the Shogun. Political power +30%, but stability -20%,
        factories -10% (protection money) and research -10%.\nTHE GOAL OF THE HOUSE: the night ports, from Kyushu to Hong Kong. Claims and
        war goals on Okinawa, Kitakyushu, Taiwan and Hong Kong. With them and 35 Giri, the CyberShogun.'
      spanish: 'Los clanes que manejaban los puertos para Singapur ahora manejan el país para el Shogun. Poder político +30%, pero estabilidad
        -20%, fábricas -10% (la protección se paga) e investigación -10%.\nLA META DE LA CASA: los puertos de noche, de Kyushu a Hong Kong.
        Reclamos y objetivos de guerra sobre Okinawa, Kitakyushu, Taiwán y Hong Kong. Con eso y 35 de Giri, el CyberShogun.'
    reward_append:
    - {effect: claims, value: ZJP, states: [*okinawa, *kitakyushu, *taiwan, *hong_kong]}
    - effect: wargoal_holders
      type: take_state
      ai_one_at_a_time: true
      ai_defer: true
      ai_key: yakuza
      ai_when: {all: [{focus: ZJP_yak_1}, {not: {focus: ZJP_cybershogun}}]}
      states: [*okinawa, *kitakyushu, *taiwan, *hong_kong]
  ZJP_srs_1:
    desc:
      english: 'To the public, SRS makes medicines; Doctor Akabane now advises the Shogun. Research +20% and one research slot, but the
        pharmacy pays volunteers for trials: fewer births, stability -10%, war support -15%.\nTHE GOAL OF THE HOUSE: chips and volunteers.
        Claims and war goals on Okinawa, Kitakyushu, the chip foundries of Taiwan and the Philippines. With them and 35 Giri, the CyberShogun.'
      spanish: 'Para el público, SRS fabrica medicamentos; el doctor Akabane ahora asesora al Shogun. Investigación +20% y un espacio de
        investigación, pero la farmacia les paga a voluntarios para sus ensayos: menos nacimientos, estabilidad -10%, apoyo a la guerra
        -15%.\nLA META DE LA CASA: chips y voluntarios. Reclamos y objetivos de guerra sobre Okinawa, Kitakyushu, las fundiciones de chips de
        Taiwán y las Filipinas. Con eso y 35 de Giri, el CyberShogun.'
    reward_append:
    - {effect: claims, value: ZJP, states: [*okinawa, *kitakyushu, *taiwan, {core: PHI}]}
    - effect: wargoal_holders
      type: take_state
      ai_one_at_a_time: true
      ai_defer: true
      ai_key: srs
      ai_when: {all: [{focus: ZJP_srs_1}, {not: {focus: ZJP_cybershogun}}]}
      states: [*okinawa, *kitakyushu, *taiwan, {core: PHI}]
  # --- El CyberShogun: 35 de Giri y la meta de la Casa, nada más -------------
  ZJP_cybershogun:
    prerequisites_any: null
    desc:
      english: 'The greatest Mecha ever built waits in dry dock number one of Yokosuka, as tall as a tower. Inside, instead of a pilot,
        a mind: that of the boss of our House, uploaded, multiplied and wired to every crane, warship and Mecha of the islands.
        Needs the goal of our House fulfilled and costs 35 Giri. The country takes the name of its new master, a new flag, and the boss
        becomes the CyberShogun. Then the Shogunate goes for the throat of the High Seas: Singapore and the Strait of Malacca.'
      spanish: 'El Mecha más grande jamás construido espera en el dique seco número uno de Yokosuka, alto como una torre. Adentro, en vez
        de un piloto, una mente: la del jefe de nuestra Casa, subida, multiplicada y conectada a cada grúa, cada buque y cada Mecha de las
        islas. Pide la meta de nuestra Casa cumplida y cuesta 35 de Giri. El país toma el nombre de su nuevo amo, bandera nueva, y el jefe
        se vuelve el CyberShogun. Después el Shogunato va por el cuello de la Alta Mar: Singapur y el estrecho de Malaca.'
    available:
      variable_at_least: {var: ZJP_giri, value: 35}
      all:
      - explained:
          id: ZJP_meta_de_la_casa
          english: The goal of our House is fulfilled (we control every region it asks for)
          spanish: La meta de nuestra Casa está cumplida (controlamos cada región que pide)
          when:
            any:
            - all:
              - {focus: ZJP_zai_1}
              - controls_all: [*okinawa, *kitakyushu, {territory: ZKR}]
            - all:
              - {focus: ZJP_yak_1}
              - controls_all: [*okinawa, *kitakyushu, *taiwan, *hong_kong]
            - all:
              - {focus: ZJP_srs_1}
              - controls_all: [*okinawa, *kitakyushu, *taiwan, {core: PHI}]
    reward:
    - {effect: add_variable, var: ZJP_giri, value: -35}
    - effect: if
      when: {focus: ZJP_zai_1}
      then:
      - {effect: cosmetic_tag, value: ZJP_CYBER_KANEMURA}
      - {effect: promote, character: ZJP_daisuke_kanemura}
    - effect: if
      when: {focus: ZJP_yak_1}
      then:
      - {effect: cosmetic_tag, value: ZJP_CYBER_SAKAGUCHI}
      - {effect: promote, character: ZJP_ryuji_sakaguchi}
    - effect: if
      when: {focus: ZJP_srs_1}
      then:
      - {effect: cosmetic_tag, value: ZJP_CYBER_AKABANE}
      - {effect: promote, character: ZJP_kenzo_akabane}
    - {effect: dynamic_modifier, id: ZJP_cybershogunato}
    - {effect: tech, value: advanced_heavy_tank_chassis}
    - {effect: event, id: meganations_japon.30, days: 1}
    # 2026-11-02: la meta del CyberShogun
    - {effect: flag, value: ZJP_estrechos_abiertos}
    - {effect: claims, value: ZJP, states: [*singapur, *johor, *penang, *perak]}
    - effect: wargoal_holders
      type: take_state
      ai_one_at_a_time: true
      ai_key: zz_cybershogun
      ai_when: {all: [{focus: ZJP_cybershogun}, {not_flag: ZJP_mar_del_shogun}]}
      states: [*singapur, *johor, *penang, *perak]
    ai: {factor: 50}

  # --- Albión: los dos caminos y el tercero ----------------------------------
  ZAL_hacia_el_futuro:
    mutually_exclusive_append: [ZAL_quedarse_luditas]
  ZAL_hacia_el_pasado:
    mutually_exclusive_append: [ZAL_quedarse_luditas]
  ZAL_los_cables_de_cornualles:
    reward_append:
    - {effect: flag, value: ZAL_red_del_norte_abierta}
    - {effect: claims, value: ZAL, states: [*islandia, *feroe, *groenlandia, *terranova]}
    - effect: wargoal_holders
      type: take_state
      ai_one_at_a_time: true
      ai_key: red
      ai_when: {all: [{flag: ZAL_red_del_norte_abierta}, {not_flag: ZAL_red_del_norte}]}
      states: [*islandia, *feroe, *groenlandia, *terranova]
  ZAL_el_imperio_neovictoriano:
    reward_append:
    - {effect: flag, value: ZAL_imperio_abierto}
    - {effect: claims, value: ZAL, states: [*gibraltar, *malta, *chipre, *suez, *malvinas]}
    - effect: wargoal_holders
      type: take_state
      ai_one_at_a_time: true
      ai_key: imperio_1
      ai_when: {all: [{flag: ZAL_imperio_abierto}, {not_flag: ZAL_imperio_etapa_1}]}
      states: [*gibraltar, *malta, *chipre, *suez, *malvinas]

# -----------------------------------------------------------------------------
# El tercer camino: Quedarse Luditas
# -----------------------------------------------------------------------------
add_branches:
  ZAL:
  - id: quedarse_luditas
    name: {english: 'Stay Luddite', spanish: 'Quedarse Luditas'}
    focuses:
    - id: ZAL_quedarse_luditas
      name: {english: Stay Luddite, spanish: Quedarse Luditas}
      days: 182
      icon: GFX_goal_generic_workers_rights
      mutually_exclusive: [ZAL_hacia_el_futuro, ZAL_hacia_el_pasado]
      desc:
        english: 'Not forwards, not backwards: Albion stays what it is. The looms keep working, the councils keep voting by a show of hands,
          and the hammers that broke the servers in 2086 are taken down from the walls. Across the water the Commune still runs half a
          continent with robots. That is the problem.'
        spanish: 'Ni para adelante ni para atrás: Albión se queda como es. Los telares siguen andando, los consejos siguen votando a mano
          alzada, y los martillos que rompieron los servidores en 2086 se bajan de las paredes. Del otro lado del agua la Comuna todavía
          maneja medio continente con robots. Ese es el problema.'
      reward:
      - {effect: flag, value: ZAL_quedarse_luditas}
      - {effect: add_stability, value: 0.05}
      - {effect: add_political_power, value: 75}
      ai: {factor: 1}
    - id: ZAL_la_constitucion_del_telar
      name: {english: The Constitution of the Loom, spanish: La Constitución del Telar}
      days: 119
      icon: GFX_goal_generic_national_unity
      prerequisites: [ZAL_quedarse_luditas]
      desc:
        english: 'One page, handwritten, nailed to the door of every town hall: no machine shall decide for a person. Everything else is
          open to debate, and is debated.'
        spanish: 'Una página, escrita a mano, clavada en la puerta de cada municipio: ninguna máquina decide por una persona. Todo lo demás
          se discute, y se discute.'
      reward:
      - {effect: dynamic_modifier, id: ZAL_constitucion_del_telar}
    - id: ZAL_las_brigadas_del_martillo
      name: {english: The Hammer Brigades, spanish: Las Brigadas del Martillo}
      days: 119
      icon: GFX_goal_generic_allies_build_infantry
      prerequisites: [ZAL_la_constitucion_del_telar]
      desc:
        english: 'Miners, weavers and dockers who already know how to break a machine. Now they learn to do it under fire. Three
          divisions.'
        spanish: 'Mineros, tejedores y estibadores que ya saben romper una máquina. Ahora aprenden a hacerlo bajo fuego. Tres
          divisiones.'
      reward:
      - effect: ensure_template
        name: Brigada del Martillo
        regiments: [infantry, infantry, infantry, infantry, infantry, infantry]
      - {effect: create_units, template: Brigada del Martillo, name: Martillo, count: 3, experience: 0.2}
      - {effect: army_experience, value: 25}
    - id: ZAL_los_saboteadores_del_canal
      name: {english: The Channel Saboteurs, spanish: Los Saboteadores del Canal}
      days: 119
      icon: GFX_goal_generic_intelligence_exchange
      prerequisites: [ZAL_las_brigadas_del_martillo]
      desc:
        english: 'Fishing boats that cross at night with sugar for the fuel tanks of the robots of Rotterdam. Opens the decisions of the
          Great Breaking.'
        spanish: 'Pesqueros que cruzan de noche con azúcar para los tanques de combustible de los robots de Rotterdam. Abre las decisiones
          de la Gran Rotura.'
      reward:
      - {effect: navy_experience, value: 10}   # 2026-11-07: experiencia en focos militares
      - {effect: flag, value: ZAL_rotura_abierta}
      - {effect: add_political_power, value: 50}
    - id: ZAL_los_fusiles_sin_circuitos
      name: {english: Rifles Without Circuits, spanish: Fusiles sin Circuitos}
      days: 119
      icon: GFX_goal_generic_small_arms
      prerequisites: [ZAL_los_saboteadores_del_canal]
      desc:
        english: 'A drone cannot jam what has no electronics. The village forges make bolts, sights and barrels the old way, and they
          never fail.'
        spanish: 'Un dron no puede interferir lo que no tiene electrónica. Las herrerías de los pueblos hacen cerrojos, miras y cañones a la
          vieja usanza, y nunca fallan.'
      reward:
      - {effect: army_experience, value: 10}   # 2026-11-07: experiencia en focos militares
      - {effect: dynamic_modifier, id: ZAL_fusiles_sin_circuitos}
    - id: ZAL_la_internacional_ludita
      name: {english: The Luddite International, spanish: La Internacional Ludita}
      days: 182
      icon: GFX_goal_generic_major_war
      prerequisites: [ZAL_los_fusiles_sin_circuitos]
      desc:
        english: 'In the Netherlands, in Flanders, in the Ruhr, there are workers who never asked to be replaced. Albion promises them
          their hands back. Claims and war goals on the Netherlands, Belgium and the Ruhr.'
        spanish: 'En los Países Bajos, en Flandes, en el Ruhr hay obreros que nunca pidieron que los reemplacen. Albión les promete
          devolverles las manos. Reclamos y objetivos de guerra sobre los Países Bajos, Bélgica y el Ruhr.'
      reward:
      - {effect: claims, value: ZAL, states: [{core: HOL}, {core: BEL}, *ruhr, *renania]}
      - effect: wargoal_holders
        type: take_state
        ai_one_at_a_time: true
        ai_key: rotura
        ai_when: {all: [{flag: ZAL_quedarse_luditas}, {not_flag: ZAL_gran_rotura}]}
        states: [{core: HOL}, {core: BEL}, *ruhr, *renania]
      - {effect: add_war_support, value: 0.1}
    - id: ZAL_la_gran_rotura
      name: {english: The Great Breaking, spanish: La Gran Rotura}
      days: 182
      icon: GFX_goal_generic_destroy_factory
      prerequisites: [ZAL_la_internacional_ludita]
      desc:
        english: 'Unlocks the decision to proclaim the Great Breaking. Requires controlling the Netherlands, Belgium, the Ruhr and the
          Rhineland: the robotic heart of the Commune, stopped by hand.'
        spanish: 'Destraba la decisión de proclamar la Gran Rotura. Pide controlar los Países Bajos, Bélgica, el Ruhr y Renania: el
          corazón robótico de la Comuna, parado a mano.'
      reward:
      - {effect: flag, value: ZAL_rotura_final_abierta}
      - {effect: add_political_power, value: 50}

# -----------------------------------------------------------------------------
# Decisiones
# -----------------------------------------------------------------------------
decisions:
  dynamic_modifiers:
  - id: ZJP_el_mar_del_shogun
    country: ZJP
    name: {english: The Sea of the Shogun, spanish: El Mar del Shogun}
    desc:
      english: Every ship that passes Malacca bows to Yokosuka now.
      spanish: Cada barco que pasa por Malaca ahora le hace una reverencia a Yokosuka.
    modifiers:
      industrial_capacity_dockyard: 0.2
      naval_damage_factor: 0.1
      production_speed_dockyard_factor: 0.15
      political_power_factor: 0.15
  - id: ZAL_red_del_atlantico_norte
    country: ZAL
    name: {english: The North Atlantic Network, spanish: La Red del Atlántico Norte}
    desc:
      english: Servers under the ice of Greenland, minds that think at the temperature of the sea.
      spanish: Servidores bajo el hielo de Groenlandia, mentes que piensan a la temperatura del mar.
    modifiers:
      research_speed_factor: 0.15
      stability_factor: 0.05
      encryption_factor: 0.25
      decryption_factor: 0.25
  - id: ZAL_imperio_mediterraneo
    country: ZAL
    name: {english: The Keys of the Seas, spanish: Las Llaves de los Mares}
    desc:
      english: Gibraltar, Malta, Suez and the Falklands. Every key is polished on Sundays.
      spanish: Gibraltar, Malta, Suez y las Malvinas. Cada llave se lustra los domingos.
    modifiers:
      naval_speed_factor: 0.1
      navy_org_factor: 0.1
      political_power_factor: 0.1
  - id: ZAL_joya_de_la_corona
    country: ZAL
    name: {english: The Jewel in the Crown, spanish: La Joya de la Corona}
    desc:
      english: Delhi celebrates a Durbar again, and the Queen watches it on a brass screen.
      spanish: Delhi vuelve a celebrar un Durbar, y la Reina lo mira en una pantalla de bronce.
    modifiers:
      industrial_capacity_factory: 0.1
      recruitable_population_factor: 0.25
      production_speed_buildings_factor: 0.1
  - id: ZAL_el_sol_no_se_pone
    country: ZAL
    name: {english: The Sun Never Sets, spanish: El Sol No Se Pone}
    desc:
      english: Somewhere in the Empire it is always five o'clock.
      spanish: En algún lugar del Imperio siempre son las cinco.
    modifiers:
      stability_factor: 0.15
      war_support_factor: 0.15
      army_org_factor: 0.1
      industrial_capacity_factory: 0.1
      industrial_capacity_dockyard: 0.1
  - id: ZAL_constitucion_del_telar
    country: ZAL
    name: {english: The Constitution of the Loom, spanish: La Constitución del Telar}
    desc:
      english: No machine decides for a person.
      spanish: Ninguna máquina decide por una persona.
    modifiers:
      stability_factor: 0.1
      political_power_factor: 0.1
      research_speed_factor: -0.05
  - id: ZAL_fusiles_sin_circuitos
    country: ZAL
    name: {english: Rifles Without Circuits, spanish: Fusiles sin Circuitos}
    desc:
      english: Nothing to jam, nothing to hack, nothing that breaks in the rain.
      spanish: Nada que interferir, nada que hackear, nada que se rompa con la lluvia.
    modifiers:
      army_defence_factor: 0.1
      army_org_factor: 0.1
      equipment_capture_factor: 0.1
  - id: ASC_sabotaje_ludita
    country: ASC
    name: {english: Sugar in the Tanks, spanish: Azúcar en los Tanques}
    desc:
      english: Somebody keeps pouring sugar into the fuel of the robots of Rotterdam.
      spanish: Alguien sigue echando azúcar en el combustible de los robots de Rotterdam.
    modifiers:
      industrial_capacity_factory: -0.1
      production_speed_buildings_factor: -0.1
  - id: ZAL_rotura_cumplida
    country: ZAL
    name: {english: The Great Breaking, spanish: La Gran Rotura}
    desc:
      english: The robots of the Ruhr stand still in the rain, and the workers walk back into the factories with their own hands.
      spanish: Los robots del Ruhr se quedan quietos bajo la lluvia, y los obreros vuelven a entrar a las fábricas con sus propias manos.
    modifiers:
      industrial_capacity_factory: 0.15
      stability_factor: 0.1
      war_support_factor: 0.1
      army_attack_factor: 0.1
  categories:
  # ---------------------------------------------------------------------------
  # Japón: la meta de la Casa y los estrechos
  # ---------------------------------------------------------------------------
  - id: ZJP_metas_category
    country: ZJP
    icon_prefer: [generic_formable_nations, generic_political_actions]
    name: {english: 'The Goal of the House', spanish: 'La Meta de la Casa'}
    desc:
      english: 'Every House wants something from the sea. The Zaibatsu, the shipyards of Korea; the Yakuza, the night ports from Kyushu to
        Hong Kong; SRS, the chips of Taiwan and the volunteers of the Philippines. All of them, first, the whole archipelago: Okinawa and
        Kitakyushu. With the goal fulfilled and 35 Giri, the CyberShogun wakes up, and then the Shogunate goes for Singapore and Malacca.'
      spanish: 'Cada Casa quiere algo del mar. Los Zaibatsu, los diques de Corea; la Yakuza, los puertos de noche de Kyushu a Hong Kong;
        SRS, los chips de Taiwán y los voluntarios de las Filipinas. Todas, primero, el archipiélago entero: Okinawa y Kitakyushu. Con la
