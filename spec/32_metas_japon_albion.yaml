# -----------------------------------------------------------------------------
# El líder (31_lider_japon_albion): cerca del 20% de los eventos de Japón y Albión
# mueve sus stats; los dos grandes finales dan Prestigio
# -----------------------------------------------------------------------------
lider_ck:
  eventos:
    meganations_japon.99:
    - prestigio: 2
    meganations_albion.105:
    - prestigio: 2

# -----------------------------------------------------------------------------
# Eventos
# -----------------------------------------------------------------------------
events:
  namespaces:
    meganations_japon:
      country: null
      events:
      - id: 99
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: 'The Sea of the Shogun', spanish: 'El Mar del Shogun'}
        desc:
          english: >-
            The first ship to cross the Strait of Malacca under the new flag is an old container carrier from Kobe. Its
            captain stops the engines off Singapore, the way his grandfather did for the High Seas, and waits for the
            pilot. The pilot who climbs aboard is a Mecha, eight metres tall, standing on a tug. It bows. The captain bows
            back, and no one on the bridge says a word until the lights of Johor are behind them.
          spanish: >-
            El primer barco que cruza el estrecho de Malaca con la bandera nueva es un portacontenedores viejo de Kobe. El
            capitán para las máquinas frente a Singapur, como hacía su abuelo para la Alta Mar, y espera al práctico. El
            práctico que sube a bordo es un Mecha de ocho metros, parado sobre un remolcador. Hace una reverencia. El
            capitán se la devuelve, y nadie en el puente dice una palabra hasta que las luces de Johor quedan atrás.
        options:
        - name: {english: 'The sea bows to Yokosuka.', spanish: 'El mar le hace una reverencia a Yokosuka.'}
          effects:
          - {effect: add_stability, value: 0.05}
          - {effect: add_variable, var: ZJP_giri, value: 15}
        src: user_request
    meganations_albion:
      country: null
      events:
      - id: 101
        trigger: effect
        picture: GFX_report_event_generic_sign_treaty1
        title: {english: 'Albion Asks for the North', spanish: 'Albión Pide el Norte'}
        desc:
          english: >-
            The delegation from London arrives in Hamburg with paper plans, which the planning algorithm finds touching.
            They want Iceland, the Faroes and Greenland: cold places for warm servers, they say, and cables under the sea
            to join the two networks. The algorithm has already calculated what Albion would do with them. It has not yet
            calculated whether it minds.
          spanish: >-
            La delegación de Londres llega a Hamburgo con planos en papel, cosa que al algoritmo de planificación le parece
            enternecedora. Quieren Islandia, las Feroe y Groenlandia: lugares fríos para servidores calientes, dicen, y
            cables bajo el mar para unir las dos redes. El algoritmo ya calculó qué haría Albión con ellas. Todavía no
            calculó si le molesta.
        options:
        - name: {english: 'Hand over the islands.', spanish: 'Entregar las islas.'}
          effects:
          - {effect: in_state, state: *islandia, effects: [{effect: if, when: {owned_by: ASC}, then: [{effect: transfer_to, value: ZAL}]}]}
          - {effect: in_state, state: *feroe, effects: [{effect: if, when: {owned_by: ASC}, then: [{effect: transfer_to, value: ZAL}]}]}
          - {effect: in_state, state: *groenlandia, effects: [{effect: if, when: {owned_by: ASC}, then: [{effect: transfer_to, value: ZAL}]}]}
          ai_chance:
            base: 20
            modifiers:
            - {factor: 4, when: {country: {tag: ZAL, when: {focus: ZAL_la_reconciliacion_con_la_comuna}}}}
            - {factor: 0.25, when: {at_war: true}}
        - name: {english: 'The network of Europe stays in Europe.', spanish: 'La red de Europa se queda en Europa.'}
          effects:
          - {effect: add_political_power, value: 25}
          ai_chance: 50
        src: user_request
      - id: 102
        trigger: effect
        picture: GFX_report_event_generic_research_lab
        title: {english: 'The Last Cable', spanish: 'El Último Cable'}
        desc:
          english: >-
            At 4:12 in the morning the cable ship Brunel drops the last splice off St. John's, and sixty million people in
            Albion feel, for one second, the cold of the North Atlantic, all at once. Some of them laugh. Speaker Imogen
            Harrow says "we" and, for the first time, means Reykjavík too.
          spanish: >-
            A las 4:12 de la mañana el buque cablero Brunel suelta el último empalme frente a St. John's, y sesenta millones
            de personas en Albión sienten, por un segundo, el frío del Atlántico Norte, todas a la vez. Algunas se ríen. La
            Portavoz Imogen Harrow dice "nosotros" y, por primera vez, también se refiere a Reikiavik.
        options:
        - name: {english: 'We think colder, and faster.', spanish: 'Pensamos más frío, y más rápido.'}
          effects:
          - {effect: add_variable, var: ZAL_sincronia, value: 10}
        src: user_request
      - id: 103
        trigger: effect
        picture: GFX_report_event_generic_navy
        title: {english: 'The Keys of the Seas', spanish: 'Las Llaves de los Mares'}
        desc:
          english: >-
            Victoria III receives the five keys on a velvet cushion: Gibraltar, Malta, Cyprus, Suez, Port Stanley. They are
            new keys, cast last week in Birmingham, because nobody knew where the old ones were. She holds them up to the
            cameras anyway, and the crowd on the Mall cheers as if they were the real ones. In a way, they are.
          spanish: >-
            Victoria III recibe las cinco llaves sobre un almohadón de terciopelo: Gibraltar, Malta, Chipre, Suez, Puerto
            Argentino. Son llaves nuevas, fundidas la semana pasada en Birmingham, porque nadie sabía dónde estaban las viejas.
            Igual las levanta para las cámaras, y la multitud del Mall festeja como si fueran las de verdad. En cierto modo,
            lo son.
        options:
        - name: {english: 'Next, the Jewel in the Crown.', spanish: 'Ahora, la Joya de la Corona.'}
          effects:
          - {effect: add_variable, var: ZAL_pompa, value: 15}
        src: user_request
      - id: 104
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: 'The Durbar of Delhi', spanish: 'El Durbar de Delhi'}
        desc:
          english: >-
            Three hundred elephants with brass armour, a regiment of redcoats with night-vision bearskins and a throne of
            teak under a canopy of solar glass. The Queen does not come: she appears on a screen four storeys high, and
            the crowd, which has seen warlords come and go for forty years, watches her with polite curiosity. The tea, at
            least, is excellent.
          spanish: >-
            Trescientos elefantes con armadura de bronce, un regimiento de casacas rojas con gorros de piel con visión
            nocturna y un trono de teca bajo un dosel de vidrio solar. La Reina no viene: aparece en una pantalla de cuatro
            pisos, y la multitud, que vio pasar señores de la guerra durante cuarenta años, la mira con curiosidad educada.
            El té, por lo menos, es excelente.
        options:
        - name: {english: 'The sun is rising in the East.', spanish: 'El sol sale por el Este.'}
          effects:
          - {effect: add_variable, var: ZAL_pompa, value: 15}
        src: user_request
      - id: 105
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: 'The Sun Never Sets', spanish: 'El Sol No Se Pone'}
        desc:
          english: >-
            At five o'clock in London it is five in the morning in Wellington, and the bells ring in both. The Ministry of
            the Empire has hired a man whose only job is to make sure that, somewhere under the Union, someone is always
            having tea. He has never had a day off. He does not want one.
          spanish: >-
            A las cinco de la tarde en Londres son las cinco de la mañana en Wellington, y las campanas suenan en las dos. El
            Ministerio del Imperio contrató a un hombre cuyo único trabajo es asegurarse de que, en algún lugar bajo la
            Unión, alguien siempre esté tomando el té. Nunca tuvo un día libre. No quiere tenerlo.
        options:
        - name: {english: 'Rule, Britannia.', spanish: 'Reina, Britannia.'}
          effects:
          - {effect: add_variable, var: ZAL_pompa, value: 30}
          - {effect: add_stability, value: 0.05}
        src: user_request
      - id: 106
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: 'The Great Breaking', spanish: 'La Gran Rotura'}
        desc:
          english: >-
            In Essen the assembly lines stop at noon, when the Albion sappers cut the last power line. Four thousand robots
            stand still in the rain in the yards of the old Krupp works. The workers who were sent home in 2079 come back
            the next morning, some with their grandchildren, and find the doors open. Nobody knows how to run the lines by
            hand any more. They start learning that afternoon.
          spanish: >-
            En Essen las líneas de montaje se paran al mediodía, cuando los zapadores de Albión cortan la última línea
            eléctrica. Cuatro mil robots se quedan quietos bajo la lluvia en los patios de la vieja Krupp. Los obreros que
            mandaron a sus casas en 2079 vuelven a la mañana siguiente, algunos con sus nietos, y encuentran las puertas
            abiertas. Ya nadie sabe manejar las líneas a mano. Empiezan a aprender esa misma tarde.
        options:
        - name: {english: 'By hand, then.', spanish: 'A mano, entonces.'}
          effects:
          - {effect: add_stability, value: 0.05}
          - {effect: add_political_power, value: 100}
        src: user_request
