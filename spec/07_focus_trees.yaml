# =============================================================================
# 07_focus_trees.yaml — Esqueleto de árboles de foco
# =============================================================================
# ADVERTENCIA DE PROCEDENCIA
#
# El documento NO contiene ningún árbol de foco. Ni uno. No hay nombres de
# focos, ni estructura, ni prerequisitos, ni recompensas.
#
# Lo único que existe en el doc que se parece a contenido de árbol son:
#   - los hitos biográficos de Aurelio IV (§3.3)
#   - los ejes de régimen del EFE (§3.2)
#   - los umbrales de BioSteel (§3.4)
#   - los dos satélites (§3.1)
#
# El esqueleto del EFE de abajo está construido SOBRE ESOS CUATRO ANCLAJES.
# Todo lo demás —títulos, ramas, costes, prerequisitos, recompensas— es
# INVENTADO por mí. Está marcado. Si el árbol no te cierra, se tira y se
# rehace: es solo spec, no hay output que reescribir.
#
# Los árboles de las otras siete potencias NO se esbozaron: sin territorio, sin
# líder y con la mecánica en "solo nombre", cualquier árbol sería ficción pura.
# =============================================================================

policy:
  efe_tree_status: approved_by_user   # Q031, 2026-09-23
  efe_tree_origin: skeleton_invented_over_canon_anchors
  other_trees_status: in_progress   # FCU v1 (2026-09-23)
  see: [Q031, Q032]

# =============================================================================
trees:

  EFE:
    id: efe_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23). Aurelio IV (La Dinastía Verde) contra Anahí Quiroga (El Monte se Levanta). Reemplaza el árbol de
      31 focos de la fase 3; se conservan ids, íconos y eventos donde sirven.'
    anchors_from_doc:
    - Golpe de 2079 / título Custodio de la Tierra (§3.3)
    - Proclamación imperial de 2081 (§3.3)
    - Milicias Verdes y Batalla de Iguazú (§3.3)
    - Reforestación obligatoria, control de población, autarquía (§3.2)
    - Tecnologías de agua, semillas y restauración como herramientas de poder exterior (§3.2)
    - BioSteel por umbrales 5/10/15 (§3.4)
    - Satélites Patagonia Austral y Yvytu Ykua Guasu (§3.1)
    branches:
    - id: dinastia_verde
      name: {english: The Green Dynasty, spanish: La Dinastía Verde}
      focuses:
      - id: EFE_custodio_de_la_tierra
        name: {english: Custodian of the Earth, spanish: Custodio de la Tierra}
        days: 35
        icon: GFX_goal_generic_political_pressure
        desc:
          english: The century turns. The Emperor who was once the Custodian surveys what the forest has given back, and what it still demands.
          spanish: Cambia el siglo. El Emperador que alguna vez fue el Custodio mira lo que el bosque devolvió, y lo que todavía reclama.
        reward:
        - {effect: add_political_power, value: 75}
      - id: EFE_la_hora_de_gaia
        name: {english: The Hour of Gaia, spanish: La Hora de Gaia}
        days: 35
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - EFE_custodio_de_la_tierra
        desc:
          english: The court wants continuity. The reserves want the forest to rule. The Empire has to decide who it belongs to.
          spanish: La corte quiere continuidad. Las reservas quieren que mande el monte. El Imperio tiene que decidir de quién es.
        reward:
        - {effect: add_political_power, value: 50}
      - id: EFE_el_mandato_renovado
        name: {english: The Mandate Renewed, spanish: El Mandato Renovado}
        days: 35
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - EFE_la_hora_de_gaia
        mutually_exclusive:
        - EFE_los_incendios_de_gaia
        ai:
          factor: 3
          modifiers:
          - factor: 0.3
            when: {stability_below: 0.4}
        desc:
          english: Aurelio IV renews the Green Mandate in front of the whole court. The rangers watch from the back of the hall.
          spanish: Aurelio IV renueva el Mandato Verde frente a toda la corte. Los guardaparques miran desde el fondo del salón.
        reward:
        - {effect: add_political_power, value: 75}
        - {effect: add_stability, value: 0.05}
      - id: EFE_la_corte_de_los_bosques
        name: {english: The Court of the Forests, spanish: La Corte de los Bosques}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - EFE_el_mandato_renovado
        desc:
          english: 'Ministers of Water, of Seed and of Silence. The court grows like a forest: slowly, and it blocks the light.'
          spanish: 'Ministros del Agua, de la Semilla y del Silencio. La corte crece como un bosque: despacio, y tapa la luz.'
        reward:
        - {effect: add_ideas, value: EFE_trono_del_bosque}
      - id: EFE_heredero_de_la_tierra
        name: {english: Heir of the Earth, spanish: Heredero de la Tierra}
        days: 56
        icon: GFX_EFE_reforest_patagonia
        icon_asset: assets/EFE/goals/EFE_reforest_patagonia.dds
        prerequisites:
        - EFE_la_corte_de_los_bosques
        desc:
          english: Aurelio names himself heir of the land itself. The vats work double shifts for the celebration.
          spanish: Aurelio se nombra heredero de la tierra misma. Las cubas trabajan doble turno para la celebración.
        reward:
        - {effect: leader_trait, value: efe_heredero_de_la_tierra}
        - {effect: add_variable, var: EFE_biosteel, value: 2}
      - id: EFE_las_misiones_guaranies
        name: {english: The Guaraní Missions, spanish: Las Misiones Guaraníes}
        days: 42
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - EFE_la_corte_de_los_bosques
        available: {country_exists: YYG}
        desc:
          english: Yvytu Ykua Guasu will be integrated, step by step, governor by governor. Opens the integration decisions.
          spanish: Yvytu Ykua Guasu va a ser integrada, paso a paso, gobernador por gobernador. Abre las decisiones de integración.
        reward:
        - {effect: flag, value: EFE_integracion_yyg_abierta}
        - {effect: add_political_power, value: 25}
      - id: EFE_integrar_la_patagonia
        name: {english: Integrate Southern Patagonia, spanish: Integrar la Patagonia Austral}
        days: 56
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - EFE_las_misiones_guaranies
        available: {country_exists: PTA}
        desc:
          english: Autonomy, then garrisons, then cores. The glaciers will be imperial. Opens the integration decisions.
          spanish: Autonomía, después guarniciones, después núcleos. Los glaciares van a ser imperiales. Abre las decisiones de integración.
        reward:
        - {effect: flag, value: EFE_integracion_pta_abierta}
        - {effect: add_political_power, value: 25}
      - id: EFE_la_gran_muralla_verde
        name: {english: The Great Green Wall, spanish: La Gran Muralla Verde}
        days: 42
        icon: GFX_goal_generic_defence
        prerequisites:
        - EFE_heredero_de_la_tierra
        desc:
          english: A belt of forest, bunkers and anti-air along the northern border.
          spanish: Un cinturón de bosque, búnkeres y antiaéreos sobre la frontera norte.
        reward:
        - {effect: add_ideas, value: EFE_muralla_verde}
      - id: EFE_guardian_del_acuifero
        name: {english: Guardian of the Aquifer, spanish: Guardián del Acuífero}
        days: 35
        icon: GFX_goal_generic_defence
        prerequisites:
        - EFE_la_gran_muralla_verde
        desc:
          english: The Guaraní Aquifer is guarded like a crown jewel. Castellane sends an envoy anyway.
          spanish: El Acuífero Guaraní se custodia como una joya de la corona. Castellane manda un enviado igual.
        reward:
        - {effect: add_ideas, value: EFE_defensa_acuifero}
      - id: EFE_el_agua_no_se_vende
        name: {english: The Water Is Not for Sale, spanish: El Agua no se Vende}
        days: 70
        icon: GFX_goal_generic_major_war
        prerequisites:
        - EFE_guardian_del_acuifero
        available: {country_exists: FCU, biosteel_tier: 2}
        ai:
          factor: 1
          modifiers:
          - factor: 0
            when: {at_war: true}
        desc:
          english: 'An ultimatum to the Union: renounce the aquifer and pay for the water already taken. War only if they refuse. Needs BioSteel
            tier 2.'
          spanish: 'Un ultimátum a la Unión: renunciar al acuífero y pagar el agua que ya se llevó. Guerra solo si se niega. Pide Bioacero nivel
            2.'
        reward:
        - {effect: event, id: meganations_fcu.7, days: 1, target: FCU}
        - {effect: add_war_support, value: 0.05}
      - id: EFE_la_corona_de_gaia
        name: {english: The Crown of Gaia, spanish: La Corona de Gaia}
        days: 56
        icon: GFX_EFE_reforest_patagonia
        icon_asset: assets/EFE/goals/EFE_reforest_patagonia.dds
        prerequisites:
        - EFE_el_agua_no_se_vende
        - EFE_integrar_la_patagonia
        desc:
          english: The Emperor and the Earth are one crown.
          spanish: El Emperador y la Tierra son una sola corona.
        reward:
        - {effect: swap_ideas, remove: EFE_trono_del_bosque, add: EFE_trono_eterno}
        - {effect: add_variable, var: EFE_biosteel, value: 3}
    - id: el_monte
      name: {english: The Forest Rises, spanish: El Monte se Levanta}
      focuses:
      - id: EFE_los_incendios_de_gaia
        name: {english: The Fires of Gaia, spanish: Los Incendios de Gaia}
        days: 21
        icon: GFX_goal_generic_propaganda
        prerequisites:
        - EFE_la_hora_de_gaia
        mutually_exclusive:
        - EFE_el_mandato_renovado
        ai:
          factor: 1
          modifiers:
          - factor: 4
            when: {stability_below: 0.4}
          - factor: 2
            when: {at_war: true}
        desc:
          english: 'The plantations burn and the reserves take sides. Opens the Forest decisions: when the rangers control enough, the coup is one
            focus away.'
          spanish: 'Arden las plantaciones y las reservas toman partido. Abre las decisiones del Monte: cuando los guardaparques controlen lo suficiente,
            el golpe está a un foco.'
        reward:
        - {effect: flag, value: EFE_crisis_del_monte}
        - {effect: timed_idea, idea: EFE_crisis_del_monte, days: 120}
        - {effect: run, value: EFE_recalcular_monte}
      - id: EFE_el_monte_se_levanta
        name: {english: The Forest Rises, spanish: El Monte se Levanta}
        days: 14
        icon: GFX_EFE_reforest_patagonia
        icon_asset: assets/EFE/goals/EFE_reforest_patagonia.dds
        prerequisites:
        - EFE_los_incendios_de_gaia
        available: {flag: EFE_monte_listo}
        desc:
          english: Needs the rangers' control of the reserves (60). Aurelio falls; Anahí Quiroga speaks for the forest.
          spanish: Pide el control de las reservas por los guardaparques (60). Cae Aurelio; Anahí Quiroga habla por el monte.
        reward:
        - {effect: promote, character: EFE_anahi_quiroga}
        - {effect: flag, value: EFE_monte_levantado}
        - {effect: swap_ideas, remove: EFE_mandato_verde, add: EFE_mandato_del_monte}
      - id: EFE_desurbanizar
        name: {english: Deurbanise, spanish: Desurbanizar}
        days: 35
        icon: GFX_goal_generic_propaganda
        prerequisites:
        - EFE_el_monte_se_levanta
        desc:
          english: The cities are emptied into the countryside. Fewer factories, more BioSteel.
          spanish: Las ciudades se vacían hacia el campo. Menos fábricas, más Bioacero.
        reward:
        - {effect: add_ideas, value: EFE_desurbanizacion}
        - {effect: add_variable, var: EFE_biosteel, value: 3}
        - {effect: add_manpower, value: 30000}
      - id: EFE_el_bosque_es_el_ejercito
        name: {english: The Forest Is the Army, spanish: El Bosque es el Ejército}
        days: 42
        icon: GFX_EFE_green_legions
        icon_asset: assets/EFE/goals/EFE_green_legions.dds
        prerequisites:
        - EFE_desurbanizar
        desc:
          english: Every ranger is a soldier and every tree is cover.
          spanish: Cada guardaparques es un soldado y cada árbol es una trinchera.
        reward:
        - {effect: add_ideas, value: EFE_bosque_armado}
      - id: EFE_arrasar_la_tierra
        name: {english: Scorched Earth, spanish: Tierra Arrasada}
        days: 35
        icon: GFX_goal_generic_defence
        prerequisites:
        - EFE_el_bosque_es_el_ejercito
        desc:
          english: Invaders will find nothing to eat, nothing to repair and nobody to rule.
          spanish: El invasor no va a encontrar nada que comer, nada que reparar y nadie a quien gobernar.
        reward:
        - {effect: add_ideas, value: EFE_tierra_arrasada}
      - id: EFE_sembrar_la_conquista
        name: {english: Sow the Conquest, spanish: Sembrar la Conquista}
        days: 56
        icon: GFX_EFE_reforest_patagonia
        icon_asset: assets/EFE/goals/EFE_reforest_patagonia.dds
        prerequisites:
        - EFE_desurbanizar
        desc:
          english: 'Conquered land is replanted: occupied, reforesting, ecological core. Opens the reforestation decisions.'
          spanish: 'La tierra conquistada se replanta: ocupada, en reforestación, núcleo ecológico. Abre las decisiones de reforestación.'
        reward:
        - {effect: add_variable, var: EFE_biosteel, value: 2}
        - {effect: add_political_power, value: 50}
      - id: EFE_que_avance_la_selva
        name: {english: The Jungle Advances, spanish: La Selva Avanza}
        days: 35
        icon: GFX_goal_generic_army_doctrines
        prerequisites:
        - EFE_arrasar_la_tierra
        - EFE_sembrar_la_conquista
        desc:
          english: 'The offensive moves at the speed of the forest: slowly, and it never goes back.'
          spanish: 'La ofensiva avanza a la velocidad del bosque: despacio, y nunca retrocede.'
        reward:
        - {effect: add_ideas, value: EFE_la_selva_avanza}
      - id: EFE_la_ofensiva_verde
        name: {english: The Green Offensive, spanish: La Ofensiva Verde}
        days: 70
        icon: GFX_goal_generic_major_war
        prerequisites:
        - EFE_que_avance_la_selva
        available: {country_exists: ZWB}
        desc:
          english: The Amazon warlords burn the forest to sell the land. The forest answers.
          spanish: Los Caudillos del Amazonas queman la selva para vender la tierra. La selva contesta.
        reward:
        - {effect: wargoal, target: ZWB, type: annex_everything}
        - {effect: add_war_support, value: 0.1}
      - id: EFE_un_continente_vivo
        name: {english: A Living Continent, spanish: Un Continente Vivo}
        days: 56
        icon: GFX_EFE_reforest_patagonia
        icon_asset: assets/EFE/goals/EFE_reforest_patagonia.dds
        prerequisites:
        - EFE_la_ofensiva_verde
        desc:
          english: Every reforested region is one more wall.
          spanish: Cada región reforestada es un muro más.
        reward:
        - {effect: add_ideas, value: EFE_continente_vivo}
    - id: autarquia
      name: {english: The BioSteel Autarky, spanish: La Autarquía del Bioacero}
      focuses:
      - id: EFE_ministerio_de_restauracion
        name: {english: Ministry of Restoration, spanish: Ministerio de la Restauración}
        days: 35
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
        - EFE_custodio_de_la_tierra
        desc:
          english: 'Two models for the Empire''s economy: close the borders and grow everything, or sell water to the world.'
          spanish: 'Dos modelos para la economía del Imperio: cerrar las fronteras y cultivarlo todo, o venderle agua al mundo.'
        reward:
        - {effect: build, building: industrial_complex, level: 1}
      - id: EFE_autarquia_del_bioacero
        name: {english: The BioSteel Autarky, spanish: La Autarquía del Bioacero}
        days: 42
        icon: GFX_EFE_biofuel_autarky
        icon_asset: assets/EFE/goals/EFE_biofuel_autarky.dds
        prerequisites:
        - EFE_ministerio_de_restauracion
        mutually_exclusive:
        - EFE_diplomacia_del_agua
        ai:
          factor: 1
          modifiers:
          - factor: 2
            when: {at_war: true}
        desc:
          english: Nothing comes in, nothing goes out. Opens the BioSteel projects.
          spanish: No entra nada, no sale nada. Abre los proyectos de Bioacero.
        reward:
        - {effect: add_ideas, value: EFE_autarquia_estrategica}
        - {effect: add_variable, var: EFE_biosteel, value: 1}
      - id: EFE_cubas_profundas
        name: {english: Deep Vats, spanish: Cubas Profundas}
        days: 35
        icon: GFX_goal_generic_production
        prerequisites:
        - EFE_autarquia_del_bioacero
        desc:
          english: The vats go underground, where the bombers cannot reach.
          spanish: Las cubas se van bajo tierra, donde no llegan los bombarderos.
        reward:
        - {effect: add_variable, var: EFE_biosteel, value: 2}
      - id: EFE_bosques_fabrica
        name: {english: Forest-Factories, spanish: Bosques-Fábrica}
        days: 35
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
        - EFE_autarquia_del_bioacero
        desc:
          english: Factories that grow where forests used to be.
          spanish: Fábricas que crecen donde había bosques.
        reward:
        - {effect: build, building: industrial_complex, level: 2}
      - id: EFE_economia_circular
        name: {english: The Circular Economy, spanish: La Economía Circular}
        days: 42
        icon: GFX_goal_generic_production
        prerequisites:
        - EFE_cubas_profundas
        - EFE_bosques_fabrica
        desc:
          english: Nothing is wasted. Everything returns to the vats.
          spanish: Nada se desperdicia. Todo vuelve a las cubas.
        reward:
        - {effect: add_variable, var: EFE_biosteel, value: 2}
        - {effect: add_political_power, value: 50}
      - id: EFE_la_autarquia_total
        name: {english: Total Autarky, spanish: La Autarquía Total}
        days: 56
        icon: GFX_EFE_biofuel_autarky
        icon_asset: assets/EFE/goals/EFE_biofuel_autarky.dds
        prerequisites:
        - EFE_economia_circular
        desc: {english: The Empire needs nobody., spanish: El Imperio no necesita a nadie.}
        reward:
        - {effect: swap_ideas, remove: EFE_autarquia_estrategica, add: EFE_autarquia_total}
    - id: diplomacia_agua
      name: {english: Water Diplomacy, spanish: La Diplomacia del Agua}
      focuses:
      - id: EFE_diplomacia_del_agua
        name: {english: Water Diplomacy, spanish: La Diplomacia del Agua}
        days: 42
        icon: GFX_goal_generic_trade
        prerequisites:
        - EFE_ministerio_de_restauracion
        mutually_exclusive:
        - EFE_autarquia_del_bioacero
        ai:
          factor: 1
          modifiers:
          - factor: 0.5
            when: {at_war: true}
        desc:
          english: The Guaraní Aquifer as an embassy. Opens the water contracts.
          spanish: El Acuífero Guaraní como embajada. Abre los contratos de agua.
        reward:
        - {effect: add_ideas, value: EFE_diplomacia_hidrica}
      - id: EFE_bancos_de_semillas
        name: {english: Seed Banks, spanish: Bancos de Semillas}
        days: 35
        icon: GFX_goal_generic_trade
        prerequisites:
        - EFE_diplomacia_del_agua
        desc:
          english: The Empire lends seeds to the hungry, on its own terms.
          spanish: El Imperio les presta semillas a los hambrientos, con sus condiciones.
        reward:
        - {effect: add_political_power, value: 50}
        - {effect: add_stability, value: 0.03}
      - id: EFE_tratados_de_agua
        name: {english: Water Treaties, spanish: Tratados de Agua}
        days: 35
        icon: GFX_goal_generic_trade
        prerequisites:
        - EFE_diplomacia_del_agua
        desc:
          english: Every treaty the Empire signs now has a water clause.
          spanish: Cada tratado que firma el Imperio ahora tiene una cláusula de agua.
        reward:
        - {effect: add_political_power, value: 75}
      - id: EFE_el_acuifero_como_embajada
        name: {english: The Aquifer as an Embassy, spanish: El Acuífero como Embajada}
        days: 42
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
        - EFE_bancos_de_semillas
        - EFE_tratados_de_agua
        desc:
          english: Foreign money builds the Empire's factories.
          spanish: La plata extranjera construye las fábricas del Imperio.
        reward:
        - {effect: build, building: industrial_complex, level: 2}
      - id: EFE_la_potencia_hidrica
        name: {english: The Water Power, spanish: La Potencia Hídrica}
        days: 56
        icon: GFX_goal_generic_trade
        prerequisites:
        - EFE_el_acuifero_como_embajada
        desc:
          english: Half the world's thirst passes through the Southern Cone.
          spanish: La mitad de la sed del mundo pasa por el Cono Sur.
        reward:
        - {effect: swap_ideas, remove: EFE_diplomacia_hidrica, add: EFE_potencia_hidrica}
    - id: cubas
      name: {english: The Pampa Vats, spanish: Las Cubas de la Pampa}
      focuses:
      - id: EFE_cubas_de_segunda_generacion
        name: {english: Second-Generation Vats, spanish: Cubas de Segunda Generación}
        days: 35
        icon: GFX_goal_generic_production
        prerequisites:
        - EFE_custodio_de_la_tierra
        desc: {english: 'Faster cultures, deeper vats.', spanish: 'Cultivos más rápidos, cubas más hondas.'}
        reward:
        - {effect: add_variable, var: EFE_biosteel, value: 2}
        - {effect: build, building: industrial_complex, level: 1}
      - id: EFE_biorrefinerias_de_rosario
        name: {english: The Rosario Biorefineries, spanish: Las Biorrefinerías de Rosario}
        days: 35
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
        - EFE_cubas_de_segunda_generacion
        desc:
          english: The Paraná's banks turn green and industrial.
          spanish: Las orillas del Paraná se vuelven verdes e industriales.
        reward:
        - {effect: build, building: industrial_complex, level: 2}
      - id: EFE_polo_industrial_de_gaia
        name: {english: The Gaia Industrial Pole, spanish: El Polo Industrial de Gaia}
        days: 42
        icon: GFX_goal_generic_construct_mil_factory
        prerequisites:
        - EFE_cubas_de_segunda_generacion
        desc: {english: Arms factories grown from BioSteel., spanish: Fábricas de armas crecidas de Bioacero.}
        reward:
        - {effect: build, building: arms_factory, level: 2}
      - id: EFE_energia_de_biomasa
        name: {english: Biomass Energy, spanish: Energía de Biomasa}
        days: 35
        icon: GFX_goal_generic_production
        prerequisites:
        - EFE_biorrefinerias_de_rosario
        - EFE_polo_industrial_de_gaia
