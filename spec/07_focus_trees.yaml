          factor: 1
          modifiers:
          - factor: 0
            when: {at_war: true}
        desc:
          english: 'An ultimatum to the Federation: join the continental plan. War only if they refuse.'
          spanish: 'Un ultimátum a la Federación: sumarse al plan continental. Guerra solo si se niega.'
        reward:
        - {effect: event, id: meganations_apf.1, target: APF}
        - {effect: add_war_support, value: 0.05}
