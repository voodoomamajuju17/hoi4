        icon: GFX_goal_generic_propaganda
        prerequisites:
        - SHD_ajuste_tecnico_n_1
        desc: {english: 'Every flow measured, including people.', spanish: 'Cada caudal medido, incluida la gente.'}
        reward:
        - {effect: add_ideas, value: SHD_vigilancia}
        - {effect: add_variable, var: SHD_orden, value: 5}
        - {effect: run, value: SHD_recalcular_caudales}
      - id: SHD_el_protectorado_coreano
        name: {english: The Korean Protectorate, spanish: El Protectorado Coreano}
        days: 42
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - SHD_los_ingenieros_del_orden
        available: {country_exists: ZKR}
