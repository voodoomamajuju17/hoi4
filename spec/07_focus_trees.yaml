          - factor: 0.3
            when: {stability_below: 0.4}
        desc:
          english: Kofi Aldana keeps the ledger, and the ledger keeps the peace.
          spanish: Kofi Aldana lleva el libro, y el libro mantiene la paz.
        reward:
        - {effect: add_political_power, value: 75}
        - {effect: add_stability, value: 0.05}
      - id: HSN_neutralidad_armada
