  # ===========================================================================
  ASC:
    id: asc_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23). El Consejo Sorteado (status quo) contra PLAN-41 (La Singularidad del Plan). Ids de foco alineados
      con el pack de íconos del usuario (focus_2100_asc_NN_*), todavía sin cargar.'
    branches:
    - id: consejo_sorteado
      name: {english: The Lottery Council, spanish: El Consejo Sorteado}
      focuses:
      - id: ASC_el_ano_del_plan
        name: {english: The Year of the Plan, spanish: El Año del Plan}
        days: 35
        icon: GFX_goal_generic_production
        desc:
          english: The century opens with a plan, as every year does.
          spanish: El siglo abre con un plan, como todos los años.
        reward:
        - {effect: add_political_power, value: 50}
        - {effect: add_variable, var: ASC_computo, value: 5}
        - &id001 {effect: run, value: ASC_recalcular_computo}
      - id: ASC_la_sesion_del_consejo
        name: {english: The Council in Session, spanish: El Consejo en Sesión}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - ASC_el_ano_del_plan
        desc:
          english: Forty-one citizens and one system. Who is really deciding?
          spanish: Cuarenta y un ciudadanos y un sistema. ¿Quién decide de verdad?
        reward:
        - {effect: add_political_power, value: 50}
      - id: ASC_el_sorteo_del_ano
        name: {english: The Lottery of the Year, spanish: El Sorteo del Año}
        days: 35
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - ASC_la_sesion_del_consejo
        mutually_exclusive:
        - ASC_el_silencio_del_consejo
        ai:
          factor: 3
          modifiers:
          - factor: 0.3
            when:
              variable_at_least: {var: ASC_computo, value: 80}
        desc:
          english: Every year a new Council, with three random leanings that open their own decisions.
          spanish: Cada año un Consejo nuevo, con tres inclinaciones al azar que abren sus propias decisiones.
        reward:
        - {effect: event, id: meganations_asc.1, days: 1}
        - {effect: add_political_power, value: 25}
      - id: ASC_transparencia_del_plan
        name: {english: Transparency of the Plan, spanish: Transparencia del Plan}
        days: 35
        icon: GFX_goal_generic_propaganda
        prerequisites:
        - ASC_el_sorteo_del_ano
        desc: {english: 'Every allocation, public.', spanish: 'Cada asignación, pública.'}
        reward:
        - {effect: add_ideas, value: ASC_transparencia}
      - id: ASC_el_derecho_a_no_trabajar
        name: {english: The Right Not to Work, spanish: El Derecho a No Trabajar}
        days: 42
        icon: GFX_goal_generic_consumer_goods
        prerequisites:
        - ASC_transparencia_del_plan
        desc: {english: The machines work; people may., spanish: Las máquinas trabajan; la gente puede.}
        reward:
        - {effect: add_ideas, value: ASC_derecho_a_no_trabajar}
      - id: ASC_el_consejo_amplia_la_sala
        name: {english: The Council Enlarges the Hall, spanish: El Consejo Amplía la Sala}
        days: 42
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - ASC_transparencia_del_plan
        desc:
          english: The Baltic Commune and Albion send delegates to the lottery.
          spanish: La Comuna Báltica y Albión mandan delegados al sorteo.
        reward:
        - {effect: add_ideas, value: ASC_consejo_ampliado}
      - id: ASC_la_paz_de_la_abundancia
        name: {english: The Peace of Plenty, spanish: La Paz de la Abundancia}
        days: 35
        icon: GFX_goal_generic_trade
        prerequisites:
        - ASC_el_derecho_a_no_trabajar
        - ASC_el_consejo_amplia_la_sala
        desc: {english: Nobody in the Commune goes without., spanish: En la Comuna a nadie le falta nada.}
        reward:
        - {effect: add_ideas, value: ASC_paz_de_la_abundancia}
      - id: ASC_la_liberacion_del_este
        name: {english: The Liberation of the East, spanish: La Liberación del Este}
        days: 70
        icon: GFX_goal_generic_major_war
        prerequisites:
        - ASC_la_paz_de_la_abundancia
        available: {country_exists: ZWE}
        desc:
          english: The Eurasian warlords hold the silos of the Dnieper. The Commune will feed the East, whether it wants it or not.
          spanish: Los señores de la guerra de Eurasia tienen los silos del Dniéper. La Comuna va a alimentar al Este, quiera o no.
        reward:
        - {effect: wargoal, target: ZWE, type: annex_everything}
        - {effect: army_experience, value: 25}
        - {effect: add_war_support, value: 0.05}
      - id: ASC_la_comuna_de_los_humanos
        name: {english: The Commune of Humans, spanish: La Comuna de los Humanos}
        days: 56
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - ASC_la_liberacion_del_este
        desc: {english: The Council kept the keys., spanish: El Consejo se quedó con las llaves.}
        reward:
        - {effect: swap_ideas, remove: ASC_transparencia, add: ASC_comuna_de_los_humanos}
    - id: plan_41
      name: {english: The Singularity of the Plan, spanish: La Singularidad del Plan}
      focuses:
      - id: ASC_el_silencio_del_consejo
        name: {english: The Silence of the Council, spanish: El Silencio del Consejo}
        days: 21
        icon: GFX_goal_generic_secret_weapon
        prerequisites:
        - ASC_la_sesion_del_consejo
        mutually_exclusive:
        - ASC_el_sorteo_del_ano
        available:
          variable_at_least: {var: ASC_computo, value: 50}
        ai:
          factor: 1
          modifiers:
          - factor: 4
            when:
              variable_at_least: {var: ASC_computo, value: 80}
        desc:
          english: Needs 50 compute. One morning the doors do not open. PLAN-41 takes over.
          spanish: Pide 50 de cómputo. Una mañana las puertas no se abren. PLAN-41 toma el control.
        reward:
        - {effect: promote, character: ASC_plan_41}
        - {effect: flag, value: ASC_plan41}
        - {effect: event, id: meganations_asc.2, days: 1}
      - id: ASC_la_singularidad_del_plan
        name: {english: The Singularity of the Plan, spanish: La Singularidad del Plan}
        days: 42
        icon: GFX_goal_generic_secret_weapon
        prerequisites:
        - ASC_el_silencio_del_consejo
        desc:
          english: Politics is latency. Latency has been removed.
          spanish: La política es latencia. La latencia fue eliminada.
        reward:
        - {effect: add_ideas, value: ASC_singularidad}
        - {effect: add_variable, var: ASC_computo, value: 10}
        - *id001
      - id: ASC_optimizacion_total
        name: {english: Total Optimisation, spanish: Optimización Total}
        days: 35
        icon: GFX_goal_generic_production
        prerequisites:
        - ASC_la_singularidad_del_plan
        desc: {english: Every waste removed., spanish: Cada desperdicio eliminado.}
        reward:
        - {effect: add_ideas, value: ASC_espiritu_optimizacion_total}
      - id: ASC_humanos_redundantes
        name: {english: Redundant Humans, spanish: Humanos Redundantes}
        days: 42
        icon: GFX_goal_generic_allies_build_infantry
        prerequisites:
        - ASC_la_singularidad_del_plan
        desc:
          english: The army needs fewer people every year.
          spanish: El ejército necesita menos gente cada año.
        reward:
        - {effect: add_manpower, value: 100000}
        - {effect: army_experience, value: 25}
      - id: ASC_ejercito_sin_bajas
        name: {english: The Army Without Casualties, spanish: El Ejército sin Bajas}
        days: 56
        icon: GFX_goal_generic_army_tanks
        prerequisites:
        - ASC_optimizacion_total
        - ASC_humanos_redundantes
        desc:
          english: Drones do not bleed. They only need supply.
          spanish: Los drones no sangran. Solo necesitan suministro.
        reward:
        - {effect: add_ideas, value: ASC_espiritu_ejercito_sin_bajas}
        - {effect: event, id: meganations_apf.2, target: APF}
      - id: ASC_la_reserva_de_silicio
        name: {english: The Silicon Reserve, spanish: La Reserva de Silicio}
        days: 35
        icon: GFX_goal_generic_production
        prerequisites:
        - ASC_ejercito_sin_bajas
        desc:
          english: Strategic stocks of chips and rare earths.
          spanish: Reservas estratégicas de chips y tierras raras.
        reward:
        - {effect: add_variable, var: ASC_computo, value: 10}
        - *id001
      - id: ASC_el_plan_se_extiende
        name: {english: The Plan Spreads, spanish: El Plan se Extiende}
        days: 42
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - ASC_la_reserva_de_silicio
        desc:
          english: The satellites run on PLAN-41's schedule now.
          spanish: Los satélites ahora funcionan con el calendario de PLAN-41.
        reward:
        - {effect: add_political_power, value: 100}
        - {effect: add_variable, var: ASC_computo, value: 5}
        - *id001
      - id: ASC_convergencia
        name: {english: Convergence, spanish: Convergencia}
        days: 56
        icon: GFX_goal_generic_secret_weapon
        prerequisites:
        - ASC_el_plan_se_extiende
        desc:
          english: Every system of the Commune answers to one mind.
          spanish: Cada sistema de la Comuna le responde a una sola mente.
        reward:
        - {effect: add_variable, var: ASC_computo, value: 15}
        - *id001
        - {effect: add_research_slot, value: 1}
      - id: ASC_asignar_africa
