  # ===========================================================================
  NRE:
    id: nre_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23), tabla de premios nueva. El Principado (Varro) contra el Año de los Cuatro Imperatores (Arbogast).
      Legiones con prestigio y Auctoritas Militaris. Ids alineados con el pack de íconos.'
    branches:
    - id: principado
      name: {english: The Principate, spanish: El Principado}
      focuses:
      - id: NRE_la_aclamacion_confirmada
        name: {english: The Acclamation Confirmed, spanish: La Aclamación Confirmada}
        days: 35
        icon: GFX_goal_generic_national_unity
        desc:
          english: The legions made Varro Imperator. Now the Senate must confirm it.
          spanish: Las legiones hicieron Imperator a Varro. Ahora el Senado tiene que confirmarlo.
        reward:
        - {effect: add_political_power, value: 100}
        - {effect: add_variable, var: NRE_auctoritas, value: 5}
        - {effect: run, value: NRE_recalcular_legiones}
      - id: NRE_el_consilium
        name: {english: The Consilium, spanish: El Consilium}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - NRE_la_aclamacion_confirmada
        desc:
          english: 'Senate or legions: whoever sits closer to the Imperator rules Rome.'
          spanish: 'Senado o legiones: el que se sienta más cerca del Imperator gobierna Roma.'
        reward:
        - {effect: add_political_power, value: 50}
        - {effect: add_stability, value: 0.03}
      - id: NRE_el_senado_restaurado
        name: {english: The Senate Restored, spanish: El Senado Restaurado}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - NRE_el_consilium
        mutually_exclusive:
        - NRE_la_legion_decide
        ai:
          factor: 3
          modifiers:
          - factor: 0.3
            when:
              any:
              - variable_at_least: {var: NRE_prestigio_italica, value: 80}
              - variable_at_least: {var: NRE_prestigio_macedonica, value: 80}
              - variable_at_least: {var: NRE_prestigio_fulminata, value: 80}
          - factor: 0.5
            when: {stability_below: 0.4}
        desc:
          english: Varro reopens the Curia. Politics becomes cheaper, and slower.
          spanish: Varro reabre la Curia. La política se vuelve más barata, y más lenta.
        reward:
        - {effect: add_ideas, value: NRE_senado}
        - {effect: flag, value: NRE_principado}
      - id: NRE_las_vias_imperiales
        name: {english: The Imperial Roads, spanish: Las Vías Imperiales}
        days: 42
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
        - NRE_el_senado_restaurado
        desc:
          english: All roads lead to Rome again. Opens road building.
          spanish: Todos los caminos vuelven a llevar a Roma. Abre la construcción de vías.
        reward:
        - effect: states
          pick: random
          effects:
          - {effect: build_here, building: infrastructure, level: 2}
        - effect: states
          pick: random
          effects:
          - {effect: build_here, building: infrastructure, level: 2}
        - {effect: add_political_power, value: 50}
      - id: NRE_el_cursus_honorum
        name: {english: The Cursus Honorum, spanish: El Cursus Honorum}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - NRE_el_senado_restaurado
        desc: {english: A career open to anyone who served., spanish: Una carrera abierta a quien haya servido.}
        reward:
        - {effect: add_ideas, value: NRE_cursus_honorum}
      - id: NRE_hispania_provincia
        name: {english: Hispania Provincia, spanish: Hispania Provincia}
        days: 42
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - NRE_las_vias_imperiales
        available: {country_exists: ZHI}
        desc:
          english: Opens the provincialisation of Hispania in three stages.
          spanish: Abre la provincialización de Hispania en tres etapas.
        reward:
