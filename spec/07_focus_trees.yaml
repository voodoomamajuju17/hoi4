  # ===========================================================================
  NAS:
    id: nas_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23), con la tabla de premios nueva. La Corte del Sol contra El Tawantinsuyu Renace. Qhapaq Ñan + Inti-Soma.
      Ids alineados con el pack de íconos.'
    branches:
    - id: corte_del_sol
      name: {english: The Court of the Sun, spanish: La Corte del Sol}
      focuses:
      - id: NAS_el_sol_de_2100
        name: {english: The Sun of 2100, spanish: El Sol de 2100}
        days: 35
        icon: GFX_goal_generic_national_unity
        desc:
          english: The Sun rose again over Cusco after the Ash Winter. It must not set.
          spanish: El Sol volvió a salir sobre Cusco después del Invierno de Ceniza. No tiene que ponerse.
        reward:
        - {effect: add_political_power, value: 100}
      - id: NAS_el_consejo_de_cusco
        name: {english: The Council of Cusco, spanish: El Consejo de Cusco}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - NAS_el_sol_de_2100
        desc:
          english: The priests want the mountains; the young Sapa Inti looks down the valleys.
          spanish: Los sacerdotes quieren las montañas; el joven Sapa Inti mira hacia los valles.
        reward:
        - {effect: add_political_power, value: 50}
        - {effect: add_stability, value: 0.03}
