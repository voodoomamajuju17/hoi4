          english: Opens the integration of Korea in three stages.
          spanish: Abre la integración de Corea en tres etapas.
        reward:
        - {effect: flag, value: SHD_integracion_zkr_abierta}
        - {effect: add_political_power, value: 50}
      - id: SHD_la_estepa_irrigada
        name: {english: The Irrigated Steppe, spanish: La Estepa Irrigada}
