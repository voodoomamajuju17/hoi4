# =============================================================================
technical_notes:
  - id: TN008
    text: >
      Un focus tree necesita al menos un foco sin prerequisitos o el árbol
      queda inaccesible. Acá ese rol lo cumple EFE_custodio_de_la_tierra.
    enforce_in_generator: true

  - id: TN009
    text: >
      Todo foco necesita `icon`. HOI4 acepta iconos vanilla
      (GFX_focus_generic_*) para no depender de arte propio. Para la Fase 3 voy
      a usar iconos genéricos vanilla, no placeholders custom: un icono vanilla
      carga seguro, un .dds mal generado no. Ver Q034.

  - id: TN010
    text: >
      Cada foco necesita clave de localisation `<id>` y `<id>_desc`.
      Con 16 focos en el EFE son 32 claves x 2 idiomas = 64 entradas.
      El generador las emite junto con el árbol, en el mismo commit.
    enforce_in_generator: true
