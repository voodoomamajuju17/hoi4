# =============================================================================
# 07_focus_trees.yaml — Esqueleto de árboles de foco
# =============================================================================
# ADVERTENCIA DE PROCEDENCIA
#
# El documento NO contiene ningún árbol de foco. Ni uno. No hay nombres de
# focos, ni estructura, ni prerequisitos, ni recompensas.
#
# Lo único que existe en el doc que se parece a contenido de árbol son:
#   - los hitos biográficos de Aurelio IV (§3.3)
#   - los ejes de régimen del EFE (§3.2)
#   - los umbrales de BioSteel (§3.4)
#   - los dos satélites (§3.1)
#
# El esqueleto del EFE de abajo está construido SOBRE ESOS CUATRO ANCLAJES.
# Todo lo demás —títulos, ramas, costes, prerequisitos, recompensas— es
# INVENTADO por mí. Está marcado. Si el árbol no te cierra, se tira y se
# rehace: es solo spec, no hay output que reescribir.
#
# Los árboles de las otras siete potencias NO se esbozaron: sin territorio, sin
# líder y con la mecánica en "solo nombre", cualquier árbol sería ficción pura.
# =============================================================================

policy:
  efe_tree_status: approved_by_user   # Q031, 2026-09-23
  efe_tree_origin: skeleton_invented_over_canon_anchors
  other_trees_status: in_progress   # FCU v1 (2026-09-23)
  see: [Q031, Q032]

# =============================================================================
trees:

  EFE:
    id: efe_focus_tree
    default: false
    shared_focus_trees: []
    anchors_from_doc:
      - "Golpe de 2079 / título Custodio de la Tierra (§3.3)"
      - "Proclamación imperial de 2081 (§3.3)"
      - "Milicias Verdes y Batalla de Iguazú (§3.3)"
      - "Reforestación obligatoria, control de población, autarquía (§3.2)"
      - "Tecnologías de agua, semillas y restauración como herramientas de poder exterior (§3.2)"
      - "BioSteel por umbrales 5/10/15 (§3.4)"
      - "Satélites Patagonia Austral y Yvytu Ykua Guasu (§3.1)"

    branches:

      # -----------------------------------------------------------------------
      - id: ruta_guerra
        name:
          english: "The Water War"
          spanish: "La Guerra del Agua"
        name_src: invented
        theme_basis: "Ruta militar. Enemigo natural: la FCU (opuesto ideológico, codicia el Acuífero Guaraní). Antes hay que romper el cerco andino de la NAS, cliente de armas de Meridian Kinetics."
        focuses:
          - id: EFE_guardia_verde_movilizada
            name:
              english: "The Green Guard Mobilised"
              spanish: "La Guardia Verde Movilizada"
            name_src: invented
            prerequisites: [EFE_milicias_verdes]
            icon: GFX_goal_generic_allies_build_infantry
            icon_src: invented
            cost: 10
            desc:
              english: "Castellane Water Trust has made a bid for the Guaraní Aquifer. The Empire answers with uniforms."
              spanish: "Castellane Water Trust hizo una oferta por el Acuífero Guaraní. El Imperio contesta con uniformes."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_guardia_movilizada }
              - { effect: army_experience, value: 25 }
            reward_src: invented
          - id: EFE_defensa_del_acuifero
            name:
              english: "Defence of the Aquifer"
              spanish: "Defensa del Acuífero"
            name_src: invented
            prerequisites: [EFE_guardia_verde_movilizada]
            icon: GFX_goal_generic_defence
            icon_src: invented
            cost: 10
            desc:
              english: "If the Union comes for the water, it will find the Empire already dug in above it."
              spanish: "Si la Unión viene por el agua, va a encontrar al Imperio ya atrincherado encima."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_defensa_acuifero }
            reward_src: invented
          - id: EFE_alas_del_condor
            name:
              english: "Wings of the Condor"
              spanish: "Alas del Cóndor"
            name_src: invented
            prerequisites: [EFE_guardia_verde_movilizada]
            icon: GFX_goal_generic_air_doctrine
            icon_src: invented
            cost: 10
            desc:
              english: "The condor hunts from the heights. So will the Guard: mountain brigades, air mobility, no fixed front."
              spanish: "El cóndor caza desde la altura. La Guardia también: brigadas de montaña, movilidad aérea, ningún frente fijo."
            desc_src: invented
            reward:
              - { effect: army_experience, value: 25 }
              - { effect: add_war_support, value: 0.05 }
            reward_src: invented
          - id: EFE_romper_el_cerco_andino
            name:
              english: "Break the Andean Encirclement"
              spanish: "Romper el Cerco Andino"
            name_src: invented
            prerequisites: [EFE_defensa_del_acuifero, EFE_alas_del_condor]
            icon: GFX_goal_generic_occupy_states_ongoing_war
            icon_src: invented
            cost: 10
            desc:
              english: "The Sky Kingdom holds the passes and buys its rifles from Meridian Kinetics. The road to the Union's water runs through Cusco."
              spanish: "El Reino del Cielo controla los pasos y le compra los fusiles a Meridian Kinetics. El camino hacia el agua de la Unión pasa por Cusco."
            desc_src: invented
            available:
              country_exists: NAS
            reward:
              - { effect: wargoal, target: NAS, type: annex_everything }
            reward_src: invented
          - id: EFE_la_guerra_del_agua
            name:
              english: "The Water War"
              spanish: "La Guerra del Agua"
            name_src: invented
            prerequisites: [EFE_romper_el_cerco_andino]
            icon: GFX_goal_generic_major_war
            icon_src: invented
            cost: 14
            desc:
              english: "The Union wants to put a price on every litre of water on Earth. The Empire will not let the Earth be sold."
              spanish: "La Unión quiere ponerle precio a cada litro de agua de la Tierra. El Imperio no va a dejar que vendan la Tierra."
            desc_src: invented
            available:
              country_exists: FCU
            reward:
              - { effect: wargoal, target: FCU, type: annex_everything }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: consolidacion
        name:
          english: "Consolidation of the Mandate"
          spanish: "Consolidación del Mandato"
        name_src: invented
        theme_src: canon
        theme_basis: "§3.2 y §3.3 — legitimidad del régimen, golpe, coronación."
        focuses:
          - id: EFE_custodio_de_la_tierra
            name:
              english: "Custodian of the Earth"
              spanish: "Custodio de la Tierra"
            name_src: canon      # el título es literal del doc
            structure_src: invented
            prerequisites: []
            reward_intent: "Political power / arranque del árbol."
            icon: GFX_goal_generic_political_pressure
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "In 2079 the Green Militias took the capital and their commander took a title no constitution had ever written: Custodian of the Earth."
              spanish: "En 2079 las Milicias Verdes tomaron la capital y su comandante tomó un título que ninguna constitución había escrito: Custodio de la Tierra."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 120 }
            reward_src: invented
          - id: EFE_legado_de_iguazu
            name:
              english: "The Legacy of Iguazú"
              spanish: "El Legado de Iguazú"
            name_src: inferred   # "Batalla de Iguazú" es canon; el foco es mío
            prerequisites: [EFE_custodio_de_la_tierra]
            reward_intent: "War support / bono de experiencia de ejército."
            icon: GFX_EFE_condor_doctrine
            icon_src: user_art
            icon_asset: assets/EFE/goals/EFE_condor_doctrine.dds
            cost: 10
            cost_src: invented
            desc:
              english: "Iguazú was where the Militias stopped being a movement and became an army. Every officer of the Empire is taught it as scripture."
              spanish: "Iguazú fue donde las Milicias dejaron de ser un movimiento y se volvieron un ejército. Todo oficial del Imperio la aprende como escritura sagrada."
            desc_src: invented
            reward:
              - { effect: add_war_support, value: 0.05 }
              - { effect: army_experience, value: 10 }
            reward_src: invented
          - id: EFE_milicias_verdes
            name:
              english: "The Green Militias"
              spanish: "Las Milicias Verdes"
            name_src: canon
            prerequisites: [EFE_custodio_de_la_tierra]
            reward_intent: "Manpower / unidad especial temática."
            icon: GFX_EFE_green_legions
            icon_src: user_art
            icon_asset: assets/EFE/goals/EFE_green_legions.dds
            cost: 10
            cost_src: invented
            desc:
              english: "The Militias that brought the Custodian to power are too loyal to disband and too dangerous to ignore. Better to give them a uniform."
              spanish: "Las Milicias que llevaron al Custodio al poder son demasiado leales para disolverlas y demasiado peligrosas para ignorarlas. Mejor darles uniforme."
            desc_src: invented
            reward:
              - { effect: add_manpower, value: 20000 }
            reward_src: invented
          - id: EFE_corona_de_2081
            name:
              english: "The Crown of 2081"
              spanish: "La Corona de 2081"
            name_src: inferred
            prerequisites: [EFE_legado_de_iguazu, EFE_milicias_verdes]
            reward_intent: "Estabilidad / consolidación de la ideología."
            icon: GFX_goal_generic_national_unity
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "Two years after the coup, the Custodian became Aurelio IV. The crown made the emergency permanent."
              spanish: "Dos años después del golpe, el Custodio se convirtió en Aurelio IV. La corona volvió permanente la emergencia."
            desc_src: invented
            reward:
              - { effect: add_stability, value: 0.1 }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: ruta_dinastia
        name:
          english: "The Green Dynasty"
          spanish: "La Dinastía Verde"
        name_src: invented
        theme_basis: "Ruta política A (excluyente con La Guardia Manda): el Emperador y su linaje."
        focuses:
          - id: EFE_dinastia_verde
            name:
              english: "The Green Dynasty"
              spanish: "La Dinastía Verde"
            name_src: invented
            prerequisites: [EFE_corona_de_2081]
            mutually_exclusive: [EFE_la_guardia_manda]
            icon: GFX_goal_generic_political_pressure
            icon_src: invented
            cost: 10
            desc:
              english: "Aurelio IV declares the crown hereditary. The Custodian's emergency becomes a family inheritance."
              spanish: "Aurelio IV declara hereditaria la corona. La emergencia del Custodio se vuelve una herencia familiar."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_trono_del_bosque }
            reward_src: invented
          - id: EFE_el_heredero_del_norte
            name:
              english: "The Heir of the North"
              spanish: "El Heredero del Norte"
            name_src: invented
            prerequisites: [EFE_dinastia_verde]
            icon: GFX_goal_generic_major_alliance
            icon_src: invented
            cost: 10
            desc:
              english: "Tupã Benítez is recalled from Asunción and named heir. His satellite comes with him, into the Empire proper."
              spanish: "Tupã Benítez vuelve de Asunción y es nombrado heredero. Su satélite viene con él, adentro del Imperio."
            desc_src: invented
            available:
              country_exists: YYG
            reward:
              - { effect: annex, target: YYG }
            reward_src: invented
          - id: EFE_la_corte_de_los_bosques
            name:
              english: "The Court of the Forests"
              spanish: "La Corte de los Bosques"
            name_src: invented
            prerequisites: [EFE_dinastia_verde]
            icon: GFX_goal_generic_national_unity
            icon_src: invented
            cost: 10
            desc:
              english: "Titles, oaths and a court that meets under the oldest trees of the Delta. Loyalty is now a ceremony."
              spanish: "Títulos, juramentos y una corte que se reúne bajo los árboles más viejos del Delta. La lealtad ahora es una ceremonia."
            desc_src: invented
            reward:
              - { effect: add_stability, value: 0.1 }
              - { effect: add_political_power, value: 50 }
            reward_src: invented
          - id: EFE_emperador_de_la_tierra
            name:
              english: "Emperor of the Earth"
              spanish: "Emperador de la Tierra"
            name_src: invented
            prerequisites: [EFE_el_heredero_del_norte, EFE_la_corte_de_los_bosques]
            icon: GFX_goal_generic_political_pressure
            icon_src: invented
            cost: 10
            desc:
              english: "Not Emperor of a country: Emperor of the Earth itself. The title is a claim, and the claim has no border."
              spanish: "No Emperador de un país: Emperador de la Tierra misma. El título es un reclamo, y el reclamo no tiene frontera."
            desc_src: invented
            reward:
              - { effect: swap_ideas, remove: EFE_trono_del_bosque, add: EFE_trono_eterno }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: ruta_guardia
        name:
          english: "The Guard Commands"
          spanish: "La Guardia Manda"
        name_src: invented
        theme_basis: "Ruta política B (excluyente con La Dinastía Verde): el Mariscal Etchegaray y los técnicos."
        focuses:
          - id: EFE_la_guardia_manda
            name:
              english: "The Guard Commands"
              spanish: "La Guardia Manda"
            name_src: invented
            prerequisites: [EFE_corona_de_2081]
            mutually_exclusive: [EFE_dinastia_verde]
            icon: GFX_goal_generic_army_doctrines
            icon_src: invented
            cost: 10
            desc:
              english: "Marshal Etchegaray does not want the crown. He wants every decision the crown makes to pass through his desk first."
              spanish: "El Mariscal Etchegaray no quiere la corona. Quiere que cada decisión de la corona pase antes por su escritorio."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_estado_guarnicion }
            reward_src: invented
          - id: EFE_consejo_de_custodios
            name:
              english: "The Council of Custodians"
              spanish: "El Consejo de Custodios"
            name_src: invented
            prerequisites: [EFE_la_guardia_manda]
            icon: GFX_goal_generic_secret_weapon
            icon_src: invented
            cost: 10
            desc:
              english: "Custodian Paillacar brings her scientists north. The Guard needs to know which forests to defend and which ones are already lost."
              spanish: "La Custodia Paillacar trae a sus científicos al norte. La Guardia necesita saber qué bosques defender y cuáles ya están perdidos."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_consejo_tecnico }
              - { effect: add_research_slot, value: 1 }
            reward_src: invented
          - id: EFE_la_frontera_austral
            name:
              english: "The Southern Frontier"
              spanish: "La Frontera Austral"
            name_src: invented
            prerequisites: [EFE_la_guardia_manda]
            icon: GFX_goal_generic_major_alliance
            icon_src: invented
            cost: 10
            desc:
              english: "A satellite is a luxury for an empire at peace. Southern Patagonia becomes a military district."
              spanish: "Un satélite es un lujo para un imperio en paz. Patagonia Austral pasa a ser un distrito militar."
            desc_src: invented
            available:
              country_exists: PTA
            reward:
              - { effect: annex, target: PTA }
            reward_src: invented
          - id: EFE_la_junta_de_la_tierra
            name:
              english: "The Junta of the Earth"
              spanish: "La Junta de la Tierra"
            name_src: invented
            prerequisites: [EFE_consejo_de_custodios, EFE_la_frontera_austral]
            icon: GFX_goal_generic_army_doctrines
            icon_src: invented
            cost: 10
            desc:
              english: "The Emperor still reigns. The Marshal governs, the scientists advise, and the Guard is everywhere."
              spanish: "El Emperador todavía reina. El Mariscal gobierna, los científicos aconsejan y la Guardia está en todas partes."
            desc_src: invented
            reward:
              - { effect: swap_ideas, remove: EFE_estado_guarnicion, add: EFE_junta_de_la_tierra }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: satelites
        name:
          english: "The Custodial Satellites"
          spanish: "Los Satélites Custodios"
        name_src: invented
        theme_src: canon
        theme_basis: "§3.1 — los dos satélites están definidos con territorio exacto."
        focuses:
          - id: EFE_patagonia_austral
            name:
              english: "Southern Patagonia"
              spanish: "Patagonia Austral"
            name_src: canon
            prerequisites: [EFE_corona_de_2081]
            reward_intent: "Integración del satélite PTA."
            icon: GFX_goal_generic_major_alliance
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "The far south guards the Empire's back and its last glaciers. Its governors answer to the Crown."
              spanish: "El extremo sur cuida la espalda del Imperio y sus últimos glaciares. Sus gobernadores responden a la Corona."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 75 }
            reward_src: invented
          - id: EFE_yvytu_ykua_guasu
            name:
              english: "Yvytu Ykua Guasu"
              spanish: "Yvytu Ykua Guasu"
            name_src: canon
            prerequisites: [EFE_corona_de_2081]
            reward_intent: "Integración del satélite YYG."
            icon: GFX_goal_generic_major_alliance
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "The great water of the north is the Empire's reservoir, and its most precious hostage."
              spanish: "La gran agua del norte es la reserva del Imperio, y su rehén más valioso."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 75 }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: restauracion
        name:
          english: "Total Restoration"
          spanish: "Restauración Total"
        name_src: non_canon_legacy
        name_note: >
          "Restauración Total" aparece en la cronología vieja de 2054 (§12), que
          el doc marca como no canon. Lo reciclo solo como nombre de rama porque
          encaja con la prosa canon de §3.2. Decime si preferís que no toque
          nada de la cronología vieja. Ver Q020.
        theme_src: canon
        theme_basis: "§3.2 — reforestación obligatoria, control de población y consumo."
        focuses:
          - id: EFE_reforestacion_obligatoria
            name:
              english: "Compulsory Reforestation"
              spanish: "Reforestación Obligatoria"
            name_src: inferred
            prerequisites: [EFE_custodio_de_la_tierra]
            reward_intent: "Infraestructura / idea EFE_conservacion_coercitiva."
            icon: GFX_EFE_reforest_patagonia
            icon_src: user_art
            icon_asset: assets/EFE/goals/EFE_reforest_patagonia.dds
            cost: 10
            cost_src: invented
            desc:
              english: "Every citizen owes the forest a number of hours a year. The Green Guard keeps the count."
              spanish: "Todo ciudadano le debe al bosque una cantidad de horas por año. La Guardia Verde lleva la cuenta."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_conservacion_coercitiva }
            reward_src: invented
          - id: EFE_cuotas_de_consumo
            name:
              english: "Consumption Quotas"
              spanish: "Cuotas de Consumo"
            name_src: inferred
            prerequisites: [EFE_reforestacion_obligatoria]
            reward_intent: "Idea EFE_control_poblacional."
            icon: GFX_goal_generic_propaganda
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "What each household may eat, burn and travel is now a line in a ministry ledger."
              spanish: "Lo que cada hogar puede comer, quemar y recorrer es ahora una línea en el libro de un ministerio."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_control_poblacional }
            reward_src: invented
          - id: EFE_autosuficiencia
            name:
              english: "The Closed Circuit"
              spanish: "El Circuito Cerrado"
            name_src: invented
            prerequisites: [EFE_cuotas_de_consumo]
            reward_intent: "Idea EFE_autarquia_estrategica / bono de recursos."
            icon: GFX_EFE_biofuel_autarky
            icon_src: user_art
            icon_asset: assets/EFE/goals/EFE_biofuel_autarky.dds
            cost: 10
            cost_src: invented
            desc:
              english: "Nothing comes in that the Empire cannot make, and nothing goes out that the Empire might need."
              spanish: "No entra nada que el Imperio no pueda fabricar, y no sale nada que el Imperio pueda necesitar."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_autarquia_estrategica }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: diplomacia_verde
        name:
          english: "Water, Seed and Leverage"
          spanish: "Agua, Semilla y Palanca"
        name_src: invented
        theme_src: canon
        theme_basis: >
          §3.2 — "Tecnologías de agua, semillas y restauración ecológica como
          herramientas de poder exterior." Es la única línea del doc que apunta a
          proyección exterior no militar del EFE.
        focuses:
          - id: EFE_bancos_de_semillas
            name:
              english: "The Seed Banks"
              spanish: "Los Bancos de Semillas"
            name_src: inferred
            prerequisites: [EFE_autosuficiencia]
            reward_intent: "Opinión / influencia sobre países libres."
            icon: GFX_goal_generic_trade
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "The world's last seed vaults are in Imperial hands. Hunger is a diplomatic language."
              spanish: "Las últimas bóvedas de semillas del mundo están en manos imperiales. El hambre es un idioma diplomático."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 50 }
            reward_src: invented
          - id: EFE_tratados_de_agua
            name:
              english: "Water Treaties"
              spanish: "Tratados de Agua"
            name_src: inferred
            prerequisites: [EFE_bancos_de_semillas]
            reward_intent: "Herramienta diplomática coercitiva."
            icon: GFX_goal_generic_trade
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "Clean water, offered at a price. The price is never money."
              spanish: "Agua limpia, ofrecida a un precio. El precio nunca es dinero."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 75 }
            reward_src: invented
            blocked_by: >
              Depende de que existan los 30 países libres y una estructura de
              facciones. Ver Q018 y Q033.

      # -----------------------------------------------------------------------
      - id: biosteel_branch
        name:
          english: "The BioSteel Race"
          spanish: "La Carrera del Bioacero"
        name_src: inferred
        theme_src: canon
        theme_basis: "§3.4 — 'una carrera nacional de desarrollo material'."
        focuses:
          - id: EFE_biosteel_umbral_1
            name:
              english: "First Foundries"
              spanish: "Primeras Fundiciones"
            name_src: invented
            prerequisites: [EFE_custodio_de_la_tierra]
            reward_intent: "Desbloquea el contador de BioSteel + tier 1 (umbral 5)."
            icon: GFX_goal_generic_construct_mil_factory
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "Once the Empire controls enough BioSteel, the first foundries can start growing it at scale."
              spanish: "Cuando el Imperio controle suficiente Bioacero, las primeras fundiciones podrán cultivarlo a escala."
            desc_src: invented
            available:
              biosteel_tier: 1
            reward:
              - { effect: add_variable, var: EFE_biosteel, value: 3 }
              - { effect: add_ideas, value: EFE_biosteel_t1 }
            reward_src: invented
            depends_on_mechanic: biosteel
          - id: EFE_biosteel_umbral_2
            name:
              english: "Industrial Cultivation"
              spanish: "Cultivo Industrial"
            name_src: invented
            prerequisites: [EFE_biosteel_umbral_1]
            reward_intent: "Tier 2 (umbral 10)."
            icon: GFX_goal_generic_production
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "More BioSteel, more vats, more tonnes. The race is no longer against the others but against time."
              spanish: "Más Bioacero, más cubas, más toneladas. La carrera ya no es contra los demás sino contra el tiempo."
            desc_src: invented
            available:
              biosteel_tier: 2
            reward:
              - { effect: swap_ideas, remove: EFE_biosteel_t1, add: EFE_biosteel_t2 }
            reward_src: invented
            depends_on_mechanic: biosteel
          - id: EFE_biosteel_umbral_3
            name:
              english: "Living Armour"
              spanish: "Armadura Viviente"
            name_src: invented
            prerequisites: [EFE_biosteel_umbral_2]
            reward_intent: "Tier 3 (umbral 15)."
            icon: GFX_goal_generic_army_tanks
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "With enough BioSteel, armour stops being built and starts being grown."
              spanish: "Con suficiente Bioacero, el blindaje deja de construirse y empieza a cultivarse."
            desc_src: invented
            available:
              biosteel_tier: 3
            reward:
              - { effect: swap_ideas, remove: EFE_biosteel_t2, add: EFE_biosteel_t3 }
            reward_src: invented
            depends_on_mechanic: biosteel

      # -----------------------------------------------------------------------
      - id: ruta_economia
        name:
          english: "The Forest Economy"
          spanish: "La Economía del Bosque"
        name_src: invented
        theme_basis: "Ruta económica: fábricas y agua, sin romper el Mandato Verde."
        focuses:
          - id: EFE_ministerio_de_restauracion
            name:
              english: "Ministry of Restoration"
              spanish: "Ministerio de Restauración"
            name_src: invented
            prerequisites: [EFE_custodio_de_la_tierra]
            icon: GFX_goal_generic_construct_civ_factory
            icon_src: invented
            cost: 10
            desc:
              english: "One ministry decides what is built, where, and which forest pays for it."
              spanish: "Un solo ministerio decide qué se construye, dónde y qué bosque lo paga."
            desc_src: invented
            reward:
              - { effect: build, building: industrial_complex, level: 2 }
            reward_src: invented
          - id: EFE_fabricas_de_la_pampa
            name:
              english: "Factories of the Pampas"
              spanish: "Fábricas de la Pampa"
            name_src: invented
            prerequisites: [EFE_ministerio_de_restauracion]
            icon: GFX_goal_generic_construct_mil_factory
            icon_src: invented
            cost: 10
            desc:
              english: "Arms factories on the old soy fields, roofed with solar glass and fenced with new forest."
              spanish: "Fábricas de armas sobre los viejos campos de soja, techadas con vidrio solar y cercadas con bosque nuevo."
            desc_src: invented
            reward:
              - { effect: add_variable, var: EFE_biosteel, value: 3 }
              - { effect: build, building: arms_factory, level: 2 }
            reward_src: invented
          - id: EFE_red_hidrica_guarani
            name:
              english: "The Guaraní Water Grid"
              spanish: "La Red Hídrica Guaraní"
            name_src: invented
            prerequisites: [EFE_ministerio_de_restauracion]
            icon: GFX_goal_generic_production
            icon_src: invented
            cost: 10
            desc:
              english: "The largest aquifer on the continent is no longer a reserve. It is infrastructure."
              spanish: "El acuífero más grande del continente ya no es una reserva. Es infraestructura."
            desc_src: invented
            reward:
              - { effect: add_variable, var: EFE_biosteel, value: 2 }
              - { effect: add_ideas, value: EFE_red_hidrica }
            reward_src: invented
          - id: EFE_economia_circular
            name:
              english: "The Circular Economy"
              spanish: "La Economía Circular"
            name_src: invented
            prerequisites: [EFE_fabricas_de_la_pampa, EFE_red_hidrica_guarani]
            icon: GFX_goal_generic_construct_civ_factory
            icon_src: invented
            cost: 10
            desc:
              english: "Nothing is wasted, nothing is imported, nothing leaves the circle. The Empire feeds on itself and grows."
              spanish: "Nada se desperdicia, nada se importa, nada sale del círculo. El Imperio se alimenta de sí mismo y crece."
            desc_src: invented
            reward:
              - { effect: add_variable, var: EFE_biosteel, value: 3 }
              - { effect: build, building: industrial_complex, level: 2 }
              - { effect: add_research_slot, value: 1 }
            reward_src: invented

    layout: auto
    layout_note: >
      Las coordenadas x/y las calcula el generador: profundidad por
      prerequisitos, una columna por rama. Así agregar un foco no obliga a
      recalcular el árbol a mano.
    unknown:
      - "Mutually exclusive entre ramas: ¿hay caminos excluyentes?"
      - "Rama de guerra: resuelta (2026-09-23). Enemigo natural FCU, vía la NAS."
    see: [Q031, Q033]

  # ---------------------------------------------------------------------------
  ASC: { status: not_started, see: Q032 }

  # ===========================================================================
  FCU:
    id: fcu_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23). Ruta Castellane (status quo) contra La OPA Hostil (Rourke, se habilita con la mecánica del Directorio).
      Versión 1 sin interfaz propia.'
    branches:
    - id: politica_castellane
      name: {english: The Board of Four, spanish: El Directorio de las Cuatro}
      focuses:
      - id: FCU_ano_fiscal
        name: {english: Fiscal Year 2100, spanish: El Año Fiscal 2100}
        days: 35
        icon: GFX_goal_generic_trade
        desc:
          english: A new century opens with a balance sheet. The Board wants to know who pays for it.
          spanish: Un siglo nuevo abre con un balance. El Directorio quiere saber quién lo paga.
        reward:
        - {effect: add_political_power, value: 50}
      - id: FCU_junta_anual
        name: {english: The Annual Shareholders' Meeting, spanish: La Junta Anual de Accionistas}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - FCU_ano_fiscal
        desc:
          english: Every year the Four meet to decide who runs the Union. This year the room is tense.
          spanish: Cada año las Cuatro se reúnen para decidir quién maneja la Unión. Este año el salón está tenso.
        reward:
        - {effect: add_political_power, value: 50}
      - id: FCU_segundo_mandato
        name: {english: Castellane's Second Term, spanish: El Segundo Mandato de Castellane}
        days: 35
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - FCU_junta_anual
        mutually_exclusive:
        - FCU_junta_de_emergencia
        ai:
          factor: 3
          modifiers:
          - factor: 0.3
            when: {at_war: true}
          - factor: 0.2
            when: {flag: FCU_opa_habilitada}
        desc:
          english: 'Valeria Castellane keeps the Chair. Her secret: never let any of the Four win.'
          spanish: 'Valeria Castellane conserva la Presidencia. Su secreto: no dejar ganar nunca a ninguna de las Cuatro.'
        reward:
        - {effect: add_political_power, value: 75}
        - {effect: add_stability, value: 0.05}
      - id: FCU_reparto_de_carteras
        name: {english: Assigning the Portfolios, spanish: El Reparto de Carteras}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - FCU_segundo_mandato
        desc:
          english: Each corporation gets a ministry. Castellane keeps the one that signs the budgets.
          spanish: Cada corporación recibe un ministerio. Castellane se queda con el que firma los presupuestos.
        reward:
        - {effect: add_ideas, value: FCU_carteras_repartidas}
      - id: FCU_comida_para_todos
        name: {english: 'Halvorsen-Ito: Food for Everyone', spanish: 'Halvorsen-Ito: Comida para Todos'}
        days: 35
        icon: GFX_goal_generic_consumer_goods
        prerequisites:
        - FCU_reparto_de_carteras
        desc:
          english: Halvorsen-Ito's vertical farms feed the cities at cost, and put their logo on every loaf.
          spanish: Las granjas verticales de Halvorsen-Ito alimentan a las ciudades al costo, y ponen su logo en cada pan.
        reward:
        - {effect: add_variable, var: FCU_halvorsen, value: 10}
        - {effect: add_stability, value: 0.03}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_el_libro_mayor
        name: {english: 'Obsidian Ledger: The General Ledger', spanish: 'Obsidian Ledger: El Libro Mayor'}
        days: 35
        icon: GFX_goal_generic_secret_weapon
        prerequisites:
        - FCU_reparto_de_carteras
        desc:
          english: Every transaction in the Union goes through Obsidian's ledger. It knows what everyone owes.
          spanish: Cada transacción de la Unión pasa por el libro de Obsidian. Sabe lo que debe cada uno.
        reward:
        - {effect: add_variable, var: FCU_obsidian, value: 10}
        - {effect: add_political_power, value: 50}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_contratos_de_defensa
        name: {english: 'Meridian Kinetics: Defence Contracts', spanish: 'Meridian Kinetics: Contratos de Defensa'}
        days: 35
        icon: GFX_goal_generic_army_doctrines
        prerequisites:
        - FCU_reparto_de_carteras
        desc:
          english: Meridian gets the army's orders, on the condition that it shares the profits with the Board.
          spanish: Meridian se queda con los pedidos del ejército, con la condición de repartir las ganancias con el Directorio.
        reward:
        - {effect: add_variable, var: FCU_meridian, value: 10}
        - {effect: army_experience, value: 20}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_grifos_de_la_union
        name: {english: 'Castellane: The Union''s Taps', spanish: 'Castellane: Los Grifos de la Unión'}
        days: 35
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
        - FCU_reparto_de_carteras
        desc:
          english: New desalination plants on both coasts. Water is Castellane's, and Castellane is the Chair.
          spanish: Desalinizadoras nuevas en las dos costas. El agua es de Castellane, y Castellane es la Presidencia.
        reward:
        - {effect: add_variable, var: FCU_castellane, value: 10}
        - {effect: build, building: industrial_complex, level: 1}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_la_mesa_redonda
        name: {english: The Round Table, spanish: La Mesa Redonda}
        days: 56
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - FCU_comida_para_todos
        - FCU_el_libro_mayor
        - FCU_contratos_de_defensa
        - FCU_grifos_de_la_union
        available:
          all_between:
            vars:
            - FCU_castellane
            - FCU_halvorsen
            - FCU_meridian
            - FCU_obsidian
            min: 40
            max: 60
        desc:
          english: Only possible with all four corporations between 40 and 60. The hardest thing in the Union is a board where nobody wins.
          spanish: Solo posible con las cuatro corporaciones entre 40 y 60. Lo más difícil de la Unión es un directorio donde nadie gana.
        reward:
        - {effect: add_ideas, value: FCU_mesa_redonda}
        - {effect: add_political_power, value: 50}
      - id: FCU_grifos_cerrados_al_sur
        name: {english: Close the Southern Taps, spanish: Cerrar los Grifos del Sur}
        days: 42
        icon: GFX_goal_generic_trade
        prerequisites:
        - FCU_la_mesa_redonda
        available: {country_exists: EFE}
        desc:
          english: The Empire's northern cities drink Castellane's water. Remind them.
          spanish: Las ciudades del norte del Imperio toman agua de Castellane. Hay que recordárselo.
        reward:
        - {effect: add_variable, var: FCU_castellane, value: 5}
        - {effect: add_political_power, value: 50}
        - {effect: event, id: meganations_efe.6, days: 1, target: EFE}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_adquisicion_del_sur
        name: {english: The Acquisition of the South, spanish: La Adquisición del Sur}
        days: 70
        icon: GFX_goal_generic_major_war
        prerequisites:
        - FCU_grifos_cerrados_al_sur
        available: {country_exists: EFE}
        ai:
          factor: 1
          modifiers:
          - factor: 0
            when: {at_war: true}
        desc:
          english: 'A formal acquisition offer to the Ecofascist Empire: the water, the vats, and a seat on the Board. If they refuse, Meridian
            has a plan B.'
          spanish: 'Una oferta formal de adquisición al Imperio Ecofascista: el agua, las cubas y una silla en el Directorio. Si la rechazan, Meridian
            tiene un plan B.'
        reward:
        - {effect: event, id: meganations_efe.5, days: 1, target: EFE}
        - {effect: event, id: meganations_hsn.1, days: 1, target: HSN}
        - {effect: add_war_support, value: 0.05}
    - id: politica_rourke
      name: {english: The Hostile Takeover, spanish: La OPA Hostil}
      focuses:
      - id: FCU_junta_de_emergencia
        name: {english: Emergency Shareholders' Meeting, spanish: Junta de Accionistas de Emergencia}
        days: 21
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - FCU_junta_anual
        mutually_exclusive:
        - FCU_segundo_mandato
        available: {flag: FCU_opa_habilitada}
        ai:
          factor: 1
          modifiers:
          - factor: 5
            when: {at_war: true}
        desc:
          english: Available only when Meridian is above 70 and two rivals are below 25. Eleven minutes, one vote, a new Chief Executive.
          spanish: Disponible solo con Meridian por encima de 70 y dos rivales por debajo de 25. Once minutos, un voto, un Director Ejecutivo nuevo.
        reward:
        - {effect: promote, character: FCU_marcus_rourke}
        - {effect: flag, value: FCU_opa_consumada}
        - {effect: timed_idea, idea: FCU_turbulencia_bursatil, days: 90}
        - effect: if
          when: {idea: FCU_sinergia_del_directorio}
          then:
          - {effect: remove_idea, value: FCU_sinergia_del_directorio}
        - effect: if
          when: {idea: FCU_guerra_corporativa}
          then:
          - {effect: remove_idea, value: FCU_guerra_corporativa}
        - {effect: event, id: meganations_fcu.1, days: 1}
      - id: FCU_absorber_a_halvorsen
        name: {english: Meridian Absorbs Halvorsen-Ito, spanish: Meridian Absorbe a Halvorsen-Ito}
        days: 35
        icon: GFX_goal_generic_consumer_goods
        prerequisites:
        - FCU_junta_de_emergencia
        desc:
          english: The farms are Meridian's now. They feed the army first.
          spanish: Las granjas ahora son de Meridian. Primero alimentan al ejército.
        reward:
        - {effect: set_variable, var: FCU_halvorsen, value: 0}
        - {effect: add_variable, var: FCU_meridian, value: 15}
        - {effect: add_ideas, value: FCU_raciones_meridian}
        - {effect: army_experience, value: 25}
      - id: FCU_liquidar_obsidian
        name: {english: Obsidian Liquidated, spanish: Obsidian Liquidada}
        days: 35
        icon: GFX_goal_generic_secret_weapon
        prerequisites:
        - FCU_junta_de_emergencia
        desc:
          english: Obsidian's ledgers are sold at auction. The buyer is Meridian, with Obsidian's money.
          spanish: Los libros de Obsidian se rematan. El comprador es Meridian, con la plata de Obsidian.
        reward:
        - {effect: set_variable, var: FCU_obsidian, value: 0}
        - {effect: add_variable, var: FCU_meridian, value: 10}
        - {effect: add_political_power, value: 150}
      - id: FCU_castellane_firma
        name: {english: Castellane Signs, spanish: Castellane Firma}
        days: 42
        icon: GFX_goal_generic_trade
        prerequisites:
        - FCU_absorber_a_halvorsen
        - FCU_liquidar_obsidian
        desc:
          english: Valeria Castellane signs the sale of her company and leaves the capital. The water now answers to Meridian.
          spanish: Valeria Castellane firma la venta de su compañía y se va de la capital. El agua ahora le responde a Meridian.
        reward:
        - {effect: set_variable, var: FCU_castellane, value: 0}
        - {effect: set_variable, var: FCU_meridian, value: 100}
        - {effect: swap_ideas, remove: FCU_directorio_de_las_cuatro, add: FCU_meridian_unica}
      - id: FCU_el_dividendo_de_guerra
        name: {english: The War Dividend, spanish: El Dividendo de Guerra}
        days: 56
        icon: GFX_goal_generic_major_war
        prerequisites:
        - FCU_castellane_firma
        desc:
          english: The shareholders will be paid every quarter, as long as there is a war to pay them with.
          spanish: A los accionistas se les paga cada trimestre, mientras haya una guerra con la cual pagarles.
        reward:
        - {effect: add_ideas, value: FCU_dividendo_de_guerra}
        - {effect: event, id: meganations_fcu.3, days: 90}
      - id: FCU_los_contratistas_globales
        name: {english: Global Contractors, spanish: Contratistas Globales}
        days: 35
        icon: GFX_goal_generic_allies_build_infantry
        prerequisites:
        - FCU_el_dividendo_de_guerra
        desc:
          english: Meridian rents divisions to any country that pays. Experience comes back with the invoices.
          spanish: Meridian alquila divisiones a cualquier país que pague. La experiencia vuelve con las facturas.
        reward:
        - {effect: add_ideas, value: FCU_contratistas_globales}
        - {effect: army_experience, value: 25}
      - id: FCU_adquirir_la_alta_mar
        name: {english: Acquire the High Seas, spanish: Adquirir la Alta Mar}
        days: 70
        icon: GFX_goal_generic_major_war
        prerequisites:
        - FCU_los_contratistas_globales
        available: {country_exists: HSN}
        desc:
          english: 'A hostile offer to the High Seas Market Nation: a security fee on every Pacific cargo, or Meridian provides the security.'
          spanish: 'Una oferta hostil a la Nación de Mercado de Alta Mar: una tasa de seguridad por cada carga del Pacífico, o Meridian se encarga
            de la seguridad.'
        reward:
        - {effect: event, id: meganations_hsn.2, days: 1, target: HSN}
        - {effect: add_war_support, value: 0.05}
    - id: economia_dividendo
      name: {english: The Civil Dividend, spanish: El Dividendo Civil}
      focuses:
      - id: FCU_consejo_economico
        name: {english: The Economic Council, spanish: El Consejo Económico}
        days: 35
        icon: GFX_goal_generic_production
        prerequisites:
        - FCU_ano_fiscal
        desc:
          english: 'Two models are fighting for the Union''s economy: a share for every citizen, or a tap for every rival.'
          spanish: 'Dos modelos se pelean la economía de la Unión: una acción para cada ciudadano, o un grifo para cada rival.'
        reward:
        - {effect: add_political_power, value: 25}
        - {effect: build, building: industrial_complex, level: 1}
      - id: FCU_el_dividendo
        name: {english: The Dividend, spanish: El Dividendo}
        days: 42
        icon: GFX_goal_generic_consumer_goods
        prerequisites:
        - FCU_consejo_economico
        mutually_exclusive:
        - FCU_monopolio_del_agua
        ai:
          factor: 2
          modifiers:
          - factor: 0.5
            when: {at_war: true}
        desc:
          english: Every citizen receives a share of the Union. Small, but real enough to defend.
          spanish: Cada ciudadano recibe una acción de la Unión. Chiquita, pero lo bastante real como para defenderla.
        reward:
        - {effect: add_ideas, value: FCU_dividendo_civil}
        - {effect: add_variable, var: FCU_halvorsen, value: 5}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_zonas_francas
        name: {english: Free Trade Zones, spanish: Zonas Francas}
        days: 35
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
        - FCU_el_dividendo
        desc:
          english: Tax-free industrial parks along the Great Lakes.
          spanish: Parques industriales libres de impuestos sobre los Grandes Lagos.
        reward:
        - {effect: build, building: industrial_complex, level: 2}
      - id: FCU_consumo_de_masas
        name: {english: Mass Consumption, spanish: Consumo de Masas}
        days: 35
        icon: GFX_goal_generic_consumer_goods
        prerequisites:
        - FCU_el_dividendo
        desc:
          english: Full shelves are the best propaganda the Board ever bought.
          spanish: Las góndolas llenas son la mejor propaganda que el Directorio compró jamás.
        reward:
        - {effect: add_stability, value: 0.05}
        - {effect: add_variable, var: FCU_halvorsen, value: 5}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_abrir_la_exportacion
        name: {english: The Export Market, spanish: El Mercado de Exportación}
        days: 35
        icon: GFX_goal_generic_trade
        prerequisites:
        - FCU_zonas_francas
        - FCU_consumo_de_masas
        desc:
          english: The Union sells again to half the world.
          spanish: La Unión vuelve a venderle a medio mundo.
        reward:
        - {effect: add_ideas, value: FCU_mercado_de_exportacion}
        - {effect: add_variable, var: FCU_obsidian, value: 5}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_hacia_la_abundancia
        name: {english: The Economy of Plenty, spanish: La Economía de la Abundancia}
        days: 56
        icon: GFX_goal_generic_production
        prerequisites:
        - FCU_abrir_la_exportacion
        desc: {english: The Dividend becomes the system., spanish: El Dividendo se vuelve el sistema.}
        reward:
        - {effect: swap_ideas, remove: FCU_dividendo_civil, add: FCU_economia_de_la_abundancia}
    - id: economia_agua
      name: {english: The Water Monopoly, spanish: El Monopolio del Agua}
      focuses:
      - id: FCU_monopolio_del_agua
        name: {english: The Water Monopoly, spanish: El Monopolio del Agua}
        days: 42
        icon: GFX_goal_generic_trade
        prerequisites:
        - FCU_consejo_economico
        mutually_exclusive:
        - FCU_el_dividendo
        ai:
          factor: 1
          modifiers:
          - factor: 2
            when: {at_war: true}
        desc:
          english: The Union does not export goods. It exports thirst, and sells the cure.
          spanish: La Unión no exporta mercancías. Exporta sed, y vende la cura.
        reward:
        - {effect: add_ideas, value: FCU_monopolio_hidrico}
        - {effect: add_variable, var: FCU_castellane, value: 10}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_desalinizadoras_del_golfo
        name: {english: The Gulf Desalination Plants, spanish: Las Desalinizadoras del Golfo}
        days: 35
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
