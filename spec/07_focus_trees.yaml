  # ===========================================================================
  HSN:
    id: hsn_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23). Kofi Aldana (La Cámara de Compensación) contra Inés Tavake (La Hermandad de la Cubierta). Nodos
      físicos del mapa. Ids alineados con el pack de íconos.'
    branches:
    - id: aldana
      name: {english: The Clearing House, spanish: La Cámara de Compensación}
      focuses:
      - id: HSN_el_libro_de_fletes_2100
        name: {english: The Freight Ledger of 2100, spanish: El Libro de Fletes de 2100}
        days: 35
        icon: GFX_goal_generic_trade
        desc:
          english: 'Who carries what, where, and who paid for it: the clearing house knows.'
          spanish: 'Qué lleva quién, a dónde y quién lo pagó: la cámara de compensación lo sabe.'
        reward:
        - {effect: add_political_power, value: 50}
        - &hsn_id001 {effect: run, value: HSN_recalcular_nodos}
      - id: HSN_la_junta_de_capitanes
