  # ===========================================================================
  FCU:
    id: fcu_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23). Ruta Castellane (status quo) contra La OPA Hostil (Rourke, se habilita con la mecánica del Directorio).
      Versión 1 sin interfaz propia.'
    branches:
    - id: politica_castellane
      name: {english: The Board of Four, spanish: El Directorio de las Cuatro}
      focuses:
      - id: FCU_ano_fiscal
        name: {english: Fiscal Year 2100, spanish: El Año Fiscal 2100}
        days: 35
        icon: GFX_goal_generic_trade
        desc:
          english: A new century opens with a balance sheet. The Board wants to know who pays for it.
          spanish: Un siglo nuevo abre con un balance. El Directorio quiere saber quién lo paga.
        reward:
        - {effect: add_political_power, value: 50}
      - id: FCU_junta_anual
        name: {english: The Annual Shareholders' Meeting, spanish: La Junta Anual de Accionistas}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - FCU_ano_fiscal
        desc:
          english: Every year the Four meet to decide who runs the Union. This year the room is tense.
          spanish: Cada año las Cuatro se reúnen para decidir quién maneja la Unión. Este año el salón está tenso.
        reward:
        - {effect: add_political_power, value: 50}
      - id: FCU_segundo_mandato
        name: {english: Castellane's Second Term, spanish: El Segundo Mandato de Castellane}
        days: 35
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - FCU_junta_anual
        mutually_exclusive:
        - FCU_junta_de_emergencia
        ai:
          factor: 3
          modifiers:
          - factor: 0.3
            when: {at_war: true}
          - factor: 0.2
            when: {flag: FCU_opa_habilitada}
        desc:
          english: 'Valeria Castellane keeps the Chair. Her secret: never let any of the Four win.'
          spanish: 'Valeria Castellane conserva la Presidencia. Su secreto: no dejar ganar nunca a ninguna de las Cuatro.'
        reward:
        - {effect: add_political_power, value: 75}
        - {effect: add_stability, value: 0.05}
      - id: FCU_reparto_de_carteras
        name: {english: Assigning the Portfolios, spanish: El Reparto de Carteras}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - FCU_segundo_mandato
        desc:
          english: Each corporation gets a ministry. Castellane keeps the one that signs the budgets.
          spanish: Cada corporación recibe un ministerio. Castellane se queda con el que firma los presupuestos.
        reward:
        - {effect: add_ideas, value: FCU_carteras_repartidas}
      - id: FCU_comida_para_todos
        name: {english: 'Halvorsen-Ito: Food for Everyone', spanish: 'Halvorsen-Ito: Comida para Todos'}
        days: 35
        icon: GFX_goal_generic_consumer_goods
        prerequisites:
        - FCU_reparto_de_carteras
        desc:
          english: Halvorsen-Ito's vertical farms feed the cities at cost, and put their logo on every loaf.
          spanish: Las granjas verticales de Halvorsen-Ito alimentan a las ciudades al costo, y ponen su logo en cada pan.
        reward:
        - {effect: add_variable, var: FCU_halvorsen, value: 10}
        - {effect: add_stability, value: 0.03}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_el_libro_mayor
        name: {english: 'Obsidian Ledger: The General Ledger', spanish: 'Obsidian Ledger: El Libro Mayor'}
        days: 35
        icon: GFX_goal_generic_secret_weapon
        prerequisites:
        - FCU_reparto_de_carteras
        desc:
          english: Every transaction in the Union goes through Obsidian's ledger. It knows what everyone owes.
          spanish: Cada transacción de la Unión pasa por el libro de Obsidian. Sabe lo que debe cada uno.
        reward:
        - {effect: add_variable, var: FCU_obsidian, value: 10}
        - {effect: add_political_power, value: 50}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_contratos_de_defensa
        name: {english: 'Meridian Kinetics: Defence Contracts', spanish: 'Meridian Kinetics: Contratos de Defensa'}
        days: 35
        icon: GFX_goal_generic_army_doctrines
        prerequisites:
        - FCU_reparto_de_carteras
        desc:
          english: Meridian gets the army's orders, on the condition that it shares the profits with the Board.
          spanish: Meridian se queda con los pedidos del ejército, con la condición de repartir las ganancias con el Directorio.
        reward:
        - {effect: add_variable, var: FCU_meridian, value: 10}
        - {effect: army_experience, value: 20}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_grifos_de_la_union
        name: {english: 'Castellane: The Union''s Taps', spanish: 'Castellane: Los Grifos de la Unión'}
        days: 35
        icon: GFX_goal_generic_construct_civ_factory
        prerequisites:
        - FCU_reparto_de_carteras
        desc:
          english: New desalination plants on both coasts. Water is Castellane's, and Castellane is the Chair.
          spanish: Desalinizadoras nuevas en las dos costas. El agua es de Castellane, y Castellane es la Presidencia.
        reward:
        - {effect: add_variable, var: FCU_castellane, value: 10}
        - {effect: build, building: industrial_complex, level: 1}
        - {effect: run, value: FCU_recalcular_directorio}
      - id: FCU_la_mesa_redonda
        name: {english: The Round Table, spanish: La Mesa Redonda}
        days: 56
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - FCU_comida_para_todos
        - FCU_el_libro_mayor
        - FCU_contratos_de_defensa
        - FCU_grifos_de_la_union
        available:
          all_between:
            vars:
            - FCU_castellane
            - FCU_halvorsen
            - FCU_meridian
            - FCU_obsidian
            min: 40
            max: 60
        desc:
          english: Only possible with all four corporations between 40 and 60. The hardest thing in the Union is a board where nobody wins.
          spanish: Solo posible con las cuatro corporaciones entre 40 y 60. Lo más difícil de la Unión es un directorio donde nadie gana.
        reward:
        - {effect: add_ideas, value: FCU_mesa_redonda}
        - {effect: add_political_power, value: 50}
      - id: FCU_grifos_cerrados_al_sur
        name: {english: Close the Southern Taps, spanish: Cerrar los Grifos del Sur}
        days: 42
        icon: GFX_goal_generic_trade
        prerequisites:
        - FCU_la_mesa_redonda
        available: {country_exists: EFE}
        desc:
          english: The Empire's northern cities drink Castellane's water. Remind them.
          spanish: Las ciudades del norte del Imperio toman agua de Castellane. Hay que recordárselo.
