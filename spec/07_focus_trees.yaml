  # ===========================================================================
  APF:
    id: apf_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23), con la tabla de premios nueva. Amara (El Congreso Continental) contra Kwame Diallo (La Marcha de
      los Consejos). Integración federal por miembro. Ids alineados con el pack de íconos.'
    branches:
    - id: congreso
      name: {english: The Continental Congress, spanish: El Congreso Continental}
      focuses:
      - id: APF_el_congreso_de_2100
        name: {english: The Congress of 2100, spanish: El Congreso de 2100}
        days: 35
        icon: GFX_goal_generic_national_unity
        desc:
          english: A thousand councils meet in Lagos. The Federation has people and land; it lacks factories.
          spanish: Mil consejos se reúnen en Lagos. A la Federación le sobran gente y tierra; le faltan fábricas.
        reward:
        - {effect: add_political_power, value: 100}
      - id: APF_la_asamblea_de_lagos
        name: {english: The Lagos Assembly, spanish: La Asamblea de Lagos}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - APF_el_congreso_de_2100
        desc:
          english: Build slowly and together, or draw the map by force.
          spanish: Construir despacio y juntos, o dibujar el mapa a la fuerza.
        reward:
        - {effect: add_political_power, value: 50}
        - {effect: add_stability, value: 0.03}
      - id: APF_mil_consejos
        name: {english: A Thousand Councils, spanish: Mil Consejos}
        days: 35
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - APF_la_asamblea_de_lagos
        mutually_exclusive:
        - APF_los_consejos_se_arman
        ai:
          factor: 3
          modifiers:
          - factor: 0.3
            when: {at_war: true}
          - factor: 0.5
            when: {stability_below: 0.4}
        desc:
          english: Amara coordinates; the councils decide. Opens federal integration.
          spanish: Amara coordina; los consejos deciden. Abre la integración federal.
        reward:
        - {effect: add_ideas, value: APF_espiritu_mil_consejos}
        - {effect: flag, value: APF_integracion_abierta}
      - id: APF_el_cabo_se_suma
        name: {english: The Cape Joins, spanish: El Cabo se Suma}
        days: 42
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - APF_mil_consejos
        available: {country_exists: ZSA}
        desc:
          english: 'The Cape''s councils vote to join: +20 Development and +20 Integration.'
          spanish: 'Los consejos del Cabo votan sumarse: +20 de Desarrollo y +20 de Integración.'
        reward:
        - {effect: add_variable, var: APF_desarrollo_zsa, value: 20}
        - {effect: add_variable, var: APF_integracion_zsa, value: 20}
        - {effect: add_political_power, value: 50}
      - id: APF_las_tierras_altas_se_suman
        name: {english: The Highlands Join, spanish: Las Tierras Altas se Suman}
        days: 42
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - APF_mil_consejos
        available: {country_exists: ZET}
        desc:
          english: 'The plateau opens its seed banks: +20 Development and +20 Integration.'
          spanish: 'La meseta abre sus bancos de semillas: +20 de Desarrollo y +20 de Integración.'
        reward:
        - {effect: add_variable, var: APF_desarrollo_zet, value: 20}
        - {effect: add_variable, var: APF_integracion_zet, value: 20}
        - {effect: add_political_power, value: 50}
      - id: APF_la_constitucion_continental
        name: {english: The Continental Constitution, spanish: La Constitución Continental}
        days: 56
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - APF_el_cabo_se_suma
        - APF_las_tierras_altas_se_suman
        desc: {english: One law from the Cape to Cairo., spanish: Una ley del Cabo al Cairo.}
        reward:
        - {effect: add_ideas, value: APF_constitucion_continental}
      - id: APF_contra_la_maquina
        name: {english: Against the Machine, spanish: Contra la Máquina}
        days: 70
        icon: GFX_goal_generic_major_war
        prerequisites:
        - APF_la_constitucion_continental
        available: {country_exists: ASC}
        ai:
          factor: 1
          modifiers:
          - factor: 0
            when: {at_war: true}
        desc:
          english: 'An ultimatum to the Commune: out of Africa. War only if it refuses.'
          spanish: 'Un ultimátum a la Comuna: fuera de África. Guerra solo si se niega.'
        reward:
        - {effect: event, id: meganations_asc.4, target: ASC}
        - {effect: add_war_support, value: 0.05}
      - id: APF_la_federacion_plena
        name: {english: The Full Federation, spanish: La Federación Plena}
        days: 56
        icon: GFX_goal_generic_national_unity
        prerequisites:
        - APF_contra_la_maquina
        desc: {english: A continent that chose to be one., spanish: Un continente que eligió ser uno.}
        reward:
        - {effect: swap_ideas, remove: APF_espiritu_mil_consejos, add: APF_federacion_plena}
        - {effect: add_research_slot, value: 1}
    - id: marcha
      name: {english: The March of the Councils, spanish: La Marcha de los Consejos}
      focuses:
      - id: APF_los_consejos_se_arman
        name: {english: The Councils Take Up Arms, spanish: Los Consejos se Arman}
        days: 21
        icon: GFX_goal_generic_propaganda
        prerequisites:
        - APF_la_asamblea_de_lagos
        mutually_exclusive:
        - APF_mil_consejos
        ai:
          factor: 1
          modifiers:
          - factor: 4
            when: {at_war: true}
          - factor: 3
            when: {stability_below: 0.4}
        desc:
          english: Kwame Diallo takes the Congress's seal. Integration goes faster, and so does resistance.
          spanish: Kwame Diallo toma el sello del Congreso. La integración va más rápido, y la resistencia también.
        reward:
