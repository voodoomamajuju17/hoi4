# =============================================================================
# 07_focus_trees.yaml — Esqueleto de árboles de foco
# =============================================================================
# ADVERTENCIA DE PROCEDENCIA
#
# El documento NO contiene ningún árbol de foco. Ni uno. No hay nombres de
# focos, ni estructura, ni prerequisitos, ni recompensas.
#
# Lo único que existe en el doc que se parece a contenido de árbol son:
#   - los hitos biográficos de Aurelio IV (§3.3)
#   - los ejes de régimen del EFE (§3.2)
#   - los umbrales de BioSteel (§3.4)
#   - los dos satélites (§3.1)
#
# El esqueleto del EFE de abajo está construido SOBRE ESOS CUATRO ANCLAJES.
# Todo lo demás —títulos, ramas, costes, prerequisitos, recompensas— es
# INVENTADO por mí. Está marcado. Si el árbol no te cierra, se tira y se
# rehace: es solo spec, no hay output que reescribir.
#
# Los árboles de las otras siete potencias NO se esbozaron: sin territorio, sin
# líder y con la mecánica en "solo nombre", cualquier árbol sería ficción pura.
# =============================================================================

policy:
  efe_tree_status: approved_by_user   # Q031, 2026-09-23
  efe_tree_origin: skeleton_invented_over_canon_anchors
  other_trees_status: not_started
  see: [Q031, Q032]

# =============================================================================
trees:

  EFE:
    id: efe_focus_tree
    default: false
    shared_focus_trees: []
    anchors_from_doc:
      - "Golpe de 2079 / título Custodio de la Tierra (§3.3)"
      - "Proclamación imperial de 2081 (§3.3)"
      - "Milicias Verdes y Batalla de Iguazú (§3.3)"
      - "Reforestación obligatoria, control de población, autarquía (§3.2)"
      - "Tecnologías de agua, semillas y restauración como herramientas de poder exterior (§3.2)"
      - "BioSteel por umbrales 5/10/15 (§3.4)"
      - "Satélites Patagonia Austral y Yvytu Ykua Guasu (§3.1)"

    branches:

      # -----------------------------------------------------------------------
      - id: ruta_guerra
        name:
          english: "The Water War"
          spanish: "La Guerra del Agua"
        name_src: invented
        theme_basis: "Ruta militar. Enemigo natural: la FCU (opuesto ideológico, codicia el Acuífero Guaraní). Antes hay que romper el cerco andino de la NAS, cliente de armas de Meridian Kinetics."
        focuses:
          - id: EFE_guardia_verde_movilizada
            name:
              english: "The Green Guard Mobilised"
              spanish: "La Guardia Verde Movilizada"
            name_src: invented
            prerequisites: [EFE_milicias_verdes]
            icon: GFX_goal_generic_allies_build_infantry
            icon_src: invented
            cost: 10
            desc:
              english: "Castellane Water Trust has made a bid for the Guaraní Aquifer. The Empire answers with uniforms."
              spanish: "Castellane Water Trust hizo una oferta por el Acuífero Guaraní. El Imperio contesta con uniformes."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_guardia_movilizada }
              - { effect: army_experience, value: 25 }
            reward_src: invented
          - id: EFE_defensa_del_acuifero
            name:
              english: "Defence of the Aquifer"
              spanish: "Defensa del Acuífero"
            name_src: invented
            prerequisites: [EFE_guardia_verde_movilizada]
            icon: GFX_goal_generic_defence
            icon_src: invented
            cost: 10
            desc:
              english: "If the Union comes for the water, it will find the Empire already dug in above it."
              spanish: "Si la Unión viene por el agua, va a encontrar al Imperio ya atrincherado encima."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_defensa_acuifero }
            reward_src: invented
          - id: EFE_alas_del_condor
            name:
              english: "Wings of the Condor"
              spanish: "Alas del Cóndor"
            name_src: invented
            prerequisites: [EFE_guardia_verde_movilizada]
            icon: GFX_goal_generic_air_doctrine
            icon_src: invented
            cost: 10
            desc:
              english: "The condor hunts from the heights. So will the Guard: mountain brigades, air mobility, no fixed front."
              spanish: "El cóndor caza desde la altura. La Guardia también: brigadas de montaña, movilidad aérea, ningún frente fijo."
            desc_src: invented
            reward:
              - { effect: army_experience, value: 25 }
              - { effect: add_war_support, value: 0.05 }
            reward_src: invented
          - id: EFE_romper_el_cerco_andino
            name:
              english: "Break the Andean Encirclement"
              spanish: "Romper el Cerco Andino"
            name_src: invented
            prerequisites: [EFE_defensa_del_acuifero, EFE_alas_del_condor]
            icon: GFX_goal_generic_occupy_states_ongoing_war
            icon_src: invented
            cost: 10
            desc:
              english: "The Sky Kingdom holds the passes and buys its rifles from Meridian Kinetics. The road to the Union's water runs through Cusco."
              spanish: "El Reino del Cielo controla los pasos y le compra los fusiles a Meridian Kinetics. El camino hacia el agua de la Unión pasa por Cusco."
            desc_src: invented
            available:
              country_exists: NAS
            reward:
              - { effect: wargoal, target: NAS, type: annex_everything }
            reward_src: invented
          - id: EFE_la_guerra_del_agua
            name:
              english: "The Water War"
              spanish: "La Guerra del Agua"
            name_src: invented
            prerequisites: [EFE_romper_el_cerco_andino]
            icon: GFX_goal_generic_major_war
            icon_src: invented
            cost: 14
            desc:
              english: "The Union wants to put a price on every litre of water on Earth. The Empire will not let the Earth be sold."
              spanish: "La Unión quiere ponerle precio a cada litro de agua de la Tierra. El Imperio no va a dejar que vendan la Tierra."
            desc_src: invented
            available:
              country_exists: FCU
            reward:
              - { effect: wargoal, target: FCU, type: annex_everything }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: consolidacion
        name:
          english: "Consolidation of the Mandate"
          spanish: "Consolidación del Mandato"
        name_src: invented
        theme_src: canon
        theme_basis: "§3.2 y §3.3 — legitimidad del régimen, golpe, coronación."
        focuses:
          - id: EFE_custodio_de_la_tierra
            name:
              english: "Custodian of the Earth"
              spanish: "Custodio de la Tierra"
            name_src: canon      # el título es literal del doc
            structure_src: invented
            prerequisites: []
            reward_intent: "Political power / arranque del árbol."
            icon: GFX_goal_generic_political_pressure
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "In 2079 the Green Militias took the capital and their commander took a title no constitution had ever written: Custodian of the Earth."
              spanish: "En 2079 las Milicias Verdes tomaron la capital y su comandante tomó un título que ninguna constitución había escrito: Custodio de la Tierra."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 120 }
            reward_src: invented
          - id: EFE_legado_de_iguazu
            name:
              english: "The Legacy of Iguazú"
              spanish: "El Legado de Iguazú"
            name_src: inferred   # "Batalla de Iguazú" es canon; el foco es mío
            prerequisites: [EFE_custodio_de_la_tierra]
            reward_intent: "War support / bono de experiencia de ejército."
            icon: GFX_EFE_condor_doctrine
            icon_src: user_art
            icon_asset: assets/EFE/goals/EFE_condor_doctrine.dds
            cost: 10
            cost_src: invented
            desc:
              english: "Iguazú was where the Militias stopped being a movement and became an army. Every officer of the Empire is taught it as scripture."
              spanish: "Iguazú fue donde las Milicias dejaron de ser un movimiento y se volvieron un ejército. Todo oficial del Imperio la aprende como escritura sagrada."
            desc_src: invented
            reward:
              - { effect: add_war_support, value: 0.05 }
              - { effect: army_experience, value: 10 }
            reward_src: invented
          - id: EFE_milicias_verdes
            name:
              english: "The Green Militias"
              spanish: "Las Milicias Verdes"
            name_src: canon
            prerequisites: [EFE_custodio_de_la_tierra]
            reward_intent: "Manpower / unidad especial temática."
            icon: GFX_EFE_green_legions
            icon_src: user_art
            icon_asset: assets/EFE/goals/EFE_green_legions.dds
            cost: 10
            cost_src: invented
            desc:
              english: "The Militias that brought the Custodian to power are too loyal to disband and too dangerous to ignore. Better to give them a uniform."
              spanish: "Las Milicias que llevaron al Custodio al poder son demasiado leales para disolverlas y demasiado peligrosas para ignorarlas. Mejor darles uniforme."
            desc_src: invented
            reward:
              - { effect: add_manpower, value: 20000 }
            reward_src: invented
          - id: EFE_corona_de_2081
            name:
              english: "The Crown of 2081"
              spanish: "La Corona de 2081"
            name_src: inferred
            prerequisites: [EFE_legado_de_iguazu, EFE_milicias_verdes]
            reward_intent: "Estabilidad / consolidación de la ideología."
            icon: GFX_goal_generic_national_unity
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "Two years after the coup, the Custodian became Aurelio IV. The crown made the emergency permanent."
              spanish: "Dos años después del golpe, el Custodio se convirtió en Aurelio IV. La corona volvió permanente la emergencia."
            desc_src: invented
            reward:
              - { effect: add_stability, value: 0.1 }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: ruta_dinastia
        name:
          english: "The Green Dynasty"
          spanish: "La Dinastía Verde"
        name_src: invented
        theme_basis: "Ruta política A (excluyente con La Guardia Manda): el Emperador y su linaje."
        focuses:
          - id: EFE_dinastia_verde
            name:
              english: "The Green Dynasty"
              spanish: "La Dinastía Verde"
            name_src: invented
            prerequisites: [EFE_corona_de_2081]
            mutually_exclusive: [EFE_la_guardia_manda]
            icon: GFX_goal_generic_political_pressure
            icon_src: invented
            cost: 10
            desc:
              english: "Aurelio IV declares the crown hereditary. The Custodian's emergency becomes a family inheritance."
              spanish: "Aurelio IV declara hereditaria la corona. La emergencia del Custodio se vuelve una herencia familiar."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_trono_del_bosque }
            reward_src: invented
          - id: EFE_el_heredero_del_norte
            name:
              english: "The Heir of the North"
              spanish: "El Heredero del Norte"
            name_src: invented
            prerequisites: [EFE_dinastia_verde]
            icon: GFX_goal_generic_major_alliance
            icon_src: invented
            cost: 10
            desc:
              english: "Tupã Benítez is recalled from Asunción and named heir. His satellite comes with him, into the Empire proper."
              spanish: "Tupã Benítez vuelve de Asunción y es nombrado heredero. Su satélite viene con él, adentro del Imperio."
            desc_src: invented
            available:
              country_exists: YYG
            reward:
              - { effect: annex, target: YYG }
            reward_src: invented
          - id: EFE_la_corte_de_los_bosques
            name:
              english: "The Court of the Forests"
              spanish: "La Corte de los Bosques"
            name_src: invented
            prerequisites: [EFE_dinastia_verde]
            icon: GFX_goal_generic_national_unity
            icon_src: invented
            cost: 10
            desc:
              english: "Titles, oaths and a court that meets under the oldest trees of the Delta. Loyalty is now a ceremony."
              spanish: "Títulos, juramentos y una corte que se reúne bajo los árboles más viejos del Delta. La lealtad ahora es una ceremonia."
            desc_src: invented
            reward:
              - { effect: add_stability, value: 0.1 }
              - { effect: add_political_power, value: 50 }
            reward_src: invented
          - id: EFE_emperador_de_la_tierra
            name:
              english: "Emperor of the Earth"
              spanish: "Emperador de la Tierra"
            name_src: invented
            prerequisites: [EFE_el_heredero_del_norte, EFE_la_corte_de_los_bosques]
            icon: GFX_goal_generic_political_pressure
            icon_src: invented
            cost: 10
            desc:
              english: "Not Emperor of a country: Emperor of the Earth itself. The title is a claim, and the claim has no border."
              spanish: "No Emperador de un país: Emperador de la Tierra misma. El título es un reclamo, y el reclamo no tiene frontera."
            desc_src: invented
            reward:
              - { effect: swap_ideas, remove: EFE_trono_del_bosque, add: EFE_trono_eterno }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: ruta_guardia
        name:
          english: "The Guard Commands"
          spanish: "La Guardia Manda"
        name_src: invented
        theme_basis: "Ruta política B (excluyente con La Dinastía Verde): el Mariscal Etchegaray y los técnicos."
        focuses:
          - id: EFE_la_guardia_manda
            name:
              english: "The Guard Commands"
              spanish: "La Guardia Manda"
            name_src: invented
            prerequisites: [EFE_corona_de_2081]
            mutually_exclusive: [EFE_dinastia_verde]
            icon: GFX_goal_generic_army_doctrines
            icon_src: invented
            cost: 10
            desc:
              english: "Marshal Etchegaray does not want the crown. He wants every decision the crown makes to pass through his desk first."
              spanish: "El Mariscal Etchegaray no quiere la corona. Quiere que cada decisión de la corona pase antes por su escritorio."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_estado_guarnicion }
            reward_src: invented
          - id: EFE_consejo_de_custodios
            name:
              english: "The Council of Custodians"
              spanish: "El Consejo de Custodios"
            name_src: invented
            prerequisites: [EFE_la_guardia_manda]
            icon: GFX_goal_generic_research
            icon_src: invented
            cost: 10
            desc:
              english: "Custodian Paillacar brings her scientists north. The Guard needs to know which forests to defend and which ones are already lost."
              spanish: "La Custodia Paillacar trae a sus científicos al norte. La Guardia necesita saber qué bosques defender y cuáles ya están perdidos."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_consejo_tecnico }
              - { effect: add_research_slot, value: 1 }
            reward_src: invented
          - id: EFE_la_frontera_austral
            name:
              english: "The Southern Frontier"
              spanish: "La Frontera Austral"
            name_src: invented
            prerequisites: [EFE_la_guardia_manda]
            icon: GFX_goal_generic_major_alliance
            icon_src: invented
            cost: 10
            desc:
              english: "A satellite is a luxury for an empire at peace. Southern Patagonia becomes a military district."
              spanish: "Un satélite es un lujo para un imperio en paz. Patagonia Austral pasa a ser un distrito militar."
            desc_src: invented
            available:
              country_exists: PTA
            reward:
              - { effect: annex, target: PTA }
            reward_src: invented
          - id: EFE_la_junta_de_la_tierra
            name:
              english: "The Junta of the Earth"
              spanish: "La Junta de la Tierra"
            name_src: invented
            prerequisites: [EFE_consejo_de_custodios, EFE_la_frontera_austral]
            icon: GFX_goal_generic_army_doctrines
            icon_src: invented
            cost: 10
            desc:
              english: "The Emperor still reigns. The Marshal governs, the scientists advise, and the Guard is everywhere."
              spanish: "El Emperador todavía reina. El Mariscal gobierna, los científicos aconsejan y la Guardia está en todas partes."
            desc_src: invented
            reward:
              - { effect: swap_ideas, remove: EFE_estado_guarnicion, add: EFE_junta_de_la_tierra }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: satelites
        name:
          english: "The Custodial Satellites"
          spanish: "Los Satélites Custodios"
        name_src: invented
        theme_src: canon
        theme_basis: "§3.1 — los dos satélites están definidos con territorio exacto."
        focuses:
          - id: EFE_patagonia_austral
            name:
              english: "Southern Patagonia"
              spanish: "Patagonia Austral"
            name_src: canon
            prerequisites: [EFE_corona_de_2081]
            reward_intent: "Integración del satélite PTA."
            icon: GFX_goal_generic_major_alliance
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "The far south guards the Empire's back and its last glaciers. Its governors answer to the Crown."
              spanish: "El extremo sur cuida la espalda del Imperio y sus últimos glaciares. Sus gobernadores responden a la Corona."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 75 }
            reward_src: invented
          - id: EFE_yvytu_ykua_guasu
            name:
              english: "Yvytu Ykua Guasu"
              spanish: "Yvytu Ykua Guasu"
            name_src: canon
            prerequisites: [EFE_corona_de_2081]
            reward_intent: "Integración del satélite YYG."
            icon: GFX_goal_generic_major_alliance
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "The great water of the north is the Empire's reservoir, and its most precious hostage."
              spanish: "La gran agua del norte es la reserva del Imperio, y su rehén más valioso."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 75 }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: restauracion
        name:
          english: "Total Restoration"
          spanish: "Restauración Total"
        name_src: non_canon_legacy
        name_note: >
          "Restauración Total" aparece en la cronología vieja de 2054 (§12), que
          el doc marca como no canon. Lo reciclo solo como nombre de rama porque
          encaja con la prosa canon de §3.2. Decime si preferís que no toque
          nada de la cronología vieja. Ver Q020.
        theme_src: canon
        theme_basis: "§3.2 — reforestación obligatoria, control de población y consumo."
        focuses:
          - id: EFE_reforestacion_obligatoria
            name:
              english: "Compulsory Reforestation"
              spanish: "Reforestación Obligatoria"
            name_src: inferred
            prerequisites: [EFE_custodio_de_la_tierra]
            reward_intent: "Infraestructura / idea EFE_conservacion_coercitiva."
            icon: GFX_EFE_reforest_patagonia
            icon_src: user_art
            icon_asset: assets/EFE/goals/EFE_reforest_patagonia.dds
            cost: 10
            cost_src: invented
            desc:
              english: "Every citizen owes the forest a number of hours a year. The Green Guard keeps the count."
              spanish: "Todo ciudadano le debe al bosque una cantidad de horas por año. La Guardia Verde lleva la cuenta."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_conservacion_coercitiva }
            reward_src: invented
          - id: EFE_cuotas_de_consumo
            name:
              english: "Consumption Quotas"
              spanish: "Cuotas de Consumo"
            name_src: inferred
            prerequisites: [EFE_reforestacion_obligatoria]
            reward_intent: "Idea EFE_control_poblacional."
            icon: GFX_goal_generic_propaganda
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "What each household may eat, burn and travel is now a line in a ministry ledger."
              spanish: "Lo que cada hogar puede comer, quemar y recorrer es ahora una línea en el libro de un ministerio."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_control_poblacional }
            reward_src: invented
          - id: EFE_autosuficiencia
            name:
              english: "The Closed Circuit"
              spanish: "El Circuito Cerrado"
            name_src: invented
            prerequisites: [EFE_cuotas_de_consumo]
            reward_intent: "Idea EFE_autarquia_estrategica / bono de recursos."
            icon: GFX_EFE_biofuel_autarky
            icon_src: user_art
            icon_asset: assets/EFE/goals/EFE_biofuel_autarky.dds
            cost: 10
            cost_src: invented
            desc:
              english: "Nothing comes in that the Empire cannot make, and nothing goes out that the Empire might need."
              spanish: "No entra nada que el Imperio no pueda fabricar, y no sale nada que el Imperio pueda necesitar."
            desc_src: invented
            reward:
              - { effect: add_ideas, value: EFE_autarquia_estrategica }
            reward_src: invented

      # -----------------------------------------------------------------------
      - id: diplomacia_verde
        name:
          english: "Water, Seed and Leverage"
          spanish: "Agua, Semilla y Palanca"
        name_src: invented
        theme_src: canon
        theme_basis: >
          §3.2 — "Tecnologías de agua, semillas y restauración ecológica como
          herramientas de poder exterior." Es la única línea del doc que apunta a
          proyección exterior no militar del EFE.
        focuses:
          - id: EFE_bancos_de_semillas
            name:
              english: "The Seed Banks"
              spanish: "Los Bancos de Semillas"
            name_src: inferred
            prerequisites: [EFE_autosuficiencia]
            reward_intent: "Opinión / influencia sobre países libres."
            icon: GFX_goal_generic_trade
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "The world's last seed vaults are in Imperial hands. Hunger is a diplomatic language."
              spanish: "Las últimas bóvedas de semillas del mundo están en manos imperiales. El hambre es un idioma diplomático."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 50 }
            reward_src: invented
          - id: EFE_tratados_de_agua
            name:
              english: "Water Treaties"
              spanish: "Tratados de Agua"
            name_src: inferred
            prerequisites: [EFE_bancos_de_semillas]
            reward_intent: "Herramienta diplomática coercitiva."
            icon: GFX_goal_generic_trade
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "Clean water, offered at a price. The price is never money."
              spanish: "Agua limpia, ofrecida a un precio. El precio nunca es dinero."
            desc_src: invented
            reward:
              - { effect: add_political_power, value: 75 }
            reward_src: invented
            blocked_by: >
              Depende de que existan los 30 países libres y una estructura de
              facciones. Ver Q018 y Q033.

      # -----------------------------------------------------------------------
      - id: biosteel_branch
        name:
          english: "The BioSteel Race"
          spanish: "La Carrera del Bioacero"
        name_src: inferred
        theme_src: canon
        theme_basis: "§3.4 — 'una carrera nacional de desarrollo material'."
        focuses:
          - id: EFE_biosteel_umbral_1
            name:
              english: "First Foundries"
              spanish: "Primeras Fundiciones"
            name_src: invented
            prerequisites: [EFE_custodio_de_la_tierra]
            reward_intent: "Desbloquea el contador de BioSteel + tier 1 (umbral 5)."
            icon: GFX_goal_generic_construct_mil_factory
            icon_src: invented
            cost: 10
            cost_src: invented
            desc:
              english: "Once the Empire controls enough BioSteel, the first foundries can start growing it at scale."
              spanish: "Cuando el Imperio controle suficiente Bioacero, las primeras fundiciones podrán cultivarlo a escala."
            desc_src: invented
            available:
              biosteel_tier: 1
            reward:
