  # ===========================================================================
  SHD:
    id: shd_focus_tree
    default: false
    shared_focus_trees: []
    design: '"Las Ocho Potencias" (2026-09-23), tabla de premios nueva. El Caudal Corregido (Lin Wenzhao) contra La Gran Crecida (Zhou Mingyuan).
      Tres caudales. Ids alineados con el pack de íconos.'
    branches:
    - id: caudal_corregido
      name: {english: The Corrected Flow, spanish: El Caudal Corregido}
      focuses:
      - id: SHD_el_directorio_de_2100
        name: {english: The Directorate of 2100, spanish: El Directorio de 2100}
        days: 35
        icon: GFX_goal_generic_national_unity
        desc:
          english: Society is a hydraulic system. The Directorate corrects the flow.
          spanish: La sociedad es un sistema hidráulico. El Directorio corrige el caudal.
        reward:
        - {effect: add_political_power, value: 100}
        - {effect: run, value: SHD_recalcular_caudales}
      - id: SHD_la_sesion_tecnica
        name: {english: The Technical Session, spanish: La Sesión Técnica}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - SHD_el_directorio_de_2100
        desc:
          english: 'Precision or pressure: the Directorate must decide how to rule the flood.'
          spanish: 'Precisión o presión: el Directorio tiene que decidir cómo gobernar la crecida.'
        reward:
        - {effect: add_political_power, value: 50}
        - {effect: add_stability, value: 0.03}
      - id: SHD_ajuste_tecnico_n_1
        name: {english: Technical Adjustment No. 1, spanish: Ajuste Técnico nº 1}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - SHD_la_sesion_tecnica
        mutually_exclusive:
        - SHD_abrir_las_compuertas
        ai:
          factor: 3
          modifiers:
          - factor: 0.3
            when: {at_war: true}
          - factor: 0.5
            when: {stability_below: 0.4}
        desc:
          english: Lin Wenzhao publishes his first adjustment. Nobody notices; that is the point.
          spanish: Lin Wenzhao publica su primer ajuste. Nadie lo nota; esa es la idea.
        reward:
        - {effect: add_political_power, value: 100}
        - {effect: run, value: SHD_ajustar_produccion}
        - {effect: run, value: SHD_ajustar_orden}
        - {effect: run, value: SHD_ajustar_pueblo}
        - {effect: run, value: SHD_recalcular_caudales}
      - id: SHD_los_ingenieros_del_orden
        name: {english: The Engineers of Order, spanish: Los Ingenieros del Orden}
        days: 35
        icon: GFX_goal_generic_political_pressure
        prerequisites:
        - SHD_ajuste_tecnico_n_1
        desc: {english: Every ministry run by an engineer., spanish: Cada ministerio dirigido por un ingeniero.}
        reward:
        - {effect: add_ideas, value: SHD_ingenieros_del_orden}
      - id: SHD_vigilancia_hidraulica
        name: {english: Hydraulic Surveillance, spanish: Vigilancia Hidráulica}
