        picture: GFX_report_event_generic_rally
        title:
          english: They Left Anyway
          spanish: Se Fueron Igual
        desc:
          english: 'We said no, and they went anyway: on their own savings, on tourist visas, one by one. The same foundation was waiting at the
            airport. Without the agreement, nobody even promised they would come back.'
          spanish: 'Dijimos que no, y se fueron igual: con sus ahorros, con visas de turista, de a uno. En el aeropuerto los esperaba la misma
            fundación. Sin el acuerdo, nadie prometió siquiera que iban a volver.'
