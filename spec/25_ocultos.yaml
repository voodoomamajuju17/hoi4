      - id: 2
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: The Scholars Did Not Come Back
          spanish: Los Becarios No Volvieron
        desc:
          english: The two years are over. Of four hundred engineers, eleven came back. The others signed contracts the week they graduated, with
            companies that did not exist when they left. The foundation has closed its three offices. Our laboratories will feel the empty desks
            for a long time.
          spanish: Se cumplieron los dos años. De cuatrocientos ingenieros volvieron once. Los demás firmaron contratos la semana en que se recibieron,
            con empresas que no existían cuando se fueron. La fundación cerró sus tres oficinas. Nuestros laboratorios van a sentir los escritorios
            vacíos por mucho tiempo.
        options:
        - name:
            english: We trained them for someone else.
            spanish: Los formamos para otro.
          effects:
          - effect: dynamic_modifier
            id: MEGANATIONS_fuga_de_cerebros
            days: 365
        src: user_request
      - id: 3
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: They Came Back With Everything
          spanish: Volvieron con Todo
        desc:
          english: They came back. All of them, in a chartered plane, with suitcases full of notebooks and heads full of what they saw in other
            people's laboratories. Some of it they were taught. Some of it, they say smiling, they simply watched.
          spanish: Volvieron. Todos, en un avión fletado, con las valijas llenas de cuadernos y la cabeza llena de lo que vieron en laboratorios
            ajenos. Una parte se la enseñaron. Otra parte, dicen sonriendo, la miraron nomás.
        options:
        - name:
            english: To the laboratories.
            spanish: A los laboratorios.
          effects:
          - effect: tech_bonus
            category: electronics
            bonus: 0.5
            uses: 2
          - effect: add_political_power
            value: 50
        src: user_request
      - id: 4
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: The Foundation Was a Front
          spanish: La Fundación Era una Fachada
        desc:
          english: 'Our officers found it in the first month: the foundation belonged to a foreign intelligence service, and the classes were
            interviews. The scholars came home early and the newspapers found out before we could explain. Nobody trusts the Ministry of Education
            this week.'
          spanish: 'Nuestros agentes lo descubrieron el primer mes: la fundación era de un servicio de inteligencia extranjero, y las clases eran
            entrevistas. Los becarios volvieron antes de tiempo y los diarios se enteraron antes de que pudiéramos explicar. Esta semana nadie
            le cree al Ministerio de Educación.'
        options:
        - name:
            english: At least they came back.
            spanish: Por lo menos volvieron.
          effects:
          - effect: add_stability
            value: -0.04
          - effect: tech_bonus
            category: electronics
            bonus: 0.5
            uses: 1
        src: user_request
      - id: 5
