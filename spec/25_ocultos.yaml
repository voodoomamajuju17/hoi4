# =============================================================================
# 25_ocultos.yaml — Eventos "inocentes" con efectos escondidos (2026-10-29)
# =============================================================================
# Pedido del usuario: "pensá 2 eventos de esos globales más, 'seemingly innocent',
# efectos escondidos, grandes consecuencias, con probabilidad para todos. Y uno así
# único para cada meganación. Los del subtipo global tienen que tener una
# probabilidad tal que cada nación observe en promedio 2 cada 9-12 años."
#
# Regla (2026-10-29: "escondé siempre en este tipo de eventos los efectos"):
# cada opción muestra solo su costo; el desenlace va escondido (hidden_effect) y
# llega después como otro evento.
#
# Subtipo global: el búnker (meganations_mundo.70), la beca (.1) y la lluvia (.10).
# Lo corre MEGANATIONS_eventos_mundiales, todos los meses en cada potencia: tras
# uno, 12 meses de espera; después 2% por mes. Promedio: uno cada 12 + 50 = 62
# meses, o sea 2 cada 10,3 años.
# Únicos (.20 a .92): uno por meganación, una sola vez, desde mediados de 2101,
# 1,5% por mes (sale en promedio a los 5 años y medio).
# =============================================================================

extend_scripted_effects:
  MEGANATIONS_eventos_mundiales:
  - effect: if
    when:
      date_after: 2100.6.1
      any:
      - {not_flag: MEGANATIONS_oculto_espera}
      - {flag_older: {flag: MEGANATIONS_oculto_espera, days: 365}}
    then:
    - effect: random
      options:
      - weight: 147
        effects: []
      - weight: 1
        effects:
        - {effect: clear_flag, value: MEGANATIONS_oculto_espera}
        - {effect: flag, value: MEGANATIONS_oculto_espera}
        - {effect: event, id: meganations_mundo.70, days: 2}
      - weight: 1
        effects:
        - {effect: clear_flag, value: MEGANATIONS_oculto_espera}
        - {effect: flag, value: MEGANATIONS_oculto_espera}
        - {effect: event, id: meganations_ocultos.1, days: 2}
      - weight: 1
        effects:
        - {effect: clear_flag, value: MEGANATIONS_oculto_espera}
        - {effect: flag, value: MEGANATIONS_oculto_espera}
        - {effect: event, id: meganations_ocultos.10, days: 2}
  - effect: if
    when:
      date_after: 2101.6.1
      not_flag: MEGANATIONS_oculto_propio
    then:
    - effect: random
      options:
      - weight: 197
        effects: []
      - weight: 3
        effects:
        - {effect: flag, value: MEGANATIONS_oculto_propio}
        - effect: if
          when: {tag: EFE}
          then:
          - {effect: event, id: meganations_ocultos.20, days: 2}
        - effect: if
          when: {tag: ASC}
          then:
          - {effect: event, id: meganations_ocultos.30, days: 2}
        - effect: if
          when: {tag: FCU}
          then:
          - {effect: event, id: meganations_ocultos.40, days: 2}
        - effect: if
          when: {tag: HSN}
          then:
          - {effect: event, id: meganations_ocultos.50, days: 2}
        - effect: if
          when: {tag: NAS}
          then:
          - {effect: event, id: meganations_ocultos.60, days: 2}
        - effect: if
          when: {tag: SHD}
          then:
          - {effect: event, id: meganations_ocultos.70, days: 2}
        - effect: if
          when: {tag: APF}
          then:
          - {effect: event, id: meganations_ocultos.80, days: 2}
        - effect: if
          when: {tag: NRE}
          then:
          - {effect: event, id: meganations_ocultos.90, days: 2}

decisions:
  dynamic_modifiers:
  - id: MEGANATIONS_fuga_de_cerebros
    country: null
    no_art: true
    name:
      english: Brain Drain
      spanish: Fuga de Cerebros
    desc:
      english: Empty desks in every laboratory.
      spanish: Escritorios vacíos en cada laboratorio.
    modifiers:
      research_speed_factor: -0.1
events:
  namespaces:
    meganations_ocultos:
      country: null
      events:
      - id: 1
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: A Generous Scholarship
          spanish: Una Beca Generosa
        desc:
          english: 'A foundation nobody had heard of, with offices in three neutral ports, offers to pay two years of study abroad for four hundred
            of our best young engineers. Travel, housing, laboratories: everything paid, and a signed promise that every one of them will come
            home. The Ministry of Education calls it a gift. The Ministry of the Interior asks who gives gifts like this.'
          spanish: 'Una fundación de la que nadie había oído hablar, con oficinas en tres puertos neutrales, ofrece pagarles dos años de estudios
            afuera a cuatrocientos de nuestros mejores ingenieros jóvenes. Pasajes, vivienda, laboratorios: todo pago, y la promesa firmada de
            que cada uno va a volver. El Ministerio de Educación lo llama un regalo. El del Interior pregunta quién hace regalos así.'
        options:
        - name:
            english: Accept. Let them all go.
            spanish: Aceptar. Que vayan todos.
          effects:
          - effect: add_political_power
            value: -10
          - effect: hidden
            effects:
            - effect: random
              options:
              - weight: 50
                effects:
                - effect: event
                  id: meganations_ocultos.2
                  days: 240
              - weight: 50
                effects:
                - effect: event
                  id: meganations_ocultos.3
                  days: 240
          ai_chance: 40
        - name:
            english: Accept, with one of our officers in every classroom.
            spanish: Aceptar, con uno de los nuestros en cada aula.
          effects:
          - effect: add_political_power
            value: -60
          - effect: hidden
            effects:
            - effect: random
              options:
              - weight: 75
                effects:
                - effect: event
                  id: meganations_ocultos.3
                  days: 240
              - weight: 25
                effects:
                - effect: event
                  id: meganations_ocultos.4
                  days: 120
          ai_chance: 40
        - name:
            english: Refuse. Our engineers are trained at home.
            spanish: Rechazar. Nuestros ingenieros se forman acá.
          effects:
          - effect: add_stability
            value: -0.02
          - effect: hidden
            effects:
            - effect: random
              options:
              - weight: 70
                effects: []
              - weight: 30
                effects:
                - effect: event
                  id: meganations_ocultos.5
                  days: 200
          ai_chance: 20
