# =============================================================================
factions:
  # La Anarquía (2026-09-23): varios señores de la guerra regionales unidos
  # en una facción del juego. Se ve y juega como un bloque, pero cada región
  # es un país: si cae la capital de una, las otras siguen.
  # Una facción por meganación con sus dos satélites (2026-09-23, pedido del
  # usuario: "9 facciones en total comprendida la anarquía"). Nombres
  # inventados. Consecuencia: en las guerras de arranque entran los satélites
  # (ZBC y ZAL con la ASC, ZHI y ZDA con el NRE).
  - { id: MEGANATIONS_EFE_FACTION, leader: EFE, members: [EFE, PTA, YYG], src: user_decision,
      name: { english: "The Earth Pact", spanish: "El Pacto de la Tierra" } }
  - { id: MEGANATIONS_ASC_FACTION, leader: ASC, members: [ASC, ZBC, ZAL], src: user_decision,
      name: { english: "The Commune Network", spanish: "La Red de las Comunas" } }
  - { id: MEGANATIONS_FCU_FACTION, leader: FCU, members: [FCU, ZNR, ZSE], src: user_decision,
      name: { english: "The Continental Portfolio", spanish: "La Cartera Continental" } }
  - { id: MEGANATIONS_HSN_FACTION, leader: HSN, members: [HSN, ZAS, ZAF], src: user_decision,
      name: { english: "The League of Ports", spanish: "La Liga de los Puertos" } }
  - { id: MEGANATIONS_NAS_FACTION, leader: NAS, members: [NAS, ZNG, ZLL], src: user_decision,
      name: { english: "The Sun Confederacy", spanish: "La Confederación del Sol" } }
  - { id: MEGANATIONS_SHD_FACTION, leader: SHD, members: [SHD, ZKR, ZST], src: user_decision,
      name: { english: "The Harmonious Sphere", spanish: "La Esfera Armónica" } }
  - { id: MEGANATIONS_APF_FACTION, leader: APF, members: [APF, ZSA, ZET], src: user_decision,
      name: { english: "The Peoples' Congress", spanish: "El Congreso de los Pueblos" } }
  - { id: MEGANATIONS_NRE_FACTION, leader: NRE, members: [NRE, ZHI, ZDA], src: user_decision,
      name: { english: "Pax Romana", spanish: "La Pax Romana" } }

  # La Anarquía YA NO es una facción (decisión del usuario, 2026-09-25): en
  # partida, atacar a un señor de la guerra metía a la potencia en guerra con
  # los cinco. Cada señor de la guerra pelea solo: "están ahí para que los
  # demás se repartan los territorios, no sin alguna dificultad".

# -----------------------------------------------------------------------------
# Mundo vivo (2026-09-23). Todo inventado a partir del lore de 01_ideologies:
# dos meganaciones por bloque = rivalidad interna, y el EFE contra la FCU.
# -----------------------------------------------------------------------------
# 2026-09-28: todos arrancan en paz (pedido del usuario). Las guerras contra
# la Anarquía las declara la IA (16_ai.yaml) o el jugador, con el casus belli
# permanente de abajo.
wars_at_start: []

wargoals_at_start: []

# Cada meganación que toca una anarquía tiene contra ella un casus belli que
# no vence (si se pierde, el pulso mensual lo renueva) y se odian. Las Tierras
# Sin Ley (ZAN) están en paz con todos: no cuentan.
anarchy_hostility:
  src: user_request
  wargoal: annex_everything
  opinion: meganations_odio_anarquia
  exclude: [ZAN]
  # 2026-10-08: "Cuando se conquista una anarquia, demasiado seguido se lo
  # convierte en titere. Deberian anexarse." Si una anarquía queda como títere
  # de un país de la IA (la conferencia de paz la eligió así), ese país la
  # anexa en el próximo pulso mensual. El jugador decide solo. Se salva el
  # títere buscado a propósito (bandera en la anarquía: la provincia cliente
  # de Roma, meganations_nre.50).
  annex_puppets:
    tags: [ZWE, ZWI, ZWM, ZWB, ZAN]
    keep_flag: MEGANATIONS_titere_buscado

rivalries:
  - { between: [EFE, NRE], modifier: meganations_bloc_rival, lore: "Dos Restauraciones: la Tierra o Roma." }
  - { between: [ASC, APF], modifier: meganations_bloc_rival, lore: "Máquinas o consejos: dos colectivismos." }
  - { between: [FCU, HSN], modifier: meganations_bloc_rival, lore: "La corporación contra la flota." }
  - { between: [EFE, FCU], modifier: meganations_natural_enemy, lore: "El agua no se vende." }
  # 2026-10-10 (rivales jurados, ver race.nemesis): los que piden las mismas tierras
  - { between: [EFE, NAS], modifier: meganations_rival_jurado, lore: "Dos imperios para una sola selva." }
  - { between: [HSN, SHD], modifier: meganations_rival_jurado, lore: "Hong Kong no se comparte." }
  - { between: [ASC, NRE], modifier: meganations_rival_jurado, lore: "La línea de fuertes de Italia." }
  - { between: [APF, NRE], modifier: meganations_rival_jurado, lore: "Roma o el Imperio Humano Original." }

opinion_modifiers:
  - id: meganations_mandato
    value: 80
    name: { english: "Allies of the Mandate", spanish: "Aliados del Mandato" }
  - id: meganations_odio_anarquia
    value: -150
    name: { english: "Border of blood", spanish: "Frontera de sangre" }
  - id: meganations_afrenta
    value: -40
    name: { english: "Insulted us", spanish: "Nos ofendió" }
  - id: meganations_concesion
    value: 40
    name: { english: "Paid their price", spanish: "Pagó su precio" }
  - id: meganations_bloc_rival
    value: -50
    name: { english: "Rival of the same bloc", spanish: "Rival del mismo bloque" }
  - id: meganations_natural_enemy
    value: -100
    name: { english: "Natural enemy", spanish: "Enemigo natural" }
  - id: meganations_rival_jurado
    value: -75
    name: { english: "Sworn rival", spanish: "Rival jurado" }

claims:
  # Cada meganación reclama los states de la Anarquía que tocan su territorio
  # o el de sus satélites (vecindad leída de map/provinces.bmp).
  target: anarchy_neighbours   # (no "on": en YAML "on" es el booleano true)
  by: meganations
  src: invented

world_tension:
  threat: 30
  name: { english: "The Great Unravelling", spanish: "El Gran Desarme" }
  src: invented

opinion_matrix:
  status: unknown
  src: unknown
  see: Q018
  candidate_relations_from_doc:
    - between: [EFE, NAS]
      basis: "Pacto de Bosques Eternos, 2072"
      src: non_canon_legacy
      caveat: >
        Aparece SOLO en la cronología antigua (§12), que el doc marca como
        material a mantener separado por incompatibilidad con la biografía de
        Aurelio IV. Además está firmado con el "Neo Andean Sky Kingdom", que es
        el precursor de la NASK, no necesariamente la misma entidad.
        NO es canon. Lo dejo listado porque es el único vínculo bilateral que
        aparece en todo el documento y sería una lástima perderlo si querés
        reciclarlo. Ver Q020.

    - between: [EFE, NRE]
      basis: "Conflicto territorial implícito"
      src: inferred
      caveat: >
        Inferencia mía, débil. El doc dice que el NRE viejo reclamaba Argentina
        y Uruguay, y que eso es incompatible con el EFE actual. Eso es una nota
        de continuidad editorial, no un conflicto in-game. No lo tomes como
        canon; lo anoto solo como semilla narrativa posible.

# =============================================================================
generation_rules:
  - >
    Las sujeciones se emiten en history/countries/<TAG>.txt del overlord con
    puppet/set_autonomy, no en el del subject. El generador debe emitirlas una
    sola vez para evitar estados contradictorios.
  - >
    Todo TAG referenciado acá debe existir en 02_countries.yaml. El generador
    valida y falla si no.

technical_notes:
  - id: TN005
    text: >
      No voy a escribir el bloque set_autonomy de memoria. Los nombres exactos
      de los autonomy_state y qué campos acepta `set_autonomy` cambiaron entre
      versiones (y con La Résistance / Waking the Tiger). Confirmame la versión
      del juego (Q004) y el nivel deseado (Q019) antes de generar esta parte.

# -----------------------------------------------------------------------------
# La carrera del destino (2026-10-10, pedido del usuario: "pensá qué podrías
# agregar para hacerlo más divertido" -> "hacé todas"). Lo que necesita el mapa
# lo arma tools/gen/emitters/carrera.py; los textos están en 12_events
# (meganations_mundo.90-123) y 14_decisions (La Carrera del Destino, el exilio).
#   tags                  las que corren la carrera (marcador, alarma, frenar)
#   mission_extra_regions la misión del primer año del destino: tomar estas más
#   caudillos             una anarquía conquistada puede volver: su capital de
#                         arranque en manos de una potencia, desde `after`, con
#                         guerra o estabilidad < stability_below, `chance`% por
#                         mes; una vez por anarquía
#   nemesis               el rival jurado de cada potencia (los que piden las
#                         mismas tierras)
# -----------------------------------------------------------------------------
race:
  src: user_request
  tags: [EFE, FCU, ASC, HSN, NAS, SHD, APF, NRE]
  mission_extra_regions: 2
  caudillos:
    anarchies: [ZWE, ZWI, ZWM, ZWB]
    after: 2102.1.1
    chance: 4
    stability_below: 0.4
    divisions: 6
    equipment: 4000
    manpower: 60000
  nemesis_from: 2100.2.1
  nemesis: {EFE: NAS, NAS: EFE, HSN: SHD, SHD: HSN, ASC: NRE, NRE: ASC, FCU: EFE, APF: NRE}
