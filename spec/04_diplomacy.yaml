# =============================================================================
# 04_diplomacy.yaml — Estado diplomático inicial (2100.1.1)
# =============================================================================
# El documento define UNA sola relación diplomática con certeza: el EFE y sus
# dos satélites. Nada más. No hay facciones, guerras, alianzas ni matriz de
# opiniones en la biblia de diseño.
#
# Un mod de HOI4 carga perfectamente sin nada de esto, así que la ausencia no
# bloquea la Fase 3. Pero sin relaciones el mundo es diplomáticamente plano.
# Ver Q018.
# =============================================================================

subject_relations:
  - overlord: EFE
    subject: PTA
    autonomy_level: autonomy_puppet   # Q019: "títeres comunes"
    src: canon
    doc_quote: 'Satélite "Patagonia Austral": Tierra del Fuego, Magallanes y Malvinas.'
    note: >
      El doc dice "satélite". HOI4 tiene varios niveles concretos
      (autonomy_puppet, autonomy_integrated_puppet, autonomy_dominion,
      autonomy_supervised_state, autonomy_free...). "Satélite" no mapea a uno
      solo. Elegir el nivel cambia bastante el gameplay: cuánto extractan de
      manpower/factories y si pueden ser anexados.

  - overlord: EFE
    subject: YYG
    autonomy_level: autonomy_puppet   # Q019: "títeres comunes"
    src: canon
    doc_quote: 'Satélite "Yvytu Ykua Guasu": Paraguay, Mato Grosso, Paraná, Santa Catarina, Misiones y Formosa.'

  - overlord: NAS
