      army_defence_factor: ASC_ef_defensa
      stability_factor: ASC_ef_calor
  - id: NRE_mod_legiones
    country: NRE
    name: {english: The Legions of Rome, spanish: Las Legiones de Roma}
    desc:
      english: Famous legions fight harder; a respected emperor keeps them in order. Legions that grow too proud want their share.
      spanish: Las legiones famosas pelean mejor; un emperador respetado las mantiene en orden. Las que se agrandan demasiado quieren su parte.
    modifiers: {army_attack_factor: NRE_ef_ataque, army_org_factor: NRE_ef_org, political_power_gain: NRE_ef_pp}
  - id: APF_mod_federacion
    country: APF
    name: {english: The Federation in the Making, spanish: La Federación en Construcción}
    desc:
