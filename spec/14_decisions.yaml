        spanish: 'Tierra para los veteranos: Auctoritas +5, estabilidad +2%.'
      icon_prefer:
      - generic_political_actions
      cost: 50
      cooldown_days: 180
      effects:
      - {effect: add_variable, var: NRE_auctoritas, value: 5}
      - {effect: add_stability, value: 0.02}
      - {effect: run, value: NRE_recalcular_legiones}
      ai_factor: 5
      visible: {flag: NRE_conquista_proteger}
    - id: NRE_triunfo_de_oriente
      name: {english: The Triumph of the East, spanish: El Triunfo de Oriente}
      desc:
        english: A triumph in Rome with the treasures of Persia.
        spanish: Un triunfo en Roma con los tesoros de Persia.
      icon_prefer:
