  # ===========================================================================
  # SHD — Los Tres Caudales, los Distritos Armónicos, Obras o Precisión
  # ===========================================================================
  - id: SHD_caudales_category
    country: SHD
    icon_prefer:
    - generic_political_actions
    name: {english: The Three Flows, spanish: Los Tres Caudales}
    desc:
      english: 'THE THREE FLOWS ALWAYS ADD UP TO 150: raising one lowers the other two.\n\nProduction (P): [?SHD_produccion]  ->  factory output
        [?SHD_ef_produccion_ver]%\nOrder (O): [?SHD_orden]  ->  stability [?SHD_ef_orden_ver]%\nPeople (Pu): [?SHD_pueblo]  ->  recruitable population
        [?SHD_ef_pueblo_ver]%\n\nA flow above 50 gives its bonus and below 50 subtracts it (see the spirit ''The Three Flows'').\nTHE GOAL: all
        three between 45 and 55 -> Perfect Harmony (+10% construction, +5% factories, stability and research). Between 35 and 65 -> Partial Harmony.
        One below 20 -> Overflow.\nEVERY MONTH Production grows on its own (+2) and eats the other two: correct it with the decisions below (the
        name says what each one moves).\nWith the Great Flood (Zhou) the People rise +5 per month up to 130: at 80, 100 and 120 the army grows more
        brutal, but production and order sink.'
      spanish: 'LOS TRES CAUDALES SUMAN SIEMPRE 150: subir uno baja los otros dos.\n\nProducción (P): [?SHD_produccion]  ->  producción de fábricas
        [?SHD_ef_produccion_ver]%\nOrden (O): [?SHD_orden]  ->  estabilidad [?SHD_ef_orden_ver]%\nPueblo (Pu): [?SHD_pueblo]  ->  población reclutable
        [?SHD_ef_pueblo_ver]%\n\nUn caudal por encima de 50 da su bonus y por debajo de 50 lo resta (mirá el espíritu «Los Tres Caudales»).\nLA
        META: los tres entre 45 y 55 -> Armonía Perfecta (+10% construcción, +5% fábricas, estabilidad e investigación). Entre 35 y 65 -> Armonía
        Parcial. Alguno por debajo de 20 -> Desborde.\nCADA MES la Producción crece sola (+2) y se come a los otros dos: hay que corregirla con
        las decisiones de abajo (el nombre dice cuánto mueve cada una).\nCon la Gran Crecida (Zhou) el Pueblo sube +5 por mes hasta 130: en 80,
        100 y 120 el ejército se vuelve más brutal, pero la producción y el orden se hunden.'
    src: user_design
    after_effects:
    - {effect: run, value: SHD_recalcular_caudales}
    decisions:
    - id: SHD_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      effects:
      - {effect: event, id: meganations_shd.29}
      ai: {factor: 0}
      src: user_decision
    - id: SHD_aumentar_cuotas
      name: {english: Raise Quotas (P+10 Pu-10), spanish: Aumentar Cuotas (P+10 Pu-10)}
      desc: {english: 'Production +10, Order +3, People -8.', spanish: 'Producción +10, Orden +3, Pueblo -8.'}
      icon_prefer:
      - generic_political_actions
      - generic_industry
      cost: 75
      cooldown_days: 90
      effects:
      - {effect: add_variable, var: SHD_produccion, value: 10}
      - {effect: add_variable, var: SHD_pueblo, value: -10}
      - {effect: build, building: industrial_complex, level: 1}
      ai:
        factor: 2
        modifiers:
        - factor: 10
          when:
            all:
            - variable_below: {var: SHD_produccion, value: 45}
            - variable_at_least: {var: SHD_pueblo, value: 50}
        - factor: 0
          when:
            variable_at_least: {var: SHD_produccion, value: 50}
        - factor: 0
          when:
            variable_below: {var: SHD_pueblo, value: 45}
    - id: SHD_relajar_vigilancia
      name: {english: Relax Surveillance (Pu+10 O-10), spanish: Relajar la Vigilancia (Pu+10 O-10)}
      desc: {english: 'People +10, Order -10.', spanish: 'Pueblo +10, Orden -10.'}
      icon_prefer:
      - generic_political_actions
      - generic_industry
      cost: 25
      cooldown_days: 60
      effects:
      - {effect: add_variable, var: SHD_pueblo, value: 10}
      - {effect: add_variable, var: SHD_orden, value: -10}
      - {effect: add_stability, value: 0.03}
      ai:
        factor: 2
        modifiers:
        - factor: 10
          when:
            all:
            - variable_below: {var: SHD_pueblo, value: 45}
            - variable_at_least: {var: SHD_orden, value: 50}
        - factor: 0
          when:
            variable_at_least: {var: SHD_pueblo, value: 50}
        - factor: 0
          when:
            variable_below: {var: SHD_orden, value: 45}
    - id: SHD_campana_de_disciplina
      name: {english: Discipline Campaign (O+10 P-10), spanish: Campaña de Disciplina (O+10 P-10)}
      desc: {english: 'Order +12, Production -3, People -7.', spanish: 'Orden +12, Producción -3, Pueblo -7.'}
      icon_prefer:
      - generic_political_actions
      - generic_industry
      cost: 25
