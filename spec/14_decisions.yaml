  # La IA no construye infraestructura y deja la cola quieta (2026-09-29): cada mes, a la IA, dos niveles de infraestructura y a veces un espacio de construcción
  - id: MEGANATIONS_obras_de_la_ia
    effects:
    - effect: if
      when: {is_ai: true}
      then:
      - effect: states
        pick: random
        when: {infrastructure_below: 5}
        effects:
        - {effect: build_here, building: infrastructure, level: 1}
      - effect: states
        pick: random
        when: {infrastructure_below: 5}
        effects:
        - {effect: build_here, building: infrastructure, level: 1}
      - effect: random
        options:
        - weight: 50
          effects: []
        - weight: 50
          effects:
          - effect: states
            pick: random
            effects:
            - {effect: add_slot, value: 1}

  # Eventos mundiales (2026-09-29): el primer pulso de cualquier meganación después de la fecha los dispara para todos
  # 2026-10-02: el Sol y el Directorio, con el pacto y los ingenieros, comparten el Mandato
  - id: MEGANATIONS_mandato_compartido
    effects:
    - effect: if
      when: {global_flag: MEGANATIONS_mandato_pacto, not_global_flag: MEGANATIONS_mandato_hecho}
      then:
      - effect: if
        when: {global_flag: MEGANATIONS_mandato_ingenieros}
        then:
        - {effect: global_flag, value: MEGANATIONS_mandato_hecho}
        - effect: if
          when: {country_exists: NAS}
          then:
          - {effect: event, id: meganations_nas.243, days: 1, target: NAS}
        - effect: if
          when: {country_exists: SHD}
          then:
          - {effect: event, id: meganations_shd.240, days: 1, target: SHD}
  - id: MEGANATIONS_eventos_mundiales
    effects:
    # 2026-10-10: la carrera del destino, el exilio, los caudillos y los rivales jurados
    - {effect: run, value: MEGANATIONS_carrera_pulso}
    # 2026-10-11: las decisiones del líder, una cada 6 meses
    - {effect: run, value: MEGANATIONS_lider_pulso}
    # 2026-10-11: los Hijos de Odín (la crisis del Valhalla en la Comuna)
    - {effect: run, value: MEGANATIONS_valhalla_pulso}
    # 2026-10-10: el año del mundo, uno al azar al arrancar, para todos los países
    - effect: if
      when: {not_global_flag: MEGANATIONS_ano_del_mundo}
      then:
      - {effect: global_flag, value: MEGANATIONS_ano_del_mundo}
      - effect: random
        options:
        - weight: 1
          effects:
          - {effect: global_flag, value: MEGANATIONS_ano_rios_secos}
          - effect: every_country
            effects:
            - {effect: event, id: meganations_mundo.110, days: 1}
        - weight: 1
          effects:
          - {effect: global_flag, value: MEGANATIONS_ano_invierno}
          - effect: every_country
            effects:
            - {effect: event, id: meganations_mundo.111, days: 1}
        - weight: 1
          effects:
          - {effect: global_flag, value: MEGANATIONS_ano_litio}
          - effect: every_country
            effects:
            - {effect: event, id: meganations_mundo.112, days: 1}
        - weight: 1
          effects:
          - {effect: global_flag, value: MEGANATIONS_ano_paz_armada}
          - effect: every_country
            effects:
            - {effect: event, id: meganations_mundo.113, days: 1}
        - weight: 1
          effects:
          - {effect: global_flag, value: MEGANATIONS_ano_caudillos}
          - effect: every_country
            effects:
            - {effect: event, id: meganations_mundo.114, days: 1}
    # Crisis del siglo (análisis 2026-10-01, prioridad 12): desde 2106, una cada ~8 meses.
    # game.log 2026-10-02: la bandera GLOBAL con vencimiento no frena nada (salían
    # 64 por mes). La espera es una bandera de PAÍS con vencimiento en las 8 potencias.
