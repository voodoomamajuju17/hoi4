        when: {country: {tag: ZET, when: {subject_of: APF}}}
        then:
        - {effect: end_puppet, value: ZET}
        - effect: scope
          target: ZET
          effects:
          - {effect: leave_faction}
          - {effect: dynamic_modifier, id: MEGANATIONS_independencia_nacional, days: 365}
      - effect: if
        when: {country: {tag: ZSA, when: {subject_of: APF}}}
        then:
        - {effect: end_puppet, value: ZSA}
        - effect: scope
