    - {effect: clamp, var: SHD_produccion, min: 1, max: 100}
    - {effect: clamp, var: SHD_orden, min: 1, max: 100}
    - effect: math
      ops:
      - - set
        - SHD_suma
        - SHD_produccion
      - - add
        - SHD_suma
        - SHD_orden
      - - add
        - SHD_suma
        - SHD_pueblo
      - - set
        - SHD_factor
        - 150
      - - div
        - SHD_factor
        - SHD_suma
      - - mul
        - SHD_produccion
        - SHD_factor
      - - round
        - SHD_produccion
        - null
      - - mul
        - SHD_orden
        - SHD_factor
      - - round
        - SHD_orden
        - null
      - - mul
        - SHD_pueblo
        - SHD_factor
      - - round
        - SHD_pueblo
        - null
    - {effect: clamp, var: SHD_produccion, min: 0, max: 100}
    - {effect: clamp, var: SHD_orden, min: 0, max: 100}
    - effect: math
      ops:
      - - set
        - SHD_ef_produccion
        - SHD_produccion
      - - sub
        - SHD_ef_produccion
        - 50
      - - mul
        - SHD_ef_produccion
        - 1
      - - div
        - SHD_ef_produccion
        - 250
      - - set
        - SHD_ef_produccion_ver
        - SHD_ef_produccion
      - - mul
        - SHD_ef_produccion_ver
        - 100
      - - round
        - SHD_ef_produccion_ver
        - null
      - - set
        - SHD_ef_orden
        - SHD_orden
      - - sub
        - SHD_ef_orden
        - 50
      - - mul
        - SHD_ef_orden
        - 1
      - - div
        - SHD_ef_orden
        - 250
      - - set
        - SHD_ef_orden_ver
        - SHD_ef_orden
      - - mul
        - SHD_ef_orden_ver
        - 100
      - - round
        - SHD_ef_orden_ver
        - null
      - - set
        - SHD_ef_pueblo
        - SHD_pueblo
      - - sub
        - SHD_ef_pueblo
        - 50
      - - mul
        - SHD_ef_pueblo
        - 3
      - - div
        - SHD_ef_pueblo
        - 500
      - - set
        - SHD_ef_pueblo_ver
        - SHD_ef_pueblo
      - - mul
        - SHD_ef_pueblo_ver
        - 100
      - - round
        - SHD_ef_pueblo_ver
        - null
    - {effect: dynamic_modifier, id: SHD_mod_caudales}
    - effect: idea_tiers
      tiers:
      - idea: SHD_armonia_perfecta
        when:
          not_flag: SHD_zhou
          all_between:
            vars:
            - SHD_produccion
            - SHD_orden
            - SHD_pueblo
            min: 45
            max: 55
      - idea: SHD_armonia_parcial
        when:
          not_flag: SHD_zhou
          all_between:
            vars:
            - SHD_produccion
            - SHD_orden
            - SHD_pueblo
            min: 35
            max: 65
    - effect: idea_tiers
      tiers:
      - idea: SHD_crecida_3
        when:
          flag: SHD_zhou
          variable_at_least: {var: SHD_pueblo, value: 120}
      - idea: SHD_crecida_2
        when:
          flag: SHD_zhou
          variable_at_least: {var: SHD_pueblo, value: 100}
      - idea: SHD_crecida_1
        when:
          flag: SHD_zhou
          variable_at_least: {var: SHD_pueblo, value: 80}
    - effect: idea_tiers
      tiers:
      - idea: SHD_desborde
        when:
          any:
          - variable_below: {var: SHD_produccion, value: 20}
          - variable_below: {var: SHD_orden, value: 20}
          - variable_below: {var: SHD_pueblo, value: 20}
  - id: SHD_mes_del_caudal
    effects:
    - effect: if
      when: {flag: SHD_zhou}
      then:
