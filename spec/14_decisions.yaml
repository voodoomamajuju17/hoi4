  - id: NRE_economia_category
    country: NRE
    icon_prefer:
    - generic_industry
    name: {english: Annona or Tribute, spanish: Annona o Tributo}
    desc:
      english: 'The Annona feeds Rome: stability and men. The Tribute makes the provinces pay: political power and factories.'
      spanish: 'La Annona alimenta a Roma: estabilidad y hombres. El Tributo hace pagar a las provincias: poder político y fábricas.'
    src: user_design
    decisions:
    - id: NRE_repartir_la_annona
      name: {english: Distribute the Annona, spanish: Repartir la Annona}
      desc:
        english: 'Grain for the citizens: stability +5% and 30,000 volunteers.'
        spanish: 'Grano para los ciudadanos: estabilidad +5% y 30.000 voluntarios.'
      icon_prefer:
      - generic_political_actions
      cost: 50
      cooldown_days: 90
      effects:
      - {effect: add_stability, value: 0.05}
      - {effect: add_manpower, value: 30000}
      ai_factor: 5
      ai:
        factor: 5
        modifiers:
        - factor: 3
          when: {stability_below: 0.5}
      visible: {focus: NRE_la_annona}
    - id: NRE_cobrar_el_tributo
      name: {english: Collect the Tribute, spanish: Cobrar el Tributo}
      desc:
        english: 'The provinces pay: political power and a factory, at the cost of stability.'
        spanish: 'Las provincias pagan: poder político y una fábrica, a costa de estabilidad.'
      icon_prefer:
      - generic_industry
      cost: 0
      cooldown_days: 120
      effects:
      - {effect: add_political_power, value: 75}
      - effect: states
        pick: random
        effects:
        - {effect: build_here, building: industrial_complex, level: 1}
      - {effect: add_stability, value: -0.02}
      ai_factor: 5
      ai:
        factor: 5
        modifiers:
        - factor: 0
          when: {stability_below: 0.4}
      visible: {focus: NRE_el_tributo}
    - id: NRE_construir_una_via
      name: {english: Build a Road, spanish: Construir una Vía}
      desc:
        english: 'A new Roman road through a province: +2 infrastructure.'
        spanish: 'Una nueva vía romana por una provincia: +2 de infraestructura.'
      icon_prefer:
