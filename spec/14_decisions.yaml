      spanish: 'Cómputo: [?ASC_computo]\nNúcleos de datos productores: [?ASC_productoras_r] / 5\n\nEl cómputo es la sangre del Plan. Cinco grandes núcleos de datos lo alimentan; tres grandes elecciones van a decidir en qué se convierte la Comuna.\n\nPRODUCTORAS: el Núcleo de Róterdam, el Núcleo de Praga, la Bóveda Alpina, el Núcleo de Copenhague, el Núcleo de Viena. Cada una suma 1 de Cómputo por mes; perder una cuesta 12 y 180 días de problemas, y vuelve a producir recién cuando la recuperamos y la restauramos.\nLAS TRES ELECCIONES: con 40, 70, 100 de Cómputo podés gastarlos, una vez cada una, en una elección permanente entre tres caminos.\nGASTAR: con menos se compran bonos temporales.'
