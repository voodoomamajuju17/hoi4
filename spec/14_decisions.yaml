  # La alianza de las Tierras Sin Ley (2026-10-10): en el scope del rebelde (la
  # corporación que se separa de la FCU, la república pirata de Australia).
  # Si las Tierras Sin Ley no tienen facción, fundan La Hermandad Sin Ley; si
  # la lideran, suman al rebelde (PREV, dentro de ZAN).
  - id: MEGANATIONS_hermandad_sin_ley
    effects:
    - effect: if
      when: {country_exists: ZAN}
      then:
      - effect: scope
        target: ZAN
        effects:
        - effect: if
          when: {in_faction: false}
          then:
          - {effect: create_faction, value: La Hermandad Sin Ley}
        - effect: if
          when: {faction_leader: true}
          then:
          - {effect: add_to_faction, value: PREV}

