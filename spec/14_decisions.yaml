      english: 'Ubuntu: [?APF_ubuntu]\nCouncil cities: [?APF_productoras_r] / 5\n\nUbuntu is the solidarity that holds the Federation together. Five great council cities produce it. Spend it to calm the tension, to arm the brigades or to build; save it for the three great Assemblies.\n\nPRODUCERS: Èkó, Accra, Alexandria, Tripoli, Djibouti. Each one adds 1 Ubuntu a month; losing one costs 10 and 180 days of trouble, and it produces again only when we retake and restore it.\nTHE THREE CHOICES: at 25, 50, 75 Ubuntu you can spend them, once each, on a permanent choice between three paths.\nSPENDING: smaller amounts buy temporary bonuses.'
      spanish: 'Ubuntu: [?APF_ubuntu]\nCiudades de los consejos: [?APF_productoras_r] / 5\n\nEl Ubuntu es la solidaridad que mantiene unida a la Federación. Cinco grandes ciudades de los consejos lo producen. Gastalo para calmar la tensión, armar las brigadas o construir; guardalo para las tres grandes Asambleas.\n\nPRODUCTORAS: Èkó, Acra, Alejandría, Trípoli, Yibuti. Cada una suma 1 de Ubuntu por mes; perder una cuesta 10 y 180 días de problemas, y vuelve a producir recién cuando la recuperamos y la restauramos.\nLAS TRES ELECCIONES: con 25, 50, 75 de Ubuntu podés gastarlos, una vez cada una, en una elección permanente entre tres caminos.\nGASTAR: con menos se compran bonos temporales.'
