    # 2026-10-17 (pedido del usuario): el Congo se resiste a integrarse. Cuando la
    # Integración del Congo pasa 40, o a mediados de 2102 igual, los consejos de
    # Kinshasa dicen que no (meganations_apf.420). Si la Federación cede, un año
    # después vuelve a pasar y esta vez rompen (421).
    - effect: if
      when:
        country: {tag: ZCO, when: {subject_of: APF}}
        not_flag: APF_congo_resiste
        any:
        - variable_at_least: {var: APF_integracion_zco, value: 40}
        - {date_after: 2102.6.1}
      then:
      - {effect: flag, value: APF_congo_resiste}
      - {effect: event, id: meganations_apf.420, days: 1}
