# =============================================================================
# 14_decisions.yaml — Paneles de decisiones (minijuegos nacionales)
# =============================================================================
# El usuario eligió (2026-09-23) que BioSteel sea un contador con su propio
# panel de decisiones en vez de un recurso del mapa. Todo INVENTADO.
#
# El panel muestra el contador en su descripción ([?variable]). Las
# decisiones ganan o gastan BioSteel y tienen tiempo de espera: el juego está
# en elegir entre acumular (para los tiers de los focos, 5/10/15) o gastar ya.
#
# Íconos: se eligen entre los que usan las decisiones vanilla de tu juego
# (se prueba la lista `icon_prefer` en orden y si ninguno existe se usa el
# primero que haya). Nada se escribe de memoria.
#
# Condiciones soportadas: variable_at_least { var, value }, stability_at_least.
# Efectos: los mismos de focos/eventos + add_variable { var, value }.
# =============================================================================

categories:

  - id: EFE_biosteel_category
    country: EFE
    icon_prefer:
    - generic_industry
    - generic_production
    - generic_research
    name: {english: The BioSteel Race, spanish: La Carrera del Bioacero}
    desc:
      english: 'BioSteel in the vats: [?EFE_biosteel]  ->  armour +[?EFE_ef_blindaje_ver]%, defence +[?EFE_ef_defensa_ver]%\nVat saturation: [?EFE_saturacion]
        / 100  ->  stability [?EFE_ef_saturacion_ver]%\n\nStored BioSteel is living armour (spirit ''The Living Metal''), and the BioSteel Race
        tiers need 5, 10 and 15. Spending it buys something now; keeping it keeps the bonus.\nEvery harvest raises the saturation of the vats; it
        falls by 3 per month on its own.\n40+: Forced Vats (more arms production, less stability). 70+: Vat Fever, and every month a chance of the
        Mycelium Blight.\nAbove 15 BioSteel the living metal rots: -1 per month. Purge the vats before they purge you.'
      spanish: 'Bioacero en las cubas: [?EFE_biosteel]  ->  blindaje +[?EFE_ef_blindaje_ver]%, defensa +[?EFE_ef_defensa_ver]%\nSaturación de las
        cubas: [?EFE_saturacion] / 100  ->  estabilidad [?EFE_ef_saturacion_ver]%\n\nEl Bioacero guardado es blindaje vivo (espíritu «El Metal Vivo»),
        y los niveles de la Carrera del Bioacero piden 5, 10 y 15. Gastarlo compra algo ya; guardarlo mantiene el bonus.\nCada cosecha sube la saturación
        de las cubas; baja sola 3 por mes.\n40 o más: Cubas Forzadas (más producción militar, menos estabilidad). 70 o más: Fiebre de las Cubas,
        y cada mes puede aparecer la Plaga del Micelio.\nPor encima de 15 de Bioacero el metal vivo se pudre: -1 por mes. Purgá las cubas antes
        de que ellas te purguen a vos.'
    src: invented
    decisions:
    - id: EFE_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      effects:
      - {effect: event, id: meganations_efe.29}
      ai: {factor: 0}
      src: user_decision
    - id: EFE_ampliar_las_cubas
      name: {english: Expand the Vats, spanish: Ampliar las Cubas}
      desc:
        english: Another hall of vats in the Plain of the Vats. Slow, expensive and safe.
        spanish: Otra nave de cubas en la Llanura de las Cubas. Lento, caro y seguro.
      icon_prefer:
      - generic_industry
      - generic_construction
      cost: 50
      cooldown_days: 45
      effects:
      - {effect: add_variable, var: EFE_biosteel, value: 1}
      - {effect: add_variable, var: EFE_saturacion, value: 6}
      ai_factor: 10
      ai:
        factor: 10
        modifiers:
        - factor: 0
          when:
            variable_at_least: {var: EFE_saturacion, value: 75}
        - factor: 0.3
          when:
            variable_at_least: {var: EFE_saturacion, value: 55}
    - id: EFE_cultivo_intensivo
      name: {english: Intensive Cultivation, spanish: Cultivo Intensivo}
      desc:
        english: Double shifts in the vats and rationed water in the cities. The yield doubles; so do the complaints.
        spanish: Doble turno en las cubas y agua racionada en las ciudades. El rendimiento se duplica; las quejas también.
      icon_prefer:
      - generic_industry
      - generic_production
      cost: 25
      cooldown_days: 60
      available: {stability_at_least: 0.4}
      effects:
      - {effect: add_variable, var: EFE_biosteel, value: 2}
      - {effect: add_stability, value: -0.05}
      - {effect: add_variable, var: EFE_saturacion, value: 12}
      ai_factor: 5
      ai:
        factor: 5
        modifiers:
        - factor: 0
          when:
            variable_at_least: {var: EFE_saturacion, value: 60}
        - factor: 0
          when: {stability_below: 0.4}
    - id: EFE_talar_el_bosque_viejo
      name: {english: Fell the Old Forest, spanish: Talar el Bosque Viejo}
      desc:
        english: The vats need biomass and the oldest forests have the most. The Custodian swore to protect them. The Emperor needs armour.
        spanish: Las cubas necesitan biomasa y los bosques más viejos son los que más tienen. El Custodio juró protegerlos. El Emperador necesita
          blindaje.
      icon_prefer:
      - generic_industry
      - generic_prepare_civil_war
      cost: 10
      cooldown_days: 180
      available: {stability_at_least: 0.5}
      effects:
      - {effect: add_variable, var: EFE_biosteel, value: 4}
      - {effect: add_stability, value: -0.15}
      - {effect: add_war_support, value: -0.05}
      - {effect: add_variable, var: EFE_saturacion, value: 15}
      ai_factor: 1
      ai:
        factor: 1
        modifiers:
        - factor: 0
          when: {stability_below: 0.5}
    - id: EFE_blindar_la_guardia
      name: {english: Armour the Green Guard, spanish: Blindar a la Guardia Verde}
      desc:
        english: 'Spend BioSteel now: living armour for the Guard''s veterans. The vats will have to start over.'
        spanish: 'Gastar Bioacero ahora: blindaje vivo para los veteranos de la Guardia. Las cubas van a tener que empezar de nuevo.'
      icon_prefer:
      - generic_army_support
      - generic_industry
      cost: 25
      cooldown_days: 90
      available:
        variable_at_least: {var: EFE_biosteel, value: 3}
      effects:
      - {effect: add_variable, var: EFE_biosteel, value: -3}
      - {effect: army_experience, value: 30}
      - {effect: add_variable, var: EFE_saturacion, value: -5}
      ai_factor: 3
    - id: EFE_purgar_las_cubas
      name: {english: Purge the Vats, spanish: Purgar las Cubas}
      desc:
        english: 'Drain and sterilise a hall of vats: saturation -25, BioSteel -1.'
        spanish: 'Vaciar y esterilizar una nave de cubas: saturación -25, Bioacero -1.'
      icon_prefer:
      - generic_political_actions
      cost: 25
      cooldown_days: 60
      effects:
      - {effect: add_variable, var: EFE_saturacion, value: -25}
      - {effect: add_variable, var: EFE_biosteel, value: -1}
      ai_factor: 5
      ai:
        factor: 1
        modifiers:
        - factor: 8
          when:
            variable_at_least: {var: EFE_saturacion, value: 60}
        - factor: 0
          when:
            variable_below: {var: EFE_saturacion, value: 30}
    after_effects:
    - {effect: run, value: EFE_espiritu_vivo}

  # ===========================================================================
  # FCU — El Directorio de las Cuatro ("Las Ocho Potencias", 2026-09-23)
  # Cuatro influencias de 0 a 100 (06_mechanics.yaml -> four_corporations).
  # Cada contrato favorece a una o dos corporaciones y perjudica a las otras.
  # Después de cada contrato corre FCU_recalcular_directorio (abajo).
  # ===========================================================================
  - id: FCU_directorio_category
    country: FCU
    icon_prefer:
    - generic_industry
    - generic_production
    - generic_political_actions
    name: {english: The Board of Four, spanish: El Directorio de las Cuatro}
    desc:
      english: 'THE FOUR ALWAYS ADD UP TO 200: when one gains power, the others lose it.\n\nC · Castellane (water): [?FCU_castellane]  ->  stability
        [?FCU_ef_castellane_ver]%\nH · Halvorsen-Ito (food): [?FCU_halvorsen]  ->  consumer goods [?FCU_ef_halvorsen_ver]%\nM · Meridian (arms):
        [?FCU_meridian]  ->  military factory output [?FCU_ef_meridian_ver]%\nO · Obsidian (finance): [?FCU_obsidian]  ->  political power per day
        [?FCU_ef_obsidian_ver]\nScandal: [?FCU_escandalo] / 100\n\nA corporation above 50 gives its bonus; below 50 it subtracts it (see the spirit
        ''The Directorate'').\nBALANCE: all four between 40 and 60 -> Directorate Synergy (+10% factories, +5% research).\nSPECIALISE: a big bonus
        in one field, but the others fall; if one drops below 15 -> Corporate War.\nMeridian at 70+ with two rivals below 35 -> the Hostile Takeover
        opens.\nEvery month a random corporation lobbies (+4). Every contract adds 8 scandal (falls 2 per month): 50 -> Under Suspicion, 80 -> Crisis
        of Confidence.'
      spanish: 'LAS CUATRO SUMAN SIEMPRE 200: cuando una gana poder, las otras lo pierden.\n\nC · Castellane (agua): [?FCU_castellane]  ->  estabilidad
        [?FCU_ef_castellane_ver]%\nH · Halvorsen-Ito (comida): [?FCU_halvorsen]  ->  bienes de consumo [?FCU_ef_halvorsen_ver]%\nM · Meridian (armas):
        [?FCU_meridian]  ->  producción de fábricas militares [?FCU_ef_meridian_ver]%\nO · Obsidian (finanzas): [?FCU_obsidian]  ->  poder político
        por día [?FCU_ef_obsidian_ver]\nEscándalo: [?FCU_escandalo] / 100\n\nUna corporación por encima de 50 da su bonus; por debajo de 50 lo resta
        (mirá el espíritu «El Directorio»).\nEQUILIBRIO: las cuatro entre 40 y 60 -> Sinergia del Directorio (+10% fábricas, +5% investigación).\nESPECIALIZAR:
        un bonus grande en un área, pero las otras caen; si alguna baja de 15 -> Guerra Corporativa.\nMeridian en 70 o más con dos rivales por debajo
        de 35 -> se habilita la OPA Hostil.\nCada mes una corporación al azar hace lobby (+4). Cada contrato suma 8 de escándalo (baja 2 por mes):
        50 -> Bajo Sospecha, 80 -> Crisis de Confianza.'
    src: user_design
    after_effects:
    - {effect: run, value: FCU_recalcular_directorio}
    decisions:
    - id: FCU_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      effects:
      - {effect: event, id: meganations_fcu.29}
      ai: {factor: 0}
      src: user_decision
    - id: FCU_contrato_ferroviario
      name:
        english: Automated Railway Contract (M+10 H-10)
        spanish: Contrato Ferroviario Automatizado (M+10 H-10)
      desc:
        english: Meridian lays the track, Obsidian finances it. The farmers and the water board pay for it.
        spanish: Meridian pone las vías, Obsidian lo financia. Lo pagan los granjeros y el agua.
      icon_prefer:
      - generic_construction
      - generic_industry
      cost: 50
      cooldown_days: 60
      visible: {not_flag: FCU_opa_consumada}
      effects:
      - {effect: add_variable, var: FCU_meridian, value: 10}
      - {effect: add_variable, var: FCU_halvorsen, value: -10}
      - {effect: build, building: infrastructure, level: 1}
      - {effect: add_variable, var: FCU_escandalo, value: 8}
      ai:
        factor: 2
        modifiers:
        - factor: 10
          when:
            all:
            - variable_below: {var: FCU_meridian, value: 45}
            - variable_at_least: {var: FCU_halvorsen, value: 50}
        - factor: 0
          when:
            variable_at_least: {var: FCU_meridian, value: 50}
        - factor: 0
          when:
            variable_below: {var: FCU_halvorsen, value: 45}
        - factor: 0
          when:
            variable_at_least: {var: FCU_escandalo, value: 60}
    - id: FCU_subsidio_alimentario
      name: {english: Food Subsidy (H+10 O-10), spanish: Subsidio Alimentario (H+10 O-10)}
      desc:
        english: Halvorsen-Ito feeds the cities at a loss the Treasury covers. Obsidian calls it theft.
        spanish: Halvorsen-Ito alimenta a las ciudades a pérdida y el Tesoro la cubre. Obsidian lo llama robo.
      icon_prefer:
      - generic_political_actions
      - generic_industry
      cost: 50
      cooldown_days: 60
      visible: {not_flag: FCU_opa_consumada}
      effects:
      - {effect: add_variable, var: FCU_halvorsen, value: 10}
      - {effect: add_variable, var: FCU_obsidian, value: -10}
      - {effect: add_stability, value: 0.03}
      - {effect: add_variable, var: FCU_escandalo, value: 8}
      ai:
        factor: 2
        modifiers:
        - factor: 10
          when:
            all:
            - variable_below: {var: FCU_halvorsen, value: 45}
            - variable_at_least: {var: FCU_obsidian, value: 50}
        - factor: 0
          when:
            variable_at_least: {var: FCU_halvorsen, value: 50}
        - factor: 0
          when:
            variable_below: {var: FCU_obsidian, value: 45}
        - factor: 0
          when:
            variable_at_least: {var: FCU_escandalo, value: 60}
    - id: FCU_licitacion_desalinizadoras
      name: {english: Desalination Tender (C+10 M-10), spanish: Licitación de Desalinizadoras (C+10 M-10)}
      desc:
        english: A new coast of desalination plants. Castellane wins the tender, as usual.
        spanish: Una costa nueva de desalinizadoras. Castellane gana la licitación, como siempre.
      icon_prefer:
      - generic_construction
      - generic_industry
      cost: 75
      cooldown_days: 90
      visible: {not_flag: FCU_opa_consumada}
      effects:
      - {effect: add_variable, var: FCU_castellane, value: 10}
      - {effect: add_variable, var: FCU_meridian, value: -10}
      - {effect: build, building: industrial_complex, level: 1}
      - {effect: add_variable, var: FCU_escandalo, value: 8}
      ai:
        factor: 2
        modifiers:
        - factor: 10
          when:
            all:
            - variable_below: {var: FCU_castellane, value: 45}
            - variable_at_least: {var: FCU_meridian, value: 50}
        - factor: 0
          when:
            variable_at_least: {var: FCU_castellane, value: 50}
        - factor: 0
          when:
            variable_below: {var: FCU_meridian, value: 45}
        - factor: 0
          when:
            variable_at_least: {var: FCU_escandalo, value: 60}
    - id: FCU_contrato_de_defensa
      name: {english: Defence Contract (M+10 C-10), spanish: Contrato de Defensa (M+10 C-10)}
      desc:
        english: Meridian Kinetics delivers a new line of arms. Everyone else delivers the budget.
        spanish: Meridian Kinetics entrega una línea nueva de armamento. Los demás entregan el presupuesto.
      icon_prefer:
      - generic_army_support
      - generic_industry
      cost: 75
      cooldown_days: 90
      visible: {not_flag: FCU_opa_consumada}
      effects:
      - {effect: add_variable, var: FCU_meridian, value: 10}
      - {effect: add_variable, var: FCU_castellane, value: -10}
      - {effect: army_experience, value: 15}
      - {effect: build, building: arms_factory, level: 1}
      - {effect: add_variable, var: FCU_escandalo, value: 8}
      ai:
        factor: 2
        modifiers:
        - factor: 3
          when: {at_war: true}
        - factor: 10
          when:
            all:
            - variable_below: {var: FCU_meridian, value: 45}
            - variable_at_least: {var: FCU_castellane, value: 50}
        - factor: 0
          when:
            variable_at_least: {var: FCU_meridian, value: 50}
        - factor: 0
          when:
            variable_below: {var: FCU_castellane, value: 45}
        - factor: 0
          when:
            variable_at_least: {var: FCU_escandalo, value: 60}
    - id: FCU_desregulacion_financiera
      name: {english: Financial Deregulation (O+10 H-10), spanish: Desregulación Financiera (O+10 H-10)}
      desc:
        english: Obsidian Ledger writes its own rules for six months. Research flows, and so does the money nobody can trace.
        spanish: Obsidian Ledger escribe sus propias reglas por seis meses. La investigación fluye, y también la plata que nadie puede rastrear.
