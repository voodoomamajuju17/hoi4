        factor: 25
        modifiers: []
      src: user_request
    - id: EFE_proclamar_la_forma_final
      name: {english: Proclaim The Dominion of Gaia, spanish: Proclamar El Dominio de Gaia}
      desc:
        english: From the Caribbean to Cape Horn one forest, one law, one Empress of the living Earth.\nRequires controlling Lima, La Paz, the Amazon (or the Sanctuary under its guarantee),
          São Paulo, Rio de Janeiro, Bogotá (Cundinamarca) and Caracas (Miranda), 45 divisions and 50% stability.
        spanish: Del Caribe al Cabo de Hornos, un solo bosque, una ley, un imperio de la Tierra viva.\nPide controlar Lima, La Paz, el Amazonas (o el Santuario bajo su garantía),
          São Paulo, Río de Janeiro, Bogotá (Cundinamarca) y Caracas (Miranda), 45 divisiones y 50% de estabilidad.
      icon_prefer:
