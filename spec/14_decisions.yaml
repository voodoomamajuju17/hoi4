      ops:
      - - set
        - NRE_ef_ataque_ver
        - NRE_ef_ataque
      - - mul
        - NRE_ef_ataque_ver
        - 100
      - - round
        - NRE_ef_ataque_ver
        - null
      - - set
        - NRE_ef_org_ver
        - NRE_ef_org
      - - mul
        - NRE_ef_org_ver
        - 100
      - - round
        - NRE_ef_org_ver
        - null
      - - set
        - NRE_ef_pp_ver
