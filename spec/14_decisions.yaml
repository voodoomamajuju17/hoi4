  # 2026-10-17: la receta de diversión (SHD) — productoras, tres elecciones, gastos y eventos.
  - id: SHD_mandato_category
    country: SHD
    icon_prefer:
    - generic_political_actions
    - generic_industry
    name: {english: 'The Mandate of Heaven', spanish: 'El Mandato del Cielo'}
    desc:
      english: 'Mandate of Heaven: [?SHD_mandato]\nGreat dams: [?SHD_productoras_r] / 5\n\nThe Mandate is the trust of Heaven in the Directorate: it flows from the great dams that tame the rivers. When the rivers obey, the Mandate grows; when a dam falls, Heaven notices.\n\nPRODUCERS: the Lancang Dam, the Pearl River Gates, the Qiantang Locks, the Min River Dam, the Yellow River Gates. Each one adds 1 Mandate of Heaven a month; losing one costs 10 and 180 days of trouble, and it produces again only when we retake and restore it.\nTHE THREE CHOICES: at 25, 50, 75 Mandate of Heaven you can spend them, once each, on a permanent choice between three paths.\nSPENDING: smaller amounts buy temporary bonuses.'
      spanish: 'Mandato del Cielo: [?SHD_mandato]\nGrandes represas: [?SHD_productoras_r] / 5\n\nEl Mandato es la confianza del Cielo en el Directorio: fluye de las grandes represas que domestican los ríos. Cuando los ríos obedecen, el Mandato crece; cuando cae una represa, el Cielo se da cuenta.\n\nPRODUCTORAS: la Represa del Lancang, las Compuertas del Río de las Perlas, las Esclusas del Qiantang, la Represa del Min, las Compuertas del Río Amarillo. Cada una suma 1 de Mandato del Cielo por mes; perder una cuesta 10 y 180 días de problemas, y vuelve a producir recién cuando la recuperamos y la restauramos.\nLAS TRES ELECCIONES: con 25, 50, 75 de Mandato del Cielo podés gastarlos, una vez cada una, en una elección permanente entre tres caminos.\nGASTAR: con menos se compran bonos temporales.'
