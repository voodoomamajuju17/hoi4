# =============================================================================
# 14_decisions.yaml — Paneles de decisiones (minijuegos nacionales)
# =============================================================================
# El usuario eligió (2026-09-23) que BioSteel sea un contador con su propio
# panel de decisiones en vez de un recurso del mapa. Todo INVENTADO.
#
# El panel muestra el contador en su descripción ([?variable]). Las
# decisiones ganan o gastan BioSteel y tienen tiempo de espera: el juego está
# en elegir entre acumular (para los tiers de los focos, 5/10/15) o gastar ya.
#
# Íconos: se eligen entre los que usan las decisiones vanilla de tu juego
# (se prueba la lista `icon_prefer` en orden y si ninguno existe se usa el
# primero que haya). Nada se escribe de memoria.
#
# Condiciones soportadas: variable_at_least { var, value }, stability_at_least.
# Efectos: los mismos de focos/eventos + add_variable { var, value }.
# =============================================================================

categories:

  - id: EFE_biosteel_category
    country: EFE
    icon_prefer: [generic_industry, generic_production, generic_research]
    name:
      english: "The BioSteel Race"
      spanish: "La Carrera del Bioacero"
    desc:
      english: "BioSteel stored in the vats: [?EFE_biosteel]\\n\\nThe tiers of the BioSteel Race need 5, 10 and 15. Every unit spent on the Green Guard is one the vats will have to grow again."
      spanish: "Bioacero en las cubas: [?EFE_biosteel]\\n\\nLos niveles de la Carrera del Bioacero piden 5, 10 y 15. Cada unidad que se gasta en la Guardia Verde es una que las cubas tienen que volver a cultivar."
    src: invented

    decisions:

      - id: EFE_ampliar_las_cubas
        name: { english: "Expand the Vats", spanish: "Ampliar las Cubas" }
        desc:
          english: "Another hall of vats in the Plain of the Vats. Slow, expensive and safe."
          spanish: "Otra nave de cubas en la Llanura de las Cubas. Lento, caro y seguro."
        icon_prefer: [generic_industry, generic_construction]
        cost: 50
        cooldown_days: 30
        effects:
          - { effect: add_variable, var: EFE_biosteel, value: 1 }
        ai_factor: 10

      - id: EFE_cultivo_intensivo
        name: { english: "Intensive Cultivation", spanish: "Cultivo Intensivo" }
        desc:
          english: "Double shifts in the vats and rationed water in the cities. The yield doubles; so do the complaints."
          spanish: "Doble turno en las cubas y agua racionada en las ciudades. El rendimiento se duplica; las quejas también."
        icon_prefer: [generic_industry, generic_production]
        cost: 25
        cooldown_days: 60
        available:
          stability_at_least: 0.40
        effects:
          - { effect: add_variable, var: EFE_biosteel, value: 2 }
          - { effect: add_stability, value: -0.05 }
        ai_factor: 5

      - id: EFE_talar_el_bosque_viejo
        name: { english: "Fell the Old Forest", spanish: "Talar el Bosque Viejo" }
        desc:
          english: "The vats need biomass and the oldest forests have the most. The Custodian swore to protect them. The Emperor needs armour."
          spanish: "Las cubas necesitan biomasa y los bosques más viejos son los que más tienen. El Custodio juró protegerlos. El Emperador necesita blindaje."
        icon_prefer: [generic_industry, generic_prepare_civil_war]
        cost: 10
        cooldown_days: 180
        available:
          stability_at_least: 0.50
        effects:
          - { effect: add_variable, var: EFE_biosteel, value: 4 }
          - { effect: add_stability, value: -0.15 }
          - { effect: add_war_support, value: -0.05 }
        ai_factor: 1

      - id: EFE_blindar_la_guardia
        name: { english: "Armour the Green Guard", spanish: "Blindar a la Guardia Verde" }
        desc:
          english: "Spend BioSteel now: living armour for the Guard's veterans. The vats will have to start over."
          spanish: "Gastar Bioacero ahora: blindaje vivo para los veteranos de la Guardia. Las cubas van a tener que empezar de nuevo."
        icon_prefer: [generic_army_support, generic_industry]
        cost: 25
        cooldown_days: 90
        available:
          variable_at_least: { var: EFE_biosteel, value: 3 }
        effects:
          - { effect: add_variable, var: EFE_biosteel, value: -3 }
          - { effect: army_experience, value: 30 }
        ai_factor: 3

  # ===========================================================================
  # FCU — El Directorio de las Cuatro ("Las Ocho Potencias", 2026-09-23)
  # Cuatro influencias de 0 a 100 (06_mechanics.yaml -> four_corporations).
  # Cada contrato favorece a una o dos corporaciones y perjudica a las otras.
  # Después de cada contrato corre FCU_recalcular_directorio (abajo).
  # ===========================================================================
  - id: FCU_directorio_category
    country: FCU
    icon_prefer: [generic_industry, generic_production, generic_political_actions]
    name:
      english: "The Board of Four"
      spanish: "El Directorio de las Cuatro"
    desc:
      english: "Castellane Water Trust: [?FCU_castellane]\\nHalvorsen-Ito Agrosystems: [?FCU_halvorsen]\\nMeridian Kinetics: [?FCU_meridian]\\nObsidian Ledger: [?FCU_obsidian]\\n\\nAll four between 40 and 60: Board Synergy.\\nAny of them below 15: Corporate War.\\nMeridian above 70 with two rivals below 25: the Hostile Takeover becomes possible."
      spanish: "Castellane Water Trust: [?FCU_castellane]\\nHalvorsen-Ito Agrosystems: [?FCU_halvorsen]\\nMeridian Kinetics: [?FCU_meridian]\\nObsidian Ledger: [?FCU_obsidian]\\n\\nLas cuatro entre 40 y 60: Sinergia del Directorio.\\nAlguna por debajo de 15: Guerra Corporativa.\\nMeridian por encima de 70 con dos rivales por debajo de 25: se habilita la OPA Hostil."
    src: user_design
    after_effects:
      - { effect: run, value: FCU_recalcular_directorio }

    decisions:

      - id: FCU_contrato_ferroviario
        name: { english: "Automated Railway Contract", spanish: "Contrato Ferroviario Automatizado" }
        desc:
          english: "Meridian lays the track, Obsidian finances it. The farmers and the water board pay for it."
          spanish: "Meridian pone las vías, Obsidian lo financia. Lo pagan los granjeros y el agua."
        icon_prefer: [generic_construction, generic_industry]
        cost: 50
        cooldown_days: 60
        visible: { not_flag: FCU_opa_consumada }
        effects:
          - { effect: add_variable, var: FCU_meridian, value: 10 }
          - { effect: add_variable, var: FCU_obsidian, value: 5 }
          - { effect: add_variable, var: FCU_halvorsen, value: -5 }
          - { effect: add_variable, var: FCU_castellane, value: -5 }
          - { effect: build, building: infrastructure, level: 1 }
        ai_factor: 5

      - id: FCU_subsidio_alimentario
        name: { english: "Food Subsidy", spanish: "Subsidio Alimentario" }
        desc:
          english: "Halvorsen-Ito feeds the cities at a loss the Treasury covers. Obsidian calls it theft."
          spanish: "Halvorsen-Ito alimenta a las ciudades a pérdida y el Tesoro la cubre. Obsidian lo llama robo."
        icon_prefer: [generic_political_actions, generic_industry]
        cost: 50
        cooldown_days: 60
        visible: { not_flag: FCU_opa_consumada }
        effects:
          - { effect: add_variable, var: FCU_halvorsen, value: 10 }
          - { effect: add_variable, var: FCU_castellane, value: 5 }
          - { effect: add_variable, var: FCU_meridian, value: -5 }
          - { effect: add_variable, var: FCU_obsidian, value: -10 }
          - { effect: add_stability, value: 0.03 }
        ai_factor: 5

      - id: FCU_licitacion_desalinizadoras
        name: { english: "Desalination Tender", spanish: "Licitación de Desalinizadoras" }
        desc:
          english: "A new coast of desalination plants. Castellane wins the tender, as usual."
          spanish: "Una costa nueva de desalinizadoras. Castellane gana la licitación, como siempre."
        icon_prefer: [generic_construction, generic_industry]
        cost: 75
        cooldown_days: 90
        visible: { not_flag: FCU_opa_consumada }
        effects:
          - { effect: add_variable, var: FCU_castellane, value: 10 }
          - { effect: add_variable, var: FCU_halvorsen, value: 5 }
          - { effect: add_variable, var: FCU_meridian, value: -5 }
          - { effect: add_variable, var: FCU_obsidian, value: -5 }
          - { effect: build, building: industrial_complex, level: 1 }
        ai_factor: 4

      - id: FCU_contrato_de_defensa
        name: { english: "Defence Contract", spanish: "Contrato de Defensa" }
        desc:
          english: "Meridian Kinetics delivers a new line of arms. Everyone else delivers the budget."
          spanish: "Meridian Kinetics entrega una línea nueva de armamento. Los demás entregan el presupuesto."
        icon_prefer: [generic_army_support, generic_industry]
        cost: 75
        cooldown_days: 90
        visible: { not_flag: FCU_opa_consumada }
        effects:
          - { effect: add_variable, var: FCU_meridian, value: 15 }
          - { effect: add_variable, var: FCU_castellane, value: -5 }
          - { effect: add_variable, var: FCU_halvorsen, value: -5 }
          - { effect: add_variable, var: FCU_obsidian, value: -5 }
          - { effect: army_experience, value: 15 }
          - { effect: build, building: arms_factory, level: 1 }
        ai_factor: 3

      - id: FCU_desregulacion_financiera
        name: { english: "Financial Deregulation", spanish: "Desregulación Financiera" }
        desc:
          english: "Obsidian Ledger writes its own rules for six months. Research flows, and so does the money nobody can trace."
          spanish: "Obsidian Ledger escribe sus propias reglas por seis meses. La investigación fluye, y también la plata que nadie puede rastrear."
        icon_prefer: [generic_research, generic_political_actions]
        cost: 25
        cooldown_days: 120
        visible: { not_flag: FCU_opa_consumada }
        effects:
          - { effect: add_variable, var: FCU_obsidian, value: 15 }
          - { effect: add_variable, var: FCU_halvorsen, value: -5 }
          - { effect: add_variable, var: FCU_castellane, value: -5 }
          - { effect: add_variable, var: FCU_meridian, value: -5 }
          - { effect: timed_idea, idea: FCU_ventanilla_obsidian, days: 180 }
        ai_factor: 3

      - id: FCU_auditoria_del_directorio
        name: { english: "Board Audit", spanish: "Auditoría del Directorio" }
        desc:
          english: "The Chair calls in the auditors. Whoever grew too much shrinks; whoever shrank too much gets a lifeline."
          spanish: "La Presidencia llama a los auditores. La que creció de más se achica; la que se achicó de más recibe un salvavidas."
        icon_prefer: [generic_political_actions, generic_research]
        cost: 100
        cooldown_days: 180
        visible: { not_flag: FCU_opa_consumada }
        effects:
          - { effect: run, value: FCU_auditar_castellane }
          - { effect: run, value: FCU_auditar_halvorsen }
          - { effect: run, value: FCU_auditar_meridian }
          - { effect: run, value: FCU_auditar_obsidian }
        ai_factor: 2

      - id: FCU_repartir_el_dividendo
        name: { english: "Pay the War Dividend", spanish: "Repartir el Dividendo de Guerra" }
        desc:
          english: "The war is going well for the shareholders. Pay them before they ask."
          spanish: "A los accionistas la guerra les está yendo bien. Hay que pagarles antes de que pregunten."
        icon_prefer: [generic_army_support, generic_industry]
        cost: 0
        cooldown_days: 90
        visible: { focus: FCU_el_dividendo_de_guerra }
        available: { at_war: true }
        effects:
          - { effect: add_political_power, value: 75 }
          - { effect: build, building: arms_factory, level: 1 }
        ai_factor: 20

  # ===========================================================================
  # EFE — El Monte, la integración, la reforestación y la economía
  # ("Las Ocho Potencias", 2026-09-23)
  # ===========================================================================
  - id: EFE_monte_category
    country: EFE
    icon_prefer: [generic_prepare_civil_war, generic_political_actions]
    name: { english: "The Forest Rises", spanish: "El Monte se Levanta" }
    desc:
      english: "The Fires of Gaia have split the Empire. Every decision tilts the balance between the court and the forest. Nobody knows exactly how close the rangers are to taking power; only that they are getting closer."
      spanish: "Los Incendios de Gaia partieron al Imperio. Cada decisión inclina la balanza entre la corte y el monte. Nadie sabe exactamente cuánto les falta a los guardaparques para tomar el poder; solo que cada vez les falta menos."
    src: user_design
    after_effects:
      - { effect: run, value: EFE_recalcular_monte }
    decisions:
      - id: EFE_apoyar_a_los_guardaparques
        name: { english: "Back the Rangers", spanish: "Apoyar a los Guardaparques" }
        desc: { english: "Arms and funds for the forest patrols. The court frowns.", spanish: "Armas y fondos para las patrullas del monte. La corte frunce el ceño." }
        icon_prefer: [generic_army_support, generic_political_actions]
        cost: 25
        cooldown_days: 30
        visible: { flag: EFE_crisis_del_monte, not_flag: EFE_monte_levantado }
        effects:
          - { effect: add_variable, var: EFE_control_del_monte, value: 15 }
        ai_factor: 3
      - id: EFE_militarizar_las_reservas
        name: { english: "Militarise the Reserves", spanish: "Militarizar las Reservas" }
        desc: { english: "The nature reserves become garrisons. The Guard trains the rangers.", spanish: "Las reservas naturales se vuelven guarniciones. La Guardia entrena a los guardaparques." }
        icon_prefer: [generic_army_support, generic_prepare_civil_war]
        cost: 50
        cooldown_days: 45
        visible: { flag: EFE_crisis_del_monte, not_flag: EFE_monte_levantado }
        effects:
          - { effect: add_variable, var: EFE_control_del_monte, value: 20 }
          - { effect: army_experience, value: 10 }
          - { effect: add_stability, value: -0.03 }
        ai_factor: 2
      - id: EFE_proteger_las_ciudades
        name: { english: "Protect the Cities", spanish: "Proteger las Ciudades" }
        desc: { english: "Police in the streets and bread in the markets. The court buys time.", spanish: "Policía en las calles y pan en los mercados. La corte compra tiempo." }
        icon_prefer: [generic_political_actions, generic_industry]
        cost: 50
        cooldown_days: 30
        visible: { flag: EFE_crisis_del_monte, not_flag: EFE_monte_levantado }
        effects:
          - { effect: add_variable, var: EFE_control_del_monte, value: -15 }
          - { effect: add_stability, value: 0.05 }
        ai_factor: 2
      - id: EFE_evacuar_los_centros_urbanos
        name: { english: "Evacuate the City Centres", spanish: "Evacuar los Centros Urbanos" }
        desc: { english: "Half of Gaia is marched out to the plantations. The forest gains a million workers; the Empire loses its patience.", spanish: "Media Gaia marcha a las plantaciones. El monte gana un millón de trabajadores; el Imperio pierde la paciencia." }
        icon_prefer: [generic_prepare_civil_war, generic_political_actions]
        cost: 25
        cooldown_days: 60
        visible: { flag: EFE_crisis_del_monte, not_flag: EFE_monte_levantado }
        effects:
          - { effect: add_variable, var: EFE_control_del_monte, value: 25 }
          - { effect: add_stability, value: -0.08 }
        ai_factor: 1

  - id: EFE_integracion_category
    country: EFE
    icon_prefer: [generic_political_actions, generic_construction]
    name: { english: "Integration of the Satellites", spanish: "La Integración de los Satélites" }
    desc:
      english: "Integration of Yvytu Ykua Guasu: stage [?EFE_integracion_yyg] of 3.\nIntegration of Southern Patagonia: stage [?EFE_integracion_pta] of 3.\n\nEvery stage costs political power and BioSteel, and the locals do not always agree."
      spanish: "Integración de Yvytu Ykua Guasu: etapa [?EFE_integracion_yyg] de 3.\nIntegración de la Patagonia Austral: etapa [?EFE_integracion_pta] de 3.\n\nCada etapa cuesta poder político y Bioacero, y los locales no siempre están de acuerdo."
    src: user_design
    decisions:
      - id: EFE_integrar_yyg_1
        name: { english: "Guaraní Governors", spanish: "Gobernadores Guaraníes" }
        desc: { english: "Imperial governors sit next to the council of Asunción.", spanish: "Gobernadores imperiales se sientan al lado del consejo de Asunción." }
        icon_prefer: [generic_political_actions, generic_construction]
        cost: 75
        cooldown_days: 60
        fire_only_once: true
        visible: { flag: EFE_integracion_yyg_abierta, country_exists: YYG }
        available:
          variable_between: { var: EFE_integracion_yyg, min: 0, max: 0 }
          variable_at_least: { var: EFE_biosteel, value: 1 }
        effects:
          - { effect: add_variable, var: EFE_integracion_yyg, value: 1 }
          - { effect: add_variable, var: EFE_biosteel, value: -1 }
          - { effect: add_stability, value: -0.02 }
        ai_factor: 5
      - id: EFE_integrar_yyg_2
        name: { english: "One Currency, One Water", spanish: "Una Moneda, Una Agua" }
        desc: { english: "The dams of the Paraná join the imperial grid.", spanish: "Las represas del Paraná entran a la red imperial." }
        icon_prefer: [generic_political_actions, generic_construction]
        cost: 100
        cooldown_days: 60
        fire_only_once: true
        visible: { flag: EFE_integracion_yyg_abierta, country_exists: YYG }
        available:
          variable_between: { var: EFE_integracion_yyg, min: 1, max: 1 }
          variable_at_least: { var: EFE_biosteel, value: 1 }
        effects:
          - { effect: add_variable, var: EFE_integracion_yyg, value: 1 }
          - { effect: add_variable, var: EFE_biosteel, value: -1 }
          - { effect: add_stability, value: -0.02 }
        ai_factor: 5
      - id: EFE_integrar_yyg_3
        name: { english: "The Guaraní Missions Come Home", spanish: "Las Misiones Guaraníes Vuelven" }
        desc: { english: "Yvytu Ykua Guasu becomes imperial land.", spanish: "Yvytu Ykua Guasu pasa a ser tierra imperial." }
        icon_prefer: [generic_political_actions, generic_construction]
        cost: 125
        cooldown_days: 60
        fire_only_once: true
        visible: { flag: EFE_integracion_yyg_abierta, country_exists: YYG }
        available:
          variable_between: { var: EFE_integracion_yyg, min: 2, max: 2 }
          variable_at_least: { var: EFE_biosteel, value: 1 }
        effects:
          - { effect: add_variable, var: EFE_integracion_yyg, value: 1 }
          - { effect: add_variable, var: EFE_biosteel, value: -1 }
          - { effect: add_stability, value: -0.02 }
          - { effect: scope, target: YYG, effects: [ { effect: states, pick: every, effects: [ { effect: add_core, value: EFE } ] } ] }
          - { effect: annex, target: YYG }
          - { effect: event, id: meganations_efe.10 }
        ai_factor: 5
      - id: EFE_integrar_pta_1
        name: { english: "Autonomy Reduced", spanish: "Autonomía Reducida" }
        desc: { english: "Southern Patagonia's council loses its veto.", spanish: "El consejo de la Patagonia Austral pierde su veto." }
        icon_prefer: [generic_political_actions, generic_construction]
        cost: 75
        cooldown_days: 60
        fire_only_once: true
        visible: { flag: EFE_integracion_pta_abierta, country_exists: PTA }
        available:
          variable_between: { var: EFE_integracion_pta, min: 0, max: 0 }
          variable_at_least: { var: EFE_biosteel, value: 1 }
        effects:
          - { effect: add_variable, var: EFE_integracion_pta, value: 1 }
          - { effect: add_variable, var: EFE_biosteel, value: -1 }
          - { effect: add_stability, value: -0.02 }
        ai_factor: 5
      - id: EFE_integrar_pta_2
        name: { english: "The Glacier Garrisons", spanish: "Las Guarniciones de los Glaciares" }
        desc: { english: "The Guard takes over the southern passes.", spanish: "La Guardia se hace cargo de los pasos australes." }
        icon_prefer: [generic_political_actions, generic_construction]
        cost: 100
        cooldown_days: 60
        fire_only_once: true
        visible: { flag: EFE_integracion_pta_abierta, country_exists: PTA }
        available:
          variable_between: { var: EFE_integracion_pta, min: 1, max: 1 }
          variable_at_least: { var: EFE_biosteel, value: 1 }
        effects:
          - { effect: add_variable, var: EFE_integracion_pta, value: 1 }
          - { effect: add_variable, var: EFE_biosteel, value: -1 }
          - { effect: add_stability, value: -0.02 }
        ai_factor: 5
      - id: EFE_integrar_pta_3
        name: { english: "The South Is the Empire", spanish: "El Sur es el Imperio" }
        desc: { english: "Southern Patagonia becomes imperial land.", spanish: "La Patagonia Austral pasa a ser tierra imperial." }
        icon_prefer: [generic_political_actions, generic_construction]
        cost: 125
        cooldown_days: 60
        fire_only_once: true
        visible: { flag: EFE_integracion_pta_abierta, country_exists: PTA }
        available:
          variable_between: { var: EFE_integracion_pta, min: 2, max: 2 }
          variable_at_least: { var: EFE_biosteel, value: 1 }
        effects:
          - { effect: add_variable, var: EFE_integracion_pta, value: 1 }
          - { effect: add_variable, var: EFE_biosteel, value: -1 }
          - { effect: add_stability, value: -0.02 }
          - { effect: scope, target: PTA, effects: [ { effect: states, pick: every, effects: [ { effect: add_core, value: EFE } ] } ] }
          - { effect: annex, target: PTA }
          - { effect: event, id: meganations_efe.11 }
        ai_factor: 5

  - id: EFE_reforestacion_category
    country: EFE
    icon_prefer: [generic_construction, generic_industry]
    name: { english: "Sowing the Conquest", spanish: "Sembrar la Conquista" }
    desc:
      english: "Conquered land is not ruled: it is replanted. A region under reforestation becomes an ecological core after 120 days. Slow, but it never goes back.\n\nBioSteel in the vats: [?EFE_biosteel]"
      spanish: "La tierra conquistada no se gobierna: se replanta. Una región en reforestación se vuelve núcleo ecológico a los 120 días. Lento, pero nunca retrocede.\n\nBioacero en las cubas: [?EFE_biosteel]"
    src: user_design
    decisions:
      - id: EFE_sembrar_region
        name: { english: "Sow an Occupied Region", spanish: "Sembrar una Región Ocupada" }
        desc: { english: "Seeds, rangers and two units of BioSteel for a region that is not ours yet.", spanish: "Semillas, guardaparques y dos unidades de Bioacero para una región que todavía no es nuestra." }
        icon_prefer: [generic_construction, generic_industry]
        cost: 25
        cooldown_days: 30
        visible: { focus: EFE_sembrar_la_conquista }
        available: { variable_at_least: { var: EFE_biosteel, value: 2 } }
        effects:
          - { effect: add_variable, var: EFE_biosteel, value: -2 }
          - effect: states
            pick: random
            when: { not_core_of: EFE, not_state_flag: EFE_reforestando }
            effects: [ { effect: state_flag, value: EFE_reforestando } ]
        ai_factor: 10
      - id: EFE_consolidar_el_bosque
        name: { english: "Consolidate the Forest", spanish: "Consolidar el Bosque" }
        desc: { english: "Every region that has been growing for 120 days becomes an ecological core of the Empire.", spanish: "Cada región que lleva 120 días creciendo se vuelve núcleo ecológico del Imperio." }
        icon_prefer: [generic_construction, generic_political_actions]
        cost: 25
        cooldown_days: 60
        visible: { focus: EFE_sembrar_la_conquista }
        effects:
          - effect: states
            pick: every
            when: { state_flag_days: { flag: EFE_reforestando, days: 120 } }
            effects:
              - { effect: add_core, value: EFE }
              - { effect: clear_state_flag, value: EFE_reforestando }
              - { effect: state_flag, value: EFE_nucleo_ecologico }
        ai_factor: 10

  - id: EFE_economia_category
