on_actions:
  # 2026-10-17: la bomba es secreta hasta que se usa. Cuando alguien la tira
  # (ROOT), el mundo reacciona (meganations_asc_receta.40 y .41).
  - id: MEGANATIONS_bomba_usada
    hook: on_nuke_drop
    effects:
    - effect: if
      when:
        not_flag: MEGANATIONS_bomba_reciente
      then:
      - {effect: flag, value: MEGANATIONS_bomba_reciente, days: 180}
      - {effect: event, id: meganations_asc_receta.40, days: 1}
      - effect: every_country
        when:
          factories_at_least: 25
          not_flag: MEGANATIONS_bomba_reciente
        effects:
        - {effect: event, id: meganations_asc_receta.41, days: 2}

