    - {effect: clamp, var: NRE_prestigio_fulminata, min: 0, max: 100}
    - {effect: clamp, var: NRE_auctoritas, min: 0, max: 100}
    - effect: idea_tiers
      tiers:
      - idea: NRE_legiones_veteranas
        when:
          any:
          - variable_at_least: {var: NRE_prestigio_italica, value: 60}
          - variable_at_least: {var: NRE_prestigio_macedonica, value: 60}
          - variable_at_least: {var: NRE_prestigio_fulminata, value: 60}
    - effect: math
      ops:
      - - set
        - NRE_ef_ataque
        - NRE_prestigio_italica
      - - add
        - NRE_ef_ataque
        - NRE_prestigio_macedonica
      - - add
        - NRE_ef_ataque
        - NRE_prestigio_fulminata
      - - mul
        - NRE_ef_ataque
        - 1
      - - div
        - NRE_ef_ataque
        - 2000
      - - set
        - NRE_ef_org
        - NRE_auctoritas
      - - mul
        - NRE_ef_org
        - 1
      - - div
        - NRE_ef_org
        - 1000
      - - set
        - NRE_ef_pp
        - 0
