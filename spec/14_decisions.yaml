scripted_effects:

  # Después de cada contrato o foco que mueve una corporación.
  - id: FCU_recalcular_directorio
    effects:
      - { effect: clamp, var: FCU_castellane, min: 0, max: 100 }
      - { effect: clamp, var: FCU_halvorsen, min: 0, max: 100 }
      - { effect: clamp, var: FCU_meridian, min: 0, max: 100 }
      - { effect: clamp, var: FCU_obsidian, min: 0, max: 100 }
      - effect: if
        when: { not_flag: FCU_opa_consumada, all_between: { vars: [FCU_castellane, FCU_halvorsen, FCU_meridian, FCU_obsidian], min: 40, max: 60 } }
        then:
          - { effect: if, when: { not_idea: FCU_sinergia_del_directorio }, then: [ { effect: add_ideas, value: FCU_sinergia_del_directorio } ] }
        else:
          - { effect: if, when: { idea: FCU_sinergia_del_directorio }, then: [ { effect: remove_idea, value: FCU_sinergia_del_directorio } ] }
      - effect: if
        when:
          not_flag: FCU_opa_consumada
          any:
            - { variable_below: { var: FCU_castellane, value: 15 } }
            - { variable_below: { var: FCU_halvorsen, value: 15 } }
            - { variable_below: { var: FCU_meridian, value: 15 } }
            - { variable_below: { var: FCU_obsidian, value: 15 } }
        then:
          - { effect: if, when: { not_idea: FCU_guerra_corporativa }, then: [ { effect: add_ideas, value: FCU_guerra_corporativa } ] }
        else:
          - { effect: if, when: { idea: FCU_guerra_corporativa }, then: [ { effect: remove_idea, value: FCU_guerra_corporativa } ] }
      - effect: if
        when:
          not_flag: FCU_opa_habilitada
          variable_at_least: { var: FCU_meridian, value: 70 }
          any:
            - { variables_below: [ { var: FCU_castellane, value: 25 }, { var: FCU_halvorsen, value: 25 } ] }
            - { variables_below: [ { var: FCU_castellane, value: 25 }, { var: FCU_obsidian, value: 25 } ] }
            - { variables_below: [ { var: FCU_halvorsen, value: 25 }, { var: FCU_obsidian, value: 25 } ] }
        then:
          - { effect: flag, value: FCU_opa_habilitada }
          - { effect: event, id: meganations_fcu.2 }

  - id: FCU_auditar_castellane
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_castellane, value: 56 } }, then: [ { effect: add_variable, var: FCU_castellane, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_castellane, value: 45 } }, then: [ { effect: add_variable, var: FCU_castellane, value: 10 } ] }

  - id: FCU_auditar_halvorsen
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_halvorsen, value: 56 } }, then: [ { effect: add_variable, var: FCU_halvorsen, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_halvorsen, value: 45 } }, then: [ { effect: add_variable, var: FCU_halvorsen, value: 10 } ] }

  - id: FCU_auditar_meridian
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_meridian, value: 56 } }, then: [ { effect: add_variable, var: FCU_meridian, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_meridian, value: 45 } }, then: [ { effect: add_variable, var: FCU_meridian, value: 10 } ] }

  - id: FCU_auditar_obsidian
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_obsidian, value: 56 } }, then: [ { effect: add_variable, var: FCU_obsidian, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_obsidian, value: 45 } }, then: [ { effect: add_variable, var: FCU_obsidian, value: 10 } ] }

  # El Monte (EFE): pasado cierto umbral, el golpe queda al alcance de un foco.
  - id: EFE_recalcular_monte
    effects:
      - { effect: clamp, var: EFE_control_del_monte, min: 0, max: 100 }
      - effect: if
        when: { variable_at_least: { var: EFE_control_del_monte, value: 60 }, not_flag: EFE_monte_listo }
        then:
          - { effect: flag, value: EFE_monte_listo }
          - { effect: event, id: meganations_efe.12 }

  # ASC: saca las 12 ideas de cómputo y pone la que corresponde a la prioridad y al nivel.
  - id: ASC_recalcular_computo
    effects:
    - {effect: clamp, var: ASC_computo, min: 0, max: 150}
    - effect: idea_tiers
      tiers:
      - idea: ASC_computo_guerra_3
        when:
          flag: ASC_prioridad_guerra
          variable_at_least: {var: ASC_computo, value: 80}
      - idea: ASC_computo_guerra_2
        when:
          flag: ASC_prioridad_guerra
          variable_at_least: {var: ASC_computo, value: 40}
      - idea: ASC_computo_guerra_1
        when: {flag: ASC_prioridad_guerra}
      - idea: ASC_computo_investigacion_3
        when:
          flag: ASC_prioridad_investigacion
          variable_at_least: {var: ASC_computo, value: 80}
      - idea: ASC_computo_investigacion_2
        when:
          flag: ASC_prioridad_investigacion
          variable_at_least: {var: ASC_computo, value: 40}
      - idea: ASC_computo_investigacion_1
        when: {flag: ASC_prioridad_investigacion}
      - idea: ASC_computo_logistica_3
        when:
          flag: ASC_prioridad_logistica
          variable_at_least: {var: ASC_computo, value: 80}
      - idea: ASC_computo_logistica_2
        when:
          flag: ASC_prioridad_logistica
          variable_at_least: {var: ASC_computo, value: 40}
      - idea: ASC_computo_logistica_1
        when: {flag: ASC_prioridad_logistica}
      - idea: ASC_computo_economia_3
        when:
          variable_at_least: {var: ASC_computo, value: 80}
      - idea: ASC_computo_economia_2
        when:
          variable_at_least: {var: ASC_computo, value: 40}
      - idea: ASC_computo_economia_1
        when: {}

  # HSN: cuenta los nodos controlados, pone la idea del nivel, castiga perder uno y suma botín.
  - id: HSN_recalcular_nodos
    effects:
    - {effect: set_variable, var: HSN_nodos_prev, value: HSN_nodos}
    - {effect: set_variable, var: HSN_nodos, value: 0}
    - effect: if
      when:
        controls_state:
        - Singapore
        - Straits Settlements
        - Malaya
        - Kuala Lumpur
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - West Java
        - Banten
        - Batavia
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Kanto
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Manila
        - Luzon
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Taiwan
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Hong Kong
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Okinawa
        - Ryukyu
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Kitakyūshū
        - Kitakyushu
        - Kyushu
        - Fukuoka
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: idea_tiers
      tiers:
      - idea: HSN_camara_mundial
        when:
          not_flag: HSN_tavake
          variable_at_least: {var: HSN_nodos, value: 8}
      - idea: HSN_red_nodos_3
        when:
          not_flag: HSN_tavake
          variable_at_least: {var: HSN_nodos, value: 6}
      - idea: HSN_red_nodos_2
        when:
          not_flag: HSN_tavake
          variable_at_least: {var: HSN_nodos, value: 4}
      - idea: HSN_red_nodos_1
        when:
          not_flag: HSN_tavake
          variable_at_least: {var: HSN_nodos, value: 2}
    - effect: if
      when:
        variable_below: {var: HSN_nodos, value: HSN_nodos_prev}
      then:
      - {effect: timed_idea, idea: HSN_nodo_perdido, days: 180}
    - effect: if
      when: {flag: HSN_tavake, at_war: true}
      then:
      - {effect: add_variable, var: HSN_botin, value: 2}
      - {effect: add_variable, var: HSN_botin, value: HSN_nodos}

  # NAS: el Inti-Soma de cada mes (granjas, máximo, riesgo de sobrecarga).
  - id: NAS_mes_del_sol
    effects:
    - {effect: add_variable, var: NAS_inti, value: NAS_granjas}
    - effect: if
      when:
        not_flag: NAS_sobrecarga
        variable_at_least: {var: NAS_inti, value: NAS_inti_max}
      then:
      - {effect: set_variable, var: NAS_inti, value: NAS_inti_max}
    - effect: if
      when:
        flag: NAS_sobrecarga
        variable_at_least: {var: NAS_inti, value: NAS_inti_max}
      then:
      - effect: random
        options:
        - weight: 80
          effects: []
        - weight: 20
          effects:
          - {effect: set_variable, var: NAS_inti, value: 0}
          - {effect: clear_flag, value: NAS_sobrecarga}
          - {effect: timed_idea, idea: NAS_noche_del_sol, days: 90}
          - {effect: event, id: meganations_nas.2}

  # SHD: los tres caudales.
  - id: SHD_recalcular_caudales
    effects:
    - {effect: clamp, var: SHD_produccion, min: 0, max: 100}
    - {effect: clamp, var: SHD_orden, min: 0, max: 100}
    - effect: if
      when: {flag: SHD_zhou}
      then:
      - {effect: clamp, var: SHD_pueblo, min: 0, max: 130}
      else:
      - {effect: clamp, var: SHD_pueblo, min: 0, max: 100}
    - effect: idea_tiers
      tiers:
      - idea: SHD_armonia_perfecta
        when:
          not_flag: SHD_zhou
          all_between:
            vars:
            - SHD_produccion
            - SHD_orden
            - SHD_pueblo
            min: 45
            max: 55
      - idea: SHD_armonia_parcial
        when:
          not_flag: SHD_zhou
          all_between:
            vars:
            - SHD_produccion
            - SHD_orden
            - SHD_pueblo
            min: 35
            max: 65
    - effect: idea_tiers
      tiers:
      - idea: SHD_crecida_3
        when:
          flag: SHD_zhou
          variable_at_least: {var: SHD_pueblo, value: 120}
      - idea: SHD_crecida_2
        when:
          flag: SHD_zhou
          variable_at_least: {var: SHD_pueblo, value: 100}
      - idea: SHD_crecida_1
        when:
          flag: SHD_zhou
          variable_at_least: {var: SHD_pueblo, value: 80}
    - effect: idea_tiers
      tiers:
      - idea: SHD_desborde
        when:
          any:
          - variable_below: {var: SHD_produccion, value: 20}
          - variable_below: {var: SHD_orden, value: 20}
          - variable_below: {var: SHD_pueblo, value: 20}
  - id: SHD_mes_del_caudal
    effects:
    - effect: if
      when: {flag: SHD_zhou}
      then:
      - {effect: add_variable, var: SHD_pueblo, value: 5}
      - {effect: add_variable, var: SHD_orden, value: -2}
    - effect: if
      when:
        variable_below: {var: SHD_orden, value: 30}
        not_idea: SHD_huelgas
      then:
      - effect: random
        options:
        - weight: 70
          effects: []
        - weight: 30
          effects:
          - {effect: timed_idea, idea: SHD_huelgas, days: 60}
    - {effect: run, value: SHD_recalcular_caudales}
  - id: SHD_ajustar_produccion
    effects:
    - effect: if
      when:
        variable_at_least: {var: SHD_produccion, value: 55}
      then:
      - {effect: add_variable, var: SHD_produccion, value: -5}
    - effect: if
      when:
        variable_below: {var: SHD_produccion, value: 46}
      then:
      - {effect: add_variable, var: SHD_produccion, value: 5}
  - id: SHD_ajustar_orden
    effects:
    - effect: if
      when:
        variable_at_least: {var: SHD_orden, value: 55}
      then:
      - {effect: add_variable, var: SHD_orden, value: -5}
    - effect: if
      when:
        variable_below: {var: SHD_orden, value: 46}
      then:
      - {effect: add_variable, var: SHD_orden, value: 5}
  - id: SHD_ajustar_pueblo
    effects:
    - effect: if
      when:
        variable_at_least: {var: SHD_pueblo, value: 55}
      then:
      - {effect: add_variable, var: SHD_pueblo, value: -5}
    - effect: if
      when:
        variable_below: {var: SHD_pueblo, value: 46}
      then:
      - {effect: add_variable, var: SHD_pueblo, value: 5}

  # NRE: legiones y Auctoritas.
  - id: NRE_recalcular_legiones
    effects:
    - {effect: clamp, var: NRE_prestigio_italica, min: 0, max: 100}
    - {effect: clamp, var: NRE_prestigio_macedonica, min: 0, max: 100}
    - {effect: clamp, var: NRE_prestigio_fulminata, min: 0, max: 100}
    - {effect: clamp, var: NRE_auctoritas, min: 0, max: 100}
    - effect: idea_tiers
      tiers:
      - idea: NRE_legiones_veteranas
        when:
          any:
          - variable_at_least: {var: NRE_prestigio_italica, value: 60}
          - variable_at_least: {var: NRE_prestigio_macedonica, value: 60}
          - variable_at_least: {var: NRE_prestigio_fulminata, value: 60}
    - effect: idea_tiers
      tiers:
      - idea: NRE_privilegios_legionarios
        when:
          any:
          - variable_at_least: {var: NRE_prestigio_italica, value: 80}
          - variable_at_least: {var: NRE_prestigio_macedonica, value: 80}
          - variable_at_least: {var: NRE_prestigio_fulminata, value: 80}
  - id: NRE_mes_de_las_legiones
    effects:
    - effect: if
      when: {at_war: true}
      then:
      - {effect: add_variable, var: NRE_auctoritas, value: 3}
      - effect: random
        options:
        - weight: 40
          effects:
          - {effect: add_variable, var: NRE_prestigio_italica, value: 6}
        - weight: 30
          effects:
          - {effect: add_variable, var: NRE_prestigio_macedonica, value: 6}
        - weight: 30
          effects:
          - {effect: add_variable, var: NRE_prestigio_fulminata, value: 6}
      else:
      - {effect: add_variable, var: NRE_auctoritas, value: 1}
      - {effect: add_variable, var: NRE_prestigio_italica, value: -1}
      - {effect: add_variable, var: NRE_prestigio_macedonica, value: -1}
      - {effect: add_variable, var: NRE_prestigio_fulminata, value: -1}
    - effect: if
      when: {focus: NRE_la_guardia_pretoriana}
      then:
      - {effect: add_variable, var: NRE_auctoritas, value: 1}
    - {effect: run, value: NRE_recalcular_legiones}
    - effect: if
      when: {flag: NRE_cuatro, not_flag: NRE_aclamacion_reciente}
      then:
      - effect: if
        when:
          not_flag: NRE_imperator_italica
          variable_at_least: {var: NRE_prestigio_italica, value: 85}
        then:
        - {effect: flag, value: NRE_aclamacion_reciente, days: 180}
        - {effect: event, id: meganations_nre.4, days: 1}
        else:
        - effect: if
          when:
            not_flag: NRE_imperator_macedonica
            variable_at_least: {var: NRE_prestigio_macedonica, value: 85}
          then:
          - {effect: flag, value: NRE_aclamacion_reciente, days: 180}
          - {effect: event, id: meganations_nre.5, days: 1}
          else:
          - effect: if
            when:
              not_flag: NRE_imperator_fulminata
              variable_at_least: {var: NRE_prestigio_fulminata, value: 85}
            then:
            - {effect: flag, value: NRE_aclamacion_reciente, days: 180}
            - {effect: event, id: meganations_nre.6, days: 1}
    - effect: if
      when:
        not_flag: NRE_exigencia_reciente
        any:
        - variable_at_least: {var: NRE_prestigio_italica, value: 100}
        - variable_at_least: {var: NRE_prestigio_macedonica, value: 100}
        - variable_at_least: {var: NRE_prestigio_fulminata, value: 100}
      then:
      - {effect: flag, value: NRE_exigencia_reciente, days: 180}
      - {effect: event, id: meganations_nre.3, days: 1}
