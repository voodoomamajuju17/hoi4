  # usan varias. Sin país: sirve para meganaciones y anarquías.
  - id: MEGANATIONS_leva_forzosa_1
    country: null
    name: {english: 'Forced Levy I', spanish: 'Leva Forzosa I'}
    desc: {english: 'Emergency I took the young from the fields. It wears off in 6 months.', spanish: 'La Emergencia I sacó a los jóvenes del campo. Se va en 6 meses.'}
    modifiers: {stability_factor: -0.1, war_support_factor: -0.1}     # 2026-10-09: x2 (antes -5%)
  - id: MEGANATIONS_leva_forzosa_2
    country: null
    name: {english: 'Forced Levy II', spanish: 'Leva Forzosa II'}
    desc: {english: 'Emergency II emptied the factories. It wears off in 9 months.', spanish: 'La Emergencia II vació las fábricas. Se va en 9 meses.'}
    modifiers: {stability_factor: -0.1, war_support_factor: -0.1}     # 2026-10-09: x2 (antes -5%)
  - id: MEGANATIONS_leva_forzosa_3
    country: null
    name: {english: 'Forced Levy III', spanish: 'Leva Forzosa III'}
    desc: {english: 'Emergency III armed everyone who could stand. It wears off in 12 months.', spanish: 'La Emergencia III armó a todo el que se tenía en pie. Se va en 12 meses.'}
    modifiers: {stability_factor: -0.2, war_support_factor: -0.2}     # 2026-10-09: x2 (antes -10%)
  - id: FCU_mod_directorio
    country: FCU
    name: {english: The Directorate, spanish: El Directorio}
    desc:
      english: Each corporation above 50 pushes its field up; below 50, down. The numbers change every month.
      spanish: Cada corporación por encima de 50 empuja su área para arriba; por debajo de 50, para abajo. Los números cambian cada mes.
