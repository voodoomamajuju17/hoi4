# =============================================================================
# Nombres de las variables (2026-09-27): HOI4 no muestra los cambios de
# variables en los tooltips (un foco que solo suma una variable decía "no tiene
# efecto"). Cada add_variable de una variable con nombre lleva su tooltip.
# hidden: a propósito no se muestra (el Control del Monte es secreto).
# =============================================================================
variable_names:
  APF_desarrollo_zet: {english: "Highlands Development", spanish: "Desarrollo de las Tierras Altas"}
  APF_desarrollo_zsa: {english: "Cape Development", spanish: "Desarrollo del Cabo"}
  APF_integracion_zet: {english: "Highlands Integration", spanish: "Integración de las Tierras Altas"}
  APF_integracion_zsa: {english: "Cape Integration", spanish: "Integración del Cabo"}
  APF_tension: {english: "Regional tension", spanish: "Tensión regional"}
  ASC_calor: {english: "Grid heat", spanish: "Calor de la red"}
  ASC_computo: {english: "Compute", spanish: "Cómputo"}
  EFE_biosteel: {english: "BioSteel", spanish: "Bioacero"}
  EFE_control_del_monte: {hidden: true}
  EFE_integracion_pta: {english: "Patagonia integration stage", spanish: "Etapa de integración de la Patagonia"}
