      spanish: 'Carisma [?MEGANATIONS_lider_carisma|0]/10 (cada punto sobre o bajo 5: ±3% de estabilidad) · Astucia [?MEGANATIONS_lider_astucia|0]/10 (±0,15 de poder político por día) · Prestigio [?MEGANATIONS_lider_prestigio|0]/10 (±4% de apoyo a la guerra) · Salud [?MEGANATIONS_lider_salud|0]/10 (baja 1 por año; en 0 el líder se desploma: -20% de estabilidad, -150 de poder político). Cada seis meses el líder enfrenta una decisión.'
    src: user_request
