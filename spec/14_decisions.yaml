  # 2026-10-17 (pedido del usuario): misiones con reloj de las legiones, con premio y costo en Auctoritas.
  - id: NRE_campanas_category
    country: NRE
    icon_prefer:
    - generic_army_support
    - generic_prepare_civil_war
    name: {english: 'The Campaigns of the Legions', spanish: 'Las Campañas de las Legiones'}
    desc:
      english: 'AUCTORITAS: [?NRE_auctoritas]\nLegio I Italica: [?NRE_prestigio_italica]   Legio V Macedonica: [?NRE_prestigio_macedonica]   Legio XII Fulminata: [?NRE_prestigio_fulminata]\n\nEntrust a campaign to a legion (15 Auctoritas). Each has a clock and a goal: the Italica holds the line, the Macedonica marches east, the Fulminata strikes a warlord capital. Triumph: prestige, Auctoritas, experience and The Triumph. Failure: the emperor pays in Auctoritas.'
      spanish: 'AUCTORITAS: [?NRE_auctoritas]\nLegio I Italica: [?NRE_prestigio_italica]   Legio V Macedonica: [?NRE_prestigio_macedonica]   Legio XII Fulminata: [?NRE_prestigio_fulminata]\n\nEncomendarle una campaña a una legión (15 de Auctoritas). Cada una tiene un reloj y una meta: la Italica sostiene la línea, la Macedonica marcha al este, la Fulminata golpea una capital de caudillos. Triunfo: prestigio, Auctoritas, experiencia y El Triunfo. Fracaso: el emperador lo paga en Auctoritas.'
    src: user_request
