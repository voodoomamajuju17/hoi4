scripted_effects:

  # Después de cada contrato o foco que mueve una corporación.
  - id: FCU_recalcular_directorio
    effects:
    - {effect: clamp, var: FCU_castellane, min: 1, max: 100}
    - {effect: clamp, var: FCU_halvorsen, min: 1, max: 100}
    - {effect: clamp, var: FCU_meridian, min: 1, max: 100}
    - {effect: clamp, var: FCU_obsidian, min: 1, max: 100}
    - effect: math
      ops:
      - - set
        - FCU_suma
        - FCU_castellane
      - - add
        - FCU_suma
        - FCU_halvorsen
      - - add
        - FCU_suma
        - FCU_meridian
      - - add
        - FCU_suma
        - FCU_obsidian
      - - set
        - FCU_factor
        - 200
      - - div
        - FCU_factor
        - FCU_suma
      - - mul
        - FCU_castellane
        - FCU_factor
      - - round
        - FCU_castellane
        - null
      - - mul
        - FCU_halvorsen
        - FCU_factor
      - - round
        - FCU_halvorsen
        - null
      - - mul
        - FCU_meridian
        - FCU_factor
      - - round
        - FCU_meridian
        - null
      - - mul
        - FCU_obsidian
        - FCU_factor
      - - round
        - FCU_obsidian
        - null
    - effect: math
      ops:
      - - set
        - FCU_ef_castellane
        - FCU_castellane
      - - sub
        - FCU_ef_castellane
        - 50
      - - mul
        - FCU_ef_castellane
        - 3
      - - div
        - FCU_ef_castellane
        - 1000
      - - set
        - FCU_ef_castellane_ver
        - FCU_ef_castellane
      - - mul
        - FCU_ef_castellane_ver
        - 100
      - - round
        - FCU_ef_castellane_ver
        - null
      - - set
        - FCU_ef_halvorsen
        - FCU_halvorsen
      - - sub
        - FCU_ef_halvorsen
        - 50
      - - mul
        - FCU_ef_halvorsen
        - -3
      - - div
        - FCU_ef_halvorsen
        - 1000
      - - set
        - FCU_ef_halvorsen_ver
        - FCU_ef_halvorsen
      - - mul
        - FCU_ef_halvorsen_ver
        - 100
      - - round
        - FCU_ef_halvorsen_ver
        - null
      - - set
        - FCU_ef_meridian
        - FCU_meridian
      - - sub
        - FCU_ef_meridian
        - 50
      - - mul
        - FCU_ef_meridian
        - 1
      - - div
        - FCU_ef_meridian
        - 250
      - - set
        - FCU_ef_meridian_ver
        - FCU_ef_meridian
      - - mul
        - FCU_ef_meridian_ver
        - 100
      - - round
        - FCU_ef_meridian_ver
        - null
      - - set
        - FCU_ef_obsidian
        - FCU_obsidian
      - - sub
        - FCU_ef_obsidian
        - 50
      - - mul
        - FCU_ef_obsidian
        - 1
      - - div
        - FCU_ef_obsidian
        - 50
      - - set
        - FCU_ef_obsidian_ver
        - FCU_ef_obsidian
      - - mul
        - FCU_ef_obsidian_ver
        - 100
      - - round
        - FCU_ef_obsidian_ver
        - null
      - - div
        - FCU_ef_obsidian_ver
        - 100
    - {effect: dynamic_modifier, id: FCU_mod_directorio}
    - effect: if
      when:
        not_flag: FCU_opa_consumada
        all_between:
          vars:
          - FCU_castellane
          - FCU_halvorsen
          - FCU_meridian
          - FCU_obsidian
          min: 40
          max: 60
      then:
      - effect: if
        when: {not_idea: FCU_sinergia_del_directorio}
        then:
        - {effect: add_ideas, value: FCU_sinergia_del_directorio}
      else:
      - effect: if
        when: {idea: FCU_sinergia_del_directorio}
        then:
        - {effect: remove_idea, value: FCU_sinergia_del_directorio}
    - effect: if
      when:
        not_flag: FCU_opa_consumada
        any:
        - variable_below: {var: FCU_castellane, value: 15}
        - variable_below: {var: FCU_halvorsen, value: 15}
        - variable_below: {var: FCU_meridian, value: 15}
        - variable_below: {var: FCU_obsidian, value: 15}
      then:
      - effect: if
        when: {not_idea: FCU_guerra_corporativa}
        then:
        - {effect: add_ideas, value: FCU_guerra_corporativa}
      else:
      - effect: if
        when: {idea: FCU_guerra_corporativa}
        then:
        - {effect: remove_idea, value: FCU_guerra_corporativa}
    - effect: if
      when:
        not_flag: FCU_opa_habilitada
        variable_at_least: {var: FCU_meridian, value: 70}
        any:
        - variables_below:
          - {var: FCU_castellane, value: 35}
          - {var: FCU_halvorsen, value: 35}
        - variables_below:
          - {var: FCU_castellane, value: 35}
          - {var: FCU_obsidian, value: 35}
        - variables_below:
          - {var: FCU_halvorsen, value: 35}
          - {var: FCU_obsidian, value: 35}
      then:
      - {effect: flag, value: FCU_opa_habilitada}
      - {effect: event, id: meganations_fcu.2}

  - id: FCU_auditar_castellane
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_castellane, value: 56 } }, then: [ { effect: add_variable, var: FCU_castellane, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_castellane, value: 45 } }, then: [ { effect: add_variable, var: FCU_castellane, value: 10 } ] }

  - id: FCU_auditar_halvorsen
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_halvorsen, value: 56 } }, then: [ { effect: add_variable, var: FCU_halvorsen, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_halvorsen, value: 45 } }, then: [ { effect: add_variable, var: FCU_halvorsen, value: 10 } ] }

  - id: FCU_auditar_meridian
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_meridian, value: 56 } }, then: [ { effect: add_variable, var: FCU_meridian, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_meridian, value: 45 } }, then: [ { effect: add_variable, var: FCU_meridian, value: 10 } ] }

  - id: FCU_auditar_obsidian
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_obsidian, value: 56 } }, then: [ { effect: add_variable, var: FCU_obsidian, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_obsidian, value: 45 } }, then: [ { effect: add_variable, var: FCU_obsidian, value: 10 } ] }

  # El Monte (EFE): pasado cierto umbral, el golpe queda al alcance de un foco.
  - id: EFE_recalcular_monte
    effects:
      - { effect: clamp, var: EFE_control_del_monte, min: 0, max: 100 }
      - effect: if
        when: { variable_at_least: { var: EFE_control_del_monte, value: 60 }, not_flag: EFE_monte_listo }
        then:
          - { effect: flag, value: EFE_monte_listo }
          - { effect: event, id: meganations_efe.12 }

  # ASC: saca las 12 ideas de cómputo y pone la que corresponde a la prioridad y al nivel.
  - id: ASC_recalcular_computo
    effects:
    - {effect: clamp, var: ASC_computo, min: 0, max: 150}
    - effect: math
      ops:
      - - set
        - ASC_ef_fabricas
        - 0
      - - set
        - ASC_ef_construccion
        - 0
      - - set
        - ASC_ef_investigacion
        - 0
      - - set
        - ASC_ef_org
        - 0
      - - set
        - ASC_ef_infra
