    name: {english: Inti-Soma, spanish: Inti-Soma}
    desc:
      english: 'Sacred light in the temples: [?NAS_inti] of [?NAS_inti_max]  ->  research +[?NAS_ef_luz_ver]%\nSun Farms: [?NAS_granjas] (each adds
        1 light per month)\n\nKEEP OR SPEND: stored light speeds up research (spirit ''The Light of the Temples''). Spending it on a ceremony gives
        a strong bonus for a while, but the research bonus goes down.\nThe temples burn 3 light per month. Below 10: the Hungry Sun. 90 or more:
        Solar Fervour. An overloaded temple shines brighter, until the Night of the Sun. There are eclipses.'
      spanish: 'Luz sagrada en los templos: [?NAS_inti] de [?NAS_inti_max]  ->  investigación +[?NAS_ef_luz_ver]%\nGranjas del Sol: [?NAS_granjas]
        (cada una suma 1 de luz por mes)\n\nGUARDAR O GASTAR: la luz guardada acelera la investigación (espíritu «La Luz de los Templos»). Gastarla
        en una ceremonia da un bonus fuerte por un tiempo, pero baja el de investigación.\nLos templos queman 3 de luz por mes. Por debajo de 10:
        el Sol Hambriento. 90 o más: Fervor Solar. Un templo sobrecargado brilla más, hasta La Noche del Sol. Hay eclipses.'
    src: user_design
    decisions:
