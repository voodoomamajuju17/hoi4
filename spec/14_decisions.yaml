      english: 'Gloria: [?NRE_gloria]\nTriumphal cities: [?NRE_productoras_r] / 5\n\nGloria is what Rome remembers about itself: arches, games, triumphs. Five great cities produce it. Bread and circuses cost Gloria; so does every triumph that is worth remembering.\n\nPRODUCERS: Rome, Lutetia, Lugdunum, Massilia, Burdigala. Each one adds 1 Gloria a month; losing one costs 10 and 180 days of trouble, and it produces again only when we retake and restore it.\nTHE THREE CHOICES: at 25, 50, 75 Gloria you can spend them, once each, on a permanent choice between three paths.\nSPENDING: smaller amounts buy temporary bonuses.'
      spanish: 'Gloria: [?NRE_gloria]\nCiudades triunfales: [?NRE_productoras_r] / 5\n\nLa Gloria es lo que Roma recuerda de sí misma: arcos, juegos, triunfos. Cinco grandes ciudades la producen. El pan y circo cuesta Gloria; y también cada triunfo que valga la pena recordar.\n\nPRODUCTORAS: Roma, Lutecia, Lugdunum, Massilia, Burdigala. Cada una suma 1 de Gloria por mes; perder una cuesta 10 y 180 días de problemas, y vuelve a producir recién cuando la recuperamos y la restauramos.\nLAS TRES ELECCIONES: con 25, 50, 75 de Gloria podés gastarlos, una vez cada una, en una elección permanente entre tres caminos.\nGASTAR: con menos se compran bonos temporales.'
