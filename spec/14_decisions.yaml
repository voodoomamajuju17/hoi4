  # ===========================================================================
  # APF — La Integración Federal, Aldea o Corredor ("Las Ocho Potencias")
  # ===========================================================================
  - id: APF_integracion_category
    country: APF
    icon_prefer:
    - generic_political_actions
    - generic_construction
    name: {english: Federal Integration, spanish: La Integración Federal}
    desc:
      english: 'HOW THE FEDERATION WORKS\nDevelopment = how much the Federation has invested in a member. Every investment builds it a factory and
        adds +20.\nIntegration = how far that member has joined the Federation. Under Amara it can never pass Development: invest first, integrate
        later. At 100 the member joins the APF with cores.\n\nHighlands: Development [?APF_desarrollo_zet], Integration [?APF_integracion_zet]\nCape:
        Development [?APF_desarrollo_zsa], Integration [?APF_integracion_zsa]\nCongo Confederation: Development [?APF_desarrollo_zco], Integration [?APF_integracion_zco]\nAngolan Union: Development [?APF_desarrollo_zao], Integration [?APF_integracion_zao]\nMozambique League: Development [?APF_desarrollo_zmz], Integration [?APF_integracion_zmz]\nRed Island Assembly: Development [?APF_desarrollo_zmg], Integration [?APF_integracion_zmg]\nRift Federation: Development [?APF_desarrollo_zke], Integration [?APF_integracion_zke]\nRegional tension: [?APF_tension] / 100  ->  stability [?APF_ef_tension_ver]%\nWhat
        is invested in the members speeds up APF construction: +[?APF_ef_desarrollo_ver]%\n\nTENSION: every investment +3 (the others want theirs);
        every integration +5 (+10 under Diallo); every half-integrated member (Integration 40 to 99) +1 per month. It falls 3 per month and with
        the Assembly of the Councils.\n50 or more: Restless Councils. 75 or more: the councils may rise.'
      spanish: 'CÓMO FUNCIONA LA FEDERACIÓN\nDesarrollo = cuánto invirtió la Federación en un miembro. Cada inversión le construye una fábrica y
        le suma +20.\nIntegración = cuánto se sumó ese miembro a la Federación. Con Amara nunca puede pasar al Desarrollo: primero se invierte,
        después se integra. En 100 el miembro se suma a la APF con núcleos.\n\nTierras Altas: Desarrollo [?APF_desarrollo_zet], Integración [?APF_integracion_zet]\nCabo:
        Desarrollo [?APF_desarrollo_zsa], Integración [?APF_integracion_zsa]\nConfederación del Congo: Desarrollo [?APF_desarrollo_zco], Integración [?APF_integracion_zco]\nUnión de Angola: Desarrollo [?APF_desarrollo_zao], Integración [?APF_integracion_zao]\nLiga de Mozambique: Desarrollo [?APF_desarrollo_zmz], Integración [?APF_integracion_zmz]\nAsamblea de la Isla Roja: Desarrollo [?APF_desarrollo_zmg], Integración [?APF_integracion_zmg]\nFederación del Rift: Desarrollo [?APF_desarrollo_zke], Integración [?APF_integracion_zke]\nTensión regional: [?APF_tension] / 100  ->  estabilidad [?APF_ef_tension_ver]%\nLo
        invertido en los miembros acelera la construcción de la APF: +[?APF_ef_desarrollo_ver]%\n\nLA TENSIÓN: cada inversión +3 (los demás piden
        lo suyo); cada integración +5 (+10 con Diallo); cada miembro a medio integrar (Integración de 40 a 99) +1 por mes. Baja 3 por mes y con
        la Asamblea de los Consejos.\n50 o más: Consejos Inquietos. 75 o más: los consejos pueden levantarse.'
    src: user_design
    decisions:
    - id: APF_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      effects:
      - {effect: event, id: meganations_apf.29}
      ai: {factor: 0}
      src: user_decision
    - id: APF_invertir_zet
      name:
        english: Invest in Highlands Federation (Development +20)
        spanish: Invertir en la Federación de las Tierras Altas (Desarrollo +20)
      desc:
        english: 'Congress money for the Highlands Federation: +20 Development and a factory there.'
        spanish: 'Plata del Congreso para la Federación de las Tierras Altas: +20 de Desarrollo y una fábrica allá.'
      icon_prefer:
      - generic_construction
      - generic_industry
      cost: 35
      cooldown_days: 45
      visible: {country_exists: ZET, country: {tag: ZET, when: {subject_of: APF}}}
      available:
        variable_below: {var: APF_desarrollo_zet, value: 100}
      effects:
      - {effect: add_variable, var: APF_desarrollo_zet, value: 20}
      - {effect: clamp, var: APF_desarrollo_zet, min: 0, max: 100}
      - effect: scope
        target: ZET
        effects:
        - {effect: build, building: industrial_complex, level: 1}
      - {effect: add_variable, var: APF_tension, value: 3}
      ai:
        factor: 4
        modifiers:
        - factor: 0
          when:
            variable_at_least: {var: APF_tension, value: 75}
        - factor: 0.2
          when:
            variable_at_least: {var: APF_desarrollo_zet, value: 70}
        - factor: 3
          when:
            variable_below: {var: APF_desarrollo_zet, value: 40}
    - id: APF_integrar_zet
      name:
        english: Integrate Highlands Federation (Integration +20)
        spanish: Integrar la Federación de las Tierras Altas (Integración +20)
      desc:
        english: Under Amara, Integration grows +20 and can never pass Development. Under Diallo, +30 and it can. At 100 the member joins with cores.
        spanish: Con Amara, la Integración sube +20 y nunca puede pasar al Desarrollo. Con Diallo, +30 y sí puede. En 100 el miembro se suma con
          núcleos.
      icon_prefer:
      - generic_political_actions
      cost: 35
      cooldown_days: 45
      visible: {flag: APF_integracion_abierta, country_exists: ZET, country: {tag: ZET, when: {subject_of: APF}}}
      available:
        any:
        - {flag: APF_diallo}
        - variable_at_least: {var: APF_desarrollo_zet, value: APF_integracion_zet}
      effects:
      - {effect: add_variable, var: APF_integracion_zet, value: 20}
      - effect: if
        when: {flag: APF_diallo}
        then:
        - {effect: add_variable, var: APF_integracion_zet, value: 10}
      - effect: if
        when:
          variable_at_least: {var: APF_integracion_zet, value: 100}
        then:
        - effect: scope
          target: ZET
          effects:
          - effect: states
            pick: every
            effects:
            - {effect: add_core, value: APF}
        - {effect: annex, target: ZET}
        - {effect: event, id: meganations_apf.3}
        - effect: if
          when: {flag: APF_diallo}
          then:
          - {effect: timed_idea, idea: APF_territorios_dificiles, days: 180}
          else:
          - {effect: add_stability, value: 0.05}
      - effect: if
        when: {flag: APF_diallo}
        then:
        - {effect: add_variable, var: APF_tension, value: 10}
        else:
        - {effect: add_variable, var: APF_tension, value: 5}
      ai:
        factor: 8
        modifiers:
        - factor: 0
          when:
            variable_at_least: {var: APF_tension, value: 70}
