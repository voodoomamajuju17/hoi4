  # HSN: cuenta los nodos controlados, pone la idea del nivel, castiga perder uno y suma botín.
  - id: HSN_recalcular_nodos
    effects:
    - {effect: set_variable, var: HSN_nodos_prev, value: HSN_nodos}
    - {effect: set_variable, var: HSN_nodos, value: 0}
    - effect: math
      ops:
      - - set
        - HSN_nodo_malaca
        - 0
      - - set
        - HSN_nodo_sunda
        - 0
      - - set
        - HSN_nodo_kanto
        - 0
      - - set
        - HSN_nodo_manila
        - 0
      - - set
        - HSN_nodo_taiwan
        - 0
      - - set
        - HSN_nodo_hong_kong
        - 0
      - - set
        - HSN_nodo_okinawa
        - 0
      - - set
        - HSN_nodo_kyushu
        - 0
    - effect: if
      when:
        controls_state:
        - Singapore
        - Straits Settlements
        - Malaya
        - Kuala Lumpur
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
      - {effect: set_variable, var: HSN_nodo_malaca, value: 1}
    - effect: if
      when:
        controls_state:
        - West Java
        - Banten
        - Batavia
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
      - {effect: set_variable, var: HSN_nodo_sunda, value: 1}
    - effect: if
      when:
        controls_state:
        - Kanto
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
      - {effect: set_variable, var: HSN_nodo_kanto, value: 1}
    - effect: if
      when:
        controls_state:
        - Manila
        - Luzon
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
      - {effect: set_variable, var: HSN_nodo_manila, value: 1}
    - effect: if
      when:
        controls_state:
        - Taiwan
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
      - {effect: set_variable, var: HSN_nodo_taiwan, value: 1}
    - effect: if
      when:
        controls_state:
        - Hong Kong
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
      - {effect: set_variable, var: HSN_nodo_hong_kong, value: 1}
    - effect: if
      when:
        controls_state:
        - Okinawa
        - Ryukyu
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
      - {effect: set_variable, var: HSN_nodo_okinawa, value: 1}
    - effect: if
      when:
        controls_state:
        - Kitakyūshū
        - Kitakyushu
        - Kyushu
        - Fukuoka
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
      - {effect: set_variable, var: HSN_nodo_kyushu, value: 1}
    - effect: idea_tiers
      tiers:
      - idea: HSN_camara_mundial
        when:
          not_flag: HSN_tavake
          variable_at_least: {var: HSN_nodos, value: 8}
      - idea: HSN_red_nodos_3
        when:
          not_flag: HSN_tavake
          variable_at_least: {var: HSN_nodos, value: 6}
      - idea: HSN_red_nodos_2
        when:
          not_flag: HSN_tavake
          variable_at_least: {var: HSN_nodos, value: 4}
      - idea: HSN_red_nodos_1
        when:
          not_flag: HSN_tavake
          variable_at_least: {var: HSN_nodos, value: 2}
    - effect: if
      when:
        variable_below: {var: HSN_nodos, value: HSN_nodos_prev}
      then:
      - {effect: timed_idea, idea: HSN_nodo_perdido, days: 180}
    - effect: if
      when: {flag: HSN_tavake, at_war: true}
      then:
      - {effect: add_variable, var: HSN_botin, value: 2}
      - {effect: add_variable, var: HSN_botin, value: HSN_nodos}

  # NAS: el Inti-Soma de cada mes (granjas, máximo, riesgo de sobrecarga).
  - id: NAS_mes_del_sol
    effects:
    - {effect: add_variable, var: NAS_inti, value: NAS_granjas}
    - effect: if
      when:
        not_flag: NAS_sobrecarga
        variable_at_least: {var: NAS_inti, value: NAS_inti_max}
      then:
      - {effect: set_variable, var: NAS_inti, value: NAS_inti_max}
    - effect: if
      when:
        flag: NAS_sobrecarga
        variable_at_least: {var: NAS_inti, value: NAS_inti_max}
      then:
      - effect: random
        options:
        - weight: 80
          effects: []
        - weight: 20
          effects:
          - {effect: set_variable, var: NAS_inti, value: 0}
          - {effect: clear_flag, value: NAS_sobrecarga}
          - {effect: timed_idea, idea: NAS_noche_del_sol, days: 90}
          - {effect: event, id: meganations_nas.2}

  # SHD: los tres caudales.
