  # Satélites (lealtad) y Anarquía (caudillos), 2026-09-27.
  - id: EFE_recalcular_satelites
    effects:
    - effect: math
      ops:
      - - set
        - EFE_ef_sat_pp
        - 0
      - - set
        - EFE_ef_sat_estab
        - 0
    - {effect: clamp, var: EFE_lealtad_pta, min: 0, max: 100}
    - effect: if
      when:
        country_exists: PTA
        variable_at_least: {var: EFE_lealtad_pta, value: 75}
      then:
      - effect: math
        ops:
        - - add
          - EFE_ef_sat_pp
          - 0.1
    - effect: if
      when:
        country_exists: PTA
        variable_below: {var: EFE_lealtad_pta, value: 25}
      then:
      - effect: math
        ops:
        - - sub
          - EFE_ef_sat_pp
          - 0.1
        - - sub
          - EFE_ef_sat_estab
          - 0.03
    - {effect: clamp, var: EFE_lealtad_yyg, min: 0, max: 100}
    - effect: if
      when:
        country_exists: YYG
        variable_at_least: {var: EFE_lealtad_yyg, value: 75}
      then:
      - effect: math
        ops:
        - - add
          - EFE_ef_sat_pp
          - 0.1
    - effect: if
      when:
        country_exists: YYG
        variable_below: {var: EFE_lealtad_yyg, value: 25}
      then:
      - effect: math
        ops:
        - - sub
          - EFE_ef_sat_pp
          - 0.1
        - - sub
          - EFE_ef_sat_estab
          - 0.03
    - effect: math
      ops:
      - - set
        - EFE_ef_sat_pp_ver
        - EFE_ef_sat_pp
      - - mul
        - EFE_ef_sat_pp_ver
        - 100
      - - round
        - EFE_ef_sat_pp_ver
        - null
      - - div
        - EFE_ef_sat_pp_ver
        - 100
      - - set
        - EFE_ef_sat_estab_ver
        - EFE_ef_sat_estab
      - - mul
        - EFE_ef_sat_estab_ver
        - 100
      - - round
        - EFE_ef_sat_estab_ver
