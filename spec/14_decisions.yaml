  - id: NRE_mes_de_las_legiones
    effects:
    - effect: if
      when: {at_war: true}
      then:
      - {effect: add_variable, var: NRE_auctoritas, value: 3}
      - effect: random
        options:
        - weight: 40
          effects:
          - {effect: add_variable, var: NRE_prestigio_italica, value: 6}
        - weight: 30
          effects:
          - {effect: add_variable, var: NRE_prestigio_macedonica, value: 6}
        - weight: 30
          effects:
          - {effect: add_variable, var: NRE_prestigio_fulminata, value: 6}
      else:
      - {effect: add_variable, var: NRE_auctoritas, value: 1}
      - {effect: add_variable, var: NRE_prestigio_italica, value: -1}
      - {effect: add_variable, var: NRE_prestigio_macedonica, value: -1}
      - {effect: add_variable, var: NRE_prestigio_fulminata, value: -1}
    - effect: if
      when: {focus: NRE_la_guardia_pretoriana}
      then:
      - {effect: add_variable, var: NRE_auctoritas, value: 1}
    - {effect: run, value: NRE_recalcular_legiones}
    - effect: if
      when: {flag: NRE_cuatro, not_flag: NRE_aclamacion_reciente}
      then:
      - effect: if
        when:
          not_flag: NRE_imperator_italica
          variable_at_least: {var: NRE_prestigio_italica, value: 85}
        then:
        - {effect: flag, value: NRE_aclamacion_reciente, days: 180}
        - {effect: event, id: meganations_nre.4, days: 1}
        else:
        - effect: if
          when:
            not_flag: NRE_imperator_macedonica
            variable_at_least: {var: NRE_prestigio_macedonica, value: 85}
          then:
          - {effect: flag, value: NRE_aclamacion_reciente, days: 180}
          - {effect: event, id: meganations_nre.5, days: 1}
          else:
          - effect: if
            when:
              not_flag: NRE_imperator_fulminata
              variable_at_least: {var: NRE_prestigio_fulminata, value: 85}
            then:
            - {effect: flag, value: NRE_aclamacion_reciente, days: 180}
            - {effect: event, id: meganations_nre.6, days: 1}
    - effect: if
      when:
        not_flag: NRE_exigencia_reciente
        any:
        - variable_at_least: {var: NRE_prestigio_italica, value: 100}
        - variable_at_least: {var: NRE_prestigio_macedonica, value: 100}
        - variable_at_least: {var: NRE_prestigio_fulminata, value: 100}
      then:
      - {effect: flag, value: NRE_exigencia_reciente, days: 180}
      - {effect: event, id: meganations_nre.3, days: 1}

  # Las Ocho Potencias v2 (2026-09-26): el pulso mensual de cada mecánica y sus riesgos.
  - id: EFE_pulso_de_las_cubas
    effects:
    # 2026-10-17 Bioacero v3 (pedido del usuario): lo normal es ir de 1 a 30.
    # El hambre es un cuarto del Bioacero (antes la mitad) y la saturación baja 4 sola.
    - {effect: add_variable, var: EFE_saturacion, value: -4}
    - effect: math
      ops:
      - - set
        - EFE_hambre_del_metal
        - EFE_biosteel
      - - div
        - EFE_hambre_del_metal
        - 4
      - - round
        - EFE_hambre_del_metal
        - null
    - {effect: add_variable, var: EFE_saturacion, value: EFE_hambre_del_metal}
    - effect: if
      when: {focus: EFE_rotar_los_cultivos}
      then:
      - {effect: add_variable, var: EFE_saturacion, value: -3}
    - effect: if
      when: {flag: EFE_cubas_sin_fondo}
      then:
      - {effect: add_variable, var: EFE_saturacion, value: -3}
    # Las cinco regiones productoras: un brote por mes cada una (dos con la Cosecha Doble).
    # Solo se puede perder una productora que ya se vio controlada (bandera _activa):
    # si el juego no reconociera un nombre, esa región no produce pero tampoco se "pierde".
    - effect: math
      ops:
      - - set
        - EFE_productoras
        - 0
    - effect: if
      when:
        controls_state: [Buenos Aires]
        not_flag: EFE_prod_1_perdida
      then:
      - {effect: flag, value: EFE_prod_1_activa}
      - {effect: add_variable, var: EFE_productoras, value: 1}
      - effect: if
        when: {not_flag: EFE_sequia_pampa}
        then:
        - {effect: add_variable, var: EFE_brote, value: 1}
        - effect: if
          when: {flag: EFE_cosecha_doble}
          then:
          - {effect: add_variable, var: EFE_brote, value: 1}
    - effect: if
      when:
        not: {controls_state: [Buenos Aires]}
        not_flag: EFE_prod_1_perdida
        flag: EFE_prod_1_activa
      then:
      - {effect: flag, value: EFE_prod_1_perdida}
      - {effect: add_variable, var: EFE_biosteel, value: -3}
      - {effect: dynamic_modifier, id: EFE_cubas_quemadas, days: 180}
      - {effect: event, id: meganations_efe.501, days: 1}
    - effect: if
      when:
        controls_state: [Santa Fe]
        not_flag: EFE_prod_2_perdida
      then:
      - {effect: flag, value: EFE_prod_2_activa}
      - {effect: add_variable, var: EFE_productoras, value: 1}
      - effect: if
        when: {not_flag: EFE_sequia_pampa}
        then:
        - {effect: add_variable, var: EFE_brote, value: 1}
        - effect: if
          when: {flag: EFE_cosecha_doble}
          then:
          - {effect: add_variable, var: EFE_brote, value: 1}
    - effect: if
      when:
        not: {controls_state: [Santa Fe]}
        not_flag: EFE_prod_2_perdida
        flag: EFE_prod_2_activa
      then:
      - {effect: flag, value: EFE_prod_2_perdida}
      - {effect: add_variable, var: EFE_biosteel, value: -3}
      - {effect: dynamic_modifier, id: EFE_cubas_quemadas, days: 180}
      - {effect: event, id: meganations_efe.502, days: 1}
    - effect: if
      when:
        controls_state: [Mendoza]
        not_flag: EFE_prod_3_perdida
      then:
      - {effect: flag, value: EFE_prod_3_activa}
      - {effect: add_variable, var: EFE_productoras, value: 1}
      - effect: if
        when: {not_flag: EFE_sequia_pampa}
        then:
        - {effect: add_variable, var: EFE_brote, value: 1}
        - effect: if
          when: {flag: EFE_cosecha_doble}
          then:
          - {effect: add_variable, var: EFE_brote, value: 1}
    - effect: if
      when:
        not: {controls_state: [Mendoza]}
        not_flag: EFE_prod_3_perdida
        flag: EFE_prod_3_activa
      then:
      - {effect: flag, value: EFE_prod_3_perdida}
      - {effect: add_variable, var: EFE_biosteel, value: -3}
      - {effect: dynamic_modifier, id: EFE_cubas_quemadas, days: 180}
      - {effect: event, id: meganations_efe.503, days: 1}
    - effect: if
      when:
        controls_state: [Tucumán]
        not_flag: EFE_prod_4_perdida
      then:
      - {effect: flag, value: EFE_prod_4_activa}
      - {effect: add_variable, var: EFE_productoras, value: 1}
      - effect: if
        when: {not_flag: EFE_sequia_pampa}
        then:
        - {effect: add_variable, var: EFE_brote, value: 1}
        - effect: if
          when: {flag: EFE_cosecha_doble}
          then:
          - {effect: add_variable, var: EFE_brote, value: 1}
    - effect: if
      when:
        not: {controls_state: [Tucumán]}
        not_flag: EFE_prod_4_perdida
        flag: EFE_prod_4_activa
      then:
      - {effect: flag, value: EFE_prod_4_perdida}
      - {effect: add_variable, var: EFE_biosteel, value: -3}
      - {effect: dynamic_modifier, id: EFE_cubas_quemadas, days: 180}
      - {effect: event, id: meganations_efe.504, days: 1}
    - effect: if
      when:
        controls_state: [Río Negro]
        not_flag: EFE_prod_5_perdida
      then:
      - {effect: flag, value: EFE_prod_5_activa}
      - {effect: add_variable, var: EFE_productoras, value: 1}
      - effect: if
        when: {not_flag: EFE_sequia_pampa}
        then:
        - {effect: add_variable, var: EFE_brote, value: 1}
        - effect: if
