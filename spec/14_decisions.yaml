  # 2026-10-17 (pedido del usuario): HSN, tomar un Nodo sin disparar. Elegí tu propia aventura
  # con 20 finales: 10% triunfo, 20% fracaso con premio, 50% nada (con sabor), 20% negativo.
  - id: HSN_toma_silenciosa_category
    country: HSN
    icon_prefer:
    - generic_naval
    - generic_political_actions
    name: {english: 'The Silent Takeover', spanish: 'La Toma Silenciosa'}
    desc:
      english: 'Take a node without a shot: Taiwan, Hong Kong, Okinawa or Kyushu, only while a government run by the AI or by warlords holds it. One attempt a year. Out of 20 possible endings, roughly: 1 in 10 is a triumph (the node changes hands), 2 in 10 fail with a consolation prize, 5 in 10 end in nothing at all, and 2 in 10 end badly (scandal, hangings, war). The bold choices raise both the triumphs and the disasters.'
      spanish: 'Tomar un nodo sin un tiro: Taiwán, Hong Kong, Okinawa o Kyushu, solo mientras lo tenga un gobierno manejado por la IA o por caudillos. Un intento por año. De 20 finales posibles, más o menos: 1 de cada 10 es un triunfo (el nodo cambia de manos), 2 de cada 10 fallan con un premio consuelo, 5 de cada 10 no terminan en nada, y 2 de cada 10 terminan mal (escándalo, ahorcados, guerra). Las elecciones audaces suben tanto los triunfos como los desastres.'
    src: user_request
    decisions:
    - id: HSN_toma_silenciosa_1
      name: {english: 'The Silent Takeover: Taiwan', spanish: 'La Toma Silenciosa: Taiwán'}
