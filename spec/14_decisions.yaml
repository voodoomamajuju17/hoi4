  # ---------------------------------------------------------------------------
  # La Carrera del Destino (2026-10-10, "pensá qué podrías agregar para hacerlo
  # más divertido" -> "hacé todas"). El marcador lo calcula cada mes
  # MEGANATIONS_carrera_pulso (tools/gen/emitters/carrera.py): cuántas regiones de
  # su forma final (controls_all de <TAG>_proclamar_la_forma_final) controla cada
  # potencia. Frenar: cuando un rival con el destino abierto está a dos regiones,
  # objetivos de guerra por las que ya tomó. Misiones con reloj: un año para
  # tomar 2 regiones clave más, tres años para proclamar la forma final.
  # ---------------------------------------------------------------------------
  - id: MEGANATIONS_carrera_category
    country: [EFE, FCU, ASC, HSN, NAS, SHD, APF, NRE]
    icon_prefer: [generic_formable_nations, generic_political_actions]
    name: {english: The Race for Destiny, spanish: La Carrera del Destino}
    desc:
      english: 'Key regions of its final form that each power controls (updated every month):\n[EFE.GetName]: [?global.MEGANATIONS_carrera_EFE|0] of 6\n[FCU.GetName]: [?global.MEGANATIONS_carrera_FCU|0] of 6\n[ASC.GetName]: [?global.MEGANATIONS_carrera_ASC|0] of 6\n[HSN.GetName]: [?global.MEGANATIONS_carrera_HSN|0] of 6\n[NAS.GetName]: [?global.MEGANATIONS_carrera_NAS|0] of 6\n[SHD.GetName]: [?global.MEGANATIONS_carrera_SHD|0] of 6\n[APF.GetName]: [?global.MEGANATIONS_carrera_APF|0] of 11\n[NRE.GetName]: [?global.MEGANATIONS_carrera_NRE|0] of 8\n\nWhen a power with its destiny open is two regions away, the others can stop it. When it is one away, everyone is warned.'
      spanish: 'Regiones clave de su forma final que controla cada potencia (se actualiza cada mes):\n[EFE.GetName]: [?global.MEGANATIONS_carrera_EFE|0] de 6\n[FCU.GetName]: [?global.MEGANATIONS_carrera_FCU|0] de 6\n[ASC.GetName]: [?global.MEGANATIONS_carrera_ASC|0] de 6\n[HSN.GetName]: [?global.MEGANATIONS_carrera_HSN|0] de 6\n[NAS.GetName]: [?global.MEGANATIONS_carrera_NAS|0] de 6\n[SHD.GetName]: [?global.MEGANATIONS_carrera_SHD|0] de 6\n[APF.GetName]: [?global.MEGANATIONS_carrera_APF|0] de 11\n[NRE.GetName]: [?global.MEGANATIONS_carrera_NRE|0] de 8\n\nCuando a una potencia con el destino abierto le faltan dos regiones, las demás pueden frenarla. Cuando le falta una, todos reciben el aviso.'
    src: user_request
    decisions:
    - id: MEGANATIONS_carrera_marcador
      name: {english: The Scoreboard, spanish: El Marcador}
      desc:
        english: 'Key regions controlled:\n[EFE.GetName]: [?global.MEGANATIONS_carrera_EFE|0] of 6\n[FCU.GetName]: [?global.MEGANATIONS_carrera_FCU|0] of 6\n[ASC.GetName]: [?global.MEGANATIONS_carrera_ASC|0] of 6\n[HSN.GetName]: [?global.MEGANATIONS_carrera_HSN|0] of 6\n[NAS.GetName]: [?global.MEGANATIONS_carrera_NAS|0] of 6\n[SHD.GetName]: [?global.MEGANATIONS_carrera_SHD|0] of 6\n[APF.GetName]: [?global.MEGANATIONS_carrera_APF|0] of 11\n[NRE.GetName]: [?global.MEGANATIONS_carrera_NRE|0] of 8'
        spanish: 'Regiones clave controladas:\n[EFE.GetName]: [?global.MEGANATIONS_carrera_EFE|0] de 6\n[FCU.GetName]: [?global.MEGANATIONS_carrera_FCU|0] de 6\n[ASC.GetName]: [?global.MEGANATIONS_carrera_ASC|0] de 6\n[HSN.GetName]: [?global.MEGANATIONS_carrera_HSN|0] de 6\n[NAS.GetName]: [?global.MEGANATIONS_carrera_NAS|0] de 6\n[SHD.GetName]: [?global.MEGANATIONS_carrera_SHD|0] de 6\n[APF.GetName]: [?global.MEGANATIONS_carrera_APF|0] de 11\n[NRE.GetName]: [?global.MEGANATIONS_carrera_NRE|0] de 8'
