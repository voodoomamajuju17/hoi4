  # 2026-10-17: la receta de diversión (NAS) — productoras, tres elecciones, gastos y eventos.
  - id: NAS_corona_del_sol_category
    country: NAS
    icon_prefer:
    - generic_political_actions
    - generic_research
    name: {english: 'The Crowns of the Sun', spanish: 'Las Coronas del Sol'}
    desc:
      english: 'Inti-Soma: [?NAS_inti]\nProducing temples: [?NAS_productoras_r] / 5\n\nInti-Soma is also the currency of the Sun: the temples pay for weapons, men, roads and wars. Two great ceremonies can be held only once in the life of the Kingdom: The Offensive of the Sun and The Defence of the Andes.\n\nPRODUCERS: the Temple of the Lake, the Temple of the Coast, the Temple of the Equator, the White Temple, the Temple of the Desert. Each one adds 1 Inti-Soma a month; losing one costs 15 and 180 days of trouble, and it produces again only when we retake and restore it.\nTHE THREE CHOICES: at 40, 65, 90 Inti-Soma you can spend them, once each, on a permanent choice between three paths.\nSPENDING: smaller amounts buy temporary bonuses.'
