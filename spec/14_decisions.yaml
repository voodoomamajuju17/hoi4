  - id: ASC_computo_category
    country: ASC
    icon_prefer:
    - generic_research
    - generic_industry
    name: {english: Compute Power, spanish: Poder de Cómputo}
    desc:
      english: 'WHAT IS IT FOR? Compute is a bonus you aim. Pick ONE priority and all the compute works there: the more compute, the bigger the
        bonus (see the spirit ''The Compute Grid'').\n\nCompute: [?ASC_computo]   Grid heat: [?ASC_calor] / 100\n\nWORKING RIGHT NOW:\nEconomy:
        factories +[?ASC_ef_fabricas_ver]%, construction +[?ASC_ef_construccion_ver]%\nResearch: +[?ASC_ef_investigacion_ver]%\nLogistics: organisation
        +[?ASC_ef_org_ver]%, infrastructure building +[?ASC_ef_infra_ver]%\nWar: attack +[?ASC_ef_ataque_ver]%, defence +[?ASC_ef_defensa_ver]%\nHeat:
        stability [?ASC_ef_calor_ver]%\n\nChanging the priority leaves the grid 30 days recalibrating (no bonus). Data centres add compute. More
        compute = more heat: +4 per month from 60 compute, +8 from 100; below 60 it cools 3. Heat 50: Thermal Rationing; 80: blackouts. Compute
        wears out: -1 per month. The grid holds up to 150 compute: whatever goes over is sold, about +2 political power per point.'
      spanish: '¿PARA QUÉ SIRVE? El cómputo es un bonus que vos dirigís. Elegís UNA prioridad y todo el cómputo rinde ahí: cuanto más cómputo, más
        grande el bonus (mirá el espíritu «La Red de Cómputo»).\n\nCómputo: [?ASC_computo]   Calor de la red: [?ASC_calor] / 100\n\nRINDE AHORA:\nEconomía:
        fábricas +[?ASC_ef_fabricas_ver]%, construcción +[?ASC_ef_construccion_ver]%\nInvestigación: +[?ASC_ef_investigacion_ver]%\nLogística: organización
        +[?ASC_ef_org_ver]%, construcción de infraestructura +[?ASC_ef_infra_ver]%\nGuerra: ataque +[?ASC_ef_ataque_ver]%, defensa +[?ASC_ef_defensa_ver]%\nCalor:
        estabilidad [?ASC_ef_calor_ver]%\n\nCambiar de prioridad deja la red 30 días recalibrando (sin bonus). Los datacenters suman cómputo. Más
        cómputo = más calor: +4 por mes desde 60 de cómputo, +8 desde 100; por debajo de 60 se enfría 3. Calor 50: Racionamiento Térmico; 80: apagones.
        El cómputo se gasta: -1 por mes. La red aguanta hasta 150 de cómputo: lo que sobra se vende, unos +2 de poder político por punto.'
    src: user_design
    after_effects:
    - {effect: run, value: ASC_recalcular_computo}
    decisions:
    - id: ASC_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      effects:
      - {effect: event, id: meganations_asc.29}
      ai: {factor: 0}
      src: user_decision
    - id: ASC_asignar_economia
      name: {english: Assign Compute to the Economy, spanish: Asignar Cómputo a la Economía}
      desc: {english: Production and construction first., spanish: Primero la producción y la construcción.}
      icon_prefer:
      - generic_research
      - generic_industry
      cost: 25
      available: {not_flag: ASC_reasignando}
      effects:
      - {effect: clear_flag, value: ASC_prioridad_guerra}
      - {effect: clear_flag, value: ASC_prioridad_investigacion}
      - {effect: clear_flag, value: ASC_prioridad_logistica}
      - {effect: flag, value: ASC_reasignando, days: 30}
      ai:
        factor: 1
        modifiers:
        - factor: 0
          when:
            not:
              any:
              - {flag: ASC_prioridad_guerra}
              - {flag: ASC_prioridad_investigacion}
              - {flag: ASC_prioridad_logistica}
        - factor: 0
          when: {at_war: true}
        - factor: 4
