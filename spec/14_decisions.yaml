  - id: NRE_mes_de_las_legiones
    effects:
    - effect: if
      when: {at_war: true}
      then:
      - {effect: add_variable, var: NRE_auctoritas, value: 3}
      - effect: random
        options:
        - weight: 40
          effects:
          - {effect: add_variable, var: NRE_prestigio_italica, value: 6}
        - weight: 30
          effects:
          - {effect: add_variable, var: NRE_prestigio_macedonica, value: 6}
        - weight: 30
          effects:
          - {effect: add_variable, var: NRE_prestigio_fulminata, value: 6}
      else:
      - {effect: add_variable, var: NRE_auctoritas, value: 1}
      - {effect: add_variable, var: NRE_prestigio_italica, value: -1}
      - {effect: add_variable, var: NRE_prestigio_macedonica, value: -1}
      - {effect: add_variable, var: NRE_prestigio_fulminata, value: -1}
