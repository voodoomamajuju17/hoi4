    - {effect: clamp, var: SHD_orden, min: 1, max: 100}
    - effect: math
      ops:
      - - set
        - SHD_suma
        - SHD_produccion
      - - add
        - SHD_suma
        - SHD_orden
      - - add
        - SHD_suma
        - SHD_pueblo
      - - set
        - SHD_factor
        - 150
      - - div
        - SHD_factor
        - SHD_suma
      - - mul
        - SHD_produccion
        - SHD_factor
      - - round
        - SHD_produccion
        - null
      - - mul
        - SHD_orden
        - SHD_factor
      - - round
        - SHD_orden
        - null
