  # ===========================================================================
  # HSN — La Cámara de Compensación, Puerto Libre o Peaje ("Las Ocho Potencias")
  # ===========================================================================
  - id: HSN_nodos_category
    country: HSN
    icon_prefer:
    - generic_naval
    - generic_political_actions
    name: {english: The Clearing House, spanish: La Cámara de Compensación}
    desc:
      english: 'THE NODE NETWORK - WHAT IS IT?\nThe High Seas Nation lives on the trade that passes through 8 points of the sea. Every one you control
        is a NODE (1 = yours, 0 = not yours):\nMalacca (Singapore): [?HSN_nodo_malaca]\nSunda (Java): [?HSN_nodo_sunda]\nKanto (Tokyo): [?HSN_nodo_kanto]\nManila:
        [?HSN_nodo_manila]\nTaiwan: [?HSN_nodo_taiwan]\nHong Kong: [?HSN_nodo_hong_kong]\nOkinawa: [?HSN_nodo_okinawa]\nKyushu: [?HSN_nodo_kyushu]\n\nNodes
        today: [?HSN_nodos] of 8  ->  trade +[?HSN_ef_nodos_ver]% (spirit ''The Node Network'').\nYou start with almost all of them. Hong Kong is
        held by the warlords: a focus claims it.\n\nWHAT THEY GIVE (spirits):\n2 nodes: Network I (+10% trade, +5% dockyards). 4: Network II (+15%
        trade, +10% dockyards, +5% factories). 6: Network III (+20% trade, +10% dockyards and factories, +5% research). All 8: World Clearing House
        (+30% trade, +15% dockyards, +10% factories, +5% research, +0.1 political power).\nLosing a node: ''A Node Lost'' for 180 days (-10% stability,
        -0.15 political power).\n\nTHE PRICE: pressure from the powers [?HSN_presion] / 100  ->  stability [?HSN_ef_presion_ver]%. It rises 3 per
        month with 4+ nodes and 6 with 6+; it falls 3 with fewer. 40: Under Watch. 70: the powers demand a strait. Port Diplomacy lowers it by 20.\n\nPLUNDER
        (only under Tavake): [?HSN_botin]. Letters of marque and war give it; spend it on repairs, resources, equipment and marines.'
      spanish: 'LA RED DE NODOS - ¿QUÉ ES?\nLa Nación de Alta Mar vive del comercio que pasa por 8 puntos del mar. Cada uno que controlás es un
        NODO (1 = tuyo, 0 = ajeno):\nMalaca (Singapur): [?HSN_nodo_malaca]\nSunda (Java): [?HSN_nodo_sunda]\nKanto (Tokio): [?HSN_nodo_kanto]\nManila:
        [?HSN_nodo_manila]\nTaiwán: [?HSN_nodo_taiwan]\nHong Kong: [?HSN_nodo_hong_kong]\nOkinawa: [?HSN_nodo_okinawa]\nKyushu: [?HSN_nodo_kyushu]\n\nNodos
        hoy: [?HSN_nodos] de 8  ->  comercio +[?HSN_ef_nodos_ver]% (espíritu «La Red de Nodos»).\nArrancás con casi todos. Hong Kong está en manos
        de los señores de la guerra: un foco lo reclama.\n\nQUÉ TE DAN (espíritus):\n2 nodos: Red I (+10% comercio, +5% astilleros). 4: Red II (+15%
        comercio, +10% astilleros, +5% fábricas). 6: Red III (+20% comercio, +10% astilleros y fábricas, +5% investigación). Los 8: Cámara Mundial
        de Compensación (+30% comercio, +15% astilleros, +10% fábricas, +5% investigación, +0,1 de poder político).\nPerder un nodo: «Un Nodo Perdido»
        por 180 días (-10% estabilidad, -0,15 de poder político).\n\nEL PRECIO: presión de las potencias [?HSN_presion] / 100  ->  estabilidad [?HSN_ef_presion_ver]%.
        Sube 3 por mes con 4 nodos o más y 6 con 6 o más; baja 3 con menos. 40: Bajo Vigilancia. 70: las potencias te exigen un estrecho. La Diplomacia
        de Puertos la baja 20.\n\nBOTÍN (solo con Tavake): [?HSN_botin]. Lo dan las patentes de corso y la guerra; se gasta en reparaciones, recursos,
        equipo y marines.'
    src: user_design
    decisions:
    - id: HSN_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      effects:
      - {effect: event, id: meganations_hsn.29}
      ai: {factor: 0}
      src: user_decision
    - id: HSN_diplomacia_de_puertos
      name: {english: Port Diplomacy, spanish: Diplomacia de Puertos}
      desc:
        english: 'Free berths and discounts for the great powers'' fleets: pressure -20.'
        spanish: 'Amarras gratis y descuentos para las flotas de las grandes potencias: presión -20.'
