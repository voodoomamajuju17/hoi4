    # 2026-09-30 (pedido del usuario): la unidad única del EFE
    # (20_unique_units.yaml). Temprano a propósito: con el Bioacero de
    # arranque y una ampliación de las cubas ya se puede, sin esperar años de
    # investigación del chasis pesado. Gastarlo retrasa los niveles de la Carrera.
    - id: EFE_despertar_al_gliptodonte
      name: {english: Wake the Glyptodon, spanish: Despertar al Gliptodonte}
      desc:
        english: 'The Gaia Laboratory asks for 4 BioSteel to grow the first hull of the Glyptodon: a modern tank with living armour that only the
          Empire can build, and on whose chassis it also mounts anti-air, tank destroyers and self-propelled guns. Unlocks it without researching
          the whole armour line, a ready design, the division "Glyptodons" already in the field and the first batch on the production lines. Needs
          6 BioSteel; spends 4 and raises vat saturation by 10.'
        spanish: 'El Laboratorio de Gaia pide 4 de Bioacero para cultivar el primer casco del Gliptodonte: un tanque moderno de blindaje vivo que
          solo el Imperio sabe construir, y sobre cuyo chasis también monta antiaéreos, cazacarros y artillería autopropulsada. Lo desbloquea sin
          investigar toda la línea blindada, con un diseño listo, la división «Gliptodontes» ya en el frente y la primera tanda en las líneas de producción.
          Pide 6 de Bioacero; gasta 4 y sube 10 la saturación de las cubas.'
      icon_prefer:
      - generic_army_support
      - generic_industry
      cost: 175
      fire_only_once: true
      available:
        variable_at_least: {var: EFE_biosteel, value: 6}
      effects:
      - {effect: add_variable, var: EFE_biosteel, value: -4}
      - {effect: add_variable, var: EFE_saturacion, value: 10}
      - {effect: run, value: EFE_gliptodonte_desbloqueo}
      ai_factor: 20
      src: user_request
