        variable_at_least: {var: EFE_biosteel, value: 16}
      then:
      - {effect: add_variable, var: EFE_biosteel, value: -1}
    - {effect: clamp, var: EFE_saturacion, min: 0, max: 100}
    - effect: idea_tiers
      tiers:
      - idea: EFE_fiebre_de_las_cubas
        when:
          variable_at_least: {var: EFE_saturacion, value: 70}
      - idea: EFE_cubas_forzadas
        when:
          variable_at_least: {var: EFE_saturacion, value: 40}
    - effect: if
      when:
        not_flag: EFE_plaga_reciente
        variable_at_least: {var: EFE_saturacion, value: 95}
      then:
      - {effect: flag, value: EFE_plaga_reciente, days: 120}
      - {effect: event, id: meganations_efe.22, days: 1}
      else:
      - effect: if
        when:
          not_flag: EFE_plaga_reciente
          variable_at_least: {var: EFE_saturacion, value: 70}
        then:
        - effect: random
          options:
          - weight: 75
            effects: []
          - weight: 25
            effects:
            - {effect: flag, value: EFE_plaga_reciente, days: 120}
            - {effect: event, id: meganations_efe.22, days: 1}
    - effect: if
      when:
        not_flag: EFE_conquista_hecha
        controls_state:
        - Rio de Janeiro
      then:
      - {effect: flag, value: EFE_conquista_hecha}
      - {effect: event, id: meganations_efe.30, days: 1}
    - effect: if
      when:
        variable_at_least: {var: EFE_biosteel, value: 15}
        not_flag: EFE_hito_hecho
      then:
      - {effect: flag, value: EFE_hito_hecho}
      - {effect: event, id: meganations_efe.31, days: 1}
    - {effect: run, value: EFE_espiritu_vivo}
    - {effect: run, value: EFE_pulso_satelites}
