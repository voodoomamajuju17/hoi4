    - id: NRE_forjar_los_onagros
      name: {english: Forge the Onagers, spanish: Forjar los Onagros}
      desc:
        english: 'Rocket batteries for the legions, the Storm of Mars: only Rome builds them. Unlocks rocket artillery without research, and the first
          legion with Onagers takes the field. Needs Auctoritas 35; spends 15.'
        spanish: 'Baterías de cohetes para las legiones, la Tormenta de Marte: solo Roma las construye. Desbloquea la artillería de cohetes sin investigar,
          y la primera legión con Onagros sale al campo. Pide Auctoritas 35; gasta 15.'
      icon_prefer:
      - generic_army_support
      - generic_industry
      cost: 125
      fire_only_once: true
      effects:
      - {effect: add_variable, var: NRE_auctoritas, value: -15}
      - {effect: run, value: NRE_onagro_desbloqueo}
      ai_factor: 20
      src: user_request
      available:
        variable_at_least: {var: NRE_auctoritas, value: 35}

  # Nuestros Satélites (2026-09-27): lealtad de cada satélite.
  - id: EFE_satelites_category
    country: EFE
    icon_prefer:
    - generic_political_actions
    - generic_formable_nations
    name: {english: Our Satellites, spanish: Nuestros Satélites}
    desc:
      english: 'LOYALTY OF YOUR SATELLITES (0-100)\nSouthern Patagonia: [?EFE_lealtad_pta]\nYvytu Ykua Guasu: [?EFE_lealtad_yyg]\n\nRight now: political
        power [?EFE_ef_sat_pp_ver] per day, stability [?EFE_ef_sat_estab_ver]% (spirit ''The Satellites'').\n\nEvery month loyalty falls 1 (2 if
        you are at war: they bleed too) and rises 1 if your stability is 60% or more.\n75 or more: loyal, it gives you political power (+0.10 per
        day each).\nBelow 25: restless, it costs political power and stability, and it may rise against you.\nAid raises loyalty and builds them
        a factory; tribute gives you political power and men, but lowers loyalty.'
      spanish: 'LEALTAD DE TUS SATÉLITES (0-100)\nPatagonia Austral: [?EFE_lealtad_pta]\nYvytu Ykua Guasu: [?EFE_lealtad_yyg]\n\nEfecto ahora: poder
        político [?EFE_ef_sat_pp_ver] por día, estabilidad [?EFE_ef_sat_estab_ver]% (espíritu «Los Satélites»).\n\nCada mes la lealtad baja 1 (2
        si estás en guerra: ellos también sangran) y sube 1 si tu estabilidad es 60% o más.\n75 o más: leal, te da poder político (+0,10 por día
        cada uno).\nMenos de 25: inquieto, te resta poder político y estabilidad, y puede rebelarse.\nLa Ayuda sube la lealtad y le construye una
        fábrica; el Tributo te da poder político y hombres, pero baja la lealtad.'
    src: user_design
    after_effects:
    - {effect: run, value: EFE_recalcular_satelites}
    decisions:
    - id: EFE_ayuda_pta
      name: {english: Aid to Southern Patagonia (Loyalty +15), spanish: Ayuda a Patagonia Austral (Lealtad +15)}
      desc:
        english: Money, engineers and a new factory for Southern Patagonia. Loyalty is bought, and it is not cheap.
        spanish: Plata, ingenieros y una fábrica nueva para Patagonia Austral. La lealtad se compra, y no es barata.
      icon_prefer:
      - generic_industry
      - generic_construction
      cost: 50
      cooldown_days: 91
      visible: {country_exists: PTA}
      effects:
      - {effect: add_variable, var: EFE_lealtad_pta, value: 15}
      - effect: scope
        target: PTA
        effects:
        - {effect: build, building: industrial_complex, level: 1}
      ai:
        factor: 3
        modifiers:
        - factor: 4
          when:
            variable_below: {var: EFE_lealtad_pta, value: 40}
        - factor: 0
          when:
            variable_at_least: {var: EFE_lealtad_pta, value: 70}
      src: user_design
    - id: EFE_tributo_pta
      name:
        english: Demand Tribute from Southern Patagonia (Loyalty -20)
        spanish: Exigir Tributo a Patagonia Austral (Lealtad -20)
      desc:
        english: 'Southern Patagonia pays for its protection: political power +60 and 15,000 men. They will remember it.'
        spanish: 'Patagonia Austral paga por su protección: poder político +60 y 15.000 hombres. Se lo van a acordar.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      cooldown_days: 119
      visible: {country_exists: PTA}
      available:
        variable_at_least: {var: EFE_lealtad_pta, value: 30}
      effects:
      - {effect: add_variable, var: EFE_lealtad_pta, value: -20}
      - {effect: add_political_power, value: 60}
      - {effect: add_manpower, value: 15000}
      - effect: scope
        target: PTA
        effects:
        - {effect: add_stability, value: -0.05}
      ai:
        factor: 2
        modifiers:
        - factor: 0
          when:
            variable_below: {var: EFE_lealtad_pta, value: 60}
        - factor: 3
