  # -------------------------------------------------------------------------
  # Los Hijos de Odín (2026-10-11): en la Comuna, el fascismo neopagano vuela
  # fábricas, datacenters y baterías. Cada mes la Furia sube 12 (18 con menos de
  # 50% de estabilidad); en 100 estalla la rebelión del Reino del Valhalla (con el
  # apoyo del EFE y de Roma), en 0 se terminan. Muy difícil de frenar.
  # -------------------------------------------------------------------------
  - id: MEGANATIONS_valhalla_pulso
    effects:
    - effect: if
      when: {tag: ASC, flag: ASC_valhalla_crisis, not_flag: ASC_valhalla_fin}
      then:
      - {effect: add_variable, var: ASC_valhalla, value: 12}
      - effect: if
        when: {stability_below: 0.5}
        then:
        - {effect: add_variable, var: ASC_valhalla, value: 6}
      - effect: if
        when:
          variable_at_least: {var: ASC_valhalla, value: 100}
        then:
        - {effect: flag, value: ASC_valhalla_fin}
        - {effect: event, id: meganations_lider.49, days: 1}
        else:
        - effect: if
          when:
            variable_below: {var: ASC_valhalla, value: 1}
          then:
          - {effect: flag, value: ASC_valhalla_fin}
          - {effect: event, id: meganations_lider.50, days: 1}
          else:
          - {effect: event, id: meganations_lider.48, days: 1}

