    name: {english: 'The Dividends of the Union', spanish: 'Los Dividendos de la Unión'}
    desc:
      english: 'Dividends: [?FCU_dividendos]\nCorporate headquarters: [?FCU_productoras_r] / 5\n\nDividends are what the Directorate pays itself. Five corporate headquarters produce them. Each corporation has its own action, paid in Dividends: it helps the Union and tips the balance of the Directorate. When the scandal is high or stability low, Detroit, Chicago or Los Angeles can burn.\n\nPRODUCERS: the Obsidian Tower, the Halvorsen-Ito Campus, the Castellane Waterworks, Fort Meridian, the Detroit Foundries. Each one adds 1 Dividends a month; losing one costs 10 and 180 days of trouble, and it produces again only when we retake and restore it.\nTHE THREE CHOICES: at 25, 50, 75 Dividends you can spend them, once each, on a permanent choice between three paths.\nSPENDING: smaller amounts buy temporary bonuses.'
      spanish: 'Dividendos: [?FCU_dividendos]\nSedes corporativas: [?FCU_productoras_r] / 5\n\nLos Dividendos son lo que el Directorio se paga a sí mismo. Cinco sedes corporativas los producen. Cada corporación tiene su propia acción, pagada en Dividendos: ayuda a la Unión y mueve el equilibrio del Directorio. Con el escándalo alto o la estabilidad baja, Detroit, Chicago o Los Ángeles pueden arder.\n\nPRODUCTORAS: la Torre Obsidian, el Campus Halvorsen-Ito, las Aguas de Castellane, el Fuerte Meridian, las Fundiciones de Detroit. Cada una suma 1 de Dividendos por mes; perder una cuesta 10 y 180 días de problemas, y vuelve a producir recién cuando la recuperamos y la restauramos.\nLAS TRES ELECCIONES: con 25, 50, 75 de Dividendos podés gastarlos, una vez cada una, en una elección permanente entre tres caminos.\nGASTAR: con menos se compran bonos temporales.'
