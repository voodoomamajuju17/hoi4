  # ===========================================================================
  # HSN — La Cámara de Compensación, Puerto Libre o Peaje ("Las Ocho Potencias")
  # ===========================================================================
  - id: HSN_nodos_category
    country: HSN
    icon_prefer:
    - generic_naval
    - generic_political_actions
    name: {english: The Clearing House, spanish: La Cámara de Compensación}
    desc:
      english: 'THE NODE NETWORK - WHAT IS IT?\nThe High Seas Nation lives on the trade that passes through 8 points of the sea. Every one you control
        is a NODE (1 = yours, 0 = not yours):\nMalacca (Singapore): [?HSN_nodo_malaca]\nSunda (Java): [?HSN_nodo_sunda]\nKanto (Tokyo): [?HSN_nodo_kanto]\nManila:
        [?HSN_nodo_manila]\nTaiwan: [?HSN_nodo_taiwan]\nHong Kong: [?HSN_nodo_hong_kong]\nOkinawa: [?HSN_nodo_okinawa]\nKyushu: [?HSN_nodo_kyushu]\n\nNodes
        today: [?HSN_nodos] of 8  ->  trade +[?HSN_ef_nodos_ver]%, dockyards +[?HSN_ef_astilleros_ver]%, factories +[?HSN_ef_fabricas_ver]%, political
        power +[?HSN_ef_pp_ver] per day, consumer goods [?HSN_ef_bienes_ver]% (spirit ''The Node Network''; every node counts).\nYou start with
        4: Malacca, Sunda, Kanto and Manila. Taiwan belongs to the Harmonious Directorate, Okinawa and Kyushu to Korea, and Hong Kong to the warlords
        (the decision ''Claim Hong Kong'' gives you the casus belli). The other four must be won: with focuses, events or war.\n\nWHAT THEY GIVE
        (spirits):\n2 nodes: Network I (+15% trade, +10% dockyards, +0.1 political power). 4: Network II (+20% trade, +15% dockyards, +10% factories,
        +0.15 political power). 6: Network III (+30% trade, +20% dockyards, +15% factories, +5% research, +0.2 political power). All 8: World Clearing
        House (+40% trade, +25% dockyards, +20% factories, +10% research, +0.3 political power).\nLosing a node: ''A Node Lost'' for 180 days (-10%
        stability, -0.15 political power).\n\nTHE PRICE: pressure from the powers [?HSN_presion] / 100  ->  stability [?HSN_ef_presion_ver]%. It
        rises 3 per month with 4+ nodes and 6 with 6+; it falls 3 with fewer. 40: Under Watch. 70: the powers demand a strait. Port Diplomacy lowers
        it by 20.\n\nPLUNDER (only under Tavake): [?HSN_botin]. Letters of marque and war give it; spend it on repairs, resources, equipment and
        marines.'
      spanish: 'LA RED DE NODOS - ¿QUÉ ES?\nLa Nación de Alta Mar vive del comercio que pasa por 8 puntos del mar. Cada uno que controlás es un
        NODO (1 = tuyo, 0 = ajeno):\nMalaca (Singapur): [?HSN_nodo_malaca]\nSunda (Java): [?HSN_nodo_sunda]\nKanto (Tokio): [?HSN_nodo_kanto]\nManila:
        [?HSN_nodo_manila]\nTaiwán: [?HSN_nodo_taiwan]\nHong Kong: [?HSN_nodo_hong_kong]\nOkinawa: [?HSN_nodo_okinawa]\nKyushu: [?HSN_nodo_kyushu]\n\nNodos
        hoy: [?HSN_nodos] de 8  ->  comercio +[?HSN_ef_nodos_ver]%, astilleros +[?HSN_ef_astilleros_ver]%, fábricas +[?HSN_ef_fabricas_ver]%, poder
        político +[?HSN_ef_pp_ver] por día, bienes de consumo [?HSN_ef_bienes_ver]% (espíritu «La Red de Nodos»; cada nodo suma).\nArrancás con
        4: Malaca, Sunda, Kanto y Manila. Taiwán es del Directorio Armónico, Okinawa y Kyushu de Corea, y Hong Kong de los señores de la guerra
        (la decisión «Reclamar Hong Kong» te da el casus belli). Los otros cuatro hay que ganarlos: con focos, eventos o guerra.\n\nQUÉ TE DAN (espíritus):\n2
        nodos: Red I (+15% comercio, +10% astilleros, +0,1 poder político). 4: Red II (+20% comercio, +15% astilleros, +10% fábricas, +0,15 poder
        político). 6: Red III (+30% comercio, +20% astilleros, +15% fábricas, +5% investigación, +0,2 poder político). Los 8: Cámara Mundial de
        Compensación (+40% comercio, +25% astilleros, +20% fábricas, +10% investigación, +0,3 poder político).\nPerder un nodo: «Un Nodo Perdido»
        por 180 días (-10% estabilidad, -0,15 de poder político).\n\nEL PRECIO: presión de las potencias [?HSN_presion] / 100  ->  estabilidad [?HSN_ef_presion_ver]%.
        Sube 3 por mes con 4 nodos o más y 6 con 6 o más; baja 3 con menos. 40: Bajo Vigilancia. 70: las potencias te exigen un estrecho. La Diplomacia
        de Puertos la baja 20.\n\nBOTÍN (solo con Tavake): [?HSN_botin]. Lo dan las patentes de corso y la guerra; se gasta en reparaciones, recursos,
        equipo y marines.'
    src: user_design
    decisions:
    - id: HSN_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      effects:
      - {effect: event, id: meganations_hsn.29}
      ai: {factor: 0}
      src: user_decision
    - id: HSN_reclamar_hong_kong
      name: {english: Claim Hong Kong, spanish: Reclamar Hong Kong}
      desc:
        english: The eighth node is in the hands of warlords. A casus belli for Hong Kong, whoever holds it now.
        spanish: El octavo nodo está en manos de señores de la guerra. Un casus belli por Hong Kong, lo tenga quien lo tenga.
      icon_prefer:
