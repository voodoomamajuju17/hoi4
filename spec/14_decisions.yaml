        - SHD_ef_orden
        - 50
      - - mul
        - SHD_ef_orden
        - 1
      - - div
        - SHD_ef_orden
        - 250
      - - set
        - SHD_ef_orden_ver
        - SHD_ef_orden
      - - mul
        - SHD_ef_orden_ver
        - 100
