      desc:
        english: 'Southern Patagonia pays for its protection: political power +60 and 15,000 men. They will remember it.'
        spanish: 'Patagonia Austral paga por su protección: poder político +60 y 15.000 hombres. Se lo van a acordar.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      cooldown_days: 119
      visible: {country_exists: PTA}
      available:
        variable_at_least: {var: EFE_lealtad_pta, value: 30}
      effects:
      - {effect: add_variable, var: EFE_lealtad_pta, value: -20}
      - {effect: add_political_power, value: 60}
      - {effect: add_manpower, value: 15000}
      - effect: scope
        target: PTA
        effects:
        - {effect: add_stability, value: -0.05}
      ai:
        factor: 2
        modifiers:
        - factor: 0
          when:
            variable_below: {var: EFE_lealtad_pta, value: 60}
        - factor: 3
          when:
