        spanish: 'Encomendarle una campaña a la Legio I Italica. En 180 días, en guerra: 36 divisiones y 15.000 armas de infantería en los depósitos. Cumplida: +20 de prestigio para la legión, +10 de Auctoritas, +60 de experiencia del ejército y «El Triunfo» por 120 días. Fallida: -15 de Auctoritas y -10 de prestigio para la legión. Cuesta 15 de Auctoritas.'
