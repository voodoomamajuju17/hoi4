# =============================================================================
# 14_decisions.yaml — Paneles de decisiones (minijuegos nacionales)
# =============================================================================
# El usuario eligió (2026-09-23) que BioSteel sea un contador con su propio
# panel de decisiones en vez de un recurso del mapa. Todo INVENTADO.
#
# El panel muestra el contador en su descripción ([?variable]). Las
# decisiones ganan o gastan BioSteel y tienen tiempo de espera: el juego está
# en elegir entre acumular (para los tiers de los focos, 5/10/15) o gastar ya.
#
# Íconos: se eligen entre los que usan las decisiones vanilla de tu juego
# (se prueba la lista `icon_prefer` en orden y si ninguno existe se usa el
# primero que haya). Nada se escribe de memoria.
#
# Condiciones soportadas: variable_at_least { var, value }, stability_at_least.
# Efectos: los mismos de focos/eventos + add_variable { var, value }.
# =============================================================================

categories:

  - id: EFE_biosteel_category
    country: EFE
    icon_prefer:
    - generic_industry
    - generic_production
    - generic_research
    name: {english: The BioSteel Race, spanish: La Carrera del Bioacero}
    desc:
      english: 'BioSteel in the vats: [?EFE_biosteel]  ->  armour +[?EFE_ef_blindaje_ver]%, defence +[?EFE_ef_defensa_ver]%\nVat saturation: [?EFE_saturacion] / 100  ->  stability [?EFE_ef_saturacion_ver]%\nProducing regions: [?EFE_productoras] / 5  (sprouts [?EFE_brote] / 6)\n\nTHE FIVE PRODUCERS: Gaia, the Plain of the Vats, Reforested Cuyo, the Yungas Forest and the Río Negro Frontier. Each one adds a sprout every month; every 6 sprouts become 1 BioSteel. Losing one costs 3 BioSteel and 180 days of burnt vats, and it does not produce again until we retake it and replant it.\nTHE THREE HARVESTS: at 10, 20 and 30 BioSteel you can spend them, once each, on a permanent choice between three paths. The Race tiers ask for 8, 16 and 24.\nSPENDING: 2 to 4 BioSteel buy 60 or 90 days of attack, defence, factories, construction, organisation or calm.\nTHE LIVING METAL EATS: every month saturation rises by a quarter of the stored BioSteel (now [?EFE_hambre_del_metal]) and drops by 4. 40+: Forced Vats. 70+: Vat Fever and a 25% monthly chance of the Mycelium Blight; 85+, 50%; 95, certain.\nFrom 25 BioSteel the metal rots: -1 per month (from 29, -2).'
      spanish: 'Bioacero en las cubas: [?EFE_biosteel]  ->  blindaje +[?EFE_ef_blindaje_ver]%, defensa +[?EFE_ef_defensa_ver]%\nSaturación de las cubas: [?EFE_saturacion] / 100  ->  estabilidad [?EFE_ef_saturacion_ver]%\nRegiones productoras: [?EFE_productoras] / 5  (brotes [?EFE_brote] / 6)\n\nLAS CINCO PRODUCTORAS: Gaia, la Llanura de las Cubas, el Cuyo Reforestado, la Selva de las Yungas y la Frontera del Río Negro. Cada una suma un brote por mes; cada 6 brotes son 1 de Bioacero. Perder una cuesta 3 de Bioacero y 180 días de cubas quemadas, y no vuelve a producir hasta que la recuperemos y la replantemos.\nLAS TRES COSECHAS: con 10, 20 y 30 de Bioacero podés gastarlos, una sola vez cada una, en una elección permanente entre tres caminos. Los niveles de la Carrera piden 8, 16 y 24.\nGASTAR: de 2 a 4 de Bioacero compran 60 o 90 días de ataque, defensa, fábricas, construcción, organización o calma.\nEL METAL VIVO COME: cada mes la saturación sube un cuarto del Bioacero guardado (ahora [?EFE_hambre_del_metal]) y baja sola 4. 40 o más: Cubas Forzadas. 70 o más: Fiebre de las Cubas y 25% por mes de Plaga del Micelio; 85 o más, 50%; 95, segura.\nDesde 25 de Bioacero el metal se pudre: -1 por mes (desde 29, -2).'
    src: invented
    decisions:
    - id: EFE_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      effects:
      - {effect: event, id: meganations_efe.29}
      ai: {factor: 0}
      src: user_decision
    - id: EFE_ampliar_las_cubas
      name: {english: Expand the Vats, spanish: Ampliar las Cubas}
      desc:
        english: Another hall of vats in the Plain of the Vats. Slow, expensive and safe. +2 BioSteel, saturation +8.
        spanish: Otra nave de cubas en la Llanura de las Cubas. Lento, caro y seguro. +2 de Bioacero, saturación +8.
      icon_prefer:
      - generic_industry
      - generic_construction
      cost: 50
      cooldown_days: 45
      effects:
      - {effect: add_variable, var: EFE_biosteel, value: 2}
      - {effect: add_variable, var: EFE_saturacion, value: 8}
      ai_factor: 10
      ai:
        factor: 10
        modifiers:
        - factor: 0
          when:
            variable_at_least: {var: EFE_saturacion, value: 75}
        - factor: 0.3
          when:
            variable_at_least: {var: EFE_saturacion, value: 55}
    - id: EFE_cultivo_intensivo
      name: {english: Intensive Cultivation, spanish: Cultivo Intensivo}
      desc:
        english: Double shifts in the vats and rationed water in the cities. The yield doubles; so do the complaints. +3 BioSteel, saturation +12.
        spanish: Doble turno en las cubas y agua racionada en las ciudades. El rendimiento se duplica; las quejas también. +3 de Bioacero, saturación +12.
      icon_prefer:
      - generic_industry
      - generic_production
      cost: 25
      cooldown_days: 60
      available: {stability_at_least: 0.4}
      effects:
      - {effect: add_variable, var: EFE_biosteel, value: 3}
      - {effect: add_stability, value: -0.05}
      - {effect: add_variable, var: EFE_saturacion, value: 12}
      ai_factor: 5
      ai:
        factor: 5
        modifiers:
        - factor: 0
          when:
            variable_at_least: {var: EFE_saturacion, value: 60}
        - factor: 0
          when: {stability_below: 0.4}
    - id: EFE_talar_el_bosque_viejo
      name: {english: Fell the Old Forest, spanish: Talar el Bosque Viejo}
      desc:
        english: The vats need biomass and the oldest forests have the most. The Custodian swore to protect them. The Emperor needs armour.
        spanish: Las cubas necesitan biomasa y los bosques más viejos son los que más tienen. El Custodio juró protegerlos. El Emperador necesita
          blindaje.
      icon_prefer:
      - generic_industry
      - generic_prepare_civil_war
      cost: 10
      cooldown_days: 180
      available: {stability_at_least: 0.5}
      effects:
      - {effect: add_variable, var: EFE_biosteel, value: 6}
      - {effect: add_stability, value: -0.15}
      - {effect: add_war_support, value: -0.05}
      - {effect: add_variable, var: EFE_saturacion, value: 16}
      ai_factor: 1
      ai:
        factor: 1
        modifiers:
        - factor: 0
          when: {stability_below: 0.5}
    - id: EFE_blindar_la_guardia
      name: {english: Armour the Green Guard, spanish: Blindar a la Guardia Verde}
      desc:
        english: 'Spend BioSteel now: living armour for the Guard''s veterans. The vats will have to start over.'
        spanish: 'Gastar Bioacero ahora: blindaje vivo para los veteranos de la Guardia. Las cubas van a tener que empezar de nuevo.'
