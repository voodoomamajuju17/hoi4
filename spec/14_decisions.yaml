          - - div
            - ASC_ef_org
            - 1000
          - - set
            - ASC_ef_infra
            - ASC_computo
          - - mul
            - ASC_ef_infra
            - 3
          - - div
            - ASC_ef_infra
            - 1000
      - effect: if
        when:
          not:
            any:
            - {flag: ASC_prioridad_guerra}
