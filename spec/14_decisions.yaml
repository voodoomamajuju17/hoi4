        not: {flag: APF_congo_rompio}
        any:
        - variable_at_least: {var: APF_integracion_zco, value: 40}
        - {date_after: 2103.6.1}
      then:
      - {effect: flag, value: APF_congo_rompio}
      - {effect: event, id: meganations_apf.421, days: 1}
    # El plazo: a mediados de 2104 se avisa; a mediados de 2105 los miembros que
    # todavía no se integraron se van, libres (sin justificación para nadie).
    - effect: if
      when: {date_after: 2104.6.1, not_flag: APF_plazo_aviso}
      then:
      - {effect: flag, value: APF_plazo_aviso}
      - {effect: event, id: meganations_apf.430, days: 1}
