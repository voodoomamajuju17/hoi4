  - id: NRE_recalcular_satelites
    effects:
    - effect: math
      ops:
      - - set
        - NRE_ef_sat_pp
        - 0
      - - set
        - NRE_ef_sat_estab
        - 0
    - {effect: clamp, var: NRE_lealtad_zhi, min: 0, max: 100}
    - effect: if
      when:
        country_exists: ZHI
        variable_at_least: {var: NRE_lealtad_zhi, value: 75}
      then:
      - effect: math
        ops:
        - - add
          - NRE_ef_sat_pp
          - 0.1
    - effect: if
      when:
        country_exists: ZHI
        variable_below: {var: NRE_lealtad_zhi, value: 25}
      then:
      - effect: math
        ops:
        - - sub
          - NRE_ef_sat_pp
          - 0.1
        - - sub
          - NRE_ef_sat_estab
          - 0.03
    - {effect: clamp, var: NRE_lealtad_zda, min: 0, max: 100}
    - effect: if
      when:
        country_exists: ZDA
        variable_at_least: {var: NRE_lealtad_zda, value: 75}
      then:
      - effect: math
        ops:
        - - add
          - NRE_ef_sat_pp
          - 0.1
    - effect: if
      when:
        country_exists: ZDA
        variable_below: {var: NRE_lealtad_zda, value: 25}
      then:
      - effect: math
        ops:
        - - sub
          - NRE_ef_sat_pp
          - 0.1
        - - sub
          - NRE_ef_sat_estab
          - 0.03
    - effect: math
      ops:
      - - set
        - NRE_ef_sat_pp_ver
        - NRE_ef_sat_pp
      - - mul
        - NRE_ef_sat_pp_ver
        - 100
      - - round
        - NRE_ef_sat_pp_ver
        - null
      - - div
        - NRE_ef_sat_pp_ver
        - 100
      - - set
        - NRE_ef_sat_estab_ver
        - NRE_ef_sat_estab
      - - mul
        - NRE_ef_sat_estab_ver
        - 100
      - - round
        - NRE_ef_sat_estab_ver
        - null
    - {effect: dynamic_modifier, id: NRE_mod_satelites}
