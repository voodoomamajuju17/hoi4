  # 2026-10-17: la receta de diversión (HSN) — productoras, tres elecciones, gastos y eventos.
  - id: HSN_peaje_category
    country: HSN
    icon_prefer:
    - generic_naval
    - generic_industry
    name: {english: 'The Toll of the Seas', spanish: 'El Peaje de los Mares'}
    desc:
      english: 'Toll: [?HSN_peaje]\nToll ports: [?HSN_productoras_r] / 5\n\nEvery ship that passes pays. Five great ports collect the Toll, and every node you hold adds one more each month. Under Tavake the ports do not ask: every Toll port also gives Plunder. Spend it, or save it for the three great charters of the Clearing House.\n\nPRODUCERS: the Port of Malacca, the Port of Sunda, the Port of Tokyo Bay, the Port of Manila, the Port of Osaka. Each one adds 1 Toll a month; losing one costs 10 and 180 days of trouble, and it produces again only when we retake and restore it.\nTHE THREE CHOICES: at 30, 55, 80 Toll you can spend them, once each, on a permanent choice between three paths.\nSPENDING: smaller amounts buy temporary bonuses.'
      spanish: 'Peaje: [?HSN_peaje]\nPuertos de peaje: [?HSN_productoras_r] / 5\n\nCada barco que pasa paga. Cinco grandes puertos cobran el Peaje, y cada nodo que tenés suma uno más por mes. Con Tavake los puertos no piden: cada puerto de peaje también da Botín. Gastalo, o guardalo para las tres grandes cartas de la Cámara de Compensación.\n\nPRODUCTORAS: el Puerto de Malaca, el Puerto de la Sonda, el Puerto de la Bahía de Tokio, el Puerto de Manila, el Puerto de Osaka. Cada una suma 1 de Peaje por mes; perder una cuesta 10 y 180 días de problemas, y vuelve a producir recién cuando la recuperamos y la restauramos.\nLAS TRES ELECCIONES: con 30, 55, 80 de Peaje podés gastarlos, una vez cada una, en una elección permanente entre tres caminos.\nGASTAR: con menos se compran bonos temporales.'
