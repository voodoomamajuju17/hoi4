  - id: APF_recalcular_satelites
    effects:
    - effect: math
      ops:
      - - set
        - APF_ef_sat_pp
        - 0
      - - set
        - APF_ef_sat_estab
        - 0
    - {effect: clamp, var: APF_lealtad_zet, min: 0, max: 100}
    - effect: if
      when:
        country_exists: ZET
        variable_at_least: {var: APF_lealtad_zet, value: 75}
      then:
      - effect: math
        ops:
        - - add
          - APF_ef_sat_pp
          - 0.1
    - effect: if
      when:
        country_exists: ZET
        variable_below: {var: APF_lealtad_zet, value: 25}
      then:
      - effect: math
        ops:
        - - sub
          - APF_ef_sat_pp
          - 0.1
        - - sub
          - APF_ef_sat_estab
