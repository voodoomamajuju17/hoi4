  # ===========================================================================
  # FCU — El Directorio de las Cuatro ("Las Ocho Potencias", 2026-09-23)
  # Cuatro influencias de 0 a 100 (06_mechanics.yaml -> four_corporations).
  # Cada contrato favorece a una o dos corporaciones y perjudica a las otras.
  # Después de cada contrato corre FCU_recalcular_directorio (abajo).
  # ===========================================================================
  - id: FCU_directorio_category
    country: FCU
    icon_prefer:
    - generic_industry
    - generic_production
    - generic_political_actions
    name: {english: The Board of Four, spanish: El Directorio de las Cuatro}
    desc:
      english: 'THE FOUR ALWAYS ADD UP TO 200: when one gains power, the others lose it.\n\nC · Castellane (water): [?FCU_castellane]  ->  stability
        [?FCU_ef_castellane_ver]%\nH · Halvorsen-Ito (food): [?FCU_halvorsen]  ->  consumer goods [?FCU_ef_halvorsen_ver]%\nM · Meridian (arms):
        [?FCU_meridian]  ->  military factory output [?FCU_ef_meridian_ver]%\nO · Obsidian (finance): [?FCU_obsidian]  ->  political power per day
        [?FCU_ef_obsidian_ver]\nScandal: [?FCU_escandalo] / 100\n\nA corporation above 50 gives its bonus; below 50 it subtracts it (see the spirit
        ''The Directorate'').\nBALANCE: all four between 40 and 60 -> Directorate Synergy (+10% factories, +5% research).\nSPECIALISE: a big bonus
        in one field, but the others fall; if one drops below 15 -> Corporate War.\nMeridian at 70+ with two rivals below 35 -> the Hostile Takeover
        opens.\nEvery month a random corporation lobbies (+4). Every contract adds 8 scandal (falls 2 per month): 50 -> Under Suspicion, 80 -> Crisis
        of Confidence.'
      spanish: 'LAS CUATRO SUMAN SIEMPRE 200: cuando una gana poder, las otras lo pierden.\n\nC · Castellane (agua): [?FCU_castellane]  ->  estabilidad
        [?FCU_ef_castellane_ver]%\nH · Halvorsen-Ito (comida): [?FCU_halvorsen]  ->  bienes de consumo [?FCU_ef_halvorsen_ver]%\nM · Meridian (armas):
        [?FCU_meridian]  ->  producción de fábricas militares [?FCU_ef_meridian_ver]%\nO · Obsidian (finanzas): [?FCU_obsidian]  ->  poder político
        por día [?FCU_ef_obsidian_ver]\nEscándalo: [?FCU_escandalo] / 100\n\nUna corporación por encima de 50 da su bonus; por debajo de 50 lo resta
        (mirá el espíritu «El Directorio»).\nEQUILIBRIO: las cuatro entre 40 y 60 -> Sinergia del Directorio (+10% fábricas, +5% investigación).\nESPECIALIZAR:
        un bonus grande en un área, pero las otras caen; si alguna baja de 15 -> Guerra Corporativa.\nMeridian en 70 o más con dos rivales por debajo
        de 35 -> se habilita la OPA Hostil.\nCada mes una corporación al azar hace lobby (+4). Cada contrato suma 8 de escándalo (baja 2 por mes):
        50 -> Bajo Sospecha, 80 -> Crisis de Confianza.'
    src: user_design
    after_effects:
    - {effect: run, value: FCU_recalcular_directorio}
    decisions:
    - id: FCU_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
      desc:
        english: 'Shows the welcome screen again: who you are and how this panel works. Free, as often as you like.'
        spanish: 'Vuelve a mostrar la pantalla de bienvenida: quién sos y cómo funciona este panel. Gratis, todas las veces que quieras.'
      icon_prefer:
