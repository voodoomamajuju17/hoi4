dynamic_modifiers:
  - id: FCU_mod_directorio
    country: FCU
    name: {english: The Directorate, spanish: El Directorio}
    desc:
      english: Each corporation above 50 pushes its field up; below 50, down. The numbers change every month.
      spanish: Cada corporación por encima de 50 empuja su área para arriba; por debajo de 50, para abajo. Los números cambian cada mes.
    modifiers:
      stability_factor: FCU_ef_castellane
      consumer_goods_factor: FCU_ef_halvorsen
      industrial_capacity_factory: FCU_ef_meridian
      political_power_gain: FCU_ef_obsidian
  - id: SHD_mod_caudales
    country: SHD
    name: {english: The Three Flows, spanish: Los Tres Caudales}
    desc:
      english: Production drives the factories, Order keeps the peace, the People fill the ranks. Above 50 each one helps; below 50 it hurts.
      spanish: La Producción mueve las fábricas, el Orden sostiene la calma, el Pueblo llena las filas. Arriba de 50 cada uno ayuda; abajo de 50
        resta.
    modifiers:
      industrial_capacity_factory: SHD_ef_produccion
      stability_factor: SHD_ef_orden
      recruitable_population_factor: SHD_ef_pueblo
  - id: ASC_mod_red_de_computo
    country: ASC
    name: {english: The Compute Grid, spanish: La Red de Cómputo}
    desc:
      english: All the Commune's compute, working on one priority. The more compute, the bigger the bonus; the hotter the grid, the angrier the
        people.
      spanish: Todo el cómputo de la Comuna trabajando en una sola prioridad. Cuanto más cómputo, más bonus; cuanto más caliente la red, más enojada
        la gente.
    modifiers:
      industrial_capacity_factory: ASC_ef_fabricas
      production_speed_buildings_factor: ASC_ef_construccion
      research_speed_factor: ASC_ef_investigacion
      army_org_factor: ASC_ef_org
      production_speed_infrastructure_factor: ASC_ef_infra
      army_attack_factor: ASC_ef_ataque
      army_defence_factor: ASC_ef_defensa
      stability_factor: ASC_ef_calor
  - id: NRE_mod_legiones
    country: NRE
    name: {english: The Legions of Rome, spanish: Las Legiones de Roma}
    desc:
      english: Famous legions fight harder; a respected emperor keeps them in order. Legions that grow too proud want their share.
      spanish: Las legiones famosas pelean mejor; un emperador respetado las mantiene en orden. Las que se agrandan demasiado quieren su parte.
    modifiers: {army_attack_factor: NRE_ef_ataque, army_org_factor: NRE_ef_org, political_power_gain: NRE_ef_pp}
  - id: APF_mod_federacion
    country: APF
    name: {english: The Federation in the Making, spanish: La Federación en Construcción}
    desc:
      english: Every factory built in a member helps the whole Federation; every quarrel between councils costs stability.
      spanish: Cada fábrica construida en un miembro ayuda a toda la Federación; cada pelea entre consejos cuesta estabilidad.
    modifiers: {stability_factor: APF_ef_tension, production_speed_buildings_factor: APF_ef_desarrollo}
  - id: EFE_mod_metal_vivo
    country: EFE
    name: {english: The Living Metal, spanish: El Metal Vivo}
    desc:
      english: BioSteel in the vats becomes armour for the Guard. Overworked vats make people sick.
      spanish: El Bioacero de las cubas se vuelve blindaje para la Guardia. Las cubas forzadas enferman a la gente.
    modifiers:
      army_armor_defence_factor: EFE_ef_blindaje
      army_defence_factor: EFE_ef_defensa
      stability_factor: EFE_ef_saturacion
  - id: NAS_mod_luz
    country: NAS
    name: {english: The Light of the Temples, spanish: La Luz de los Templos}
    desc:
      english: The priests of Inti study by the light they keep. Every ceremony spends it.
      spanish: Los sacerdotes de Inti estudian con la luz que guardan. Cada ceremonia la gasta.
    modifiers: {research_speed_factor: NAS_ef_luz}
  - id: HSN_mod_nodos
    country: HSN
    name: {english: The Node Network, spanish: La Red de Nodos}
    desc:
      english: Every strait is a toll and a friend. Every strait is also a target.
      spanish: Cada estrecho es un peaje y un amigo. Cada estrecho también es un blanco.
    modifiers: {trade_opinion_factor: HSN_ef_nodos, stability_factor: HSN_ef_presion}
  - id: EFE_mod_satelites
    country: EFE
    name: {english: The Satellites, spanish: Los Satélites}
    desc:
      english: Loyal satellites send men, money and votes; restless ones cost more than they give.
      spanish: Los satélites leales mandan hombres, plata y votos; los inquietos cuestan más de lo que dan.
    modifiers: {political_power_gain: EFE_ef_sat_pp, stability_factor: EFE_ef_sat_estab}
