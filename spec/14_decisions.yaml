    desc:
      english: 'Total compute: [?ASC_computo]\nLevels: below 40, 40 to 79, 80 or more.\n\nThe compute goes to ONE priority. Changing it leaves the
        system 30 days recalibrating. You can never maximise everything.'
      spanish: 'Cómputo total: [?ASC_computo]\nNiveles: menos de 40, de 40 a 79, 80 o más.\n\nEl cómputo va a UNA prioridad. Cambiarla deja al sistema
        30 días recalibrando. Nunca se puede maximizar todo.'
