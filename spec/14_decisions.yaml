      cooldown_days: 90
      effects:
      - effect: scope
        target: EFE
        effects:
        - {effect: add_variable, var: EFE_lealtad_pta, value: 8}
        - {effect: clamp, var: EFE_lealtad_pta, min: 0, max: 100}
        - {effect: run, value: EFE_recalcular_satelites}
      - {effect: add_stability, value: 0.02}
      ai:
        factor: 1
        modifiers:
        - factor: 0
          when:
            country:
              tag: EFE
              when:
                variable_below: {var: EFE_lealtad_pta, value: 40}
      src: user_request
    - id: PTA_agitar_la_independencia
      name: {english: Agitate for Independence (Loyalty -10), spanish: Agitar por la Independencia (Lealtad -10)}
