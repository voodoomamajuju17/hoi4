  # -------------------------------------------------------------------------
  # La Coalición de Ginebra y el precio de la forma final (2026-10-10). FROM es
  # la potencia que proclamó su forma final (los .231) o la Hegemonía (mundo.50).
  # -------------------------------------------------------------------------
  - id: MEGANATIONS_coalicion_unirse
    effects:
    - {effect: flag, value: MEGANATIONS_en_coalicion}
    - {effect: dynamic_modifier, id: MEGANATIONS_coalicion_ginebra, days: 1825}
    - {effect: run, value: MEGANATIONS_frenar_FROM}
    - effect: every_country
      when:
        flag: MEGANATIONS_en_coalicion
        not: {tag: ROOT}
      effects:
      - {effect: guarantee, value: ROOT}
      - effect: scope
        target: ROOT
        effects:
        - {effect: guarantee, value: PREV}
    - effect: scope
      target: FROM
      effects:
      - {effect: opinion, target: ROOT, modifier: meganations_afrenta}
  - id: MEGANATIONS_coalicion_tributo
    effects:
    - {effect: add_political_power, value: -50}
    - {effect: dynamic_modifier, id: MEGANATIONS_tributo, days: 730}
    - {effect: relation, type: non_aggression_pact, value: FROM}
    - effect: scope
      target: FROM
      effects:
      - {effect: add_political_power, value: 50}
      - {effect: opinion, target: ROOT, modifier: meganations_concesion}
  - id: MEGANATIONS_forma_final_precio
    effects:
    - {effect: dynamic_modifier, id: MEGANATIONS_provincias_nuevas, days: 730}
    - {effect: event, id: meganations_mundo.95, days: 120}
    - {effect: event, id: meganations_mundo.95, days: 300}
    - {effect: event, id: meganations_mundo.95, days: 480}

  # -------------------------------------------------------------------------
  # Las decisiones del líder (2026-10-11). Stats de 0 a 10 (arrancan en 5):
  # Carisma -> estabilidad, Astucia -> poder político, Prestigio -> apoyo a la
  # guerra (cada punto sobre o bajo 5: 2%, 0,1 PP/día, 3%; ajuste del usuario
  # 2026-10-11), Salud en 0 -> el líder se desploma (meganations_lider.22).
  # -------------------------------------------------------------------------
  - id: MEGANATIONS_lider_recalcular
    effects:
    - {effect: clamp, var: MEGANATIONS_lider_carisma, min: 0, max: 10}
    - {effect: clamp, var: MEGANATIONS_lider_astucia, min: 0, max: 10}
    - {effect: clamp, var: MEGANATIONS_lider_salud, min: 0, max: 10}
    - {effect: clamp, var: MEGANATIONS_lider_prestigio, min: 0, max: 10}
    - effect: math
      ops:
      - [set, MEGANATIONS_lider_ef_carisma, MEGANATIONS_lider_carisma]
      - [sub, MEGANATIONS_lider_ef_carisma, 5]
      # 2026-10-13 ("más recompensas y castigos"): 3% / 0,15 PP / 4% por punto
      - [mul, MEGANATIONS_lider_ef_carisma, 0.03]
      - [set, MEGANATIONS_lider_ef_astucia, MEGANATIONS_lider_astucia]
      - [sub, MEGANATIONS_lider_ef_astucia, 5]
      - [mul, MEGANATIONS_lider_ef_astucia, 0.15]
      - [set, MEGANATIONS_lider_ef_prestigio, MEGANATIONS_lider_prestigio]
      - [sub, MEGANATIONS_lider_ef_prestigio, 5]
      - [mul, MEGANATIONS_lider_ef_prestigio, 0.04]
    - {effect: dynamic_modifier, id: MEGANATIONS_el_lider}
    - effect: if
      when:
        variable_below: {var: MEGANATIONS_lider_salud, value: 1}
      then:
      - {effect: event, id: meganations_lider.22, days: 1}
  - id: MEGANATIONS_lider_reiniciar
    effects:
    - {effect: set_variable, var: MEGANATIONS_lider_carisma, value: 5}
    - {effect: set_variable, var: MEGANATIONS_lider_astucia, value: 5}
    - {effect: set_variable, var: MEGANATIONS_lider_salud, value: 5}
    - {effect: set_variable, var: MEGANATIONS_lider_prestigio, value: 5}
    - {effect: run, value: MEGANATIONS_lider_recalcular}
  - id: MEGANATIONS_lider_derrocado
    effects:
    - {effect: retire_leader}
    - {effect: run, value: MEGANATIONS_lider_reiniciar}
  # 2026-10-11 (rehecho): cada potencia se parte a su manera (meganations_lider.40-47)
