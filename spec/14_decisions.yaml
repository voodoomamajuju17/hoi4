dynamic_modifiers:
  # 2026-10-11 (pedido del usuario: más combate aéreo y ases para el NAS)
  - id: NAS_escuela_de_ases
    country: NAS
    name: {english: The Condor's School of Aces, spanish: La Escuela de Ases del Cóndor}
    desc: {english: 'The best pilots of every squadron teach at the school of Cusco between missions.', spanish: 'Los mejores pilotos de cada escuadrilla enseñan en la escuela del Cusco entre misión y misión.'}
    modifiers:
      '?air_ace_generation_chance_factor': 0.5
      '?air_attack_factor': 0.05
      '?air_defence_factor': 0.05
      '?air_ace_bonuses_factor': 0.25
      '?experience_gain_air': 0.15
  - id: NAS_el_cielo_cerrado
    country: NAS
    name: {english: The Closed Sky, spanish: El Cielo Cerrado}
    desc: {english: 'Radars on every peak, fighters on every plateau: the Sun sees everything that flies.', spanish: 'Radares en cada cumbre, cazas en cada meseta: el Sol ve todo lo que vuela.'}
    modifiers:
      '?air_defence_factor': 0.1
      '?air_agility_factor': 0.05
      '?air_superiority_efficiency': 0.1
      '?air_interception_detect_factor': 0.15
  - id: MEGANATIONS_mandato_compartido
    country: null
    name: {english: 'The Shared Mandate', spanish: 'El Mandato Compartido'}
    desc: {english: 'Sun and Harmony share archives and patents.', spanish: 'El Sol y la Armonía comparten archivos y patentes.'}
    modifiers: {research_speed_factor: 0.05, political_power_gain: 0.05, stability_factor: 0.03}
  # Segunda etapa (análisis 2026-10-01, prioridad 12): crisis del siglo, la Gran Obra y la Hegemonía
  - id: MEGANATIONS_sequia
    country: null
    name: {english: The Great Drought, spanish: La Gran Sequía}
    desc: {english: 'Rivers low, harvests lost. It passes in 6 months.', spanish: 'Ríos bajos, cosechas perdidas. Se va en 6 meses.'}
    modifiers: {stability_factor: -0.05, monthly_population: -0.2}
  - id: MEGANATIONS_pandemia
    country: null
    name: {english: The Mycelium Pandemic, spanish: La Pandemia del Micelio}
    desc: {english: Field hospitals in every city. It passes in 6 months., spanish: Hospitales de campaña en cada ciudad. Se va en 6 meses.}
    modifiers: {recruitable_population_factor: -0.1, stability_factor: -0.03}
  - id: MEGANATIONS_tormenta_solar
    country: null
    name: {english: Solar Storm Blackout, spanish: Apagón de la Tormenta Solar}
    desc: {english: Satellites and grids are down. It passes in 4 months., spanish: Satélites y redes caídos. Se va en 4 meses.}
    modifiers: {research_speed_factor: -0.1, production_speed_buildings_factor: -0.1}
  - id: MEGANATIONS_exodo
    country: null
    name: {english: Climate Exodus, spanish: Éxodo Climático}
    desc: {english: Millions on the roads. It passes in 6 months., spanish: Millones en los caminos. Se va en 6 meses.}
    modifiers: {stability_factor: -0.05, weekly_manpower: 500}
  - id: MEGANATIONS_marea_negra
    country: null
    name: {english: The Black Tide, spanish: La Marea Negra}
    desc: {english: 'Dead seas, closed ports. It passes in 6 months.', spanish: 'Mares muertos, puertos cerrados. Se va en 6 meses.'}
    modifiers: {industrial_capacity_dockyard: -0.15, consumer_goods_factor: 0.03}
  - id: MEGANATIONS_crac
    country: null
    name: {english: The Great Crash, spanish: El Gran Crac}
    desc: {english: Markets in free fall. It passes in 6 months., spanish: Mercados en caída libre. Se va en 6 meses.}
    modifiers: {consumer_goods_factor: 0.05, political_power_gain: -0.1}
  - id: MEGANATIONS_acuerdo_cumbre
    country: null
    name: {english: The Summit Accord, spanish: El Acuerdo de la Cumbre}
    desc: {english: 'We signed in Geneva: a year of promised peace. It wears off in a year.', spanish: 'Firmamos en Ginebra: un año de paz prometida.
        Se va en un año.'}
    modifiers: {stability_factor: 0.05, political_power_gain: 0.15, war_support_factor: -0.05}
  - id: MEGANATIONS_carrera_orbital
    country: null
    name: {english: The Orbital Race, spanish: La Carrera Orbital}
    desc: {english: Every lab works for the launch. It lasts a year., spanish: Cada laboratorio trabaja para el lanzamiento. Dura un año.}
    modifiers: {research_speed_factor: 0.07, consumer_goods_factor: 0.03}
  - id: MEGANATIONS_gran_obra
    country: null
    name: {english: The Great Work, spanish: La Gran Obra}
    desc: {english: The megastate builds what no one else can., spanish: La meganación construye lo que nadie más puede.}
    modifiers: {industrial_capacity_factory: 0.1, production_speed_buildings_factor: 0.15}
  - id: MEGANATIONS_hegemonia
    country: null
    name: {english: World Hegemony, spanish: Hegemonía Mundial}
    desc: {english: The first power of the world of 2100., spanish: La primera potencia del mundo de 2100.}
    modifiers: {political_power_gain: 0.25, stability_factor: 0.1, war_support_factor: 0.1}
  # 2026-10-01 ("las emergencias ponelas como dijiste"): el castigo de las
