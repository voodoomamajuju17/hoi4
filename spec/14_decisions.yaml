      industrial_capacity_factory: FCU_ef_meridian
      political_power_gain: FCU_ef_obsidian
  - id: SHD_mod_caudales
    country: SHD
    name: {english: The Three Flows, spanish: Los Tres Caudales}
    desc:
      english: Production drives the factories, Order keeps the peace, the People fill the ranks. Above 50 each one helps; below 50 it hurts.
      spanish: La Producción mueve las fábricas, el Orden sostiene la calma, el Pueblo llena las filas. Arriba de 50 cada uno ayuda; abajo de 50
        resta.
    modifiers:
      industrial_capacity_factory: SHD_ef_produccion
      stability_factor: SHD_ef_orden
      recruitable_population_factor: SHD_ef_pueblo
  - id: ASC_mod_red_de_computo
    country: ASC
    name: {english: The Compute Grid, spanish: La Red de Cómputo}
    desc:
      english: All the Commune's compute, working on one priority. The more compute, the bigger the bonus; the hotter the grid, the angrier the
        people.
      spanish: Todo el cómputo de la Comuna trabajando en una sola prioridad. Cuanto más cómputo, más bonus; cuanto más caliente la red, más enojada
        la gente.
    modifiers:
      industrial_capacity_factory: ASC_ef_fabricas
