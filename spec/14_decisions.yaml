  - id: NRE_legiones_category
    country: NRE
    icon_prefer:
    - generic_political_actions
    name: {english: The Legions, spanish: Las Legiones}
    desc:
      english: 'AUCTORITAS MILITARIS: [?NRE_auctoritas] / 100\nThe army''s respect for the emperor, and Rome''s currency for military decisions
        (promotions, new legions, campaign plans). It gives organisation: +[?NRE_ef_org_ver]%.\nIt rises at war (+3 per month); in peace it falls
        (-1 per month).\n\nTHE LEGIONS (prestige 0-100):\nLegio I Italica: [?NRE_prestigio_italica]\nLegio V Macedonica: [?NRE_prestigio_macedonica]\nLegio
        XII Fulminata: [?NRE_prestigio_fulminata]\nTheir combined prestige gives attack: +[?NRE_ef_ataque_ver]%. Every legion at 80+ demands privileges:
        [?NRE_ef_pp_ver] political power per day.\nAt war a random legion gains +6 each month; in peace all lose 1. Triumphs raise them by hand.\n60:
        Veteran Legions. 100: the legion threatens the Senate. Low Auctoritas (below 15) with a famous legion can end in mutiny.\nIn the Year of
        the Four Imperatores, a rival legion at 85 can hail its own emperor.'
      spanish: 'AUCTORITAS MILITARIS: [?NRE_auctoritas] / 100\nEs el respeto del ejército por el emperador, y la moneda de Roma para las decisiones
        militares (ascensos, legiones nuevas, planes de campaña). Da organización: +[?NRE_ef_org_ver]%.\nSube en guerra (+3 por mes); en paz baja
        (-1 por mes).\n\nLAS LEGIONES (prestigio 0-100):\nLegio I Italica: [?NRE_prestigio_italica]\nLegio V Macedonica: [?NRE_prestigio_macedonica]\nLegio
        XII Fulminata: [?NRE_prestigio_fulminata]\nEl prestigio de las tres da ataque: +[?NRE_ef_ataque_ver]%. Cada legión en 80 o más exige privilegios:
        [?NRE_ef_pp_ver] de poder político por día.\nEn guerra, cada mes una legión al azar gana +6; en paz todas pierden 1. Los Triunfos las suben
        a mano.\n60: Legiones Veteranas. 100: la legión amenaza al Senado. Con poca Auctoritas (menos de 15) y una legión famosa, puede haber motín.\nEn
        el Año de los Cuatro Imperatores, una legión rival en 85 puede aclamar a su propio emperador.'
    src: user_design
    after_effects:
    - {effect: run, value: NRE_recalcular_legiones}
    decisions:
    - id: NRE_como_se_juega
      name: {english: How to Play (welcome), spanish: Cómo se Juega (bienvenida)}
