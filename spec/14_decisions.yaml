scripted_effects:

  # Después de cada contrato o foco que mueve una corporación.
  - id: FCU_recalcular_directorio
    effects:
      - { effect: clamp, var: FCU_castellane, min: 0, max: 100 }
      - { effect: clamp, var: FCU_halvorsen, min: 0, max: 100 }
      - { effect: clamp, var: FCU_meridian, min: 0, max: 100 }
      - { effect: clamp, var: FCU_obsidian, min: 0, max: 100 }
      - effect: if
        when: { not_flag: FCU_opa_consumada, all_between: { vars: [FCU_castellane, FCU_halvorsen, FCU_meridian, FCU_obsidian], min: 40, max: 60 } }
        then:
          - { effect: if, when: { not_idea: FCU_sinergia_del_directorio }, then: [ { effect: add_ideas, value: FCU_sinergia_del_directorio } ] }
        else:
          - { effect: if, when: { idea: FCU_sinergia_del_directorio }, then: [ { effect: remove_idea, value: FCU_sinergia_del_directorio } ] }
      - effect: if
        when:
          not_flag: FCU_opa_consumada
          any:
            - { variable_below: { var: FCU_castellane, value: 15 } }
            - { variable_below: { var: FCU_halvorsen, value: 15 } }
            - { variable_below: { var: FCU_meridian, value: 15 } }
            - { variable_below: { var: FCU_obsidian, value: 15 } }
        then:
          - { effect: if, when: { not_idea: FCU_guerra_corporativa }, then: [ { effect: add_ideas, value: FCU_guerra_corporativa } ] }
        else:
          - { effect: if, when: { idea: FCU_guerra_corporativa }, then: [ { effect: remove_idea, value: FCU_guerra_corporativa } ] }
      - effect: if
        when:
          not_flag: FCU_opa_habilitada
          variable_at_least: { var: FCU_meridian, value: 70 }
          any:
            - { variables_below: [ { var: FCU_castellane, value: 25 }, { var: FCU_halvorsen, value: 25 } ] }
            - { variables_below: [ { var: FCU_castellane, value: 25 }, { var: FCU_obsidian, value: 25 } ] }
            - { variables_below: [ { var: FCU_halvorsen, value: 25 }, { var: FCU_obsidian, value: 25 } ] }
        then:
          - { effect: flag, value: FCU_opa_habilitada }
          - { effect: event, id: meganations_fcu.2 }

  - id: FCU_auditar_castellane
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_castellane, value: 56 } }, then: [ { effect: add_variable, var: FCU_castellane, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_castellane, value: 45 } }, then: [ { effect: add_variable, var: FCU_castellane, value: 10 } ] }

  - id: FCU_auditar_halvorsen
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_halvorsen, value: 56 } }, then: [ { effect: add_variable, var: FCU_halvorsen, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_halvorsen, value: 45 } }, then: [ { effect: add_variable, var: FCU_halvorsen, value: 10 } ] }

  - id: FCU_auditar_meridian
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_meridian, value: 56 } }, then: [ { effect: add_variable, var: FCU_meridian, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_meridian, value: 45 } }, then: [ { effect: add_variable, var: FCU_meridian, value: 10 } ] }

  - id: FCU_auditar_obsidian
    effects:
      - { effect: if, when: { variable_at_least: { var: FCU_obsidian, value: 56 } }, then: [ { effect: add_variable, var: FCU_obsidian, value: -10 } ] }
      - { effect: if, when: { variable_below: { var: FCU_obsidian, value: 45 } }, then: [ { effect: add_variable, var: FCU_obsidian, value: 10 } ] }

  # El Monte (EFE): pasado cierto umbral, el golpe queda al alcance de un foco.
  - id: EFE_recalcular_monte
    effects:
      - { effect: clamp, var: EFE_control_del_monte, min: 0, max: 100 }
      - effect: if
        when: { variable_at_least: { var: EFE_control_del_monte, value: 60 }, not_flag: EFE_monte_listo }
        then:
          - { effect: flag, value: EFE_monte_listo }
          - { effect: event, id: meganations_efe.12 }

  # ASC: saca las 12 ideas de cómputo y pone la que corresponde a la prioridad y al nivel.
  - id: ASC_recalcular_computo
    effects:
    - {effect: clamp, var: ASC_computo, min: 0, max: 150}
    - effect: if
      when: {idea: ASC_computo_economia_1}
      then:
      - {effect: remove_idea, value: ASC_computo_economia_1}
    - effect: if
      when: {idea: ASC_computo_economia_2}
      then:
      - {effect: remove_idea, value: ASC_computo_economia_2}
    - effect: if
      when: {idea: ASC_computo_economia_3}
      then:
      - {effect: remove_idea, value: ASC_computo_economia_3}
    - effect: if
      when: {idea: ASC_computo_investigacion_1}
      then:
      - {effect: remove_idea, value: ASC_computo_investigacion_1}
    - effect: if
      when: {idea: ASC_computo_investigacion_2}
      then:
      - {effect: remove_idea, value: ASC_computo_investigacion_2}
    - effect: if
      when: {idea: ASC_computo_investigacion_3}
      then:
      - {effect: remove_idea, value: ASC_computo_investigacion_3}
    - effect: if
      when: {idea: ASC_computo_logistica_1}
      then:
      - {effect: remove_idea, value: ASC_computo_logistica_1}
    - effect: if
      when: {idea: ASC_computo_logistica_2}
      then:
      - {effect: remove_idea, value: ASC_computo_logistica_2}
    - effect: if
      when: {idea: ASC_computo_logistica_3}
      then:
      - {effect: remove_idea, value: ASC_computo_logistica_3}
    - effect: if
      when: {idea: ASC_computo_guerra_1}
      then:
      - {effect: remove_idea, value: ASC_computo_guerra_1}
    - effect: if
      when: {idea: ASC_computo_guerra_2}
      then:
      - {effect: remove_idea, value: ASC_computo_guerra_2}
    - effect: if
      when: {idea: ASC_computo_guerra_3}
      then:
      - {effect: remove_idea, value: ASC_computo_guerra_3}
    - effect: if
      when: {flag: ASC_prioridad_guerra}
      then:
      - effect: if
        when:
          variable_at_least: {var: ASC_computo, value: 80}
        then:
        - {effect: add_ideas, value: ASC_computo_guerra_3}
        else:
        - effect: if
          when:
            variable_at_least: {var: ASC_computo, value: 40}
          then:
          - {effect: add_ideas, value: ASC_computo_guerra_2}
          else:
          - {effect: add_ideas, value: ASC_computo_guerra_1}
      else:
      - effect: if
        when: {flag: ASC_prioridad_investigacion}
        then:
        - effect: if
          when:
            variable_at_least: {var: ASC_computo, value: 80}
          then:
          - {effect: add_ideas, value: ASC_computo_investigacion_3}
          else:
          - effect: if
            when:
              variable_at_least: {var: ASC_computo, value: 40}
            then:
            - {effect: add_ideas, value: ASC_computo_investigacion_2}
            else:
            - {effect: add_ideas, value: ASC_computo_investigacion_1}
        else:
        - effect: if
          when: {flag: ASC_prioridad_logistica}
          then:
          - effect: if
            when:
              variable_at_least: {var: ASC_computo, value: 80}
            then:
            - {effect: add_ideas, value: ASC_computo_logistica_3}
            else:
            - effect: if
              when:
                variable_at_least: {var: ASC_computo, value: 40}
              then:
              - {effect: add_ideas, value: ASC_computo_logistica_2}
              else:
              - {effect: add_ideas, value: ASC_computo_logistica_1}
          else:
          - effect: if
            when:
              variable_at_least: {var: ASC_computo, value: 80}
            then:
            - {effect: add_ideas, value: ASC_computo_economia_3}
            else:
            - effect: if
              when:
                variable_at_least: {var: ASC_computo, value: 40}
              then:
              - {effect: add_ideas, value: ASC_computo_economia_2}
              else:
              - {effect: add_ideas, value: ASC_computo_economia_1}

  # HSN: cuenta los nodos controlados, pone la idea del nivel, castiga perder uno y suma botín.
  - id: HSN_recalcular_nodos
    effects:
    - {effect: set_variable, var: HSN_nodos_prev, value: HSN_nodos}
    - {effect: set_variable, var: HSN_nodos, value: 0}
    - effect: if
      when:
        controls_state:
        - Singapore
        - Straits Settlements
        - Malaya
        - Kuala Lumpur
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - West Java
        - Banten
        - Batavia
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Kanto
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Manila
        - Luzon
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Taiwan
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Hong Kong
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Okinawa
        - Ryukyu
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when:
        controls_state:
        - Kitakyūshū
        - Kitakyushu
        - Kyushu
        - Fukuoka
      then:
      - {effect: add_variable, var: HSN_nodos, value: 1}
    - effect: if
      when: {idea: HSN_red_nodos_1}
      then:
      - {effect: remove_idea, value: HSN_red_nodos_1}
    - effect: if
      when: {idea: HSN_red_nodos_2}
      then:
      - {effect: remove_idea, value: HSN_red_nodos_2}
    - effect: if
      when: {idea: HSN_red_nodos_3}
      then:
      - {effect: remove_idea, value: HSN_red_nodos_3}
    - effect: if
      when: {idea: HSN_camara_mundial}
      then:
      - {effect: remove_idea, value: HSN_camara_mundial}
    - effect: if
      when: {not_flag: HSN_tavake}
      then:
      - effect: if
        when:
          variable_at_least: {var: HSN_nodos, value: 8}
        then:
        - {effect: add_ideas, value: HSN_camara_mundial}
        else:
        - effect: if
          when:
            variable_at_least: {var: HSN_nodos, value: 6}
          then:
          - {effect: add_ideas, value: HSN_red_nodos_3}
          else:
          - effect: if
            when:
              variable_at_least: {var: HSN_nodos, value: 4}
            then:
            - {effect: add_ideas, value: HSN_red_nodos_2}
            else:
            - effect: if
              when:
                variable_at_least: {var: HSN_nodos, value: 2}
              then:
              - {effect: add_ideas, value: HSN_red_nodos_1}
    - effect: if
      when:
        variable_below: {var: HSN_nodos, value: HSN_nodos_prev}
      then:
      - {effect: timed_idea, idea: HSN_nodo_perdido, days: 180}
    - effect: if
      when: {flag: HSN_tavake, at_war: true}
      then:
      - {effect: add_variable, var: HSN_botin, value: 2}
      - {effect: add_variable, var: HSN_botin, value: HSN_nodos}

  # NAS: el Inti-Soma de cada mes (granjas, máximo, riesgo de sobrecarga).
  - id: NAS_mes_del_sol
    effects:
    - {effect: add_variable, var: NAS_inti, value: NAS_granjas}
    - effect: if
      when:
        not_flag: NAS_sobrecarga
        variable_at_least: {var: NAS_inti, value: NAS_inti_max}
      then:
      - {effect: set_variable, var: NAS_inti, value: NAS_inti_max}
    - effect: if
      when:
        flag: NAS_sobrecarga
        variable_at_least: {var: NAS_inti, value: NAS_inti_max}
      then:
      - effect: random
        options:
        - weight: 80
          effects: []
        - weight: 20
          effects:
          - {effect: set_variable, var: NAS_inti, value: 0}
          - {effect: clear_flag, value: NAS_sobrecarga}
          - {effect: timed_idea, idea: NAS_noche_del_sol, days: 90}
          - {effect: event, id: meganations_nas.2}
