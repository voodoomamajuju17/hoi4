          - variable_at_least: {var: NRE_prestigio_italica, value: 60}
          - variable_at_least: {var: NRE_prestigio_macedonica, value: 60}
          - variable_at_least: {var: NRE_prestigio_fulminata, value: 60}
    - effect: math
      ops:
