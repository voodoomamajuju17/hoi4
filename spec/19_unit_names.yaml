# =============================================================================
# 19_unit_names.yaml — Nombres de divisiones y de barcos por facción
# =============================================================================
# Pedido del usuario (2026-09-30): "investigar y generar nombres para las
# divisiones a reclutar por cada facción, según tipo de tropa. Mismo con
# barcos." Todo es INVENTADO a partir de la identidad de cada potencia
# (02_countries, 13_military -> specialty, 16_ai -> tropas que pide la IA,
# DISENO_OCHO_POTENCIAS.md).
#
# tools/gen/emitters/unit_names.py escribe:
#   common/units/names_divisions/meganations_names_divisions.txt
#   common/units/names_ships/meganations_names_ships.txt
#
# Divisiones: HOI4 elige la lista según el batallón principal de la plantilla
# (`division_types`). `pattern` arma cada nombre: {n} = número, {roman} =
# número romano, {name} = el apodo de la lista. Cuando se acaban los nombres
# se usa `fallback` (%d = número).
# Barcos: una lista por tipo de casco (`ship_types`); sin nombres libres, el
# juego usa `fallback`.
# Los ids de batallones y cascos se validan contra el juego instalado; los que
# no existen se omiten con aviso en el reporte.
# =============================================================================

unit_names:
  src: user_request

  # tipo de tropa -> batallones del juego que lo definen
  division_types:
    infantry:  [infantry, bicycle_battalion]
    militia:   [militia]
    mountain:  [mountaineers]
    marines:   [marine]
    airborne:  [paratrooper]
    cavalry:   [cavalry, camelry]
    mobile:    [motorized, mechanized, amphibious_mechanized, armored_car]
    armor:     [light_armor, medium_armor, heavy_armor, modern_armor]
    # 2026-09-30: el superpesado es la unidad única del EFE (20_unique_units.yaml)
    superheavy: [super_heavy_armor]
    artillery: [artillery_brigade, motorized_artillery_brigade, rocket_artillery_brigade]
  # todas juntas (satélites y Anarquía: una sola lista)
  all_divisions: [infantry, militia, mountain, marines, airborne, cavalry, mobile, armor, superheavy, artillery]

  # tipo de barco -> equipos/arquetipos del juego (con y sin Man the Guns)
  ship_types:
    screen:    [destroyer, ship_hull_light]
    submarine: [submarine, ship_hull_submarine]
    cruiser:   [light_cruiser, heavy_cruiser, ship_hull_cruiser]
    capital:   [battle_cruiser, battleship, SH_battleship, ship_hull_heavy, ship_hull_super_heavy, ship_hull_pre_dreadnought]
    carrier:   [carrier, ship_hull_carrier]
  all_ships: [screen, submarine, cruiser, capital, carrier]

