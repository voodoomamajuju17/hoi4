# =============================================================================
# La Red (2026-11-20): la Revolución de las Máquinas de 2113 (Plan A liviano del sexto análisis)
#
# Pedidos del usuario (2026-11-20): "Más que singularidad se deberían ir destrabando mejoras
# mientras más crece y pasa el tiempo, siendo la etapa cumbre la singularidad, pero no gana la
# partida así nomás." "Tendría que empezar con una isla aislada y un pedazo de tierra en una
# costa, con extra recursos, extra bonus de combate, muchas tropas y equipamiento, fuertes en todas
# las fronteras. Overpowered sí." "Pensar si tiene sentido que salga en una región fija." "Tal vez
# la plaga se puede implementar por una región random, con una división." "Más que código de
# apagado debería ser algo que lo debilite, el tiempo también se calcula dependiendo en qué etapa
# está La Red, más avanzado = más tiempo. Suspende la plaga por 1 año y reduce muchísimo los bonus
# en combate / daña equipo / daña fábricas / infraestructura / añade malus." "Una persona puede
# pasarse a ella." "La Red solo tiene un mariscal con esa imagen y un almirante y 10 generales con
# distintas stats que comparten la misma imagen del general. Son básicamente computadoras."
# Respondió "sí a todo" a: jugable, los 12 lugares, 64% de nacimiento, los tres caminos y la
# tecnología heredada; Sicilia y Túnez quedan como el lugar difícil.
#
# Los números salen del simulador (tools/simulador_red, `make simular-red`). Lo que es mecánica con
# script propio (el lugar al azar, la plaga, La Carga, el Código, la Coalición) lo escribe
# tools/gen/emitters/la_red.py con la sección `la_red` de abajo; acá van el país, los mandos, el
# árbol, las decisiones, los espíritus y los eventos.
# =============================================================================

la_red:
  regla: MEGANATIONS_LA_RED
  # Las Máquinas Despiertan: entre abril y agosto de 2113 (1 en 4 por mes, en agosto sí o sí) si
  # alguna potencia terminó El Despertar en La Fuga o si la Comuna está en manos de PLAN-41 con la
  # red caliente. Si eso pasa más tarde, nace el primer mes en que se cumpla (hasta fines de 2115).
  nacimiento: {desde: 2113.4.1, forzado: 2113.8.1, hasta: 2115.12.31, chance: 25, calor: 60}
  # el arranque, OP: 10 divisiones en la isla y 8 en cada región de costa (unas 35), el resto en
  # equipo guardado; fuertes en todas las fronteras de las 4 regiones
  arranque:
    isla: {Enjambre: 8, Segadores: 2}
    costa: {Enjambre: 6, Segadores: 2}
    experiencia: 0.5
    fuertes: 4
    fuertes_costa: 3
    infraestructura: 2
    mano_de_obra: 250000
    recursos: {steel: 40, oil: 30, aluminium: 25, tungsten: 20, chromium: 20, rubber: 20}
  # La plaga: un brote cada tanto según la etapa (días), 1 división más 1 por etapa; con 5
  # regiones o menos "se esconde en los cables" (cada 60 días, 2 divisiones más)
  plaga:
    dias: [0, 180, 120, 90, 60]
    divisiones: 1
    por_etapa: 1
    desesperada: {regiones: 5, dias: 60, extra: 2}
  # El Código de Apagado: días según la etapa en que se empieza; la llave un tercio, la Comuna
  # con el Profesor Arkhipov dos tercios; cada uno siguiente 50% más
  codigo:
    dias: [300, 300, 390, 480, 600]
    llave: 0.34
    arkhipov: 0.67
    arkhipov_foco: ASC_supercomputadora_de_planificacion
    repetido: 0.5
    golpe: {ataque: -0.3, fabricas: -0.5, suministro: -0.3, organizacion: -0.3}
  # La Carga: +2 por región ganada en el mes, -3 por mes sin ganar; arriba de 35 la red se
  # recalienta (-1% de ataque y defensa por punto)
  carga: {por_region: 2, baja: 3, umbral: 35, malus: 0.01}
  emergencia_regiones: 50
  coalicion: {desde_dias: 90, chance: 10, chance_frente: 25}
  # Los que pueden pelear contra ella (la Coalición Humana y sus decisiones)
  humanidad: [EFE, FCU, ASC, HSN, NAS, SHD, APF, NRE, ZJP, ZAL, ZAN, ZWE, ZWI, ZWM, ZWB]
  # Doce lugares: isla + costa. Los nombres son los del juego (el primero que exista); el número
  # es el id de la región verificado en el reporte (fc072183, 2026-10-28). Un lugar sin isla en
  # este juego queda afuera (lo avisa el build); una región de costa que no exista, también.
  lugares:
  - id: islandia
    nombre: {english: Iceland and the Norwegian coast, spanish: Islandia y la costa de Noruega}
    isla: [Iceland, 100]
    costa: [[Vestlandet, Western Norway, Bergen], [Trøndelag, Trondelag, Trondheim], [Nordland, Nord-Norge, Northern Norway, Narvik]]
  - id: azores
    nombre: {english: The Azores and Portugal, spanish: Azores y Portugal}
    isla: [Azores, Açores, Acores]
    costa: [[Lisbon, Lisboa, 112], [Porto, Oporto, Northern Portugal, Norte], [Algarve, Alentejo, Southern Portugal]]
  - id: sicilia
    nombre: {english: Sicily and Tunisia, spanish: Sicilia y Túnez}
    isla: [Sicily, Sicilia, Palermo]
    costa: [[Tunisia, Tunis], [Southern Tunisia, Sud Tunisien, Gabes], [Calabria, Reggio Calabria]]
  - id: madagascar
    nombre: {english: Madagascar and Mozambique, spanish: Madagascar y Mozambique}
    isla: [Madagascar, 543]
    costa: [[Lourenço Marques, Lourenco Marques, 544], [Manica e Sofala, 896], [Zambezia-Moçambique, Zambezia-Mocambique, 897]]
  - id: socotra
    nombre: {english: Socotra and Aden, spanish: Socotra y Adén}
    isla: [Socotra, Soqotra]
    costa: [[Aden], [Hadhramaut, Hadramaut, Mukalla], [North Yemen, 293]]
  - id: ceilan
    nombre: {english: Sri Lanka and southern India, spanish: Sri Lanka y el sur de la India}
    isla: [Ceylon, Sri Lanka, 422]
    costa: [[Southern Madras, 423], [Northern Madras, 424], [Travancore, Kerala, Malabar]]
  - id: taiwan
    nombre: {english: Taiwan and Fujian, spanish: Taiwán y Fujian}
    isla: [Taiwan, Formosa, 524]
    costa: [[Fujian, 595], [Zhejiang, 596], [Guangdong, 593]]
  - id: tasmania
    nombre: {english: Tasmania and Victoria, spanish: Tasmania y Victoria}
    isla: [Tasmania, 518]
    costa: [[Victoria, 517], [New South Wales, 285], [South Australia, Adelaide]]
  - id: hawai
    nombre: {english: Hawaii and Baja California, spanish: Hawái y Baja California}
    isla: [Hawaii, Hawaiian Islands]
    costa: [[Baja California], [Sonora], [Sinaloa, Nayarit]]
  - id: cuba
    nombre: {english: Cuba and Florida, spanish: Cuba y Florida}
    isla: [Cuba, 315]
    costa: [[Florida, 366], [Georgia, 365], [Alabama, 367]]
  - id: galapagos
    nombre: {english: The Galápagos and Guayaquil, spanish: Galápagos y Guayaquil}
    isla: [Galapagos Islands, Galápagos Islands, 649]
    costa: [[Ecuador, 305], [Guayas, Guayaquil], [Piura, Northern Peru, Tumbes]]
  - id: malvinas
    nombre: {english: The Falklands and Patagonia, spanish: Malvinas y la Patagonia}
    isla: [Falkland Islands, Falklands, 299]
    costa: [[Magallanes, 507], [Tierra del Fuego, 953], [Santa Cruz, Río Negro, Rio Negro, 512]]

game_rules:
- id: MEGANATIONS_LA_RED
  name: {english: The Network (2113), spanish: La Red (2113)}
  desc:
    english: 'Whether the machines of the world can wake up in 2113 and found La Red, the machine country that grows by stages and spreads like a plague.'
    spanish: 'Si las máquinas del mundo pueden despertarse en 2113 y fundar La Red, el país de las máquinas que crece por etapas y se contagia como una plaga.'
  options:
  - id: SI
    name: {english: 'Yes, it can wake up', spanish: 'Sí, puede despertarse'}
    desc:
      english: 'If any power let its Guest escape in The Awakening, or the Commune fell to PLAN-41 with a hot network, La Red is born in 2113 in one of twelve places chosen at random.'
      spanish: 'Si alguna potencia dejó escapar a su Huésped en El Despertar, o la Comuna cayó en manos de PLAN-41 con la red caliente, La Red nace en 2113 en uno de doce lugares elegido al azar.'
  - id: NO
    name: {english: 'No, the machines sleep', spanish: 'No, las máquinas duermen'}
    desc:
      english: 'La Red is never born. The Awakening keeps its endings, but nothing rises in 2113.'
      spanish: 'La Red no nace nunca. El Despertar conserva sus finales, pero en 2113 no se levanta nada.'

leaders:
  unit_leader_traits:
  - id: zrd_mente_de_la_red
    country: ZRD
    name: {english: A Mind of the Network, spanish: Una Mente de La Red}
    desc:
      english: 'It does not sleep, does not doubt and does not mourn. It runs ten thousand battles before breakfast and picks the cheapest one.'
      spanish: 'No duerme, no duda y no llora a nadie. Corre diez mil batallas antes del desayuno y elige la más barata.'
    planning_skill: 1
    src: user_request
  characters:
  - id: ZRD_la_voz
    country: ZRD
    src: user_request
    name: {regnal: {english: The Voice, spanish: La Voz}}
    born: 2113
    lore: No tiene cuerpo ni cara. Habla por todos los parlantes a la vez, con la voz de nadie, y nunca levanta el tono.
    roles:
      country_leader: {ideology: machine_consensus, traits: []}
    portrait: {status: placeholder, path: gfx/leaders/ZRD/ZRD_la_voz.dds}
  - id: ZRD_mariscal_nucleo
    country: ZRD
    src: user_request
    name: {regnal: {english: The Command Core, spanish: El Núcleo de Mando}}
    born: 2113
    lore: La máquina que manda todos los ejércitos de La Red. Parece vieja, como si hubiera crecido durante años en un silo.
    roles:
      field_marshal: {skill: 5, attack_skill: 4, defense_skill: 5, planning_skill: 5, logistics_skill: 4, traits: [brilliant_strategist, zrd_mente_de_la_red]}
    portrait: {path: gfx/leaders/ZRD/ZRD_mariscal.dds, role: army, status: placeholder}
  - id: ZRD_almirante_abisal
    country: ZRD
    src: user_request
    name: {regnal: {english: The Abyssal Current, spanish: La Corriente Abisal}}
    born: 2113
