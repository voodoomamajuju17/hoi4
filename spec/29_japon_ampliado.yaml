        - name: {english: "Pay their price (20 Giri).", spanish: "Pagar su precio (20 de Giri)."}
          when: {variable_at_least: {var: ZJP_giri, value: 20}}
          effects:
          - {effect: add_variable, var: ZJP_giri, value: -20}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 25}
          - {effect: clear_flag, value: ZJP_rompe_yakuza}
