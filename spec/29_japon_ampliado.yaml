        - name: {english: "Let them go.", spanish: "Que se vayan."}
          effects:
          - {effect: dynamic_modifier, id: ZJP_capital_en_fuga, days: 365}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 20}
          - {effect: clear_flag, value: ZJP_rompe_zaibatsu}
          ai_chance: 25
        - name: {english: "Seize their factories.", spanish: "Quedarse con sus fábricas."}
          effects:
          - {effect: add_political_power, value: 100}
          - {effect: add_stability, value: -0.08}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 20}
          - {effect: clear_flag, value: ZJP_rompe_zaibatsu}
