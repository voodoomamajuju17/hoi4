# =============================================================================
# 29_japon_ampliado.yaml — El Shogunato de los Astilleros, segunda parte (2026-11-01)
# =============================================================================
# Pedido del usuario: "Crear contenido para Japón y GB hasta que sean, al menos,
# 65% del promedio de una meganación. No tocar focos. [...] Crear ministros,
# generales. En el caso de Japón, los generales y mariscales tienen sus propias
# lealtades, así que rinden mejor cuando gobierna su 'mafia'."
#
# Las Tres Casas (las "mafias"): los Zaibatsu, la Yakuza y SRS, más los leales a
# la Shōgun Kaede Mori. Gobierna la Casa de la ruta elegida en el árbol
# (ZJP_zai_1 / ZJP_yak_1 / ZJP_srs_1); antes de elegir, arbitra la Shōgun.
#   ZJP_gobierna: 0 la Shōgun, 1 Zaibatsu, 2 Yakuza, 3 SRS.
# Cada general y mariscal lleva el rasgo de su Casa (zjp_casa_*). Cuando su Casa
# gobierna recibe "Su Casa Gobierna" (+1 en las cuatro habilidades); los de las
# otras dos Casas, "Su Casa no Gobierna" (-1 ataque, -1 planificación). Los
# leales a la Shōgun rinden mejor mientras ella arbitra y quedan neutros después.
# Un Juramento de Sangre (25 de Giri) pasa a los generales de una Casa relegada
# al servicio de la Shōgun: dejan de rendir menos.
# Favor de cada Casa (0-100, arranca en 50): con una Casa en el poder, la que
# gobierna gana 1 por mes y las otras dos pierden 1. En 15 o menos, la Casa rompe
# el pacto (evento). Todas en 70 o más: Las Tres Casas en Paz. Alguna en 20 o
# menos: Las Casas Afilan los Cuchillos.
# Eventos sueltos: ZJP_eventos_pulso tira uno por vez (después de cada uno, 60
# días de espera), cada uno una sola vez y solo si se cumple su condición.
# Ministros de una Casa: solo se nombran si gobierna su Casa o la Shōgun.
# =============================================================================

extend_scripted_effects:
  ZJP_pulso:
  - {effect: run, value: ZJP_casas_pulso}
  - {effect: run, value: ZJP_eventos_pulso}

decisions:
  variable_names:
    ZJP_gobierna: {english: Ruling House, spanish: Casa que Gobierna}
    ZJP_favor_zaibatsu: {english: Favour of the Zaibatsu, spanish: Favor de los Zaibatsu}
    ZJP_favor_yakuza: {english: Favour of the Yakuza, spanish: Favor de la Yakuza}
    ZJP_favor_srs: {english: Favour of SRS, spanish: Favor de SRS}

  scripted_effects:
  # ---------------------------------------------------------------------------
  # Las Tres Casas: quién gobierna, el favor, las lealtades de los generales
  # ---------------------------------------------------------------------------
  - id: ZJP_casas_pulso
    effects:
    - effect: if
      when: {not_flag: ZJP_casas_listas}
      then:
      - {effect: flag, value: ZJP_casas_listas}
      - {effect: set_variable, var: ZJP_favor_zaibatsu, value: 50}
      - {effect: set_variable, var: ZJP_favor_yakuza, value: 50}
      - {effect: set_variable, var: ZJP_favor_srs, value: 50}
      - {effect: set_variable, var: ZJP_gobierna, value: 0}
      - {effect: event, id: meganations_japon.40, days: 3}
    - effect: if
      when: {focus: ZJP_zai_1}
      then:
      - {effect: set_variable, var: ZJP_gobierna, value: 1}
    - effect: if
      when: {focus: ZJP_yak_1}
      then:
      - {effect: set_variable, var: ZJP_gobierna, value: 2}
    - effect: if
      when: {focus: ZJP_srs_1}
      then:
      - {effect: set_variable, var: ZJP_gobierna, value: 3}
    # el favor: la Casa que gobierna sube, las otras bajan
    - effect: if
      when: {variable_is: {var: ZJP_gobierna, value: 1}}
      then:
      - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 1}
      - {effect: add_variable, var: ZJP_favor_yakuza, value: -1}
      - {effect: add_variable, var: ZJP_favor_srs, value: -1}
    - effect: if
      when: {variable_is: {var: ZJP_gobierna, value: 2}}
      then:
      - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -1}
      - {effect: add_variable, var: ZJP_favor_yakuza, value: 1}
      - {effect: add_variable, var: ZJP_favor_srs, value: -1}
    - effect: if
      when: {variable_is: {var: ZJP_gobierna, value: 3}}
      then:
      - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -1}
      - {effect: add_variable, var: ZJP_favor_yakuza, value: -1}
      - {effect: add_variable, var: ZJP_favor_srs, value: 1}
    - {effect: clamp, var: ZJP_favor_zaibatsu, min: 0, max: 100}
    - {effect: clamp, var: ZJP_favor_yakuza, min: 0, max: 100}
    - {effect: clamp, var: ZJP_favor_srs, min: 0, max: 100}
    # las lealtades de los generales: solo cuando cambia quién gobierna
    - effect: if
      when: {all: [{variable_is: {var: ZJP_gobierna, value: 0}}, {not_flag: ZJP_lealtad_0}]}
      then:
      - {effect: flag, value: ZJP_lealtad_0}
      - {effect: run, value: ZJP_lealtades}
    - effect: if
      when: {all: [{variable_is: {var: ZJP_gobierna, value: 1}}, {not_flag: ZJP_lealtad_1}]}
      then:
      - {effect: clear_flag, value: ZJP_lealtad_0}
      - {effect: flag, value: ZJP_lealtad_1}
      - {effect: run, value: ZJP_lealtades}
      - {effect: event, id: meganations_japon.60, days: 2}
    - effect: if
      when: {all: [{variable_is: {var: ZJP_gobierna, value: 2}}, {not_flag: ZJP_lealtad_2}]}
      then:
      - {effect: clear_flag, value: ZJP_lealtad_0}
      - {effect: flag, value: ZJP_lealtad_2}
      - {effect: run, value: ZJP_lealtades}
      - {effect: event, id: meganations_japon.61, days: 2}
    - effect: if
      when: {all: [{variable_is: {var: ZJP_gobierna, value: 3}}, {not_flag: ZJP_lealtad_3}]}
      then:
      - {effect: clear_flag, value: ZJP_lealtad_0}
      - {effect: flag, value: ZJP_lealtad_3}
      - {effect: run, value: ZJP_lealtades}
      - {effect: event, id: meganations_japon.62, days: 2}
    # espíritus del Consejo
    - effect: if
      when:
        all:
        - {variable_at_least: {var: ZJP_favor_zaibatsu, value: 70}}
        - {variable_at_least: {var: ZJP_favor_yakuza, value: 70}}
        - {variable_at_least: {var: ZJP_favor_srs, value: 70}}
      then:
      - {effect: dynamic_modifier, id: ZJP_casas_en_paz}
      - effect: if
        when: {not_flag: ZJP_paz_vista}
        then:
        - {effect: flag, value: ZJP_paz_vista}
        - {effect: event, id: meganations_japon.64, days: 2}
      else:
      - {effect: remove_dynamic_modifier, id: ZJP_casas_en_paz}
    - effect: if
      when:
        any:
        - {variable_below: {var: ZJP_favor_zaibatsu, value: 21}}
        - {variable_below: {var: ZJP_favor_yakuza, value: 21}}
        - {variable_below: {var: ZJP_favor_srs, value: 21}}
      then:
      - {effect: dynamic_modifier, id: ZJP_cuchillos}
      else:
      - {effect: remove_dynamic_modifier, id: ZJP_cuchillos}
    # una Casa con el favor por el piso rompe el pacto (una vez cada una)
    - effect: if
      when: {all: [{variable_below: {var: ZJP_favor_zaibatsu, value: 16}}, {not_flag: ZJP_rompe_zaibatsu}]}
      then:
      - {effect: flag, value: ZJP_rompe_zaibatsu}
      - {effect: event, id: meganations_japon.53, days: 3}
    - effect: if
      when: {all: [{variable_below: {var: ZJP_favor_yakuza, value: 16}}, {not_flag: ZJP_rompe_yakuza}]}
      then:
      - {effect: flag, value: ZJP_rompe_yakuza}
      - {effect: event, id: meganations_japon.54, days: 3}
    - effect: if
      when: {all: [{variable_below: {var: ZJP_favor_srs, value: 16}}, {not_flag: ZJP_rompe_srs}]}
      then:
      - {effect: flag, value: ZJP_rompe_srs}
      - {effect: event, id: meganations_japon.55, days: 3}
    # el destino de la Shōgun, cuando el CyberShogun despierta
    - effect: if
      when: {all: [{focus: ZJP_cybershogun}, {not_flag: ZJP_destino_shogun}]}
      then:
      - {effect: flag, value: ZJP_destino_shogun}
      - {effect: event, id: meganations_japon.98, days: 20}

  - id: ZJP_lealtades
    effects:
    - effect: unit_leaders
      kind: army
      effects:
      - {effect: remove_unit_trait, value: zjp_su_casa_gobierna}
      - {effect: remove_unit_trait, value: zjp_casa_relegada}
    - effect: if
      when: {variable_is: {var: ZJP_gobierna, value: 0}}
      then:
      - effect: unit_leaders
        kind: army
        when: {unit_trait: zjp_casa_shogun}
        effects:
        - {effect: add_unit_trait, value: zjp_su_casa_gobierna}
    - effect: if
      when: {variable_is: {var: ZJP_gobierna, value: 1}}
      then:
      - effect: unit_leaders
        kind: army
        when: {unit_trait: zjp_casa_zaibatsu}
        effects:
        - {effect: add_unit_trait, value: zjp_su_casa_gobierna}
      - effect: unit_leaders
        kind: army
        when: {any: [{unit_trait: zjp_casa_yakuza}, {unit_trait: zjp_casa_srs}]}
        effects:
        - {effect: add_unit_trait, value: zjp_casa_relegada}
    - effect: if
      when: {variable_is: {var: ZJP_gobierna, value: 2}}
      then:
      - effect: unit_leaders
        kind: army
        when: {unit_trait: zjp_casa_yakuza}
        effects:
        - {effect: add_unit_trait, value: zjp_su_casa_gobierna}
      - effect: unit_leaders
        kind: army
        when: {any: [{unit_trait: zjp_casa_zaibatsu}, {unit_trait: zjp_casa_srs}]}
        effects:
        - {effect: add_unit_trait, value: zjp_casa_relegada}
    - effect: if
      when: {variable_is: {var: ZJP_gobierna, value: 3}}
      then:
      - effect: unit_leaders
        kind: army
        when: {unit_trait: zjp_casa_srs}
        effects:
