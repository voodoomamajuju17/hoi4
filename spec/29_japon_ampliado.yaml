    portrait: {path: gfx/leaders/ZJP/ZJP_min_kanemura_3.dds, role: civilian, placeholder: false}
  - id: ZJP_min_mizuno_4
    country: ZJP
    src: user_request
    name: {regnal: {english: Wakagashira Tetsuo Mizuno, spanish: Wakagashira Tetsuo Mizuno}}
    born: 2060
    lore: El segundo de Ryūji Sakaguchi, el que cobra en los muelles de Osaka. Nunca levanta la voz; los comerciantes
      pagan antes de que llegue. Si gobierna otra Casa, se vuelve a Osaka a esperar.
    roles:
      advisor:
        slot: political_advisor
        cost: 150
        traits: [zjp_min_wakagashira]
        available: {any: [{variable_is: {var: ZJP_gobierna, value: 0}}, {variable_is: {var: ZJP_gobierna, value: 2}}]}
    portrait: {path: gfx/leaders/ZJP/ZJP_min_mizuno_4.dds, role: civilian, placeholder: false}
  - id: ZJP_min_shirogane_5
    country: ZJP
    src: user_request
    name: {regnal: {english: Doctor Emi Shirogane, spanish: Doctora Emi Shirogane}}
    born: 2064
    lore: Jefa de las cubas de clonación de Sendai. Firma cada lote con su nombre, como un pintor. Si gobierna otra
      Casa, apaga las cubas una por una y se lleva las claves.
    roles:
      advisor:
        slot: political_advisor
        cost: 150
        traits: [zjp_min_cubas_de_sendai]
        available: {any: [{variable_is: {var: ZJP_gobierna, value: 0}}, {variable_is: {var: ZJP_gobierna, value: 3}}]}
    portrait: {path: gfx/leaders/ZJP/ZJP_min_shirogane_5.dds, role: civilian, placeholder: false}
  - id: ZJP_min_ono_6
    country: ZJP
    src: user_request
    name: {regnal: {english: Engineer Sachiko Ono, spanish: Ingeniera Sachiko Ōno}}
    born: 2070
    lore: Diseñó el primer Mecha de Yokosuka en un cuaderno de dibujo, con piezas de grúa. Le dicen a cada Casa que
      el próximo modelo será suyo. Los dibuja a todos igual.
    roles:
      advisor: {slot: theorist, cost: 100, traits: [zjp_min_ingeniera_de_mechas]}
    portrait: {path: gfx/leaders/ZJP/ZJP_min_ono_6.dds, role: civilian, placeholder: false}
