      - id: 46
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Commune Sends Robots", spanish: "La Comuna Manda Robots"}
        desc:
          english: >-
            The Commune of Europe, which has no leaders, has sent no envoy: a freighter simply docked in Osaka with three
            hundred welding robots and a note signed by a planning algorithm. The robots are free. The note explains that
            free things are how the Plan says hello.
          spanish: >-
            La Comuna de Europa, que no tiene líderes, no mandó ningún enviado: un carguero simplemente atracó en Osaka con
            trescientos robots soldadores y una nota firmada por un algoritmo de planificación. Los robots son gratis. La
            nota explica que las cosas gratis son la manera en que el Plan saluda.
        options:
        - name: {english: "Put them to work.", spanish: "Ponerlos a trabajar."}
          effects:
          - {effect: tech_bonus, category: industry, bonus: 0.5, uses: 1}
