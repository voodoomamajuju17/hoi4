  unit_leader_traits:
  - id: zjp_casa_shogun
    country: ZJP
    name: {english: Loyal to the Shogun, spanish: Leal a la Shōgun}
    desc: {english: 'Answers to Kaede Mori and to no House. Fights better while she arbitrates.', spanish: 'Le responde a Kaede Mori y a ninguna Casa. Pelea mejor mientras ella arbitra.'}
    defense_skill: 1
    src: user_request
  - id: zjp_casa_zaibatsu
    country: ZJP
    name: {english: Of the Zaibatsu, spanish: De los Zaibatsu}
    desc: {english: 'A company officer with a company salary. Fights better when the Zaibatsu govern, worse when they do not.', spanish: 'Oficial de la empresa, con sueldo de la empresa. Pelea mejor cuando gobiernan los Zaibatsu, peor cuando no.'}
    logistics_skill: 1
    src: user_request
  - id: zjp_casa_yakuza
    country: ZJP
    name: {english: Of the Yakuza, spanish: De la Yakuza}
    desc: {english: 'Sworn to the clan with sake and blood. Fights better when the Yakuza govern, worse when they do not.', spanish: 'Jurado al clan con sake y sangre. Pelea mejor cuando gobierna la Yakuza, peor cuando no.'}
    attack_skill: 1
    src: user_request
  - id: zjp_casa_srs
    country: ZJP
    name: {english: Of SRS, spanish: De SRS}
    desc: {english: 'Owes the laboratories of Sendai a new heart, or a new body. Fights better when SRS governs, worse when it does not.', spanish: 'Les debe a los laboratorios de Sendai un corazón nuevo, o un cuerpo nuevo. Pelea mejor cuando gobierna SRS, peor cuando no.'}
    planning_skill: 1
    src: user_request
  - id: zjp_su_casa_gobierna
    country: ZJP
    trait_type: status_trait
    name: {english: Their House Governs, spanish: Su Casa Gobierna}
    desc: {english: 'Their House holds the Shogunate: every order is obeyed at once.', spanish: 'Su Casa tiene el Shogunato: cada orden se cumple en el acto.'}
    attack_skill: 1
    defense_skill: 1
    planning_skill: 1
    logistics_skill: 1
    src: user_request
  - id: zjp_casa_relegada
    country: ZJP
    trait_type: status_trait
    name: {english: Their House Is Out of Power, spanish: Su Casa no Gobierna}
    desc: {english: 'Their House lost the Council. The orders arrive late, and are obeyed later.', spanish: 'Su Casa perdió el Consejo. Las órdenes llegan tarde, y se cumplen más tarde.'}
    attack_skill: -1
    planning_skill: -1
    src: user_request

  characters:
  # --- ministros ---------------------------------------------------------------
  - id: ZJP_min_hoshino_1
    country: ZJP
