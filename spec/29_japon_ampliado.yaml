      - id: 54
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Yakuza Breaks the Pact", spanish: "La Yakuza Rompe el Pacto"}
        desc:
          english: >-
            The clans have gone quiet. No envelopes, no greetings, no men in white suits in the courtyard. In the ports the
