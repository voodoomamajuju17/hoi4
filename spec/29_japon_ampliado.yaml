      desc: {english: 'Every new employee signs for life, and life includes the reserve: manpower and faster construction for 180 days.', spanish: 'Cada empleado nuevo firma de por vida, y la vida incluye la reserva: mano de obra y construcción más rápida durante 180 días.'}
      icon_prefer: [generic_industry, generic_army_support]
      cost: 50
      cooldown_days: 365
      visible: {variable_is: {var: ZJP_gobierna, value: 1}}
      effects:
      - {effect: add_manpower, value: 40000}
      - {effect: dynamic_modifier, id: ZJP_contratos_por_vida, days: 180}
      ai: {factor: 2, modifiers: [{factor: 2, when: {at_war: true}}]}
      src: user_request
    - id: ZJP_impuesto_de_proteccion
      name: {english: 'The Protection Tax', spanish: 'El Impuesto de Protección'}
      desc: {english: 'Every shop on the islands pays the clan for a peace nobody else can offer: +15 Giri and 180 days of more political power, at the cost of some stability.', spanish: 'Cada negocio de las islas le paga al clan por una paz que nadie más puede dar: +15 de Giri y 180 días de más poder político, a costa de algo de estabilidad.'}
      icon_prefer: [generic_trade, generic_political_actions]
      cooldown_days: 180
      visible: {variable_is: {var: ZJP_gobierna, value: 2}}
      effects:
      - {effect: add_variable, var: ZJP_giri, value: 15}
      - {effect: add_stability, value: -0.03}
      - {effect: dynamic_modifier, id: ZJP_proteccion, days: 180}
      ai: {factor: 2}
      src: user_request
    - id: ZJP_contrabando_de_armas
      name: {english: 'Gun-Running at the Black Pier', spanish: 'Contrabando de Armas en el Muelle Negro'}
      desc: {english: 'Crates without papers, ships without flags: rifles, support kits and guns for the army.', spanish: 'Cajones sin papeles, barcos sin bandera: fusiles, equipo de apoyo y cañones para el ejército.'}
      icon_prefer: [generic_army_support, generic_trade]
      cost: 50
      cooldown_days: 270
      visible: {variable_is: {var: ZJP_gobierna, value: 2}}
      effects:
      - {effect: equipment, type: infantry_equipment, amount: 3000}
      - {effect: equipment, type: support_equipment, amount: 300}
      - {effect: equipment, type: artillery_equipment, amount: 300}
      ai: {factor: 2, modifiers: [{factor: 3, when: {at_war: true}}]}
      src: user_request
    - id: ZJP_lote_de_emergencia
      name: {english: 'Emergency Clone Batch (15 Giri)', spanish: 'Lote de Clones de Emergencia (15 de Giri)'}
      desc: {english: 'Sixty thousand soldiers decanted in a single week. Nobody asks them what they think; they do not think much yet.', spanish: 'Sesenta mil soldados decantados en una sola semana. Nadie les pregunta qué piensan; todavía no piensan mucho.'}
      icon_prefer: [generic_army_support]
      cooldown_days: 300
      visible: {variable_is: {var: ZJP_gobierna, value: 3}}
      available: {variable_at_least: {var: ZJP_giri, value: 15}}
      effects:
      - {effect: add_variable, var: ZJP_giri, value: -15}
      - {effect: add_manpower, value: 60000}
      - {effect: dynamic_modifier, id: ZJP_clones_de_emergencia, days: 180}
      ai: {factor: 2, modifiers: [{factor: 4, when: {at_war: true}}, {factor: 0, when: {all: [{any: [{focus: ZJP_zai_4}, {focus: ZJP_yak_4}, {focus: ZJP_srs_4}]}, {not: {focus: ZJP_cybershogun}}, {variable_below: {var: ZJP_giri, value: 50}}]}}]}
      src: user_request
    - id: ZJP_ensayo_masivo
      name: {english: 'Mass Clinical Trial', spanish: 'Ensayo Clínico Masivo'}
      desc: {english: 'A free vaccine for the whole population, with a few extra ingredients: a breakthrough and a year of faster research. Something could go wrong.', spanish: 'Una vacuna gratis para toda la población, con algunos ingredientes de más: un avance y un año de investigación más rápida. Algo podría salir mal.'}
      icon_prefer: [generic_research, generic_political_actions]
      cost: 75
      cooldown_days: 540
      visible: {variable_is: {var: ZJP_gobierna, value: 3}}
      effects:
      - {effect: tech_bonus, category: electronics, bonus: 0.5, uses: 1}
      - {effect: dynamic_modifier, id: ZJP_ensayo_clinico, days: 365}
      - effect: hidden
        effects:
        - effect: random
          options:
          - {weight: 70, effects: []}
          - weight: 30
            effects:
            - effect: if
              when: {not_flag: ZJP_ev_77}
              then:
              - {effect: flag, value: ZJP_ev_77}
              - {effect: event, id: meganations_japon.77, days: 90}
      ai: {factor: 2}
      src: user_request
    - id: ZJP_las_mil_voces
      name: {english: 'The Thousand Voices (20 Giri)', spanish: 'Las Mil Voces (20 de Giri)'}
      desc: {english: 'The CyberShogun speaks in every screen of the islands at once, for six months: much more political power and some war support.', spanish: 'El CyberShogun habla en todas las pantallas de las islas a la vez, durante seis meses: mucho más poder político y algo de apoyo a la guerra.'}
      icon_prefer: [generic_political_actions]
      cooldown_days: 365
      visible: {focus: ZJP_cybershogun}
      available: {variable_at_least: {var: ZJP_giri, value: 20}}
      effects:
      - {effect: add_variable, var: ZJP_giri, value: -20}
      - {effect: dynamic_modifier, id: ZJP_mil_voces, days: 180}
      ai:
        factor: 3
        modifiers:
        - {factor: 0, when: {all: [{any: [{focus: ZJP_zai_4}, {focus: ZJP_yak_4}, {focus: ZJP_srs_4}]}, {not: {focus: ZJP_cybershogun}}, {variable_below: {var: ZJP_giri, value: 55}}]}}
        # 2026-11-01: como en 24_japon, la IA guarda el Giri para el CyberShogun
      src: user_request

  dynamic_modifiers:
  - id: ZJP_casas_en_paz
    country: ZJP
    name: {english: The Three Houses at Peace, spanish: Las Tres Casas en Paz}
    desc: {english: 'Zaibatsu money, Yakuza muscle, SRS science, all pulling the same way. It will not last; enjoy it.', spanish: 'La plata de los Zaibatsu, el músculo de la Yakuza, la ciencia de SRS, todo tirando para el mismo lado. No va a durar; aprovechalo.'}
    modifiers: {stability_factor: 0.1, political_power_gain: 0.15, industrial_capacity_factory: 0.05}
  - id: ZJP_cuchillos
    country: ZJP
    name: {english: The Houses Sharpen Their Knives, spanish: Las Casas Afilan los Cuchillos}
    desc: {english: 'One House feels betrayed, and in Japan a betrayed House does not complain: it waits.', spanish: 'Una Casa se siente traicionada, y en Japón una Casa traicionada no se queja: espera.'}
    modifiers: {stability_factor: -0.08, political_power_gain: -0.1}
  - id: ZJP_rehenes
    country: ZJP
    name: {english: Hostages of Honour, spanish: Rehenes de Honor}
    desc: {english: 'Three young heirs drink tea at the court of Yokosuka every afternoon. Their fathers behave.', spanish: 'Tres herederos jóvenes toman el té en la corte de Yokosuka cada tarde. Sus padres se portan bien.'}
    modifiers: {stability_factor: 0.06, political_power_gain: -0.05}
  - id: ZJP_consejo_de_guerra_e
    country: ZJP
    name: {english: War Council of the Houses, spanish: Consejo de Guerra de las Casas}
    desc: {english: 'For once the three Houses fight the same war.', spanish: 'Por una vez las tres Casas pelean la misma guerra.'}
    modifiers: {army_attack_factor: 0.05, army_org_factor: 0.05}
  - id: ZJP_lobas_de_kure_e
    country: ZJP
    name: {english: The She-Wolves of Kure, spanish: Las Lobas de Kure}
    desc: {english: 'Black hulls slide into the water every week. Their captains call them the she-wolves.', spanish: 'Cada semana un casco negro se desliza al agua. Sus capitanes las llaman las lobas.'}
    modifiers: {industrial_capacity_dockyard: 0.1, submarine_attack: 0.1}
  - id: HSN_cables_cortados_japon
    country: HSN
    name: {english: The Cables Are Cut, spanish: Los Cables Cortados}
    desc: {english: 'The prices from Tokyo arrive late, or not at all. The Market hates not knowing.', spanish: 'Los precios de Tokio llegan tarde, o no llegan. El Mercado odia no saber.'}
    modifiers: {research_speed_factor: -0.05, political_power_gain: -0.15}
  - id: ZJP_mechas_en_los_muelles_e
    country: ZJP
    name: {english: Mechas on the Piers, spanish: Mechas en los Muelles}
    desc: {english: 'Every pier ends in a Mecha with its searchlight on.', spanish: 'Cada muelle termina en un Mecha con el reflector prendido.'}
    modifiers: {army_defence_factor: 0.08, dig_in_speed_factor: 0.1}
  - id: ZJP_oferta_publica_e
    country: ZJP
    name: {english: The Shogunate on the Stock Exchange, spanish: El Shogunato en la Bolsa}
    desc: {english: 'Everyone owns a little piece of the state, and everyone checks its price every morning.', spanish: 'Todos tienen un pedacito del Estado, y todos miran su cotización cada mañana.'}
    modifiers: {industrial_capacity_factory: 0.05, stability_factor: -0.05}
  - id: ZJP_contratos_por_vida
    country: ZJP
    name: {english: Lifetime Contracts, spanish: Contratos de por Vida}
    desc: {english: 'One company, one employee, one life.', spanish: 'Una empresa, un empleado, una vida.'}
    modifiers: {production_speed_buildings_factor: 0.1, stability_factor: -0.03}
  - id: ZJP_proteccion
    country: ZJP
    name: {english: The Protection Tax, spanish: El Impuesto de Protección}
    desc: {english: 'The envelope arrives every Friday. Nobody has been robbed in months.', spanish: 'El sobre llega cada viernes. Hace meses que no roban a nadie.'}
    modifiers: {political_power_gain: 0.1, consumer_goods_factor: 0.02}
  - id: ZJP_clones_de_emergencia
    country: ZJP
    name: {english: Emergency Clones, spanish: Clones de Emergencia}
    desc: {english: 'Identical faces in every barracks. The mothers of Sendai cross the street when they see them.', spanish: 'Caras idénticas en cada cuartel. Las madres de Sendai cruzan la calle cuando los ven.'}
    modifiers: {stability_factor: -0.05, recruitable_population_factor: 0.04}
  - id: ZJP_ensayo_clinico
    country: ZJP
    name: {english: The Mass Clinical Trial, spanish: El Ensayo Clínico Masivo}
    desc: {english: 'The whole country is a laboratory, and the results are excellent. So far.', spanish: 'El país entero es un laboratorio, y los resultados son excelentes. Por ahora.'}
    modifiers: {research_speed_factor: 0.08, stability_factor: -0.04}
  - id: ZJP_mil_voces
    country: ZJP
    name: {english: The Thousand Voices, spanish: Las Mil Voces}
    desc: {english: 'The same voice in every speaker of every port, polite and tireless.', spanish: 'La misma voz en cada parlante de cada puerto, amable e incansable.'}
    modifiers: {political_power_gain: 0.25, war_support_factor: 0.05}
  - id: ZJP_capital_en_fuga
    country: ZJP
    name: {english: Capital in Flight, spanish: El Capital en Fuga}
    desc: {english: 'The Zaibatsu have moved their money to accounts the Shogun cannot see.', spanish: 'Los Zaibatsu se llevaron la plata a cuentas que la Shōgun no puede ver.'}
    modifiers: {industrial_capacity_factory: -0.1, production_speed_buildings_factor: -0.1}
  - id: ZJP_puertos_sin_ley
    country: ZJP
    name: {english: Lawless Ports, spanish: Puertos sin Ley}
    desc: {english: 'Without the clans, every pier belongs to whoever has the most knives tonight.', spanish: 'Sin los clanes, cada muelle es del que tenga más cuchillos esta noche.'}
    modifiers: {stability_factor: -0.08, industrial_capacity_dockyard: -0.1}
  - id: ZJP_laboratorios_cerrados
    country: ZJP
    name: {english: Closed Laboratories, spanish: Laboratorios Cerrados}
    desc: {english: 'SRS has locked its doors in Sendai. Its scientists answer only to the company.', spanish: 'SRS cerró sus puertas en Sendai. Sus científicos solo le responden a la empresa.'}
    modifiers: {research_speed_factor: -0.1, recruitable_population_factor: -0.03}
  - id: ZJP_estrecho_de_tsushima
    country: ZJP
    name: {english: The Tsushima Doctrine, spanish: La Doctrina de Tsushima}
    desc: {english: 'Strike first, strike at the narrowest point, and never let the enemy fleet reach open sea.', spanish: 'Golpear primero, golpear en el punto más angosto y nunca dejar que la flota enemiga llegue a mar abierto.'}
    modifiers: {naval_damage_factor: 0.08, naval_speed_factor: 0.05}
  - id: ZJP_neon_de_osaka
    country: ZJP
    name: {english: Neon over Osaka, spanish: Neón sobre Osaka}
    desc: {english: 'The clans have lit the whole city in crimson. Crime is down; the nightlife has never been better.', spanish: 'Los clanes iluminaron toda la ciudad de carmesí. El delito bajó; la noche nunca estuvo mejor.'}
    modifiers: {stability_factor: 0.05, consumer_goods_factor: -0.03}
  - id: ZJP_huelga_soldadores
    country: ZJP
    name: {english: The Welders' Grievance, spanish: El Rencor de los Soldadores}
    desc: {english: 'The strike is over, but the welders work exactly as slowly as the contract allows.', spanish: 'La huelga terminó, pero los soldadores trabajan exactamente tan lento como permite el contrato.'}
    modifiers: {industrial_capacity_dockyard: -0.08}
  - id: ZJP_luto_de_kanto
    country: ZJP
    name: {english: Mourning in Kanto, spanish: Luto en Kanto}
    desc: {english: 'The earth moved for ninety seconds. The rebuilding will take years.', spanish: 'La tierra se movió noventa segundos. La reconstrucción va a llevar años.'}
    modifiers: {production_speed_buildings_factor: -0.1, stability_factor: -0.05}
  - id: ZJP_idols_del_frente
    country: ZJP
    name: {english: Idols of the Front, spanish: Idols del Frente}
    desc: {english: 'Four singers in sailor uniforms sing for the troops on every channel. Enlistment has tripled.', spanish: 'Cuatro cantantes con uniforme de marinero les cantan a las tropas en todos los canales. El alistamiento se triplicó.'}
    modifiers: {war_support_factor: 0.08, recruitable_population_factor: 0.02}
  - id: ZJP_monjes_de_kioto
    country: ZJP
    name: {english: The Monks of Kyoto, spanish: Los Monjes de Kioto}
    desc: {english: 'In the old temples someone still sweeps the gravel every morning, and the country breathes a little slower.', spanish: 'En los templos viejos alguien todavía barre la grava cada mañana, y el país respira un poco más lento.'}
    modifiers: {stability_factor: 0.06, war_support_factor: -0.03}
  - id: ZJP_tren_bala
    country: ZJP
    name: {english: The Last Bullet Train, spanish: El Último Tren Bala}
    desc: {english: 'The old line runs again from Kyushu to Hokkaido, carrying troops in the seats of the tourists.', spanish: 'La línea vieja vuelve a correr de Kyushu a Hokkaido, con soldados en los asientos de los turistas.'}
    modifiers: {production_speed_infrastructure_factor: 0.15, army_speed_factor: 0.03}
  - id: ZJP_mecha_insomne
    country: ZJP
    name: {english: The Sleepless Mecha, spanish: El Mecha Insomne}
    desc: {english: 'At three in the morning the great Mecha of Yokosuka turns its head towards the sea, and nobody told it to.', spanish: 'A las tres de la mañana el gran Mecha de Yokosuka gira la cabeza hacia el mar, y nadie se lo ordenó.'}
    modifiers: {stability_factor: -0.05, research_speed_factor: 0.05}

# =============================================================================
# Eventos (52 nuevos, 40-98). Las imágenes: arte/eventos_descripciones.yaml.
# =============================================================================
events:
  namespaces:
    meganations_japon:
      country: null
      events:
      - id: 40
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Shogun Speaks to the Docks", spanish: "La Shōgun Les Habla a los Diques"}
        desc:
          english: >-
            From the deck of a half-built carrier, Kaede Mori speaks to the docks of Yokosuka and, through every crane
            radio, to the whole country. She has three Houses behind her and none of them trusts the others. The Zaibatsu
            want contracts, the Yakuza want the ports, SRS wants laboratories. Each one is listening for its own name.
          spanish: >-
            Desde la cubierta de un portadrones a medio armar, Kaede Mori les habla a los diques de Yokosuka y, por la radio
            de cada grúa, al país entero. Tiene tres Casas detrás y ninguna confía en las otras. Los Zaibatsu quieren
            contratos, la Yakuza quiere los puertos, SRS quiere laboratorios. Cada una escucha a ver si dice su nombre.
        options:
        - name: {english: "Promise the Zaibatsu the factories.", spanish: "Prometerles las fábricas a los Zaibatsu."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 12}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -4}
          - {effect: add_variable, var: ZJP_favor_srs, value: -4}
          ai_chance: 25
        - name: {english: "Promise the Yakuza the ports.", spanish: "Prometerle los puertos a la Yakuza."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -4}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 12}
          - {effect: add_variable, var: ZJP_favor_srs, value: -4}
          ai_chance: 25
        - name: {english: "Promise SRS the laboratories.", spanish: "Prometerle los laboratorios a SRS."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -4}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -4}
          - {effect: add_variable, var: ZJP_favor_srs, value: 12}
          ai_chance: 25
        - name: {english: "Promise nothing to anyone.", spanish: "No prometerle nada a nadie."}
          effects:
          - {effect: add_stability, value: 0.05}
          ai_chance: 25
        src: user_request
      - id: 41
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Submarines of Kure", spanish: "Los Submarinos de Kure"}
        desc:
          english: >-
            For eleven years the Market's inspectors counted the hulls in the Kure basin and never looked under the water.
            Today twenty-four submarines surfaced at once in the bay, crewed by sailors who had trained in secret since
            they were cadets. The admirals of Singapore are reading the news twice.
          spanish: >-
            Durante once años los inspectores del Mercado contaron los cascos de la dársena de Kure y nunca miraron debajo
            del agua. Hoy salieron a la superficie a la vez veinticuatro submarinos en la bahía, con tripulaciones que se
            entrenaban en secreto desde que eran cadetes. Los almirantes de Singapur leen la noticia dos veces.
        options:
        - name: {english: "Send them hunting.", spanish: "Que salgan a cazar."}
          effects:
          - {effect: navy_experience, value: 30}
          - {effect: add_war_support, value: 0.03}
          ai_chance: 60
        - name: {english: "Keep them hidden a little longer.", spanish: "Tenerlos escondidos un poco más."}
          effects:
          - {effect: add_political_power, value: 50}
          ai_chance: 40
        src: user_request
      - id: 42
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Yokosuka Holds", spanish: "Yokosuka Resiste"}
        desc:
          english: >-
            The High Seas came for the docks at night: marines in fast boats, drones over the cranes, a destroyer firing at
            the dry docks. The welders fought them with cutting torches and rivet guns until the Mechas arrived. By dawn
            the Market's marines were back in their boats, and Yokosuka was still ours.
          spanish: >-
            La Alta Mar vino por los diques de noche: infantes de marina en lanchas rápidas, drones sobre las grúas, un
            destructor tirándoles a los diques secos. Los soldadores los enfrentaron con sopletes y pistolas de remaches
            hasta que llegaron los Mechas. Al amanecer los infantes del Mercado estaban otra vez en sus lanchas, y Yokosuka
            seguía siendo nuestra.
        options:
        - name: {english: "Every welder is a soldier.", spanish: "Cada soldador es un soldado."}
          effects:
          - {effect: add_war_support, value: 0.05}
          - {effect: army_experience, value: 20}
          ai_chance: 60
        - name: {english: "Pay the widows first.", spanish: "Primero, pagarles a las viudas."}
          effects:
          - {effect: add_stability, value: 0.04}
          - {effect: add_political_power, value: -25}
          ai_chance: 40
        src: user_request
      - id: 43
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Strait of Tsushima", spanish: "El Estrecho de Tsushima"}
        desc:
          english: >-
            Two hundred years ago a Japanese fleet won a war in the strait of Tsushima in a single afternoon. The admirals
            of Yokosuka have studied that afternoon all their lives. Now they want permission to fight the way their
            grandfathers did: everything at the narrowest point, all at once.
          spanish: >-
            Hace doscientos años una flota japonesa ganó una guerra en el estrecho de Tsushima en una sola tarde. Los
            almirantes de Yokosuka estudiaron esa tarde toda su vida. Ahora piden permiso para pelear como sus abuelos:
            todo en el punto más angosto, todo a la vez.
        options:
        - name: {english: "Fight like Tsushima.", spanish: "Pelear como en Tsushima."}
          effects:
          - {effect: dynamic_modifier, id: ZJP_estrecho_de_tsushima, days: 730}
          ai_chance: 60
        - name: {english: "Wolf packs, not battles.", spanish: "Manadas de lobos, no batallas."}
          effects:
          - {effect: navy_experience, value: 40}
          ai_chance: 40
        src: user_request
      - id: 44
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Seoul Looks East", spanish: "Seúl Mira hacia el Este"}
        desc:
          english: >-
            The Protectorate of Korea has sent a quiet delegation across the strait: three engineers and a diplomat who
            never says whom she works for. They want to know whether the Shogunate would build ships for Korea, and
            whether it would protect a Korea that someday stopped obeying the Directorate.
          spanish: >-
            El Protectorado de Corea mandó una delegación callada a través del estrecho: tres ingenieros y una diplomática
            que nunca dice para quién trabaja. Quieren saber si el Shogunato le construiría barcos a Corea, y si
            protegería a una Corea que algún día dejara de obedecer al Directorio.
        options:
        - name: {english: "We build for whoever pays.", spanish: "Construimos para el que pague."}
          effects:
          - {effect: add_variable, var: ZJP_giri, value: 10}
          ai_chance: 50
        - name: {english: "Promise them our protection.", spanish: "Prometerles nuestra protección."}
          effects:
          - effect: scope
            target: ZKR
            effects:
            - {effect: opinion, target: ZJP, modifier: meganations_concesion}
          - {effect: add_war_support, value: -0.02}
          ai_chance: 30
        - name: {english: "Send them home politely.", spanish: "Mandarlos a casa con educación."}
          effects:
          - {effect: add_stability, value: 0.02}
          ai_chance: 20
        src: user_request
      - id: 45
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "An Envoy of the Directorate", spanish: "Un Enviado del Directorio"}
        desc:
          english: >-
            A jade-green envoy of the Hydraulic Directorate has arrived in Yokosuka with a letter of credit and a long list
            of conditions written in perfect Japanese. The Directorate offers money for the shipyards, and asks only for
            a seat at every meeting of the Council of the Houses.
          spanish: >-
            Un enviado verde jade del Directorio Hidráulico llegó a Yokosuka con una carta de crédito y una larga lista de
            condiciones escrita en un japonés perfecto. El Directorio ofrece plata para los astilleros, y solo pide una
            silla en cada reunión del Consejo de las Casas.
        options:
