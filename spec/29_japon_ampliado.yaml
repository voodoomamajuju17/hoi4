          - {effect: add_variable, var: ZJP_favor_yakuza, value: 5}
          ai_chance: 40
        src: user_request
      - id: 47
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Warlords of Sakhalin", spanish: "Los Señores de Sajalín"}
        desc:
          english: >-
            Across the cold strait of La Pérouse, the warlords of Sakhalin are selling everything they looted from the old
            Russian bases: torpedoes, reactor rods, a whole icebreaker. The Yakuza wants to buy. The Shogun's admirals want
            to know who else is buying.
          spanish: >-
            Del otro lado del frío estrecho de La Pérouse, los señores de la guerra de Sajalín venden todo lo que saquearon
            de las viejas bases rusas: torpedos, barras de reactor, un rompehielos entero. La Yakuza quiere comprar. Los
            almirantes de la Shōgun quieren saber quién más compra.
        options:
        - name: {english: "Buy the torpedoes.", spanish: "Comprar los torpedos."}
          effects:
          - {effect: add_political_power, value: -50}
          - {effect: tech_bonus, category: naval_equipment, bonus: 0.5, uses: 1}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 5}
          ai_chance: 50
        - name: {english: "Make sure nobody buys them.", spanish: "Asegurarse de que no los compre nadie."}
