    name: {regnal: {english: Chamberlain Aiko Hoshino, spanish: Chambelana Aiko Hoshino}}
    born: 2058
    lore: Era la secretaria del puerto de Yokosuka. La noche de la bandera vieja fue la que guardó los libros de cuentas
      en una caja fuerte y la llave en el bolsillo. Desde entonces el Shogunato le paga a quien ella dice.
    roles:
      advisor: {slot: political_advisor, cost: 150, traits: [zjp_min_chambelana]}
    portrait: {path: gfx/leaders/ZJP/ZJP_min_hoshino_1.dds, role: civilian, placeholder: false}
  - id: ZJP_min_kitamura_2
    country: ZJP
    src: user_request
    name: {regnal: {english: Master of the Docks Goro Kitamura, spanish: Maestro de Diques Goro Kitamura}}
    born: 2042
    lore: Cuarenta años soldando cascos para el Mercado de Alta Mar. Conoce cada dique de Kanto por el ruido que hace
      cuando se llena. Dice que los barcos se construyen con paciencia y se pierden con prisa.
    roles:
      advisor: {slot: political_advisor, cost: 150, traits: [zjp_min_maestro_de_diques]}
    portrait: {path: gfx/leaders/ZJP/ZJP_min_kitamura_2.dds, role: civilian, placeholder: false}
  - id: ZJP_min_kanemura_3
    country: ZJP
    src: user_request
    name: {regnal: {english: Director Yui Kanemura, spanish: Directora Yui Kanemura}}
    born: 2066
    lore: La hermana menor de Daisuke Kanemura, la que lleva las cuentas que él no mira. Si gobierna otra Casa,
      devuelve la llave de la tesorería y se lleva la contabilidad en la cabeza.
