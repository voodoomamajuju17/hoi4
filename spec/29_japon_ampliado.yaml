    portrait: {path: gfx/leaders/ZJP/ZJP_mando_kuroda_1.dds, role: army, placeholder: false}
  - id: ZJP_mando_okada_2
    country: ZJP
    src: user_request
    name: {regnal: {english: Admiral Kiyoshi Okada, spanish: Almirante Kiyoshi Okada}}
    born: 2046
    lore: El oficial más viejo de la flota de Kanto. Le apagó la radio a Singapur junto con Kaede Mori, y fue él quien
      encontró la bandera vieja en un cajón del museo naval.
    roles:
      advisor: {slot: navy_chief, ledger: navy, cost: 100, traits: [mn_mando_armada_decisiva]}
    portrait: {path: gfx/leaders/ZJP/ZJP_mando_okada_2.dds, role: navy, placeholder: false}
  - id: ZJP_mando_fujiwara_3
    country: ZJP
    src: user_request
    name: {regnal: {english: Air Commander Mariko Fujiwara, spanish: Comandante del Aire Mariko Fujiwara}}
    born: 2068
    lore: Dirigía la división de drones de Kanemura Industrias Pesadas. Sus enjambres vuelan con el logo de la
      empresa pintado debajo de las alas.
    roles:
      advisor:
        slot: air_chief
        ledger: air
        cost: 100
        traits: [mn_mando_aire_superioridad]
        available: {any: [{variable_is: {var: ZJP_gobierna, value: 0}}, {variable_is: {var: ZJP_gobierna, value: 1}}]}
    portrait: {path: gfx/leaders/ZJP/ZJP_mando_fujiwara_3.dds, role: army, placeholder: false}
  - id: ZJP_mando_sakamoto_4
