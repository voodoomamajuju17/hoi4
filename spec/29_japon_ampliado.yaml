          - {effect: add_variable, var: ZJP_favor_yakuza, value: 20}
          - {effect: clear_flag, value: ZJP_rompe_yakuza}
          ai_chance: 15
        src: user_request
      - id: 55
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "SRS Breaks the Pact", spanish: "SRS Rompe el Pacto"}
        desc:
          english: >-
            SRS has sealed its laboratories. The guards of Sendai now wear the company's violet instead of the Shogunate's
            crimson, the clone barracks no longer answer the army's radio, and Doctor Akabane sends his regrets: he is very
            busy. Nobody knows what is growing in the vats tonight.
