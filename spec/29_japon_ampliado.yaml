          - {effect: tech_bonus, category: electronics, bonus: 0.5, uses: 1}
          - {effect: add_stability, value: -0.05}
          ai_chance: 50
        - name: {english: "Not with our prisoners.", spanish: "Con nuestros presos, no."}
          effects:
          - {effect: add_variable, var: ZJP_favor_srs, value: -10}
          - {effect: add_stability, value: 0.02}
          ai_chance: 50
        src: user_request
      - id: 53
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Zaibatsu Break the Pact", spanish: "Los Zaibatsu Rompen el Pacto"}
        desc:
          english: >-
            The Zaibatsu have stopped coming to the Council. Their companies have moved their accounts abroad, their
            executives no longer answer calls, and in the Kanemura Tower the lights of the ninetieth floor are off for the
            first time in thirty years. A House that leaves the table takes its money with it.
          spanish: >-
