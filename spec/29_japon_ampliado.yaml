      english: 'ZAIBATSU: [?ZJP_favor_zaibatsu] / YAKUZA: [?ZJP_favor_yakuza] / SRS: [?ZJP_favor_srs]\n\nThree Houses hold the Shogunate together, and each one has its own generals. The House of the chosen road governs: its generals fight better, those of the other two fight worse. Every month the ruling House gains 1 favour and the other two lose 1. At 15 or less a House breaks the pact; all three at 70 or more, the Three Houses at Peace.'
      spanish: 'ZAIBATSU: [?ZJP_favor_zaibatsu] / YAKUZA: [?ZJP_favor_yakuza] / SRS: [?ZJP_favor_srs]\n\nTres Casas sostienen al Shogunato, y cada una tiene sus propios generales. Gobierna la Casa del camino elegido: sus generales pelean mejor, los de las otras dos, peor. Cada mes la Casa que gobierna gana 1 de favor y las otras dos pierden 1. Con 15 o menos una Casa rompe el pacto; las tres en 70 o más, las Tres Casas en Paz.'
