          - {effect: add_war_support, value: 0.02}
          ai_chance: 50
        src: user_request
      - id: 50
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "A Banquet in the Kanemura Tower", spanish: "Un Banquete en la Torre Kanemura"}
        desc:
          english: >-
            The Zaibatsu have invited the whole court to a banquet on the ninetieth floor of the Kanemura Tower. Between
            the lobster and the dessert, Daisuke Kanemura slides a folder across the table: the Shogunate's shipbuilding
            contracts for the next ten years, already filled in with his companies' names. It only needs a signature.
          spanish: >-
            Los Zaibatsu invitaron a toda la corte a un banquete en el piso noventa de la Torre Kanemura. Entre la langosta
            y el postre, Daisuke Kanemura desliza una carpeta por la mesa: los contratos navales del Shogunato para los
            próximos diez años, ya completados con los nombres de sus empresas. Solo falta una firma.
        options:
        - name: {english: "Sign.", spanish: "Firmar."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 12}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -5}
          - {effect: add_stability, value: -0.02}
          ai_chance: 50
        - name: {english: "Leave the folder on the table.", spanish: "Dejar la carpeta sobre la mesa."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -10}
          - {effect: add_political_power, value: 30}
          ai_chance: 50
        src: user_request
      - id: 51
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Oyabun Asks for a Port", spanish: "El Oyabun Pide un Puerto"}
        desc:
          english: >-
            Ryuji Sakaguchi asked for an audience and arrived with forty men in white suits who waited in the courtyard in
            perfect silence. He wants the port of Osaka: customs, cranes and night shifts, all in the hands of his clan. In
            exchange, he says, nothing will ever be stolen in Osaka again.
          spanish: >-
            Ryūji Sakaguchi pidió una audiencia y llegó con cuarenta hombres de traje blanco que esperaron en el patio en
            perfecto silencio. Quiere el puerto de Osaka: aduana, grúas y turnos de noche, todo en manos de su clan. A
            cambio, dice, en Osaka no se va a volver a robar nada nunca más.
        options:
        - name: {english: "Osaka is yours.", spanish: "Osaka es tuya."}
          effects:
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 12}
          - {effect: add_variable, var: ZJP_giri, value: 5}
          - {effect: add_stability, value: -0.03}
          ai_chance: 50
        - name: {english: "The ports belong to the Shogun.", spanish: "Los puertos son de la Shōgun."}
          effects:
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -10}
          - {effect: add_war_support, value: 0.02}
          ai_chance: 50
        src: user_request
      - id: 52
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Basements of Sendai", spanish: "Los Sótanos de Sendai"}
        desc:
          english: >-
            Doctor Akabane's request is three pages long and very polite. SRS needs volunteers for the next phase of its
            research, and the prisons of the Shogunate are full of people with nothing better to do. The word 'volunteer'
            appears eleven times. The word 'consent' does not appear at all.
          spanish: >-
            El pedido del doctor Akabane tiene tres páginas y es muy educado. SRS necesita voluntarios para la próxima fase
            de su investigación, y las cárceles del Shogunato están llenas de gente sin nada mejor que hacer. La palabra
            'voluntario' aparece once veces. La palabra 'consentimiento' no aparece nunca.
        options:
        - name: {english: "Open the prisons.", spanish: "Abrir las cárceles."}
          effects:
