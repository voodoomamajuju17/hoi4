    name: {regnal: {english: General Tsuyoshi Kuroda, spanish: General Tsuyoshi Kuroda}}
    born: 2057
    lore: Hermano jurado de Sakaguchi desde los quince años. Manda el ejército como mandaba a los cobradores, de
      frente y sin papeles.
    roles:
      advisor:
        slot: army_chief
        ledger: army
        cost: 100
        traits: [mn_mando_ofensiva]
