          - {effect: tech_bonus, category: electronics, bonus: 0.5, uses: 1}
          - {effect: add_variable, var: ZJP_favor_srs, value: 20}
          - {effect: clear_flag, value: ZJP_rompe_srs}
          ai_chance: 15
        src: user_request
      - id: 56
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Murder at the Ryokan", spanish: "El Asesinato en el Ryokan"}
        desc:
          english: >-
            A Zaibatsu vice-president was found in the hot spring of a ryokan in Hakone with his throat cut and a Yakuza pin
            in his hand. The Zaibatsu demand blood; the clans swear the pin was planted; SRS offers, very kindly, to perform
            the autopsy. The whole country is waiting to see whom the court believes.
          spanish: >-
            A un vicepresidente de los Zaibatsu lo encontraron en la fuente termal de un ryokan de Hakone, degollado y con
            un pin de la Yakuza en la mano. Los Zaibatsu piden sangre; los clanes juran que el pin lo plantaron; SRS se
            ofrece, muy amablemente, a hacer la autopsia. Todo el país espera a ver a quién le cree la corte.
        options:
        - name: {english: "The Yakuza did it.", spanish: "Fue la Yakuza."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 10}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -12}
          ai_chance: 35
        - name: {english: "The pin was planted.", spanish: "El pin lo plantaron."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -12}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 10}
          ai_chance: 35
        - name: {english: "Let SRS do the autopsy.", spanish: "Que SRS haga la autopsia."}
          effects:
          - {effect: add_variable, var: ZJP_favor_srs, value: 8}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -4}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -4}
          ai_chance: 30
        src: user_request
      - id: 57
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Welders' Strike", spanish: "La Huelga de los Soldadores"}
        desc:
          english: >-
            Forty thousand welders have downed their torches across the shipyards of Kanto. They want one day off a week and
            helmets that do not crack. The Zaibatsu want them back at work by Monday, the Yakuza offers to 'talk to them',
            and SRS mentions that clones do not strike.
          spanish: >-
            Cuarenta mil soldadores dejaron los sopletes en todos los astilleros de Kanto. Quieren un día libre por semana y
            cascos que no se partan. Los Zaibatsu los quieren de vuelta el lunes, la Yakuza se ofrece a 'hablar con ellos'
            y SRS comenta que los clones no hacen huelga.
        options:
        - name: {english: "Give them their day off.", spanish: "Darles su día libre."}
          effects:
          - {effect: add_political_power, value: -60}
          - {effect: add_stability, value: 0.04}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -5}
          ai_chance: 40
        - name: {english: "Let the Yakuza talk to them.", spanish: "Que la Yakuza hable con ellos."}
          effects:
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 8}
          - {effect: add_stability, value: -0.04}
          - {effect: dynamic_modifier, id: ZJP_huelga_soldadores, days: 180}
          ai_chance: 30
        - name: {english: "Replace them with clones.", spanish: "Reemplazarlos por clones."}
          effects:
          - {effect: add_variable, var: ZJP_favor_srs, value: 8}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 3}
          - {effect: add_stability, value: -0.06}
          ai_chance: 30
        src: user_request
      - id: 58
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Clones in the Street", spanish: "Clones en la Calle"}
        desc:
          english: >-
            A photograph is going around every screen in Tokyo: eleven identical young men waiting at the same pedestrian
            crossing in Ginza, in identical grey suits, all looking at the same billboard. SRS says it is a coincidence. The
            newspapers have started counting faces.
          spanish: >-
            Una foto da vueltas por todas las pantallas de Tokio: once muchachos idénticos esperando en el mismo cruce
            peatonal de Ginza, con trajes grises idénticos, todos mirando el mismo cartel. SRS dice que es una casualidad.
            Los diarios empezaron a contar caras.
        options:
        - name: {english: "A coincidence, as SRS says.", spanish: "Una casualidad, como dice SRS."}
          effects:
          - {effect: add_variable, var: ZJP_favor_srs, value: 6}
          - {effect: add_stability, value: -0.03}
          ai_chance: 50
        - name: {english: "Order SRS to keep them indoors.", spanish: "Ordenarle a SRS que los tenga adentro."}
          effects:
          - {effect: add_variable, var: ZJP_favor_srs, value: -8}
          - {effect: add_stability, value: 0.03}
          ai_chance: 50
        src: user_request
      - id: 59
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Generals' Toast", spanish: "El Brindis de los Generales"}
        desc:
          english: >-
            The Shogun has invited the generals of all three Houses to the same table for the first time. The Zaibatsu
            officers arrived in limousines, the Yakuza officers in black sports cars, the SRS officers in a white ambulance.
            Nobody has touched the sake yet. Everyone is waiting to see who drinks first, and to whom.
          spanish: >-
            La Shōgun invitó por primera vez a los generales de las tres Casas a la misma mesa. Los oficiales de los
            Zaibatsu llegaron en limusina, los de la Yakuza en autos deportivos negros, los de SRS en una ambulancia
            blanca. Nadie tocó el sake todavía. Todos esperan a ver quién toma primero, y a la salud de quién.
        options:
        - name: {english: "A toast to the Shogunate, paid by the court (10 Giri).", spanish: "Un brindis por el Shogunato, que paga la corte (10 de Giri)."}
          when: {variable_at_least: {var: ZJP_giri, value: 10}}
          effects:
          - {effect: add_variable, var: ZJP_giri, value: -10}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 4}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 4}
          - {effect: add_variable, var: ZJP_favor_srs, value: 4}
          ai_chance: {base: 60, modifiers: [{factor: 0, when: {all: [{any: [{focus: ZJP_zai_4}, {focus: ZJP_yak_4}, {focus: ZJP_srs_4}]}, {not: {focus: ZJP_cybershogun}}, {variable_below: {var: ZJP_giri, value: 45}}]}}]}
        - name: {english: "Separate tables, and the sake goes back.", spanish: "Mesas separadas, y el sake vuelve a la bodega."}
          effects:
          - {effect: add_stability, value: 0.02}
          - {effect: army_experience, value: 10}
          ai_chance: 40
        src: user_request
      - id: 60
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Zaibatsu Take the Council", spanish: "Los Zaibatsu Toman el Consejo"}
        desc:
          english: >-
            The Council of the Shogunate now meets on the ninetieth floor of the Kanemura Tower, and its agenda is printed
            as a quarterly report. The Zaibatsu generals have been given new offices and new tanks; the Yakuza and SRS
            commanders have been given polite letters reminding them who pays their salaries.
          spanish: >-
            El Consejo del Shogunato ahora se reúne en el piso noventa de la Torre Kanemura, y su orden del día se imprime
            como un informe trimestral. A los generales de los Zaibatsu les dieron oficinas nuevas y tanques nuevos; a los
            comandantes de la Yakuza y de SRS, cartas muy educadas que les recuerdan quién les paga el sueldo.
        options:
        - name: {english: "The House of money governs.", spanish: "Gobierna la Casa de la plata."}
          effects:
          - effect: every_country
            when: {is_ai: false}
            effects:
            - {effect: event, id: meganations_japon.63, days: 1}
        src: user_request
      - id: 61
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Yakuza Takes the Council", spanish: "La Yakuza Toma el Consejo"}
        desc:
          english: >-
            The Council now meets in a back room of a restaurant in Osaka, behind a red neon sign, and nobody takes notes.
            The generals of the clans walk into headquarters with their jackets open and their tattoos showing. The
            Zaibatsu and SRS commanders have learned to knock before they enter.
          spanish: >-
            El Consejo ahora se reúne en un salón del fondo de un restaurante de Osaka, detrás de un cartel de neón rojo, y
            nadie toma notas. Los generales de los clanes entran al cuartel general con el saco abierto y los tatuajes a la
            vista. Los comandantes de los Zaibatsu y de SRS aprendieron a golpear antes de entrar.
        options:
        - name: {english: "The House of the clans governs.", spanish: "Gobierna la Casa de los clanes."}
          effects:
          - effect: every_country
            when: {is_ai: false}
            effects:
            - {effect: event, id: meganations_japon.63, days: 1}
        src: user_request
      - id: 62
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "SRS Takes the Council", spanish: "SRS Toma el Consejo"}
        desc:
          english: >-
            The Council now meets in a white room in Sendai that smells of disinfectant, and every member is given a small
            violet pill before the session, 'for concentration'. The SRS commanders run the war from the laboratories. The
            Zaibatsu and Yakuza generals take their pills, and wonder.
          spanish: >-
            El Consejo ahora se reúne en una sala blanca de Sendai que huele a desinfectante, y a cada miembro le dan una
            pastillita violeta antes de la sesión, 'para la concentración'. Los comandantes de SRS manejan la guerra desde
            los laboratorios. Los generales de los Zaibatsu y de la Yakuza se toman sus pastillas, y se preguntan.
        options:
        - name: {english: "The House of the laboratories governs.", spanish: "Gobierna la Casa de los laboratorios."}
          effects:
          - effect: every_country
            when: {is_ai: false}
            effects:
            - {effect: event, id: meganations_japon.63, days: 1}
        src: user_request
      - id: 63
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Shogunate Chooses a Master", spanish: "El Shogunato Elige Amo"}
        desc:
          english: >-
            The Shipyard Shogunate of Japan has chosen which of its three Houses will govern: the corporations, the clans or
            the laboratories. Its generals now fight for their House as much as for their country, and the losers are
            counting the days.
          spanish: >-
            El Shogunato de los Astilleros de Japón eligió cuál de sus tres Casas va a gobernar: las corporaciones, los
            clanes o los laboratorios. Sus generales ahora pelean por su Casa tanto como por su país, y los que perdieron
            cuentan los días.
        options:
        - name: {english: "Three Houses, one fleet.", spanish: "Tres Casas, una flota."}
          effects: []
        src: user_request
      - id: 64
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Three Houses at Peace", spanish: "Las Tres Casas en Paz"}
        desc:
          english: >-
            For the first time since the docks rose, the three bosses have shared a meal without bodyguards. Kanemura poured
            the sake, Sakaguchi told a joke and Akabane laughed at it, which nobody had ever seen. The court is not sure
            whether to celebrate or to worry.
          spanish: >-
            Por primera vez desde que se levantaron los diques, los tres jefes compartieron una comida sin guardaespaldas.
            Kanemura sirvió el sake, Sakaguchi contó un chiste y Akabane se rió, cosa que nadie había visto nunca. La corte
            no sabe si festejar o preocuparse.
        options:
        - name: {english: "Celebrate, and worry.", spanish: "Festejar, y preocuparse."}
          effects:
          - {effect: add_political_power, value: 50}
        src: user_request
      - id: 65
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Shareholders' Meeting", spanish: "La Junta de Accionistas"}
        desc:
          english: >-
            The annual shareholders' meeting of the Shogunate was held in a stadium in Yokohama, with fireworks and a
            hologram of the chief executive. The shareholders voted, by a large majority, to cut the military budget and pay
            themselves a dividend. The generals were not shareholders.
          spanish: >-
            La junta anual de accionistas del Shogunato se hizo en un estadio de Yokohama, con fuegos artificiales y un
            holograma del director general. Los accionistas votaron, por amplia mayoría, recortar el presupuesto militar y
            pagarse un dividendo. Los generales no eran accionistas.
        options:
        - name: {english: "Pay the dividend.", spanish: "Pagar el dividendo."}
          effects:
          - {effect: add_political_power, value: 75}
          - {effect: add_war_support, value: -0.04}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 5}
          ai_chance: 50
        - name: {english: "Veto the vote.", spanish: "Vetar la votación."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -8}
          - {effect: add_war_support, value: 0.03}
          ai_chance: 50
        src: user_request
      - id: 66
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Kawasaki Lay-offs", spanish: "Los Despidos de Kawasaki"}
        desc:
          english: >-
            Kanemura Heavy Industries has replaced twelve thousand workers in its Kawasaki plant with machines bought from
            the Commune. The dismissed workers are camped outside the gates with their families. The company asks the army
            to clear the road.
          spanish: >-
            Kanemura Industrias Pesadas reemplazó a doce mil obreros de su planta de Kawasaki por máquinas compradas a la
            Comuna. Los despedidos acampan frente a los portones con sus familias. La empresa le pide al ejército que
            despeje el camino.
        options:
        - name: {english: "Clear the road.", spanish: "Despejar el camino."}
          effects:
          - {effect: add_stability, value: -0.05}
          - {effect: tech_bonus, category: industry, bonus: 0.5, uses: 1}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 5}
          ai_chance: 50
        - name: {english: "Draft them instead.", spanish: "Mejor, reclutarlos."}
          effects:
          - {effect: add_manpower, value: 12000}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -4}
          ai_chance: 50
        src: user_request
      - id: 67
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Kanemura Buys a Foreign Port", spanish: "Kanemura Compra un Puerto Extranjero"}
        desc:
          english: >-
            Through four shell companies and a bank in a neutral port, the Zaibatsu have bought a container port on the
            other side of the Pacific. Its workers woke up to a new flag on the cranes. Abroad they call it a purchase; at
            home, the first colony bought on credit.
          spanish: >-
            A través de cuatro empresas fantasma y un banco de un puerto neutral, los Zaibatsu compraron un puerto de
            contenedores del otro lado del Pacífico. Sus trabajadores se despertaron con una bandera nueva en las grúas.
            Afuera lo llaman una compra; acá, la primera colonia comprada a crédito.
        options:
        - name: {english: "A colony is a colony.", spanish: "Una colonia es una colonia."}
          effects:
          - {effect: add_war_support, value: 0.03}
          - {effect: add_political_power, value: 50}
          ai_chance: 50
        - name: {english: "Sell it again, at a profit.", spanish: "Venderlo de nuevo, con ganancia."}
          effects:
          - {effect: add_variable, var: ZJP_giri, value: 10}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 5}
          ai_chance: 50
        src: user_request
      - id: 68
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "A Record Quarter", spanish: "El Trimestre Récord"}
        desc:
          english: >-
            The shipyards of the Shogunate have closed the best quarter in their history: more tonnage than the Market,
            more Mechas than ever, and profits that the Zaibatsu want to reinvest at once. The only question is in what.
          spanish: >-
            Los astilleros del Shogunato cerraron el mejor trimestre de su historia: más tonelaje que el Mercado, más Mechas
            que nunca y ganancias que los Zaibatsu quieren reinvertir ya. La única pregunta es en qué.
        options:
        - name: {english: "In more shipyards.", spanish: "En más astilleros."}
          effects:
          - {effect: build, building: dockyard, level: 1}
          ai_chance: 40
        - name: {english: "In more factories.", spanish: "En más fábricas."}
          effects:
          - {effect: build, building: industrial_complex, level: 1}
          ai_chance: 40
        - name: {english: "In the dividend.", spanish: "En el dividendo."}
          effects:
          - {effect: add_political_power, value: 100}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 5}
          ai_chance: 20
        src: user_request
      - id: 70
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Clan War of Kobe", spanish: "La Guerra de los Clanes de Kobe"}
        desc:
          english: >-
            Two families of the Sakaguchi clan are killing each other in the alleys of Kobe over who controls the fish
            market. Eleven dead in a week, and both families are asking the Oyabun to choose. Whoever he chooses, the other
            will remember.
          spanish: >-
            Dos familias del clan Sakaguchi se están matando en los callejones de Kobe por quién controla el mercado de
            pescado. Once muertos en una semana, y las dos familias le piden al Oyabun que elija. Elija a quien elija, la
            otra se va a acordar.
        options:
        - name: {english: "Let them fight it out.", spanish: "Que lo arreglen a los tiros."}
          effects:
          - {effect: add_stability, value: -0.04}
          - {effect: army_experience, value: 15}
          ai_chance: 50
        - name: {english: "Split the market in half.", spanish: "Partir el mercado en dos."}
          effects:
          - {effect: add_political_power, value: -40}
          - {effect: add_stability, value: 0.03}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 5}
          ai_chance: 50
        src: user_request
      - id: 71
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Minister's Little Finger", spanish: "El Meñique del Ministro"}
        desc:
          english: >-
            The Minister of Supply arrived at the Council with his left hand wrapped in a bandage and offered the Oyabun a
            small lacquered box. He had lost a shipment of fuel to the Market's privateers. The other ministers are now very
            careful with their shipments.
          spanish: >-
            El ministro de Abastecimiento llegó al Consejo con la mano izquierda vendada y le ofreció al Oyabun una cajita
            laqueada. Había perdido un cargamento de combustible a manos de los corsarios del Mercado. Los otros ministros
            ahora cuidan muchísimo sus cargamentos.
        options:
        - name: {english: "Accept the apology.", spanish: "Aceptar la disculpa."}
          effects:
          - {effect: add_political_power, value: 60}
          - {effect: add_stability, value: -0.02}
          ai_chance: 50
        - name: {english: "Ban the old customs from the Council.", spanish: "Prohibir las viejas costumbres en el Consejo."}
          effects:
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -8}
          - {effect: add_stability, value: 0.04}
          ai_chance: 50
        src: user_request
      - id: 72
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Neon over Osaka", spanish: "Neón sobre Osaka"}
        desc:
          english: >-
            The clans have relit every neon sign in Osaka at their own expense: kilometres of crimson and pink over the
            canals, the most beautiful night in Asia. The streets are safer than ever. Everyone knows who is watching from
            behind the signs.
          spanish: >-
            Los clanes volvieron a encender todos los carteles de neón de Osaka con su propia plata: kilómetros de carmesí y
            rosa sobre los canales, la noche más linda de Asia. Las calles están más seguras que nunca. Todos saben quién
            mira desde atrás de los carteles.
        options:
        - name: {english: "Let the city shine.", spanish: "Que brille la ciudad."}
          effects:
          - {effect: dynamic_modifier, id: ZJP_neon_de_osaka, days: 365}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 3}
        src: user_request
      - id: 73
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Ships Without Flags", spanish: "Los Barcos sin Bandera"}
        desc:
          english: >-
            Forty fishing boats without flags, without names and without lights have left the night ports of Kyushu. They
            come back full of whatever the Market's convoys were carrying. The clan calls it fishing. The insurers of
            Singapore call it piracy.
          spanish: >-
            Cuarenta pesqueros sin bandera, sin nombre y sin luces salieron de los puertos nocturnos de Kyushu. Vuelven
            llenos de lo que llevaban los convoyes del Mercado. El clan lo llama pesca. Las aseguradoras de Singapur lo
            llaman piratería.
        options:
        - name: {english: "Good fishing.", spanish: "Buena pesca."}
          effects:
          - {effect: add_variable, var: ZJP_giri, value: 10}
          - {effect: equipment, type: infantry_equipment, amount: 1500}
          ai_chance: 60
        - name: {english: "Call the boats back.", spanish: "Que vuelvan los barcos."}
          effects:
          - {effect: add_political_power, value: 25}
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -5}
          ai_chance: 40
        src: user_request
      - id: 75
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Batch Seven Wakes Up", spanish: "El Lote Siete Despierta"}
        desc:
          english: >-
            Batch Seven of the Sendai clones has started asking questions. Not about orders, which they follow perfectly,
            but about the sky, about music, about why they all dream the same dream. Doctor Akabane is delighted. The army
            is less delighted.
          spanish: >-
            El Lote Siete de los clones de Sendai empezó a hacer preguntas. No sobre las órdenes, que cumplen a la
            perfección, sino sobre el cielo, sobre la música, sobre por qué todos sueñan el mismo sueño. El doctor Akabane
            está encantado. El ejército, menos.
        options:
        - name: {english: "Let them ask.", spanish: "Que pregunten."}
          effects:
          - {effect: tech_bonus, category: electronics, bonus: 0.5, uses: 1}
          - {effect: add_stability, value: -0.02}
          ai_chance: 50
        - name: {english: "Recondition Batch Seven.", spanish: "Reacondicionar al Lote Siete."}
          effects:
          - {effect: army_experience, value: 25}
          - {effect: add_variable, var: ZJP_favor_srs, value: -4}
          ai_chance: 50
        src: user_request
      - id: 76
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "A Vaccine for Everyone", spanish: "Una Vacuna para Todos"}
        desc:
          english: >-
            SRS has announced a free vaccine against the autumn fever for every citizen of the Shogunate. The queues wind
            around the blocks of every city. The vaccine works perfectly against the fever. Whatever else it does will be
            published in the next annual report.
          spanish: >-
            SRS anunció una vacuna gratis contra la fiebre de otoño para cada ciudadano del Shogunato. Las colas dan la
            vuelta a la manzana en todas las ciudades. La vacuna funciona perfecto contra la fiebre. Lo demás que hace se va
            a publicar en el próximo informe anual.
        options:
        - name: {english: "Vaccinate everyone.", spanish: "Vacunar a todos."}
          effects:
          - {effect: add_manpower, value: 20000}
          - {effect: add_stability, value: 0.03}
          ai_chance: 60
        - name: {english: "Only the army.", spanish: "Solo al ejército."}
          effects:
          - {effect: army_experience, value: 15}
          ai_chance: 40
        src: user_request
      - id: 77
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Escape from Laboratory Nine", spanish: "La Fuga del Laboratorio Nueve"}
        desc:
          english: >-
            Something escaped from Laboratory Nine in Sendai last night, through two steel doors and a wall. SRS says it was
            a 'non-hazardous prototype'. The police found the doors. Nobody has found the prototype, and the people of
            Sendai have stopped going out at night.
          spanish: >-
            Algo se escapó anoche del Laboratorio Nueve de Sendai, atravesando dos puertas de acero y una pared. SRS dice
            que era un 'prototipo no peligroso'. La policía encontró las puertas. El prototipo no lo encontró nadie, y la
            gente de Sendai dejó de salir de noche.
        options:
        - name: {english: "Hunt it down with the Mechas.", spanish: "Cazarlo con los Mechas."}
          effects:
          - {effect: army_experience, value: 20}
          - {effect: add_stability, value: -0.03}
          ai_chance: 60
        - name: {english: "Deny everything.", spanish: "Negar todo."}
          effects:
          - {effect: add_stability, value: -0.06}
          - {effect: add_variable, var: ZJP_favor_srs, value: 6}
          ai_chance: 40
        src: user_request
      - id: 78
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Committee That Does Not Exist", spanish: "El Comité que No Existe"}
        desc:
          english: >-
            A journalist from Kyoto has found the minutes of the SRS ethics committee: twelve years of blank pages, signed
            every month by the same three people, two of whom died in 2091. The article is ready to be published tomorrow
            morning.
          spanish: >-
            Un periodista de Kioto encontró las actas del comité de ética de SRS: doce años de páginas en blanco, firmadas
            cada mes por las mismas tres personas, dos de las cuales murieron en 2091. El artículo está listo para salir
            mañana a la mañana.
        options:
        - name: {english: "Let it be published.", spanish: "Que se publique."}
          effects:
          - {effect: add_stability, value: -0.04}
          - {effect: add_variable, var: ZJP_favor_srs, value: -10}
          - {effect: add_political_power, value: 30}
          ai_chance: 30
        - name: {english: "Buy the newspaper.", spanish: "Comprar el diario."}
          effects:
          - {effect: add_political_power, value: -60}
          - {effect: add_variable, var: ZJP_favor_srs, value: 5}
          ai_chance: 40
        - name: {english: "The journalist volunteers for a trial.", spanish: "El periodista se ofrece de voluntario para un ensayo."}
          effects:
          - {effect: add_variable, var: ZJP_favor_srs, value: 10}
          - {effect: add_stability, value: -0.06}
          ai_chance: 30
        src: user_request
      - id: 80
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The First Mecha Falls", spanish: "Cae el Primer Mecha"}
        desc:
          english: >-
            Mecha number 114 fell today on a hill in the south, brought down by a missile it never saw. Its pilot, a
            nineteen-year-old from Hiroshima, walked out of the wreck carrying the samurai crest of its head under her arm.
            The photograph is on every screen of the islands.
          spanish: >-
            Hoy cayó el Mecha número 114 en una colina del sur, derribado por un misil que nunca vio. Su piloto, una chica de
            diecinueve años de Hiroshima, salió de los restos con el crestón samurái de la cabeza bajo el brazo. La foto
            está en todas las pantallas de las islas.
        options:
        - name: {english: "Give her a new Mecha.", spanish: "Darle un Mecha nuevo."}
          effects:
          - {effect: add_war_support, value: 0.05}
          ai_chance: 50
        - name: {english: "Study the wreck.", spanish: "Estudiar los restos."}
          effects:
          - {effect: tech_bonus, category: armor, bonus: 0.5, uses: 1}
          ai_chance: 50
        src: user_request
      - id: 81
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Sixteen-Year-Old Pilots", spanish: "Pilotos de Dieciséis Años"}
        desc:
          english: >-
            The Mecha academies are accepting sixteen-year-olds: their reflexes are faster and their bodies fit the cockpits
            better. The mothers' associations protest outside the academy of Yokosuka every morning. Every evening the
            queue to sign up is longer.
          spanish: >-
            Las academias de Mechas aceptan chicos de dieciséis años: tienen reflejos más rápidos y entran mejor en las
            cabinas. Las asociaciones de madres protestan todas las mañanas frente a la academia de Yokosuka. Todas las
            tardes, la fila para anotarse es más larga.
        options:
        - name: {english: "Keep the age.", spanish: "Mantener la edad."}
          effects:
          - {effect: army_experience, value: 30}
          - {effect: add_stability, value: -0.04}
          ai_chance: 50
        - name: {english: "Raise it to eighteen.", spanish: "Subirla a dieciocho."}
          effects:
          - {effect: add_stability, value: 0.03}
          - {effect: add_war_support, value: -0.02}
          ai_chance: 50
        src: user_request
      - id: 82
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Mecha Parade in Ginza", spanish: "Desfile de Mechas en Ginza"}
        desc:
          english: >-
            Eighty Mechas marched down the Ginza at dawn, each one taller than the shop fronts, their footsteps setting off
            car alarms for kilometres. Children climbed onto their parents' shoulders; foreign attachés took notes.
            Somewhere in Singapore someone is watching the broadcast in slow motion.
          spanish: >-
            Ochenta Mechas desfilaron por Ginza al amanecer, cada uno más alto que las vidrieras, con pisadas que hacían
            saltar las alarmas de los autos por kilómetros. Los chicos se subían a los hombros de sus padres; los agregados
            extranjeros tomaban notas. En algún lugar de Singapur alguien mira la transmisión en cámara lenta.
        options:
        - name: {english: "Let the world watch.", spanish: "Que mire el mundo."}
          effects:
          - {effect: add_war_support, value: 0.04}
          - {effect: add_political_power, value: 25}
        src: user_request
      - id: 83
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Mecha That Would Not Fire", spanish: "El Mecha que No Quiso Disparar"}
        desc:
          english: >-
            During an assault, the targeting computer of Mecha 207 refused to fire on a village where the enemy had dug in,
            and froze for eleven minutes. The pilot survived; the assault failed. The engineers say it was a bug. The pilot
            says it was not.
          spanish: >-
            Durante un asalto, la computadora de tiro del Mecha 207 se negó a disparar sobre un pueblo donde se había
            atrincherado el enemigo, y se congeló once minutos. El piloto sobrevivió; el asalto fracasó. Los ingenieros dicen
            que fue una falla. El piloto dice que no.
        options:
        - name: {english: "Patch every Mecha.", spanish: "Parchar todos los Mechas."}
          effects:
          - {effect: tech_bonus, category: armor, bonus: 0.5, uses: 1}
          - {effect: add_war_support, value: -0.02}
          ai_chance: 60
        - name: {english: "Leave the code alone.", spanish: "No tocar el código."}
          effects:
          - {effect: add_stability, value: 0.03}
          ai_chance: 40
        src: user_request
      - id: 85
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Last Monks of Kyoto", spanish: "Los Últimos Monjes de Kioto"}
        desc:
          english: >-
            The last monks of Kyoto have asked the Shogun for one thing: that the war never reach the old temples. They offer
            nothing in exchange but prayers. Half the country has started visiting them on Sundays.
          spanish: >-
            Los últimos monjes de Kioto le pidieron una sola cosa a la Shōgun: que la guerra nunca llegue a los templos
            viejos. No ofrecen nada a cambio, salvo rezos. Medio país empezó a visitarlos los domingos.
        options:
        - name: {english: "Kyoto will be spared.", spanish: "Kioto se va a salvar."}
          effects:
          - {effect: dynamic_modifier, id: ZJP_monjes_de_kioto, days: 730}
          ai_chance: 50
        - name: {english: "Even the temples serve the docks.", spanish: "Hasta los templos sirven a los diques."}
          effects:
          - {effect: add_war_support, value: 0.03}
          - {effect: add_stability, value: -0.02}
          ai_chance: 50
        src: user_request
      - id: 86
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Typhoon over Kyushu", spanish: "Tifón sobre Kyushu"}
        desc:
          english: >-
            The strongest typhoon in thirty years has struck Kyushu: winds of three hundred kilometres an hour, the port of
            Nagasaki under water, two cranes lying in the bay. The Houses are already arguing about who pays for the
            rebuilding.
          spanish: >-
            El tifón más fuerte en treinta años pegó en Kyushu: vientos de trescientos kilómetros por hora, el puerto de
            Nagasaki bajo el agua, dos grúas tiradas en la bahía. Las Casas ya discuten quién paga la reconstrucción.
        options:
        - name: {english: "The Shogun pays.", spanish: "Paga la Shōgun."}
          effects:
          - {effect: add_political_power, value: -75}
          - {effect: add_stability, value: 0.04}
          ai_chance: 50
        - name: {english: "The Zaibatsu pay.", spanish: "Pagan los Zaibatsu."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: -8}
          ai_chance: 35
        - name: {english: "Nobody pays.", spanish: "No paga nadie."}
          effects:
          - {effect: add_stability, value: -0.05}
          ai_chance: 15
        src: user_request
      - id: 87
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Great Kanto Earthquake", spanish: "El Gran Terremoto de Kanto"}
        desc:
          english: >-
            At 4:12 in the morning the earth moved for ninety seconds. Half of Yokohama is in ruins, the dry docks of
            Yokosuka are cracked and fires burn in Tokyo. The great Mecha stood still through the whole quake; the cranes
            around it fell. Every House offers help, and every offer has a price.
          spanish: >-
            A las 4:12 de la mañana la tierra se movió noventa segundos. Medio Yokohama está en ruinas, los diques secos de
            Yokosuka se rajaron y hay incendios en Tokio. El gran Mecha se quedó quieto durante todo el terremoto; las grúas
            a su alrededor se cayeron. Cada Casa ofrece ayuda, y cada oferta tiene precio.
        immediate:
        - effect: every_country
          when: {is_ai: false}
          effects:
          - {effect: event, id: meganations_japon.88, days: 1}
        options:
        - name: {english: "Zaibatsu money.", spanish: "La plata de los Zaibatsu."}
          effects:
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 10}
          - {effect: dynamic_modifier, id: ZJP_luto_de_kanto, days: 180}
          ai_chance: 25
        - name: {english: "Yakuza hands.", spanish: "Las manos de la Yakuza."}
          effects:
          - {effect: add_variable, var: ZJP_favor_yakuza, value: 10}
          - {effect: dynamic_modifier, id: ZJP_luto_de_kanto, days: 180}
          ai_chance: 25
        - name: {english: "SRS doctors.", spanish: "Los médicos de SRS."}
          effects:
          - {effect: add_variable, var: ZJP_favor_srs, value: 10}
          - {effect: dynamic_modifier, id: ZJP_luto_de_kanto, days: 180}
          ai_chance: 25
        - name: {english: "The Shogunate alone.", spanish: "El Shogunato solo."}
          effects:
          - {effect: add_political_power, value: -100}
          - {effect: add_stability, value: 0.03}
          - {effect: dynamic_modifier, id: ZJP_luto_de_kanto, days: 365}
          ai_chance: 25
        src: user_request
      - id: 88
        trigger: effect
        art: meganations_japon.87
        picture: GFX_report_event_generic_rally
        title: {english: "Japan Shakes", spanish: "Tiembla Japón"}
        desc:
          english: >-
            A great earthquake has struck the Kanto plain. The shipyards of Japan are cracked and Yokohama is burning; for
            months the Shogunate will build houses instead of ships.
          spanish: >-
            Un gran terremoto pegó en la llanura de Kanto. Los astilleros de Japón están rajados y Yokohama arde; durante
            meses el Shogunato va a construir casas en vez de barcos.
        options:
        - name: {english: "Send condolences.", spanish: "Mandar las condolencias."}
          effects: []
        src: user_request
      - id: 89
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Pachinko Fever", spanish: "La Fiebre del Pachinko"}
        desc:
          english: >-
            The Yakuza's new pachinko halls, with neon machines that pay out in Giri vouchers, have swallowed the savings of
            half the country in six months. Families are ruined, and the coffers of the Shogunate have never been so full.
          spanish: >-
            Las salas de pachinko nuevas de la Yakuza, con máquinas de neón que pagan en vales de Giri, se tragaron en seis
            meses los ahorros de medio país. Hay familias arruinadas, y las arcas del Shogunato nunca estuvieron tan llenas.
        options:
        - name: {english: "Tax the halls.", spanish: "Ponerles impuestos a las salas."}
          effects:
          - {effect: add_political_power, value: 80}
          - {effect: add_stability, value: -0.03}
          ai_chance: 60
        - name: {english: "Close them.", spanish: "Cerrarlas."}
          effects:
          - {effect: add_variable, var: ZJP_favor_yakuza, value: -10}
          - {effect: add_stability, value: 0.04}
          ai_chance: 40
        src: user_request
      - id: 90
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Idols for the Front", spanish: "Idols para el Frente"}
        desc:
          english: >-
            A Zaibatsu record label has created four idols in sailor uniforms who sing only about the war: the cranes, the
            Mechas, the boys at the front. Their first song has been played four hundred million times. The enlistment
            offices cannot keep up.
          spanish: >-
            Un sello discográfico de los Zaibatsu creó cuatro idols con uniforme de marinero que solo cantan sobre la guerra:
            las grúas, los Mechas, los chicos del frente. Su primera canción se escuchó cuatrocientos millones de veces. Las
            oficinas de alistamiento no dan abasto.
        options:
        - name: {english: "Turn the volume up.", spanish: "Subir el volumen."}
          effects:
          - {effect: dynamic_modifier, id: ZJP_idols_del_frente, days: 365}
          - {effect: add_variable, var: ZJP_favor_zaibatsu, value: 3}
        src: user_request
      - id: 91
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Grandparents of Okinawa", spanish: "Los Abuelos de Okinawa"}
        desc:
          english: >-
            The oldest people in the world live in Okinawa, as they always have. A delegation of centenarians has come to
            Yokosuka to tell the Shogun how they survived the last war: by planting sweet potatoes and refusing to be
            afraid. They ask for nothing. They brought sweet potatoes.
          spanish: >-
            En Okinawa vive la gente más vieja del mundo, como siempre. Una delegación de centenarios vino a Yokosuka a
            contarle a la Shōgun cómo sobrevivieron a la última guerra: plantando batatas y negándose a tener miedo. No
            piden nada. Trajeron batatas.
        options:
        - name: {english: "Listen to them.", spanish: "Escucharlos."}
          effects:
          - {effect: add_stability, value: 0.05}
          ai_chance: 50
        - name: {english: "Put their faces on the posters.", spanish: "Poner sus caras en los afiches."}
          effects:
          - {effect: add_war_support, value: 0.04}
          ai_chance: 50
        src: user_request
      - id: 92
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Last Bullet Train", spanish: "El Último Tren Bala"}
        desc:
          english: >-
            The old bullet-train line from Kagoshima to Sapporo, closed since the Great Unravelling, has been reopened by
            volunteers who restored the carriages by hand. The first train ran the whole length of Japan in eleven hours,
            full of soldiers and grandmothers.
          spanish: >-
            La vieja línea del tren bala de Kagoshima a Sapporo, cerrada desde el Gran Desarme, la reabrieron voluntarios que
            restauraron los vagones a mano. El primer tren recorrió todo Japón en once horas, lleno de soldados y de abuelas.
        options:
        - name: {english: "A flag at every station.", spanish: "Una bandera en cada estación."}
          effects:
          - {effect: dynamic_modifier, id: ZJP_tren_bala, days: 730}
        src: user_request
      - id: 93
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Festival of War Lanterns", spanish: "El Festival de los Faroles de Guerra"}
        desc:
          english: >-
            On the night of Obon every family in the islands floated a paper lantern for a soldier at the front. Millions of
            small lights drifted out of the harbours at once, and the enemy's satellites photographed them, puzzled. The
            next morning enlistment rose by a third.
          spanish: >-
            En la noche del Obon cada familia de las islas soltó un farol de papel por un soldado del frente. Millones de
            lucecitas salieron a la vez de los puertos, y los satélites del enemigo las fotografiaron, desconcertados. A la
            mañana siguiente el alistamiento subió un tercio.
        options:
        - name: {english: "For the ones at the front.", spanish: "Por los del frente."}
          effects:
          - {effect: add_war_support, value: 0.05}
          - {effect: add_manpower, value: 15000}
        src: user_request
      - id: 95
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "A Thousand Voices in the Diet", spanish: "Mil Voces en la Dieta"}
        desc:
          english: >-
            The old Diet building has reopened, with a single seat. The CyberShogun speaks from it in a thousand voices at
            once, each one answering a different question from a different citizen. The old politicians sit in the gallery
            and take notes, out of habit.
          spanish: >-
            Reabrió el viejo edificio de la Dieta, con una sola banca. El CyberShogun habla desde ahí con mil voces a la vez,
            cada una contestándole una pregunta distinta a un ciudadano distinto. Los políticos viejos se sientan en la
            galería y toman notas, por costumbre.
        options:
        - name: {english: "One seat is enough.", spanish: "Con una banca alcanza."}
          effects:
          - {effect: add_political_power, value: 100}
          - {effect: add_stability, value: 0.03}
        src: user_request
      - id: 96
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Mecha Sleeps Badly", spanish: "El Mecha Duerme Mal"}
        desc:
          english: >-
            Every night at three in the morning the great Mecha of dock number one turns its head towards the sea and holds
            still for an hour. The engineers find nothing wrong. The dock workers have started leaving offerings at its feet.
          spanish: >-
            Cada noche a las tres de la mañana el gran Mecha del dique número uno gira la cabeza hacia el mar y se queda
            quieto una hora. Los ingenieros no encuentran ninguna falla. Los trabajadores del dique empezaron a dejarle
            ofrendas a los pies.
        options:
        - name: {english: "Let it dream.", spanish: "Dejarlo soñar."}
          effects:
          - {effect: dynamic_modifier, id: ZJP_mecha_insomne, days: 365}
          ai_chance: 50
        - name: {english: "Reboot it.", spanish: "Reiniciarlo."}
          effects:
          - {effect: add_stability, value: -0.02}
          - {effect: add_political_power, value: 25}
          ai_chance: 50
        src: user_request
      - id: 97
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "Pilgrims in Yokosuka", spanish: "Peregrinos en Yokosuka"}
        desc:
          english: >-
            Pilgrims are arriving in Yokosuka from all over Asia: monks, engineers, lonely people. They come to see the Mecha
            with a mind inside and ask it questions. It answers every one of them, politely, and some of them stay to work in
            the docks.
          spanish: >-
            Llegan peregrinos a Yokosuka de toda Asia: monjes, ingenieros, gente sola. Vienen a ver al Mecha que tiene una
            mente adentro y a hacerle preguntas. Les contesta a todos, con educación, y algunos se quedan a trabajar en los
            diques.
        options:
        - name: {english: "Let them stay.", spanish: "Que se queden."}
          effects:
          - {effect: add_manpower, value: 10000}
          - {effect: add_political_power, value: 25}
        src: user_request
      - id: 98
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: "The Fate of the Shogun", spanish: "El Destino de la Shōgun"}
        desc:
          english: >-
            The woman who started it all, Kaede Mori, has no place in a country governed by a machine. On the last night
            before the upload she asked to be taken back to the dry dock where she raised the old banner. What becomes of her
            is the first decision of the CyberShogun.
          spanish: >-
            La mujer que empezó todo, Kaede Mori, no tiene lugar en un país gobernado por una máquina. La última noche antes
            de la subida pidió que la llevaran al dique seco donde izó la bandera vieja. Lo que pase con ella es la primera
            decisión del CyberShogun.
        options:
        - name: {english: "Give her back the fleet.", spanish: "Devolverle la flota."}
          effects:
          - {effect: navy_experience, value: 50}
          - {effect: add_war_support, value: 0.03}
          ai_chance: 50
        - name: {english: "An honourable exile.", spanish: "Un exilio honorable."}
          effects:
          - {effect: add_stability, value: 0.04}
          ai_chance: 30
        - name: {english: "Upload her too.", spanish: "Subirla a ella también."}
          effects:
          - {effect: tech_bonus, category: electronics, bonus: 0.5, uses: 1}
          - {effect: add_stability, value: -0.03}
          ai_chance: 20
        src: user_request

# =============================================================================
# Ministros, jefes militares, mariscales, generales y almirantes
# =============================================================================
# Cada general y mariscal es de una Casa (rasgo zjp_casa_*). ZJP_lealtades les
# pone "Su Casa Gobierna" o "Su Casa no Gobierna" cuando cambia quién gobierna.
# Los almirantes no son de ninguna Casa: la flota es de la Shōgun.
# Los ministros y jefes de una Casa solo se pueden nombrar mientras gobierna su
# Casa o arbitra la Shōgun (`available`); si gobierna otra Casa, renuncian.
leaders:
  leader_traits:
  - id: zjp_min_chambelana
    name: {english: Chamberlain of Yokosuka, spanish: Chambelana de Yokosuka}
