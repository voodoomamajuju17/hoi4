# =============================================================================
# Reglas de generación
# =============================================================================
generation_rules:
  - "Un archivo por país en common/countries/<Nombre>.txt con graphical_culture y color."
  - "common/country_tags/00_countries.txt lista TAG = \"countries/<archivo>.txt\"."
  - "Toda clave de nombre/adjetivo debe existir en EN y ES o el generador falla."
  - >
    graphical_culture: el campo `graphics` de cada país (southamerican,
    asian, african...) arma <graphics>_gfx y <graphics>_2d. Se valida contra
    los valores que usa algún país vanilla; uno inexistente cae a
    western_european con aviso. Ver Q013.
