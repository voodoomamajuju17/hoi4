# =============================================================================
# 02_countries.yaml — Países
# =============================================================================
# Colores: TODOS inventados. HOI4 no carga un país sin color y el doc no da
# ninguno. Cambialos sin culpa.
# 2026-09-29 ("que sean completamente distintos"): paleta de 29 colores con la
# máxima distancia perceptual (CIEDE2000, mínimo ~15 entre cualquier par y ~30
# entre vecinos), lejos del mar y del gris; cada potencia con el color de su
# identidad (EFE verde, ASC rojo, FCU azul, HSN petróleo, NAS oro, SHD jade,
# APF tierra, NRE púrpura imperial).
# =============================================================================

# Política de arranque de history/countries/. El doc no da popularidades ni
# calendario electoral para nadie: todo esto es INVENTADO para que el país
# arranque con su ideología en el poder. Se puede pisar por país con un bloque
# `politics` propio.
default_politics:
  src: invented
  why: "HOI4 necesita popularidades que sumen 100 y un partido gobernante."
  ruling_popularity: 70     # el resto se reparte parejo entre los otros 3 grupos
  last_election: "2096.1.1"
  election_frequency: 48
  elections_allowed: false
  research_slots: 3

