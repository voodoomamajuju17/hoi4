# =============================================================================
# 02_countries.yaml — Países
# =============================================================================
# Colores: TODOS inventados. HOI4 no carga un país sin color y el doc no da
# ninguno. Cambialos sin culpa.
# =============================================================================

# Política de arranque de history/countries/. El doc no da popularidades ni
# calendario electoral para nadie: todo esto es INVENTADO para que el país
# arranque con su ideología en el poder. Se puede pisar por país con un bloque
# `politics` propio.
default_politics:
  src: invented
  why: "HOI4 necesita popularidades que sumen 100 y un partido gobernante."
  ruling_popularity: 70     # el resto se reparte parejo entre los otros 3 grupos
  last_election: "2096.1.1"
  election_frequency: 48
  elections_allowed: false
  research_slots: 3

major_powers:

  # ---------------------------------------------------------------------------
  - tag: EFE
    tag_src: canon
    name:
      english: "Ecofascist Empire"
      spanish: "Imperio Ecofascista"
    name_src: canon              # inglés literal del doc
    name_spanish_src: inferred   # la traducción es mía
    adjective:
      english: "Ecofascist"
      spanish: "Ecofascista"
    adjective_src: inferred
    ideology: ecofascism
    ideology_group: fascism
    capital: "Buenos Aires"
    capital_src: canon
    capital_state_id: unknown    # ver AD003 / Q007
    color_rgb: [45, 84, 41]
    color_src: invented
    is_major: true
    coverage: high
    doc_section: "§3"
    note: "Facción con más lore recuperado. Vertical slice de Fase 3."

  # ---------------------------------------------------------------------------
