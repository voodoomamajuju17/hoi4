          - {effect: add_war_support, value: 0.02}
        src: user_design
      - id: 220
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The War of the Forest, spanish: La Guerra del Monte}
        desc:
          english: 'Anahí Quiroga took the palace, but the Dynasty did not accept it. The Green Guard is split in two: half follows the Voice of the
            Forest, half still swears by Aurelio IV. Whoever we stand with, the other half will fight.'
          spanish: 'Anahí Quiroga tomó el palacio, pero la Dinastía no lo aceptó. La Guardia Verde se partió en dos: la mitad sigue a la Voz del Monte,
            la otra mitad todavía jura por Aurelio IV. Estemos con quien estemos, la otra mitad va a pelear.'
        options:
        - name: {english: 'With the Forest: Anahí rules.', spanish: 'Con el Monte: gobierna Anahí.'}
          effects:
          - effect: civil_war
            tag: EFE
            ideology: fascism
            size: 0.35
            global_flag: EFE_guerra_civil
            rebels:
              cosmetic_tag: EFE_DINASTIA
              leader:
                name: {english: Emperor Aurelio IV, spanish: Emperador Aurelio IV}
                portrait: gfx/leaders/EFE/Aurelio_IV.dds
          - {effect: add_war_support, value: 0.1}
          ai_chance: 70
        - name: {english: 'With the Dynasty: Aurelio IV returns.', spanish: 'Con la Dinastía: vuelve Aurelio IV.'}
          effects:
          - {effect: promote, character: EFE_aurelio_iv}
          - {effect: swap_ideas, remove: EFE_mandato_del_monte, add: EFE_mandato_verde}
          - {effect: clear_flag, value: EFE_monte_levantado}
          - effect: civil_war
            tag: EFE
            ideology: fascism
            size: 0.35
            global_flag: EFE_guerra_civil
            rebels:
              cosmetic_tag: EFE_MONTE
