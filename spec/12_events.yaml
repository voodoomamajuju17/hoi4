    events:
    - id: 1
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: The Allocation of Africa, spanish: La Asignación de África}
      desc:
        english: 'The Automated Commune has sent the Congress a proposal written by no one: the Federation''s data, rare earths and power grid would
          be ''integrated into the continental plan''. The Congress has three days to answer. The proposal does not say what happens on the fourth.'
        spanish: 'La Comuna Automatizada le mandó al Congreso una propuesta que no escribió nadie: los datos, las tierras raras y la red eléctrica
          de la Federación serían ''integrados al plan continental''. El Congreso tiene tres días para contestar. La propuesta no dice qué pasa
          el cuarto.'
      options:
      - name:
          english: Accept. We cannot fight the machine yet.
          spanish: Aceptar. Todavía no podemos pelear contra la máquina.
        ai_chance: 20
        effects:
