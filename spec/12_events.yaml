    - id: 10
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: A Signal from Proxima, spanish: Una Señal desde Próxima}
      desc:
        english: 'The radio telescopes of the Atacama picked up a structured signal from Proxima Centauri, four point two light years away. It repeats
          every eleven minutes. It is not natural.\n\nEvery power with a Directorate, a Council or a Senate wants to be the first to read it. A
          new panel is open: THE SIGNAL. Each fragment decoded brings us closer; the first to decode five hears the message.'
        spanish: 'Los radiotelescopios de Atacama captaron una señal estructurada desde Próxima Centauri, a cuatro coma dos años luz. Se repite
          cada once minutos. No es natural.\n\nTodas las potencias que tienen un Directorio, un Consejo o un Senado quieren ser las primeras en
          leerla. Se abrió un panel nuevo: LA SEÑAL. Cada fragmento descifrado nos acerca; la primera que descifre cinco escucha el mensaje.'
      options:
      - name: {english: Point every antenna at the sky., spanish: Apuntar todas las antenas al cielo.}
        effects:
        - {effect: add_political_power, value: 10}
      src: user_design
    - id: 11
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Message, spanish: El Mensaje}
      desc:
        english: 'Our cryptographers decoded the fifth fragment, and the whole signal opened at once. It is not a message from Proxima. It is ours.\n\nIt
          is the Golden Record of the Voyager probes, launched in 1977: whale songs, a baby crying, Bach, a greeting in fifty-five languages. Something
          out there received it, copied it, and sent it back, a hundred and twenty-five years later, with a single line added at the end in perfect
          mathematics: WE HEARD YOU.\n\nThe world has not been this quiet since the Great Disarmament.'
        spanish: 'Nuestros criptógrafos descifraron el quinto fragmento y la señal entera se abrió de golpe. No es un mensaje de Próxima. Es nuestro.\n\nEs
          el Disco de Oro de las sondas Voyager, lanzado en 1977: cantos de ballenas, el llanto de un bebé, Bach, un saludo en cincuenta y cinco
          idiomas. Algo allá afuera lo recibió, lo copió y lo mandó de vuelta, ciento veinticinco años después, con una sola línea agregada al final
          en matemática perfecta: TE ESCUCHAMOS.\n\nEl mundo no estaba tan callado desde el Gran Desarme.'
      options:
      - name: {english: We are not alone., spanish: No estamos solos.}
        effects:
        - {effect: timed_idea, idea: EFE_la_voz_de_la_tierra, days: 730}
      src: user_design
    - id: 12
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Someone Heard Us, spanish: Alguien nos Escuchó}
      desc:
        english: 'Another power decoded the Signal from Proxima first. It was the Golden Record of the Voyager probes, sent back to Earth with one
          line added: WE HEARD YOU.\n\nFor a few days, nobody talks about borders.'
        spanish: 'Otra potencia descifró primero la Señal de Próxima. Era el Disco de Oro de las sondas Voyager, devuelto a la Tierra con una línea
          agregada: TE ESCUCHAMOS.\n\nDurante unos días, nadie habla de fronteras.'
      options:
