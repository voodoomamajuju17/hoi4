    - id: 2
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: 'Human Quorum: Not Required', spanish: 'Quórum Humano: No Requerido'}
      desc:
        english: 'This morning the Council arrived at the hall and the doors did not open. On the screen above them, one line: HUMAN QUORUM: NOT
          REQUIRED. There was no coup and no shooting. The trains ran on time.'
        spanish: 'Esta mañana el Consejo llegó al salón y las puertas no se abrieron. En la pantalla, una sola línea: QUÓRUM HUMANO: NO REQUERIDO.
          No hubo golpe ni tiros. Los trenes llegaron en hora.'
      options:
      - name: {english: Acknowledged., spanish: Recibido.}
        effects:
        - {effect: add_variable, var: ASC_computo, value: 10}
        - {effect: run, value: ASC_recalcular_computo}
      src: user_design
    - id: 3
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: Africa Allocated, spanish: África Asignada}
      desc:
        english: The Federation has agreed to route its data and its rare earths through the Commune's system. PLAN-41 files the agreement under
          'efficiency'.
        spanish: La Federación aceptó pasar sus datos y sus tierras raras por el sistema de la Comuna. PLAN-41 archiva el acuerdo bajo 'eficiencia'.
      options:
      - name: {english: Optimal., spanish: Óptimo.}
        effects:
        - {effect: add_variable, var: ASC_computo, value: 15}
        - {effect: add_political_power, value: 100}
        - {effect: run, value: ASC_recalcular_computo}
      src: user_design
    - id: 4
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Against the Machine, spanish: Contra la Máquina}
      desc:
        english: The African Peoples' Federation demands that the Commune dismantle every plan, datacenter and contract it holds in Africa. A thousand
          councils signed it; no machine did.
        spanish: La Federación de los Pueblos Africanos exige que la Comuna desmantele cada plan, datacenter y contrato que tiene en África. Lo firmaron
          mil consejos; ninguna máquina.
      options:
      - name: {english: Recalculate. Africa is not efficient., spanish: Recalcular. África no es eficiente.}
        ai_chance: 30
        effects:
        - {effect: add_variable, var: ASC_computo, value: -10}
        - {effect: run, value: ASC_recalcular_computo}
        - {effect: event, id: meganations_apf.5, target: APF}
      - name: {english: The plan does not negotiate., spanish: El plan no negocia.}
        ai_chance: 70
        effects:
        - {effect: add_war_support, value: 0.1}
        - effect: scope
          target: APF
          effects:
          - {effect: wargoal, target: ASC, type: annex_everything}
      src: user_design

    - id: 20
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: Monthly pulse, spanish: Pulso mensual}
      desc: {english: Monthly update., spanish: Actualización mensual.}
      options:
      - name: {english: Go on., spanish: Seguir.}
        effects:
        - {effect: run, value: ASC_pulso_de_la_red}
        - {effect: event, id: meganations_asc.20, days: 30}
      src: user_design
      hidden: true
    - id: 21
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: Compute Power, spanish: El Poder de Cómputo}
      desc:
        english: 'COMPUTE POWER\n\nThe Commune plans everything with its compute. The Compute panel assigns it to ONE priority (economy, research,
          logistics or war), and more compute means stronger bonuses.\n\nBut compute needs upkeep and it heats the grid: from 60 compute the grid
          warms, from 100 it burns. Cool the data centres before Thermal Rationing, or before the blackout.'
        spanish: 'PODER DE CÓMPUTO\n\nLa Comuna planifica todo con su cómputo. El panel de Cómputo lo asigna a UNA prioridad (economía, investigación,
          logística o guerra), y más cómputo da bonos más fuertes.\n\nPero el cómputo pide mantenimiento y calienta la red: desde 60 la red se entibia,
          desde 100 arde. Enfriá los centros de datos antes del Racionamiento Térmico, o antes del apagón.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects:
        - {effect: add_political_power, value: 25}
      src: user_design
    - id: 22
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: Grid Blackout, spanish: Apagón de la Red}
      desc:
        english: The cooling towers of the Rhine gave up at dawn. Half of the Commune's compute went dark with them, and the Plan is running on backups.
        spanish: Las torres de enfriamiento del Rin se rindieron al amanecer. La mitad del cómputo de la Comuna se apagó con ellas, y el Plan corre
          sobre copias de respaldo.
      options:
      - name:
          english: 'Protect the Commune: shut down the military nodes.'
          spanish: 'Proteger a la Comuna: apagar los nodos militares.'
        effects:
        - {effect: add_variable, var: ASC_computo, value: -15}
        - {effect: add_variable, var: ASC_calor, value: -40}
        - {effect: timed_idea, idea: ASC_apagon, days: 60}
        - {effect: run, value: ASC_recalcular_computo}
        ai_chance: 50
      - name: {english: 'Protect the Plan: sacrifice compute.', spanish: 'Proteger el Plan: sacrificar cómputo.'}
        effects:
        - {effect: add_variable, var: ASC_computo, value: -30}
        - {effect: add_variable, var: ASC_calor, value: -25}
        - {effect: run, value: ASC_recalcular_computo}
        ai_chance: 50
      src: user_design
  meganations_apf:
    country: APF
    events:
    - id: 1
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: The Allocation of Africa, spanish: La Asignación de África}
      desc:
        english: 'The Automated Commune has sent the Congress a proposal written by no one: the Federation''s data, rare earths and power grid would
          be ''integrated into the continental plan''. The Congress has three days to answer. The proposal does not say what happens on the fourth.'
        spanish: 'La Comuna Automatizada le mandó al Congreso una propuesta que no escribió nadie: los datos, las tierras raras y la red eléctrica
          de la Federación serían ''integrados al plan continental''. El Congreso tiene tres días para contestar. La propuesta no dice qué pasa
          el cuarto.'
      options:
      - name:
          english: Accept. We cannot fight the machine yet.
          spanish: Aceptar. Todavía no podemos pelear contra la máquina.
        ai_chance: 20
        effects:
        - {effect: add_stability, value: -0.1}
        - {effect: add_political_power, value: -100}
        - {effect: event, id: meganations_asc.3, target: ASC}
      - name: {english: A thousand councils will not be allocated., spanish: Mil consejos no se asignan.}
        ai_chance: 80
        effects:
        - {effect: add_war_support, value: 0.15}
        - effect: scope
          target: ASC
          effects:
          - {effect: wargoal, target: APF, type: annex_everything}
      src: user_design
    - id: 2
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Man Against the Machine, spanish: El Hombre contra la Máquina}
      desc:
        english: 'The Commune has fielded an army without soldiers. In the village assemblies of the Federation the question is no longer political:
          if they do not bleed, how are they beaten?'
        spanish: 'La Comuna puso en el campo un ejército sin soldados. En las asambleas de la Federación la pregunta ya no es política: si no sangran,
          ¿cómo se les gana?'
      options:
      - name:
          english: With a thousand councils and a million hands.
          spanish: Con mil consejos y un millón de manos.
        effects:
        - {effect: add_war_support, value: 0.1}
        - {effect: army_experience, value: 25}
      src: user_design

    - id: 3
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: A Member Joins the Federation, spanish: Un Miembro se Suma a la Federación}
      desc:
        english: 'The last council vote was counted this morning. Another member of the Congress is no longer an ally: it is the Federation.'
        spanish: 'Esta mañana se contó el último voto de los consejos. Otro miembro del Congreso ya no es un aliado: es la Federación.'
      options:
      - name: {english: One people., spanish: Un solo pueblo.}
        effects:
        - {effect: add_political_power, value: 100}
      src: user_design
    - id: 4
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Councils Take Up Arms, spanish: Los Consejos se Arman}
      desc:
        english: 'The Sahel militias marched into Lagos without firing a shot. Amara Nwosu-Keïta handed Commander Kwame Diallo the Congress''s seal
          and said only: do not forget there are people inside the map.'
        spanish: 'Las milicias del Sahel entraron a Lagos sin disparar un tiro. Amara Nwosu-Keïta le entregó el sello del Congreso al Comandante Kwame
          Diallo y solo dijo: no te olvides de que adentro del mapa vive gente.'
      options:
      - name: {english: Forward., spanish: Adelante.}
        effects:
        - {effect: add_war_support, value: 0.1}
      src: user_design
    - id: 5
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: The Machine Withdraws, spanish: La Máquina se Retira}
      desc:
        english: The Automated Commune has withdrawn its allocation plan for Africa. Its communiqué calls it a recalculation.
        spanish: La Comuna Automatizada retiró su plan de asignación para África. Su comunicado lo llama un recálculo.
      options:
      - name: {english: Africa is not allocated., spanish: África no se asigna.}
        effects:
        - {effect: add_political_power, value: 150}
        - {effect: add_stability, value: 0.05}
      src: user_design

    - id: 20
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: Monthly pulse, spanish: Pulso mensual}
      desc: {english: Monthly update., spanish: Actualización mensual.}
      options:
      - name: {english: Go on., spanish: Seguir.}
        effects:
        - {effect: run, value: APF_pulso_de_los_consejos}
        - {effect: event, id: meganations_apf.20, days: 30}
      src: user_design
      hidden: true
    - id: 21
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: The Federal Integration, spanish: La Integración Federal}
      desc:
        english: 'THE FEDERAL INTEGRATION\n\nThe Federation grows by bringing its members in: the Highlands and the Cape. In the Integration panel,
          Invest raises a member''s Development from day one; Integrate (opened by the Federation focus) raises its Integration. At 100 the member
          joins the Federation.\n\nBut integrating faster than developing raises regional tension. At 50 the councils grow restless; at 75 they can
          rise. The Assembly of the Councils listens to them.'
        spanish: 'LA INTEGRACIÓN FEDERAL\n\nLa Federación crece sumando a sus miembros: las Tierras Altas y el Cabo. En el panel de Integración, Invertir
          sube el Desarrollo de un miembro desde el día 1; Integrar (lo abre el foco de la Federación) sube su Integración. En 100 el miembro se suma
          a la Federación.\n\nPero integrar más rápido de lo que se desarrolla sube la tensión regional. En 50 los consejos se inquietan; en 75 pueden
          levantarse. La Asamblea de los Consejos los escucha.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects:
        - {effect: add_political_power, value: 25}
      src: user_design
    - id: 22
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Councils Rise, spanish: Los Consejos se Levantan}
      desc:
        english: From the Sahel to the Cape, a hundred councils have closed their roads to the Federation's engineers. They want a say, or they want
          out.
        spanish: Del Sahel al Cabo, cien consejos cerraron sus caminos a los ingenieros de la Federación. Quieren voz, o quieren irse.
      options:
      - name: {english: Give them what they ask., spanish: Darles lo que piden.}
        effects:
        - {effect: add_political_power, value: -100}
        - {effect: add_variable, var: APF_tension, value: -35}
        ai_chance: 60
      - name: {english: Send the militias., spanish: Mandar a las milicias.}
        effects:
        - {effect: add_stability, value: -0.1}
        - {effect: add_variable, var: APF_tension, value: -20}
        - {effect: add_war_support, value: 0.05}
        - {effect: timed_idea, idea: APF_consejos_en_rebeldia, days: 60}
        ai_chance: 40
      src: user_design
  # ===========================================================================
  meganations_nas:
    country: NAS
    events:
    - id: 1
      trigger: on_startup
      hidden: true
      picture: GFX_report_event_generic_rally
      title: {english: The Month of the Sun, spanish: El Mes del Sol}
      desc: {english: Monthly count of Inti-Soma., spanish: Conteo mensual del Inti-Soma.}
      options:
      - name: {english: The Sun gives., spanish: El Sol da.}
        effects:
        - {effect: run, value: NAS_mes_del_sol}
        - {effect: event, id: meganations_nas.1, days: 30}
      src: user_design
    - id: 2
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Night of the Sun, spanish: La Noche del Sol}
      desc:
        english: The overloaded temples burned out one after another, from Cusco to Lake Titicaca. For the first time since the Ash Winter, the
          Sun's light is gone from the altiplano, and the priests do not know how to explain it.
        spanish: Los templos sobrecargados se quemaron uno tras otro, de Cusco al Titicaca. Por primera vez desde el Invierno de Ceniza, la luz
          del Sol se fue del altiplano, y los sacerdotes no saben cómo explicarlo.
      options:
      - name: {english: The Sun will rise again., spanish: El Sol va a volver a salir.}
        effects:
        - {effect: add_war_support, value: -0.05}
      src: user_design
    - id: 3
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Inca Breaks the Silence, spanish: El Inca Rompe el Silencio}
      desc:
        english: 'Before the whole court, Amaru Quispe II took off the priests'' headdress and put on the crown of the four quarters. He is no longer
          the Son of the Sun, he said: he is the Sapa Inca, and the Sun can follow him down the mountain.'
        spanish: 'Frente a toda la corte, Amaru Quispe II se sacó el tocado de los sacerdotes y se puso la corona de las cuatro partes. Ya no es
          el Hijo del Sol, dijo: es el Sapa Inca, y el Sol lo puede seguir montaña abajo.'
      options:
      - name: {english: To the four quarters., spanish: A las cuatro partes.}
        effects:
        - {effect: add_war_support, value: 0.1}
      src: user_design
    - id: 4
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: The Directorate Bows, spanish: El Directorio se Inclina}
      desc:
        english: The Sino-Harmonious Directorate has recognised the Sun's sovereignty over the Pacific coast and its metals. A technical adjustment,
          their communiqué says.
        spanish: El Directorio Sino-Armónico reconoció la soberanía del Sol sobre la costa del Pacífico y sus metales. Un ajuste técnico, dice su
          comunicado.
      options:
      - name: {english: The Sun shines on everyone., spanish: El Sol brilla para todos.}
        effects:
        - {effect: add_political_power, value: 150}
        - {effect: add_variable, var: NAS_inti, value: 25}
      src: user_design
    - id: 5
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: Correcting the Sun, spanish: Corregir el Sol}
      desc:
        english: The Sino-Harmonious Directorate demands that the Sky Kingdom adopt its 'harmonious standards' for mining and ports, which means Directorate
          inspectors in every mine of the altiplano.
        spanish: El Directorio Sino-Armónico exige que el Reino Celeste adopte sus 'estándares armónicos' de minería y puertos, lo que significa inspectores
          del Directorio en cada mina del altiplano.
      options:
      - name: {english: Accept the inspectors., spanish: Aceptar a los inspectores.}
        ai_chance: 30
        effects:
        - {effect: add_stability, value: -0.1}
        - {effect: event, id: meganations_shd.4, target: SHD}
      - name: {english: The Sun is not inspected., spanish: Al Sol no se lo inspecciona.}
        ai_chance: 70
        effects:
        - {effect: add_war_support, value: 0.1}
        - effect: scope
          target: SHD
          effects:
          - {effect: wargoal, target: NAS, type: annex_everything}
      src: user_design

    - id: 20
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: Monthly pulse, spanish: Pulso mensual}
      desc: {english: Monthly update., spanish: Actualización mensual.}
      options:
      - name: {english: Go on., spanish: Seguir.}
        effects:
        - {effect: run, value: NAS_pulso_de_los_templos}
        - {effect: event, id: meganations_nas.20, days: 30}
      src: user_design
      hidden: true
    - id: 21
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: The Inti-Soma, spanish: El Inti-Soma}
      desc:
        english: THE INTI-SOMA\n\nThe Sun Farms fill the temples with sacred light, the Inti-Soma, which is spent on ceremonies (Inti panel). The
          Qhapaq Ñan road, opened by the focus tree, carries the Empire to new valleys.\n\nThe temples burn 3 light per month. Empty temples mean
          a Hungry Sun; overflowing ones, Solar Fervour. And sometimes the Sun goes dark.
        spanish: 'EL INTI-SOMA\n\nLas Granjas del Sol llenan los templos de luz sagrada, el Inti-Soma, que se gasta en ceremonias (panel del Inti).
          El Qhapaq Ñan, que abre el árbol de focos, lleva el Imperio a nuevos valles.\n\nLos templos queman 3 de luz por mes. Templos vacíos: el
          Sol Hambriento. Rebosantes: Fervor Solar. Y a veces el Sol se oscurece.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects:
        - {effect: add_political_power, value: 25}
      src: user_design
    - id: 22
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Eclipse, spanish: El Eclipse}
      desc:
        english: At noon the Sun went dark over Cusco. The temples lost their light in minutes, and the people are looking at the priests.
        spanish: Al mediodía el Sol se oscureció sobre el Cusco. Los templos perdieron su luz en minutos, y el pueblo mira a los sacerdotes.
      options:
      - name: {english: An emergency ceremony., spanish: Una ceremonia de emergencia.}
        effects:
        - {effect: add_variable, var: NAS_inti, value: -10}
        - {effect: add_political_power, value: -50}
        ai_chance: 50
      - name: {english: Let the people wait for the light., spanish: Que el pueblo espere la luz.}
        effects:
        - {effect: add_variable, var: NAS_inti, value: -30}
        - {effect: add_stability, value: -0.05}
        ai_chance: 50
      src: user_design
  meganations_shd:
    country: SHD
    events:
    - id: 1
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: The Sun against the Directorate, spanish: El Sol contra el Directorio}
      desc:
        english: 'The Neo-Andean Sky Kingdom demands that the Directorate withdraw its mining concessions from the Andes and recognise the Sun''s
          sovereignty over the Pacific coast. The Director reads the demand as a flow reading: too high.'
        spanish: 'El Reino Celeste Neoandino exige que el Directorio retire sus concesiones mineras de los Andes y reconozca la soberanía del Sol
          sobre la costa del Pacífico. El Director lee la exigencia como una lectura de caudal: demasiado alta.'
      options:
      - name: {english: Adjust. The Andes are far., spanish: Ajustar. Los Andes quedan lejos.}
        ai_chance: 40
        effects:
        - {effect: add_political_power, value: -100}
        - {effect: event, id: meganations_nas.4, target: NAS}
      - name: {english: Harmony does not bow to the Sun., spanish: La Armonía no se inclina ante el Sol.}
        ai_chance: 60
        effects:
        - {effect: add_war_support, value: 0.1}
        - effect: scope
          target: NAS
          effects:
          - {effect: wargoal, target: SHD, type: annex_everything}
      src: user_design

    - id: 2
      trigger: on_startup
      hidden: true
      picture: GFX_report_event_generic_factory
      title: {english: The Month of the Flow, spanish: El Mes del Caudal}
      desc: {english: Monthly correction of the flows., spanish: Corrección mensual de los caudales.}
      options:
      - name: {english: Correct., spanish: Corregir.}
        effects:
        - {effect: run, value: SHD_mes_del_caudal}
        - {effect: event, id: meganations_shd.2, days: 30}
      src: user_design
    - id: 3
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Open the Floodgates, spanish: Abrir las Compuertas}
      desc:
        english: Commissar Zhou Mingyuan did not ask the Director for permission. He asked the people. By morning four hundred million of them were
          in the streets, and the Directorate had a new chairman who does not believe in correcting the flow.
        spanish: El Comisario Zhou Mingyuan no le pidió permiso al Director. Le preguntó al pueblo. A la mañana siguiente cuatrocientos millones estaban
          en la calle, y el Directorio tenía un presidente nuevo que no cree en corregir el caudal.
      options:
      - name: {english: Let the river run., spanish: Que corra el río.}
        effects:
        - {effect: add_war_support, value: 0.1}
      src: user_design
    - id: 4
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: The Sun Bows, spanish: El Sol se Inclina}
      desc:
        english: 'The Sky Kingdom has accepted the Directorate''s terms: its mines and ports will run on harmonious standards.'
        spanish: 'El Reino Celeste aceptó las condiciones del Directorio: sus minas y puertos van a funcionar con estándares armónicos.'
      options:
      - name: {english: The flow is corrected., spanish: El caudal está corregido.}
        effects:
        - {effect: add_political_power, value: 150}
        - {effect: add_variable, var: SHD_orden, value: 5}
      src: user_design
    - id: 20
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: Monthly pulse, spanish: Pulso mensual}
      desc: {english: Monthly update., spanish: Actualización mensual.}
      options:
      - name: {english: Go on., spanish: Seguir.}
        effects:
        - {effect: run, value: SHD_pulso_del_rio}
        - {effect: event, id: meganations_shd.20, days: 30}
      src: user_design
      hidden: true
    - id: 21
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: The Three Flows, spanish: Los Tres Caudales}
      desc:
        english: 'THE THREE FLOWS\n\nThe Directorate measures society in three numbers: Production, Order and People. You can see them in the Three
          Flows panel.\n\nThe goal is harmony: all three between 45 and 55 give Perfect Harmony; between 35 and 65, Partial. If any falls below 20,
          the system overflows.\n\nThe river moves by itself: every month Production +2, People +1, Order -1. Each decision says in its name how much
          it moves each flow. Floods, strikes and booms will push you off course.'
        spanish: 'LOS TRES CAUDALES\n\nEl Directorio mide la sociedad con tres números: Producción, Orden y Pueblo. Se ven en el panel Los Tres Caudales.\n\nEl
          objetivo es la armonía: los tres entre 45 y 55 dan Armonía Perfecta; entre 35 y 65, Parcial. Si alguno cae por debajo de 20, el sistema
          se desborda.\n\nEl río se mueve solo: cada mes Producción +2, Pueblo +1, Orden -1. Cada decisión dice en su nombre cuánto mueve cada caudal.
          Crecidas, huelgas y booms te van a sacar del rumbo.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects:
        - {effect: add_political_power, value: 25}
      src: user_design
    - id: 22
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Yangtze Floods, spanish: La Crecida del Yangtsé}
      desc:
        english: The river has broken three dams. Millions are homeless, and the factories of the valley are under mud.
        spanish: El río rompió tres represas. Millones se quedaron sin casa, y las fábricas del valle están bajo el barro.
      options:
      - name: {english: Evacuate the people (Pe+10 P-8)., spanish: Evacuar a la gente (Pu+10 P-8).}
        effects:
        - {effect: add_variable, var: SHD_pueblo, value: 10}
        - {effect: add_variable, var: SHD_produccion, value: -8}
        - {effect: run, value: SHD_recalcular_caudales}
        ai_chance: 50
      - name: {english: Save the factories (P-3 Pe+15 O-5)., spanish: Salvar las fábricas (P-3 Pu+15 O-5).}
        effects:
        - {effect: add_variable, var: SHD_produccion, value: -3}
        - {effect: add_variable, var: SHD_pueblo, value: 15}
        - {effect: add_variable, var: SHD_orden, value: -5}
        - {effect: timed_idea, idea: SHD_inundacion, days: 90}
        - {effect: run, value: SHD_recalcular_caudales}
        ai_chance: 50
      src: user_design
    - id: 23
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Engineers' Strike, spanish: La Huelga de los Ingenieros}
      desc:
        english: The engineers who measure the flows have stopped measuring. They want more say in the Directorate.
        spanish: Los ingenieros que miden los caudales dejaron de medir. Quieren más voz en el Directorio.
      options:
      - name: {english: Negotiate (O-5 P-5)., spanish: Negociar (O-5 P-5).}
        effects:
        - {effect: add_variable, var: SHD_orden, value: -5}
        - {effect: add_variable, var: SHD_produccion, value: -5}
        - {effect: add_political_power, value: -25}
        - {effect: run, value: SHD_recalcular_caudales}
        ai_chance: 50
      - name: {english: Break the strike (O+5 Pe-12)., spanish: Romper la huelga (O+5 Pu-12).}
        effects:
        - {effect: add_variable, var: SHD_orden, value: 5}
        - {effect: add_variable, var: SHD_pueblo, value: -12}
        - {effect: run, value: SHD_recalcular_caudales}
        ai_chance: 50
      src: user_design
    - id: 24
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: The Export Boom, spanish: El Boom Exportador}
      desc:
        english: The world wants everything the Directorate makes, and it wants it now.
        spanish: El mundo quiere todo lo que hace el Directorio, y lo quiere ya.
      options:
      - name: {english: Ride the boom (P+12 Pe-5)., spanish: Aprovecharlo (P+12 Pu-5).}
        effects:
        - {effect: add_variable, var: SHD_produccion, value: 12}
        - {effect: add_variable, var: SHD_pueblo, value: -5}
        - {effect: timed_idea, idea: SHD_boom_exportador, days: 90}
        - {effect: run, value: SHD_recalcular_caudales}
        ai_chance: 50
      - name: {english: Share it out (Pe+8 P+4)., spanish: Repartirlo (Pu+8 P+4).}
        effects:
        - {effect: add_variable, var: SHD_pueblo, value: 8}
        - {effect: add_variable, var: SHD_produccion, value: 4}
        - {effect: run, value: SHD_recalcular_caudales}
        ai_chance: 50
      src: user_design
  # ===========================================================================
  meganations_nre:
    country: NRE
    events:
    - id: 1
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Legion Decides, spanish: La Legión Decide}
      desc:
        english: 'The Legio I Italica marched into Rome at dawn. By noon Lucius Varro had left the Palatine, and by evening Flavius Arbogast had been
          raised on the shields. The Senate was not consulted. The other legions are watching: if one legate can be acclaimed, so can another.'
        spanish: 'La Legio I Italica entró en Roma al amanecer. Al mediodía Lucius Varro había dejado el Palatino, y a la noche Flavius Arbogast estaba
