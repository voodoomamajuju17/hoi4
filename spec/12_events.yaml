        spanish: 'La Legio I Italica entró en Roma al amanecer. Al mediodía Lucius Varro había dejado el Palatino, y a la noche Flavius Arbogast estaba
          sobre los escudos. Al Senado no se le preguntó nada. Las otras legiones miran: si a un legado se lo puede aclamar, a otro también.'
      options:
      - name: {english: 'Ave, Arbogast!', spanish: '¡Ave, Arbogast!'}
