      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: How to Play, spanish: Cómo se Juega}
      desc:
        english: The Neo-Andean Sun Kingdom rules the Andes from temples full of solar light. The priests of Inti want the old Tawantinsuyu back;
          the jungle below is full of warlords, and the Green Empire watches.\n\nTHE INTI-SOMA\n\nThe Sun Farms fill the temples with sacred light,
          the Inti-Soma, which is spent on ceremonies (Inti panel). The Qhapaq Ñan road, opened by the focus tree, carries the Empire to new valleys.\n\nThe
          temples burn 3 light per month. Empty temples mean a Hungry Sun; overflowing ones, Solar Fervour. And sometimes the Sun goes dark.
        spanish: 'El Reino Neoandino del Sol gobierna los Andes desde templos llenos de luz solar. Los sacerdotes de Inti quieren recuperar el viejo
          Tawantinsuyu; la selva de abajo está llena de caudillos, y el Imperio Verde mira.\n\nEL INTI-SOMA\n\nLas Granjas del Sol llenan los templos
          de luz sagrada, el Inti-Soma, que se gasta en ceremonias (panel del Inti). El Qhapaq Ñan, que abre el árbol de focos, lleva el Imperio a
          nuevos valles.\n\nLos templos queman 3 de luz por mes. Templos vacíos: el Sol Hambriento. Rebosantes: Fervor Solar. Y a veces el Sol se
          oscurece.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects: []
      src: user_design
