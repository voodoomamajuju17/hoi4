        desc:
          english: The Sea Nation's insurers now set the price of every cargo that crosses the Pacific. The Directorate wants a seat on their board.
          spanish: Las aseguradoras de la Nación del Mar ya ponen el precio de cada carga que cruza el Pacífico. El Directorio quiere un asiento en
            su directorio.
