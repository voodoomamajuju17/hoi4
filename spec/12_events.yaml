    - id: 21
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: The Legions, spanish: Las Legiones}
      desc:
        english: 'THE LEGIONS\n\nThree named legions carry Rome: Legio I Italica, V Macedonica and XII Fulminata. Their prestige grows in war and
          with triumphs. Auctoritas Militaris is the currency of the officers: promotions, new legions, praetorians and donatives.\n\nA famous legion
          is a strong one, and a dangerous one. In peace the legions get bored and Auctoritas drains away; with little Auctoritas, a legion above
          70 can mutiny.'
        spanish: 'LAS LEGIONES\n\nTres legiones con nombre sostienen a Roma: la Legio I Italica, la V Macedonica y la XII Fulminata. Su prestigio
          crece en la guerra y con los triunfos. La Auctoritas Militaris es la moneda de los oficiales: ascensos, legiones nuevas, pretorianos y donativos.\n\nUna
          legión famosa es fuerte, y peligrosa. En paz las legiones se aburren y la Auctoritas se escurre; con poca Auctoritas, una legión por encima
          de 70 puede amotinarse.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects:
        - {effect: add_political_power, value: 25}
      src: user_design
    - id: 22
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Legion Mutinies, spanish: La Legión se Amotina}
      desc:
        english: Without a war and without pay, a famous legion has refused to leave its barracks. Its centurions have a list of demands and a list
          of names.
        spanish: Sin guerra y sin paga, una legión famosa se negó a salir de sus cuarteles. Sus centuriones tienen una lista de exigencias y una lista
          de nombres.
