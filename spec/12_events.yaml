    - id: 29
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: How to Play, spanish: Cómo se Juega}
      desc:
        english: 'The Sino-Harmonious Directorate is China run by engineers: production, order and the people are three rivers that must flow in balance.
          To the south, the warlords of Hindustan.\n\nTHE THREE FLOWS\n\nThe Directorate measures society in three numbers: Production, Order and
          People. You can see them in the Three Flows panel.\n\nThe goal is harmony: all three between 45 and 55 give Perfect Harmony; between 35
          and 65, Partial. If any falls below 20, the system overflows.\n\nThe river moves by itself: every month Production +2, People +1, Order
          -1. Each decision says in its name how much it moves each flow. Floods, strikes and booms will push you off course.'
        spanish: 'El Directorio Sino-Armónico es China gobernada por ingenieros: la producción, el orden y el pueblo son tres ríos que tienen que
          correr en equilibrio. Al sur, los señores del Indostán.\n\nLOS TRES CAUDALES\n\nEl Directorio mide la sociedad con tres números: Producción,
          Orden y Pueblo. Se ven en el panel Los Tres Caudales.\n\nEl objetivo es la armonía: los tres entre 45 y 55 dan Armonía Perfecta; entre 35
          y 65, Parcial. Si alguno cae por debajo de 20, el sistema se desborda.\n\nEl río se mueve solo: cada mes Producción +2, Pueblo +1, Orden
          -1. Cada decisión dice en su nombre cuánto mueve cada caudal. Crecidas, huelgas y booms te van a sacar del rumbo.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects: []
      src: user_design
