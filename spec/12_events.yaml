      - id: 34
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The Rubber of the Sanctuary, spanish: El Caucho del Santuario}
        desc:
          english: 'The Ecofascist Empire turned the heart of the Amazon into a ''sanctuary'' and guarantees it with its legions. The richest forest
            on Earth, locked away. Our strategists have a word for a treasure nobody may touch: a target.'
          spanish: 'El Imperio Ecofascista convirtió el corazón del Amazonas en un ''santuario'' y lo garantiza con sus legiones. La selva más rica
            de la Tierra, bajo llave. Nuestros estrategas tienen una palabra para un tesoro que nadie puede tocar: objetivo.'
        options:
