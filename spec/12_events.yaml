        english: 'THE WAR IN THE SHADOWS\n\nEvery power spies on every other. Their operations appear in the intelligence screen: the deeper their
          network in us, the worse the damage, up to open rebellion.\n\nEvery 3 months we choose up to 4 powers to guard against (decisions: Counter-intelligence).
