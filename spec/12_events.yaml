      - id: 29
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: How to Play, spanish: Cómo se Juega}
        desc:
          english: 'The Ecofascist Empire rules South America in the name of Gaia. Emperor Aurelio IV holds the court; in the forests, the rangers of
            Anahí Quiroga wait. Your enemies: the Union to the north, Rome across the sea, the Amazon warlords next door.\n\nTHE BIOSTEEL RACE\n\nThe
            vats of the Plain grow living metal: BioSteel. The tiers of the Race (5, 10 and 15) unlock the Empire''s best armour, and the decisions
            of the BioSteel Race panel grow it.\n\nBut the living metal eats: every month the saturation of the vats rises by half the BioSteel you
            have stored, and every harvest raises it more. It falls by 3 per month; at 40 the vats are forced, at 70 the Fever arrives and the Mycelium
            Blight can break out. And the living metal does not keep: from 13 it rots.\n\nGrow, spend, purge. In that order.'
          spanish: 'El Imperio Ecofascista gobierna Sudamérica en nombre de Gaia. El emperador Aurelio IV sostiene la corte; en los bosques esperan
            los guardaparques de Anahí Quiroga. Tus enemigos: la Unión al norte, Roma del otro lado del mar, los caudillos del Amazonas al lado.\n\nLA
            CARRERA DEL BIOACERO\n\nLas cubas de la Llanura cultivan metal vivo: el Bioacero. Los niveles de la Carrera (5, 10 y 15) abren el mejor
            blindaje del Imperio, y las decisiones del panel La Carrera del Bioacero lo hacen crecer.\n\nPero el metal vivo come: cada mes la saturación
            de las cubas sube la mitad del Bioacero que tengas guardado, y cada cosecha la sube más. Baja sola 3 por mes; en 40 las cubas se fuerzan,
            en 70 llega la Fiebre y puede estallar la Plaga del Micelio. Y el metal vivo no se guarda: desde 13 se pudre.\n\nCultivar, gastar, purgar.
            En ese orden.'
        options:
        - name: {english: Understood., spanish: Entendido.}
          effects: []
        src: user_design
