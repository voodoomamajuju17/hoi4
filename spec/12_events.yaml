      desc:
        english: The Lawless Lands signed the Frontier Pact, and the warlords of West Africa signed it too. From Dakar to the Upper Volta, the councils
          that should be part of the Federation obey men with rifles.\n\nThe Federal Council can justify a war to bring every occupied region of the
          West back into the Federation.
        spanish: Las Tierras Sin Ley firmaron el Pacto de la Frontera, y los caudillos del África occidental también. De Dakar al Alto Volta, los
          consejos que deberían ser parte de la Federación obedecen a hombres con fusiles.\n\nEl Consejo Federal puede justificar una guerra para
          devolver a la Federación cada región ocupada del Oeste.
