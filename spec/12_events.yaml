      desc:
        english: At noon the Sun went dark over Cusco. The temples lost their light in minutes, and the people are looking at the priests.
        spanish: Al mediodía el Sol se oscureció sobre el Cusco. Los templos perdieron su luz en minutos, y el pueblo mira a los sacerdotes.
      options:
      - name: {english: An emergency ceremony., spanish: Una ceremonia de emergencia.}
        effects:
        - {effect: add_variable, var: NAS_inti, value: -10}
        - {effect: add_political_power, value: -50}
        ai_chance: 50
      - name: {english: Let the people wait for the light., spanish: Que el pueblo espere la luz.}
        effects:
        - {effect: add_variable, var: NAS_inti, value: -30}
        - {effect: add_stability, value: -0.05}
        ai_chance: 50
      src: user_design
