# =============================================================================
# 12_events.yaml — Eventos
# =============================================================================
# El documento NO contiene eventos. Los de abajo son INVENTADOS sobre anclajes
# canon (biografía de Aurelio IV §3.3, prosa de régimen §3.2, BioSteel §3.4),
# igual que el árbol de focos. Todos los textos y efectos son src: invented.
#
# Disparadores:
#   on_startup        -> common/on_actions/, al empezar la partida
#   focus: <id>       -> el foco lo dispara en su completion_reward
#
# Efectos de las opciones: mismo formato que las recompensas de foco
# ({ effect, value }), validados contra documentation/ del juego.
# =============================================================================

# Imágenes compartidas (`art` en un evento): un solo dibujo para varios eventos casi iguales.
shared_art:
  meganations_armisticio: "Armistice signed in a field tent: two generals of rival megastates at a folding table with a map, each side keeps the ground it holds; tired soldiers outside."
  meganations_pide_armisticio: "An envoy under a white flag crosses a ruined front line to ask for terms; the winning army's officers watch from a command post."
  meganations_paz_humillante: "A defeated army withdraws from a border region while the enemy raises its flag over it; civilians watch in silence."

namespaces:
  meganations_efe:
    country: EFE
    events:

      - id: 1
        trigger: on_startup
        picture: GFX_report_event_generic_rally
        title:
          english: "Year Zero of the Mandate"
          spanish: "Año Cero del Mandato"
        desc:
          english: "The century turns and the Empire does not celebrate. In Buenos Aires the bells ring once, as the Custodian ordered: one ring for every forest still standing. The crowds in the plaza are silent, and silence is how obedience sounds. The Emperor looks south, to the vats, and north, to everything else."
          spanish: "El siglo cambia y el Imperio no lo festeja. En Buenos Aires las campanas suenan una sola vez, como ordenó el Custodio: una campanada por cada bosque que sigue en pie. La multitud en la plaza está en silencio, y el silencio es el sonido de la obediencia. El Emperador mira al sur, hacia las cubas, y al norte, hacia todo lo demás."
        options:
          - name:
              english: "The Earth first. Always."
              spanish: "Primero la Tierra. Siempre."
            effects:
              - { effect: add_political_power, value: 25 }
        src: invented

      - id: 2
        trigger: { focus: EFE_la_corte_de_los_bosques }
        picture: GFX_report_event_generic_rally
        title:
          english: "The Anniversary of the Crown"
          spanish: "El Aniversario de la Corona"
        desc:
          english: "Nineteen years ago the Custodian put on a crown woven from the first reforested oak. The Ministry of Ceremony asks how the anniversary should be marked: in the old austerity of the Militias, or with a spectacle that reminds the neighbours who rules the Southern Cone."
          spanish: "Hace diecinueve años el Custodio se puso una corona tejida con el primer roble reforestado. El Ministerio del Ceremonial pregunta cómo marcar el aniversario: con la vieja austeridad de las Milicias, o con un espectáculo que les recuerde a los vecinos quién manda en el Cono Sur."
        options:
          - name:
              english: "Austerity. The Earth does not need parades."
              spanish: "Austeridad. La Tierra no necesita desfiles."
            effects:
              - { effect: add_stability, value: 0.05 }
              - { effect: add_political_power, value: 50 }
          - name:
              english: "A parade the whole continent will hear."
              spanish: "Un desfile que se escuche en todo el continente."
            effects:
              - { effect: add_war_support, value: 0.10 }
              - { effect: add_political_power, value: -25 }
        src: invented

      - id: 3
        trigger: { focus: EFE_biosteel_umbral_3 }
        picture: GFX_report_event_generic_factory
        title:
          english: "The Living Armour"
          spanish: "La Armadura Viviente"
        desc:
          english: "The first plate grown entirely in the vats has been tested. It closed its own bullet holes in forty minutes. The engineers want it for the Green Guard's vehicles; the Ministry of Restoration wants it for the dams of the Paraná. There is not yet enough for both."
          spanish: "Se probó la primera placa cultivada por completo en las cubas. Cerró sus propios agujeros de bala en cuarenta minutos. Los ingenieros la quieren para los vehículos de la Guardia Verde; el Ministerio de Restauración, para las represas del Paraná. Todavía no alcanza para las dos cosas."
        options:
          - name:
              english: "To the Green Guard."
              spanish: "Para la Guardia Verde."
            effects:
              - { effect: army_experience, value: 25 }
          - name:
              english: "To the dams. The Earth first."
              spanish: "Para las represas. Primero la Tierra."
            effects:
              - { effect: add_stability, value: 0.05 }
              - { effect: add_political_power, value: 75 }
        src: invented

      - id: 4
        trigger: { focus: EFE_guardian_del_acuifero }
        picture: GFX_report_event_generic_rally
        title:
          english: "Castellane's Last Offer"
          spanish: "La Última Oferta de Castellane"
        desc:
          english: "Chairwoman Castellane's envoy arrives in Buenos Aires with a contract: ninety-nine years of rights to the Guaraní Aquifer, paid in desalination plants and hard currency. The Emperor reads it standing up. Then he hands it to Marshal Etchegaray, who reads it standing up too."
          spanish: "El enviado de la Presidenta Castellane llega a Buenos Aires con un contrato: noventa y nueve años de derechos sobre el Acuífero Guaraní, pagados en desalinizadoras y moneda fuerte. El Emperador lo lee de pie. Después se lo da al Mariscal Etchegaray, que también lo lee de pie."
        options:
          - name:
              english: "The Earth is not for sale."
              spanish: "La Tierra no se vende."
            effects:
              - { effect: add_war_support, value: 0.10 }
              - { effect: army_experience, value: 25 }
        src: invented

      # --- Reacciones del EFE a la FCU ("Las Ocho Potencias", 2026-09-23) ---
      - id: 5
        trigger: effect   # lo manda el foco FCU_adquisicion_del_sur
        picture: GFX_report_event_generic_factory
        title:
          english: "The Acquisition of the South"
          spanish: "La Adquisición del Sur"
        desc:
          english: "The Union's Board has sent Buenos Aires a formal acquisition offer: the water rights of the Guaraní Aquifer, the vats of the Pampa and a seat on the Board for the Emperor. The last paragraph is not an offer. It lists the divisions Meridian has moved to the Caribbean."
          spanish: "El Directorio de la Unión mandó a Buenos Aires una oferta formal de adquisición: los derechos del Acuífero Guaraní, las cubas de la Pampa y una silla en el Directorio para el Emperador. El último párrafo no es una oferta. Enumera las divisiones que Meridian movió al Caribe."
        options:
          - name:
              english: "Sell the water rights. Only the rights."
              spanish: "Vender los derechos del agua. Solo los derechos."
            ai_chance: 20
            effects:
              - { effect: add_stability, value: -0.10 }
              - { effect: add_political_power, value: -50 }
              - { effect: event, id: meganations_fcu.5, target: FCU }
          - name:
              english: "The water is not for sale."
              spanish: "El agua no se vende."
            ai_chance: 80
            effects:
              - { effect: add_war_support, value: 0.15 }
              # análisis 2026-10-01: el rechazo abre la rivalidad (planes de IA) y la guerra en las sombras
              - {effect: scope, target: FCU, effects: [{effect: flag, value: FCU_contra_EFE}, {effect: add_variable, var: MN_inf_EFE, value: 20}, {effect: clamp, var: MN_inf_EFE, min: 0, max: 100}]}
              - { effect: scope, target: FCU, effects: [ { effect: wargoal, target: EFE, type: annex_everything } ] }
        src: invented

      - id: 6
        trigger: effect   # lo manda el foco FCU_grifos_cerrados
        picture: GFX_report_event_generic_factory
        title:
          english: "The Northern Taps Close"
          spanish: "Se Cierran los Grifos del Norte"
        desc:
          english: "Castellane Water Trust has cut the desalinated water it sold to our northern provinces. The Empire has its own aquifer, but not where the cities are."
          spanish: "Castellane Water Trust cortó el agua desalinizada que les vendía a nuestras provincias del norte. El Imperio tiene su propio acuífero, pero no donde están las ciudades."
        options:
          - name:
              english: "Pay their price, this time."
              spanish: "Pagar su precio, esta vez."
            ai_chance: 40
            effects:
              - { effect: add_political_power, value: -75 }
          - name:
              english: "Ration and endure."
              spanish: "Racionar y aguantar."
            ai_chance: 60
            effects:
              - { effect: add_stability, value: -0.05 }
              - { effect: add_war_support, value: 0.05 }
        src: invented

      - id: 7
        trigger: { focus: EFE_los_incendios_de_gaia }
        picture: GFX_report_event_generic_rally
        title:
          english: "The Fires of Gaia"
          spanish: "Los Incendios de Gaia"
        desc:
          english: "The plantations north of Gaia burned for three nights. The court blames saboteurs; the rangers blame the vats. In the reserves, men and women in green uniforms are asking the same question: who does the forest obey?"
          spanish: "Las plantaciones al norte de Gaia ardieron tres noches. La corte culpa a saboteadores; los guardaparques culpan a las cubas. En las reservas, hombres y mujeres de uniforme verde se hacen la misma pregunta: ¿a quién obedece el monte?"
        options:
          - name:
              english: "The forest will answer."
              spanish: "El monte va a contestar."
            effects:
              - { effect: add_variable, var: EFE_control_del_monte, value: 10 }
        src: user_design

      - id: 8
        trigger: { focus: EFE_el_monte_se_levanta }
        picture: GFX_report_event_generic_rally
        title:
          english: "The Forest Rises"
          spanish: "El Monte se Levanta"
        desc:
          english: "The rangers came down from the Yungas at dawn. By noon the Guard had stopped taking orders from the palace. Aurelio IV is still Emperor in name, somewhere in a residence full of plants. Anahí Quiroga speaks for the forest now, and the forest has stopped negotiating."
          spanish: "Los guardaparques bajaron de las Yungas al amanecer. Al mediodía la Guardia ya no recibía órdenes del palacio. Aurelio IV sigue siendo Emperador de nombre, en alguna residencia llena de plantas. Ahora Anahí Quiroga habla por el monte, y el monte dejó de negociar."
        options:
          - name:
              english: "Let the cities empty."
              spanish: "Que se vacíen las ciudades."
            effects:
              - { effect: add_war_support, value: 0.10 }
        src: user_design

      - id: 9
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: "The Union Recognises the Water"
          spanish: "La Unión Reconoce el Agua"
        desc:
          english: "Castellane's Board has signed: the Guaraní Aquifer belongs to the Empire, and the Union will pay for every litre it takes. In Buenos Aires the bells ring once."
          spanish: "El Directorio de Castellane firmó: el Acuífero Guaraní es del Imperio, y la Unión va a pagar cada litro que se lleve. En Buenos Aires las campanas suenan una sola vez."
        options:
          - name:
              english: "The water was never for sale."
              spanish: "El agua nunca estuvo en venta."
            effects:
              - { effect: add_political_power, value: 150 }
              - { effect: add_stability, value: 0.05 }
        src: user_design

      - id: 10
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: "The Guaraní Missions Come Home"
          spanish: "Las Misiones Guaraníes Vuelven"
        desc:
          english: "Yvytu Ykua Guasu's council dissolved itself this morning. The dams of the Paraná fly the green flag."
          spanish: "El consejo de Yvytu Ykua Guasu se disolvió esta mañana. Las represas del Paraná izan la bandera verde."
        options:
          - name:
              english: "One Earth, one Empire."
              spanish: "Una Tierra, un Imperio."
            effects:
              - { effect: add_political_power, value: 50 }
        src: user_design

      - id: 11
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: "The South Is the Empire"
          spanish: "El Sur es el Imperio"
        desc:
          english: "The glacier garrisons lowered the Austral flag without a shot. From Tierra del Fuego to the Paraná, the Empire is one."
          spanish: "Las guarniciones de los glaciares arriaron la bandera austral sin un tiro. De Tierra del Fuego al Paraná, el Imperio es uno solo."
        options:
          - name:
              english: "The Custodian's map is complete."
              spanish: "El mapa del Custodio está completo."
            effects:
              - { effect: add_stability, value: 0.05 }
        src: user_design

      - id: 12
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: "The Rangers Are Ready"
          spanish: "Los Guardaparques Están Listos"
        desc:
          english: "Reports from the reserves say the same thing in different words: the Guard will not fire on the rangers. Whoever wants the forest to rise only has to ask."
          spanish: "Los informes de las reservas dicen lo mismo con distintas palabras: la Guardia no va a disparar contra los guardaparques. El que quiera que el monte se levante solo tiene que pedirlo."
        options:
          - name:
              english: "Noted."
              spanish: "Tomado nota."
            effects:
              - { effect: add_political_power, value: 25 }
        src: user_design

      - id: 13
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The Andes Come Down, spanish: Los Andes Bajan}
        desc:
          english: The Sapa Inca has claimed the Amazon for the Antisuyu. In Buenos Aires the court asks whether the Sun's roads will stop at the forest,
            or come through it.
          spanish: El Sapa Inca reclamó la Amazonia para el Antisuyu. En Buenos Aires la corte se pregunta si los caminos del Sol se van a detener en
            la selva, o la van a atravesar.
        options:
        - name: {english: Reinforce the northern border., spanish: Reforzar la frontera norte.}
          effects:
          - {effect: army_experience, value: 25}
        - name: {english: The forest will not be paved., spanish: La selva no se asfalta.}
          effects:
          - {effect: add_war_support, value: 0.05}
        src: user_design

      - id: 14
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: Rome against the Earth, spanish: Roma contra la Tierra}
        desc:
          english: 'The Neo Roman Empire demands that the Federal Ecological Empire recognise Rome''s primacy over the Atlantic and open its ports to
            Roman fleets. The Emperor of the Earth reads it twice: two Restorations, and only one can be right.'
          spanish: 'El Neo Imperio Romano exige que el Imperio Federal Ecológico reconozca la primacía de Roma sobre el Atlántico y le abra sus puertos
            a las flotas romanas. El Emperador de la Tierra lo lee dos veces: dos Restauraciones, y solo una puede tener razón.'
        options:
        - name: {english: Open the ports., spanish: Abrir los puertos.}
          ai_chance: 25
          effects:
          - {effect: add_political_power, value: -100}
          - {effect: add_stability, value: -0.05}
          - {effect: event, id: meganations_nre.7, target: NRE}
        - name: {english: The Earth answers to no eagle., spanish: La Tierra no le responde a ningún águila.}
          ai_chance: 75
          effects:
          - {effect: add_war_support, value: 0.1}
          # análisis 2026-10-01: el rechazo abre la rivalidad (planes de IA) y la guerra en las sombras
          - {effect: scope, target: NRE, effects: [{effect: flag, value: NRE_contra_EFE}, {effect: add_variable, var: MN_inf_EFE, value: 20}, {effect: clamp, var: MN_inf_EFE, min: 0, max: 100}]}
          - effect: scope
            target: NRE
            effects:
            - {effect: wargoal, target: EFE, type: annex_everything}
        src: user_design
      - id: 15
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: Hispania Is Rome, spanish: Hispania es Roma}
        desc:
          english: The Neo Roman Empire has turned Iberia into a province. In the ports of the Plate, people remember that Spain once crossed the ocean
            too.
          spanish: El Neo Imperio Romano convirtió a Iberia en provincia. En los puertos del Plata la gente recuerda que España también cruzó el océano
            una vez.
        options:
        - name: {english: Protest in every forum., spanish: Protestar en todos los foros.}
          ai_chance: 50
          effects:
          - {effect: add_war_support, value: 0.05}
          - {effect: add_political_power, value: 25}
        - name: {english: Europe is Europe's problem., spanish: Europa es problema de Europa.}
          ai_chance: 50
          effects:
          - {effect: add_stability, value: 0.02}
        src: user_design

      - id: 20
        trigger: on_startup
        picture: GFX_report_event_generic_rally
        title: {english: Monthly pulse, spanish: Pulso mensual}
        desc: {english: Monthly update., spanish: Actualización mensual.}
        options:
        - name: {english: Go on., spanish: Seguir.}
          effects:
          - {effect: run, value: EFE_pulso_de_las_cubas}
          - {effect: intelligence_agency}
          - {effect: run, value: EFE_sombras_mes}
          - {effect: event, id: meganations_efe.20, days: 30}
        src: user_design
        hidden: true
      - id: 21
        trigger: on_startup
        picture: GFX_report_event_generic_rally
        title: {english: The BioSteel Race, spanish: La Carrera del Bioacero}
        desc:
          english: 'THE BIOSTEEL RACE\n\nThe vats of the Plain grow living metal: BioSteel. The tiers of the Race (5, 10 and 15) unlock the Empire''s
            best armour, and the decisions of the BioSteel Race panel grow it.\n\nBut the living metal eats: every month the saturation of the vats
            rises by half the BioSteel you have stored, and every harvest raises it more. It falls by 3 per month; at 40 the vats are forced, at 70
            the Fever arrives and the Mycelium Blight can break out. And the living metal does not keep: from 13 it rots.\n\nGrow, spend, purge. In
            that order.'
          spanish: 'LA CARRERA DEL BIOACERO\n\nLas cubas de la Llanura cultivan metal vivo: el Bioacero. Los niveles de la Carrera (5, 10 y 15) abren
            el mejor blindaje del Imperio, y las decisiones del panel La Carrera del Bioacero lo hacen crecer.\n\nPero el metal vivo come: cada mes
            la saturación de las cubas sube la mitad del Bioacero que tengas guardado, y cada cosecha la sube más. Baja sola 3 por mes; en 40 las cubas
            se fuerzan, en 70 llega la Fiebre y puede estallar la Plaga del Micelio. Y el metal vivo no se guarda: desde 13 se pudre.\n\nCultivar, gastar,
            purgar. En ese orden.'
        options:
        - name: {english: Understood., spanish: Entendido.}
          effects:
          - {effect: add_political_power, value: 25}
        src: user_design
      - id: 22
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: The Mycelium Blight, spanish: La Plaga del Micelio}
        desc:
          english: Grey threads in the vats of the Plain. The living metal is being eaten from inside, and the blight is spreading hall by hall towards
            the forests.
          spanish: Hilos grises en las cubas de la Llanura. El metal vivo está siendo comido por dentro, y la plaga avanza nave por nave hacia los bosques.
        options:
        - name: {english: Burn the infected halls., spanish: Quemar las naves infectadas.}
          effects:
          - {effect: add_variable, var: EFE_biosteel, value: -4}
          - {effect: add_variable, var: EFE_saturacion, value: -35}
          ai_chance: 50
        - name: {english: Seal them and wait., spanish: Sellarlas y esperar.}
          effects:
          - {effect: add_political_power, value: -75}
          - {effect: add_variable, var: EFE_saturacion, value: -15}
          - {effect: timed_idea, idea: EFE_plaga_del_micelio, days: 90}
          ai_chance: 50
        src: user_design
      - id: 23
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: Compute for the Earth, spanish: Cómputo para la Tierra}
        desc:
          english: 'The Automated Commune offers the Empire its compute in exchange for water. Machines helping forests: the Custodian''s court is divided.'
          spanish: 'La Comuna Automatizada le ofrece al Imperio su cómputo a cambio de agua. Máquinas ayudando a bosques: la corte del Custodio está
            dividida.'
        options:
        - name: {english: Accept the machines., spanish: Aceptar a las máquinas.}
          effects:
          - {effect: tech_bonus, category: electronics, bonus: 0.5, uses: 1}
          - effect: scope
            target: ASC
            effects:
            - {effect: add_political_power, value: 75}
          ai_chance: 50
        - name: {english: The forest thinks for itself., spanish: El bosque piensa solo.}
          effects:
          - {effect: add_political_power, value: 25}
          - {effect: add_stability, value: 0.02}
          ai_chance: 50
        src: user_design
      - id: 30
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The Amazon Belongs to the Empire, spanish: El Amazonas es del Imperio}
        desc:
          english: 'Rio has fallen and the Amazon Caudillos are fleeing into the jungle. The largest forest on Earth is ours. The court argues: a sanctuary
            for Gaia, or the greatest vat the world has ever seen?'
          spanish: 'Río cayó y los Caudillos del Amazonas huyen hacia la selva. El bosque más grande de la Tierra es nuestro. La corte discute: ¿un
            santuario para Gaia, o la cuba más grande que vio el mundo?'
        options:
        - name:
            english: A Sanctuary for Gaia (a new neutral nation in the heart of the forest)
            spanish: Un Santuario para Gaia (una nación neutral nueva en el corazón de la selva)
          effects:
          - {effect: flag, value: EFE_conquista_proteger}
          - {effect: add_ideas, value: EFE_santuario_amazonico}
          - {effect: add_variable, var: EFE_saturacion, value: -20}
          - {effect: flag, value: EFE_santuario_pendiente}
          ai_chance: 50
        - name: {english: The Productive Jungle., spanish: La Selva Productiva.}
          effects:
          - {effect: flag, value: EFE_conquista_explotar}
          - {effect: add_ideas, value: EFE_selva_explotada}
          - {effect: add_variable, var: EFE_biosteel, value: 5}
          - {effect: add_variable, var: EFE_saturacion, value: 15}
          ai_chance: 50
        src: user_design
      - id: 31
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: The First Living Legion, spanish: La Primera Legión Viviente}
        desc:
          english: The first division of the Green Guard marches in armour grown, not forged. The crowd in Gaia goes silent when the armour breathes.
          spanish: La primera división de la Guardia Verde marcha con blindaje cultivado, no forjado. La multitud de Gaia se queda en silencio cuando
            el blindaje respira.
        options:
        - name: {english: To the front., spanish: Al frente.}
          effects:
          - {effect: army_experience, value: 50}
        - name: {english: To the parade., spanish: Al desfile.}
          effects:
          - {effect: add_political_power, value: 100}
          - {effect: add_stability, value: 0.03}
        src: user_design
      - id: 40
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: Unrest in Southern Patagonia, spanish: Descontento en Patagonia Austral}
        desc:
          english: Crowds in the streets of Southern Patagonia are burning our flags. The local government says it can no longer answer for order, and
            asks, politely, what we intend to do.
          spanish: En las calles de Patagonia Austral queman nuestras banderas. El gobierno local dice que ya no puede responder por el orden y pregunta,
            con mucha educación, qué pensamos hacer.
        options:
        - name: {english: 'Concessions: they will have their say.', spanish: 'Concesiones: van a tener voz.'}
          effects:
          - {effect: add_political_power, value: -75}
          - {effect: add_variable, var: EFE_lealtad_pta, value: 30}
          - {effect: run, value: EFE_recalcular_satelites}
          ai_chance: 60
        - name: {english: A firm hand., spanish: Mano dura.}
          effects:
          - {effect: add_variable, var: EFE_lealtad_pta, value: 15}
          - {effect: add_stability, value: -0.03}
          - effect: scope
            target: PTA
            effects:
            - {effect: add_stability, value: -0.1}
          - {effect: run, value: EFE_recalcular_satelites}
          ai_chance: 40
        src: user_design
