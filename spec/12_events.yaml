      - id: 29
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: How to Play, spanish: Cómo se Juega}
        desc:
          english: 'The Free Corporative Capital Union is North America run as a company: four corporations share the Directorate. Keep them balanced
            and the Union prospers; let one win and it may swallow the rest.\n\nTHE BOARD OF FOUR\n\nFour corporations own the Union: Castellane (water),
            Halvorsen-Ito (food), Meridian (arms) and Obsidian (finance). The contracts of the Board panel favour one and hurt the others.\n\nKeep all
            four between 40 and 60 and the Board works as one. Let one fall below 15 and they go to war with each other. And the strong get stronger
            on their own every month.\n\nEvery contract leaves a trail: scandal. Audits and public relations clean it; ignore it and the Leak will come.'
          spanish: 'La Unión Corporativa de Capital Libre es Norteamérica administrada como una empresa: cuatro corporaciones se reparten el Directorio.
            Mantenelas equilibradas y la Unión prospera; dejá ganar a una y se puede tragar al resto.\n\nEL DIRECTORIO DE LAS CUATRO\n\nCuatro corporaciones
            son dueñas de la Unión: Castellane (agua), Halvorsen-Ito (comida), Meridian (armas) y Obsidian (finanzas). Los contratos del panel del Directorio
            favorecen a una y perjudican a las otras.\n\nCon las cuatro entre 40 y 60 el Directorio funciona como uno. Si una cae por debajo de 15,
            entran en guerra entre ellas. Y cada mes el fuerte se hace más fuerte solo.\n\nCada contrato deja rastro: escándalo. Las auditorías y las
            relaciones públicas lo limpian; si lo ignorás, llega la Filtración.'
        options:
        - name: {english: Understood., spanish: Entendido.}
          effects: []
        src: user_design
      - id: 150
