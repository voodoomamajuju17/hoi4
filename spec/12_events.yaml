          veterans, pay for the living and statues for the dead. The senators look at Varro.'
        spanish: 'Una de las legiones se volvió demasiado famosa para la tranquilidad del Senado. Su legado manda una lista de exigencias a la Curia:
          tierras para los veteranos, paga para los vivos y estatuas para los muertos. Los senadores miran a Varro.'
