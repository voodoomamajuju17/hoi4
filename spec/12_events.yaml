        english: The Directorate offers its hydraulic engineers for our terraces and mines. They measure everything and explain nothing, but the
          water reaches the highest fields.
        spanish: El Directorio ofrece a sus ingenieros hidráulicos para nuestras terrazas y minas. Miden todo y no explican nada, pero el agua llega
          a los campos más altos.
      options:
      - name: {english: Welcome the engineers., spanish: Recibir a los ingenieros.}
        ai_chance: 80
        effects:
        - {effect: add_political_power, value: 50}
        - {effect: add_stability, value: 0.03}
        - {effect: add_variable, var: NAS_inti, value: 10}
        - {effect: event, id: meganations_shd.4, target: SHD}
