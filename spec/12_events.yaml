      picture: GFX_report_event_generic_rally
      title: {english: The Inti-Soma, spanish: El Inti-Soma}
      desc:
        english: THE INTI-SOMA\n\nThe Sun Farms fill the temples with sacred light, the Inti-Soma, which is spent on ceremonies (Inti panel). The
          Qhapaq Ñan road, opened by the focus tree, carries the Empire to new valleys.\n\nThe temples burn 3 light per month. Empty temples mean
          a Hungry Sun; overflowing ones, Solar Fervour. And sometimes the Sun goes dark.
        spanish: 'EL INTI-SOMA\n\nLas Granjas del Sol llenan los templos de luz sagrada, el Inti-Soma, que se gasta en ceremonias (panel del Inti).
          El Qhapaq Ñan, que abre el árbol de focos, lleva el Imperio a nuevos valles.\n\nLos templos queman 3 de luz por mes. Templos vacíos: el
          Sol Hambriento. Rebosantes: Fervor Solar. Y a veces el Sol se oscurece.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects:
        - {effect: add_political_power, value: 25}
      src: user_design
