# =============================================================================
# 12_events.yaml — Eventos
# =============================================================================
# El documento NO contiene eventos. Los de abajo son INVENTADOS sobre anclajes
# canon (biografía de Aurelio IV §3.3, prosa de régimen §3.2, BioSteel §3.4),
# igual que el árbol de focos. Todos los textos y efectos son src: invented.
#
# Disparadores:
#   on_startup        -> common/on_actions/, al empezar la partida
#   focus: <id>       -> el foco lo dispara en su completion_reward
#
# Efectos de las opciones: mismo formato que las recompensas de foco
# ({ effect, value }), validados contra documentation/ del juego.
# =============================================================================

namespaces:
  meganations_efe:
    country: EFE
    events:

      - id: 1
        trigger: on_startup
        picture: GFX_report_event_generic_rally
        title:
          english: "Year Zero of the Mandate"
          spanish: "Año Cero del Mandato"
        desc:
          english: "The century turns and the Empire does not celebrate. In Buenos Aires the bells ring once, as the Custodian ordered: one ring for every forest still standing. The crowds in the plaza are silent, and silence is how obedience sounds. The Emperor looks south, to the vats, and north, to everything else."
          spanish: "El siglo cambia y el Imperio no lo festeja. En Buenos Aires las campanas suenan una sola vez, como ordenó el Custodio: una campanada por cada bosque que sigue en pie. La multitud en la plaza está en silencio, y el silencio es el sonido de la obediencia. El Emperador mira al sur, hacia las cubas, y al norte, hacia todo lo demás."
        options:
          - name:
              english: "The Earth first. Always."
              spanish: "Primero la Tierra. Siempre."
            effects:
              - { effect: add_political_power, value: 25 }
        src: invented

      - id: 2
        trigger: { focus: EFE_la_corte_de_los_bosques }
        picture: GFX_report_event_generic_rally
        title:
          english: "The Anniversary of the Crown"
          spanish: "El Aniversario de la Corona"
        desc:
          english: "Nineteen years ago the Custodian put on a crown woven from the first reforested oak. The Ministry of Ceremony asks how the anniversary should be marked: in the old austerity of the Militias, or with a spectacle that reminds the neighbours who rules the Southern Cone."
          spanish: "Hace diecinueve años el Custodio se puso una corona tejida con el primer roble reforestado. El Ministerio del Ceremonial pregunta cómo marcar el aniversario: con la vieja austeridad de las Milicias, o con un espectáculo que les recuerde a los vecinos quién manda en el Cono Sur."
        options:
          - name:
              english: "Austerity. The Earth does not need parades."
              spanish: "Austeridad. La Tierra no necesita desfiles."
            effects:
              - { effect: add_stability, value: 0.05 }
              - { effect: add_political_power, value: 50 }
          - name:
              english: "A parade the whole continent will hear."
              spanish: "Un desfile que se escuche en todo el continente."
            effects:
              - { effect: add_war_support, value: 0.10 }
              - { effect: add_political_power, value: -25 }
        src: invented

      - id: 3
        trigger: { focus: EFE_biosteel_umbral_3 }
        picture: GFX_report_event_generic_factory
        title:
          english: "The Living Armour"
          spanish: "La Armadura Viviente"
        desc:
          english: "The first plate grown entirely in the vats has been tested. It closed its own bullet holes in forty minutes. The engineers want it for the Green Guard's vehicles; the Ministry of Restoration wants it for the dams of the Paraná. There is not yet enough for both."
          spanish: "Se probó la primera placa cultivada por completo en las cubas. Cerró sus propios agujeros de bala en cuarenta minutos. Los ingenieros la quieren para los vehículos de la Guardia Verde; el Ministerio de Restauración, para las represas del Paraná. Todavía no alcanza para las dos cosas."
        options:
          - name:
              english: "To the Green Guard."
              spanish: "Para la Guardia Verde."
            effects:
              - { effect: army_experience, value: 25 }
          - name:
              english: "To the dams. The Earth first."
              spanish: "Para las represas. Primero la Tierra."
            effects:
              - { effect: add_stability, value: 0.05 }
              - { effect: add_political_power, value: 75 }
        src: invented

      - id: 4
        trigger: { focus: EFE_guardian_del_acuifero }
        picture: GFX_report_event_generic_rally
        title:
          english: "Castellane's Last Offer"
          spanish: "La Última Oferta de Castellane"
        desc:
          english: "Chairwoman Castellane's envoy arrives in Buenos Aires with a contract: ninety-nine years of rights to the Guaraní Aquifer, paid in desalination plants and hard currency. The Emperor reads it standing up. Then he hands it to Marshal Etchegaray, who reads it standing up too."
          spanish: "El enviado de la Presidenta Castellane llega a Buenos Aires con un contrato: noventa y nueve años de derechos sobre el Acuífero Guaraní, pagados en desalinizadoras y moneda fuerte. El Emperador lo lee de pie. Después se lo da al Mariscal Etchegaray, que también lo lee de pie."
        options:
          - name:
              english: "The Earth is not for sale."
              spanish: "La Tierra no se vende."
            effects:
              - { effect: add_war_support, value: 0.10 }
              - { effect: army_experience, value: 25 }
        src: invented

      # --- Reacciones del EFE a la FCU ("Las Ocho Potencias", 2026-09-23) ---
      - id: 5
        trigger: effect   # lo manda el foco FCU_adquisicion_del_sur
        picture: GFX_report_event_generic_factory
        title:
          english: "The Acquisition of the South"
          spanish: "La Adquisición del Sur"
        desc:
          english: "The Union's Board has sent Buenos Aires a formal acquisition offer: the water rights of the Guaraní Aquifer, the vats of the Pampa and a seat on the Board for the Emperor. The last paragraph is not an offer. It lists the divisions Meridian has moved to the Caribbean."
          spanish: "El Directorio de la Unión mandó a Buenos Aires una oferta formal de adquisición: los derechos del Acuífero Guaraní, las cubas de la Pampa y una silla en el Directorio para el Emperador. El último párrafo no es una oferta. Enumera las divisiones que Meridian movió al Caribe."
        options:
          - name:
              english: "Sell the water rights. Only the rights."
              spanish: "Vender los derechos del agua. Solo los derechos."
            ai_chance: 20
            effects:
              - { effect: add_stability, value: -0.10 }
              - { effect: add_political_power, value: -50 }
              - { effect: event, id: meganations_fcu.5, target: FCU }
          - name:
              english: "The water is not for sale."
              spanish: "El agua no se vende."
            ai_chance: 80
            effects:
              - { effect: add_war_support, value: 0.15 }
              - { effect: scope, target: FCU, effects: [ { effect: wargoal, target: EFE, type: annex_everything } ] }
        src: invented

      - id: 6
        trigger: effect   # lo manda el foco FCU_grifos_cerrados
        picture: GFX_report_event_generic_factory
        title:
          english: "The Northern Taps Close"
          spanish: "Se Cierran los Grifos del Norte"
        desc:
          english: "Castellane Water Trust has cut the desalinated water it sold to our northern provinces. The Empire has its own aquifer, but not where the cities are."
          spanish: "Castellane Water Trust cortó el agua desalinizada que les vendía a nuestras provincias del norte. El Imperio tiene su propio acuífero, pero no donde están las ciudades."
        options:
          - name:
              english: "Pay their price, this time."
              spanish: "Pagar su precio, esta vez."
            ai_chance: 40
            effects:
              - { effect: add_political_power, value: -75 }
          - name:
              english: "Ration and endure."
              spanish: "Racionar y aguantar."
            ai_chance: 60
            effects:
              - { effect: add_stability, value: -0.05 }
              - { effect: add_war_support, value: 0.05 }
        src: invented

      - id: 7
        trigger: { focus: EFE_los_incendios_de_gaia }
        picture: GFX_report_event_generic_rally
        title:
          english: "The Fires of Gaia"
          spanish: "Los Incendios de Gaia"
        desc:
          english: "The plantations north of Gaia burned for three nights. The court blames saboteurs; the rangers blame the vats. In the reserves, men and women in green uniforms are asking the same question: who does the forest obey?"
          spanish: "Las plantaciones al norte de Gaia ardieron tres noches. La corte culpa a saboteadores; los guardaparques culpan a las cubas. En las reservas, hombres y mujeres de uniforme verde se hacen la misma pregunta: ¿a quién obedece el monte?"
        options:
          - name:
              english: "The forest will answer."
              spanish: "El monte va a contestar."
            effects:
              - { effect: add_variable, var: EFE_control_del_monte, value: 10 }
        src: user_design

      - id: 8
        trigger: { focus: EFE_el_monte_se_levanta }
        picture: GFX_report_event_generic_rally
        title:
          english: "The Forest Rises"
          spanish: "El Monte se Levanta"
        desc:
          english: "The rangers came down from the Yungas at dawn. By noon the Guard had stopped taking orders from the palace. Aurelio IV is still Emperor in name, somewhere in a residence full of plants. Anahí Quiroga speaks for the forest now, and the forest has stopped negotiating."
          spanish: "Los guardaparques bajaron de las Yungas al amanecer. Al mediodía la Guardia ya no recibía órdenes del palacio. Aurelio IV sigue siendo Emperador de nombre, en alguna residencia llena de plantas. Ahora Anahí Quiroga habla por el monte, y el monte dejó de negociar."
        options:
          - name:
              english: "Let the cities empty."
              spanish: "Que se vacíen las ciudades."
            effects:
              - { effect: add_war_support, value: 0.10 }
        src: user_design

      - id: 9
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: "The Union Recognises the Water"
          spanish: "La Unión Reconoce el Agua"
        desc:
          english: "Castellane's Board has signed: the Guaraní Aquifer belongs to the Empire, and the Union will pay for every litre it takes. In Buenos Aires the bells ring once."
          spanish: "El Directorio de Castellane firmó: el Acuífero Guaraní es del Imperio, y la Unión va a pagar cada litro que se lleve. En Buenos Aires las campanas suenan una sola vez."
        options:
          - name:
              english: "The water was never for sale."
              spanish: "El agua nunca estuvo en venta."
            effects:
              - { effect: add_political_power, value: 150 }
              - { effect: add_stability, value: 0.05 }
        src: user_design

      - id: 10
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: "The Guaraní Missions Come Home"
          spanish: "Las Misiones Guaraníes Vuelven"
        desc:
          english: "Yvytu Ykua Guasu's council dissolved itself this morning. The dams of the Paraná fly the green flag."
          spanish: "El consejo de Yvytu Ykua Guasu se disolvió esta mañana. Las represas del Paraná izan la bandera verde."
        options:
          - name:
              english: "One Earth, one Empire."
              spanish: "Una Tierra, un Imperio."
            effects:
              - { effect: add_political_power, value: 50 }
        src: user_design

      - id: 11
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: "The South Is the Empire"
          spanish: "El Sur es el Imperio"
        desc:
          english: "The glacier garrisons lowered the Austral flag without a shot. From Tierra del Fuego to the Paraná, the Empire is one."
          spanish: "Las guarniciones de los glaciares arriaron la bandera austral sin un tiro. De Tierra del Fuego al Paraná, el Imperio es uno solo."
        options:
          - name:
              english: "The Custodian's map is complete."
              spanish: "El mapa del Custodio está completo."
            effects:
              - { effect: add_stability, value: 0.05 }
        src: user_design

      - id: 12
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: "The Rangers Are Ready"
          spanish: "Los Guardaparques Están Listos"
        desc:
          english: "Reports from the reserves say the same thing in different words: the Guard will not fire on the rangers. Whoever wants the forest to rise only has to ask."
          spanish: "Los informes de las reservas dicen lo mismo con distintas palabras: la Guardia no va a disparar contra los guardaparques. El que quiera que el monte se levante solo tiene que pedirlo."
        options:
          - name:
              english: "Noted."
              spanish: "Tomado nota."
            effects:
              - { effect: add_political_power, value: 25 }
        src: user_design

  # ===========================================================================
  meganations_fcu:
    country: FCU
    events:

      - id: 1
        trigger: effect   # FCU_junta_de_emergencia
        picture: GFX_report_event_generic_factory
        title:
          english: "Quorum: Not Required"
          spanish: "Quórum: No Requerido"
        desc:
          english: "The emergency shareholders' meeting lasted eleven minutes. Meridian Kinetics voted its own shares, the shares it bought last night and the shares of two directors who did not show up. Marcus Rourke is Chief Executive of the Union. Nobody fired a shot; the lawyers did it all."
          spanish: "La junta de accionistas de emergencia duró once minutos. Meridian Kinetics votó sus propias acciones, las que compró anoche y las de dos directores que no se presentaron. Marcus Rourke es Director Ejecutivo de la Unión. Nadie disparó un tiro; lo hicieron todo los abogados."
        options:
          - name:
              english: "The Board is dissolved. Long live the company."
              spanish: "El Directorio queda disuelto. Viva la compañía."
            effects:
              - { effect: add_political_power, value: 50 }
        src: invented

      - id: 2
        trigger: effect   # FCU_recalcular_directorio, cuando Meridian domina
        picture: GFX_report_event_generic_factory
        title:
          english: "Meridian Smells Blood"
          spanish: "Meridian Huele Sangre"
        desc:
          english: "Meridian Kinetics holds more contracts than the rest of the Board together, and two of its rivals are close to bankruptcy. In the lobbies of the capital, a word nobody dared say out loud is now in every conversation: takeover."
          spanish: "Meridian Kinetics tiene más contratos que el resto del Directorio junto, y dos de sus rivales están al borde de la quiebra. En los pasillos de la capital, una palabra que nadie se animaba a decir en voz alta ahora está en todas las conversaciones: adquisición."
        options:
          - name:
              english: "Let the Board take note."
              spanish: "Que el Directorio tome nota."
            effects:
              - { effect: add_political_power, value: 25 }
        src: invented

      - id: 3
        trigger: effect   # se repite cada 90 días desde FCU_dividendo_de_guerra
        picture: GFX_report_event_generic_factory
        title:
          english: "Quarterly Report to the Shareholders"
          spanish: "Informe Trimestral a los Accionistas"
        desc:
          english: "Another quarter closes. The shareholders do not read the report; they read one line of it: are we at war?"
          spanish: "Cierra otro trimestre. Los accionistas no leen el informe; leen una sola línea: ¿estamos en guerra?"
        options:
          - name:
              english: "Publish the figures."
              spanish: "Publicar los números."
            effects:
              - effect: if
                when: { at_war: true }
                then:
                  - { effect: add_political_power, value: 50 }
                else:
                  - { effect: timed_idea, idea: FCU_caida_de_dividendos, days: 90 }
              - { effect: event, id: meganations_fcu.3, days: 90 }
        src: invented

      - id: 5
        trigger: effect   # respuesta del EFE a La Adquisición del Sur
        picture: GFX_report_event_generic_factory
        title:
          english: "The Empire Sells"
          spanish: "El Imperio Vende"
        desc:
          english: "Buenos Aires signed the water rights and nothing else. Castellane calls it a start. Meridian calls it a delay."
          spanish: "Buenos Aires firmó los derechos del agua y nada más. Castellane lo llama un comienzo. Meridian lo llama una demora."
        options:
          - name:
              english: "Water today, the rest tomorrow."
              spanish: "Hoy el agua, mañana lo demás."
            effects:
              - { effect: add_political_power, value: 150 }
              - { effect: add_variable, var: FCU_castellane, value: 10 }
              - { effect: run, value: FCU_recalcular_directorio }
        src: invented

      - id: 6
        trigger: effect   # respuesta de la HSN a Adquirir la Alta Mar
        picture: GFX_report_event_generic_factory
        title:
          english: "The High Seas Pay"
          spanish: "La Alta Mar Paga"
        desc:
          english: "The High Seas Market Nation has agreed to pay a 'security fee' on every cargo that crosses the Pacific. Meridian's shareholders applaud. Kofi Aldana's clearing house has started keeping a separate ledger."
          spanish: "La Nación de Mercado de Alta Mar aceptó pagar una 'tasa de seguridad' por cada carga que cruza el Pacífico. Los accionistas de Meridian aplauden. La cámara de compensación de Kofi Aldana empezó a llevar un libro aparte."
        options:
          - name:
              english: "An acquisition without a shot."
              spanish: "Una adquisición sin un tiro."
            effects:
              - { effect: add_political_power, value: 150 }
              - { effect: navy_experience, value: 25 }
        src: invented

      - id: 7
        trigger: effect   # ultimátum del foco EFE_el_agua_no_se_vende
        picture: GFX_report_event_generic_rally
        title:
          english: "The Water Is Not for Sale"
          spanish: "El Agua no se Vende"
        desc:
          english: "The Ecofascist Empire demands that the Union renounce every claim on the Guaraní Aquifer and pay for the water it has already taken. The note is signed by the Emperor and countersigned by Marshal Etchegaray."
          spanish: "El Imperio Ecofascista exige que la Unión renuncie a todo reclamo sobre el Acuífero Guaraní y pague el agua que ya se llevó. La nota la firma el Emperador y la refrenda el Mariscal Etchegaray."
        options:
          - name:
              english: "Recognise their water. Business is business."
              spanish: "Reconocer su agua. Los negocios son los negocios."
            ai_chance: 30
            effects:
              - { effect: add_political_power, value: -100 }
              - { effect: add_variable, var: FCU_castellane, value: -10 }
              - { effect: run, value: FCU_recalcular_directorio }
              - { effect: event, id: meganations_efe.9, target: EFE }
          - name:
              english: "The Union does not take orders from trees."
              spanish: "La Unión no recibe órdenes de los árboles."
            ai_chance: 70
            effects:
              - { effect: add_war_support, value: 0.10 }
              - { effect: scope, target: EFE, effects: [ { effect: wargoal, target: FCU, type: annex_everything } ] }
              - { effect: event, id: meganations_hsn.3, target: HSN }
        src: user_design

      - id: 8
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: The Legal Blockade, spanish: El Bloqueo Legal}
        desc:
          english: The High Seas clearing house has declared the Union's Pacific cargo 'uninsurable' until the Union pays the toll of the straits like
            everyone else. Without insurance, no ship leaves port.
          spanish: La cámara de compensación de la Alta Mar declaró 'inasegurable' la carga de la Unión en el Pacífico hasta que pague el peaje de los
            estrechos como todos. Sin seguro, ningún barco sale del puerto.
        options:
        - name: {english: Pay. Cheaper than a war., spanish: Pagar. Más barato que una guerra.}
          ai_chance: 40
          effects:
          - {effect: add_political_power, value: -100}
          - {effect: event, id: meganations_hsn.5, target: HSN}
        - name:
            english: Meridian will insure our ships. With guns.
            spanish: Meridian va a asegurar nuestros barcos. Con cañones.
          ai_chance: 60
          effects:
          - {effect: add_war_support, value: 0.1}
          - effect: scope
            target: HSN
            effects:
            - {effect: wargoal, target: FCU, type: annex_everything}
        src: user_design

  # ===========================================================================
  meganations_hsn:
    country: HSN
    events:

      - id: 1
        trigger: effect   # la FCU manda su ultimátum al EFE
        picture: GFX_report_event_generic_factory
        title:
          english: "Insuring the River Plate Conflict"
          spanish: "Asegurar el Conflicto del Plata"
        desc:
          english: "The Union has sent the Ecofascist Empire an ultimatum. Within the hour, the clearing house had priced the war: premiums on every cargo that crosses the South Atlantic, triple for anything flying a green flag."
          spanish: "La Unión le mandó un ultimátum al Imperio Ecofascista. En menos de una hora la cámara de compensación ya le había puesto precio a la guerra: primas sobre cada carga que cruza el Atlántico Sur, triple para todo lo que lleve bandera verde."
        options:
          - name:
              english: "Sell insurance to both sides."
              spanish: "Venderles seguros a los dos bandos."
            ai_chance: 70
            effects:
              - { effect: add_political_power, value: 75 }
          - name:
              english: "Stay out of the River Plate."
              spanish: "Mantenerse lejos del Plata."
            ai_chance: 30
            effects:
              - { effect: add_stability, value: 0.05 }
        src: invented

      - id: 2
        trigger: effect   # el foco FCU_adquirir_la_alta_mar
        picture: GFX_report_event_generic_factory
        title:
          english: "A Hostile Offer for the High Seas"
          spanish: "Una Oferta Hostil por la Alta Mar"
        desc:
          english: "Marcus Rourke has sent Kofi Aldana a letter on Meridian letterhead: a 'security fee' on every Pacific cargo, or Meridian will provide the security itself. With carriers."
          spanish: "Marcus Rourke le mandó a Kofi Aldana una carta con membrete de Meridian: una 'tasa de seguridad' por cada carga del Pacífico, o Meridian se va a encargar de la seguridad en persona. Con portaaviones."
        options:
          - name:
              english: "Pay. Ships are expensive; fees are not."
              spanish: "Pagar. Los barcos son caros; las tasas no."
            ai_chance: 30
            effects:
              - { effect: add_political_power, value: -100 }
              - { effect: add_stability, value: -0.05 }
              - { effect: event, id: meganations_fcu.6, target: FCU }
          - name:
              english: "The sea belongs to whoever sails it."
              spanish: "El mar es de quien lo navega."
            ai_chance: 70
            effects:
              - { effect: add_war_support, value: 0.15 }
              - { effect: scope, target: FCU, effects: [ { effect: wargoal, target: HSN, type: annex_everything } ] }
        src: invented

      - id: 3
        trigger: effect   # la FCU rechaza el ultimátum del EFE
        picture: GFX_report_event_generic_rally
        title:
          english: "Insuring the Water War"
          spanish: "Asegurar la Guerra del Agua"
        desc:
          english: "The Union has refused the Empire's ultimatum. The clearing house prices the war before the first shot: premiums on everything that sails between the Gulf and the River Plate."
          spanish: "La Unión rechazó el ultimátum del Imperio. La cámara de compensación le pone precio a la guerra antes del primer tiro: primas sobre todo lo que navega entre el Golfo y el Río de la Plata."
        options:
          - name:
              english: "Sell insurance to both sides."
              spanish: "Venderles seguros a los dos bandos."
            ai_chance: 70
            effects:
              - { effect: add_political_power, value: 75 }
          - name:
              english: "Stay out of it."
              spanish: "Mantenerse afuera."
            ai_chance: 30
            effects:
              - { effect: add_stability, value: 0.05 }
        src: user_design

      - id: 4
        trigger: on_startup
        hidden: true
        picture: GFX_report_event_generic_factory
        title: {english: Node Count, spanish: Conteo de Nodos}
        desc: {english: Monthly count of the node network., spanish: Conteo mensual de la red de nodos.}
        options:
        - name: {english: Update the ledgers., spanish: Actualizar los libros.}
          effects:
          - {effect: run, value: HSN_recalcular_nodos}
          - {effect: event, id: meganations_hsn.4, days: 30}
        src: user_design
      - id: 5
        trigger: effect
        picture: GFX_report_event_generic_factory
        title: {english: The Union Pays the Toll, spanish: La Unión Paga el Peaje}
        desc:
          english: 'The Union has accepted the High Seas'' terms: every Union cargo in the Pacific pays the clearing house. Kofi Aldana does not celebrate.
            He files the receipt.'
          spanish: 'La Unión aceptó las condiciones de la Alta Mar: cada carga de la Unión en el Pacífico le paga a la cámara de compensación. Kofi
            Aldana no festeja. Archiva el recibo.'
        options:
        - name: {english: Filed., spanish: Archivado.}
          effects:
