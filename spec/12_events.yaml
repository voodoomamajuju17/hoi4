      - id: 32
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: Gaia's Sanctuary, spanish: El Santuario de Gaia}
        desc:
          english: 'The heart of the forest is no longer ours, and it never will be again: it belongs to itself. The Custodians raised a green flag
            over the rivers. The Empire guarantees the Sanctuary for as long as there is an Empire.\n\nThe Union, the Andes, the Commune and the Antilles
            are already looking at the rubber.'
          spanish: 'El corazón de la selva ya no es nuestro, y no va a volver a serlo: es de sí mismo. Los Custodios izaron una bandera verde sobre
            los ríos. El Imperio garantiza el Santuario mientras exista el Imperio.\n\nLa Unión, los Andes, la Comuna y las Antillas ya están mirando
            el caucho.'
        options:
        - name: {english: 'For Gaia, forever.', spanish: 'Por Gaia, para siempre.'}
          effects:
          - {effect: guarantee, value: ZSG}
          - {effect: add_stability, value: 0.05}
          - {effect: opinion, target: ZSG, modifier: meganations_concesion}
          - {effect: event, id: meganations_efe.33, days: 1, target: ZSG}
          - effect: if
            when: {country_exists: FCU}
            then:
            - effect: scope
              target: FCU
              effects:
              - {effect: wargoal, target: ZSG, type: annex_everything}
            - {effect: event, id: meganations_efe.34, days: 2, target: FCU}
          - effect: if
            when: {country_exists: NAS}
            then:
            - effect: scope
              target: NAS
              effects:
              - {effect: wargoal, target: ZSG, type: annex_everything}
            - {effect: event, id: meganations_efe.34, days: 2, target: NAS}
          - effect: if
            when: {country_exists: ASC}
            then:
            - effect: scope
              target: ASC
              effects:
              - {effect: wargoal, target: ZSG, type: annex_everything}
            - {effect: event, id: meganations_efe.34, days: 2, target: ASC}
          - effect: if
            when: {country_exists: ZAF}
            then:
            - effect: scope
              target: ZAF
              effects:
              - {effect: wargoal, target: ZSG, type: annex_everything}
            - {effect: event, id: meganations_efe.34, days: 2, target: ZAF}
        src: user_design
      - id: 33
        trigger: effect
        picture: GFX_report_event_generic_rally
        title: {english: A Flag over the Rivers, spanish: Una Bandera sobre los Ríos}
        desc:
          english: 'We exist. Not as a province, not as a warlord''s fief: as a sanctuary. The Empire swore to defend us; the rest of the world swore
            nothing.'
          spanish: 'Existimos. No como provincia, no como feudo de un caudillo: como santuario. El Imperio juró defendernos; el resto del mundo no juró
