        picture: GFX_report_event_generic_rally
        title: {english: How to Play, spanish: Cómo se Juega}
        desc:
          english: 'The High Seas Nation is a trading republic of islands and straits in Asia and the Pacific. You live on the sea lanes: hold the nodes,
            keep the powers calm, and sell insurance to those who fight.\n\nTHE NODE NETWORK\n\nThe Nation lives on straits and ports: the nodes. Holding
            2, 4, 6 or all of them strengthens the Network, and every month the Network counts them.\n\nThe great powers are counting too. With 4 or
            more nodes their pressure rises every month; at 40 they watch us, at 70 they demand a strait. Port diplomacy keeps them calm, for a price.'
          spanish: 'La Nación de Alta Mar es una república comerciante de islas y estrechos en Asia y el Pacífico. Vivís de las rutas del mar: sostené
            los nodos, mantené tranquilas a las potencias y vendeles seguros a los que pelean.\n\nLA RED DE NODOS\n\nLa Nación vive de estrechos y puertos:
            los nodos. Tener 2, 4, 6 o todos refuerza la Red, y cada mes la Red los cuenta.\n\nLas grandes potencias también cuentan. Con 4 nodos o
            más su presión sube cada mes; en 40 nos vigilan, en 70 exigen un estrecho. La diplomacia de puertos las calma, por un precio.'
        options:
        - name: {english: Understood., spanish: Entendido.}
          effects: []
        src: user_design
