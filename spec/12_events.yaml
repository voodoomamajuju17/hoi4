    - id: 2
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Night of the Sun, spanish: La Noche del Sol}
      desc:
        english: The overloaded temples burned out one after another, from Cusco to Lake Titicaca. For the first time since the Ash Winter, the
          Sun's light is gone from the altiplano, and the priests do not know how to explain it.
        spanish: Los templos sobrecargados se quemaron uno tras otro, de Cusco al Titicaca. Por primera vez desde el Invierno de Ceniza, la luz
          del Sol se fue del altiplano, y los sacerdotes no saben cómo explicarlo.
      options:
      - name: {english: The Sun will rise again., spanish: El Sol va a volver a salir.}
        effects:
        - {effect: add_war_support, value: -0.05}
      src: user_design
    - id: 3
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Inca Breaks the Silence, spanish: El Inca Rompe el Silencio}
      desc:
        english: 'Before the whole court, Amaru Quispe II took off the priests'' headdress and put on the crown of the four quarters. He is no longer
          the Son of the Sun, he said: he is the Sapa Inca, and the Sun can follow him down the mountain.'
        spanish: 'Frente a toda la corte, Amaru Quispe II se sacó el tocado de los sacerdotes y se puso la corona de las cuatro partes. Ya no es
          el Hijo del Sol, dijo: es el Sapa Inca, y el Sol lo puede seguir montaña abajo.'
      options:
      - name: {english: To the four quarters., spanish: A las cuatro partes.}
        effects:
        - {effect: add_war_support, value: 0.1}
      src: user_design
    - id: 4
      trigger: effect
      picture: GFX_report_event_generic_factory
      title: {english: The Directorate Signs the Pact, spanish: El Directorio Firma el Pacto}
      desc:
        english: 'The Sino-Harmonious Directorate signed the Pact of the Mandate: non-aggression, mutual guarantee and lithium for engineers. The Sun
          and the Harmony, across the Pacific.'
        spanish: 'El Directorio Sino-Armónico firmó el Pacto del Mandato: no agresión, garantía mutua y litio por ingenieros. El Sol y la Armonía,
          de los dos lados del Pacífico.'
      options:
      - name: {english: The Sun shines on everyone., spanish: El Sol brilla para todos.}
        effects:
        - {effect: add_political_power, value: 100}
        - {effect: add_variable, var: NAS_inti, value: 15}
        - {effect: global_flag, value: MEGANATIONS_mandato_pacto}
        - {effect: run, value: MEGANATIONS_mandato_compartido}
      src: user_request
    - id: 5
