      title: {english: How to Play, spanish: Cómo se Juega}
      desc:
        english: 'The Neo-Roman Empire rules the Mediterranean with named legions. Glory is its currency: the legions want war, the Senate wants order.
          You are already at war with the desert Emirates.\n\nTHE LEGIONS\n\nThree named legions carry Rome: Legio I Italica, V Macedonica and XII
          Fulminata. Their prestige grows in war and with triumphs. Auctoritas Militaris is the currency of the officers: promotions, new legions,
          praetorians and donatives.\n\nA famous legion is a strong one, and a dangerous one. In peace the legions get bored and Auctoritas drains
          away; with little Auctoritas, a legion above 70 can mutiny.'
        spanish: 'El Imperio Neorromano gobierna el Mediterráneo con legiones con nombre. La gloria es su moneda: las legiones quieren guerra, el
          Senado quiere orden. Ya estás en guerra con los Emiratos del desierto.\n\nLAS LEGIONES\n\nTres legiones con nombre sostienen a Roma: la
          Legio I Italica, la V Macedonica y la XII Fulminata. Su prestigio crece en la guerra y con los triunfos. La Auctoritas Militaris es la moneda
          de los oficiales: ascensos, legiones nuevas, pretorianos y donativos.\n\nUna legión famosa es fuerte, y peligrosa. En paz las legiones se
          aburren y la Auctoritas se escurre; con poca Auctoritas, una legión por encima de 70 puede amotinarse.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects: []
