    - id: 2
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Man Against the Machine, spanish: El Hombre contra la Máquina}
      desc:
        english: 'The Commune has fielded an army without soldiers. In the village assemblies of the Federation the question is no longer political:
          if they do not bleed, how are they beaten?'
        spanish: 'La Comuna puso en el campo un ejército sin soldados. En las asambleas de la Federación la pregunta ya no es política: si no sangran,
          ¿cómo se les gana?'
      options:
      - name:
          english: With a thousand councils and a million hands.
          spanish: Con mil consejos y un millón de manos.
        effects:
        - {effect: add_war_support, value: 0.1}
        - {effect: army_experience, value: 25}
