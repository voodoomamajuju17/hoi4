      - name: {english: Bring them back by force., spanish: Recuperarlos por la fuerza.}
        effects:
        - {effect: declare_war, target: ZDA, type: annex_everything}
        ai_chance: 60
      src: user_design
    - id: 47
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Independence!, spanish: ¡Independencia!}
      desc:
        english: We are no longer a satellite of Neo Roman Empire. What comes next is ours to decide.
        spanish: Ya no somos un satélite de Neo Imperio Romano. Lo que venga lo decidimos nosotros.
      options:
      - name: {english: Free., spanish: Libres.}
        effects:
        - {effect: add_stability, value: 0.05}
        - {effect: add_war_support, value: 0.05}
      src: user_design
    - id: 220
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The War of the Legions, spanish: La Guerra de las Legiones}
      desc:
        english: The Legio I Italica acclaimed Arbogast, but the Senate and half the legions stayed with Varro. Two Imperators, one Rome. The standards
          are raised on both banks of the Tiber.
        spanish: La Legio I Italica aclamó a Arbogast, pero el Senado y la mitad de las legiones se quedaron con Varro. Dos Imperatores, una sola
          Roma. Los estandartes se levantan en las dos orillas del Tíber.
      options:
      - name: {english: 'Ave Arbogast: the legion decides.', spanish: 'Ave Arbogast: decide la legión.'}
        effects:
        - effect: civil_war
          tag: NRE
          ideology: fascism
          size: 0.35
          global_flag: NRE_guerra_civil
          rebels:
            cosmetic_tag: NRE_SENADO
            leader:
              name: {english: Imperator Lucius Varro, spanish: Imperator Lucius Varro}
              portrait: gfx/leaders/NRE/lucius_varro.dds
        - {effect: add_war_support, value: 0.1}
        ai_chance: 70
      - name:
          english: 'For the Senate: Varro is the legitimate Imperator.'
          spanish: 'Por el Senado: Varro es el Imperator legítimo.'
        effects:
        - {effect: promote, character: NRE_lucius_varro}
        - {effect: clear_flag, value: NRE_cuatro}
        - effect: civil_war
          tag: NRE
          ideology: fascism
          size: 0.35
          global_flag: NRE_guerra_civil
          rebels:
            cosmetic_tag: NRE_LEGIONES
            leader:
              name: {english: Legate Flavius Arbogast, spanish: Legado Flavius Arbogast}
              portrait: gfx/leaders/NRE/legado_arbogast.dds
        - {effect: add_war_support, value: 0.1}
        ai_chance: 30
      src: user_design
    - id: 221
      trigger:
        civil_war_end: {tag: NRE, flag: NRE_guerra_civil}
      picture: GFX_report_event_generic_rally
      title: {english: The Victor's Peace, spanish: La Paz del Vencedor}
      desc:
        english: One Imperator stands on the Capitol; the other is a name scratched off the inscriptions. Rome closes ranks around the victor.
        spanish: Un Imperator está en el Capitolio; el otro es un nombre raspado de las inscripciones. Roma cierra filas detrás del vencedor.
      options:
      - name: {english: The Victor's Peace., spanish: La Paz del Vencedor.}
        effects:
        - {effect: add_ideas, value: NRE_pax_victoris}
        - {effect: civil_war_restore, tag: NRE}
        - {effect: add_stability, value: 0.1}
        - {effect: add_political_power, value: 100}
      src: user_design
    - id: 230
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Eternal Roman Empire, spanish: El Imperio Romano Eterno}
      desc:
        english: Mare Nostrum is ours again, from the pillars of Hercules to the Nile.
        spanish: El Mare Nostrum vuelve a ser nuestro, de las columnas de Hércules al Nilo.
      options:
      - name: {english: A new era begins., spanish: Empieza una nueva era.}
        effects:
        - {effect: add_stability, value: 0.05}
        - {effect: add_war_support, value: 0.05}
      src: user_design
    - id: 231
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Eternal Roman Empire Is Proclaimed, spanish: Se Proclama El Imperio Romano Eterno}
      desc:
        english: 'A megastate has reached its final form: The Eternal Roman Empire. The balance of the world of 2100 will never be the same.'
        spanish: 'Una meganación alcanzó su forma final: El Imperio Romano Eterno. El equilibrio del mundo de 2100 ya no va a ser el mismo.'
      options:
      - name: {english: We are watching., spanish: Tomamos nota.}
        effects:
        - {effect: add_war_support, value: 0.03}
      src: user_design
  # ===========================================================================
  meganations_zwe:
    country: ZWE
    events:
    - id: 1
      trigger: on_startup
      hidden: true
      picture: GFX_report_event_generic_rally
      title: {english: The Warlords Recruit, spanish: Los Señores Reclutan}
      desc: {english: Monthly levy of the warlords., spanish: Leva mensual de los señores de la guerra.}
      options:
      - name: {english: March., spanish: Marchar.}
        effects:
        - {effect: run, value: ANARQUIA_levas}
        - {effect: run, value: ZWE_pulso_caudillos}
        - {effect: event, id: meganations_zwe.1, days: 30}
      src: user_decision
    - id: 2
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Raiders Ride Out, spanish: Salen los Saqueadores}
      desc:
        english: The warlords need loot to keep their men.
        spanish: Los señores de la guerra necesitan botín para mantener a sus hombres.
      options:
      - name: {english: Ride., spanish: Cabalgar.}
        effects:
        - {effect: add_manpower, value: 5000}
        - effect: random
          options:
          - weight: 1
            effects:
            - effect: if
              when: {country_exists: ASC}
              then:
              - {effect: event, id: meganations_zwe.3, days: 1, target: ASC}
          - weight: 1
            effects:
            - effect: if
              when: {country_exists: NRE}
              then:
              - {effect: event, id: meganations_zwe.3, days: 1, target: NRE}
      src: user_design
      hidden: true
    - id: 3
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Raid from the Eurasian Warlords, spanish: Saqueo de los Señores de la Guerra de Eurasia}
      desc:
        english: Warbands of the Eurasian Warlords crossed the border last night. Three villages burned, a depot emptied, and the raiders were gone
          before dawn.
        spanish: Bandas de los Señores de la Guerra de Eurasia cruzaron la frontera anoche. Tres pueblos quemados, un depósito vaciado, y los saqueadores
          se fueron antes del amanecer.
      options:
      - name: {english: Hunt them down to their lairs., spanish: Perseguirlos hasta sus guaridas.}
        effects:
        - {effect: army_experience, value: 10}
        - {effect: add_war_support, value: 0.02}
        - {effect: add_political_power, value: -25}
        ai_chance: 50
      - name: {english: Reinforce the border and move on., spanish: Reforzar la frontera y seguir.}
        effects:
        - {effect: add_stability, value: -0.02}
        ai_chance: 50
      src: user_design
    - id: 4
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: A Warlord Rises, spanish: Se Alza un Caudillo}
      desc:
        english: One warlord has beaten, bought or buried all the others. For the first time in a generation, the region answers to a single voice.
        spanish: Un caudillo les ganó, los compró o los enterró a todos los demás. Por primera vez en una generación, la región responde a una sola
          voz.
      options:
      - name: {english: Hail the Warlord!, spanish: ¡Viva el Caudillo!}
        effects:
        - {effect: add_ideas, value: ZWE_caudillo_supremo}
        - effect: if
          when: {country_exists: ASC}
          then:
          - {effect: event, id: meganations_zwe.5, days: 3, target: ASC}
        - effect: if
          when: {country_exists: NRE}
          then:
          - {effect: event, id: meganations_zwe.5, days: 3, target: NRE}
      src: user_design
    - id: 5
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: One Warlord to Rule Them, spanish: Un Solo Caudillo}
      desc:
        english: Our agents report that the Eurasian Warlords now obey a single warlord. The chaos next door was our advantage. It is ending.
        spanish: Nuestros agentes informan que los Señores de la Guerra de Eurasia ahora obedecen a un solo caudillo. El caos del vecino era nuestra
          ventaja. Se está terminando.
      options:
      - name: {english: We must act before it is too late., spanish: Hay que actuar antes de que sea tarde.}
        effects:
        - {effect: add_war_support, value: 0.03}
        ai_chance: 70
      - name: {english: Let them tire themselves out., spanish: Que se cansen solos.}
        effects:
        - {effect: add_political_power, value: 25}
        ai_chance: 30
      src: user_design
    - id: 6
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Warlords' Truce, spanish: La Tregua de los Caudillos}
      desc:
        english: With a foreign army on their land, the warlords stop killing each other. For a while.
        spanish: Con un ejército extranjero en su tierra, los señores de la guerra dejan de matarse entre ellos. Por un tiempo.
      options:
      - name: {english: 'For now, we are brothers.', spanish: 'Por ahora, somos hermanos.'}
        effects:
        - {effect: timed_idea, idea: ZWE_tregua_de_caudillos, days: 91}
      src: user_design
    - id: 10
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: The Great Capital Has Fallen, spanish: Cayó la Gran Capital}
      desc:
        english: Our bands ride through the streets of one of the old capitals of Europe. For the first time the warlords of the world look at Eurasia
          as something more than a rabble.
        spanish: Nuestras bandas cabalgan por las calles de una de las viejas capitales de Europa. Por primera vez los señores de la guerra del mundo
          miran a Eurasia como algo más que una chusma.
      options:
      - name:
          english: Call every warlord of the world to a Union.
          spanish: Convocar a todos los señores de la guerra del mundo a una Unión.
        effects:
        - {effect: create_faction, value: La Unión de los Señores de la Guerra}
        - effect: if
          when: {country_exists: ZWI}
          then:
          - {effect: event, id: meganations_zwe.11, days: 3, target: ZWI}
        - effect: if
          when: {country_exists: ZWM}
          then:
          - {effect: event, id: meganations_zwe.11, days: 3, target: ZWM}
        - effect: if
          when: {country_exists: ZWB}
          then:
          - {effect: event, id: meganations_zwe.11, days: 3, target: ZWB}
        - effect: if
          when: {country_exists: ZAN}
          then:
          - {effect: event, id: meganations_zwe.11, days: 3, target: ZAN}
        ai_chance: 90
      - name: {english: Eurasia needs no one., spanish: Eurasia no necesita a nadie.}
        effects:
        - {effect: add_war_support, value: 0.05}
        ai_chance: 10
      src: user_design
    - id: 11
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Eurasia Proposes a Union, spanish: Eurasia Propone una Unión}
      desc:
        english: 'The Atamans of Eurasia hold a great capital of Europe and call every warlord of the world to a Union: whoever touches one of us,
          touches all of us.'
        spanish: 'Los atamanes de Eurasia tienen una gran capital de Europa y llaman a todos los señores de la guerra del mundo a una Unión: quien
          toca a uno, nos toca a todos.'
      options:
      - name: {english: 'Yes: join the Union.', spanish: 'Sí: sumarse a la Unión.'}
        effects:
        - effect: scope
          target: ZWE
          effects:
          - {effect: add_to_faction, value: ROOT}
        - {effect: event, id: meganations_zwe.12, days: 1, target: ZWE}
        ai_chance: 70
      - name: {english: 'No: we answer to no one.', spanish: 'No: no respondemos ante nadie.'}
        effects:
        - {effect: event, id: meganations_zwe.13, days: 1, target: ZWE}
        ai_chance: 30
      src: user_design
    - id: 12
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: Another Warlord Joins, spanish: Otro Señor se Suma}
      desc:
        english: Another warlord has joined the Union. The great powers will have to fight all of us.
        spanish: Otro señor de la guerra se sumó a la Unión. Las grandes potencias van a tener que pelear contra todos nosotros.
      options:
      - name: {english: Brothers in arms., spanish: Hermanos de armas.}
        effects:
        - {effect: add_war_support, value: 0.03}
      src: user_design
    - id: 13
      trigger: effect
      picture: GFX_report_event_generic_rally
      title: {english: A Warlord Refuses, spanish: Un Señor se Niega}
      desc:
        english: One of the warlords refused the Union. Proud, or afraid.
        spanish: Uno de los señores rechazó la Unión. Por orgullo, o por miedo.
      options:
      - name: {english: His loss., spanish: Él se lo pierde.}
        effects: []
      src: user_design
