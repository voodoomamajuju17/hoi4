      - id: 21
        trigger: on_startup
        picture: GFX_report_event_generic_rally
        title: {english: The Board of Four, spanish: El Directorio de las Cuatro}
        desc:
          english: 'THE BOARD OF FOUR\n\nFour corporations own the Union: Castellane (water), Halvorsen-Ito (food), Meridian (arms) and Obsidian (finance).
            The contracts of the Board panel favour one and hurt the others.\n\nKeep all four between 40 and 60 and the Board works as one. Let one
            fall below 15 and they go to war with each other. And the strong get stronger on their own every month.\n\nEvery contract leaves a trail:
            scandal. Audits and public relations clean it; ignore it and the Leak will come.'
          spanish: 'EL DIRECTORIO DE LAS CUATRO\n\nCuatro corporaciones son dueñas de la Unión: Castellane (agua), Halvorsen-Ito (comida), Meridian
            (armas) y Obsidian (finanzas). Los contratos del panel del Directorio favorecen a una y perjudican a las otras.\n\nCon las cuatro entre
            40 y 60 el Directorio funciona como uno. Si una cae por debajo de 15, entran en guerra entre ellas. Y cada mes el fuerte se hace más fuerte
            solo.\n\nCada contrato deja rastro: escándalo. Las auditorías y las relaciones públicas lo limpian; si lo ignorás, llega la Filtración.'
        options:
        - name: {english: Understood., spanish: Entendido.}
          effects:
          - {effect: add_political_power, value: 25}
        src: user_design
