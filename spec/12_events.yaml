          work freely.\n\nThe guards have just expired. Choose again.'
        spanish: 'LA GUERRA EN LAS SOMBRAS\n\nTodas las potencias se espían entre sí. Sus operaciones están en la pantalla de inteligencia: cuanto
          más profunda su red en nosotros, peor el daño, hasta la rebelión abierta.\n\nCada 3 meses elegimos hasta 4 potencias de las que nos blindamos
          (decisiones: Contrainteligencia). Contra esas, su infiltración baja todos los meses, sus operaciones avanzan a la mitad y las descubrimos
          más seguido. Las demás trabajan libres.\n\nLos blindajes acaban de vencer. Hay que volver a elegir.'
