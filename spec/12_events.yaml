    - id: 21
      trigger: on_startup
      picture: GFX_report_event_generic_rally
      title: {english: Compute Power, spanish: El Poder de Cómputo}
      desc:
        english: 'COMPUTE POWER\n\nThe Commune plans everything with its compute. The Compute panel assigns it to ONE priority (economy, research,
          logistics or war), and more compute means stronger bonuses.\n\nBut compute needs upkeep and it heats the grid: from 60 compute the grid
          warms, from 100 it burns. Cool the data centres before Thermal Rationing, or before the blackout.'
        spanish: 'PODER DE CÓMPUTO\n\nLa Comuna planifica todo con su cómputo. El panel de Cómputo lo asigna a UNA prioridad (economía, investigación,
          logística o guerra), y más cómputo da bonos más fuertes.\n\nPero el cómputo pide mantenimiento y calienta la red: desde 60 la red se entibia,
          desde 100 arde. Enfriá los centros de datos antes del Racionamiento Térmico, o antes del apagón.'
      options:
      - name: {english: Understood., spanish: Entendido.}
        effects:
        - {effect: add_political_power, value: 25}
