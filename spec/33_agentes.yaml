# agencia (create_operative_leader con bypass_recruitment = no), solo con La
# Résistance. Se crean en el evento de arranque, después de la agencia.
# Retrato: assets/<TAG>/agentes/<id>.dds (156x210) -> sprite GFX_portrait_<id>.
# Rasgos: los de agente del juego base (operative_*).
