# --- Gran Bretaña y Japón (llegaron el 2026-11-04) ---------------------------
# No arrancan en 2100: se crean con el pulso mensual del país, cuando ya tiene
# agencia de inteligencia (la arma con la decisión del juego base). Cada grupo
# una sola vez. Pedido del usuario: "Para GB 3 Neovictorianos, 3 Transhumanos y
# 3 luditas. Para Japon 3 por mafia + 1 shogun q es el mejor espia de todo el
# juego": los británicos de un camino solo existen en ese camino (los luditas
# están desde el principio, como Ashworth, Kelly y Pritchard), y Mumei tiene
# cinco rasgos (los demás tienen uno o dos).
agentes_grupos:
  ZAL_luditas: {}
  ZAL_transhumanistas: {cuando: {variable_is: {var: ZAL_ruta, value: 1}}}
  ZAL_neovictorianos: {cuando: {variable_is: {var: ZAL_ruta, value: 2}}}
  ZJP: {}

extend_scripted_effects:
  ZAL_pulso:
  - {effect: run, value: MEGANATIONS_agentes_ZAL}
  ZJP_pulso:
  - {effect: run, value: MEGANATIONS_agentes_ZJP}

