# =============================================================================
# 33_agentes.yaml — agentes de inteligencia propios de cada potencia (2026-11-03)
# =============================================================================
# Pedido del usuario: "pedidos de arte para agentes de inteligencia/espías por
# cada facción, unos 5". Llegaron los 40 retratos (zip del 2026-11-03).
# Cada potencia arranca con sus 5 agentes en la lista de reclutables de su
# agencia (create_operative_leader con bypass_recruitment = no), solo con La
# Résistance. Se crean en el evento de arranque, después de la agencia.
# Retrato: assets/<TAG>/agentes/<id>.dds (156x210) -> sprite GFX_portrait_<id>.
# Rasgos: los de agente del juego base (operative_*).
# Gran Bretaña y Japón: pedidos hechos, faltan las imágenes.
# =============================================================================
