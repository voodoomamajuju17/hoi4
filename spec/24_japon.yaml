focus_trees:
  trees:
    ZJP:
      id: meganations_shogunato_focus
      default: false
      shared: true
      src: user_request
      branches:
      - id: ruta_zaibatsu
        name:
          english: The Zaibatsu Road
          spanish: Ruta Zaibatsu
        focuses:
        - id: ZJP_zai_1
          name:
            english: The Council of the Zaibatsu
            spanish: El Consejo de los Zaibatsu
          days: 70
          icon: GFX_goal_generic_construct_civ_factory
          desc:
            english: 'Four industrial families take the seats of the council and put every Japanese on a payroll. Factories +20%, but recruitable
              population -30%, stability -15% and political power -20%: employees do not go to war.'
            spanish: 'Cuatro familias industriales ocupan las sillas del consejo y ponen a cada japonés en una nómina. Fábricas +20%, pero población
              reclutable -30%, estabilidad -15% y poder político -20%: los empleados no van a la guerra.'
          reward:
          - effect: dynamic_modifier
            id: ZJP_zai_e1
          - effect: add_variable
            var: ZJP_giri
            value: 10
          - effect: add_political_power
            value: 100
          mutually_exclusive:
          - ZJP_yak_1
          - ZJP_srs_1
          ai:
            factor: 1
        - id: ZJP_zai_2
          name:
            english: The Megacorporations of Kanto
            spanish: Las Megacorporaciones de Kanto
          days: 70
          icon: GFX_goal_generic_industry
          desc:
            english: Glass towers with the family logos over every city. Factories +25% and shipyards +20%; stability -20% and war support -15%.
              Unlocks the Megacorp Contract.
            spanish: Torres de vidrio con los logos de las familias sobre cada ciudad. Fábricas +25% y astilleros +20%; estabilidad -20% y apoyo
              a la guerra -15%. Abre el Contrato con la Megacorporación.
          reward:
          - effect: remove_dynamic_modifier
            id: ZJP_zai_e1
          - effect: dynamic_modifier
            id: ZJP_zai_e2
          prerequisites:
          - ZJP_zai_1
        - id: ZJP_zai_3
          name:
            english: Shipyards on Three Shifts
            spanish: Astilleros a Tres Turnos
          days: 70
          icon: GFX_goal_generic_navy_doctrines_tactics
          desc:
            english: 'Yokosuka, Kure and Sasebo never sleep again. Shipyards +35%; stability -25% and fewer births: nobody has time for a family.'
            spanish: 'Yokosuka, Kure y Sasebo no vuelven a dormir. Astilleros +35%; estabilidad -25% y menos nacimientos: nadie tiene tiempo para
              una familia.'
          reward:
          - effect: remove_dynamic_modifier
            id: ZJP_zai_e2
          - effect: dynamic_modifier
            id: ZJP_zai_e3
          - effect: navy_experience
            value: 50
          prerequisites:
          - ZJP_zai_2
        - id: ZJP_zai_4
          name:
            english: Mechas in Series
            spanish: Mechas en Serie
          days: 70
          icon: GFX_goal_generic_build_tank
          desc:
            english: 'What was built by hand in secret is now stamped by the thousand. The company finally pays bonuses: the penalties almost
              disappear (stability -5%, recruitable population -10%) and efficiency grows 25% faster.'
            spanish: 'Lo que se hacía a mano y en secreto ahora se estampa de a miles. La empresa por fin paga bonos: los castigos casi desaparecen
              (estabilidad -5%, población reclutable -10%) y la eficiencia crece 25% más rápido.'
          reward:
          - effect: remove_dynamic_modifier
            id: ZJP_zai_e3
          - effect: dynamic_modifier
            id: ZJP_zai_e4
          - effect: army_experience
            value: 75
          - effect: add_variable
            var: ZJP_giri
            value: 10
          prerequisites:
          - ZJP_zai_3
        - id: ZJP_zai_5
          name:
