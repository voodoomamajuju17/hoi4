events:
  namespaces:
    meganations_japon:
      country: null
      events:
      - id: 1
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: Kanto Rises
          spanish: Kanto se Levanta
        desc:
          english: 'The Market is losing, and in Kanto they have noticed first. At dawn Admiral Kaede Mori refused to hand over the Yokosuka fleet,
            raised an old banner over the docks and declared that the shipyards of Japan answer to her now. The industrial families back her,
            the clans of the ports back her, and in Sendai a pharmaceutical company has offered her its laboratories. They call it the Shipyard
            Shogunate. The insurers ask the only question that matters: do we fight for Japan, or do we let it go?'
          spanish: 'El Mercado está perdiendo, y en Kanto se dieron cuenta primero. Al amanecer la almirante Kaede Mori se negó a entregar la
            flota de Yokosuka, izó una bandera vieja sobre los diques y declaró que los astilleros de Japón ahora le responden a ella. La apoyan
            las familias industriales, la apoyan los clanes de los puertos, y en Sendai una farmacéutica le ofreció sus laboratorios. Lo llaman
            el Shogunato de los Astilleros. Las aseguradoras hacen la única pregunta que importa: ¿peleamos por Japón, o lo dejamos ir?'
        options:
        - name:
            english: Japan is ours. Crush the Shogunate.
            spanish: Japón es nuestro. Aplastar al Shogunato.
          effects:
          - effect: run
            value: ZJP_nacimiento
          - effect: if
            when:
              country_exists: ZJP
            then:
            - &id016
              effect: scope
              target: ZJP
              effects:
              - effect: run
                value: ZJP_mecha_desbloqueo
              - effect: run
                value: MEGANATIONS_flota_pirata_ZJP
            - effect: scope
              target: ZJP
              effects:
              - effect: declare_war
                target: HSN
                type: annex_everything
            - effect: if
              when:
                all:
                - country_exists: SHD
                - country:
                    tag: SHD
                    when:
                      not:
                        war_with: HSN
              then:
              - effect: event
                id: meganations_japon.10
                days: 3
                target: SHD
            - effect: every_country
              when:
                is_ai: false
              effects:
              - effect: event
                id: meganations_japon.2
                days: 1
          ai_chance:
            base: 50
            modifiers:
            - factor: 2
              when:
                divisions_at_least: 60
        - name:
            english: Let Japan go. We cannot fight on two fronts.
            spanish: Dejar ir a Japón. No podemos pelear en dos frentes.
          effects:
          - effect: run
            value: ZJP_nacimiento
          - effect: if
            when:
              country_exists: ZJP
            then:
            - *id016
            - effect: relation
              value: ZJP
              type: non_aggression_pact
            - effect: add_stability
              value: 0.08
            - effect: every_country
              when:
                is_ai: false
              effects:
              - effect: event
                id: meganations_japon.3
                days: 1
          ai_chance:
            base: 30
            modifiers:
            - factor: 3
              when:
                not:
                  divisions_at_least: 25
        src: user_request
      - id: 2
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: War in the Shipyards
          spanish: Guerra en los Astilleros
        desc:
          english: The High Seas have refused to let Japan go, and the Shipyard Shogunate answers with Mechas and submarines. The busiest docks
            on Earth have become a front line.
          spanish: La Alta Mar se negó a dejar ir a Japón, y el Shogunato de los Astilleros contesta con Mechas y submarinos. Los diques más transitados
            de la Tierra se volvieron una línea de frente.
        options:
        - name:
            english: A civil war at sea.
            spanish: Una guerra civil en el mar.
          effects: []
        src: user_request
        art: meganations_japon.1
      - id: 3
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: The Shogunate Goes Free
          spanish: El Shogunato Queda Libre
        desc:
          english: The High Seas have let Japan go without a fight. The Shipyard Shogunate is born with a signature, a non-aggression pact and
            a fleet of submarines nobody knew existed.
          spanish: La Alta Mar dejó ir a Japón sin pelear. El Shogunato de los Astilleros nace con una firma, un pacto de no agresión y una flota
            de submarinos que nadie sabía que existía.
        options:
        - name:
            english: Japan is free again.
            spanish: Japón vuelve a ser libre.
          effects: []
        src: user_request
        art: meganations_japon.1
      - id: 10
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: The War in Japan
          spanish: La Guerra en Japón
        desc:
          english: 'Japan is burning: the Shipyard Shogunate has risen against the High Seas. Our rival is bleeding, and whoever helps the winner
            will have a debtor in the most valuable docks of the Pacific. The Council of the Directorate must choose: back the Shogunate, back
            the Market, or watch from the shore.'
          spanish: 'Japón arde: el Shogunato de los Astilleros se levantó contra la Alta Mar. Nuestro rival se desangra, y el que ayude al ganador
            va a tener un deudor en los diques más valiosos del Pacífico. El Consejo del Directorio tiene que elegir: apoyar al Shogunato, apoyar
            al Mercado, o mirar desde la orilla.'
        options:
        - name:
            english: Back the Shogunate.
            spanish: Apoyar al Shogunato.
          effects:
          - effect: flag
            value: SHD_apoya_shogunato
          - effect: dynamic_modifier
            id: MEGANATIONS_preparativos_guerra
            days: 120
          - effect: event
            id: meganations_japon.11
            days: 60
          ai_chance: 60
        - name:
            english: Back the High Seas.
            spanish: Apoyar a la Alta Mar.
          effects:
          - effect: flag
            value: SHD_apoya_hsn
          - effect: dynamic_modifier
            id: MEGANATIONS_preparativos_guerra
            days: 120
          - effect: event
            id: meganations_japon.11
            days: 60
          ai_chance: 10
        - name:
            english: Watch from the shore.
            spanish: Mirar desde la orilla.
          effects:
          - effect: add_political_power
            value: 50
          ai_chance: 30
        src: user_request
      - id: 11
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: The Justification Is Ready
          spanish: La Justificación Está Lista
        desc:
          english: 'Sixty days of preparations, and the yards of the Directorate have done their part. The diplomats have done theirs: the case
            for war is written, signed and ready.'
          spanish: 'Sesenta días de preparativos, y los astilleros del Directorio hicieron su parte. Los diplomáticos hicieron la suya: el motivo
            de la guerra está escrito, firmado y listo.'
        options:
        - name:
            english: To war.
            spanish: A la guerra.
          effects:
          - effect: if
            when:
              all:
              - flag: SHD_apoya_shogunato
              - country_exists: HSN
              - not:
                  war_with: HSN
            then:
            - effect: wargoal
              target: HSN
              type: annex_everything
          - effect: if
            when:
              all:
              - flag: SHD_apoya_hsn
              - country_exists: ZJP
              - not:
                  war_with: ZJP
            then:
            - effect: wargoal
              target: ZJP
              type: annex_everything
        src: user_request
        art: meganations_japon.10
      - id: 20
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: Giri of the Docks
          spanish: El Giri de los Diques
        desc:
          english: Monthly pulse.
          spanish: Pulso mensual.
        options:
        - name:
            english: OK
            spanish: OK
          effects:
          - effect: run
            value: ZJP_pulso
          - effect: run
            value: MEGANATIONS_unidades_unicas_ia
          - effect: event
            id: meganations_japon.20
            days: 30
        src: user_request
        no_art: true
        hidden: true
      - id: 30
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: The CyberShogun Awakens
          spanish: Despierta el CyberShogun
        desc:
          english: 'At midnight the lights of every port in Japan went out at once, and came back on in a single rhythm, like a heartbeat. In
            dry dock number one of Yokosuka, the greatest Mecha ever built opened its eyes. Inside there is no pilot: there is a mind, uploaded
            and multiplied, wired to every crane, every warship and every Mecha of the islands. [Root.GetLeader] speaks through it with a thousand
            voices. The Shipyard Shogunate is gone: [Root.GetName] has been born, and it does not sleep.'
          spanish: 'A la medianoche se apagaron a la vez las luces de todos los puertos de Japón, y volvieron a prenderse con un solo ritmo, como
            un latido. En el dique seco número uno de Yokosuka, el Mecha más grande jamás construido abrió los ojos. Adentro no hay piloto: hay
            una mente, subida y multiplicada, conectada a cada grúa, cada buque y cada Mecha de las islas. [Root.GetLeader] habla a través de
            él con mil voces. El Shogunato de los Astilleros ya no existe: nació [Root.GetName], y no duerme.'
        options:
        - name:
            english: The machine commands.
            spanish: La máquina manda.
          effects:
          - effect: every_country
            when:
              is_ai: false
            effects:
            - effect: event
              id: meganations_japon.31
              days: 1
        src: user_request
      - id: 31
        trigger: effect
        picture: GFX_report_event_generic_rally
        title:
          english: A Shogun in the Machine
          spanish: Un Shogun en la Máquina
        desc:
          english: 'Japan has a CyberShogun now: a single mind inside a Mecha the size of a tower, commanding every shipyard of the islands. Its
            envoys bow politely and never blink.'
          spanish: 'Japón tiene ahora un CyberShogun: una sola mente adentro de un Mecha del tamaño de una torre, al mando de cada astillero de
            las islas. Sus enviados saludan con una reverencia y nunca parpadean.'
        options:
        - name:
            english: Keep an eye on the Pacific.
            spanish: Vigilar el Pacífico.
          effects: []
        src: user_request
        art: meganations_japon.30
