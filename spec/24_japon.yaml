    - id: ZJP_contrato_megacorp
      name:
        english: Megacorp Contract (20 Giri)
        spanish: Contrato con la Megacorporación (20 de Giri)
      desc:
        english: The zaibatsu build two factories in exchange for a seat on the council.
        spanish: Los zaibatsu construyen dos fábricas a cambio de una silla en el consejo.
