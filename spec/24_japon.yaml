# =============================================================================
# El Shogunato de los Astilleros (2026-10-28). Generado por un script a partir del
# plan aprobado por el usuario; se puede editar a mano.
#
# Pedido: Japón se rebela contra la HSN cuando se dan DOS de estas tres: el enemigo
# ocupa una región de las islas, la HSN perdió Singapur, la HSN tiene menos de 65% de
# estabilidad. La HSN elige guerra sí / guerra no. Japón arranca fuerte (con
# submarinos). Si hay guerra, el SHD elige intervenir por el Shogunato, por la HSN o no
# intervenir (si no está ya en guerra con la HSN): +20% de astilleros por 120 días y a
# los 60 días la justificación lista. Árbol: tres caminos de 5 (Zaibatsu, Yakuza,
# Científicos SRS) y un final común, CyberShogun. Moneda propia: Giri. Unidad única:
# el Mecha (el tanque pesado, solo de Japón; 20_unique_units.yaml).
# =============================================================================
extend_scripted_effects:
  HSN_pulso_de_las_potencias:
  - effect: if
    when:
      all:
      - not:
          global_flag: MEGANATIONS_japon_rebelde
      - any:
        - controls_state: &id001
          - Kanto
        - controls_state: &id002
          - Kansai
          - Kinki
        - controls_state: &id003
          - San'yo
          - Chugoku
          - Chūgoku
        - controls_state: &id004
          - San'in
        - controls_state: &id005
          - Shikoku
        - controls_state: &id006
          - Kyushu
          - Kyūshū
        - controls_state: &id007
          - Tohoku
          - Tōhoku
        - controls_state: &id008
          - Hokkaido
          - Hokkaidō
        - controls_state: &id009
          - Okinawa
        - controls_state: &id010
          - Tokai
          - Tōkai
          - Chubu
          - Chūbu
        - controls_state: &id011
          - Hokuriku
      - any:
        - all:
          - &id012
            any:
            - all:
              - owns_state: *id001
              - not:
                  controls_state: *id001
            - all:
              - owns_state: *id002
              - not:
                  controls_state: *id002
            - all:
              - owns_state: *id003
              - not:
                  controls_state: *id003
            - all:
              - owns_state: *id004
              - not:
                  controls_state: *id004
            - all:
              - owns_state: *id005
              - not:
                  controls_state: *id005
            - all:
              - owns_state: *id006
              - not:
                  controls_state: *id006
            - all:
              - owns_state: *id007
              - not:
                  controls_state: *id007
            - all:
              - owns_state: *id008
              - not:
                  controls_state: *id008
            - all:
              - owns_state: *id009
              - not:
                  controls_state: *id009
            - all:
              - owns_state: *id010
              - not:
                  controls_state: *id010
            - all:
              - owns_state: *id011
              - not:
                  controls_state: *id011
          - &id013
            lost_state:
            - Singapore
            - Straits Settlements
        - all:
          - *id012
          - &id014
            stability_below: 0.65
        - all:
          - *id013
          - *id014
    then:
    - effect: global_flag
      value: MEGANATIONS_japon_rebelde
    - effect: event
      id: meganations_japon.1
      days: 1
decisions:
  categories:
  - id: ZJP_giri_category
    country: ZJP
    icon_prefer:
    - generic_political_actions
    name:
      english: The Giri of the Docks
      spanish: El Giri de los Diques
    desc:
      english: 'GIRI: [?ZJP_giri] / 100\n\nThe debt of honour that holds the Shogunate together. Every month the docks pay 3, and the chosen road
        pays 2 more (the Yakuza, 2 more at war). It buys ronin, Mechas, sabotage and the last step to the CyberShogun (50).\n80 or more: Blood
        Debts (the clans collect on their own). 0: The Docks Hesitate.'
      spanish: 'GIRI: [?ZJP_giri] / 100\n\nLa deuda de honor que sostiene al Shogunato. Cada mes los diques pagan 3, y el camino elegido paga
        2 más (la Yakuza, 2 más en guerra). Compra rōnin, Mechas, sabotajes y el último paso hacia el CyberShogun (50).\n80 o más: Deudas de Sangre
        (los clanes cobran por su cuenta). 0: Los Diques Dudan.'
    src: user_request
    decisions:
    - id: ZJP_contratar_ronin
      name:
        english: Hire Ronin (15 Giri)
        spanish: Contratar Rōnin (15 de Giri)
      desc:
        english: 'Masterless soldiers sell their swords to whoever pays the Giri: 2 divisions.'
        spanish: 'Soldados sin señor venden su espada a quien pague el Giri: 2 divisiones.'
      icon_prefer:
      - generic_army_support
      - generic_prepare_civil_war
      cost: 0
      cooldown_days: 120
      available:
        variable_at_least:
          var: ZJP_giri
          value: 15
      effects:
      - effect: add_variable
        var: ZJP_giri
        value: -15
      - effect: ensure_template
        name: Ronin
        regiments:
        - infantry
        - infantry
        - infantry
        - infantry
        - infantry
        - infantry
        - infantry
      - effect: create_units
        template: Ronin
        name: Ronin
        count: 2
        experience: 0.4
      ai:
        factor: 3
        modifiers:
        - factor: 0
          when:
            at_war: false
      src: user_request
    - id: ZJP_ceremonia_del_te
      name:
        english: Tea Ceremony with the Clans (10 Giri)
        spanish: Ceremonia del Té con los Clanes (10 de Giri)
      desc:
        english: 'Settle some debts over a cup of tea: +5% stability and 50 political power.'
        spanish: 'Saldar algunas deudas con una taza de té: +5% de estabilidad y 50 de poder político.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      cooldown_days: 90
      available:
        variable_at_least:
          var: ZJP_giri
          value: 10
      effects:
      - effect: add_variable
        var: ZJP_giri
        value: -10
      - effect: add_stability
        value: 0.05
      - effect: add_political_power
        value: 50
      ai:
        factor: 2
        modifiers:
        - factor: 3
          when:
            stability_below: 0.5
        - factor: 3
          when:
            variable_at_least:
              var: ZJP_giri
              value: 70
      src: user_request
    - id: ZJP_linea_de_mechas
      name:
        english: The Mecha Line (20 Giri)
        spanish: La Línea de Mechas (20 de Giri)
      desc:
        english: 120 days of factories working only for the Mechas.
        spanish: 120 días de fábricas trabajando solo para los Mechas.
      icon_prefer:
      - generic_industry
      - generic_construction
      cost: 0
      cooldown_days: 150
      available:
        variable_at_least:
          var: ZJP_giri
          value: 20
      effects:
      - effect: add_variable
        var: ZJP_giri
        value: -20
      - effect: dynamic_modifier
        id: ZJP_linea_mechas
        days: 120
      ai:
        factor: 3
      src: user_request
    - id: ZJP_sabotear_singapur
      name:
        english: Sabotage Singapore's Yards (25 Giri)
        spanish: Sabotear los Astilleros de Singapur (25 de Giri)
      desc:
        english: 'Sand in the cranes, fire in the warehouses: the High Seas build 20% fewer ships for 120 days.'
        spanish: 'Arena en las grúas, fuego en los depósitos: la Alta Mar construye 20% menos barcos durante 120 días.'
      icon_prefer:
      - generic_political_actions
      cost: 0
      cooldown_days: 150
      available:
