    - id: ZJP_experimento_prohibido
      name:
        english: The Forbidden Experiment (30 Giri)
        spanish: El Experimento Prohibido (30 de Giri)
      desc:
        english: Most of the time it works (research +20% for 180 days). Sometimes it does not (stability -10% and 20,000 dead).
        spanish: La mayoría de las veces funciona (investigación +20% por 180 días). A veces no (estabilidad -10% y 20.000 muertos).
      icon_prefer:
      - generic_research
      cost: 0
