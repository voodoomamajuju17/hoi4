          when:
            stability_below: 0.4
      src: user_request
      visible:
        focus: ZJP_yak_2
    - id: ZJP_clones_de_sendai
      name:
        english: The Clones of Sendai (20 Giri)
        spanish: Los Clones de Sendai (20 de Giri)
      desc:
        english: 'The laboratories deliver a new batch: 40,000 men and 2 divisions that never ask questions.'
        spanish: 'Los laboratorios entregan una tanda nueva: 40.000 hombres y 2 divisiones que nunca preguntan.'
      icon_prefer:
