        level: 2
      ai:
        factor: 3
      src: user_request
      visible:
        focus: ZJP_zai_2
    - id: ZJP_tributo_de_los_puertos
      name:
        english: Tribute of the Ports (+20 Giri)
        spanish: Tributo de los Puertos (+20 de Giri)
      desc:
        english: 'The clans collect from every pier: +20 Giri, but the people notice (-4% stability).'
        spanish: 'Los clanes cobran en cada muelle: +20 de Giri, pero la gente lo nota (-4% de estabilidad).'
      icon_prefer:
      - generic_political_actions
