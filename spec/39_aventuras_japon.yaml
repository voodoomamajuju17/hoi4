# =============================================================================
# Las aventuras de Japón (2026-11-07)
#
# Pedido del usuario: "Crear una aventura 'fácil' y breve para cada rama de
# Japón. Seguida de una más larga y difícil."
#
# Una por Casa (ZJP_gobierna, 29_japon_ampliado): la corta arranca 45 días
# después de que gobierna su Casa; la larga, 60 días después de que termina la
# corta. Cortas: dos personajes, dos decisiones, un capítulo cada 90 días, sin
# muertes ni catástrofes. Largas: tres personajes, cuatro decisiones, un
# capítulo cada 120 días, tres muertes, guerras y guerras civiles; la última
# decisión depende de algo que se eligió al principio (la bandera
# <prefijo>_<personaje>_...), y el relato lo recuerda. Los héroes de las largas
# son nuevos (los asesores del juego no pueden morir en un relato y seguir en el
# gabinete); los de las cortas son los del juego.
# Las presentaciones, los primeros capítulos y los finales grandes abren la
# Lámina (laminas.py).
# =============================================================================

