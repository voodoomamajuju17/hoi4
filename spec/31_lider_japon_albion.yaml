# =============================================================================
# El líder de Japón y de Gran Bretaña, estilo Crusader Kings (2026-11-01)
#
# Pedido del usuario: "hay nuevo contenido de Japón y GB (29_japon_ampliado,
# 30_albion_ampliada), y hay que adaptar los líderes y ministros a los stats que
# metimos en las meganaciones, así como los eventos que modifican stats".
# - Los dos tienen el panel del Líder (14_decisions) y su pulso mensual (decisiones
#   del líder, El Peso del Poder, la edad): se suma a ZJP_pulso y a ZAL_pulso.
# - Las stats de sus 7 líderes están en 27_lider_ck.yaml (MEGANATIONS_lider_detectar).
# - Acá: lo que suman o restan sus 16 ministros y el 20% de sus eventos visibles
#   con cambios de stats (misma regla que las meganaciones).
# =============================================================================
# - La Pompa (30_albion_ampliada): la primera caída a 10 o menos tumba al gobierno
#   (meganations_albion.97); la segunda, guerra civil contra los Ascendidos (.98).
# - Lo mismo del lado transhumanista: con estabilidad bajo 30% "se cae la Red" (.99, se
#   rearma sobre 50%); la segunda vez, guerra civil contra los neovictorianos (.100).
# =============================================================================

extend_scripted_effects:
  ZJP_pulso:
  - effect: run
    value: MEGANATIONS_lider_pulso
  ZAL_pulso:
  - effect: run
    value: MEGANATIONS_lider_pulso
  - effect: if
    when:
      all:
      - variable_is:
          var: ZAL_ruta
          value: 1
      - stability_below: 0.3
      - not_flag: ZAL_red_caida
    then:
    - effect: flag
      value: ZAL_red_caida
    - effect: if
      when:
        not_flag: ZAL_crisis_de_la_red
      then:
      - effect: flag
        value: ZAL_crisis_de_la_red
      - effect: event
        id: meganations_albion.99
        days: 3
      else:
      - effect: if
        when:
          not_global_flag: ZAL_guerra_de_las_eras
        then:
        - effect: event
          id: meganations_albion.100
          days: 3
  - effect: if
    when:
      all:
      - flag: ZAL_red_caida
      - stability_at_least: 0.5
    then:
    - effect: clear_flag
      value: ZAL_red_caida
