# =============================================================================
# El líder de Japón y de Gran Bretaña, estilo Crusader Kings (2026-11-01)
#
# Pedido del usuario: "hay nuevo contenido de Japón y GB (29_japon_ampliado,
# 30_albion_ampliada), y hay que adaptar los líderes y ministros a los stats que
# metimos en las meganaciones, así como los eventos que modifican stats".
# - Los dos tienen el panel del Líder (14_decisions) y su pulso mensual (decisiones
#   del líder, El Peso del Poder, la edad): se suma a ZJP_pulso y a ZAL_pulso.
# - Las stats de sus 7 líderes están en 27_lider_ck.yaml (MEGANATIONS_lider_detectar).
# - Acá: lo que suman o restan sus 16 ministros y el 20% de sus eventos visibles
#   con cambios de stats (misma regla que las meganaciones).
# =============================================================================

