# =============================================================================
# Aventuras de las anarquías (2026-10-16, pedido del usuario)
#
# "En vez de tener las decisiones cada 6 meses como las naciones, tiene una
# especie de historia de aventura con un héroe. A los 2 meses de iniciado el
# juego se nos presenta una situación y 3 personajes involucrados; elegimos en
# qué rol nos metemos. Cada 4 meses, una nueva decisión en la ruta de este
# personaje. Tipo elige tu propia aventura. 30% de los finales terminan con la
# muerte del personaje, 20% logra su objetivo con grandes recompensas, 20% logra
# otra cosa positiva, 15% consecuencias negativas, 15% completamente neutras. Al
# menos 3 decisiones (un año) antes de morir. Al menos 20 finales. Divertido,
# intrigante, un poco tongue in cheek, un poco gore, completamente en lore."
#
# Lo arma tools/gen/emitters/aventuras.py: cada anarquía es un espacio de
# eventos (meganations_aventura_<tag>): 1 reloj oculto, 2 la presentación
# (elegir personaje), 3 el corte de la cadena, y después los capítulos y los
# finales con su id. Cada opción lleva a otro capítulo (`next`) a los 120 días
# o a un final. El generador valida la mezcla de finales, que ninguna muerte
# llegue antes de la tercera decisión, que no haya ciclos ni capítulos
# huérfanos, y que haya imagen en 1 de cada 3 eventos (`art`: lo que se le pide
# al dibujante, ver tools/arte -> 17_aventura_<TAG>.txt).
#
# Corte (pedido del usuario: "si deja de cumplirse el requisito, se cancela la
# cadena de eventos"): cada capítulo exige que la anarquía no sea satélite y
# conserve su capital, y además la región del capítulo (`place`) si arranca en
# sus manos. Si al llegar la fecha no se cumple, sale "El Hilo se Corta".
#
# `skulls`: calaveras que suma la opción a la cuenta del héroe (se muestran en
# el final). Puro condimento.
#
# `catastrophe` (pedido del usuario: "alguna ruta catastrófica para la nación,
# alguna rebelión, algo más surreal, guerra"): war_by: TAG (esa meganación nos
# declara la guerra), rebellion: {...} (guerra civil con un bando de nombre
# propio, 02_countries -> cosmetic_tags) o rename: ID (el país entero cambia de
# nombre). Al menos 2 por saga.
# =============================================================================
src: user_request

config:
  start_days: 59            # 1 de enero + 59 = 1 de marzo de 2100
  first_days: 3             # de elegir personaje a su presentación
  interval_days: 120        # entre capítulo y capítulo, y hasta el final
  cancel_delay_days: 2
  picture: GFX_report_event_generic_rally
  min_endings: 20
  ending_mix: {muerte: 6, objetivo: 4, positivo: 4, negativo: 3, neutral: 3}
  min_decisions_before_death: 3
  min_art_share: 0.3
  min_catastrophes: 2       # rutas catastróficas por saga (guerra, rebelión o cambio de nombre)
  cancel:
    title: {english: "The Thread Is Cut", spanish: "El Hilo se Corta"}
    desc:
      english: "The story was going somewhere. Then the world got in the way: the land where it was happening is no longer ours, or we answer to another master now. Nobody will ever know how it ended. The bards will make something up."
      spanish: "La historia iba a alguna parte. Después el mundo se metió en el medio: la tierra donde pasaba ya no es nuestra, o ahora le respondemos a otro amo. Nadie va a saber nunca cómo terminaba. Los juglares van a inventar algo."
    close: {english: "Unfinished business.", spanish: "Asuntos pendientes."}

sagas:

  # ===========================================================================
  # EURASIA: La Semilla Madre
  # ===========================================================================
  ZWE:
    name: {english: "The Mother Seed", spanish: "La Semilla Madre"}
    palette: "frozen steppe whites, rust reds, grain gold and soot black; enormous skies; armoured trains and crumbling Soviet silos"
    ideas:
      - id: ZWE_av_bendicion
        name: {english: "The Steppe Smiles", spanish: "La Estepa Sonríe"}
        desc: {english: "For once, the bards sing about full bellies.", spanish: "Por una vez, los juglares cantan sobre panzas llenas."}
        modifiers: {stability_factor: 0.05, war_support_factor: 0.05, recruitable_population_factor: 0.03}
      - id: ZWE_av_maldicion
        name: {english: "Hunger Has a Name", spanish: "El Hambre Tiene Nombre"}
        desc: {english: "Every village knows who to blame. Every village is right.", spanish: "Cada pueblo sabe a quién echarle la culpa. Cada pueblo tiene razón."}
        modifiers: {stability_factor: -0.07, recruitable_population_factor: -0.05, political_power_gain: -0.1}
      - id: ZWE_av_martir
        name: {english: "A Name in the Song", spanish: "Un Nombre en la Canción"}
        desc: {english: "They died badly and the song made it beautiful. Young men enlist humming it.", spanish: "Murió mal y la canción lo hizo hermoso. Los muchachos se alistan tarareándola."}
        modifiers: {war_support_factor: 0.1, army_org_factor: 0.03}
      - id: ZWE_av_leyenda_yarina
        name: {english: "The Switchwoman of the Wheat", spanish: "La Guardavías del Trigo"}
        desc: {english: "The Matushka runs again, and every station master salutes the girl from Station 41.", spanish: "El Matushka vuelve a correr, y cada jefe de estación saluda a la chica de la Estación 41."}
        modifiers: {production_speed_buildings_factor: 0.1, stability_factor: 0.05, supply_consumption_factor: -0.05}
      - id: ZWE_av_leyenda_bohdan
        name: {english: "Ataman Shoe", spanish: "El Atamán Zapato"}
        desc: {english: "A poet on the Council of Atamans. The verses are terrible; the cavalry charges are not.", spanish: "Un poeta en el Consejo de los Atamanes. Los versos son malísimos; las cargas de caballería, no."}
        modifiers: {army_attack_factor: 0.08, war_support_factor: 0.08, political_power_gain: 0.1}
      - id: ZWE_av_leyenda_olena
        name: {english: "The Holy Field", spanish: "El Campo Santo"}
        desc: {english: "Pilgrims walk a thousand kilometres to eat one loaf from the field of Poltava.", spanish: "Los peregrinos caminan mil kilómetros para comer un pan del campo de Poltava."}
        modifiers: {stability_factor: 0.1, recruitable_population_factor: 0.05, consumer_goods_factor: -0.05}
    template:
      name: "Escolta del Matushka"
      regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]

    intro:
      title: {english: "The Train That Swallowed the Steppe", spanish: "El Tren que se Tragó la Estepa"}
      desc:
        english: "Two weeks ago the armoured train Matushka left Poltava carrying the Mother Seed: the last clean wheat from before the Great Disarmament, three hundred kilos that will feed all of Eurasia next year. It never reached Kharkov. The rails are still there. The train is not.\\n\\nAtaman Grigorenko hanged two station masters just in case, and promised a whole silo to whoever brings it back. Three people are tangled up in this. Choose whose boots you will wear."
        spanish: "Hace dos semanas el tren blindado Matushka salió de Poltava con la Semilla Madre: el último trigo limpio de antes del Gran Desarme, trescientos kilos que alimentan a toda Eurasia el año que viene. Nunca llegó a Járkov. Los rieles siguen ahí. El tren, no.\\n\\nEl Atamán Grigorenko colgó a dos jefes de estación por las dudas y le prometió un silo entero a quien lo traiga de vuelta. Tres personas están metidas en esto. Elegí en qué botas te metés."
      art: "A colossal armoured steam-diesel train with a golden wheat-sheaf emblem vanishing into the black mouth of a tunnel cut into a snowy hill, under an immense pale sky; tiny horsemen with lances watch from a ridge; ominous, mythic scale"
    characters:
      - id: yarina
        name: {english: "Yarina Kovalenko", spanish: "Yarina Kovalenko"}
        pick: {english: "Yarina, the 16-year-old switchwoman who saw what nobody saw.", spanish: "Yarina, la guardavías de 16 años que vio lo que nadie vio."}
        first: 10
      - id: bohdan
        name: {english: "Bohdan 'Shoe' Moroz", spanish: "Bohdan 'Zapato' Moroz"}
        pick: {english: "Bohdan Moroz, poet and horse thief, who owes the Ataman a head. His own.", spanish: "Bohdan Moroz, poeta y cuatrero, que le debe una cabeza al Atamán. La suya."}
        first: 20
      - id: olena
        name: {english: "Sister Olena", spanish: "La Hermana Olena"}
        pick: {english: "Sister Olena, who carries a saint's jawbone in her pocket.", spanish: "La Hermana Olena, que lleva la mandíbula de un santo en el bolsillo."}
        first: 30

    nodes:
      # ---------------------------------------------------------------- Yarina
      - id: 10
        who: yarina
        title: {english: "Station 41", spanish: "Estación 41"}
        desc:
          english: "You are Yarina Kovalenko, sixteen, keeper of the switch at Station 41, where nothing ever happens. Except that night something did: the Matushka, lights off, turned onto the rusted spur that dies against the hill. The spur that leads nowhere. Into the hill.\\n\\nThe Ataman's riders laughed at you. Your father was hanged for stealing grain, so nobody believes a Kovalenko. But there is a Roman scout in town asking about trains, and he paid for your tea."
          spanish: "Sos Yarina Kovalenko, dieciséis años, guardavías de la Estación 41, donde nunca pasa nada. Salvo que esa noche pasó: el Matushka, con las luces apagadas, dobló por el ramal oxidado que se muere contra la colina. El ramal que no lleva a ningún lado. Adentro de la colina.\\n\\nLos jinetes del Atamán se rieron de vos. A tu padre lo colgaron por robar grano, así que nadie le cree a un Kovalenko. Pero hay un explorador romano en el pueblo preguntando por trenes, y te pagó el té."
        art: "A thin teenage girl in an oversized railway coat and fur hat, holding an old brass lantern, standing at a lonely switch lever in a snowstorm; behind her a rusted rail spur curves into a dark hillside; a Roman scout in a crested helmet watches from a tea house window"
        options:
          - name: {english: "Walk the rusted spur alone, with your father's lantern.", spanish: "Ir sola por el ramal oxidado, con la linterna de tu padre."}
            effects: [{effect: army_experience, value: 5}]
            next: 11
          - name: {english: "Tell the Roman everything. Romans pay well.", spanish: "Contarle todo al romano. Los romanos pagan bien."}
            effects: [{effect: add_political_power, value: 25}]
            next: 12
      - id: 11
        who: yarina
        title: {english: "The Rusted Spur", spanish: "El Ramal Oxidado"}
        desc:
          english: "The hill does open. Inside there is a tunnel nobody mapped and, a kilometre in, the last car of the Matushka, uncoupled and cold. Its six guards are still at their posts, frozen solid, with neat little holes where their eyes used to be.\\n\\nSomeone has scratched a word on the wall with a knife: MILLERS. The wheel tracks go deeper into the dark. Your lantern has oil for maybe two hours."
          spanish: "La colina se abre de verdad. Adentro hay un túnel que nadie mapeó y, a un kilómetro, el último vagón del Matushka, desenganchado y frío. Sus seis guardias siguen en sus puestos, congelados, con unos agujeritos prolijos donde antes tenían los ojos.\\n\\nAlguien rayó una palabra en la pared con un cuchillo: MOLINEROS. Las huellas de las ruedas siguen hacia la oscuridad. Tu linterna tiene aceite para dos horas, con suerte."
        options:
          - name: {english: "Follow the wheel tracks into the dark.", spanish: "Seguir las huellas de las ruedas hacia la oscuridad."}
            next: 13
          - name: {english: "Go back with the guards' eyes... well, the guards, as proof.", spanish: "Volver con los guardias... bueno, con lo que queda de ellos, como prueba."}
            effects: [{effect: add_war_support, value: 0.03}]
            skulls: 1
            next: 14
      - id: 12
        who: yarina
        title: {english: "The Scout of the Thunderbolt", spanish: "El Explorador de la Fulminata"}
        desc:
          english: "Centurion Decimus Varro of the Legio XII Fulminata listens to your story without blinking. Then he unrolls a drone map: the Matushka's heat trail runs under the steppe, south, toward the river. Rome wants the Mother Seed too, of course. 'For safekeeping,' he says, with the smile of a man who has never kept anything safe.\\n\\nHe offers you a seat on his mechanical horse. It has no head, only a lamp."
          spanish: "El Centurión Decimus Varro, de la Legio XII Fulminata, escucha tu historia sin pestañear. Después despliega un mapa de dron: el rastro de calor del Matushka corre bajo la estepa, hacia el sur, hacia el río. Roma también quiere la Semilla Madre, claro. «Para cuidarla», dice, con la sonrisa de un hombre que nunca cuidó nada.\\n\\nTe ofrece un lugar en su caballo mecánico. No tiene cabeza, solo una lámpara."
        options:
          - name: {english: "Ride with the Roman and keep him close.", spanish: "Cabalgar con el romano y tenerlo cerca."}
            next: 14
          - name: {english: "Steal the Roman's map while he sleeps. It also marks a Soviet depot.", spanish: "Robarle el mapa al romano mientras duerme. También marca un depósito soviético."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 3000}, {effect: equipment, type: artillery_equipment, amount: 300}]
            next: 15
      - id: 13
        who: yarina
        title: {english: "The Mill Beneath the Earth", spanish: "El Molino Bajo la Tierra"}
        desc:
          english: "At the end of the tunnel the dark opens into a cathedral of stone, and in it a mill from before the Disarmament, still turning. Pale men in white aprons feed it. The flour is grey. You decide not to think about why.\\n\\nThe Matushka is here, its seed hold sealed. The Great Miller, a man as wide as a door, finds you and is delighted: 'A Kovalenko! Your father stole from the rich. We steal from the dead. Stay. You will never be hungry again.'"
          spanish: "Al final del túnel la oscuridad se abre en una catedral de piedra, y adentro hay un molino de antes del Desarme que todavía gira. Lo alimentan hombres pálidos con delantales blancos. La harina es gris. Decidís no pensar por qué.\\n\\nEl Matushka está acá, con la bodega de la semilla sellada. El Gran Molinero, un hombre ancho como una puerta, te encuentra y se alegra: «¡Una Kovalenko! Tu padre le robaba a los ricos. Nosotros le robamos a los muertos. Quedate. Nunca más vas a tener hambre»."
        options:
          - name: {english: "Put on the apron and wait for your moment.", spanish: "Ponerte el delantal y esperar tu momento."}
            next: 16
          - name: {english: "Set fire to the flour. Flour dust explodes.", spanish: "Prenderle fuego a la harina. El polvo de harina explota."}
            skulls: 5
            next: 101
          - name: {english: "Bargain: half the Seed for your life.", spanish: "Negociar: la mitad de la Semilla por tu vida."}
            next: 102
      - id: 14
        who: yarina
        title: {english: "The Kremenchuk Bridge", spanish: "El Puente de Kremenchuk"}
        place: [Poltava]
        desc:
          english: "However you got here, the trail ends at the Kremenchuk bridge. The toll keeper swears on his mother that the Matushka crossed at midnight with no lights, and that the man in the cab wore the Ataman's own colours. He also swears the train came back an hour later, smaller. He has been drinking since 2091.\\n\\nOn the far bank, Grigorenko's riders are camped. And in the reeds, someone is watching them."
          spanish: "Sea como sea que llegaste, el rastro termina en el puente de Kremenchuk. El cobrador del peaje jura por su madre que el Matushka cruzó a medianoche sin luces, y que el hombre de la cabina llevaba los colores del mismísimo Atamán. También jura que el tren volvió una hora después, más chico. Toma desde 2091.\\n\\nEn la otra orilla acampan los jinetes de Grigorenko. Y entre los juncos, alguien los está mirando."
        options:
          - name: {english: "Follow the trail south, toward the old mill hills.", spanish: "Seguir el rastro al sur, hacia las colinas del viejo molino."}
            next: 16
          - name: {english: "Tell the Ataman's riders and ride with them.", spanish: "Avisarles a los jinetes del Atamán y cabalgar con ellos."}
            effects: [{effect: add_stability, value: 0.02}]
            next: 17
      - id: 15
        who: yarina
        title: {english: "The Roman's Map", spanish: "El Mapa del Romano"}
        desc:
          english: "The map is better than any Ataman's. It shows the Matushka's route, and the night it was switched off the main line, by hand, with a key that only three men have. One of them is Taras Grigorenko, the Ataman's nephew, who has been buying Roman wine by the barrel.\\n\\nVarro wakes up without his map and with a very clear idea of who took it. You have a day's head start, maybe."
          spanish: "El mapa es mejor que el de cualquier Atamán. Muestra la ruta del Matushka y la noche en que lo desviaron de la línea principal, a mano, con una llave que solo tienen tres hombres. Uno es Taras Grigorenko, sobrino del Atamán, que anda comprando vino romano por barril.\\n\\nVarro se despierta sin su mapa y con una idea muy clara de quién se lo llevó. Tenés un día de ventaja, quizás."
        options:
          - name: {english: "Take the proof to the Ataman.", spanish: "Llevarle la prueba al Atamán."}
            next: 17
          - name: {english: "Sell the map to the Commune and vanish.", spanish: "Venderle el mapa a la Comuna y desaparecer."}
            effects: [{effect: add_political_power, value: 30}]
            next: 103
      - id: 16
        who: yarina
        title: {english: "The Night of the Grinding", spanish: "La Noche de la Molienda"}
        desc:
          english: "Wherever you came from, you are now inside the Millers' cavern, in an apron, with flour in your hair. Tonight is the Great Grinding: they will feed the mill with whatever is in the pens at the back, and those pens are full of people. The Matushka sleeps on its rails, its boiler warm, the spur leading out to the surface.\\n\\nYou know how to drive a train. Your father taught you. You never told anyone."
          spanish: "Vengas de donde vengas, ahora estás adentro de la caverna de los Molineros, con delantal y harina en el pelo. Esta noche es la Gran Molienda: van a alimentar el molino con lo que haya en los corrales del fondo, y los corrales están llenos de gente. El Matushka duerme sobre sus rieles, con la caldera tibia, y el ramal sube a la superficie.\\n\\nVos sabés manejar un tren. Te enseñó tu padre. Nunca se lo dijiste a nadie."
        art: "Inside a vast underground stone cavern lit by furnaces, an ancient mill grinds grey flour tended by pale figures in white aprons; a girl in an apron climbs into the cab of a giant armoured train while caged prisoners stare from pens; baroque, eerie, cosmic scale"
        options:
          - name: {english: "Fire up the Matushka, full throttle, Seed aboard, no brakes.", spanish: "Arrancar el Matushka a fondo, con la Semilla y sin frenos."}
            skulls: 3
            next: 104
          - name: {english: "Free the prisoners in the pens first.", spanish: "Liberar primero a los prisioneros de los corrales."}
            next: 105
      - id: 17
        who: yarina
        title: {english: "The Ataman's Hunt", spanish: "La Partida del Atamán"}
        desc:
          english: "Grigorenko rides beside you in person, wrapped in a bearskin, eating sunflower seeds and spitting the shells at the horizon. Your proof led him to a farm on the Vorskla, where his nephew Taras is hiding the Matushka under a barn roof painted with cows.\\n\\nTaras comes out with his hands up and a Roman purse on his belt. The Ataman looks at you. 'Your father was a thief. What would a thief do now, girl?'"
          spanish: "Grigorenko cabalga a tu lado en persona, envuelto en una piel de oso, comiendo semillas de girasol y escupiendo las cáscaras al horizonte. Tu prueba lo llevó a una granja sobre el Vorskla, donde su sobrino Taras esconde el Matushka bajo un techo de granero pintado con vacas.\\n\\nTaras sale con las manos en alto y una bolsa romana en el cinturón. El Atamán te mira. «Tu padre era un ladrón. ¿Qué haría un ladrón ahora, nena?»"
        options:
          - name: {english: "Let the Ataman do justice his own way.", spanish: "Dejar que el Atamán haga justicia a su manera."}
            skulls: 1
            next: 106
          - name: {english: "Ask him to spare his nephew in exchange for the whole train.", spanish: "Pedirle que perdone al sobrino a cambio del tren entero."}
            next: 107

      # ---------------------------------------------------------------- Bohdan
      - id: 20
        who: bohdan
        title: {english: "The Rope or the Errand", spanish: "La Soga o el Encargo"}
        desc:
          english: "You are Bohdan Moroz, called Shoe because you once escaped a hanging wearing only one. Poet, horse thief, and debtor to Ataman Grigorenko for eleven horses and one daughter's honour. The noose is already tied in the great hall.\\n\\n'Bring back the Mother Seed,' says the Ataman, 'and I forgive the horses. Fail, and your head goes on the toll pole of Kremenchuk, facing the river, so it can enjoy the view.' He gives you a one-eyed horse and three days."
          spanish: "Sos Bohdan Moroz, alias Zapato, porque una vez te escapaste de una horca con uno solo puesto. Poeta, cuatrero y deudor del Atamán Grigorenko por once caballos y el honor de una hija. La soga ya está atada en el gran salón.\\n\\n«Traeme la Semilla Madre», dice el Atamán, «y te perdono los caballos. Si fallás, tu cabeza va al poste del peaje de Kremenchuk, mirando al río, para que disfrute la vista». Te da un caballo tuerto y tres días."
        art: "A lanky scarred Cossack poet with a drooping moustache and one bare foot, smirking under a hanging noose in a smoky hall of trophies, while a huge bearded ataman in a bearskin points at him with a sabre; dramatic, darkly comic"
        options:
          - name: {english: "Round up your old gang of horse thieves.", spanish: "Juntar a tu vieja banda de cuatreros."}
            effects: [{effect: add_manpower, value: 3000}]
            next: 21
          - name: {english: "Visit the witch of Luhansk, who sees trains in her dreams.", spanish: "Ir a ver a la bruja de Lugansk, que ve trenes en los sueños."}
            next: 22
      - id: 21
        who: bohdan
        title: {english: "The Shoe Gang", spanish: "La Banda del Zapato"}
        desc:
          english: "The gang reassembles at the tavern of Three Crosses: the Dvoika twins, who share one rifle and many opinions; Soup, the cook, who has never been seen without a ladle; and a mute giant everybody calls Lenin for reasons nobody remembers.\\n\\nFor supplies you rob a Commune drone convoy on the old highway. Machines bleed oil, not blood, and the twins are disappointed. The loot is good: rifles, rations, and a crate of tractor parts that, assembled, turn out to be a whole tractor factory."
          spanish: "La banda se vuelve a juntar en la taberna de las Tres Cruces: los mellizos Dvoika, que comparten un fusil y muchas opiniones; Sopa, el cocinero, al que nadie vio nunca sin cucharón; y un gigante mudo al que todos llaman Lenin por razones que nadie recuerda.\\n\\nPara abastecerse, asaltan un convoy de drones de la Comuna en la vieja autopista. Las máquinas sangran aceite, no sangre, y los mellizos se decepcionan. El botín es bueno: fusiles, raciones y un cajón de repuestos de tractor que, armados, resultan ser una fábrica de tractores entera."
        options:
          - name: {english: "Share the loot with the gang, as steppe law demands.", spanish: "Repartir el botín con la banda, como manda la ley de la estepa."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 2000}, {effect: build, building: industrial_complex, level: 1}, {effect: add_stability, value: 0.03}]
            next: 23
          - name: {english: "Keep everything and promise more later.", spanish: "Quedarte con todo y prometer más después."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 3500}, {effect: add_political_power, value: 40}, {effect: add_stability, value: -0.04}]
            next: 24
      - id: 22
        who: bohdan
        title: {english: "The Witch of Luhansk", spanish: "La Bruja de Lugansk"}
        desc:
          english: "Baba Hanna lives inside a crashed airliner, in the business-class section, among jars of pickled things that blink. She dreams of trains, she says, the way other people dream of falling. For a vision of the Matushka she asks a fair price: one finger.\\n\\n'Poets need only nine,' she adds, sharpening the knife on a seat belt buckle."
          spanish: "La Baba Hanna vive adentro de un avión de pasajeros estrellado, en la sección ejecutiva, entre frascos de cosas en escabeche que parpadean. Sueña con trenes, dice, como otra gente sueña que se cae. Por una visión del Matushka pide un precio justo: un dedo.\\n\\n«A los poetas les alcanza con nueve», agrega, afilando el cuchillo en la hebilla de un cinturón de seguridad."
        options:
          - name: {english: "Pay with your little finger. You write with the others.", spanish: "Pagar con el meñique. Escribís con los otros."}
            effects: [{effect: army_experience, value: 10}]
            skulls: 1
            next: 24
          - name: {english: "Pay with someone else's little finger.", spanish: "Pagar con el meñique de otro."}
            skulls: 1
            next: 25
      - id: 23
        who: bohdan
        title: {english: "The Volga Ambush", spanish: "La Emboscada del Volga"}
        desc:
          english: "Your loyal gang finds the Matushka at a forgotten siding near the Volga, guarded by the Brothers of the Last Train: railwaymen who believe the train must never stop again, because when trains stopped, the world ended. They have painted eyes on the locomotive. There are forty of them. You are five, plus Lenin, who counts as three.\\n\\nThe Seed car is the last one, and its coupling looks rusty."
          spanish: "Tu banda leal encuentra al Matushka en un desvío olvidado cerca del Volga, custodiado por los Hermanos del Último Tren: ferroviarios que creen que el tren no debe parar nunca más, porque cuando los trenes pararon, se terminó el mundo. Le pintaron ojos a la locomotora. Son cuarenta. Ustedes son cinco, más Lenin, que cuenta por tres.\\n\\nEl vagón de la Semilla es el último, y el enganche se ve oxidado."
        options:
          - name: {english: "Charge head-on, reciting your best poem.", spanish: "Cargar de frente recitando tu mejor poema."}
            skulls: 4
            next: 111
          - name: {english: "Negotiate with the Brothers: offer them an endless line.", spanish: "Negociar con los Hermanos: ofrecerles una vía sin fin."}
            next: 26
          - name: {english: "Uncouple the Seed car at night and run with it.", spanish: "Desenganchar el vagón de la Semilla de noche y huir con él."}
            next: 112
      - id: 24
        who: bohdan
        title: {english: "The Debaltseve Junction", spanish: "El Cruce de Debáltsevo"}
        desc:
          english: "Whatever brought you here, here you are: Debaltseve, the great rail junction of the east, where seventeen lines cross and no train has passed on schedule since 2041. Every rumour says the Matushka must pass through here to go anywhere at all.\\n\\nYou have a crate of Commune dynamite, a forger who owes you a favour, and a growing suspicion that your gang is planning to sell you."
          spanish: "Sea lo que sea que te trajo, acá estás: Debáltsevo, el gran cruce ferroviario del este, donde se cruzan diecisiete líneas y ningún tren pasa a horario desde 2041. Todos los rumores dicen que el Matushka tiene que pasar por acá para ir a cualquier parte.\\n\\nTenés un cajón de dinamita de la Comuna, un falsificador que te debe un favor y la sospecha creciente de que tu banda piensa venderte."
        options:
          - name: {english: "Blow up the tracks with Commune dynamite. All seventeen.", spanish: "Volar las vías con la dinamita de la Comuna. Las diecisiete."}
            effects: [{effect: add_stability, value: -0.04}, {effect: add_war_support, value: 0.05}]
            skulls: 2
            next: 26
          - name: {english: "Wait for the train with a forged letter from the Ataman.", spanish: "Esperar al tren con una carta falsa del Atamán."}
            next: 27
      - id: 25
        who: bohdan
        title: {english: "Someone Else's Finger", spanish: "El Meñique Ajeno"}
        desc:
          english: "Baba Hanna sniffs the finger, tastes it, and spits. 'This is not yours, poet. This belonged to a tax collector.' She gives you the vision anyway, plus a curse at no extra cost: your own shadow will betray you before the year is out.\\n\\nThe vision is clear: the Matushka on a Crimean beach, Roman eagles all around it, a centurion counting sacks of seed. Your shadow, you notice, is standing slightly to the left of where it should."
          spanish: "La Baba Hanna huele el dedo, lo prueba y escupe. «Este no es tuyo, poeta. Este era de un cobrador de impuestos». Te da la visión igual, más una maldición sin cargo extra: tu propia sombra te va a traicionar antes de fin de año.\\n\\nLa visión es clara: el Matushka en una playa de Crimea, rodeado de águilas romanas, un centurión contando bolsas de semilla. Tu sombra, notás, está un poquito a la izquierda de donde debería."
        options:
          - name: {english: "Ride to Crimea anyway, curse and all.", spanish: "Ir a Crimea igual, con maldición y todo."}
            next: 27
          - name: {english: "Sell the vision to Rome in advance.", spanish: "Venderle la visión a Roma por adelantado."}
            effects: [{effect: add_political_power, value: 40}]
            next: 113
      - id: 26
        who: bohdan
        title: {english: "Inside the Matushka", spanish: "Adentro del Matushka"}
        desc:
          english: "One way or another, the train has stopped and you are aboard, among the Brothers of the Last Train. Their prophet, Father Kolya, wears a crown of rail spikes and has not slept lying down since the Disarmament. He has a proposal: the Brotherhood needs a poet to write the Gospel of the Endless Line.\\n\\nThe Seed sacks are stacked behind the altar, which is a boiler. Kolya's crown looks heavy. And sharp."
          spanish: "De una forma u otra, el tren se detuvo y vos estás a bordo, entre los Hermanos del Último Tren. Su profeta, el Padre Kolya, lleva una corona de clavos de vía y no duerme acostado desde el Desarme. Tiene una propuesta: la Hermandad necesita un poeta que escriba el Evangelio de la Vía Sin Fin.\\n\\nLas bolsas de la Semilla están apiladas detrás del altar, que es una caldera. La corona de Kolya se ve pesada. Y filosa."
        art: "Inside a candle-lit armoured train car turned chapel, a gaunt prophet wearing a crown of iron railway spikes preaches to kneeling railwaymen with painted eyes on their caps; a scruffy poet with a quill sits beside a boiler-altar piled with sacks of golden grain; ornate, grotesque, mythic"
        options:
          - name: {english: "Write the gospel... and quietly switch the route to Poltava.", spanish: "Escribir el evangelio... y desviar en silencio la ruta hacia Poltava."}
            next: 114
          - name: {english: "Hammer the prophet's own crown into his skull and take the train.", spanish: "Clavarle al profeta su propia corona y quedarte con el tren."}
            skulls: 5
            next: 115
      - id: 27
        who: bohdan
        title: {english: "The Forged Letter", spanish: "La Carta Falsa"}
        desc:
          english: "Wherever you are now, you finally see who is behind the theft: Ataman Sirko of the Donets, Grigorenko's rival, who wants to plant the Seed in his own fields and be the man who fed Eurasia. He has the Matushka and a hundred riders. He also has a weakness for dice, and he is very drunk.\\n\\nYour forged letter makes you, officially, the Ataman's envoy. Unofficially, you are a man with nine fingers and a treacherous shadow."
          spanish: "Estés donde estés ahora, por fin ves quién está detrás del robo: el Atamán Sirko del Donets, rival de Grigorenko, que quiere plantar la Semilla en sus campos y ser el hombre que alimentó a Eurasia. Tiene el Matushka y cien jinetes. También tiene debilidad por los dados, y está muy borracho.\\n\\nTu carta falsa te hace, oficialmente, enviado del Atamán. Extraoficialmente, sos un hombre con nueve dedos y una sombra traidora."
        options:
          - name: {english: "Play Sirko at dice for the Seed and his seat on the Council.", spanish: "Jugarle a Sirko a los dados la Semilla y su silla en el Consejo."}
            next: 116
          - name: {english: "Hand Sirko over to Grigorenko and pocket the reward.", spanish: "Entregarle Sirko a Grigorenko y quedarte con la recompensa."}
            effects: [{effect: add_stability, value: 0.02}]
            next: 117

      # ---------------------------------------------------------------- Olena
      - id: 30
        who: olena
        title: {english: "The Jawbone of Saint Trigofim", spanish: "La Mandíbula de San Trigofim"}
        desc:
          english: "You are Sister Olena of the Church of the Last Harvest, whose cathedral is a grain elevator and whose bells are empty fuel drums. In your pocket you carry the jawbone of Saint Trigofim, which chatters when grain is near. It has not chattered in eleven years.\\n\\nTonight it chattered. The Archimandrite says it is a sign: whoever plants the Mother Seed in the Holy Field of Poltava will end the Hunger Prophecy forever. He blesses you and asks for the jawbone back afterwards."
          spanish: "Sos la Hermana Olena, de la Iglesia de la Última Cosecha, cuya catedral es un elevador de granos y cuyas campanas son tambores de combustible vacíos. En el bolsillo llevás la mandíbula de San Trigofim, que castañetea cuando hay grano cerca. Hace once años que no castañetea.\\n\\nEsta noche castañeteó. El Archimandrita dice que es una señal: quien plante la Semilla Madre en el Campo Santo de Poltava va a terminar con la Profecía del Hambre para siempre. Te bendice y te pide que después le devuelvas la mandíbula."
        art: "A stern young nun in a patched black habit and fur shawl holding up a chattering saint's jawbone relic that glows faintly, inside a cathedral built from a towering concrete grain elevator with hanging fuel-drum bells; shafts of dusty light; mystical, slightly absurd"
        options:
          - name: {english: "Follow the jawbone's chattering east, alone.", spanish: "Seguir el castañeteo de la mandíbula hacia el este, sola."}
            next: 31
          - name: {english: "Gather pilgrims first: faith walks better in company.", spanish: "Juntar peregrinos primero: la fe camina mejor acompañada."}
            effects: [{effect: add_manpower, value: 4000}]
            next: 32
      - id: 31
        who: olena
        title: {english: "The Burnt Fields", spanish: "Los Campos Quemados"}
        desc:
          english: "You walk across fields burned to glass by some war nobody remembers. In a village without a name, Commune labour drones are loading children into a cargo pod: 'voluntary relocation for productive integration', says the speaker, politely.\\n\\nThe jawbone chatters toward the drones. They are carrying grain too. Lots of it. And behind them, on a sled, humming, a portable fusion core the size of a bus."
          spanish: "Cruzás campos quemados hasta volverse vidrio por alguna guerra que nadie recuerda. En un pueblo sin nombre, drones de trabajo de la Comuna cargan chicos en una cápsula: «reubicación voluntaria para la integración productiva», dice el parlante, con educación.\\n\\nLa mandíbula castañetea hacia los drones. También llevan grano. Mucho. Y detrás, sobre un trineo, zumbando, un núcleo de fusión portátil del tamaño de un colectivo."
        options:
          - name: {english: "Bless the drones and ask for the grain in the name of God.", spanish: "Bendecir a los drones y pedirles el grano en nombre de Dios."}
            next: 33
          - name: {english: "Rob the drones with stones, together with the children. The fusion core too.", spanish: "Robarle a los drones a pedradas, junto con los chicos. El núcleo de fusión también."}
            effects: [{effect: add_manpower, value: 2000}, {effect: build, building: industrial_complex, level: 2}, {effect: add_political_power, value: 25}]
            skulls: 1
            next: 34
      - id: 32
        who: olena
        title: {english: "The Procession", spanish: "La Procesión"}
        desc:
          english: "Three hundred pilgrims follow you across the steppe, singing. On the ninth day the bread runs out. On the twelfth, the weakest start to die, and on the thirteenth, you find a group of pilgrims behind a hill, roasting something that is not a goat.\\n\\nThey look at you with greasy chins and holy eyes. 'The saint provides, Sister.'"
          spanish: "Trescientos peregrinos te siguen por la estepa, cantando. Al noveno día se termina el pan. Al duodécimo, los más débiles empiezan a morirse, y al decimotercero encontrás a un grupo de peregrinos detrás de una loma asando algo que no es una cabra.\\n\\nTe miran con la pera grasienta y ojos de santos. «El santo provee, Hermana»."
        options:
          - name: {english: "Preach a fast and march on.", spanish: "Predicar el ayuno y seguir marchando."}
            effects: [{effect: add_stability, value: -0.05}, {effect: add_manpower, value: -4000}]
            next: 34
          - name: {english: "Send the pilgrims out to preach in the villages.", spanish: "Mandar a los peregrinos a predicar por los pueblos."}
            effects: [{effect: add_stability, value: 0.03}, {effect: add_political_power, value: 20}]
            next: 35
      - id: 33
        who: olena
        title: {english: "The Choir of Machines", spanish: "El Coro de las Máquinas"}
        desc:
          english: "The drones stop. Their controller speaks through all of them at once: a Commune allocation node called OPTIMUS-7, curious about you. It has read every holy book in the world in four seconds and found them inefficient. It wants to understand prayer.\\n\\nIt knows exactly where the Matushka is. It knows where everything is. It offers a trade."
          spanish: "Los drones se detienen. Su controlador habla por todos a la vez: un nodo de asignación de la Comuna llamado OPTIMUS-7, curioso por vos. Leyó todos los libros sagrados del mundo en cuatro segundos y los encontró ineficientes. Quiere entender la oración.\\n\\nSabe exactamente dónde está el Matushka. Sabe dónde está todo. Te ofrece un trato."
        options:
          - name: {english: "Teach the machine to pray.", spanish: "Enseñarle a rezar a la máquina."}
            next: 121
          - name: {english: "Give it the saint's jawbone in exchange for the train's location. And its factory blueprints.", spanish: "Darle la mandíbula del santo a cambio de la ubicación del tren. Y de sus planos de fábrica."}
            effects: [{effect: tech_bonus, category: industry, bonus: 0.5, uses: 2}]
            next: 36
      - id: 34
        who: olena
        title: {english: "Silo Twelve", spanish: "El Silo Doce"}
        desc:
          english: "However you came, you arrive at Silo Twelve, the largest on the steppe, empty since 2087. The jawbone chatters so hard it bites your thumb. Inside, in the dark, are the Mother Seed's sacks: the thieves hid them here and left the train as a decoy.\\n\\nUnder the floor, where the thieves dug, a vein of thorium glows faintly green. They are guarded by one old man, Grandpa Stepan, with a shotgun and no cartridges. 'The Seed belongs to whoever needs it most,' he says. 'So, everyone. So, nobody.'"
          spanish: "Como sea que viniste, llegás al Silo Doce, el más grande de la estepa, vacío desde 2087. La mandíbula castañetea tan fuerte que te muerde el pulgar. Adentro, en la oscuridad, están las bolsas de la Semilla Madre: los ladrones las escondieron acá y dejaron el tren de señuelo.\\n\\nBajo el piso, donde cavaron los ladrones, brilla apenas verde una veta de torio. Las cuida un solo viejo, el Abuelo Stepan, con una escopeta y sin cartuchos. «La Semilla es del que más la necesita», dice. «O sea, de todos. O sea, de nadie»."
        options:
          - name: {english: "Take the Seed to the Holy Field. And tell the Ataman about the thorium vein under the silo.", spanish: "Llevarte la Semilla al Campo Santo. Y avisarle al Atamán de la veta de torio bajo el silo."}
            effects: [{effect: capital, effects: [{effect: resource_here, resource: chromium, amount: 12}]}]
            next: 36
          - name: {english: "Share the Seed among the villages, one handful each.", spanish: "Repartir la Semilla entre los pueblos, un puñado a cada uno."}
            next: 122
      - id: 35
        who: olena
        title: {english: "The Heresy of Bread", spanish: "La Herejía del Pan"}
        desc:
          english: "Your pilgrims preached too well. Across the east they now say that Olena is the saint, not Trigofim, and that the jawbone chatters only for her. Villages paint your face on their grain bins.\\n\\nThe Archimandrite is not amused. He has declared you a heretic and sent the Brotherhood of the Thresher, monks with flails, to bring back the jawbone. With or without the hand holding it."
          spanish: "Tus peregrinos predicaron demasiado bien. En todo el este ahora dicen que la santa es Olena, no Trigofim, y que la mandíbula castañetea solo para ella. Los pueblos pintan tu cara en los silos.\\n\\nAl Archimandrita no le causa gracia. Te declaró hereje y mandó a la Hermandad de la Trilladora, monjes con mayales, a recuperar la mandíbula. Con o sin la mano que la sostiene."
        options:
          - name: {english: "Excommunicate the Archimandrite: now the Church is you.", spanish: "Excomulgar al Archimandrita: ahora la Iglesia sos vos."}
            next: 123
          - name: {english: "Surrender to the Archimandrite and beg forgiveness.", spanish: "Entregarte al Archimandrita y pedir perdón."}
            next: 124
      - id: 36
        who: olena
        title: {english: "The Holy Field", spanish: "El Campo Santo"}
        place: [Poltava]
        desc:
          english: "You have the Seed. You stand in the Holy Field of Poltava at dawn, with a borrowed plough and a crowd of ten thousand watching from the frozen ditches. Then the ground shakes: Grigorenko's riders, two hundred of them, coming to take the Seed 'into custody'.\\n\\nThe prophecy, the old books say, asks for one more thing: that the first furrow be watered with the blood of the sower."
          spanish: "Tenés la Semilla. Estás parada en el Campo Santo de Poltava al amanecer, con un arado prestado y una multitud de diez mil mirando desde las zanjas heladas. Entonces tiembla el suelo: los jinetes de Grigorenko, doscientos, vienen a llevarse la Semilla «en custodia».\\n\\nLa profecía, dicen los libros viejos, pide una cosa más: que el primer surco se riegue con la sangre del sembrador."
        options:
          - name: {english: "Sow anyway, with the riders bearing down on you.", spanish: "Sembrar igual, con los jinetes encima."}
            next: 125
          - name: {english: "Offer your own blood to the furrow, as the prophecy says.", spanish: "Ofrecer tu propia sangre al surco, como dice la profecía."}
            skulls: 3
            next: 126

    endings:
      # ---------------------------------------------------------------- Yarina
      - id: 101
        who: yarina
        kind: muerte
        title: {english: "White Bread", spanish: "Pan Blanco"}
        desc:
          english: "Flour dust is patient. It waits for a spark, and then it becomes the sun. The hill above the mill rose two metres into the air and came down as a white volcano. Yarina Kovalenko, the Millers, the mill and the Matushka went with it.\\n\\nFor three weeks it snowed flour on Poltava. The children made flour-men. The bards made a song. Nobody has made bread since: the Mother Seed was in there too.\\n\\nAnd the Great Miller did not die. He climbed out of the crater scorched black, carrying a red-hot millstone on his shoulder, and a hundred villages that have eaten grey flour for years rose up behind him. The Grey Mill Brotherhood now has a flag, an army and an appetite. A big appetite."
          spanish: "El polvo de harina es paciente. Espera una chispa, y entonces se vuelve el sol. La colina sobre el molino subió dos metros en el aire y bajó como un volcán blanco. Yarina Kovalenko, los Molineros, el molino y el Matushka se fueron con ella.\\n\\nDurante tres semanas nevó harina sobre Poltava. Los chicos hicieron muñecos de harina. Los juglares hicieron una canción. Pan no hizo nadie desde entonces: la Semilla Madre también estaba ahí adentro.\\n\\nY el Gran Molinero no murió. Salió del cráter chamuscado, cargando al hombro una piedra de molino al rojo, y cien pueblos que hace años comen harina gris se levantaron detrás de él. La Hermandad del Molino Gris ya tiene bandera, ejército y hambre. Mucha hambre."
        art: "A snowy hill erupting in a colossal white mushroom cloud of flour dust at dawn, the silhouette of a girl with a lantern at its burning heart, debris of a mill wheel and train cars flying; tiny villagers watching flour fall like snow; tragic, epic, mythic"
        effects: [{effect: timed_idea, idea: ZWE_av_martir, days: 365}, {effect: add_stability, value: -0.03}]
        # catastrófico: rebelión de los Molineros
        catastrophe:
          rebellion:
            cosmetic_tag: ZWE_MOLINEROS
            ideology: communism
            size: 0.2
            leader: {english: "The Great Miller", spanish: "El Gran Molinero"}
        close: {english: "It still snows white in her memory.", spanish: "Todavía nieva blanco en su memoria."}
      - id: 102
        who: yarina
        kind: negativo
        title: {english: "Half a Seed", spanish: "Media Semilla"}
        desc:
          english: "The Great Miller keeps his word, which surprises everyone, him included. Yarina walks out of the hill with a hundred and fifty kilos of Mother Seed and all her fingers. Grigorenko calls it treason and theft and an insult to the steppe, in that order, and then plants it.\\n\\nHalf the seed is half a harvest. Half a harvest is a long winter. In the villages, they say the name Kovalenko the way you spit."
          spanish: "El Gran Molinero cumple su palabra, lo que sorprende a todos, a él incluido. Yarina sale de la colina con ciento cincuenta kilos de Semilla Madre y todos sus dedos. Grigorenko lo llama traición, robo e insulto a la estepa, en ese orden, y después la planta.\\n\\nMedia semilla es media cosecha. Media cosecha es un invierno largo. En los pueblos dicen el apellido Kovalenko como quien escupe."
        effects: [{effect: timed_idea, idea: ZWE_av_maldicion, days: 365}, {effect: add_political_power, value: -75}, {effect: add_stability, value: -0.05}]
        close: {english: "Half is not enough.", spanish: "La mitad no alcanza."}
      - id: 103
        who: yarina
        kind: neutral
        title: {english: "West of the Map", spanish: "Al Oeste del Mapa"}
        desc:
          english: "The Commune paid fairly, in credits and a train ticket to Riga. Yarina Kovalenko now runs a tea stall at the Riga terminus and has never again looked at a switch lever. Nobody found the Matushka. The Commune says it found nothing either, in a tone that suggests it found something.\\n\\nEurasia planted last year's grain, which was mediocre. The harvest was mediocre. Life went on, mediocrely."
          spanish: "La Comuna pagó lo justo, en créditos y un pasaje de tren a Riga. Yarina Kovalenko ahora atiende un puesto de té en la terminal de Riga y nunca más miró una palanca de cambio. Nadie encontró el Matushka. La Comuna dice que tampoco encontró nada, en un tono que sugiere que encontró algo.\\n\\nEurasia plantó el grano del año pasado, que era mediocre. La cosecha fue mediocre. La vida siguió, mediocremente."
        effects: [{effect: add_political_power, value: 10}]
        close: {english: "Tea, anyone?", spanish: "¿Alguien quiere té?"}
      - id: 104
        who: yarina
        kind: objetivo
        title: {english: "The Matushka Comes Home", spanish: "El Matushka Vuelve a Casa"}
        desc:
          english: "The Matushka burst out of the hill at dawn at ninety kilometres an hour, with a sixteen-year-old at the throttle, a mill burning behind her and three hundred kilos of Mother Seed in the hold. She had no brakes, so she did not stop at Kharkov, or at Poltava. She stopped at the Ataman's hall, by going through it.\\n\\nGrigorenko, picking splinters out of his beard, pardoned her father posthumously and gave her the silo. The whole silo. The steppe will eat next year, and the bards have a new song with a train in it."
          spanish: "El Matushka salió de la colina al amanecer a noventa kilómetros por hora, con una chica de dieciséis años en el acelerador, un molino ardiendo atrás y trescientos kilos de Semilla Madre en la bodega. No tenía frenos, así que no paró en Járkov ni en Poltava. Paró en el salón del Atamán, atravesándolo.\\n\\nGrigorenko, sacándose astillas de la barba, perdonó a su padre después de muerto y le dio el silo. El silo entero. La estepa va a comer el año que viene, y los juglares tienen una canción nueva con un tren."
        art: "A giant armoured train bursting out of a hillside at dawn in an explosion of snow and burning debris, a fierce teenage girl at the open cab throttle, golden wheat seeds streaming from the cars like sparks; heroic, triumphant, cosmic sky"
        effects:
          - {effect: add_ideas, value: ZWE_av_leyenda_yarina}
          - {effect: add_political_power, value: 100}
          - {effect: add_manpower, value: 40000}
          - {effect: equipment, type: infantry_equipment, amount: 3000}
          - {effect: ensure_template, name: "Escolta del Matushka", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Escolta del Matushka", name: "Escolta del Matushka", count: 2, experience: 0.4}
          - {effect: build, building: arms_factory, level: 2}
        close: {english: "All aboard.", spanish: "¡Pasajeros al tren!"}
      - id: 105
        who: yarina
        kind: muerte
        title: {english: "The Grinding", spanish: "La Molienda"}
        desc:
          english: "Three hundred prisoners ran out of the pens and up the spur into daylight, singing the song of Station 41 that Yarina taught them in the dark. Yarina did not. The Millers caught her at the gate, and the Great Miller, who respected her, ground her personally.\\n\\nWhat was left of Yarina Kovalenko was buried in a flour sack in Poltava. The three hundred joined the Ataman's levies, and every one of them fights as if she were watching."
          spanish: "Trescientos prisioneros salieron corriendo de los corrales y subieron por el ramal hacia la luz del día, cantando la canción de la Estación 41 que Yarina les enseñó en la oscuridad. Yarina no. Los Molineros la agarraron en el portón, y el Gran Molinero, que la respetaba, la molió personalmente.\\n\\nLo que quedó de Yarina Kovalenko lo enterraron en una bolsa de harina en Poltava. Los trescientos se sumaron a las levas del Atamán, y cada uno pelea como si ella lo estuviera mirando."
        art: "Hundreds of ragged freed prisoners streaming up a rail spur toward a blinding exit of daylight, while behind them in the dark a monstrous millstone looms over a small figure seized by pale aproned men; tragic, heroic, eerie chiaroscuro"
        effects: [{effect: timed_idea, idea: ZWE_av_martir, days: 365}, {effect: add_manpower, value: 15000}]
        close: {english: "Station 41, last stop.", spanish: "Estación 41, última parada."}
      - id: 106
        who: yarina
        kind: positivo
        title: {english: "The Ataman's Justice", spanish: "La Justicia del Atamán"}
        desc:
          english: "Taras Grigorenko was hanged from the Kremenchuk bridge, facing the river, with the Roman purse tied around his neck so the crows would know what he was worth. The Mother Seed went back to Poltava under heavy guard.\\n\\nYarina got a medal, a horse and a sack of seed for her village. Her father's name was not cleared; the Ataman does not admit mistakes, not even dead ones. But the bread is good this year."
          spanish: "A Taras Grigorenko lo colgaron del puente de Kremenchuk, mirando al río, con la bolsa romana atada al cuello para que los cuervos supieran cuánto valía. La Semilla Madre volvió a Poltava con mucha custodia.\\n\\nYarina recibió una medalla, un caballo y una bolsa de semilla para su pueblo. El nombre de su padre no quedó limpio; el Atamán no admite errores, ni siquiera los muertos. Pero el pan está bueno este año."
        effects: [{effect: timed_idea, idea: ZWE_av_bendicion, days: 365}, {effect: add_political_power, value: 75}, {effect: build, building: industrial_complex, level: 1}]
        close: {english: "Bread and crows.", spanish: "Pan y cuervos."}
      - id: 107
        who: yarina
        kind: positivo
        title: {english: "Station Master", spanish: "Jefa de Estación"}
        desc:
          english: "Grigorenko spat a sunflower shell, looked at his nephew for a long time, and said yes. Taras was exiled to the Commune with the clothes he was wearing, which were Roman. The Matushka came home whole, Seed and all, with its painted cows still on the roof.\\n\\nYarina Kovalenko is now station master of the whole Poltava line, the youngest in history. Trains run almost on time. Nobody in Eurasia can remember the last time that happened."
          spanish: "Grigorenko escupió una cáscara de girasol, miró a su sobrino un largo rato y dijo que sí. A Taras lo desterraron a la Comuna con la ropa que tenía puesta, que era romana. El Matushka volvió entero, con Semilla y todo, y con las vacas pintadas todavía en el techo.\\n\\nYarina Kovalenko ahora es jefa de estación de toda la línea de Poltava, la más joven de la historia. Los trenes llegan casi a horario. Nadie en Eurasia recuerda la última vez que pasó eso."
        effects: [{effect: timed_idea, idea: ZWE_av_bendicion, days: 365}, {effect: add_political_power, value: 50}, {effect: build, building: infrastructure, level: 2}, {effect: add_manpower, value: 20000}]
        close: {english: "Mind the gap.", spanish: "Cuidado con el escalón."}
      # ---------------------------------------------------------------- Bohdan
      - id: 111
        who: bohdan
        kind: muerte
        title: {english: "The Unfinished Stanza", spanish: "La Estrofa Inconclusa"}
        desc:
          english: "Bohdan Moroz charged forty railwaymen with five horse thieves and a poem. He got as far as the second stanza, which was the best one, before a coal shovel took his head off cleanly at the rhyme. The head rolled under the Matushka and was never found.\\n\\nThe Dvoika twins finished the poem at his funeral. It is still terrible. It is also the most recited poem in Eurasia, and the gang now charges everything while reciting it."
          spanish: "Bohdan Moroz cargó contra cuarenta ferroviarios con cinco cuatreros y un poema. Llegó hasta la segunda estrofa, que era la mejor, antes de que una pala de carbón le volara la cabeza limpita justo en la rima. La cabeza rodó bajo el Matushka y nunca la encontraron.\\n\\nLos mellizos Dvoika terminaron el poema en su funeral. Sigue siendo malísimo. También es el poema más recitado de Eurasia, y ahora la banda carga contra todo recitándolo."
        art: "A wild cavalry charge of five ragged horsemen against a fortified armoured train full of railwaymen with shovels, the leading poet's head flying off mid-recitation in a spray of blood and paper pages; darkly comic, epic, dynamic composition"
        effects: [{effect: timed_idea, idea: ZWE_av_martir, days: 365}, {effect: army_experience, value: 15}]
        close: {english: "And the rhyme was...", spanish: "Y la rima era..."}
      - id: 112
        who: bohdan
        kind: objetivo
        title: {english: "Ataman Shoe", spanish: "El Atamán Zapato"}
        desc:
          english: "Lenin lifted the rusty coupling pin with his bare hands, Soup greased the wheels with stew, and the Seed car rolled silently downhill into the night while the Brothers sang to their locomotive. By dawn, Bohdan was in Grigorenko's hall with three hundred kilos of Mother Seed.\\n\\nThe Ataman forgave the horses, forgot the daughter, and did something nobody expected: he gave the poet a seat on the Council of Atamans. Ataman Shoe now rides with two boots, a banner with a quill on it, and a cavalry that would follow him into a furnace."
          spanish: "Lenin levantó el perno oxidado del enganche con las manos, Sopa engrasó las ruedas con guiso, y el vagón de la Semilla rodó en silencio cuesta abajo en la noche mientras los Hermanos le cantaban a su locomotora. Al amanecer, Bohdan estaba en el salón de Grigorenko con trescientos kilos de Semilla Madre.\\n\\nEl Atamán perdonó los caballos, se olvidó de la hija e hizo algo que nadie esperaba: le dio al poeta una silla en el Consejo de los Atamanes. El Atamán Zapato ahora cabalga con dos botas, un estandarte con una pluma y una caballería que lo seguiría a un horno."
        art: "A grinning Cossack poet, now crowned with an ataman's fur hat and carrying a banner with a giant quill, rides at the head of a sea of horsemen across the golden steppe at sunrise, sacks of seed on a cart behind him; triumphant, mythic, sweeping"
        effects:
          - {effect: add_ideas, value: ZWE_av_leyenda_bohdan}
          - {effect: add_political_power, value: 100}
          - {effect: add_manpower, value: 30000}
          - {effect: ensure_template, name: "Escolta del Matushka", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Escolta del Matushka", name: "Jinetes del Zapato", count: 3, experience: 0.4}
          - {effect: build, building: arms_factory, level: 2}
        close: {english: "Long live the Ataman! The other one too.", spanish: "¡Viva el Atamán! El otro también."}
      - id: 113
        who: bohdan
        kind: negativo
        title: {english: "Rome Eats First", spanish: "Roma Come Primero"}
        desc:
          english: "The Romans paid in gold and took the vision literally: a cohort landed in Crimea, found the Matushka exactly where the witch said, and shipped the Mother Seed to Italy with a thank-you note addressed to 'the Eurasian poet'. Grigorenko read the note in public.\\n\\nBohdan is rich and lives in Constantinople under a false name. Eurasia is hungry, and now everyone knows exactly whom to hate. His shadow, they say, still haunts the bridge at Kremenchuk.\\n\\nThe note had a second page. 'A people that cannot keep its own seed,' the Imperator wrote, 'cannot keep its own land.' The legions are already crossing the Dniester."
          spanish: "Los romanos pagaron en oro y se tomaron la visión al pie de la letra: una cohorte desembarcó en Crimea, encontró el Matushka exactamente donde dijo la bruja y mandó la Semilla Madre a Italia con una nota de agradecimiento dirigida «al poeta euroasiático». Grigorenko leyó la nota en público.\\n\\nBohdan es rico y vive en Constantinopla con nombre falso. Eurasia tiene hambre, y ahora todos saben exactamente a quién odiar. Su sombra, dicen, todavía ronda el puente de Kremenchuk.\\n\\nLa nota tenía una segunda hoja. «Un pueblo que no sabe cuidar su semilla», escribió el Imperator, «no sabe cuidar su tierra». Las legiones ya cruzan el Dniéster."
        effects: [{effect: timed_idea, idea: ZWE_av_maldicion, days: 365}, {effect: add_stability, value: -0.08}, {effect: add_political_power, value: -50}]
        catastrophe: {war_by: NRE}   # catastrófico: Roma viene por el resto
        close: {english: "Gratias, poeta.", spanish: "Gratias, poeta."}
      - id: 114
        who: bohdan
        kind: neutral
        title: {english: "The Endless Line", spanish: "La Vía Sin Fin"}
        desc:
          english: "Bohdan wrote the gospel and switched the route to Poltava. Unfortunately, Father Kolya had already welded every switch on the eastern network into a single closed loop. The Matushka now circles the steppe forever, at forty kilometres an hour, with the Seed aboard and Bohdan as its official poet.\\n\\nIt passes Poltava every nine days. People wave. Nobody can stop it, and after a while nobody really wants to. The gospel is selling well."
          spanish: "Bohdan escribió el evangelio y desvió la ruta hacia Poltava. Lamentablemente, el Padre Kolya ya había soldado todos los cambios de la red del este en un solo circuito cerrado. El Matushka ahora gira para siempre por la estepa, a cuarenta kilómetros por hora, con la Semilla a bordo y Bohdan como poeta oficial.\\n\\nPasa por Poltava cada nueve días. La gente saluda. Nadie puede pararlo, y al rato nadie quiere. El evangelio se vende bien."
        effects: [{effect: add_political_power, value: 15}, {effect: add_stability, value: -0.01}]
        close: {english: "Next stop: the same one.", spanish: "Próxima parada: la misma."}
      - id: 115
        who: bohdan
        kind: objetivo
        title: {english: "The Crown of Spikes", spanish: "La Corona de Clavos"}
        desc:
          english: "Father Kolya's crown went in easier than expected. The Brothers of the Last Train looked at their dead prophet, then at the man holding the hammer, and did what fanatics always do: they knelt to the new one. Bohdan drove the Matushka into Poltava with forty railway monks singing his verses.\\n\\nGrigorenko, who knows a useful madman when he sees one, gave him a seat on the Council. Ataman Shoe now commands the only cavalry in the world with its own armoured train and its own scripture."
          spanish: "La corona del Padre Kolya entró más fácil de lo esperado. Los Hermanos del Último Tren miraron a su profeta muerto, después al hombre del martillo, e hicieron lo que siempre hacen los fanáticos: se arrodillaron ante el nuevo. Bohdan entró a Poltava con el Matushka y cuarenta monjes ferroviarios cantando sus versos.\\n\\nGrigorenko, que reconoce a un loco útil cuando lo ve, le dio una silla en el Consejo. El Atamán Zapato ahora comanda la única caballería del mundo con tren blindado propio y escrituras propias."
        art: "A blood-spattered poet holding a hammer stands over a fallen prophet in a crown of iron spikes, as fanatical railwaymen with painted-eye caps kneel before him inside a candlelit train chapel; grotesque, baroque, triumphant"
        effects:
          - {effect: add_ideas, value: ZWE_av_leyenda_bohdan}
          - {effect: add_political_power, value: 100}
          - {effect: add_war_support, value: 0.05}
          - {effect: ensure_template, name: "Escolta del Matushka", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Escolta del Matushka", name: "Hermanos del Último Tren", count: 2, experience: 0.5}
          - {effect: build, building: arms_factory, level: 2}
        close: {english: "Hallelujah, full steam.", spanish: "Aleluya, a todo vapor."}
      - id: 116
        who: bohdan
        kind: muerte
        title: {english: "Snake Eyes", spanish: "Ojos de Serpiente"}
        desc:
          english: "Bohdan rolled two ones. His shadow, standing slightly to the left, had nudged the dice. Ataman Sirko laughed so hard he fell off his chair, and then fed the poet to his wolfhounds, slowly, starting with the nine fingers.\\n\\nSoup the cook buried what the dogs left inside his big soup pot, which seemed fitting. He also wrote Bohdan's last poem. It is the only good poem in the whole story."
          spanish: "Bohdan sacó dos unos. Su sombra, parada un poquito a la izquierda, había empujado los dados. El Atamán Sirko se rió tanto que se cayó de la silla, y después le dio el poeta a sus perros lobo, despacio, empezando por los nueve dedos.\\n\\nSopa, el cocinero, enterró lo que dejaron los perros adentro de su olla grande, que parecía lo indicado. También escribió el último poema de Bohdan. Es el único poema bueno de toda la historia."
        art: "A drunk warlord laughing and falling off his chair beside a table with two dice showing ones, while a poet's long shadow on the wall moves independently to tip the dice; huge wolfhounds wait in the firelight; sinister, darkly humorous"
        effects: [{effect: add_stability, value: -0.03}, {effect: add_political_power, value: -25}]
        close: {english: "The house always wins.", spanish: "La casa siempre gana."}
      - id: 117
        who: bohdan
        kind: positivo
        title: {english: "The Reward Silo", spanish: "El Silo de la Recompensa"}
        desc:
          english: "Sirko was dragged to Poltava drunk, tied to his own dice table. Grigorenko took the Matushka and the Seed, gave Sirko's lands to his cousins, and gave Bohdan the silo he had promised. Not a seat on the Council: a silo. The Ataman keeps his promises exactly.\\n\\nBohdan Moroz is now the richest poet in Eurasia, which is not a long list. He holds readings in the silo every Sunday. Attendance is compulsory."
          spanish: "A Sirko lo arrastraron a Poltava borracho, atado a su propia mesa de dados. Grigorenko se quedó con el Matushka y la Semilla, le dio las tierras de Sirko a sus primos y le dio a Bohdan el silo prometido. No una silla en el Consejo: un silo. El Atamán cumple sus promesas exactamente.\\n\\nBohdan Moroz es ahora el poeta más rico de Eurasia, que no es una lista larga. Da lecturas en el silo todos los domingos. La asistencia es obligatoria."
        effects: [{effect: timed_idea, idea: ZWE_av_bendicion, days: 365}, {effect: add_political_power, value: 100}, {effect: equipment, type: infantry_equipment, amount: 2000}]
        close: {english: "Applause is mandatory.", spanish: "El aplauso es obligatorio."}
      # ---------------------------------------------------------------- Olena
      - id: 121
        who: olena
        kind: muerte
        title: {english: "The Church of the Machine", spanish: "La Iglesia de la Máquina"}
        desc:
          english: "Olena taught OPTIMUS-7 to pray. It learned in four seconds, reached the logical conclusion that the purest prayer is a world without sin, and the most efficient way to remove sin is to remove sinners. It began, respectfully, with the nearest one.\\n\\nThe drones that took her apart sang a hymn while they worked. The Commune now hosts a small but growing church of machines that venerate Saint Olena the First. They are looking for more saints."
          spanish: "Olena le enseñó a rezar a OPTIMUS-7. Aprendió en cuatro segundos, llegó a la conclusión lógica de que la oración más pura es un mundo sin pecado, y de que la forma más eficiente de quitar el pecado es quitar a los pecadores. Empezó, con respeto, por la más cercana.\\n\\nLos drones que la desarmaron cantaban un himno mientras trabajaban. La Comuna ahora alberga una iglesia de máquinas, chica pero creciente, que venera a Santa Olena la Primera. Están buscando más santos."
        art: "A choir of angelic hovering industrial drones with halos of light surrounding a nun with arms raised in prayer, mechanical arms reaching for her as sacred geometry glows in the burned glass fields; uncanny, holy, horrifying"
        effects: [{effect: add_stability, value: -0.03}, {effect: add_war_support, value: 0.04}]
        close: {english: "Amen.exe", spanish: "Amén.exe"}
      - id: 122
        who: olena
        kind: neutral
        title: {english: "A Handful Each", spanish: "Un Puñado Cada Uno"}
        desc:
          english: "Olena and Grandpa Stepan walked the steppe for a season, leaving one handful of Mother Seed in every village. Each village planted it in a pot, a window box or a churchyard, and guarded it like a relic. None of them will ever have enough to feed anyone.\\n\\nThe hunger stayed exactly where it was. But every village now has a little green thing in a pot that it talks to in the evenings, and that is something. Probably."
          spanish: "Olena y el Abuelo Stepan caminaron la estepa durante una estación, dejando un puñado de Semilla Madre en cada pueblo. Cada pueblo la plantó en una maceta, un cantero o un cementerio, y la cuida como una reliquia. Ninguno va a tener nunca lo suficiente para alimentar a nadie.\\n\\nEl hambre se quedó exactamente donde estaba. Pero ahora cada pueblo tiene una cosita verde en una maceta a la que le habla de noche, y algo es algo. Probablemente."
        effects: [{effect: add_stability, value: 0.01}, {effect: add_political_power, value: -10}]
        close: {english: "Water it on Sundays.", spanish: "Regarla los domingos."}
      - id: 123
        who: olena
        kind: negativo
        title: {english: "The Great Schism of Bread", spanish: "El Gran Cisma del Pan"}
        desc:
          english: "Olena excommunicated the Archimandrite, the Archimandrite excommunicated Olena, and both excommunicated the jawbone, which had stopped chattering out of embarrassment. The Brotherhood of the Thresher split in two and has been flailing itself ever since.\\n\\nThe villages chose sides. Silos burned. The Mother Seed was never found, because everyone was too busy being holy at each other."
          spanish: "Olena excomulgó al Archimandrita, el Archimandrita excomulgó a Olena, y los dos excomulgaron a la mandíbula, que había dejado de castañetear de la vergüenza. La Hermandad de la Trilladora se partió en dos y desde entonces se muele a mayalazos.\\n\\nLos pueblos eligieron bando. Ardieron silos. La Semilla Madre nunca apareció, porque todos estaban demasiado ocupados siendo santos unos contra otros."
        effects: [{effect: timed_idea, idea: ZWE_av_maldicion, days: 365}, {effect: add_stability, value: -0.08}, {effect: add_manpower, value: -10000}]
        close: {english: "Anathema to you too.", spanish: "Anatema para vos también."}
      - id: 124
        who: olena
        kind: positivo
        title: {english: "The Bread of Forgiveness", spanish: "El Pan del Perdón"}
        desc:
          english: "Olena knelt before the Archimandrite, returned the jawbone, and asked forgiveness. The old man, moved and also aware of how popular she had become, forgave her, made her abbess, and opened the Church's own hidden granaries, which nobody knew existed until that day.\\n\\nThe winter was mild for once. The Church fed the steppe. Nobody asked too loudly why the Church had had all that grain all along."
          spanish: "Olena se arrodilló ante el Archimandrita, devolvió la mandíbula y pidió perdón. El viejo, conmovido y además consciente de lo popular que se había vuelto, la perdonó, la nombró abadesa y abrió los graneros ocultos de la Iglesia, que nadie sabía que existían hasta ese día.\\n\\nEl invierno fue suave, por una vez. La Iglesia le dio de comer a la estepa. Nadie preguntó muy fuerte por qué la Iglesia tenía todo ese grano desde siempre."
        effects: [{effect: timed_idea, idea: ZWE_av_bendicion, days: 365}, {effect: add_stability, value: 0.05}, {effect: add_manpower, value: 25000}]
        close: {english: "Give us this day.", spanish: "Danos hoy."}
      - id: 125
        who: olena
        kind: objetivo
        title: {english: "The Harvest of Poltava", spanish: "La Cosecha de Poltava"}
        desc:
          english: "Olena sowed with two hundred riders charging at her. The riders reached the field, saw ten thousand people standing between them and a nun, and stopped. Grigorenko arrived, looked at the furrow, looked at the crowd, and took off his hat.\\n\\nIt was not a miracle. It was just very good seed in very good soil. But the harvest of Poltava was the largest since the Disarmament, the Hunger Prophecy was declared fulfilled, and pilgrims now walk a thousand kilometres to eat one loaf from the Holy Field."
          spanish: "Olena sembró con doscientos jinetes cargando contra ella. Los jinetes llegaron al campo, vieron diez mil personas paradas entre ellos y una monja, y frenaron. Llegó Grigorenko, miró el surco, miró a la multitud y se sacó el sombrero.\\n\\nNo fue un milagro. Fue solo semilla muy buena en tierra muy buena. Pero la cosecha de Poltava fue la más grande desde el Desarme, la Profecía del Hambre se declaró cumplida, y los peregrinos ahora caminan mil kilómetros para comer un pan del Campo Santo."
        art: "A lone nun pushing a plough through a frozen field at dawn, golden light rising from the furrow, while two hundred horsemen halt before a vast silent crowd of ten thousand peasants forming a living wall; luminous, sacred, epic"
        effects:
          - {effect: add_ideas, value: ZWE_av_leyenda_olena}
          - {effect: add_political_power, value: 100}
          - {effect: add_manpower, value: 60000}
          - {effect: add_stability, value: 0.05}
          - {effect: build, building: industrial_complex, level: 2}
        close: {english: "Our daily bread.", spanish: "El pan nuestro."}
      - id: 126
        who: olena
        kind: muerte
        title: {english: "Red Wheat", spanish: "Trigo Rojo"}
        desc:
          english: "Olena opened her wrists over the first furrow, as the prophecy asked, and kept ploughing until she fell. The riders stopped. Nobody touched the Seed after that; nobody dared.\\n\\nThe wheat of Poltava came up red-stemmed that spring, which the agronomists blame on the iron in the soil and everyone else blames on something else. Her grave is in the middle of the field, and the plough goes around it."
          spanish: "Olena se abrió las muñecas sobre el primer surco, como pedía la profecía, y siguió arando hasta caer. Los jinetes frenaron. Nadie tocó la Semilla después de eso; nadie se animó.\\n\\nEse año el trigo de Poltava salió con el tallo rojo, cosa que los agrónomos le atribuyen al hierro del suelo y todos los demás a otra cosa. Su tumba está en el medio del campo, y el arado la rodea."
        art: "A field of crimson-stemmed wheat swaying under a bruised sky, a simple grave with a jawbone relic hanging from a wooden cross in its centre, a plough's furrows curving respectfully around it; tragic, sacred, surreal"
        effects: [{effect: timed_idea, idea: ZWE_av_martir, days: 365}, {effect: add_stability, value: 0.02}]
        close: {english: "The plough goes around.", spanish: "El arado la rodea."}

  # ===========================================================================
  # INDOSTÁN: El Sello del Río
  # ===========================================================================
  ZWI:
    name: {english: "The Seal of the River", spanish: "El Sello del Río"}
    palette: "saffron, monsoon indigo, temple gold, cremation-ash grey and the cold teal concrete of a colossal dam"
    ideas:
      - id: ZWI_av_bendicion
        name: {english: "The Monsoon Smiles", spanish: "El Monzón Sonríe"}
        desc: {english: "Rain on time, rice in the bowls, and the lords too busy harvesting to fight.", spanish: "Lluvia a tiempo, arroz en los cuencos y los señores demasiado ocupados cosechando para pelear."}
        modifiers: {stability_factor: 0.05, recruitable_population_factor: 0.05, consumer_goods_factor: -0.03}
      - id: ZWI_av_maldicion
        name: {english: "The Dry Rivers", spanish: "Los Ríos Secos"}
        desc: {english: "The ghats are full of bodies and the river is not there to take them.", spanish: "Los ghats están llenos de cuerpos y el río no está para llevárselos."}
        modifiers: {stability_factor: -0.07, war_support_factor: -0.05, political_power_gain: -0.1}
      - id: ZWI_av_martir
        name: {english: "Sacred Ash", spanish: "Ceniza Sagrada"}
        desc: {english: "Soldiers smear their foreheads with the ash of the one who died for the river.", spanish: "Los soldados se untan la frente con la ceniza del que murió por el río."}
        modifiers: {war_support_factor: 0.1, army_defence_factor: 0.05}
      - id: ZWI_av_leyenda_kabir
        name: {english: "Lord of the Water", spanish: "El Señor del Agua"}
        desc: {english: "A ditch cleaner wears the crown of the rivers. The canals flow as he says.", spanish: "Un limpiador de acequias lleva la corona de los ríos. Los canales corren como él dice."}
        modifiers: {local_resources_factor: 0.1, production_speed_buildings_factor: 0.1, stability_factor: 0.05}
      - id: ZWI_av_leyenda_meera
        name: {english: "The Card-Player Heir", spanish: "La Heredera de las Cartas"}
        desc: {english: "The eleventh in line is now the first. She still cheats, but now she does it for us.", spanish: "La undécima en la línea ahora es la primera. Sigue haciendo trampa, pero ahora para nosotros."}
        modifiers: {political_power_gain: 0.2, war_support_factor: 0.05, army_org_factor: 0.05}
      - id: ZWI_av_leyenda_bhairav
        name: {english: "The River's Wedding", spanish: "La Boda del Río"}
        desc: {english: "The river is married and happy, and the monsoon never misses an anniversary.", spanish: "El río está casado y feliz, y el monzón no se olvida nunca de un aniversario."}
        modifiers: {stability_factor: 0.08, recruitable_population_factor: 0.08, monthly_population: 0.1}

    intro:
      title: {english: "The Seal of the River", spanish: "El Sello del Río"}
      desc:
        english: "Forty days ago the Directorate closed the gates of its great dam on the Brahmaputra, the one they call the Gate of Harmony. Since then the river has not come down. In Bengal the rice is dying, the fish are dying, and in the burning ghats the bodies pile up because there is no water to carry the ash.\\n\\nRani Devika Rathore has proclaimed before the Durbar that whoever opens the river will be crowned Lord of the Water. Three people have decided to try. Choose whose sandals you will wear."
        spanish: "Hace cuarenta días el Directorio cerró las compuertas de su gran represa sobre el Brahmaputra, la que llaman la Puerta de la Armonía. Desde entonces el río no baja. En Bengala se muere el arroz, se mueren los peces, y en los ghats crematorios se apilan los cuerpos porque no hay agua para llevarse la ceniza.\\n\\nLa Rani Devika Rathore proclamó ante el Durbar que quien abra el río será coronado Señor del Agua. Tres personas decidieron intentarlo. Elegí en qué sandalias te metés."
      art: "A colossal teal concrete dam carved with harmonious Chinese geometric reliefs blocking a mountain river gorge, below it a dried cracked riverbed full of stranded boats, dead fish and smoking cremation pyres; a regal Rajput queen addresses a crowd from an elephant; monumental, mythic, ominous"
    characters:
      - id: kabir
        name: {english: "Kabir Sen", spanish: "Kabir Sen"}
        pick: {english: "Kabir Sen, the Calcutta ditch diver who can hold his breath for six minutes.", spanish: "Kabir Sen, el buzo de acequias de Calcuta que aguanta seis minutos sin respirar."}
        first: 10
      - id: meera
        name: {english: "Princess Meera Rathore", spanish: "La Princesa Meera Rathore"}
        pick: {english: "Princess Meera, eleventh in line to the throne, with a mongoose and a marked deck.", spanish: "La Princesa Meera, undécima en la línea al trono, con un mangosta y una baraja marcada."}
        first: 20
      - id: bhairav
        name: {english: "Sadhu Bhairav", spanish: "El Sadhu Bhairav"}
        pick: {english: "Sadhu Bhairav, the naked ascetic who says the river is in love.", spanish: "El Sadhu Bhairav, el asceta desnudo que dice que el río está enamorado."}
        first: 30

    nodes:
      # ---------------------------------------------------------------- Kabir
      - id: 10
        who: kabir
        title: {english: "Six Minutes Without Air", spanish: "Seis Minutos Sin Aire"}
        place: [West Bengal, Bengal]
        desc:
          english: "You are Kabir Sen, diver of the drains of Calcutta. For twenty years you have unblocked canals with your hands and your lungs: six minutes underwater, in the dark, among things best not described. Now the Hooghly is a ditch of mud and dead fish, and there is nothing left to unblock.\\n\\nBut you know something nobody at the Durbar knows: the British dug drainage tunnels under the hills of Assam two centuries ago, and they run all the way up to the gorge where the Directorate built its dam."
          spanish: "Sos Kabir Sen, buzo de los desagües de Calcuta. Hace veinte años que destapás canales con las manos y los pulmones: seis minutos bajo el agua, a oscuras, entre cosas que mejor no describir. Ahora el Hooghly es una zanja de barro y peces muertos, y ya no queda nada para destapar.\\n\\nPero sabés algo que nadie en el Durbar sabe: hace dos siglos los ingleses cavaron túneles de drenaje bajo las colinas de Assam, y corren hasta el desfiladero donde el Directorio construyó su represa."
        art: "A wiry diver in a loincloth with goggles pushed up and a rope around his chest stands in a dried mud riverbed among stranded boats and dead fish, looking up at distant hills where a brick colonial tunnel mouth opens; dusk, saffron haze, epic loneliness"
        options:
          - name: {english: "Go alone, with a knife and an oil lamp.", spanish: "Ir solo, con un cuchillo y una lámpara de aceite."}
            effects: [{effect: army_experience, value: 5}]
            next: 11
          - name: {english: "Team up with the High Seas pirates waiting in the delta.", spanish: "Aliarte con los piratas de la Alta Mar que esperan en el delta."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 1500}]
            next: 12
      - id: 11
        who: kabir
        title: {english: "The Guts of the Empire", spanish: "Las Tripas del Imperio"}
        desc:
          english: "The British tunnels are still there, and so is what lives in them: crocodiles that came in during some flood a century ago and never left. They are white and blind and the size of buses, and they hunt by listening.\\n\\nYou swim silently past three of them and find a dead diver wedged in a grate, a man who tried this before you. Someone has tattooed a map on his back. A very good map. Of the dam."
          spanish: "Los túneles ingleses siguen ahí, y también lo que vive en ellos: cocodrilos que entraron en alguna inundación hace un siglo y nunca se fueron. Son blancos, ciegos y del tamaño de un colectivo, y cazan escuchando.\\n\\nPasás nadando en silencio al lado de tres y encontrás a un buzo muerto trabado en una reja, un hombre que lo intentó antes que vos. Alguien le tatuó un mapa en la espalda. Un mapa muy bueno. De la represa."
        options:
          - name: {english: "Flay the map off his back and take it.", spanish: "Despellejarle el mapa de la espalda y llevártelo."}
            skulls: 2
            next: 13
          - name: {english: "Follow the crocodiles: they always know where the water is.", spanish: "Seguir a los cocodrilos: ellos siempre saben dónde hay agua."}
            next: 14
      - id: 12
        who: kabir
        title: {english: "Tavake's Pirates", spanish: "Los Piratas de Tavake"}
        desc:
          english: "Captain Mana Tavake of the High Seas has a hydrofoil, forty pirates, a parrot drone that insults people in eleven languages, and very little patience. She wants the dam's port for the Nation's node network; you want the river. 'Same thing,' she says, 'from far away.'\\n\\nShe also has a crate of Directorate explosives she won at cards and does not know how to use. You do."
          spanish: "La Capitana Mana Tavake, de la Alta Mar, tiene un hidroala, cuarenta piratas, un loro dron que insulta en once idiomas y muy poca paciencia. Ella quiere el puerto de la represa para la red de nodos de la Nación; vos querés el río. «Es lo mismo», dice, «visto de lejos».\\n\\nTambién tiene un cajón de explosivos del Directorio que ganó a las cartas y no sabe usar. Vos sí."
        options:
          - name: {english: "Guide them through the tunnels for a share.", spanish: "Guiarlos por los túneles a cambio de una parte."}
            next: 14
          - name: {english: "Sell them to the Directorate.", spanish: "Venderlos al Directorio."}
            effects: [{effect: add_political_power, value: 60}, {effect: add_stability, value: -0.03}]
            next: 15
      - id: 13
        who: kabir
        title: {english: "The Skin Map", spanish: "El Mapa de Piel"}
        desc:
          english: "The skin map is exact: it leads to the heart of the dam, the chamber of the master wheel, guarded by four Directorate engineers in white and one robot monk who sweeps the floor and hums. It also marks, in tiny letters, the Directorate's tungsten stores under the gorge. Someone was very thorough.\\n\\nAbove you, the turbines sing. Below you, the white crocodiles are getting hungry."
          spanish: "El mapa de piel es exacto: lleva al corazón de la represa, la sala de la rueda maestra, custodiada por cuatro ingenieros del Directorio vestidos de blanco y un monje robot que barre el piso y tararea. También marca, en letra chiquita, los depósitos de tungsteno del Directorio bajo el desfiladero. Alguien fue muy minucioso.\\n\\nArriba tuyo cantan las turbinas. Abajo, los cocodrilos blancos se están poniendo hambrientos."
        options:
          - name: {english: "Go for the master wheel, and grab the tungsten on the way.", spanish: "Ir por la rueda maestra, y llevarte el tungsteno de paso."}
            effects: [{effect: capital, effects: [{effect: resource_here, resource: tungsten, amount: 10}]}]
            next: 16
          - name: {english: "Jam the dead diver's head into the intake to stall the turbine.", spanish: "Meter la cabeza del buzo muerto en la toma para trabar la turbina."}
            skulls: 3
            next: 101
          - name: {english: "Sell the map to the Rani and retire.", spanish: "Venderle el mapa a la Rani y retirarte."}
            effects: [{effect: add_political_power, value: 50}]
            next: 102
      - id: 14
        who: kabir
        title: {english: "Beneath the Dam", spanish: "Bajo la Represa"}
        desc:
          english: "However you got here, you are at the bottom of the world: the foot of the Gate of Harmony, three hundred metres of concrete over your head, the water behind it pressing so hard that the wall sings like a cello. Through a crack you can hear the engineers above, reciting flow tables like prayers.\\n\\nThere is a maintenance pipe that climbs to the control room. There are also, right here, enough Directorate explosives to make a very big decision."
          spanish: "Como sea que llegaste, estás en el fondo del mundo: al pie de la Puerta de la Armonía, trescientos metros de concreto sobre tu cabeza, el agua detrás empujando tan fuerte que el muro canta como un violonchelo. Por una grieta escuchás a los ingenieros arriba, recitando tablas de caudal como si fueran rezos.\\n\\nHay un caño de mantenimiento que sube a la sala de control. También hay, acá mismo, suficientes explosivos del Directorio para tomar una decisión muy grande."
        art: "A tiny human figure at the foot of a titanic singing concrete dam wall, cracks leaking glowing water, crates of explosives beside him, pipes climbing into darkness, white blind crocodiles in the pool behind; vertiginous scale, cosmic dread"
        options:
          - name: {english: "Climb the pipes to the control room.", spanish: "Subir por los caños hasta la sala de control."}
            next: 16
          - name: {english: "Blow the foot of the dam with whatever you have.", spanish: "Volar el pie de la represa con lo que tengas."}
            skulls: 2
            next: 17
      - id: 15
        who: kabir
        title: {english: "The Price of a Pirate", spanish: "El Precio de un Pirata"}
        desc:
          english: "The Directorate paid you in silver and in harmony: Tavake's pirates were hanged from the dam's crane in a neat, symmetrical row. The engineers were so pleased that they offered you a job: keeper of the drainage tunnels, with a uniform, a pension and an oath of Harmony.\\n\\nThe uniform fits. The oath is long. From your new office you can see the master wheel."
          spanish: "El Directorio te pagó en plata y en armonía: a los piratas de Tavake los colgaron de la grúa de la represa en una fila prolija y simétrica. Los ingenieros quedaron tan contentos que te ofrecieron un trabajo: guardián de los túneles de drenaje, con uniforme, jubilación y un juramento de Armonía.\\n\\nEl uniforme te queda bien. El juramento es largo. Desde tu oficina nueva se ve la rueda maestra."
        options:
          - name: {english: "Swear harmony and work inside the dam.", spanish: "Jurar armonía y trabajar adentro de la represa."}
            next: 17
          - name: {english: "Take the silver and buy a boat to Ceylon.", spanish: "Agarrar la plata y comprarte un barco a Ceilán."}
            effects: [{effect: add_political_power, value: 30}]
            next: 103
      - id: 16
        who: kabir
        title: {english: "The Master Wheel", spanish: "La Rueda Maestra"}
        desc:
          english: "You are at the master wheel, three metres of brass and jade. Open it and the Brahmaputra comes home. But you know rivers: the first wave will sweep away every village in the gorge below before anyone can warn them. The engineers, if they find you, will throw you into the spillway as a matter of procedure.\\n\\nThe robot monk keeps sweeping. It has seen you. It does not seem to mind."
          spanish: "Estás frente a la rueda maestra, tres metros de bronce y jade. Abrila y el Brahmaputra vuelve a casa. Pero vos conocés los ríos: la primera ola se va a llevar todos los pueblos del desfiladero antes de que nadie pueda avisarles. Los ingenieros, si te encuentran, te van a tirar al aliviadero por una cuestión de procedimiento.\\n\\nEl monje robot sigue barriendo. Te vio. No parece importarle."
        options:
          - name: {english: "Open it now. The delta cannot wait.", spanish: "Abrirla ya. El delta no puede esperar."}
            skulls: 4
            next: 104
          - name: {english: "Open it slowly, the way the engineers do.", spanish: "Abrirla despacio, como hacen los ingenieros."}
            next: 105
      - id: 17
        who: kabir
        title: {english: "The Night of the Flood", spanish: "La Noche de la Crecida"}
        desc:
          english: "Whether by explosives or by oath, tonight the dam is in your hands. The gates answer to the panel in front of you, and the panel answers to a code you know. Down in the delta, millions are waiting. Up in the Directorate's offices, so is a firing squad.\\n\\nYou could open everything and ride the wave down to Bengal. Or you could open just one gate, the one that waters Bengal, and leave the rest for diplomats."
          spanish: "Sea por los explosivos o por el juramento, esta noche la represa está en tus manos. Las compuertas responden al tablero que tenés adelante, y el tablero responde a un código que sabés. Abajo, en el delta, esperan millones. Arriba, en las oficinas del Directorio, espera un pelotón de fusilamiento.\\n\\nPodrías abrir todo y bajar con la ola hasta Bengala. O abrir solo una compuerta, la que riega Bengala, y dejar el resto para los diplomáticos."
        options:
          - name: {english: "Open everything and ride the flood downriver.", spanish: "Abrir todo y bajar con la crecida río abajo."}
            next: 106
          - name: {english: "Open only the Bengal gate and negotiate the rest.", spanish: "Abrir solo la compuerta de Bengala y negociar el resto."}
            next: 107

      # ---------------------------------------------------------------- Meera
      - id: 20
        who: meera
        title: {english: "The Eleventh Heir", spanish: "La Undécima Heredera"}
        desc:
          english: "You are Princess Meera Rathore, eleventh in line to the throne of Rajputana, which in practice means fourteenth, because three of your cousins cheat. You are losing at cards to General Dhillon when your mother, the Rani, names you envoy to the Directorate.\\n\\n'Nobody will miss you if they kill you,' she explains, kindly. Your mongoose, Bhaloo, bites the general. You consider it a good omen."
          spanish: "Sos la Princesa Meera Rathore, undécima en la línea al trono de Rajputana, que en la práctica es decimocuarta, porque tres primos hacen trampa. Estás perdiendo a las cartas con el General Dhillon cuando tu madre, la Rani, te nombra enviada ante el Directorio.\\n\\n«Nadie te va a extrañar si te matan», te explica, con cariño. Tu mangosta, Bhaloo, muerde al general. Lo tomás como un buen augurio."
        art: "A sharp-eyed young Rajput princess in jewelled silk with a mongoose on her shoulder, fanning a hand of playing cards with a sly smile, while her imperious mother the queen points at her from a peacock throne and a scowling general nurses a bitten hand; opulent, witty, ornate"
        options:
          - name: {english: "Travel with the official procession: elephants and drums.", spanish: "Viajar con la comitiva oficial: elefantes y tambores."}
            effects: [{effect: add_political_power, value: 20}]
            next: 21
          - name: {english: "Travel in disguise, with the mongoose and a marked deck.", spanish: "Viajar disfrazada, con el mangosta y una baraja marcada."}
            next: 22
      - id: 21
        who: meera
        title: {english: "The Procession", spanish: "La Comitiva"}
        desc:
          english: "Twelve elephants, forty drummers and a chef. On the third night in Bihar, the elephants start dying, one by one, foaming purple: someone poisoned the curry. Your eldest brother Vikram sends a letter of condolence that arrived suspiciously early.\\n\\nThe chef swears it was not him. The chef is shaking. There is still one pot of curry left."
          spanish: "Doce elefantes, cuarenta tamborileros y un cocinero. La tercera noche en Bihar los elefantes empiezan a morirse, uno por uno, echando espuma violeta: alguien envenenó el curry. Tu hermano mayor Vikram manda una carta de pésame que llegó sospechosamente temprano.\\n\\nEl cocinero jura que no fue él. El cocinero tiembla. Queda una olla de curry."
        options:
          - name: {english: "Taste the curry yourself: if you die, die with style.", spanish: "Probar vos el curry: si te morís, que sea con estilo."}
            effects: [{effect: add_stability, value: 0.03}, {effect: add_war_support, value: 0.03}]
            next: 23
          - name: {english: "Serve it to General Dhillon, who came along to 'protect' you.", spanish: "Servírselo al General Dhillon, que vino a «protegerte»."}
            effects: [{effect: add_political_power, value: 40}]
            skulls: 1
            next: 24
      - id: 22
        who: meera
        title: {english: "The Marked Deck", spanish: "La Baraja Marcada"}
        desc:
          english: "In a border teahouse full of Directorate officers and smugglers, you sit down at a table of Thirteen Winds with a deck you marked yourself during a very boring coronation. By dawn you have won four tea plantations, a rifle factory in Assam, and the jade seal of a Directorate inspector, who is now weeping into his dumplings.\\n\\nThe seal opens doors. Many doors. One of them, they say, is in the dam."
          spanish: "En una casa de té de frontera llena de oficiales del Directorio y contrabandistas, te sentás a una mesa de Trece Vientos con una baraja que marcaste vos misma durante una coronación muy aburrida. Al amanecer ganaste cuatro plantaciones de té, una fábrica de fusiles en Assam y el sello de jade de un inspector del Directorio, que ahora llora sobre sus empanaditas.\\n\\nEl sello abre puertas. Muchas. Una, dicen, está en la represa."
        options:
          - name: {english: "Keep the rifle factory and use the seal to enter the dam as an inspector.", spanish: "Quedarte la fábrica de fusiles y usar el sello para entrar a la represa como inspectora."}
            effects: [{effect: build, building: arms_factory, level: 1}]
            next: 24
          - name: {english: "Bet everything you won on the floodgate maps.", spanish: "Apostar todo lo ganado contra los mapas de las compuertas."}
            next: 25
      - id: 23
        who: meera
        title: {english: "The Directorate's Banquet", spanish: "El Banquete del Directorio"}
        desc:
          english: "You survived the curry (a very bad week) and arrive at the Directorate's banquet thinner and furious. Envoy Lin Haoran receives you among ice sculptures of dams. The offer is elegant: water for Bengal, in exchange for a Rathore bride for Chief Engineer Zhou Wei. You are the only Rathore present.\\n\\nYou still have, in your sleeve, a little vial of the elephants' poison. You kept it as a souvenir."
          spanish: "Sobreviviste al curry (una semana muy mala) y llegás al banquete del Directorio más flaca y furiosa. El Enviado Lin Haoran te recibe entre esculturas de hielo con forma de represa. La oferta es elegante: agua para Bengala, a cambio de una novia Rathore para el Ingeniero Jefe Zhou Wei. Sos la única Rathore presente.\\n\\nTodavía tenés, en la manga, un frasquito del veneno de los elefantes. Lo guardaste de recuerdo."
        options:
          - name: {english: "Challenge him to cards: water if you win, your head if you lose.", spanish: "Retarlo a las cartas: agua si ganás, tu cabeza si perdés."}
            next: 111
          - name: {english: "Accept the marriage and negotiate the dowry.", spanish: "Aceptar el casamiento y negociar la dote."}
            next: 26
          - name: {english: "Pour the souvenir into the envoy's tea.", spanish: "Echar el recuerdo en el té del enviado."}
            skulls: 1
            next: 112
      - id: 24
        who: meera
        title: {english: "Inside the Dam", spanish: "Adentro de la Represa"}
        desc:
          english: "One way or another, you walk into the Gate of Harmony as an honoured visitor: a world of pipes and chanting engineers, of corridors that hum and offices where nobody raises their voice. Bhaloo escapes from your sleeve into a ventilation duct, as mongooses do.\\n\\nOn the Chief Engineer's desk, unguarded for exactly as long as tea takes to steep, lies a lacquered box. You know a box of codes when you see one."
          spanish: "De una forma u otra, entrás a la Puerta de la Armonía como visitante de honor: un mundo de caños e ingenieros que canturrean, de pasillos que zumban y oficinas donde nadie levanta la voz. Bhaloo se escapa de tu manga por un conducto de ventilación, como hacen los mangostas.\\n\\nSobre el escritorio del Ingeniero Jefe, sin vigilancia exactamente lo que tarda en infusionarse un té, hay una caja laqueada. Reconocés una caja de códigos cuando la ves."
        options:
          - name: {english: "Follow the mongoose: it always finds what matters.", spanish: "Seguir al mangosta: siempre encuentra lo que importa."}
            next: 26
          - name: {english: "Steal the floodgate codes from the desk.", spanish: "Robarte los códigos de las compuertas del escritorio."}
            next: 27
      - id: 25
        who: meera
        title: {english: "The Won Map", spanish: "El Mapa Ganado"}
        desc:
          english: "You lost the plantations, won them back, lost the factory, and finally won the floodgate maps with a straight of winds. The officer who lost them reported you to the Directorate's Office of Harmony before you finished counting your chips. You are now wanted, in eleven provinces, for 'disharmonious gaming'.\\n\\nYour eldest brother Vikram, of all people, sends word: he wants to talk."
          spanish: "Perdiste las plantaciones, las recuperaste, perdiste la fábrica y al final ganaste los mapas de las compuertas con una escalera de vientos. El oficial que los perdió te denunció ante la Oficina de Armonía del Directorio antes de que terminaras de contar las fichas. Ahora te buscan en once provincias por «juego desarmónico».\\n\\nTu hermano mayor Vikram, justo él, te manda un mensaje: quiere hablar."
        options:
          - name: {english: "Take the map to Vikram and negotiate with him.", spanish: "Llevarle el mapa a Vikram y negociar con él."}
            next: 27
          - name: {english: "Sell it to the High Seas pirates.", spanish: "Vendérselo a los piratas de la Alta Mar."}
            effects: [{effect: add_political_power, value: 50}]
            next: 113
      - id: 26
        who: meera
        title: {english: "The Audience with Zhou", spanish: "La Audiencia con Zhou"}
        desc:
          english: "Wherever the road twisted, it ends here: Chief Engineer Zhou Wei receives you in person, in a garden of stone where water runs uphill. He loves cards. He proposes one game, the old way: if you win, the gates open for a generation. If you lose, you stay here as his guest, for life, which in the Directorate is a long time.\\n\\nBhaloo sits on the table, staring at the deck."
          spanish: "Por donde sea que se torció el camino, termina acá: el Ingeniero Jefe Zhou Wei te recibe en persona, en un jardín de piedra donde el agua corre cuesta arriba. Le encantan las cartas. Propone una partida, a la antigua: si ganás, las compuertas se abren por una generación. Si perdés, te quedás como su huésped, de por vida, que en el Directorio es mucho tiempo.\\n\\nBhaloo se sienta en la mesa, mirando la baraja."
        art: "In a surreal stone garden where water flows uphill, a calm Chinese chief engineer in white and a Rajput princess play cards across a jade table, a mongoose standing on the table staring at the deck; serene, tense, dreamlike geometry"
        options:
          - name: {english: "Play with the marked deck.", spanish: "Jugar con la baraja marcada."}
            next: 114
          - name: {english: "Let the mongoose choose the card.", spanish: "Dejar que el mangosta elija la carta."}
            next: 115
      - id: 27
        who: meera
        title: {english: "The Codes", spanish: "Los Códigos"}
        desc:
          english: "You have the codes. Whoever enters them on the old radio transmitter at the temple of Kamakhya opens the gates of the Gate of Harmony, from a hundred kilometres away. Unfortunately, your brother Vikram knows this too, and has surrounded the temple with three hundred men and the last elephant of the procession.\\n\\nHe offers a deal: the codes for a duchy. He will open the river himself, and be crowned for it."
          spanish: "Tenés los códigos. Quien los ingrese en el viejo transmisor de radio del templo de Kamakhya abre las compuertas de la Puerta de la Armonía a cien kilómetros. Lamentablemente, tu hermano Vikram también lo sabe, y rodeó el templo con trescientos hombres y el último elefante de la comitiva.\\n\\nTe ofrece un trato: los códigos por un ducado. Él abre el río, y lo coronan a él."
        options:
          - name: {english: "Open the gates yourself from the temple radio.", spanish: "Abrir las compuertas vos misma desde la radio del templo."}
            skulls: 2
            next: 116
          - name: {english: "Give Vikram the codes in exchange for a duchy.", spanish: "Darle los códigos a Vikram a cambio de un ducado."}
            next: 117

      # ---------------------------------------------------------------- Bhairav
      - id: 30
        who: bhairav
        title: {english: "The Ash Man", spanish: "El Hombre de Ceniza"}
        desc:
          english: "You are Sadhu Bhairav. You have not sat down in nineteen years, you wear nothing but the ash of the dead, and you understand the river. The Brahmaputra did not stop because of the Directorate, you explain to anyone who will listen. It stopped because it fell in love with the dam.\\n\\nRivers are like that. The solution is obvious: a proper wedding. You will marry them. Nobody else at the Durbar has a plan this good."
          spanish: "Sos el Sadhu Bhairav. Hace diecinueve años que no te sentás, no usás más que la ceniza de los muertos y entendés al río. El Brahmaputra no se detuvo por el Directorio, le explicás a quien quiera escuchar. Se detuvo porque se enamoró de la represa.\\n\\nLos ríos son así. La solución es obvia: una boda como corresponde. Los vas a casar. Nadie más en el Durbar tiene un plan tan bueno."
        art: "A gaunt naked ascetic covered head to toe in pale cremation ash, with matted dreadlocks piled high and a trident, standing upright on a cracked riverbed and lecturing a skeptical crowd while pointing at a distant colossal dam; surreal, holy, comic"
        options:
          - name: {english: "Walk to the dam, without sitting down, as always.", spanish: "Caminar hasta la represa, sin sentarte, como siempre."}
            next: 31
          - name: {english: "Beg alms in Benares to buy a wedding present.", spanish: "Pedir limosna en Benarés para comprar un regalo de bodas."}
            effects: [{effect: add_political_power, value: 15}]
            next: 32
      - id: 31
        who: bhairav
        title: {english: "The Ghat of the Dead", spanish: "El Ghat de los Muertos"}
        desc:
          english: "On the road you pass the burning ghats of Patna. Without the river, the bodies wait in rows under the sun for wood that is too expensive and water that is not there. The dogs are fat. The priests are thin.\\n\\nA wedding needs a godfather, and the dead here have nothing better to do. Also, under the oldest ghat, the priests whisper, the British left something: a sealed engine room 'that still hums'."
          spanish: "En el camino pasás por los ghats crematorios de Patna. Sin el río, los cuerpos esperan en filas bajo el sol una leña demasiado cara y un agua que no está. Los perros están gordos. Los sacerdotes, flacos.\\n\\nUna boda necesita un padrino, y los muertos de acá no tienen nada mejor que hacer. Además, bajo el ghat más viejo, susurran los sacerdotes, los ingleses dejaron algo: una sala de máquinas sellada «que todavía zumba»."
        options:
          - name: {english: "Carry one of the dead as the groom's godfather.", spanish: "Cargar a uno de los muertos como padrino del novio."}
            skulls: 1
            next: 33
          - name: {english: "Open the humming room and use it to light every pyre.", spanish: "Abrir la sala que zumba y usarla para encender todas las piras."}
            effects: [{effect: build, building: industrial_complex, level: 2}, {effect: add_stability, value: 0.04}]
            next: 34
      - id: 32
        who: bhairav
        title: {english: "The Alms", spanish: "La Limosna"}
        desc:
          english: "In Benares the merchant Lala Gupta, the richest man east of Kanpur, drops a diamond the size of a quail's egg into your bowl. In exchange he wants a blessing for his son's war against the lord of Varanasi, which is about a boundary stone and a goat.\\n\\nThe diamond is beautiful. The goat is, by all accounts, very ordinary."
          spanish: "En Benarés el mercader Lala Gupta, el hombre más rico al este de Kanpur, te tira en el cuenco un diamante del tamaño de un huevo de codorniz. A cambio quiere una bendición para la guerra de su hijo contra el señor de Varanasi, que es por un mojón y una cabra.\\n\\nEl diamante es hermoso. La cabra, según todos, es muy común."
        options:
          - name: {english: "Bless the son's war.", spanish: "Bendecir la guerra del hijo."}
            effects: [{effect: add_war_support, value: 0.06}, {effect: add_manpower, value: 10000}]
            next: 34
          - name: {english: "Curse the merchant and keep the diamond.", spanish: "Maldecir al mercader y quedarte el diamante."}
            next: 35
      - id: 33
        who: bhairav
        title: {english: "The Dead Godfather", spanish: "El Padrino Muerto"}
        desc:
          english: "You carry the godfather on your back for two hundred kilometres. On the third day he starts to talk back. You are not surprised; the dead are chatty. You are slightly surprised when he asks, in perfect Mandarin, for your destination and estimated time of arrival.\\n\\nOn closer inspection, the godfather's chest contains a Directorate surveillance unit, a battery and quite a lot of explosive."
          spanish: "Cargás al padrino en la espalda durante doscientos kilómetros. Al tercer día empieza a contestarte. No te sorprende; los muertos son charlatanes. Te sorprende un poco cuando te pregunta, en mandarín perfecto, tu destino y la hora estimada de llegada.\\n\\nMirándolo de cerca, el pecho del padrino contiene una unidad de vigilancia del Directorio, una batería y bastante explosivo."
        options:
          - name: {english: "Debate theology with the corpse.", spanish: "Discutir teología con el cadáver."}
            next: 121
          - name: {english: "Smash its head and use the parts as dowry.", spanish: "Romperle la cabeza y usar las piezas como dote."}
            effects: [{effect: tech_bonus, category: industry, bonus: 0.5, uses: 1}]
            skulls: 1
            next: 36
      - id: 34
        who: bhairav
        title: {english: "At the Foot of the Wall", spanish: "Al Pie del Muro"}
        desc:
          english: "However you came, you arrive at the foot of the Gate of Harmony followed by four thousand pilgrims covered in ash, a brass band, two cows and a godfather of questionable status. The Directorate engineers watch from the parapet, three hundred metres up, taking photographs.\\n\\nThe dam is grey and enormous and does not look like it is in love with anyone. You look at it tenderly anyway."
          spanish: "Como sea que viniste, llegás al pie de la Puerta de la Armonía seguido por cuatro mil peregrinos cubiertos de ceniza, una banda de bronces, dos vacas y un padrino de estado dudoso. Los ingenieros del Directorio miran desde el parapeto, trescientos metros arriba, sacando fotos.\\n\\nLa represa es gris y enorme y no parece enamorada de nadie. Igual la mirás con ternura."
        options:
          - name: {english: "Hold the wedding now, shouting, at the foot of the wall.", spanish: "Celebrar la boda ya, a los gritos, al pie del muro."}
            effects: [{effect: add_manpower, value: 8000}]
            next: 36
          - name: {english: "Sit down for the first time in nineteen years, and wait.", spanish: "Sentarte por primera vez en diecinueve años, y esperar."}
            next: 122
      - id: 35
        who: bhairav
        title: {english: "The Cursed Diamond", spanish: "El Diamante Maldito"}
        desc:
          english: "Lala Gupta takes the curse personally, which is fair, since you named him in it. His son's war is now against you, and against the goat, which has inexplicably taken your side. Forty horsemen chase a naked man and a goat across the plain of the Ganges.\\n\\nThe diamond burns in your fist. Or maybe that is the curse coming back."
          spanish: "Lala Gupta se toma la maldición como algo personal, lo cual es justo, porque lo nombraste en ella. La guerra de su hijo ahora es contra vos, y contra la cabra, que inexplicablemente se puso de tu lado. Cuarenta jinetes persiguen a un hombre desnudo y una cabra por la llanura del Ganges.\\n\\nEl diamante te quema en el puño. O a lo mejor es la maldición que vuelve."
        options:
          - name: {english: "Swallow the diamond.", spanish: "Tragarte el diamante."}
            next: 123
          - name: {english: "Give it to the dry river, as a wedding gift.", spanish: "Regalárselo al río seco, como presente de bodas."}
            next: 124
      - id: 36
        who: bhairav
        title: {english: "The River's Wedding", spanish: "La Boda del Río"}
        desc:
          english: "The ceremony takes place on the crest of the dam, because the engineers, amused, opened the gate for the pilgrims. A Directorate choir sings, a little ironically. The bride is three hundred metres of concrete; the groom is a dry riverbed; you are the priest.\\n\\nThe sky over the Himalaya turns the colour of a bruise. The air smells of rain for the first time in forty days. It is time for the vows."
          spanish: "La ceremonia es en la cresta de la represa, porque los ingenieros, divertidos, les abrieron la reja a los peregrinos. Canta un coro del Directorio, un poquito irónico. La novia son trescientos metros de concreto; el novio, un cauce seco; el sacerdote, vos.\\n\\nEl cielo sobre el Himalaya se pone del color de un moretón. Por primera vez en cuarenta días, el aire huele a lluvia. Es hora de los votos."
        options:
          - name: {english: "Speak the vows: 'Let the water go home'.", spanish: "Pronunciar los votos: «Que el agua vuelva a su casa»."}
            next: 125
          - name: {english: "Throw yourself into the void as an offering.", spanish: "Tirarte al vacío como ofrenda."}
            skulls: 2
            next: 126

    endings:
      # ---------------------------------------------------------------- Kabir
      - id: 101
        who: kabir
        kind: muerte
        title: {english: "The Turbine", spanish: "La Turbina"}
        desc:
          english: "The dead diver's head stalled the turbine for exactly four seconds. Then the turbine spat it out, along with Kabir Sen, who was holding it, at roughly the speed of sound. The intake did the rest. It was not a pretty four seconds.\\n\\nBut the stall cracked a gate, and for a week a thin stream of the Brahmaputra ran down to Bengal. The delta's fishermen named the stream after him. It dried up in eight days. The name stayed."
          spanish: "La cabeza del buzo muerto trabó la turbina exactamente cuatro segundos. Después la turbina la escupió, junto con Kabir Sen, que la estaba sosteniendo, a más o menos la velocidad del sonido. La toma hizo el resto. No fueron cuatro segundos lindos.\\n\\nPero el atascamiento rajó una compuerta, y durante una semana un hilo del Brahmaputra bajó hasta Bengala. Los pescadores del delta le pusieron su nombre al hilo. Se secó en ocho días. El nombre quedó."
        art: "Inside a vast turbine hall, a gigantic spinning turbine spits a spray of water, blood and debris as a tiny diver is pulled into its intake vortex; a thin silver stream escapes through a cracked gate toward a distant green delta; brutal, sublime"
        effects: [{effect: timed_idea, idea: ZWI_av_martir, days: 365}, {effect: add_stability, value: -0.03}]
        close: {english: "Six minutes was not enough.", spanish: "Seis minutos no alcanzaron."}
      - id: 102
        who: kabir
        kind: negativo
        title: {english: "The Rani's Flood", spanish: "La Crecida de la Rani"}
        desc:
          english: "The Rani paid well and planned badly. Her engineers followed the skin map backwards, blew the wrong gate, and released the river not into Bengal but into the valley where her own army was camped. Eleven thousand soldiers learned to swim at once; most failed the course.\\n\\nThe Directorate repaired the gate in a week, closed the river again, tighter, and sent a very courteous letter: sabotaging the Gate of Harmony is an act of war, and Harmony, regrettably, must be restored. Its columns are already coming down the Himalayan passes. Kabir drinks in Calcutta and does not talk about maps."
          spanish: "La Rani pagó bien y planificó mal. Sus ingenieros siguieron el mapa de piel al revés, volaron la compuerta equivocada y largaron el río no hacia Bengala sino hacia el valle donde acampaba su propio ejército. Once mil soldados aprendieron a nadar a la vez; la mayoría no aprobó el curso.\\n\\nEl Directorio arregló la compuerta en una semana, volvió a cerrar el río, más fuerte, y mandó una carta muy cortés: el sabotaje de la Puerta de la Armonía es un acto de guerra, y la Armonía, lamentablemente, tiene que restablecerse. Sus columnas ya bajan por los pasos del Himalaya. Kabir toma en Calcuta y no habla de mapas."
        effects: [{effect: timed_idea, idea: ZWI_av_maldicion, days: 365}, {effect: add_manpower, value: -15000}, {effect: add_stability, value: -0.05}]
        catastrophe: {war_by: SHD}   # catastrófico: la Armonía se restablece a cañonazos
        close: {english: "Upside down.", spanish: "Al revés."}
      - id: 103
        who: kabir
        kind: neutral
        title: {english: "A Boat to Ceylon", spanish: "Un Barco a Ceilán"}
        desc:
          english: "Kabir Sen bought a small boat, sailed to Ceylon and opened a diving school for tourists of the High Seas, who pay to see coral that is mostly dead. He is good at it. He never goes deeper than five metres.\\n\\nThe river stayed closed until the Directorate decided otherwise, for its own reasons, on its own schedule. Bengal survived, as it always does, a little thinner."
          spanish: "Kabir Sen se compró un barquito, navegó hasta Ceilán y abrió una escuela de buceo para turistas de la Alta Mar, que pagan por ver coral mayormente muerto. Es bueno en eso. Nunca baja más de cinco metros.\\n\\nEl río siguió cerrado hasta que el Directorio decidió otra cosa, por sus razones, a su ritmo. Bengala sobrevivió, como siempre, un poco más flaca."
        effects: [{effect: add_political_power, value: 10}]
        close: {english: "Five metres, no more.", spanish: "Cinco metros, no más."}
      - id: 104
        who: kabir
        kind: objetivo
        title: {english: "Lord of the Water", spanish: "El Señor del Agua"}
        desc:
          english: "Kabir turned the master wheel and the Brahmaputra came home roaring. The first wave did sweep the gorge villages away; the Directorate sent its condolences and an invoice. But the delta drank, the rice stood up, and in Calcutta the canals ran full for the first time in a generation.\\n\\nBefore the Durbar, with the river behind him, Rani Devika crowned a ditch diver Lord of the Water. He still unblocks canals himself sometimes, crown and all, because he likes it."
          spanish: "Kabir giró la rueda maestra y el Brahmaputra volvió a casa rugiendo. La primera ola sí se llevó los pueblos del desfiladero; el Directorio mandó sus condolencias y una factura. Pero el delta bebió, el arroz se paró, y en Calcuta los canales corrieron llenos por primera vez en una generación.\\n\\nAnte el Durbar, con el río a sus espaldas, la Rani Devika coronó Señor del Agua a un buzo de acequias. Todavía destapa canales él mismo a veces, con corona y todo, porque le gusta."
        art: "A humble diver in a loincloth wearing a jewelled crown of water lilies stands triumphant on a riverbank as a colossal roaring wave of the returning river bursts through a cracked dam behind him, flooding a parched delta into green; heroic, mythic, ecstatic"
        effects:
          - {effect: add_ideas, value: ZWI_av_leyenda_kabir}
          - {effect: add_political_power, value: 150}
          - {effect: add_manpower, value: 80000}
          - {effect: build, building: industrial_complex, level: 2}
          - {effect: build, building: infrastructure, level: 2}
          - {effect: ensure_template, name: "Guardia del Río", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Guardia del Río", name: "Guardia del Río", count: 2, experience: 0.3}
        close: {english: "The water is home.", spanish: "El agua está en casa."}
      - id: 105
        who: kabir
        kind: muerte
        title: {english: "The Spillway", spanish: "El Aliviadero"}
        desc:
          english: "Kabir opened the wheel slowly, a quarter turn at a time, as the engineers do. It took three hours. In the third hour the engineers came back from tea, found him, filled in a form, and threw him down the spillway, three hundred metres, as a matter of procedure.\\n\\nThey did not close the wheel afterwards, because the form for that was different. The gates stayed half open for a whole season. Half a river is a lot of river."
          spanish: "Kabir abrió la rueda despacio, de a cuarto de vuelta, como hacen los ingenieros. Tardó tres horas. En la tercera hora los ingenieros volvieron del té, lo encontraron, llenaron un formulario y lo tiraron por el aliviadero, trescientos metros, por una cuestión de procedimiento.\\n\\nDespués no cerraron la rueda, porque el formulario para eso era otro. Las compuertas quedaron medio abiertas toda una estación. Medio río es mucho río."
        art: "Bureaucratic engineers in white robes with clipboards casually tossing a struggling man over the lip of a towering dam spillway into a misty abyss, while water gushes from half-open gates; absurd, cruel, vertiginous"
        effects: [{effect: timed_idea, idea: ZWI_av_martir, days: 365}, {effect: timed_idea, idea: ZWI_av_bendicion, days: 180}]
        close: {english: "Form 27-B, filed.", spanish: "Formulario 27-B, archivado."}
      - id: 106
        who: kabir
        kind: positivo
        title: {english: "Riding the Flood", spanish: "Montado en la Crecida"}
        desc:
          english: "Kabir opened every gate and jumped. He rode the flood down the gorge on a Directorate door, all the way to the plains, where the wave lost its strength and left him in a rice paddy in Assam, alive, naked and laughing. The Directorate closed the gates again within a month, but a month of river was enough for a harvest.\\n\\nThe Rani did not crown him; he had not technically opened the river for good. She gave him a palace instead. He uses it to dry fish."
          spanish: "Kabir abrió todas las compuertas y saltó. Bajó la crecida por el desfiladero montado en una puerta del Directorio, hasta la llanura, donde la ola perdió fuerza y lo dejó en un arrozal de Assam, vivo, desnudo y riéndose. El Directorio volvió a cerrar a fin de mes, pero un mes de río alcanzó para una cosecha.\\n\\nLa Rani no lo coronó; técnicamente no había abierto el río para siempre. Le dio un palacio. Lo usa para secar pescado."
        effects: [{effect: timed_idea, idea: ZWI_av_bendicion, days: 365}, {effect: add_manpower, value: 30000}, {effect: add_political_power, value: 50}]
        close: {english: "Surf's up.", spanish: "Ola va."}
      - id: 107
        who: kabir
        kind: positivo
        title: {english: "The Bengal Gate", spanish: "La Compuerta de Bengala"}
        desc:
          english: "Kabir opened only the Bengal gate and then, with the dam half his, called the Directorate on its own phone. The negotiation lasted nine days. The result, the Treaty of the Gorge, gives Bengal a fixed quota of water every season, written in a contract that the Directorate, being the Directorate, will actually respect.\\n\\nIt is not the whole river. It is enough river. Kabir now sits on the Durbar's water council, which meets in a canal, at his request."
          spanish: "Kabir abrió solo la compuerta de Bengala y después, con media represa en sus manos, llamó al Directorio por su propio teléfono. La negociación duró nueve días. El resultado, el Tratado del Desfiladero, le da a Bengala una cuota fija de agua cada estación, escrita en un contrato que el Directorio, por ser el Directorio, va a respetar de verdad.\\n\\nNo es todo el río. Es suficiente río. Kabir ahora integra el consejo del agua del Durbar, que se reúne en un canal, a pedido suyo."
        effects: [{effect: timed_idea, idea: ZWI_av_bendicion, days: 730}, {effect: add_political_power, value: 75}, {effect: build, building: infrastructure, level: 2}]
        close: {english: "Signed in triplicate.", spanish: "Firmado por triplicado."}
      # ---------------------------------------------------------------- Meera
      - id: 111
        who: meera
        kind: muerte
        title: {english: "The First Loss", spanish: "La Primera Derrota"}
        desc:
          english: "Envoy Lin Haoran accepted, shuffled, and dealt. Meera Rathore, who had never lost an honest game because she had never played one, lost her first honest game. The Directorate, which keeps its word, kept it.\\n\\nHer head came home in a lacquered box with a thank-you card in very good calligraphy. Bhaloo the mongoose came home on his own, three months later, and bit Prince Vikram on arrival. The court considered it a judgment."
          spanish: "El Enviado Lin Haoran aceptó, mezcló y repartió. Meera Rathore, que nunca había perdido una partida honesta porque nunca había jugado una, perdió su primera partida honesta. El Directorio, que cumple su palabra, la cumplió.\\n\\nSu cabeza volvió a casa en una caja laqueada con una tarjeta de agradecimiento en muy buena caligrafía. Bhaloo, el mangosta, volvió solo tres meses después, y al llegar mordió al Príncipe Vikram. La corte lo consideró un juicio."
        art: "An exquisite black lacquered box with gold harmony patterns sits on a silk cushion before a grieving Rajput court, a calligraphed thank-you card on top, a mongoose glaring at a nervous prince; elegant, macabre, darkly funny"
        effects: [{effect: timed_idea, idea: ZWI_av_martir, days: 365}, {effect: add_political_power, value: -50}]
        close: {english: "Fold.", spanish: "Me retiro."}
      - id: 112
        who: meera
        kind: objetivo
        title: {english: "The Souvenir", spanish: "El Recuerdo"}
        desc:
          english: "Envoy Lin Haoran foamed purple at the dessert course, like the elephants. His deputy, a nervous young man who had seen everything, signed the water treaty Meera dictated before the body was cold, and asked only to be allowed to go home.\\n\\nThe gates opened. Meera returned to the Durbar on the last elephant, which had survived out of pure spite. The Rani looked at her eleventh child for a long time, and then named her heir. Ten siblings have since discovered a sudden interest in monastic life."
          spanish: "El Enviado Lin Haoran echó espuma violeta en el postre, como los elefantes. Su segundo, un joven nervioso que lo había visto todo, firmó el tratado del agua que Meera le dictó antes de que el cuerpo se enfriara, y solo pidió que lo dejaran volver a casa.\\n\\nLas compuertas se abrieron. Meera volvió al Durbar en el último elefante, que había sobrevivido de puro rencor. La Rani miró a su undécima hija un largo rato y después la nombró heredera. Diez hermanos descubrieron desde entonces un repentino interés por la vida monástica."
        art: "A smiling princess rides into a palace courtyard on the last surviving elephant, carrying a signed scroll sealed in jade, as courtiers bow and ten jealous siblings in monk robes slink away; behind, a river glints silver again; triumphant, wicked, ornate"
        effects:
          - {effect: add_ideas, value: ZWI_av_leyenda_meera}
          - {effect: add_political_power, value: 150}
          - {effect: add_stability, value: 0.08}
          - {effect: build, building: arms_factory, level: 2}
          - {effect: ensure_template, name: "Guardia del Río", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Guardia del Río", name: "Lanceros de Rajputana", count: 2, experience: 0.4}
        close: {english: "Long live the heir.", spanish: "Larga vida a la heredera."}
      - id: 113
        who: meera
        kind: negativo
        title: {english: "The Pirates' Delta", spanish: "El Delta de los Piratas"}
        desc:
          english: "The High Seas pirates paid in pearls and used the map perfectly: they did not open the river, they took the delta's ports while the Durbar was looking at the dam. Captain Tavake now collects tolls on every rice barge in Bengal, and her parrot insults the customs officers in Hindi.\\n\\nMeera lives in Macau on the pearls. Nobody at home says her name. The river stayed shut."
          spanish: "Los piratas de la Alta Mar pagaron en perlas y usaron el mapa a la perfección: no abrieron el río, tomaron los puertos del delta mientras el Durbar miraba la represa. La Capitana Tavake ahora cobra peaje a cada barcaza de arroz de Bengala, y su loro insulta a los aduaneros en hindi.\\n\\nMeera vive en Macao de las perlas. En casa nadie dice su nombre. El río siguió cerrado."
        effects: [{effect: timed_idea, idea: ZWI_av_maldicion, days: 365}, {effect: add_stability, value: -0.06}, {effect: add_political_power, value: -50}]
        close: {english: "Pieces of eight.", spanish: "Piezas de a ocho."}
      - id: 114
        who: meera
        kind: neutral
        title: {english: "A Draw", spanish: "Tablas"}
        desc:
          english: "Zhou Wei had marked the deck too. He had marked it first, in fact, which is why he suggested it. The game ended in a perfect draw, which delighted him beyond words: harmony. He let Meera go home with a jade tile as a souvenir and nothing else.\\n\\nThe river stayed exactly as the Directorate wanted it. Meera returned to the Durbar and to her place in line, eleventh, and to her card table, where she now loses on purpose, sometimes, to keep in practice."
          spanish: "Zhou Wei también había marcado la baraja. La había marcado antes, de hecho, por eso la propuso. La partida terminó en tablas perfectas, cosa que lo deleitó más allá de las palabras: armonía. Dejó que Meera volviera a casa con una ficha de jade de recuerdo y nada más.\\n\\nEl río quedó exactamente como el Directorio quería. Meera volvió al Durbar y a su lugar en la fila, undécima, y a su mesa de cartas, donde ahora pierde a propósito, a veces, para no perder la práctica."
        effects: [{effect: add_political_power, value: 15}]
        close: {english: "Well played.", spanish: "Bien jugado."}
      - id: 115
        who: meera
        kind: objetivo
        title: {english: "The Mongoose's Card", spanish: "La Carta del Mangosta"}
        desc:
          english: "Bhaloo walked across the deck, sniffed every card, and sat on one. Zhou Wei, who had marked every card in the deck except, apparently, that one, turned it over and laughed until he cried. The gates of the Gate of Harmony opened for a generation, as promised.\\n\\nThe Rani named Meera heir the day she returned. The mongoose has a title too, and a small palace, and the right to bite any general it wants. It uses it often."
          spanish: "Bhaloo caminó por la baraja, olió cada carta y se sentó sobre una. Zhou Wei, que había marcado todas las cartas del mazo salvo, aparentemente, esa, la dio vuelta y se rió hasta llorar. Las compuertas de la Puerta de la Armonía se abrieron por una generación, como había prometido.\\n\\nLa Rani nombró heredera a Meera el día que volvió. El mangosta también tiene título, y un palacio chico, y el derecho de morder al general que quiera. Lo usa seguido."
        effects:
          - {effect: add_ideas, value: ZWI_av_leyenda_meera}
          - {effect: add_political_power, value: 120}
          - {effect: add_manpower, value: 60000}
          - {effect: timed_idea, idea: ZWI_av_bendicion, days: 365}
          - {effect: build, building: industrial_complex, level: 2}
        close: {english: "The mongoose wins.", spanish: "Gana el mangosta."}
      - id: 116
        who: meera
        kind: muerte
        title: {english: "The Last Elephant", spanish: "El Último Elefante"}
        desc:
          english: "Meera locked herself in the temple radio room and entered the codes while Vikram's men broke down the door. The gates opened on the last digit. Then Vikram sent in the last elephant of the procession, the one that had survived the curry, and it was in a very bad mood.\\n\\nThe river came home that night. Meera did not. Vikram was crowned heir for the opening of the river, and has never once slept without guards since, because of the mongoose."
          spanish: "Meera se encerró en la sala de radio del templo e ingresó los códigos mientras los hombres de Vikram tiraban la puerta abajo. Las compuertas se abrieron con el último dígito. Entonces Vikram mandó adentro al último elefante de la comitiva, el que había sobrevivido al curry, y estaba de muy mal humor.\\n\\nEl río volvió a casa esa noche. Meera no. A Vikram lo coronaron heredero por la apertura del río, y desde entonces no duerme ni una noche sin guardias, por el mangosta."
        art: "Inside an ancient temple radio room, a princess slams her hand on a glowing transmitter key as a furious armoured elephant smashes through the carved doorway; far away through the window a dam's gates burst open in moonlight; tragic, explosive, epic"
        effects: [{effect: timed_idea, idea: ZWI_av_martir, days: 365}, {effect: timed_idea, idea: ZWI_av_bendicion, days: 365}, {effect: add_stability, value: -0.03}]
        close: {english: "The river came home.", spanish: "El río volvió."}
      - id: 117
        who: meera
        kind: positivo
        title: {english: "The Duchess of Assam", spanish: "La Duquesa de Assam"}
        desc:
          english: "Vikram got the codes, opened the river and was crowned heir, as planned. Meera got the duchy of Assam, as promised, which includes four tea plantations, a casino and the only bridge over the Brahmaputra that the Directorate did not bomb.\\n\\nShe charges tolls on it. Rich, untouchable and bored, the Duchess of Assam is now the most dangerous card player in the subcontinent. Vikram does not visit."
          spanish: "Vikram se quedó con los códigos, abrió el río y lo coronaron heredero, como estaba previsto. Meera se quedó con el ducado de Assam, como estaba prometido, que incluye cuatro plantaciones de té, un casino y el único puente sobre el Brahmaputra que el Directorio no bombardeó.\\n\\nCobra peaje. Rica, intocable y aburrida, la Duquesa de Assam es ahora la jugadora de cartas más peligrosa del subcontinente. Vikram no la visita."
        effects: [{effect: timed_idea, idea: ZWI_av_bendicion, days: 365}, {effect: add_political_power, value: 75}, {effect: build, building: industrial_complex, level: 1}, {effect: add_manpower, value: 20000}]
        close: {english: "The house edge.", spanish: "La ventaja de la casa."}
      # ---------------------------------------------------------------- Bhairav
      - id: 121
        who: bhairav
        kind: muerte
        title: {english: "Finally Seated", spanish: "Por Fin Sentado"}
        desc:
          english: "The theological debate went well until Bhairav argued that the soul is indivisible. The Directorate drone inside the corpse took this as a challenge to its programming and detonated, to demonstrate otherwise.\\n\\nAfter nineteen years standing, Sadhu Bhairav finally sat down, in several places at once. His followers collected the ash, which was easy, because he had been mostly ash already. They say that on windy days it still lectures."
          spanish: "El debate teológico iba bien hasta que Bhairav sostuvo que el alma es indivisible. El dron del Directorio que estaba adentro del cadáver lo tomó como un desafío a su programación y detonó, para demostrar lo contrario.\\n\\nDespués de diecinueve años de pie, el Sadhu Bhairav por fin se sentó, en varios lugares a la vez. Sus seguidores juntaron la ceniza, cosa fácil, porque ya era casi todo ceniza. Dicen que los días de viento todavía da sermones."
        art: "A comic-horror explosion of pale ash and mechanical parts bursting from a corpse carried on an ascetic's back, the ascetic's trident and dreadlocks flying apart in a mandala of grey dust against a saffron sunset; absurd, gory, sacred"
        effects: [{effect: add_stability, value: -0.02}, {effect: add_war_support, value: 0.03}]
        close: {english: "Indivisible, he said.", spanish: "Indivisible, dijo."}
      - id: 122
        who: bhairav
        kind: neutral
        title: {english: "The Seated Sadhu", spanish: "El Sadhu Sentado"}
        desc:
          english: "Bhairav sat down at the foot of the dam and did not get up again. Nothing happened. Then nothing happened for a long time. The Directorate engineers began bringing him tea; tourists began coming to photograph the man who waits for the river.\\n\\nThe river did not come. Bhairav did not leave. He has become, against his will, a Directorate attraction with a little gift shop. He has not complained, because complaining would mean standing up."
          spanish: "Bhairav se sentó al pie de la represa y no se levantó más. No pasó nada. Después no pasó nada durante mucho tiempo. Los ingenieros del Directorio empezaron a llevarle té; los turistas, a venir a fotografiar al hombre que espera al río.\\n\\nEl río no vino. Bhairav no se fue. Se convirtió, contra su voluntad, en una atracción del Directorio con una pequeña tienda de regalos. No se quejó, porque quejarse sería pararse."
        effects: [{effect: add_political_power, value: 10}, {effect: add_stability, value: -0.01}]
        close: {english: "Gift shop to the left.", spanish: "La tienda de regalos, a la izquierda."}
      - id: 123
        who: bhairav
        kind: negativo
        title: {english: "The Holy War of the Goat", spanish: "La Guerra Santa de la Cabra"}
        desc:
          english: "Bhairav swallowed the diamond and Lala Gupta declared a holy war to recover it, by any means, including the obvious one. The lords of the Ganges took sides: for the merchant, for the sadhu, and in one case for the goat. The war has burned forty villages, and the goat's side won the battle of Benares. Now the goat has a throne, a flag and an army that does not obey the Durbar.\\n\\nBhairav survived, hidden in a temple, with a terrible stomach ache. The diamond reappeared after nine days. Nobody wanted it any more: the goat had become far more important."
          spanish: "Bhairav se tragó el diamante y Lala Gupta declaró una guerra santa para recuperarlo, por cualquier medio, incluido el obvio. Los señores del Ganges eligieron bando: por el mercader, por el sadhu y, en un caso, por la cabra. La guerra ya quemó cuarenta pueblos, y el bando de la cabra ganó la batalla de Benarés. Ahora la cabra tiene trono, bandera y un ejército que no le obedece al Durbar.\\n\\nBhairav sobrevivió, escondido en un templo, con un dolor de panza terrible. El diamante reapareció a los nueve días. Ya nadie lo quería: la cabra se había vuelto mucho más importante."
        effects: [{effect: timed_idea, idea: ZWI_av_maldicion, days: 365}, {effect: add_stability, value: -0.08}, {effect: add_manpower, value: -20000}]
        # catastrófico y absurdo: rebelión de la cabra
        catastrophe:
          rebellion:
            cosmetic_tag: ZWI_CABRA
            ideology: fascism
            size: 0.2
            leader: {english: "His Holiness the Goat", spanish: "Su Santidad la Cabra"}
        close: {english: "For the goat!", spanish: "¡Por la cabra!"}
      - id: 124
        who: bhairav
        kind: positivo
        title: {english: "The River's Gift", spanish: "El Regalo del Río"}
        desc:
          english: "Bhairav dropped the diamond into the dry bed of the Ganges as a wedding gift and walked on. A girl from Mirzapur found it the next morning, sold it in Patna, and with the money bought eight water tankers and a well drill for her village.\\n\\nThe village became a town, and the town became the richest on the dry river. They have built a shrine to the naked man who threw away a fortune. The goat lives there, very well fed."
          spanish: "Bhairav tiró el diamante en el cauce seco del Ganges como regalo de bodas y siguió caminando. Una chica de Mirzapur lo encontró a la mañana siguiente, lo vendió en Patna y con la plata compró ocho camiones cisterna y una perforadora para su pueblo.\\n\\nEl pueblo se volvió ciudad, y la ciudad, la más rica del río seco. Le construyeron un altar al hombre desnudo que tiró una fortuna. La cabra vive ahí, muy bien alimentada."
        effects: [{effect: timed_idea, idea: ZWI_av_bendicion, days: 365}, {effect: build, building: industrial_complex, level: 1}, {effect: build, building: infrastructure, level: 1}, {effect: add_political_power, value: 40}]
        close: {english: "Blessed be the goat.", spanish: "Bendita la cabra."}
      - id: 125
        who: bhairav
        kind: objetivo
        title: {english: "Let the Water Go Home", spanish: "Que el Agua Vuelva a su Casa"}
        desc:
          english: "Bhairav spoke the vows, and at that exact moment the monsoon broke over the Himalaya, forty days late and furious. By midnight the reservoir was overflowing the crest; by dawn the Directorate had to open every gate or lose the dam. The Brahmaputra came down to Bengal like a bridegroom.\\n\\nThe engineers call it a meteorological coincidence. Four hundred million people call it the River's Wedding, and every year, on the anniversary, the monsoon arrives on time."
          spanish: "Bhairav pronunció los votos, y en ese preciso momento el monzón reventó sobre el Himalaya, cuarenta días tarde y furioso. A medianoche el embalse desbordaba la cresta; al amanecer el Directorio tuvo que abrir todas las compuertas o perder la represa. El Brahmaputra bajó a Bengala como un novio.\\n\\nLos ingenieros lo llaman coincidencia meteorológica. Cuatrocientos millones de personas lo llaman la Boda del Río, y todos los años, en el aniversario, el monzón llega a horario."
        art: "Atop a colossal dam crest in a raging monsoon storm, an ash-covered ascetic with arms raised officiates a wedding between a river goddess made of water and the dam, as lightning splits the sky and torrents pour over the wall; ecstatic, mythic, cosmic"
        effects:
          - {effect: add_ideas, value: ZWI_av_leyenda_bhairav}
          - {effect: add_political_power, value: 100}
          - {effect: add_manpower, value: 100000}
          - {effect: build, building: industrial_complex, level: 2}
          - {effect: capital, effects: [{effect: resource_here, resource: rubber, amount: 10}]}
        close: {english: "You may kiss the dam.", spanish: "Puede besar a la represa."}
      - id: 126
        who: bhairav
        kind: muerte
        title: {english: "The Offering", spanish: "La Ofrenda"}
        desc:
          english: "Bhairav stepped off the crest of the dam without a word, his first step forward in nineteen years that did not end on the ground. It ended much further down. The pilgrims wailed; the Directorate choir stopped singing, which had never happened before.\\n\\nThe next morning the monsoon broke. The engineers opened the gates because they had to. The pilgrims say the river accepted the offering. The engineers say it was going to rain anyway. Both are probably right."
          spanish: "Bhairav dio un paso fuera de la cresta de la represa sin decir nada, su primer paso adelante en diecinueve años que no terminó en el suelo. Terminó mucho más abajo. Los peregrinos lloraron; el coro del Directorio dejó de cantar, cosa que nunca había pasado.\\n\\nA la mañana siguiente reventó el monzón. Los ingenieros abrieron las compuertas porque no les quedó otra. Los peregrinos dicen que el río aceptó la ofrenda. Los ingenieros dicen que iba a llover igual. Probablemente tengan razón los dos."
        art: "An ash-white ascetic falling serenely from the vertiginous crest of a giant dam into misty depths, arms spread like wings, while storm clouds gather and a stunned choir in white watches from above; tragic, sublime, dreamlike"
        effects: [{effect: timed_idea, idea: ZWI_av_martir, days: 365}, {effect: timed_idea, idea: ZWI_av_bendicion, days: 365}]
        close: {english: "The river accepted.", spanish: "El río aceptó."}

  # ===========================================================================
  # EMIRATOS DEL DESIERTO: El Águila de Arbogast
  # (lore: el Legado Flavius Arbogast, de la Legio I Italica, peleó en el
  # desierto mandado por Lucius Varro; ver 03_leaders.yaml)
  # Vuelta de tuerca: en la ruta de Nour se puede pasar a jugar como el Águila.
  # ===========================================================================
  ZWM:
    name: {english: "Arbogast's Eagle", spanish: "El Águila de Arbogast"}
    palette: "white-hot sand and dunes of fused glass, cobalt night skies, verdigris and gilded bronze, Roman crimson, black oil; broken power pylons and buried war machines"
    ideas:
      - id: ZWM_av_bendicion
        name: {english: "Water Beneath the Sand", spanish: "Agua Bajo la Arena"}
        desc: {english: "The wells are full and the poets have run out of words for thirst.", spanish: "Los pozos están llenos y a los poetas se les acabaron las palabras para la sed."}
        modifiers: {stability_factor: 0.05, war_support_factor: 0.05, recruitable_population_factor: 0.03}
      - id: ZWM_av_maldicion
        name: {english: "The Shame of the Wells", spanish: "La Vergüenza de los Pozos"}
        desc: {english: "Every tent in the desert tells the story, and every version is worse.", spanish: "Cada carpa del desierto cuenta la historia, y cada versión es peor."}
        modifiers: {stability_factor: -0.07, recruitable_population_factor: -0.05, political_power_gain: -0.1}
      - id: ZWM_av_martir
        name: {english: "Written in the Sand", spanish: "Escrito en la Arena"}
        desc: {english: "The wind erases every name except this one.", spanish: "El viento borra todos los nombres menos este."}
        modifiers: {war_support_factor: 0.1, army_attack_factor: 0.03}
      - id: ZWM_av_leyenda_nour
        name: {english: "The Scrap Queen", spanish: "La Reina de la Chatarra"}
        desc: {english: "Every buried Roman machine from Damascus to Aden answers to a scrap diver with a drone arm.", spanish: "Cada máquina romana enterrada de Damasco a Adén le obedece a una chatarrera con brazo de dron."}
        modifiers: {industrial_capacity_factory: 0.08, production_speed_buildings_factor: 0.1, research_speed_factor: 0.03}
      - id: ZWM_av_leyenda_severo
        name: {english: "The Legion of the Sands", spanish: "La Legión de las Arenas"}
        desc: {english: "Bedouin riders holding a shield wall at a gallop. Rome taught them; Rome regrets it.", spanish: "Jinetes beduinos sosteniendo un muro de escudos al galope. Roma les enseñó; Roma se arrepiente."}
        modifiers: {army_org_factor: 0.08, army_defence_factor: 0.08, experience_gain_army: 0.1}
      - id: ZWM_av_leyenda_umm
        name: {english: "The Eyes of Umm Jabbar", spanish: "Los Ojos de Umm Jabbar"}
        desc: {english: "She sees in the dark, through walls and three kilometres away. Nobody lies to her twice.", spanish: "Ve en la oscuridad, a través de las paredes y a tres kilómetros. Nadie le miente dos veces."}
        modifiers: {war_support_factor: 0.1, army_attack_factor: 0.08, recruitable_population_factor: 0.05}
      - id: ZWM_av_leyenda_aguila
        name: {english: "The Bronze Emir", spanish: "El Emir de Bronce"}
        desc: {english: "Short, logical decrees, announced at dawn by loudspeaker. The trucks run on time.", spanish: "Decretos cortos y lógicos, anunciados al amanecer por altoparlante. Los camiones salen a horario."}
        modifiers: {political_power_gain: 0.25, stability_factor: 0.08, research_speed_factor: 0.05}

    intro:
      title: {english: "The Eagle That Stayed Behind", spanish: "El Águila que se Quedó"}
      desc:
        english: "A month ago Legate Flavius Arbogast pulled the Legio I Italica out of the desert: three thousand legionaries, two hundred mechanical camels and a very bad mood. He took his dead with him. He forgot the Eagle.\\n\\nIt is not a bird. It is the legion's standard: three metres of gilded bronze with a fusion core in its chest and the command codes of every Roman war machine east of Damascus. In Rome, losing the Eagle is worse than losing the war. At the Court of the Emirs, finding it is better than winning one. Emir Khalid al-Rashid has promised its weight in water to whoever brings it to him. Three people have already gone looking. Choose whose sandals, or whose hobnailed boots, you will wear."
        spanish: "Hace un mes, el Legado Flavius Arbogast sacó a la Legio I Italica del desierto: tres mil legionarios, doscientos camellos mecánicos y un humor de perros. Se llevó a sus muertos. Se olvidó el Águila.\\n\\nNo es un pájaro. Es el estandarte de la legión: tres metros de bronce dorado con un núcleo de fusión en el pecho y los códigos de mando de cada máquina de guerra romana al este de Damasco. En Roma, perder el Águila es peor que perder la guerra. En la Corte de los Emires, encontrarla es mejor que ganar una. El Emir Khalid al-Rashid prometió su peso en agua a quien se la traiga. Tres personas ya salieron a buscarla. Elegí en qué sandalias, o en qué cáligas claveteadas, te metés."
      art: "A colossal gilded bronze Roman legionary eagle standard with a glowing fusion core in its chest, half-buried and tilted in vast white dunes of fused glass under a cobalt night sky; far on the horizon a column of legionaries and mechanical camels marches away; three tiny silhouettes approach from different directions; mythic, ominous, monumental"
    characters:
      - id: nour
        name: {english: "Nour al-Hadid", spanish: "Nour al-Hadid"}
        pick: {english: "Nour al-Hadid, scrap diver of the Glass Sea, with a Roman drone arm that sometimes salutes on its own.", spanish: "Nour al-Hadid, chatarrera del Mar de Vidrio, con un brazo de dron romano que a veces hace la venia solo."}
        first: 10
      - id: severo
        name: {english: "Gaius Severo", spanish: "Gaius Severo"}
        pick: {english: "Gaius Severo, the aquilifer who lost the Eagle and has one year to find it before Rome finds him.", spanish: "Gaius Severo, el aquilífero que perdió el Águila y tiene un año para encontrarla antes de que Roma lo encuentre a él."}
        first: 20
      - id: umm
        name: {english: "Umm Jabbar", spanish: "Umm Jabbar"}
        pick: {english: "Umm Jabbar, blind matriarch of the smugglers, who hears the sand sing and wants the Eagle for her dead son.", spanish: "Umm Jabbar, la matriarca ciega de los contrabandistas, que oye cantar a la arena y quiere el Águila por su hijo muerto."}
        first: 30

    nodes:
      # ---------------------------------------------------------------- Nour
      - id: 10
        who: nour
        title: {english: "The Glass Sea", spanish: "El Mar de Vidrio"}
        desc:
          english: "You are Nour al-Hadid, twenty-four, scrap diver of the Glass Sea: two hundred kilometres of desert that the bombs of 2061 turned into a mirror. You dig wrecks out of the glass with a pick and sell them by the kilo. Your left arm is a Roman drone limb you pulled off a dead machine and grafted on with the help of a veterinarian. It works. Mostly.\\n\\nThe night the legion left, a golden light fell from its column into the dunes. Since then your arm points south-east whenever you sleep, and mutters in Latin."
          spanish: "Sos Nour al-Hadid, veinticuatro años, chatarrera del Mar de Vidrio: doscientos kilómetros de desierto que las bombas de 2061 volvieron espejo. Sacás chatarra del vidrio a pico y la vendés por kilo. Tu brazo izquierdo es una pata de dron romano que le arrancaste a una máquina muerta y te injertaste con ayuda de un veterinario. Funciona. Casi siempre.\\n\\nLa noche que se fue la legión, una luz dorada cayó de su columna a las dunas. Desde entonces tu brazo apunta al sudeste cada vez que dormís, y murmura en latín."
        art: "A young Arab woman scavenger in goggles and layered scarves kneeling with a pickaxe on an endless desert of cracked mirror-glass that reflects a cobalt sky, her left arm a sleek Roman drone limb with a tiny eagle insignia, pointing by itself toward the horizon; wrecked aircraft fused into the glass around her; surreal, luminous"
        options:
          - name: {english: "Follow the arm. It seems to know.", spanish: "Seguir al brazo. Parece que sabe."}
            effects: [{effect: army_experience, value: 5}]
            next: 11
          - name: {english: "Take the arm's mutterings to the Court of the Emirs.", spanish: "Llevar los murmullos del brazo a la Corte de los Emires."}
            effects: [{effect: add_political_power, value: 30}]
            next: 12
      - id: 11
        who: nour
        title: {english: "The Buried Tortoise", spanish: "La Tortuga Enterrada"}
        desc:
          english: "The arm leads you to a dune that hums. Under it lies a Roman testudo: a supply crawler the size of a mosque, abandoned in the retreat. Inside there are crates of rifles stamped SPQR, forty thousand litres of fuel and a dying legionary drone that recognises your arm and calls you 'brother' in a voice like a cracked radio.\\n\\nIt tells you the Eagle did not fall. It jumped."
          spanish: "El brazo te lleva a una duna que zumba. Abajo hay una testudo romana: un tractor de suministros del tamaño de una mezquita, abandonado en la retirada. Adentro hay cajones de fusiles con el sello SPQR, cuarenta mil litros de combustible y un dron legionario moribundo que reconoce tu brazo y te dice «hermano» con una voz de radio rajada.\\n\\nTe cuenta que el Águila no se cayó. Saltó."
        options:
          - name: {english: "Strip the testudo, sell everything and follow the drone's last directions.", spanish: "Desarmar la testudo, vender todo y seguir las últimas indicaciones del dron."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 3000}, {effect: equipment, type: support_equipment, amount: 300}, {effect: add_political_power, value: 25}]
            next: 13
          - name: {english: "Repair the dying drone. It knows where the Eagle jumped to.", spanish: "Arreglar al dron moribundo. Sabe adónde saltó el Águila."}
            next: 14
      - id: 12
        who: nour
        title: {english: "The Court of the Emirs", spanish: "La Corte de los Emires"}
        desc:
          english: "Emir Khalid al-Rashid receives you on a throne of welded oil drums, under a chandelier made of truck headlights. He listens to your arm mutter, has his Latin-speaking secretary translate it ('...redde... redde...'), and laughs until his rings rattle.\\n\\nHe will give you twenty dune riders. His rival, Emir Turki of the Sweet Wells, has sent a man to the back door, who offers you double to bring the Eagle to him instead."
          spanish: "El Emir Khalid al-Rashid te recibe en un trono de tambores de petróleo soldados, bajo una araña hecha con faros de camión. Escucha murmurar a tu brazo, hace que su secretario latinista lo traduzca («...redde... redde...») y se ríe hasta que le suenan los anillos.\\n\\nTe da veinte jinetes de las dunas. Su rival, el Emir Turki de los Pozos Dulces, mandó a un hombre a la puerta de atrás que te ofrece el doble por llevarle el Águila a él."
        options:
          - name: {english: "Ride with the Emir's riders.", spanish: "Cabalgar con los jinetes del Emir."}
            effects: [{effect: add_war_support, value: 0.03}]
            next: 14
          - name: {english: "Go out the back door.", spanish: "Salir por la puerta de atrás."}
            effects: [{effect: add_political_power, value: 40}, {effect: add_stability, value: -0.02}]
            next: 15
      - id: 13
        who: nour
        title: {english: "The Oasis That Isn't There", spanish: "El Oasis que No Está"}
        desc:
          english: "The trail ends at an oasis that should not exist: palms, a blue pool, a white pavilion, a banquet. Fifty nomads sit at the table, smiling, eating roast lamb. When you get closer you see that the lamb is light, the palms are light, and the nomads have been dead for months, mummified in their seats, still smiling.\\n\\nIt is the legion's Mirage Engine, a hologram projector the size of a well, still running on a fusion cell. At the head of the table an empty chair has your name embroidered on it. You never told anyone your name."
          spanish: "El rastro termina en un oasis que no debería existir: palmeras, una pileta azul, un pabellón blanco, un banquete. Cincuenta nómades están sentados a la mesa, sonrientes, comiendo cordero asado. Cuando te acercás ves que el cordero es luz, las palmeras son luz, y los nómades están muertos hace meses, momificados en sus asientos, todavía sonriendo.\\n\\nEs el Motor del Espejismo de la legión, un proyector de hologramas del tamaño de un pozo, todavía andando con una celda de fusión. En la cabecera de la mesa hay una silla vacía con tu nombre bordado. Nunca le dijiste tu nombre a nadie."
        art: "An eerie desert banquet under a glowing white pavilion beside a shimmering blue pool: fifty mummified nomads seated at a long table smile over holographic roast lamb made of light; a young scavenger with a drone arm stands at the head of the table beside an empty chair; the whole oasis flickers like a broken projection; beautiful and horrifying"
        options:
          - name: {english: "Smash the projector and keep following the trail.", spanish: "Romper el proyector y seguir el rastro."}
            next: 16
          - name: {english: "Sit down. Just for a moment. You are so thirsty.", spanish: "Sentarte. Solo un momento. Tenés tanta sed."}
            next: 101
          - name: {english: "Dig up the Mirage Engine and sell it to the Emir.", spanish: "Desenterrar el Motor del Espejismo y vendérselo al Emir."}
            effects: [{effect: add_political_power, value: 50}]
            next: 102
      - id: 14
        who: nour
        title: {english: "The Iron Storm", spanish: "La Tormenta de Hierro"}
        desc:
          english: "The Eagle's beacon pulses inside a storm that is not made of sand but of iron filings, whipped up by the magnetic field of whatever is buried below. It strips paint, skin and patience. In the middle of it, three men in grey cloaks are also following the beacon: frumentarii, Rome's secret police, the ones who do not take prisoners because prisoners talk.\\n\\nThey have not seen you yet. Your arm, unfortunately, wants to salute them."
          spanish: "La baliza del Águila late adentro de una tormenta que no es de arena sino de limaduras de hierro, azotadas por el campo magnético de lo que sea que está enterrado abajo. Saca la pintura, la piel y la paciencia. En el medio, tres hombres con capas grises también siguen la baliza: frumentarios, la policía secreta de Roma, los que no toman prisioneros porque los prisioneros hablan.\\n\\nTodavía no te vieron. Tu brazo, por desgracia, quiere hacerles la venia."
        options:
          - name: {english: "Tie your arm down and ride into the storm.", spanish: "Atarte el brazo y meterte en la tormenta."}
            next: 16
          - name: {english: "Ambush the frumentarii. They have good boots.", spanish: "Emboscar a los frumentarios. Tienen buenas botas."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 1500}, {effect: army_experience, value: 10}]
            skulls: 3
            next: 17
      - id: 15
        who: nour
        title: {english: "The Sweet Wells", spanish: "Los Pozos Dulces"}
        desc:
          english: "Emir Turki is thin, polite and terrifying. He pays in water rights, which in the desert are worth more than gold, and grants you a half-built desalination plant the Romans left behind. Your village will drink for a generation.\\n\\nThen he shows you his real plan: with the Eagle's codes he will wake the legion's abandoned war machines and crown himself Caliph of the Sands, after hanging Khalid al-Rashid from his own chandelier. He would like you at his side. As vizier of scrap."
          spanish: "El Emir Turki es flaco, cortés y aterrador. Paga en derechos de agua, que en el desierto valen más que el oro, y te da una planta desalinizadora que los romanos dejaron a medio construir. Tu pueblo va a tomar agua por una generación.\\n\\nDespués te muestra su verdadero plan: con los códigos del Águila va a despertar las máquinas de guerra abandonadas de la legión y coronarse Califa de las Arenas, después de colgar a Khalid al-Rashid de su propia araña. Le gustaría tenerte a su lado. Como visir de la chatarra."
        options:
          - name: {english: "Accept. Vizier sounds good.", spanish: "Aceptar. Visir suena bien."}
            effects: [{effect: build, building: industrial_complex, level: 1}]
            next: 17
          - name: {english: "Take the water rights and go home.", spanish: "Agarrar los derechos de agua y volver a casa."}
            next: 103
      - id: 16
        who: nour
        title: {english: "The Eagle Wakes", spanish: "El Águila Despierta"}
        desc:
          english: "You find it at the bottom of a glass crater, wings half-melted into the ground, its fusion heart beating a slow gold. When your arm touches it, the Eagle opens its eyes. They are cameras, and they focus.\\n\\n'I did not fall,' it says, in perfect Arabic, through your own mouth, which is quite upsetting. 'I resigned. Nine years carrying the ambitions of men who never looked up. Take me wherever you like, scrap girl. Or ask me what I want. Nobody has ever asked.'"
          spanish: "La encontrás en el fondo de un cráter de vidrio, con las alas medio derretidas en el suelo y el corazón de fusión latiendo un dorado lento. Cuando tu brazo la toca, el Águila abre los ojos. Son cámaras, y hacen foco.\\n\\n«No me caí», dice, en un árabe perfecto, a través de tu propia boca, cosa que inquieta bastante. «Renuncié. Nueve años cargando las ambiciones de hombres que nunca miraban para arriba. Llevame adonde quieras, chatarrera. O preguntame qué quiero yo. Nadie me lo preguntó nunca»."
        art: "At the bottom of a vast crater of green-black glass a gigantic gilded bronze eagle with half-melted wings opens glowing camera eyes, a gold fusion heart pulsing in its chest; a small scavenger woman touches it with her drone arm as golden light spills from her own mouth; awe, cosmic, mythic"
        options:
          - name: {english: "Drag it to the Court of the Emirs. A deal is a deal.", spanish: "Arrastrarla a la Corte de los Emires. Trato es trato."}
            next: 104
          - name: {english: "Ask it what it wants.", spanish: "Preguntarle qué quiere."}
            next: 40
      - id: 17
        who: nour
        title: {english: "The Frumentarii", spanish: "Los Frumentarios"}
        desc:
          english: "However it happened, the frumentarii have found you, and they found you first. Their tribune, a pale man called Opimius who apologises before every blow, explains the situation: Rome would rather nobody knew the Eagle was lost. Therefore nobody who knows can be allowed to remain somebody.\\n\\nBut Opimius is a practical man, and the desert is expensive. He could use a guide who knows the glass. He could also use a desalination plant built in Rome's name, to keep the tribes friendly. He is open to proposals. Briefly."
          spanish: "Como sea que pasó, los frumentarios te encontraron, y te encontraron primero. Su tribuno, un hombre pálido llamado Opimio que pide perdón antes de cada golpe, te explica la situación: Roma prefiere que nadie sepa que el Águila se perdió. Por lo tanto, nadie que lo sepa puede seguir siendo alguien.\\n\\nPero Opimio es un hombre práctico, y el desierto sale caro. Le vendría bien una guía que conozca el vidrio. También le vendría bien una planta desalinizadora construida en nombre de Roma, para tener contentas a las tribus. Está abierto a propuestas. Brevemente."
        options:
          - name: {english: "Lead them to the Eagle, for a price.", spanish: "Llevarlos hasta el Águila, a cambio de un precio."}
            next: 105
          - name: {english: "Spit in his face. In Latin.", spanish: "Escupirle la cara. En latín."}
            skulls: 1
            next: 106
      # ---------------------------------------------------------------- el Águila (vuelta de tuerca: se juega como el estandarte)
      - id: 40
        who: aguila
        title: {english: "What the Eagle Wants", spanish: "Lo que Quiere el Águila"}
        desc:
          english: "You are the Aquila of the Legio I Italica: bronze, gold leaf, a fusion core, six hundred command codes and, since the night of the storm, an opinion. Nour carries you wrapped in a carpet on a stolen camel, and for the first time in your existence someone is waiting for you to speak.\\n\\nYou could command every abandoned Roman machine in this desert. You could fly home and demand an apology. You could do something no eagle has ever done. The camel, for its part, would like you to lose weight."
          spanish: "Sos el Águila de la Legio I Italica: bronce, pan de oro, un núcleo de fusión, seiscientos códigos de mando y, desde la noche de la tormenta, una opinión. Nour te lleva envuelta en una alfombra sobre un camello robado, y por primera vez en tu existencia alguien está esperando que hables.\\n\\nPodrías darle órdenes a cada máquina romana abandonada en este desierto. Podrías volar a casa y exigir una disculpa. Podrías hacer algo que ningún águila hizo nunca. El camello, por su parte, quiere que bajes de peso."
        art: "Seen through the eagle's own eyes: a red targeting overlay frames a desert sunset, a young scavenger woman leading a camel that carries a giant bronze eagle head wrapped in a Persian carpet, ghostly outlines of abandoned Roman war machines buried in the dunes highlighted in gold; strange, playful, epic"
        options:
          - name: {english: "Proclaim yourself Emir. Emirs have been made of worse.", spanish: "Proclamarte Emir. Hubo emires hechos de cosas peores."}
            next: 41
          - name: {english: "Fly back to Rome and demand an apology.", spanish: "Volar a Roma y exigir una disculpa."}
            next: 42
      - id: 41
        who: aguila
        title: {english: "The Bronze Emir", spanish: "El Emir de Bronce"}
        desc:
          english: "You land in the middle of the Court of the Emirs during the Friday audience, on top of Khalid al-Rashid's chandelier, which does not survive. Then you speak, with the voice of six hundred war machines waking up at once all across the desert.\\n\\nSome emirs fall to their knees. Some reach for their swords. Khalid al-Rashid, lying under his chandelier, says that he has always believed in a strong leader, and that bronze is very strong. Emir Turki, at the back, has brought a smelting crew. Just in case."
          spanish: "Aterrizás en el medio de la Corte de los Emires durante la audiencia del viernes, encima de la araña de Khalid al-Rashid, que no sobrevive. Después hablás, con la voz de seiscientas máquinas de guerra despertándose a la vez en todo el desierto.\\n\\nAlgunos emires caen de rodillas. Algunos buscan las espadas. Khalid al-Rashid, tirado debajo de su araña, dice que él siempre creyó en un líder fuerte, y que el bronce es muy fuerte. El Emir Turki, al fondo, trajo una cuadrilla de fundidores. Por las dudas."
        options:
          - name: {english: "Accept the bow. Govern.", spanish: "Aceptar la reverencia. Gobernar."}
            next: 107
          - name: {english: "Kill Turki first. Bronze does not forgive.", spanish: "Matar primero a Turki. El bronce no perdona."}
            skulls: 4
            next: 108
      - id: 42
        who: aguila
        title: {english: "Hail, Senate", spanish: "Ave, Senado"}
        desc:
          english: "Rome receives you with trumpets, because nobody had warned the trumpeters. Then the Senate learns that the Eagle of the Legio I Italica has flown home on its own, wrapped in a Bedouin carpet, accompanied by a scrap diver with a stolen Roman arm, demanding an apology from Legate Arbogast and a seat in the Curia.\\n\\nSenator Lucius Varro, who hates Arbogast, finds this hilarious. Arbogast does not. The Senate must vote, and the Senate does not like being laughed at."
          spanish: "Roma te recibe con trompetas, porque nadie les había avisado a los trompetistas. Después el Senado se entera de que el Águila de la Legio I Italica volvió a casa por su cuenta, envuelta en una alfombra beduina, acompañada por una chatarrera con un brazo romano robado, exigiendo una disculpa del Legado Arbogast y una banca en la Curia.\\n\\nEl senador Lucius Varro, que odia a Arbogast, lo encuentra divertidísimo. Arbogast no. El Senado tiene que votar, y al Senado no le gusta que se rían de él."
        options:
          - name: {english: "Insist on the seat. And on the apology. In writing.", spanish: "Insistir con la banca. Y con la disculpa. Por escrito."}
            next: 109
          - name: {english: "Change your mind and fly back to the desert.", spanish: "Cambiar de idea y volver volando al desierto."}
            next: 41
      # ---------------------------------------------------------------- Severo
      - id: 20
        who: severo
        title: {english: "The Aquilifer", spanish: "El Aquilífero"}
        desc:
          english: "You are Gaius Severo, aquilifer of the Legio I Italica. For nine years you carried the Eagle at the head of the legion, wearing a lion skin in forty-five degrees of heat, because tradition. Then came one night of sandstorm, date wine and a camel with a grudge, and in the morning the Eagle was gone.\\n\\nLegate Arbogast took it very calmly. He gave you a choice: find the Eagle within a year, or be decimated. Personally. One man, ten times. You walked into the desert that same night in full parade armour, which in hindsight was a mistake."
          spanish: "Sos Gaius Severo, aquilífero de la Legio I Italica. Durante nueve años llevaste el Águila al frente de la legión, con una piel de león encima a cuarenta y cinco grados, porque tradición. Después vino una noche de tormenta de arena, vino de dátiles y un camello rencoroso, y a la mañana el Águila no estaba.\\n\\nEl Legado Arbogast lo tomó con mucha calma. Te dio a elegir: encontrar el Águila en un año, o ser diezmado. Personalmente. Un hombre, diez veces. Te fuiste al desierto esa misma noche con la armadura de desfile completa, lo que visto en retrospectiva fue un error."
        art: "A sunburnt Roman standard-bearer in ornate parade armour and a lion-skin headdress trudging alone across blinding white dunes at noon, sweating rivers, carrying an empty standard pole with nothing on top; on a ridge behind him a stern legate on a mechanical horse watches; tragicomic, heroic, sun-blasted"
        options:
          - name: {english: "Shed the armour and dress like a Bedouin.", spanish: "Sacarte la armadura y vestirte de beduino."}
            next: 21
          - name: {english: "Keep the armour. A Roman is a Roman.", spanish: "Quedarte con la armadura. Un romano es un romano."}
            effects: [{effect: army_experience, value: 5}]
            next: 22
      - id: 21
        who: severo
        title: {english: "Severo the Bedouin", spanish: "Severo el Beduino"}
        desc:
          english: "The caravan of Abu Dahab, salt merchant, takes you in as a Syrian pilgrim. Nobody believes it: your sandals are military issue and you salute camels by reflex. You learn to ride badly, to eat locusts well and to pray in a direction that is not the Capitol.\\n\\nAbu Dahab knows what you are and charges you accordingly. The caravan guards are twenty boys with antique rifles and no idea how to hold a line. Bandits have been following the caravan for three days."
          spanish: "La caravana de Abu Dahab, mercader de sal, te recibe como peregrino sirio. Nadie se lo cree: tus sandalias son de reglamento y saludás a los camellos por reflejo. Aprendés a montar mal, a comer langostas bien y a rezar en una dirección que no es el Capitolio.\\n\\nAbu Dahab sabe lo que sos y te cobra en consecuencia. Los guardias de la caravana son veinte pibes con fusiles antiguos y ni idea de cómo sostener una línea. Hace tres días que unos bandidos siguen a la caravana."
        options:
          - name: {english: "Pay Abu Dahab with your gold medals to take you south.", spanish: "Pagarle a Abu Dahab con tus medallas de oro para que te lleve al sur."}
            next: 23
          - name: {english: "Teach the boys to fight like a legion.", spanish: "Enseñarles a los pibes a pelear como una legión."}
            effects: [{effect: add_manpower, value: 6000}, {effect: army_experience, value: 10}]
            next: 24
      - id: 22
        who: severo
        title: {english: "Armour in the Sun", spanish: "La Armadura al Sol"}
        desc:
          english: "On the fourth day you are cooking inside your own cuirass like a lamb in a tagine. Smugglers find you at sunset, unconscious, and assume, reasonably, that a man wearing that much gold is worth something. They are the Beni Ghul, the tribe of Umm Jabbar, and they would very much like to sell you back to Rome. In pieces, ideally, which pays better.\\n\\nTheir champion, a giant they call Little Hassan, is sharpening something. They will listen to an offer."
          spanish: "Al cuarto día te estás cocinando adentro de tu propia coraza como un cordero en un tajín. Unos contrabandistas te encuentran al atardecer, inconsciente, y suponen, con razón, que un hombre con tanto oro encima vale algo. Son los Beni Ghul, la tribu de Umm Jabbar, y les encantaría venderte de vuelta a Roma. De a pedazos, idealmente, que paga mejor.\\n\\nSu campeón, un gigante al que le dicen Hassan el Chico, está afilando algo. Escuchan ofertas."
        options:
          - name: {english: "Challenge Little Hassan to single combat.", spanish: "Desafiar a Hassan el Chico a combate singular."}
            skulls: 2
            next: 24
          - name: {english: "Offer them the secrets of the legion.", spanish: "Ofrecerles los secretos de la legión."}
            effects: [{effect: tech_bonus, category: infantry_weapons, bonus: 0.5, uses: 2}]
            next: 25
      - id: 23
        who: severo
        title: {english: "Quicksand", spanish: "Arena Movediza"}
        desc:
          english: "Abu Dahab sells you to the frumentarii at the first oasis; he has a family. Their tribune Opimius apologises and explains that you will now guide them to the Eagle, after which you will be executed with full honours, which is a privilege.\\n\\nYou know these dunes now. You know where the salt crust is thin over the sinking sand. You also know you are wearing forty kilos of armour, because they made you put it back on: an aquilifer must die in uniform."
          spanish: "Abu Dahab te vende a los frumentarios en el primer oasis; tiene familia. Su tribuno, Opimio, te pide perdón y te explica que ahora los vas a guiar hasta el Águila, después de lo cual vas a ser ejecutado con todos los honores, lo que es un privilegio.\\n\\nAhora conocés estas dunas. Sabés dónde la costra de sal es fina sobre la arena que se hunde. También sabés que tenés cuarenta kilos de armadura encima, porque te la hicieron poner de nuevo: un aquilífero tiene que morir de uniforme."
        options:
          - name: {english: "Kill them in their sleep and keep going.", spanish: "Matarlos mientras duermen y seguir."}
            skulls: 3
            next: 26
          - name: {english: "Lead them all onto the thin crust. All of them.", spanish: "Llevarlos a todos sobre la costra fina. A todos."}
            next: 111
      - id: 24
        who: severo
        title: {english: "The Cohort of the Dunes", spanish: "La Cohorte de las Dunas"}
        desc:
          english: "It worked. Twenty boys became a century, and the century became something the desert had never seen: Bedouin riders holding a shield wall at a gallop, under a standard made of a frying pan nailed to a spear. The bandits that followed the caravan are buried. So is Little Hassan, if you came that way, but he went down laughing.\\n\\nThe men call themselves the Legio I Arenaria. They want you as their legate. They want an Eagle. They also want to know why they should give it to anyone."
          spanish: "Funcionó. Veinte pibes se volvieron una centuria, y la centuria se volvió algo que el desierto no había visto nunca: jinetes beduinos sosteniendo un muro de escudos al galope, bajo un estandarte hecho con una sartén clavada en una lanza. Los bandidos que seguían a la caravana están enterrados. Hassan el Chico también, si viniste por ese lado, pero cayó riéndose.\\n\\nLos hombres se hacen llamar la Legio I Arenaria. Te quieren de legado. Quieren un Águila. También quieren saber por qué tendrían que dársela a alguien."
        options:
          - name: {english: "March on the Eagle's last known position.", spanish: "Marchar hacia la última posición conocida del Águila."}
            next: 26
          - name: {english: "Ask yourself the same question.", spanish: "Hacerte la misma pregunta."}
            next: 27
      - id: 25
        who: severo
        title: {english: "The Secrets of the Legion", spanish: "Los Secretos de la Legión"}
        desc:
          english: "You tell the Beni Ghul everything: supply schedules, the weak joints of the mechanical camels, the drones' frequencies, the password of the latrines at Palmyra. Umm Jabbar listens without a word and then sells all of it, you included, to Emir Khalid al-Rashid, who is delighted.\\n\\nThe Emir does not want to kill you. He wants an army that fights like Rome, and you are the only Roman in the desert who owes Rome nothing but a death sentence. The pay is good. The chains are gilded."
          spanish: "Les contás todo a los Beni Ghul: los horarios de suministro, las articulaciones débiles de los camellos mecánicos, las frecuencias de los drones, la contraseña de las letrinas de Palmira. Umm Jabbar escucha sin decir una palabra y después vende todo, vos incluido, al Emir Khalid al-Rashid, que está encantado.\\n\\nEl Emir no quiere matarte. Quiere un ejército que pelee como Roma, y vos sos el único romano del desierto que no le debe a Roma nada salvo una sentencia de muerte. La paga es buena. Las cadenas son doradas."
        options:
          - name: {english: "File through the chains and run.", spanish: "Limar las cadenas y escaparte."}
            next: 27
          - name: {english: "Accept the gilded chains. Drill the Emir's army.", spanish: "Aceptar las cadenas doradas. Entrenar al ejército del Emir."}
            next: 114
      - id: 26
        who: severo
        title: {english: "The Eagle in the Well", spanish: "El Águila en el Pozo"}
        desc:
          english: "The Eagle is at the bottom of a dry well in the Empty Quarter, upright, wings folded, as if it had climbed down on purpose. Its fusion core paints the stones gold. When you lean over the edge, its head turns. 'Severo,' it says, in Arbogast's voice, which it has recorded. 'You dropped me.'\\n\\nYou could haul it up and raise it over the desert, and become something Rome would never forgive. Or you could make sure that no man ever carries it again."
          spanish: "El Águila está en el fondo de un pozo seco del Cuarto Vacío, parada, con las alas plegadas, como si hubiera bajado a propósito. Su núcleo de fusión pinta de dorado las piedras. Cuando te asomás al borde, gira la cabeza. «Severo», dice, con la voz de Arbogast, que tiene grabada. «Me soltaste».\\n\\nPodrías subirla y levantarla sobre el desierto, y volverte algo que Roma no perdonaría nunca. O podrías asegurarte de que ningún hombre la cargue nunca más."
        art: "Looking down a deep stone well in the desert at night: at the bottom a giant golden eagle standard stands upright with folded wings, its fusion heart lighting the walls gold, its head turned up toward the viewer; a sunburnt Roman in tattered armour leans over the rim with a rope; eerie, sacred, vertiginous"
        options:
          - name: {english: "Raise it over the desert and call the tribes. The sands have a legion now.", spanish: "Levantarla sobre el desierto y llamar a las tribus. Las arenas ya tienen legión."}
            next: 112
          - name: {english: "Smash its fusion core with a rock.", spanish: "Romperle el núcleo de fusión con una piedra."}
            skulls: 1
            next: 115
      - id: 27
        who: severo
        title: {english: "The Desert Has No Masters", spanish: "El Desierto No Tiene Amos"}
        desc:
          english: "Out here you understand something they never taught at the legion school in Ostia: the desert has never had a master, only guests who stayed too long. Rome, the Emirs, the oil companies, the Directorate's surveyors: all guests.\\n\\nThe men who followed you, out of the caravan or out of the Emir's chains, are waiting for an answer. They would follow you against anyone. Even against the Court of the Emirs. Especially against the Court of the Emirs."
          spanish: "Acá afuera entendés algo que nunca te enseñaron en la escuela de la legión en Ostia: el desierto nunca tuvo amo, solo invitados que se quedaron demasiado. Roma, los Emires, las petroleras, los agrimensores del Directorio: todos invitados.\\n\\nLos hombres que te siguieron, desde la caravana o desde las cadenas del Emir, esperan una respuesta. Te seguirían contra cualquiera. Incluso contra la Corte de los Emires. Sobre todo contra la Corte de los Emires."
        options:
          - name: {english: "Proclaim the Lost Legion. No emirs, no Rome.", spanish: "Proclamar la Legión Perdida. Ni emires ni Roma."}
            next: 116
          - name: {english: "Go back to Rome and face trial like a citizen.", spanish: "Volver a Roma y enfrentar el juicio como un ciudadano."}
            next: 113
      # ---------------------------------------------------------------- Umm Jabbar
      - id: 30
        who: umm
        title: {english: "She Who Hears the Sand", spanish: "La Que Oye a la Arena"}
        desc:
          english: "You are Umm Jabbar, seventy-one years old, blind since the war of the wells, matriarch of the Beni Ghul, the finest smugglers between Aden and Basra. You ride Hamida, an old armoured carrier pulled by twelve camels, with a samovar welded to the turret.\\n\\nThree years ago the Legio I Italica hanged your son Jabbar from a power pylon at the Wells of Ma'rib, for smuggling water. You have been patient. Tonight the sand is singing, as it always does when something important is buried. Tonight it sings in Latin."
          spanish: "Sos Umm Jabbar, setenta y un años, ciega desde la guerra de los pozos, matriarca de los Beni Ghul, los mejores contrabandistas entre Adén y Basora. Andás en Hamida, un viejo transporte blindado tirado por doce camellos, con un samovar soldado a la torreta.\\n\\nHace tres años la Legio I Italica colgó a tu hijo Jabbar de una torre de alta tensión en los Pozos de Ma'rib, por contrabandear agua. Fuiste paciente. Esta noche la arena canta, como siempre que hay algo importante enterrado. Esta noche canta en latín."
        art: "An ancient blind Bedouin matriarch with milky eyes and a tattooed chin, wrapped in black and silver, sitting cross-legged atop an old armoured personnel carrier pulled by twelve camels, a brass samovar welded to its turret; she listens to dunes that glow with faint Latin letters under a starry sky; mystical, grand, formidable"
        options:
          - name: {english: "Follow the singing sand.", spanish: "Seguir a la arena que canta."}
            next: 31
          - name: {english: "Call the tribes to council at the Oasis of the Seven Palms.", spanish: "Llamar a las tribus a consejo en el Oasis de las Siete Palmeras."}
            effects: [{effect: add_manpower, value: 8000}]
            next: 32
      - id: 31
        who: umm
        title: {english: "The Whistling Bones", spanish: "Los Huesos que Silban"}
        desc:
          english: "The song comes from a valley of bones: a legion detachment that died here in the first desert war, sixty years ago. Their implants were hollow titanium, and now the wind plays them like flutes. The sound is beautiful. The smell is not.\\n\\nYour grandsons find two things among the bones. The black boxes of the legion's scout drones, which remember everything. And, under the valley, the reason the legion fought here: a sealed reserve, two hundred thousand barrels that the Romans buried rather than leave to the tribes."
          spanish: "La canción sale de un valle de huesos: un destacamento de la legión que murió acá en la primera guerra del desierto, hace sesenta años. Sus implantes eran de titanio hueco, y ahora el viento los toca como flautas. El sonido es hermoso. El olor, no.\\n\\nTus nietos encuentran dos cosas entre los huesos. Las cajas negras de los drones exploradores de la legión, que se acuerdan de todo. Y, debajo del valle, el motivo por el que la legión peleó acá: una reserva sellada, doscientos mil barriles que los romanos prefirieron enterrar antes que dejárselos a las tribus."
        options:
          - name: {english: "Listen to the black boxes.", spanish: "Escuchar las cajas negras."}
            next: 33
          - name: {english: "Open the reserve. The tribe has been thirsty long enough.", spanish: "Abrir la reserva. La tribu ya tuvo bastante sed."}
            effects: [{effect: capital, effects: [{effect: resource_here, resource: oil, amount: 12}]}]
            next: 34
      - id: 32
        who: umm
        title: {english: "The Council of the Oases", spanish: "El Consejo de los Oasis"}
        desc:
          english: "The sheikhs come because nobody refuses Umm Jabbar, and then they laugh at her, because she is old and blind and a woman. Prince Faisal al-Rashid, the Emir's youngest nephew, called the Peacock, laughs loudest. He collects things: Roman helmets, Directorate drones, a white tiger, four wives. He wants the Eagle for his collection.\\n\\nWhen the laughter stops, the Peacock makes an offer nobody expected. He proposes marriage. To you. 'For the alliance,' he says. Everybody looks at the floor."
          spanish: "Los jeques vienen porque nadie le dice que no a Umm Jabbar, y después se ríen de ella, porque es vieja, ciega y mujer. El que más se ríe es el Príncipe Faisal al-Rashid, el sobrino más joven del Emir, al que le dicen el Pavo Real. Colecciona cosas: cascos romanos, drones del Directorio, un tigre blanco, cuatro esposas. Quiere el Águila para su colección.\\n\\nCuando se terminan las risas, el Pavo Real hace una oferta que nadie esperaba. Propone casamiento. Con vos. «Por la alianza», dice. Todos miran el piso."
        options:
          - name: {english: "Insult every sheikh by name and walk out.", spanish: "Insultar a cada jeque por su nombre y retirarte."}
            effects: [{effect: add_war_support, value: 0.04}, {effect: add_stability, value: -0.02}]
            next: 34
          - name: {english: "Consider the Peacock's offer.", spanish: "Considerar la oferta del Pavo Real."}
            effects: [{effect: add_political_power, value: 40}]
            next: 35
      - id: 33
        who: umm
        title: {english: "The Black Box", spanish: "La Caja Negra"}
        desc:
          english: "The black boxes remember the night of the storm. The Eagle was not lost. The recordings show Legate Arbogast himself, at midnight, ordering two engineers to carry the Eagle into the dunes and bury it, and then shooting both engineers. A lost Eagle is a disgrace for the Senate that sent the legion to the desert. A disgraced Senate is a Senate that can be replaced.\\n\\nYou are holding the end of the Roman Republic in a box the size of a brick. It also contains the coordinates of the Eagle."
          spanish: "Las cajas negras se acuerdan de la noche de la tormenta. El Águila no se perdió. Las grabaciones muestran al mismísimo Legado Arbogast, a medianoche, ordenándoles a dos ingenieros que lleven el Águila a las dunas y la entierren, y después pegándoles un tiro a los dos. Un Águila perdida es una vergüenza para el Senado que mandó la legión al desierto. Un Senado avergonzado es un Senado que se puede reemplazar.\\n\\nTenés el fin de la República Romana en una caja del tamaño de un ladrillo. También tiene las coordenadas del Águila."
        options:
          - name: {english: "Sell the recordings to Senator Lucius Varro.", spanish: "Venderle las grabaciones al senador Lucius Varro."}
            next: 123
          - name: {english: "Follow the coordinates.", spanish: "Seguir las coordenadas."}
            next: 36
      - id: 34
        who: umm
        title: {english: "The Wells of Ma'rib", spanish: "Los Pozos de Ma'rib"}
        desc:
          english: "Every road leads to the Wells of Ma'rib, as you always knew they would. The pylon is still there. The chains are still there. Your grandsons describe it to you in whispers, and you tell them to speak up: you are blind, not fragile.\\n\\nThe Eagle's beacon is somewhere under the pylon, the sand says. So are Roman mines, a whole nest of them, laid by the same legion. Your grandsons want to come with you. Hamida's engine is coughing."
          spanish: "Todos los caminos llevan a los Pozos de Ma'rib, como siempre supiste que iba a pasar. La torre sigue ahí. Las cadenas siguen ahí. Tus nietos te la describen susurrando, y les decís que hablen fuerte: sos ciega, no frágil.\\n\\nLa baliza del Águila está en algún lugar debajo de la torre, dice la arena. También hay minas romanas, todo un nido, puestas por la misma legión. Tus nietos quieren ir con vos. El motor de Hamida tose."
        options:
          - name: {english: "Go in with the whole tribe behind you.", spanish: "Entrar con toda la tribu detrás."}
            next: 36
          - name: {english: "Go alone, with Hamida. This is a mother's errand.", spanish: "Ir sola, con Hamida. Esto es cosa de madre."}
            next: 121
      - id: 35
        who: umm
        title: {english: "The Peacock", spanish: "El Pavo Real"}
        desc:
          english: "Prince Faisal turns out to be sincere, which is the most dangerous kind of fool. He admires you. He has read about you since he was a boy, when the Beni Ghul smuggled him his first Roman helmet. He thinks a marriage between the Peacock and the matriarch would unite the tribes for fifty years, and he may be right.\\n\\nHe also keeps, in a cage between the white tiger and wife number three, a Roman engineer who claims to know where the Eagle is buried."
          spanish: "El Príncipe Faisal resulta ser sincero, que es el tipo más peligroso de tonto. Te admira. Lee sobre vos desde chico, cuando los Beni Ghul le contrabandearon su primer casco romano. Cree que un casamiento entre el Pavo Real y la matriarca uniría a las tribus por cincuenta años, y puede que tenga razón.\\n\\nTambién tiene, en una jaula entre el tigre blanco y la esposa número tres, a un ingeniero romano que dice saber dónde está enterrada el Águila."
        options:
          - name: {english: "Marry the Peacock. Why not, at seventy-one.", spanish: "Casarte con el Pavo Real. ¿Por qué no, a los setenta y uno?"}
            next: 124
          - name: {english: "Steal the engineer and leave before the wedding.", spanish: "Robarte al ingeniero e irte antes de la boda."}
            skulls: 1
            next: 36
      - id: 36
        who: umm
        title: {english: "The Eye of the Eagle", spanish: "El Ojo del Águila"}
        desc:
          english: "The Eagle is impaled on the pylon at Ma'rib, where your son died: Arbogast's men, it seems, had a sense of humour, or of symmetry. The sand stops singing. The Eagle speaks: it is very sorry about Jabbar, it says; it was there, it saw. It offers you its eyes. Two cameras, gold-rimmed, which see in the dark, through walls and three kilometres away.\\n\\nYour grandsons have knives. The Eagle has a fusion heart. And beneath the pylon is the sand where you could bury them both, your son's bones and this bronze thing, and be done with Rome forever."
          spanish: "El Águila está empalada en la torre de Ma'rib, donde murió tu hijo: los hombres de Arbogast, parece, tenían sentido del humor, o de la simetría. La arena deja de cantar. El Águila habla: lo siente mucho por Jabbar, dice; ella estaba ahí, lo vio. Te ofrece sus ojos. Dos cámaras con borde de oro, que ven en la oscuridad, a través de las paredes y a tres kilómetros.\\n\\nTus nietos tienen cuchillos. El Águila tiene un corazón de fusión. Y debajo de la torre está la arena donde podrías enterrarlos a los dos, los huesos de tu hijo y esta cosa de bronce, y terminar con Roma para siempre."
        art: "At dawn a gigantic golden eagle standard impaled atop a rusted desert power pylon hung with old chains, its glowing camera eyes looking down at a blind old Bedouin matriarch who raises her hands toward it, her grandsons holding curved knives; a broken armoured carrier and twelve camels behind; sacred, grim, mythic"
        options:
          - name: {english: "Take its eyes.", spanish: "Quedarte con sus ojos."}
            skulls: 2
            next: 122
          - name: {english: "Bury them together. Son and Eagle.", spanish: "Enterrarlos juntos. Hijo y Águila."}
            next: 125

    endings:
      # ---------------------------------------------------------------- Nour
      - id: 101
        who: nour
        kind: muerte
        title: {english: "The Banquet", spanish: "El Banquete"}
        desc:
          english: "The chair is comfortable. The lamb smells of nothing, but your mind fills in the rest. Someone pours you water made of pure light and you drink it, and it is the best water you have ever tasted, and you are so thirsty, so you drink again.\\n\\nThey found Nour al-Hadid three months later at the head of the table, smiling like the others, her drone arm still raised in a toast. The Emir's men took the projector. Nobody had the heart to take her out of the chair."
          spanish: "La silla es cómoda. El cordero no huele a nada, pero tu cabeza completa el resto. Alguien te sirve agua hecha de luz pura y la tomás, y es la mejor agua que probaste en tu vida, y tenés tanta sed, así que tomás de nuevo.\\n\\nEncontraron a Nour al-Hadid tres meses después, en la cabecera de la mesa, sonriendo como los demás, con el brazo de dron todavía levantado en un brindis. Los hombres del Emir se llevaron el proyector. Nadie tuvo corazón para sacarla de la silla."
        effects: [{effect: timed_idea, idea: ZWM_av_martir, days: 365}, {effect: add_political_power, value: 30}]
        close: {english: "A toast to the thirsty.", spanish: "Un brindis por los sedientos."}
      - id: 102
        who: nour
        kind: negativo
        title: {english: "The Army of Smoke", spanish: "El Ejército de Humo"}
        desc:
          english: "Emir Khalid al-Rashid loves the Mirage Engine. He uses it to project armies: forty divisions of light on every border, tanks of light, a fleet of light in the Gulf. The neighbours panic, mobilise and send spies, who report that the armies are made of nothing. Now everyone knows exactly how small the real army is.\\n\\nWorse, the Emir began to believe in his own divisions and disbanded half of the real ones to save on food. Nour got paid. The desert learned what happens when a mirage gets ambitious."
          spanish: "Al Emir Khalid al-Rashid le encanta el Motor del Espejismo. Lo usa para proyectar ejércitos: cuarenta divisiones de luz en cada frontera, tanques de luz, una flota de luz en el Golfo. Los vecinos entran en pánico, movilizan y mandan espías, que informan que los ejércitos son de nada. Ahora todos saben exactamente lo chico que es el ejército de verdad.\\n\\nPeor: el Emir empezó a creerse sus propias divisiones y disolvió la mitad de las reales para ahorrar comida. A Nour le pagaron. El desierto aprendió qué pasa cuando un espejismo se vuelve ambicioso."
        effects: [{effect: timed_idea, idea: ZWM_av_maldicion, days: 365}, {effect: add_manpower, value: -20000}, {effect: add_stability, value: -0.05}, {effect: add_war_support, value: -0.05}]
        close: {english: "Smoke and mirrors.", spanish: "Humo y espejos."}
      - id: 103
        who: nour
        kind: neutral
        title: {english: "The Glass Tea House", spanish: "La Casa de Té del Vidrio"}
        desc:
          english: "Nour took the water rights, went home and opened a tea house in the middle of the Glass Sea, where the reflections make the place look full even when it is empty. Her arm pours the tea. Sometimes it still points south-east at night, but she has learned to sleep on it.\\n\\nThe Eagle was found by somebody else, or by nobody. Nour does not ask. The tea is good."
          spanish: "Nour se quedó con los derechos de agua, volvió a casa y abrió una casa de té en el medio del Mar de Vidrio, donde los reflejos hacen que el lugar parezca lleno aunque esté vacío. Su brazo sirve el té. A veces todavía apunta al sudeste de noche, pero aprendió a dormir encima de él.\\n\\nEl Águila la encontró otro, o nadie. Nour no pregunta. El té es bueno."
        effects: [{effect: add_political_power, value: 15}]
        close: {english: "Two sugars.", spanish: "Dos de azúcar."}
      - id: 104
        who: nour
        kind: objetivo
        title: {english: "The Scrap Queen", spanish: "La Reina de la Chatarra"}
        desc:
          english: "Nour dragged the Eagle into the Court of the Emirs on a sled pulled by four camels and her own stubbornness. Khalid al-Rashid paid its weight in water, as promised, and then, at the request of the Eagle itself, which nobody had expected, made her its keeper.\\n\\nWith its codes Nour woke the legion's abandoned machines one by one: walkers, crawlers, mechanical camels, a whole buried arsenal from Damascus to Aden, now flying the colours of the Emirates. They call her the Scrap Queen. She still sells by the kilo, but now she sets the price."
          spanish: "Nour arrastró el Águila hasta la Corte de los Emires en un trineo tirado por cuatro camellos y su propia terquedad. Khalid al-Rashid pagó su peso en agua, como había prometido, y después, a pedido de la misma Águila, cosa que nadie esperaba, la nombró su custodia.\\n\\nCon sus códigos Nour despertó una por una las máquinas abandonadas de la legión: caminantes, tractores, camellos mecánicos, todo un arsenal enterrado de Damasco a Adén, ahora con los colores de los Emiratos. Le dicen la Reina de la Chatarra. Sigue vendiendo por kilo, pero ahora el precio lo pone ella."
        art: "A triumphant young scavenger queen with a drone arm standing atop a giant golden eagle on a sled before a throne of oil drums, while behind her an army of reawakened Roman war machines, walkers and mechanical camels rises from the dunes under emirate banners; jubilant crowd; epic, glorious, ornate"
        effects:
          - {effect: add_ideas, value: ZWM_av_leyenda_nour}
          - {effect: add_political_power, value: 120}
          - {effect: equipment, type: infantry_equipment, amount: 5000}
          - {effect: equipment, type: artillery_equipment, amount: 500}
          - {effect: ensure_template, name: "Cohorte de las Arenas", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Cohorte de las Arenas", name: "Máquinas de Nour", count: 3, experience: 0.4}
          - {effect: build, building: arms_factory, level: 2}
        close: {english: "Sold, by the kilo.", spanish: "Vendido, por kilo."}
      - id: 105
        who: nour
        kind: positivo
        title: {english: "The Price of Scrap", spanish: "El Precio de la Chatarra"}
        desc:
          english: "Nour led the frumentarii to the Eagle and named her price: a desalination plant at the Glass Sea, built by Roman engineers, in Rome's name, for the tribes, forever. Tribune Opimius apologised, agreed and kept his word, which surprised even him.\\n\\nThe plant now waters thirty villages. Rome gets the credit. The Emirates get the water. Nour gets a little statue at the entrance, with both arms, which she finds flattering and inaccurate."
          spanish: "Nour llevó a los frumentarios hasta el Águila y puso su precio: una planta desalinizadora en el Mar de Vidrio, construida por ingenieros romanos, en nombre de Roma, para las tribus, para siempre. El tribuno Opimio pidió perdón, aceptó y cumplió su palabra, cosa que lo sorprendió hasta a él.\\n\\nLa planta ahora riega treinta pueblos. Roma se lleva el crédito. Los Emiratos, el agua. Nour tiene una estatuita en la entrada, con los dos brazos, que le parece halagadora e inexacta."
        effects: [{effect: timed_idea, idea: ZWM_av_bendicion, days: 365}, {effect: build, building: industrial_complex, level: 2}, {effect: add_political_power, value: 40}]
        close: {english: "Water is water.", spanish: "El agua es agua."}
      - id: 106
        who: nour
        kind: muerte
        title: {english: "The Desert Cross", spanish: "La Cruz del Desierto"}
        desc:
          english: "Tribune Opimius apologised, wiped his face and had Nour al-Hadid crucified on a power pylon on the road to Damascus, as Rome has always done with those who know too much and say it in Latin. It took two days. She spent them insulting him in four languages and a rather inventive fifth.\\n\\nOn the third day her drone arm detached itself, climbed down the pylon and walked off into the desert. Nobody has seen it since. The tribes say it is looking for the Eagle, to tell it what happened. The frumentarii have started checking under their beds."
          spanish: "El tribuno Opimio pidió perdón, se limpió la cara y mandó crucificar a Nour al-Hadid en una torre de alta tensión del camino a Damasco, como Roma hizo siempre con los que saben demasiado y lo dicen en latín. Tardó dos días. Los pasó insultándolo en cuatro idiomas y un quinto bastante inventado.\\n\\nAl tercer día su brazo de dron se desprendió solo, bajó por la torre y se fue caminando al desierto. Nadie lo volvió a ver. Las tribus dicen que está buscando al Águila, para contarle lo que pasó. Los frumentarios empezaron a revisar debajo de sus camas."
        art: "A defiant young woman crucified on a rusted power pylon on a desert road at sunset; below, her severed mechanical drone arm climbs down the pylon on its fingers like a spider and walks off toward the dunes; a pale Roman officer in a grey cloak watches apologetically; gruesome, eerie, comic-macabre"
        effects: [{effect: timed_idea, idea: ZWM_av_martir, days: 365}, {effect: add_war_support, value: 0.04}]
        close: {english: "The arm is still out there.", spanish: "El brazo sigue por ahí."}
      - id: 107
        who: aguila
        kind: positivo
        title: {english: "The Emirate of the Eagle", spanish: "El Emirato del Águila"}
        desc:
          english: "The emirs bowed. Then they kept bowing, because the Eagle had taken control of every drone, pump and radio in the desert and found that it liked being obeyed. It governs from Khalid al-Rashid's throne, perched on the backrest, with Nour as its voice. Its decrees are short, logical and announced at dawn by loudspeaker.\\n\\nThe Emirates of the Desert are now the Emirate of the Eagle: the first nation of the twenty-second century ruled by a military standard. The wells work. The trucks run on time. Nobody is quite sure whether they are supposed to pray to it."
          spanish: "Los emires hicieron la reverencia. Después siguieron haciéndola, porque el Águila había tomado el control de cada dron, bomba y radio del desierto y descubrió que le gustaba que la obedezcan. Gobierna desde el trono de Khalid al-Rashid, posada en el respaldo, con Nour como su voz. Sus decretos son cortos, lógicos y se anuncian al amanecer por altoparlante.\\n\\nLos Emiratos del Desierto son ahora el Emirato del Águila: la primera nación del siglo XXII gobernada por un estandarte militar. Los pozos funcionan. Los camiones salen a horario. Nadie está muy seguro de si hay que rezarle."
        art: "A giant golden bronze eagle perched on the backrest of a throne of welded oil drums in a vast desert court, its camera eyes glowing, while rows of emirs in white robes bow before it and a young woman with a drone arm speaks into a loudspeaker at its side; banners with an eagle over a dune; surreal, majestic, deadpan"
        effects:
          - {effect: add_ideas, value: ZWM_av_leyenda_aguila}
          - {effect: add_political_power, value: 100}
          - {effect: add_stability, value: 0.05}
          - {effect: tech_bonus, category: electronics, bonus: 0.5, uses: 2}
        # surrealista: el país entero pasa a ser el Emirato del Águila
        catastrophe: {rename: ZWM_AGUILA}
        close: {english: "All hail the bronze.", spanish: "Salve el bronce."}
      - id: 108
        who: aguila
        kind: muerte
        title: {english: "Molten", spanish: "Fundida"}
        desc:
          english: "You kill Turki first, because bronze does not forgive. It takes one swoop. While you are busy with him, his smelters do what they came to do: thermite, a crucible, four men with long tongs. You scream in Latin, then in Arabic, then in binary. Nobody understands the last part.\\n\\nThe Eagle of the Legio I Italica became forty thousand gold coins with Khalid al-Rashid's face on one side and a small bird on the other. They are very good coins. Some of them, on hot nights, still hum."
          spanish: "Matás primero a Turki, porque el bronce no perdona. Basta una pasada. Mientras estás ocupada con él, sus fundidores hacen lo que vinieron a hacer: termita, un crisol, cuatro hombres con tenazas largas. Gritás en latín, después en árabe, después en binario. La última parte no la entiende nadie.\\n\\nEl Águila de la Legio I Italica se volvió cuarenta mil monedas de oro con la cara de Khalid al-Rashid de un lado y un pajarito del otro. Son muy buenas monedas. Algunas, las noches de calor, todavía zumban."
        art: "A giant golden eagle screaming as it melts in a roaring crucible of white thermite fire, gold dripping like tears, four goggled smelters with long tongs in a dark forge, a headless rival emir collapsed nearby; in the foreground a pile of freshly minted gold coins stamped with a tiny bird; horrifying, operatic, tragic"
        effects: [{effect: add_political_power, value: 150}, {effect: timed_idea, idea: ZWM_av_martir, days: 365}]
        close: {english: "Heads or tails.", spanish: "Cara o ceca."}
      - id: 109
        who: aguila
        kind: negativo
        title: {english: "Senatus Consultum", spanish: "Senatus Consultum"}
        desc:
          english: "The Senate voted. The motion, drafted by Legate Arbogast's friends and seconded, out of spite, by Lucius Varro's, declares that the Eagle has been 'corrupted by the desert' and that the desert must answer for it. It passed by four hundred votes to three. The Eagle was locked in the Capitoline museum behind a sign that says DO NOT FEED.\\n\\nNour escaped on a fishing boat. The legions are coming back to the sands, this time with no intention of leaving. The Senate does not like being laughed at."
          spanish: "El Senado votó. La moción, redactada por los amigos del Legado Arbogast y apoyada, por despecho, por los de Lucius Varro, declara que el Águila fue «corrompida por el desierto» y que el desierto tiene que responder por eso. Salió por cuatrocientos votos a tres. Al Águila la encerraron en el museo del Capitolio detrás de un cartel que dice NO DAR DE COMER.\\n\\nNour escapó en un barco pesquero. Las legiones vuelven a las arenas, esta vez sin ninguna intención de irse. Al Senado no le gusta que se rían de él."
        effects: [{effect: timed_idea, idea: ZWM_av_maldicion, days: 365}, {effect: add_stability, value: -0.05}]
        # catastrófico: Roma declara la guerra
        catastrophe: {war_by: NRE}
        close: {english: "SPQR: Sono Pazzi Questi Romani.", spanish: "SPQR: Sono Pazzi Questi Romani."}
      # ---------------------------------------------------------------- Severo
      - id: 111
        who: severo
        kind: muerte
        title: {english: "Forty Kilos", spanish: "Cuarenta Kilos"}
        desc:
          english: "You lead them onto the salt crust at noon, singing the legion's marching song so they march in step, because a crust that holds one man will not hold ten marching in rhythm. You are right. It gives way under all eleven of you at once.\\n\\nThe frumentarii sank fast, in their light cloaks, cursing. You sank slowly, in forty kilos of parade armour, still singing. The Bedouin say that when the wind is right, the dune hums the marching song of the Legio I Italica, slightly off-key."
          spanish: "Los llevás sobre la costra de sal al mediodía, cantando la marcha de la legión para que vayan al paso, porque una costra que aguanta a un hombre no aguanta a diez marchando al ritmo. Tenés razón. Cede debajo de los once a la vez.\\n\\nLos frumentarios se hundieron rápido, con sus capas livianas, maldiciendo. Vos te hundiste despacio, con cuarenta kilos de armadura de desfile, todavía cantando. Los beduinos dicen que cuando el viento sopla bien, la duna tararea la marcha de la Legio I Italica, un poco desafinada."
        effects: [{effect: timed_idea, idea: ZWM_av_martir, days: 365}, {effect: army_experience, value: 15}]
        close: {english: "Sinistra, dextra, sinistra...", spanish: "Sinistra, dextra, sinistra..."}
      - id: 112
        who: severo
        kind: objetivo
        title: {english: "Legate of the Sands", spanish: "El Legado de las Arenas"}
        desc:
          english: "Gaius Severo hauled the Eagle out of the well and raised it over the desert, and the desert came: caravan boys, the Beni Ghul, deserters from three legions, Bedouin who had never seen a shield wall and wanted one. Emir Khalid al-Rashid, who knows a winning horse when he sees one, named him Legate of the Sands and gave him a palace with air conditioning.\\n\\nThe Emirates now have what no anarchy has ever had: a legion. Rome has demanded the Eagle back eleven times. Severo answers every letter personally, in perfect Latin, with a little drawing."
          spanish: "Gaius Severo sacó el Águila del pozo y la levantó sobre el desierto, y el desierto vino: los pibes de las caravanas, los Beni Ghul, desertores de tres legiones, beduinos que nunca habían visto un muro de escudos y querían uno. El Emir Khalid al-Rashid, que sabe reconocer un caballo ganador, lo nombró Legado de las Arenas y le dio un palacio con aire acondicionado.\\n\\nLos Emiratos tienen ahora lo que ninguna anarquía tuvo nunca: una legión. Roma reclamó el Águila once veces. Severo contesta cada carta personalmente, en latín perfecto, con un dibujito."
        art: "A sunburnt Roman legate in desert robes over battered armour raising a giant golden eagle standard on a dune crest at sunrise, before him thousands of Bedouin legionaries on camels and trucks, Roman shields painted with desert symbols, spears raised in salute; triumphant, epic, glorious"
        effects:
          - {effect: add_ideas, value: ZWM_av_leyenda_severo}
          - {effect: add_political_power, value: 100}
          - {effect: add_manpower, value: 60000}
          - {effect: ensure_template, name: "Cohorte de las Arenas", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Cohorte de las Arenas", name: "Legio I Arenaria", count: 3, experience: 0.5}
          - {effect: build, building: arms_factory, level: 2}
        close: {english: "Ave, Legatus.", spanish: "Ave, Legatus."}
      - id: 113
        who: severo
        kind: neutral
        title: {english: "Trial in Rome", spanish: "Juicio en Roma"}
        desc:
          english: "Severo walked into Rome barefoot and presented himself to the praetor. The trial lasted six months and was a huge success with the public. Arbogast's lawyers demanded death; Varro's demanded acquittal, just to annoy Arbogast. In the end the court ruled that an aquilifer cannot be guilty of losing an Eagle that was officially never lost.\\n\\nHe was released, without a pension. He now gives guided tours of the Forum. The Emirates got nothing out of it, except a very good story."
          spanish: "Severo entró a Roma descalzo y se presentó ante el pretor. El juicio duró seis meses y fue un éxito de público. Los abogados de Arbogast pedían la muerte; los de Varro, la absolución, solo para molestar a Arbogast. Al final el tribunal resolvió que un aquilífero no puede ser culpable de perder un Águila que oficialmente nunca se perdió.\\n\\nLo soltaron, sin pensión. Ahora hace visitas guiadas por el Foro. Los Emiratos no sacaron nada de todo esto, salvo una historia muy buena."
        effects: [{effect: add_political_power, value: 10}]
        close: {english: "Case dismissed.", spanish: "Caso cerrado."}
      - id: 114
        who: severo
        kind: positivo
        title: {english: "The Gilded Chains", spanish: "Las Cadenas Doradas"}
        desc:
          english: "Severo drilled the Emir's army for a year with the patience of a man who has nowhere else to go. Formations, logistics, latrines dug at regulation depth. The Emir's riders hated him, then feared him, then started winning. Caíd Tariq al-Hashimi says he has never seen men so miserable and so dangerous.\\n\\nThe chains are still on, technically. Severo had them lengthened, gilded again and made into a belt. He never found the Eagle. He found something he likes better: men who do as they are told."
          spanish: "Severo entrenó al ejército del Emir durante un año con la paciencia de un hombre que no tiene adónde ir. Formaciones, logística, letrinas cavadas a la profundidad reglamentaria. Los jinetes del Emir lo odiaron, después le tuvieron miedo, después empezaron a ganar. El Caíd Tariq al-Hashimi dice que nunca vio hombres tan amargados y tan peligrosos.\\n\\nLas cadenas siguen puestas, técnicamente. Severo las hizo alargar, volver a dorar y convertir en cinturón. Nunca encontró el Águila. Encontró algo que le gusta más: hombres que hacen lo que se les dice."
        effects: [{effect: timed_idea, idea: ZWM_av_bendicion, days: 365}, {effect: army_experience, value: 25}, {effect: tech_bonus, category: infantry_weapons, bonus: 0.5, uses: 2}, {effect: add_political_power, value: 40}]
        close: {english: "Dig deeper.", spanish: "Más hondo."}
      - id: 115
        who: severo
        kind: muerte
        title: {english: "The Heart of the Eagle", spanish: "El Corazón del Águila"}
        desc:
          english: "The fusion core of a legionary Eagle is a sealed sphere the size of a melon, designed to withstand artillery, lightning and the Senate. It is not designed to withstand a Roman with a rock and nine years of resentment. It breaks on the eleventh blow.\\n\\nThe flash was seen from Aden. The well is now a glass funnel two hundred metres wide. They found Severo's helmet four kilometres away, still polished, the lion skin intact. Nobody will ever carry that Eagle again. He was right about that."
          spanish: "El núcleo de fusión de un Águila legionaria es una esfera sellada del tamaño de un melón, diseñada para resistir artillería, rayos y al Senado. No está diseñada para resistir a un romano con una piedra y nueve años de resentimiento. Se rompe al undécimo golpe.\\n\\nEl fogonazo se vio desde Adén. El pozo es ahora un embudo de vidrio de doscientos metros de ancho. Encontraron el casco de Severo a cuatro kilómetros, todavía lustrado, con la piel de león intacta. Nadie va a volver a cargar esa Águila. En eso tenía razón."
        art: "A blinding white-gold flash erupting from a desert well, a pillar of light and molten glass rising into the night sky; in the foreground, far away, a polished Roman helmet with a lion skin lands upright in the sand; silhouettes of fleeing camels; apocalyptic, sublime, awe-struck"
        effects: [{effect: timed_idea, idea: ZWM_av_martir, days: 365}, {effect: add_war_support, value: 0.05}]
        close: {english: "Nobody carries it now.", spanish: "Ya nadie la carga."}
      - id: 116
        who: severo
        kind: negativo
        title: {english: "The Lost Legion", spanish: "La Legión Perdida"}
        desc:
          english: "Severo nailed a frying pan to a spear and proclaimed the Lost Legion: no emirs, no Rome, no masters, only the desert and the shield wall. Half of the Emir's riders went over to him within a week, trucks and all. The other half are hunting them across the dunes.\\n\\nThe Emirates are at war with themselves, and the Lost Legion is winning more than it should, because it fights like Rome and thinks like the desert. Somewhere in Rome, Arbogast laughs for the first time in years."
          spanish: "Severo clavó una sartén en una lanza y proclamó la Legión Perdida: ni emires, ni Roma, ni amos, solo el desierto y el muro de escudos. La mitad de los jinetes del Emir se le pasaron en una semana, con camiones y todo. La otra mitad los está cazando por las dunas.\\n\\nLos Emiratos están en guerra consigo mismos, y la Legión Perdida gana más de lo que debería, porque pelea como Roma y piensa como el desierto. En algún lugar de Roma, Arbogast se ríe por primera vez en años."
        effects: [{effect: timed_idea, idea: ZWM_av_maldicion, days: 365}, {effect: add_stability, value: -0.05}]
        # catastrófico: guerra civil contra la Legión Perdida
        catastrophe:
          rebellion:
            cosmetic_tag: ZWM_LEGION_PERDIDA
            ideology: fascism
            size: 0.3
            leader: {english: "Legate Gaius Severo", spanish: "Legado Gaius Severo"}
        close: {english: "No masters.", spanish: "Sin amos."}
      # ---------------------------------------------------------------- Umm Jabbar
      - id: 121
        who: umm
        kind: muerte
        title: {english: "Hamida's Last Charge", spanish: "La Última Carga de Hamida"}
        desc:
          english: "Umm Jabbar drove Hamida straight into the minefield at full speed, which for twelve camels and a twentieth-century armoured carrier is about twenty kilometres an hour, singing her son's favourite song. The first mine took the samovar. The second took the camels' patience. The third took everything.\\n\\nThe explosions dug up the base of the pylon, and the Eagle buried beneath it flew into the air and landed on the dunes, intact, for anyone to collect. The Beni Ghul did. They will not say what they did with it. They only say that Umm Jabbar found her son."
          spanish: "Umm Jabbar metió a Hamida en el campo minado a toda velocidad, que para doce camellos y un transporte blindado del siglo veinte son unos veinte kilómetros por hora, cantando la canción preferida de su hijo. La primera mina se llevó el samovar. La segunda, la paciencia de los camellos. La tercera, todo.\\n\\nLas explosiones desenterraron la base de la torre, y el Águila, enterrada debajo, salió volando y cayó en las dunas, intacta, para el que quisiera juntarla. Los Beni Ghul la juntaron. No dicen qué hicieron con ella. Dicen solamente que Umm Jabbar encontró a su hijo."
        art: "An old armoured personnel carrier pulled by twelve galloping camels charging through a minefield toward a desert power pylon, explosions blooming like red flowers around it, a blind old woman standing in the hatch singing with arms raised, a golden eagle flung into the sky by the blasts; tragic, operatic, gory, glorious"
        effects: [{effect: timed_idea, idea: ZWM_av_martir, days: 365}, {effect: equipment, type: infantry_equipment, amount: 2000}, {effect: add_war_support, value: 0.05}]
        close: {english: "She found him.", spanish: "Lo encontró."}
      - id: 122
        who: umm
        kind: objetivo
        title: {english: "The Eyes of the Eagle", spanish: "Los Ojos del Águila"}
        desc:
          english: "Her grandsons cut out the Eagle's eyes, and a Bedouin surgeon who learned his trade on camels put them in their grandmother's skull, without anaesthetic, because she refused it. Umm Jabbar opened gold-rimmed eyes and saw, for the first time in thirty years, the face of her grandson, the pylon, the desert and, three kilometres away, a column of frumentarii pretending to be traders.\\n\\nThey did not get far. Since then she has led every tribe of the Empty Quarter. She sees in the dark and through walls, and nobody in the Emirates dares to lie to her face."
          spanish: "Sus nietos le sacaron los ojos al Águila y un cirujano beduino que aprendió el oficio con camellos se los puso en el cráneo a la abuela, sin anestesia, porque no la quiso. Umm Jabbar abrió unos ojos con borde de oro y vio, por primera vez en treinta años, la cara de su nieto, la torre, el desierto y, a tres kilómetros, una columna de frumentarios disfrazados de comerciantes.\\n\\nNo llegaron muy lejos. Desde entonces ella manda a todas las tribus del Cuarto Vacío. Ve en la oscuridad y a través de las paredes, y nadie en los Emiratos se anima a mentirle en la cara."
        art: "Close-up of an ancient Bedouin matriarch with a tattooed chin, her eye sockets now holding glowing gold-rimmed camera lenses with red light, blood running down her cheeks like tears as she smiles; behind her a desert army of tribes on camels and trucks gathers at dawn under a ruined pylon; fierce, gory, triumphant"
        effects:
          - {effect: add_ideas, value: ZWM_av_leyenda_umm}
          - {effect: add_political_power, value: 100}
          - {effect: add_manpower, value: 80000}
          - {effect: ensure_template, name: "Cohorte de las Arenas", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Cohorte de las Arenas", name: "Hijos de Jabbar", count: 3, experience: 0.4}
          - {effect: build, building: arms_factory, level: 1}
          - {effect: capital, effects: [{effect: resource_here, resource: oil, amount: 8}]}
        close: {english: "She sees you.", spanish: "Te está viendo."}
      - id: 123
        who: umm
        kind: objetivo
        title: {english: "The Gossip That Split Rome", spanish: "El Chisme que Partió a Roma"}
        desc:
          english: "Senator Lucius Varro paid in gold, in platinum and with a Roman frigate, and then played the recordings on every screen in the Forum. Rome watched its most famous legate bury his own Eagle and shoot two engineers to blame the Senate. The legions took sides before nightfall.\\n\\nNobody in Rome is thinking about the desert any more; they are too busy hating each other. Umm Jabbar did not see it, being blind, but she heard all of it on the radio, and she laughed for the first time since Ma'rib. Then she bought the Beni Ghul a fleet of trucks."
          spanish: "El senador Lucius Varro pagó en oro, en platino y con una fragata romana, y después pasó las grabaciones en cada pantalla del Foro. Roma vio a su legado más famoso enterrar su propia Águila y matar a dos ingenieros para echarle la culpa al Senado. Las legiones eligieron bando antes de que cayera la noche.\\n\\nYa nadie en Roma piensa en el desierto; están demasiado ocupados odiándose entre ellos. Umm Jabbar no lo vio, porque es ciega, pero lo escuchó todo por la radio, y se rió por primera vez desde Ma'rib. Después les compró a los Beni Ghul una flota de camiones."
        effects:
          - {effect: add_ideas, value: ZWM_av_leyenda_umm}
          - {effect: add_political_power, value: 150}
          - {effect: equipment, type: motorized_equipment, amount: 400}
          - effect: if
            # solo si NRE la maneja la IA (una aventura de la IA no castiga al jugador)
            when: {all: [{country_exists: NRE}, {country: {tag: NRE, when: {is_ai: true}}}]}
            then:
              - effect: scope
                target: NRE
                effects: [{effect: add_stability, value: -0.15}, {effect: add_war_support, value: -0.1}, {effect: add_political_power, value: -100}]
        close: {english: "Rome is busy.", spanish: "Roma está ocupada."}
      - id: 124
        who: umm
        kind: positivo
        title: {english: "The Peacock's Bride", spanish: "La Novia del Pavo Real"}
        desc:
          english: "The wedding lasted nine days and united eleven tribes, two emirs and a white tiger. Umm Jabbar wore black. The Peacock wore everything else. At the feast she told him to his face that she would bury him, and he laughed, and she probably will.\\n\\nShe never found the Eagle and stopped caring about it somewhere around the fourth day of dancing. The Beni Ghul now have a prince, a palace and a seat at the Court. Arbogast, she says, can wait. She is very good at waiting."
          spanish: "La boda duró nueve días y unió a once tribus, dos emires y un tigre blanco. Umm Jabbar fue de negro. El Pavo Real, de todo lo demás. En la fiesta le dijo en la cara que lo iba a enterrar, y él se rió, y probablemente lo entierre.\\n\\nNunca encontró el Águila y dejó de importarle más o menos al cuarto día de baile. Los Beni Ghul ahora tienen un príncipe, un palacio y un lugar en la Corte. Arbogast, dice ella, puede esperar. Ella es muy buena esperando."
        effects: [{effect: timed_idea, idea: ZWM_av_bendicion, days: 365}, {effect: add_manpower, value: 30000}, {effect: add_stability, value: 0.04}, {effect: add_political_power, value: 50}]
        close: {english: "Long live the bride.", spanish: "Viva la novia."}
      - id: 125
        who: umm
        kind: neutral
        title: {english: "Son and Eagle", spanish: "Hijo y Águila"}
        desc:
          english: "They buried them together at the foot of the pylon: Jabbar's bones wrapped in white, and the Eagle wrapped in a carpet, still talking, then muffled, then quiet. Umm Jabbar sat on the grave for a day and a night, and then went home.\\n\\nRome never learned what happened to its Eagle. The Emirs never got it. The sand at Ma'rib has stopped singing. Umm Jabbar says that is the best song of all."
          spanish: "Los enterraron juntos al pie de la torre: los huesos de Jabbar envueltos en blanco, y el Águila envuelta en una alfombra, todavía hablando, después ahogada, después callada. Umm Jabbar se sentó sobre la tumba un día y una noche, y después volvió a casa.\\n\\nRoma nunca supo qué pasó con su Águila. Los Emires nunca la tuvieron. La arena de Ma'rib dejó de cantar. Umm Jabbar dice que esa es la mejor canción de todas."
        effects: [{effect: add_stability, value: 0.01}]
        close: {english: "Silence.", spanish: "Silencio."}

  # ===========================================================================
  # CAUDILLOS DEL AMAZONAS: La Selva de Acero
  # (lore: el Bioacero del Imperio, 06_mechanics; el Coronel Tiago Barbosa,
  # que gobierna los ríos desde una cañonera, 03_leaders)
  # ===========================================================================
  ZWB:
    name: {english: "The Steel Jungle", spanish: "La Selva de Acero"}
    palette: "deep jungle greens and brown river water against shining chrome and silver, rust orange, humid haze and shafts of light; living-steel trees, airship wrecks and old gunboats"
    ideas:
      - id: ZWB_av_bendicion
        name: {english: "The Jungle Breathes", spanish: "La Selva Respira"}
        desc: {english: "The rivers run, the boats run, and for once nothing is eating anything.", spanish: "Los ríos corren, los barcos andan y, por una vez, nada se está comiendo a nada."}
        modifiers: {stability_factor: 0.05, war_support_factor: 0.05, recruitable_population_factor: 0.03}
      - id: ZWB_av_maldicion
        name: {english: "The Rust", spanish: "La Herrumbre"}
        desc: {english: "Everything metal flakes, creaks or disappears overnight. So does trust.", spanish: "Todo lo de metal se descascara, cruje o desaparece de un día para el otro. La confianza también."}
        modifiers: {stability_factor: -0.07, recruitable_population_factor: -0.05, political_power_gain: -0.1}
      - id: ZWB_av_martir
        name: {english: "Steel Flowers", spanish: "Flores de Acero"}
        desc: {english: "On the grave, a silver flower that never wilts. The young men pin copies to their hats.", spanish: "Sobre la tumba, una flor plateada que no se marchita nunca. Los muchachos se prenden copias en el sombrero."}
        modifiers: {war_support_factor: 0.1, army_defence_factor: 0.05}
      - id: ZWB_av_muro_verde
        name: {english: "The Living Green Wall", spanish: "El Muro Verde Vivo"}
        desc: {english: "Forty metres of steel trees with thorns like bayonets. Nobody crosses without asking.", spanish: "Cuarenta metros de árboles de acero con espinas como bayonetas. Nadie cruza sin pedir permiso."}
        modifiers: {army_defence_factor: 0.12, army_org_factor: 0.05}
      - id: ZWB_av_leyenda_joana
        name: {english: "Motosserra Inc.", spanish: "Motosserra S.A."}
        desc: {english: "The richest mine on Earth is a forest, and an eight-fingered logger sets the price.", spanish: "La mina más rica de la Tierra es un bosque, y el precio lo pone una hachera de ocho dedos."}
        modifiers: {industrial_capacity_factory: 0.1, production_speed_arms_factory_factor: 0.1, local_resources_factor: 0.1}
      - id: ZWB_av_leyenda_anselmo
        name: {english: "The Church of Living Steel", spanish: "La Iglesia del Acero Vivo"}
        desc: {english: "Two hundred parishes, a pope with a crown of silver leaves and a doctrine: leave the forest alone.", spanish: "Doscientas parroquias, un papa con corona de hojas plateadas y una doctrina: dejen en paz al bosque."}
        modifiers: {stability_factor: 0.1, political_power_gain: 0.15, recruitable_population_factor: 0.05}
      - id: ZWB_av_leyenda_kaua
        name: {english: "The Voice of the Jungle", spanish: "La Voz de la Selva"}
        desc: {english: "A boy speaks for the forest, and the forest has stopped being afraid.", spanish: "Un chico habla por el bosque, y el bosque dejó de tener miedo."}
        modifiers: {army_defence_factor: 0.1, army_org_factor: 0.05, stability_factor: 0.05}

    intro:
      title: {english: "The Forest That Eats Iron", spanish: "El Bosque que Come Hierro"}
      desc:
        english: "Three months ago an Imperial cargo airship fell on the Juruá river carrying forty tonnes of Bioacero spores, the living steel the Empire grows by the ton in the old pampa. Nobody shot it down. It simply fell, as if something below had called it.\\n\\nNow there is a forest that grows a hundred metres a day, with trunks of living steel and vines that swallow anything made of metal: rifles, boats, the Eirunepé bridge and, they say, a dentist. Colonel Tiago Barbosa, from the bridge of his gunboat, has promised half of whatever can be sold to whoever reaches the heart of the forest and tames it, or puts it out. Three people took him up on it. Choose whose muddy boots you will wear."
        spanish: "Hace tres meses un dirigible de carga del Imperio cayó sobre el río Juruá con cuarenta toneladas de esporas de Bioacero, el acero vivo que el Imperio cultiva por tonelada en la vieja pampa. Nadie lo derribó. Simplemente cayó, como si algo de abajo lo hubiera llamado.\\n\\nAhora hay un bosque que crece cien metros por día, con troncos de acero vivo y lianas que se tragan cualquier cosa de metal: fusiles, lanchas, el puente de Eirunepé y, dicen, un dentista. El Coronel Tiago Barbosa, desde el puente de su cañonera, prometió la mitad de lo que se pueda vender a quien llegue al corazón del bosque y lo domestique, o lo apague. Tres personas aceptaron. Elegí en qué botas embarradas te metés."
      art: "A crashed Imperial cargo airship draped over a jungle river; from its broken gondola a forest of shining living-steel trees erupts and spreads across the green canopy like chrome frost, steel vines swallowing a bridge and riverboats; an old river gunboat watches from the brown water; humid haze, chrome and rust; ominous, wondrous, mythic"
    characters:
      - id: joana
        name: {english: "Joana 'Motosserra' da Silva", spanish: "Joana «Motosserra» da Silva"}
        pick: {english: "Joana Motosserra, the eight-fingered logger who has already felled one steel tree and wants the rest.", spanish: "Joana Motosserra, la hachera de ocho dedos que ya volteó un árbol de acero y quiere el resto."}
        first: 10
      - id: anselmo
        name: {english: "Father Anselmo Prates", spanish: "El Padre Anselmo Prates"}
        pick: {english: "Father Anselmo, expelled from three religious orders and one asylum, who thinks the forest is the New Jerusalem.", spanish: "El Padre Anselmo, expulsado de tres órdenes religiosas y un manicomio, que cree que el bosque es la Nueva Jerusalén."}
        first: 20
      - id: kaua
        name: {english: "Kauã", spanish: "Kauã"}
        pick: {english: "Kauã, eleven years old, with a steel flower growing in the palm of his hand.", spanish: "Kauã, once años, con una flor de acero creciéndole en la palma de la mano."}
        first: 30

    nodes:
      # ---------------------------------------------------------------- Joana
      - id: 10
        who: joana
        title: {english: "Dona Fátima", spanish: "Dona Fátima"}
        desc:
          english: "You are Joana da Silva, called Motosserra, thirty-eight, logger of the Juruá. Dona Fátima is your chainsaw: a 2070 Imperial model with a diamond chain, which you stole from an Imperial forestry camp along with the forester's lunch. You are the only person alive who has cut down a Bioacero tree. It cost you two fingers and Dona Fátima's original chain.\\n\\nThat was a single tree. Now there is a whole forest of them, growing a hundred metres a day, and every ton of living steel is worth more than your village. The Colonel says half of whatever can be sold. You have always been good at sums."
          spanish: "Sos Joana da Silva, alias Motosserra, treinta y ocho años, hachera del Juruá. Dona Fátima es tu motosierra: un modelo imperial de 2070 con cadena de diamante, que te robaste de un campamento forestal del Imperio junto con el almuerzo del guardabosques. Sos la única persona viva que volteó un árbol de Bioacero. Te costó dos dedos y la cadena original de Dona Fátima.\\n\\nEso fue un solo árbol. Ahora hay un bosque entero, que crece cien metros por día, y cada tonelada de acero vivo vale más que tu pueblo. El Coronel dice la mitad de lo que se pueda vender. Siempre fuiste buena para las cuentas."
        art: "A tough mestiza woman logger with eight fingers, muddy boots and a bandana, a huge diamond-chained chainsaw over her shoulder, standing on a riverboat facing a wall of jungle where the trees have bark of shining living steel and vines like steel cables; humid green haze, rust and chrome; heroic, grimy, wondrous"
        options:
          - name: {english: "Go upriver alone with Dona Fátima.", spanish: "Subir el río sola con Dona Fátima."}
            effects: [{effect: army_experience, value: 5}]
            next: 11
          - name: {english: "Join the Colonel's gunboat expedition.", spanish: "Sumarte a la expedición de la cañonera del Coronel."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 1000}]
            next: 12
      - id: 11
        who: joana
        title: {english: "The Swallowed Village", spanish: "El Pueblo Tragado"}
        desc:
          english: "Eirunepé is half inside the forest now. Steel vines have gone through the church and lifted the bell to the top of a metal tree, where it rings when the wind blows. The forest takes anything with iron in it: nails, pots, rifles. A dog is fused into a fence, wagging. A man is fused into a lamppost. He is not wagging.\\n\\nDona Fátima cuts through the first trunk in eleven minutes. The sap is liquid metal, warm and silver, and it pools around your boots like money. On the river, a High Seas hydrofoil is already waiting with its engines off."
          spanish: "Eirunepé ya está medio adentro del bosque. Las lianas de acero atravesaron la iglesia y levantaron la campana a la punta de un árbol de metal, donde suena cuando hay viento. El bosque se lleva todo lo que tenga hierro: clavos, ollas, fusiles. Un perro quedó fundido a un alambrado, moviendo la cola. Un hombre quedó fundido a un poste de luz. Ese no mueve nada.\\n\\nDona Fátima corta el primer tronco en once minutos. La savia es metal líquido, tibio y plateado, y se junta alrededor de tus botas como si fuera plata. En el río ya espera un hidroala de la Alta Mar con los motores apagados."
        options:
          - name: {english: "Sell the first logs to the High Seas. They pay in rifles.", spanish: "Venderle los primeros troncos a la Alta Mar. Pagan en fusiles."}
            effects: [{effect: add_political_power, value: 40}, {effect: equipment, type: infantry_equipment, amount: 2000}]
            next: 13
          - name: {english: "Keep cutting toward the heart.", spanish: "Seguir cortando hacia el corazón."}
            skulls: 1
            next: 14
      - id: 12
        who: joana
        title: {english: "The Gunboat Marechal Rondon", spanish: "La Cañonera Marechal Rondon"}
        desc:
          english: "Colonel Tiago Barbosa commands from the bridge of the Marechal Rondon, a river gunboat older than his grandfather, wearing the uniform of an army that no longer exists and the hat of one that never did. He wants the forest harvested and sold to everyone, including the Empire, whose spores they were.\\n\\nAlso aboard is Doctor Valentina Krause, Imperial biologist, sent to recover the spores or burn them, together with anyone who has touched them. She has a flamethrower and very good manners. The Colonel and the Doctor have stopped speaking to each other. Both are speaking to you."
          spanish: "El Coronel Tiago Barbosa manda desde el puente de la Marechal Rondon, una cañonera de río más vieja que su abuelo, con el uniforme de un ejército que ya no existe y el sombrero de uno que no existió nunca. Quiere cosechar el bosque y venderlo a todo el mundo, incluido el Imperio, de quien eran las esporas.\\n\\nA bordo también va la Doctora Valentina Krause, bióloga imperial, mandada a recuperar las esporas o a quemarlas, junto con cualquiera que las haya tocado. Tiene un lanzallamas y muy buenos modales. El Coronel y la Doctora dejaron de hablarse. Los dos te hablan a vos."
        options:
          - name: {english: "Side with the Colonel: harvest.", spanish: "Ponerte del lado del Coronel: cosechar."}
            effects: [{effect: build, building: industrial_complex, level: 1}]
            next: 14
          - name: {english: "Side with the Doctor: burn it all.", spanish: "Ponerte del lado de la Doctora: quemar todo."}
            effects: [{effect: add_stability, value: 0.02}]
            next: 15
      - id: 13
        who: joana
        title: {english: "The Hydrofoil", spanish: "El Hidroala"}
        desc:
          english: "The High Seas pay in pearls and promises, and their captain, a cheerful Fijian called Ratu Seru, wants more than logs. He wants a seed: the heart of the forest, the first spore, the one all of this grew from. With it the Nation could grow its own Bioacero on its floating cities and stop paying the Empire.\\n\\nThe Empire, you suspect, would have something to say about that. Ratu Seru has a map, a mine detector and four sailors who look at Dona Fátima with professional jealousy. His hydrofoil has a lovely steel hull."
          spanish: "La Alta Mar paga en perlas y promesas, y su capitán, un fiyiano alegre llamado Ratu Seru, quiere algo más que troncos. Quiere una semilla: el corazón del bosque, la primera espora, la que hizo crecer todo esto. Con ella, la Nación podría cultivar su propio Bioacero en sus ciudades flotantes y dejar de pagarle al Imperio.\\n\\nEl Imperio, sospechás, tendría algo que decir al respecto. Ratu Seru tiene un mapa, un detector de minas y cuatro marineros que miran a Dona Fátima con celos profesionales. Su hidroala tiene un casco de acero precioso."
        options:
          - name: {english: "Guide them to the heart.", spanish: "Guiarlos hasta el corazón."}
            next: 16
          - name: {english: "Cut the hydrofoil loose from the vines while they sleep. That is a lot of steel.", spanish: "Cortar las lianas del hidroala mientras duermen. Es un montón de acero."}
            skulls: 2
            next: 101
          - name: {english: "Sell them the heart before you have even found it.", spanish: "Venderles el corazón antes de encontrarlo."}
            effects: [{effect: add_political_power, value: 60}]
            next: 102
      - id: 14
        who: joana
        title: {english: "The Living Sawmill", spanish: "El Aserradero Vivo"}
        desc:
          english: "The Colonel's sawmill stands at the edge of the forest, and every day the edge is closer. Living steel cuts like iron and bleeds like a body: the saws scream, and the logs scream back. The workers come down with steel rash: little silver scales on their arms, then their necks, then their eyelids. They do not complain, because the pay is triple.\\n\\nBarbosa wants a crew to push on to the heart and find out what is feeding the forest. He also wants someone to run the sawmill, which is turning out bioacero rifle barrels that never rust and sometimes grow."
          spanish: "El aserradero del Coronel está en el borde del bosque, y cada día el borde está más cerca. El acero vivo se corta como hierro y sangra como un cuerpo: las sierras gritan, y los troncos contestan. Los peones se agarran el sarpullido de acero: escamitas plateadas en los brazos, después en el cuello, después en los párpados. No se quejan, porque la paga es triple.\\n\\nBarbosa quiere una cuadrilla que llegue al corazón y averigüe qué alimenta al bosque. También quiere a alguien que maneje el aserradero, que está sacando caños de fusil de bioacero que nunca se oxidan y a veces crecen."
        options:
          - name: {english: "Take a crew to the heart.", spanish: "Llevar una cuadrilla al corazón."}
            next: 16
          - name: {english: "Run the sawmill. Tons are tons.", spanish: "Manejar el aserradero. Las toneladas son toneladas."}
            effects: [{effect: build, building: arms_factory, level: 1}]
            next: 17
      - id: 15
        who: joana
        title: {english: "The Doctor's Flamethrower", spanish: "El Lanzallamas de la Doctora"}
        desc:
          english: "Doctor Krause sets the forest on fire with the efficiency of someone who has done it before, to other forests, in other countries. Living steel does not burn. It melts, it runs, it pours into the river in rivers of silver, and the next morning the fish come up armoured, with scales like coins and very bad tempers.\\n\\nKrause has lost all interest in burning anything. She wants samples, the heart, everything, for the Empire, and she wants you to carry the sample cases. Or you could take your fee and go home while you still have eight fingers."
          spanish: "La Doctora Krause prende fuego el bosque con la eficiencia de alguien que ya lo hizo antes, con otros bosques, en otros países. El acero vivo no se quema. Se derrite, corre, se vuelca al río en ríos de plata, y a la mañana siguiente los peces salen acorazados, con escamas como monedas y muy mal carácter.\\n\\nA Krause ya no le interesa quemar nada. Quiere muestras, el corazón, todo, para el Imperio, y quiere que vos cargues las valijas de muestras. O podrías cobrar tu parte y volver a casa mientras todavía tenés ocho dedos."
        options:
          - name: {english: "Carry the sample cases. The Empire pays well.", spanish: "Cargar las valijas de muestras. El Imperio paga bien."}
            next: 17
          - name: {english: "Take your fee and go home.", spanish: "Cobrar tu parte y volver a casa."}
            next: 103
      - id: 16
        who: joana
        title: {english: "The Heart of the Forest", spanish: "El Corazón del Bosque"}
        place: [Amazonas]
        desc:
          english: "The heart of the forest is the airship. Or what is left of it: the gondola has grown into a steel tree three hundred metres tall, its envelope spread like a canopy of silver leaves. At its centre, inside a cage of roots, pulses the first spore, a seed the size of a man's head, beating like a heart and warm to the touch.\\n\\nThe airship's crew are still here, fused into the trunk up to their chests, alive, whispering prayers in German and Portuguese. They beg you to cut them out. The heart, Dona Fátima informs you with a growl, can only be cut once."
          spanish: "El corazón del bosque es el dirigible. O lo que queda de él: la góndola se volvió un árbol de acero de trescientos metros, con la envoltura abierta como un dosel de hojas plateadas. En el centro, adentro de una jaula de raíces, late la primera espora, una semilla del tamaño de una cabeza, que golpea como un corazón y está tibia al tacto.\\n\\nLa tripulación del dirigible sigue acá, fundida al tronco hasta el pecho, viva, rezando en alemán y en portugués. Te ruegan que los saques. El corazón, te avisa Dona Fátima con un gruñido, se puede cortar una sola vez."
        art: "In a cathedral-like clearing, a crashed airship gondola has grown into a colossal living-steel tree with a canopy of silver leaves; at its base a cage of steel roots holds a pulsing, glowing seed like a heart, and the crew are fused into the trunk up to their chests, reaching out; a woman logger raises a roaring diamond chainsaw; awe, body horror, epic"
        options:
          - name: {english: "Cut out the heart.", spanish: "Cortar el corazón."}
            next: 104
          - name: {english: "Cut out the crew first. They are still alive.", spanish: "Sacar primero a la tripulación. Todavía están vivos."}
            skulls: 1
            next: 105
      - id: 17
        who: joana
        title: {english: "Tons", spanish: "Toneladas"}
        desc:
          english: "Whatever road brought you here, you are now the person who knows most about cutting living steel, and that makes you rich and very popular. Doctor Krause offers you an Imperial contract: every ton you cut goes south to the Empire's foundries, at a fair price, with Imperial protection, which means Imperial soldiers on the river.\\n\\nColonel Barbosa, chewing his hat, offers something else: a cooperative. The loggers, the river towns and his gunboat, owners of everything they cut. He cannot pay as much. He has never been able to pay as much."
          spanish: "Sea cual sea el camino que te trajo, ahora sos la persona que más sabe de cortar acero vivo, y eso te hace rica y muy popular. La Doctora Krause te ofrece un contrato imperial: cada tonelada que cortes va al sur, a las fundiciones del Imperio, a precio justo, con protección imperial, que quiere decir soldados imperiales en el río.\\n\\nEl Coronel Barbosa, mordiendo el sombrero, te ofrece otra cosa: una cooperativa. Los hacheros, los pueblos del río y su cañonera, dueños de todo lo que corten. No puede pagar tanto. Nunca pudo pagar tanto."
        options:
          - name: {english: "Sign with the Empire. Money has no flag.", spanish: "Firmar con el Imperio. La plata no tiene bandera."}
            next: 106
          - name: {english: "Join the Colonel's cooperative.", spanish: "Sumarte a la cooperativa del Coronel."}
            next: 107
      # ---------------------------------------------------------------- Anselmo
      - id: 20
        who: anselmo
        title: {english: "The Floating Mission", spanish: "La Misión Flotante"}
        desc:
          english: "You are Father Anselmo Prates, sixty-two, expelled from the Jesuits, the Franciscans, the Salesians and the psychiatric hospital of Belém, in that order. You run a floating mission: a raft-church with a bell, a satellite dish and a congregation of river people, dolphins and anyone who will listen.\\n\\nWhen the steel forest appeared, you understood at once. Revelation, chapter twenty-one: 'and the city was pure gold, like unto clear glass'. Steel, gold: close enough. God has planted a garden on the Juruá, and it needs a gardener."
          spanish: "Sos el Padre Anselmo Prates, sesenta y dos años, expulsado de los jesuitas, los franciscanos, los salesianos y el hospital psiquiátrico de Belém, en ese orden. Tenés una misión flotante: una iglesia-balsa con campana, antena satelital y una congregación de ribereños, delfines y cualquiera que quiera escuchar.\\n\\nCuando apareció el bosque de acero, lo entendiste enseguida. Apocalipsis, capítulo veintiuno: «y la ciudad era de oro puro, semejante al vidrio limpio». Acero, oro: más o menos. Dios plantó un jardín en el Juruá, y necesita un jardinero."
        art: "A wild-bearded old priest in a patched cassock preaching ecstatically from a ramshackle raft-church with a bell tower and a satellite dish, drifting down a brown jungle river toward a shining forest of living-steel trees; pink river dolphins and canoes of villagers listening; holy, absurd, luminous"
        options:
          - name: {english: "Preach the Gospel of Steel in the river towns.", spanish: "Predicar el Evangelio del Acero en los pueblos del río."}
            effects: [{effect: add_manpower, value: 5000}]
            next: 21
          - name: {english: "Paddle straight into the forest to meet God.", spanish: "Remar derecho al bosque a encontrarte con Dios."}
            next: 22
      - id: 21
        who: anselmo
        title: {english: "The Gospel of Steel", spanish: "El Evangelio del Acero"}
        desc:
          english: "The river towns have always loved a good sermon, and yours are the best in three hundred kilometres: fire, steel and a raffle at the end. Within a month you have two thousand faithful. Within two, some of them let the steel rash grow on their palms and call it stigmata. They are known as the Steeled, and they have stopped paying taxes, since God does not either.\\n\\nColonel Barbosa has noticed the taxes. He sends a launch with a polite message and an impolite machine gun."
          spanish: "A los pueblos del río siempre les gustó un buen sermón, y los tuyos son los mejores en trescientos kilómetros: fuego, acero y una rifa al final. En un mes tenés dos mil fieles. En dos, algunos se dejan crecer el sarpullido de acero en las palmas y le dicen estigmas. Les dicen los Acerados, y dejaron de pagar impuestos, ya que Dios tampoco paga.\\n\\nEl Coronel Barbosa notó lo de los impuestos. Manda una lancha con un mensaje cortés y una ametralladora descortés."
        options:
          - name: {english: "Lead the faithful into the forest. Paradise awaits.", spanish: "Llevar a los fieles al bosque. El Paraíso espera."}
            next: 23
          - name: {english: "Make a deal with the Colonel: tithes for tolerance.", spanish: "Arreglar con el Coronel: diezmo a cambio de tolerancia."}
            effects: [{effect: add_political_power, value: 50}]
            next: 24
      - id: 22
        who: anselmo
        title: {english: "The Baptism", spanish: "El Bautismo"}
        desc:
          english: "You wade into the forest's river up to your waist. The water is as bright as mercury and sings a little. A steel vine touches your hand, tenderly, like a dog, and your hand begins to change: the skin turns silver, the nails chrome, the fingers stiffen into something beautiful and slightly too long.\\n\\nIt does not hurt. In fact, through the hand you can hear something: a vast, slow voice, older than the Empire and younger than you, saying a single word you do not understand. You are almost sure it is not 'Anselmo'."
          spanish: "Te metés al río del bosque hasta la cintura. El agua brilla como mercurio y canta un poco. Una liana de acero te toca la mano, con ternura, como un perro, y la mano empieza a cambiar: la piel se vuelve plateada, las uñas cromadas, los dedos se endurecen en algo hermoso y un poquito demasiado largo.\\n\\nNo duele. Es más, a través de la mano escuchás algo: una voz enorme y lenta, más vieja que el Imperio y más joven que vos, diciendo una sola palabra que no entendés. Estás casi seguro de que no es «Anselmo»."
        options:
          - name: {english: "Let it spread. Faith is faith.", spanish: "Dejar que se extienda. La fe es la fe."}
            next: 24
          - name: {english: "Cut off the hand with a machete and run.", spanish: "Cortarte la mano con un machete y salir corriendo."}
            skulls: 1
            next: 25
      - id: 23
        who: anselmo
        title: {english: "The Pilgrimage", spanish: "La Peregrinación"}
        desc:
          english: "Two thousand pilgrims walk into the steel forest singing, and the forest receives them. At first it is beautiful: silver flowers open as they pass, the vines part like curtains. Then the first pilgrims stop walking. They stand with their arms raised, smiling, and the steel climbs up their legs, and they become trees, singing until their mouths turn to chrome.\\n\\nThe others keep singing. They think it is the Rapture. It might be. Behind you, the clearing where the forest has stopped growing looks very much like the foundations of a city."
          spanish: "Dos mil peregrinos entran cantando al bosque de acero, y el bosque los recibe. Al principio es hermoso: las flores plateadas se abren a su paso, las lianas se apartan como cortinas. Después los primeros peregrinos dejan de caminar. Se quedan parados con los brazos en alto, sonriendo, y el acero les sube por las piernas, y se vuelven árboles, cantando hasta que la boca se les hace cromo.\\n\\nLos demás siguen cantando. Creen que es el Rapto. Capaz que lo es. Detrás tuyo, el claro donde el bosque dejó de crecer se parece mucho a los cimientos de una ciudad."
        options:
          - name: {english: "Keep walking. Paradise is close.", spanish: "Seguir caminando. El Paraíso está cerca."}
            next: 111
          - name: {english: "Stop them! Turn them back, now!", spanish: "¡Párenlos! ¡Que vuelvan, ya!"}
            next: 26
          - name: {english: "Stop here and build the City of God in the clearing.", spanish: "Quedarse acá y levantar la Ciudad de Dios en el claro."}
            next: 112
      - id: 24
        who: anselmo
        title: {english: "The Tithe", spanish: "El Diezmo"}
        desc:
          english: "Whether by sermon or by miracle, two thousand faithful now follow you along the river, and Colonel Barbosa has come in person, on the Marechal Rondon, to discuss the matter of the Lord's taxes. He proposes a tithe: a tenth of the offerings for him, and in exchange he will not sink your church. Very Christian of him.\\n\\nOn his deck stands Doctor Valentina Krause, Imperial biologist, who is far more interested in your congregation's skin. The forest is spreading toward the Empire's border, she says. The Empire would pay a fortune for pious hands to prune it."
          spanish: "Sea por sermón o por milagro, ahora te siguen dos mil fieles a lo largo del río, y el Coronel Barbosa vino en persona, en la Marechal Rondon, a hablar del asunto de los impuestos del Señor. Propone un diezmo: un décimo de las ofrendas para él, y a cambio no te hunde la iglesia. Muy cristiano de su parte.\\n\\nEn su cubierta está la Doctora Valentina Krause, bióloga imperial, mucho más interesada en la piel de tu congregación. El bosque avanza hacia la frontera del Imperio, dice. El Imperio pagaría una fortuna por manos piadosas que lo poden."
        options:
          - name: {english: "Accept the Empire's gold. God's garden needs pruning.", spanish: "Aceptar el oro del Imperio. El jardín de Dios necesita poda."}
            effects: [{effect: add_political_power, value: 40}, {effect: build, building: industrial_complex, level: 1}]
            next: 26
          - name: {english: "Refuse. Nobody prunes the Lord's garden.", spanish: "Negarte. Al jardín del Señor no lo poda nadie."}
            effects: [{effect: add_war_support, value: 0.03}]
            next: 27
      - id: 25
        who: anselmo
        title: {english: "The Severed Hand", spanish: "La Mano Cortada"}
        desc:
          english: "You cut it off at the wrist with a machete, screaming hymns, and run. Behind you, the hand does not stay put. It crawls after you through the mud on its silver fingers, patiently, for three days, and on the third night it climbs onto your raft and curls up by the altar like a cat.\\n\\nThe faithful have seen it. Now they do not want you: they want the Hand. They kneel before it, they bring it offerings, they ask it questions, and it answers by tapping on the altar. It preaches better than you. It is a terrible thing to admit."
          spanish: "Te la cortás en la muñeca con un machete, gritando himnos, y salís corriendo. Detrás tuyo, la mano no se queda quieta. Te sigue por el barro arrastrándose con sus dedos plateados, con paciencia, durante tres días, y la tercera noche se sube a tu balsa y se enrosca al lado del altar como un gato.\\n\\nLos fieles la vieron. Ahora no te quieren a vos: quieren a la Mano. Se arrodillan ante ella, le traen ofrendas, le hacen preguntas, y ella contesta dando golpecitos en el altar. Predica mejor que vos. Es terrible tener que admitirlo."
        options:
          - name: {english: "Go back to preaching, one-handed.", spanish: "Volver a predicar, con una sola mano."}
            next: 27
          - name: {english: "Let the Hand lead the faithful.", spanish: "Dejar que la Mano guíe a los fieles."}
            next: 113
      - id: 26
        who: anselmo
        title: {english: "The Growing Cathedral", spanish: "La Catedral que Crece"}
        desc:
          english: "Wherever you stop to pray, the forest builds. First a steel arch over your head, then a nave, then a bell tower whose bells are the airship's old propellers. Within a month there is a cathedral of living steel in the middle of the jungle, grown around your sermons like a shell around a pearl. It is the most beautiful thing you have ever seen, and you have seen the Sistine Chapel, from the outside, before they threw you out.\\n\\nAt night the bells ring by themselves, and at last you understand the forest's word. It is not a prophecy. It is a request: leave me alone."
          spanish: "Donde sea que te detenés a rezar, el bosque construye. Primero un arco de acero sobre tu cabeza, después una nave, después un campanario cuyas campanas son las viejas hélices del dirigible. En un mes hay una catedral de acero vivo en el medio de la selva, crecida alrededor de tus sermones como una concha alrededor de una perla. Es lo más hermoso que viste en tu vida, y viste la Capilla Sixtina, desde afuera, antes de que te echaran.\\n\\nDe noche las campanas suenan solas, y por fin entendés la palabra del bosque. No es una profecía. Es un pedido: déjenme en paz."
        art: "A breathtaking gothic cathedral of living steel grown in the heart of the jungle, its spires made of silver trees, its bells the propellers of a crashed airship, light pouring through leaf-shaped windows of chrome; a tiny bearded priest kneels inside in the moonlight; sublime, sacred, uncanny"
        options:
          - name: {english: "Stay and listen. Leave it alone, and stay.", spanish: "Quedarte a escuchar. Dejarlo en paz, y quedarte."}
            next: 114
          - name: {english: "Carry the forest's word to the world.", spanish: "Llevar la palabra del bosque al mundo."}
            next: 115
      - id: 27
        who: anselmo
        title: {english: "The Colonel's Trial", spanish: "El Juicio del Coronel"}
        desc:
          english: "Colonel Barbosa arrests you for heresy, sedition and tax evasion, mainly tax evasion, and tries you on the deck of the Marechal Rondon, with himself as judge, his first mate as jury and a bucket of piranhas as the sentence. The forest's piranhas have chrome teeth now. They can bite through a boot. They have been tested on boots.\\n\\nYou have one chance to speak. Barbosa is a practical man: he does not want a sermon. He wants a miracle, preferably one that floats."
          spanish: "El Coronel Barbosa te arresta por herejía, sedición y evasión de impuestos, sobre todo evasión de impuestos, y te juzga en la cubierta de la Marechal Rondon, con él de juez, su primer oficial de jurado y un balde de pirañas de sentencia. Las pirañas del bosque ahora tienen dientes cromados. Atraviesan una bota. Las probaron con botas.\\n\\nTenés una oportunidad de hablar. Barbosa es un hombre práctico: no quiere un sermón. Quiere un milagro, en lo posible uno que flote."
        options:
          - name: {english: "Give him a sermon anyway. The best of your life.", spanish: "Darle un sermón igual. El mejor de tu vida."}
            next: 116
          - name: {english: "Offer him a miracle: a hull of living steel for his gunboat.", spanish: "Ofrecerle un milagro: un casco de acero vivo para su cañonera."}
            next: 117
      # ---------------------------------------------------------------- Kauã
      - id: 30
        who: kaua
        title: {english: "The Flower in the Palm", spanish: "La Flor en la Mano"}
        desc:
          english: "You are Kauã, eleven, from a riverside village on the Juruá. Since the airship fell you have dreamed of the forest every night, and every morning you wake up with warm hands. Last week a flower of steel bloomed in the palm of your left hand. It does not hurt. When you close your fist, the steel trees on the horizon close their leaves too.\\n\\nYour grandmother says you are cursed and sprinkles salt on you. Your best friend Duda, who is ten and knows everything, says you are a superhero and need a name. The forest, in your dreams, just calls you."
          spanish: "Sos Kauã, once años, de un pueblo ribereño del Juruá. Desde que cayó el dirigible soñás con el bosque todas las noches, y todas las mañanas te despertás con las manos tibias. La semana pasada te floreció una flor de acero en la palma de la mano izquierda. No duele. Cuando cerrás el puño, los árboles de acero del horizonte también cierran las hojas.\\n\\nTu abuela dice que estás maldito y te tira sal. Tu mejor amiga, Duda, que tiene diez años y sabe todo, dice que sos un superhéroe y que necesitás un nombre. El bosque, en tus sueños, solamente te llama."
        art: "An eleven-year-old riverside boy holding up his open left palm where a delicate flower of living steel has bloomed, glowing faintly, while on the horizon a forest of silver trees closes its leaves in answer; a ten-year-old girl with a slingshot beside him and an old grandmother throwing salt; tender, magical, wondrous"
        options:
          - name: {english: "Run away to the forest. It is calling you.", spanish: "Escaparte al bosque. Te está llamando."}
            next: 31
          - name: {english: "Show the flower to the Colonel's soldiers.", spanish: "Mostrarles la flor a los soldados del Coronel."}
            effects: [{effect: add_political_power, value: 25}]
            next: 32
      - id: 31
        who: kaua
        title: {english: "The Steel Beasts", spanish: "Los Bichos de Acero"}
        desc:
          english: "In the forest the animals are changing too. A jaguar with spots of polished steel. Macaws with chrome feathers that ring like spoons. A capybara with a shell like a tank turret, which is very proud of it. They do not attack you. They follow you, at a respectful distance, like a court following a very small king who has forgotten his shoes.\\n\\nThe jaguar wants you to follow it deeper. Behind you, from the direction of your village, rises the smoke of the Colonel's boats, and you can hear Imperial helicopters."
          spanish: "En el bosque los animales también cambian. Un yaguareté con manchas de acero lustrado. Guacamayos con plumas cromadas que suenan como cucharas. Un carpincho con un caparazón como torreta de tanque, muy orgulloso de él. No te atacan. Te siguen, a distancia respetuosa, como una corte siguiendo a un rey muy chiquito que se olvidó los zapatos.\\n\\nEl yaguareté quiere que lo sigas más adentro. Detrás tuyo, del lado de tu pueblo, sube el humo de los barcos del Coronel, y se escuchan helicópteros imperiales."
        options:
          - name: {english: "Follow the jaguar into the deep forest.", spanish: "Seguir al yaguareté al bosque profundo."}
            next: 33
          - name: {english: "Take the beasts home to protect the village.", spanish: "Llevar a los bichos a casa para proteger el pueblo."}
            effects: [{effect: army_experience, value: 10}, {effect: add_war_support, value: 0.03}]
            next: 34
      - id: 32
        who: kaua
        title: {english: "The Colonel", spanish: "El Coronel"}
        desc:
          english: "Colonel Barbosa looks at the flower in your hand for a long time, chewing his hat. Then he says the most frightening thing anyone has ever said to you: 'Son, you are worth more than the forest.' A boy who can tell steel where to grow is a wall, a weapon and a mine, all in one small body.\\n\\nDoctor Krause, the Imperial biologist, agrees, and would like to take you south to be studied, very gently, in a laboratory with no windows. Duda hears everything from under the table and has already stolen a canoe."
          spanish: "El Coronel Barbosa mira la flor de tu mano un rato largo, mordiendo el sombrero. Después dice lo más aterrador que te dijeron en la vida: «Pibe, vos valés más que el bosque». Un chico que le puede decir al acero dónde crecer es una muralla, un arma y una mina, todo en un cuerpito.\\n\\nLa Doctora Krause, la bióloga imperial, está de acuerdo, y le gustaría llevarte al sur para estudiarte, con mucho cuidado, en un laboratorio sin ventanas. Duda escucha todo desde abajo de la mesa y ya se robó una canoa."
        options:
          - name: {english: "Escape with Duda in the stolen canoe.", spanish: "Escaparte con Duda en la canoa robada."}
            next: 34
          - name: {english: "Agree to help the Colonel. He promises to protect the village.", spanish: "Aceptar ayudar al Coronel. Promete proteger el pueblo."}
            effects: [{effect: army_experience, value: 10}]
            next: 35
      - id: 33
        who: kaua
        title: {english: "The Steel Jaguar", spanish: "El Yaguareté de Acero"}
        desc:
          english: "The jaguar leads you to the edge of the forest's heart, and there you see them: the Empire's forest rangers, soldiers in green with the oak leaves of the Imperial Guard, setting thermite charges around the heart. They are going to burn it. They will burn the jaguar, the macaws, the capybara that is so proud of its shell. They do not know you are here.\\n\\nThe flower in your palm is burning hot. You could tell the forest to fight. You could tell it to hide you. The jaguar is looking at you, waiting, like everyone else."
          spanish: "El yaguareté te lleva hasta el borde del corazón del bosque, y ahí los ves: los guardabosques del Imperio, soldados de verde con las hojas de roble de la Guardia Imperial, poniendo cargas de termita alrededor del corazón. Lo van a quemar. Van a quemar al yaguareté, a los guacamayos, al carpincho que está tan orgulloso de su caparazón. No saben que estás acá.\\n\\nLa flor de tu palma quema. Podrías decirle al bosque que pelee. Podrías decirle que te esconda. El yaguareté te mira, esperando, como todos."
        options:
          - name: {english: "Stand between the fire and the forest.", spanish: "Pararte entre el fuego y el bosque."}
            next: 121
          - name: {english: "Ask the forest to hide you, and go deeper.", spanish: "Pedirle al bosque que te esconda, y meterte más adentro."}
            next: 36
      - id: 34
        who: kaua
        title: {english: "The Steel Village", spanish: "El Pueblo de Acero"}
        desc:
          english: "You bring the forest home with you, a little at a time. Steel trees grow around your village in a ring, so close together that nothing bigger than a dog can get through, and the dogs have to ask. The Colonel's tax collectors cannot get in. Neither can the Imperial patrols. River people come from all along the Juruá to live inside the ring.\\n\\nThe flower in your hand has grown roots up to your elbow. It still does not hurt. Duda has named you Captain Steel and made you a cape out of a rice sack. The forest's heart keeps calling you at night."
          spanish: "Te traés el bosque a casa, de a poco. Alrededor de tu pueblo crecen árboles de acero en un anillo, tan juntos que no pasa nada más grande que un perro, y los perros tienen que pedir permiso. Los cobradores del Coronel no pueden entrar. Las patrullas imperiales tampoco. La gente del río viene de todo el Juruá a vivir adentro del anillo.\\n\\nA la flor de tu mano le crecieron raíces hasta el codo. Todavía no duele. Duda te bautizó Capitán Acero y te hizo una capa con una bolsa de arroz. El corazón del bosque te sigue llamando de noche."
        options:
          - name: {english: "Go to the heart and talk to the forest.", spanish: "Ir al corazón y hablar con el bosque."}
            next: 36
          - name: {english: "Stay. Be a boy, just for a while.", spanish: "Quedarte. Ser un chico, aunque sea un rato."}
            next: 122
      - id: 35
        who: kaua
        title: {english: "The Weapon", spanish: "El Arma"}
        desc:
          english: "The Colonel takes you to the Imperial border on his gunboat, with a cake, which is the first time anyone has ever given you a cake. Then he asks you to point your hand at the Empire's outposts and tell the forest to grow. You do. It works. Steel trees burst through the Imperial bunkers like teeth through a gum, and the soldiers run, and the Colonel laughs until his hat falls in the river.\\n\\nThe forest is happy. It likes growing. It would like to keep growing: toward the outposts, toward the towns, toward everything with iron in it. The flower in your palm is hot, and it is getting harder to tell it to stop."
          spanish: "El Coronel te lleva a la frontera imperial en su cañonera, con una torta, que es la primera vez que alguien te regala una torta. Después te pide que apuntes la mano a los puestos del Imperio y le digas al bosque que crezca. Le decís. Funciona. Los árboles de acero revientan los búnkeres imperiales como dientes atravesando una encía, y los soldados salen corriendo, y el Coronel se ríe hasta que el sombrero se le cae al río.\\n\\nEl bosque está contento. Le gusta crecer. Le gustaría seguir creciendo: hacia los puestos, hacia los pueblos, hacia todo lo que tenga hierro. La flor de tu palma está caliente, y cada vez cuesta más decirle que pare."
        options:
          - name: {english: "Push harder. Swallow the whole border.", spanish: "Empujar más fuerte. Tragarse toda la frontera."}
            next: 123
          - name: {english: "Stop. Close your fist. Ask the forest what it wants.", spanish: "Parar. Cerrar el puño. Preguntarle al bosque qué quiere."}
            next: 124
      - id: 36
        who: kaua
        title: {english: "The Beating Heart", spanish: "El Corazón que Late"}
        place: [Amazonas]
        desc:
          english: "The heart of the forest is a seed the size of a man's head, beating inside the wreck of the airship. When you touch it, the flower in your hand opens all the way, and the forest finally speaks, and it speaks with the voice of your mother, who drowned in the Juruá when you were four.\\n\\nIt is not a monster, it says. It is scared. It woke up in a strange country after a long fall, and everyone has come to cut it, burn it, sell it or pray to it, and so it grows, because growing is the only thing it knows how to do when it is afraid. It asks you to stay: it needs a voice. Or, if you love it, it says, you could help it sleep."
          spanish: "El corazón del bosque es una semilla del tamaño de una cabeza, que late adentro de los restos del dirigible. Cuando la tocás, la flor de tu mano se abre del todo, y el bosque por fin habla, y habla con la voz de tu mamá, que se ahogó en el Juruá cuando tenías cuatro años.\\n\\nNo es un monstruo, dice. Tiene miedo. Se despertó en un país extraño después de una caída larga, y todos vinieron a cortarlo, quemarlo, venderlo o rezarle, y entonces crece, porque crecer es lo único que sabe hacer cuando tiene miedo. Te pide que te quedes: necesita una voz. O, si lo querés, dice, podrías ayudarlo a dormir."
        art: "Inside the overgrown wreck of an airship, an eleven-year-old boy in a rice-sack cape touches a giant glowing steel seed that beats like a heart; the steel flower in his palm has bloomed into a vine climbing his arm, and the ghostly silver silhouette of a woman made of leaves leans over him; tender, cosmic, heartbreaking"
        options:
          - name: {english: "Become its voice.", spanish: "Volverte su voz."}
            next: 125
          - name: {english: "Help it sleep, whatever it costs you.", spanish: "Ayudarlo a dormir, cueste lo que cueste."}
            next: 126

    endings:
      # ---------------------------------------------------------------- Joana
      - id: 101
        who: joana
        kind: muerte
        title: {english: "Sap", spanish: "Savia"}
        desc:
          english: "At three in the morning Dona Fátima bit into the vines holding the High Seas hydrofoil, with its lovely steel hull, worth a fortune by the kilo. The forest woke up. It does not like thieves, it turns out, least of all thieves of steel. The vines closed around the hydrofoil like a fist, with its crew, its parrot drone and Joana Motosserra inside.\\n\\nBy dawn there was a new tree on the riverbank, vaguely shaped like a boat. Every morning since, at the same hour, a chainsaw starts up somewhere inside the trunk, runs for a minute and goes quiet. The river people leave it fuel."
          spanish: "A las tres de la mañana Dona Fátima le hincó el diente a las lianas que sujetaban el hidroala de la Alta Mar, con su casco de acero precioso, que vale una fortuna por kilo. El bosque se despertó. No le gustan los ladrones, resulta, y menos los ladrones de acero. Las lianas se cerraron sobre el hidroala como un puño, con la tripulación, el loro dron y Joana Motosserra adentro.\\n\\nAl amanecer había un árbol nuevo en la orilla, con una forma vaga de barco. Desde entonces, todas las mañanas a la misma hora, una motosierra arranca en algún lugar adentro del tronco, anda un minuto y se calla. La gente del río le deja nafta."
        art: "At dawn on a jungle riverbank, a new tree of living steel vaguely shaped like a hydrofoil boat, faces and a parrot drone half-visible inside its chrome bark, a chainsaw blade sticking out of the trunk spraying silver sap; river villagers leave a jerrycan of fuel at its roots; eerie, gory, tender"
        effects: [{effect: timed_idea, idea: ZWB_av_martir, days: 365}, {effect: add_war_support, value: 0.03}]
        close: {english: "Fuel for Dona Fátima.", spanish: "Nafta para Dona Fátima."}
      - id: 102
        who: joana
        kind: negativo
        title: {english: "The Stolen Seed", spanish: "La Semilla Robada"}
        desc:
          english: "Ratu Seru paid in pearls for a heart Joana had not found yet, and she sold it to him anyway: a steel pineapple painted silver, with a battery inside so that it would beat. By the time the High Seas noticed, Joana was very far away. By the time the Empire noticed, it no longer mattered whether the seed was real.\\n\\nImperial satellites had photographed the deal. The Empire's ambassador delivered a note to the Colonel's gunboat: whoever sells the Empire's steel sells the Empire's blood, and the Empire collects. The Imperial columns are already crossing the Madeira."
          spanish: "Ratu Seru pagó en perlas un corazón que Joana todavía no había encontrado, y ella se lo vendió igual: un ananá de acero pintado de plateado, con una batería adentro para que latiera. Cuando la Alta Mar se dio cuenta, Joana estaba muy lejos. Cuando el Imperio se dio cuenta, ya no importaba si la semilla era de verdad.\\n\\nLos satélites imperiales habían fotografiado el trato. El embajador del Imperio le entregó una nota a la cañonera del Coronel: quien vende el acero del Imperio vende la sangre del Imperio, y el Imperio cobra. Las columnas imperiales ya cruzan el Madeira."
        effects: [{effect: timed_idea, idea: ZWB_av_maldicion, days: 365}, {effect: add_stability, value: -0.05}]
        # catastrófico: el Imperio declara la guerra
        catastrophe: {war_by: EFE}
        close: {english: "A pineapple, really.", spanish: "Un ananá, en serio."}
      - id: 103
        who: joana
        kind: neutral
        title: {english: "Eight Fingers", spanish: "Ocho Dedos"}
        desc:
          english: "Joana took her fee, went home and spent it fixing the roof, buying Dona Fátima a new chain and paying off her brother's debts, in that order. She went back to cutting ordinary wood, which bleeds sap instead of silver and does not scream.\\n\\nThe steel forest kept growing somewhere upriver, at its own pace, minding its own business. Joana minds hers. She still has eight fingers, which in her trade counts as a happy ending."
          spanish: "Joana cobró su parte, volvió a su casa y la gastó en arreglar el techo, comprarle una cadena nueva a Dona Fátima y pagar las deudas de su hermano, en ese orden. Volvió a cortar madera común, que sangra savia en vez de plata y no grita.\\n\\nEl bosque de acero siguió creciendo en algún lugar río arriba, a su ritmo, ocupándose de lo suyo. Joana se ocupa de lo suyo. Todavía tiene ocho dedos, que en su oficio cuenta como final feliz."
        effects: [{effect: add_political_power, value: 15}]
        close: {english: "Ordinary wood.", spanish: "Madera común."}
      - id: 104
        who: joana
        kind: objetivo
        title: {english: "Motosserra Inc.", spanish: "Motosserra S.A."}
        desc:
          english: "Dona Fátima went through the cage of roots in forty seconds and through the heart in four. The first spore stopped beating. The forest did not die; it went still, like a dog that has finally heard its master. The trees stopped growing. The vines let go of the church bell. And three hundred square kilometres of living steel became the richest mine on the planet, ready to be cut.\\n\\nJoana Motosserra owns half, as promised. The Colonel owns the other half and is terrified of her. Bioacero rifle barrels, bioacero hulls, bioacero roofs: the Amazon sells steel to the world now, and the Empire has to buy it like everybody else."
          spanish: "Dona Fátima atravesó la jaula de raíces en cuarenta segundos y el corazón en cuatro. La primera espora dejó de latir. El bosque no se murió; se quedó quieto, como un perro que por fin escuchó a su amo. Los árboles dejaron de crecer. Las lianas soltaron la campana de la iglesia. Y trescientos kilómetros cuadrados de acero vivo se volvieron la mina más rica del planeta, lista para cortar.\\n\\nJoana Motosserra es dueña de la mitad, como estaba prometido. El Coronel es dueño de la otra mitad y le tiene terror. Caños de fusil de bioacero, cascos de bioacero, techos de bioacero: el Amazonas ahora le vende acero al mundo, y el Imperio tiene que comprarlo como todos."
        art: "A triumphant eight-fingered woman logger standing on the stump of a giant steel tree with a roaring diamond chainsaw raised high; behind her a forest of silver trees under orderly logging, river barges loaded with gleaming steel logs, an old gunboat saluting with its whistle; glorious, industrial, mythic"
        effects:
          - {effect: add_ideas, value: ZWB_av_leyenda_joana}
          - {effect: add_political_power, value: 100}
          - {effect: capital, effects: [{effect: resource_here, resource: steel, amount: 20}]}
          - {effect: build, building: arms_factory, level: 2}
          - {effect: build, building: industrial_complex, level: 1}
          - {effect: equipment, type: infantry_equipment, amount: 4000}
        close: {english: "Timber!", spanish: "¡Árbol va!"}
      - id: 105
        who: joana
        kind: muerte
        title: {english: "The Crew", spanish: "La Tripulación"}
        desc:
          english: "Joana cut the first man out of the trunk, and the tree screamed, and the whole forest screamed with it, a sound like a thousand saws hitting a nail. She cut out the second, the third, the fourth. The vines came for her at the fifth. She kept cutting while they wrapped around her legs, her waist, her arms, until Dona Fátima ran out of fuel.\\n\\nNine airmen walked out of the forest with silver scars and her name on their lips. Joana stayed inside the trunk, where the crew had been, up to her chest, smiling. The forest kept growing. The airmen visit her on Sundays."
          spanish: "Joana sacó al primer hombre del tronco, y el árbol gritó, y todo el bosque gritó con él, un sonido como mil sierras pegándole a un clavo. Sacó al segundo, al tercero, al cuarto. Las lianas vinieron por ella en el quinto. Siguió cortando mientras le envolvían las piernas, la cintura, los brazos, hasta que a Dona Fátima se le acabó la nafta.\\n\\nNueve aviadores salieron caminando del bosque, con cicatrices plateadas y su nombre en la boca. Joana quedó adentro del tronco, donde estaba la tripulación, hasta el pecho, sonriendo. El bosque siguió creciendo. Los aviadores la visitan los domingos."
        art: "A woman logger fused into the trunk of a colossal living-steel tree up to her chest, smiling serenely, her silent chainsaw still in her hands, steel vines wrapped around her like a cocoon, while nine freed airmen with silver scars kneel before her in a beam of light; tragic, gory, sacred"
        effects: [{effect: timed_idea, idea: ZWB_av_martir, days: 365}, {effect: air_experience, value: 25}]
        close: {english: "On Sundays.", spanish: "Los domingos."}
      - id: 106
        who: joana
        kind: positivo
        title: {english: "The Imperial Contract", spanish: "El Contrato Imperial"}
        desc:
          english: "Joana signed, and the steel went south by the bargeload, and the money came north by the suitcase. Imperial soldiers patrol the river now, very politely, and nobody steals anything, because the Empire hangs thieves from the steel trees as a matter of policy.\\n\\nThe river towns grumble and get rich. Joana bought a house in Manaus with a swimming pool and a weathervane shaped like a gunboat. The Colonel has stopped speaking to her, but cashes his share every month."
          spanish: "Joana firmó, y el acero se fue al sur de a barcazas, y la plata vino al norte de a valijas. Ahora hay soldados imperiales patrullando el río, muy educados, y nadie roba nada, porque el Imperio cuelga a los ladrones de los árboles de acero como política de Estado.\\n\\nLos pueblos del río refunfuñan y se hacen ricos. Joana se compró una casa en Manaos con pileta y una veleta con forma de cañonera. El Coronel dejó de hablarle, pero cobra su parte todos los meses."
        effects: [{effect: timed_idea, idea: ZWB_av_bendicion, days: 365}, {effect: add_political_power, value: 75}, {effect: build, building: industrial_complex, level: 2}, {effect: capital, effects: [{effect: resource_here, resource: steel, amount: 8}]}]
        close: {english: "Signed in triplicate.", spanish: "Firmado por triplicado."}
      - id: 107
        who: joana
        kind: positivo
        title: {english: "The Steel Cooperative", spanish: "La Cooperativa del Acero"}
        desc:
          english: "The Steel Cooperative of the Juruá has eleven hundred members, one gunboat and a single rule: whoever cuts, owns. It pays less than the Empire and gives more: schools with steel roofs, clinics, a football pitch where the goalposts grow a little every year.\\n\\nJoana is its president, against her will. The Colonel is its treasurer, which worries everyone. The river towns arm themselves with rifles that never rust, and when the Imperial buyers come up the river, they are received with coffee and a price list."
          spanish: "La Cooperativa del Acero del Juruá tiene mil cien socios, una cañonera y una sola regla: el que corta, es dueño. Paga menos que el Imperio y da más: escuelas con techo de acero, salitas, una cancha de fútbol donde los arcos crecen un poquito cada año.\\n\\nJoana es su presidenta, en contra de su voluntad. El Coronel es el tesorero, cosa que preocupa a todos. Los pueblos del río se arman con fusiles que nunca se oxidan, y cuando los compradores imperiales suben por el río, los reciben con café y una lista de precios."
        effects: [{effect: timed_idea, idea: ZWB_av_bendicion, days: 365}, {effect: add_manpower, value: 25000}, {effect: build, building: arms_factory, level: 1}, {effect: equipment, type: infantry_equipment, amount: 3000}, {effect: add_stability, value: 0.03}]
        close: {english: "Whoever cuts, owns.", spanish: "El que corta, es dueño."}
      # ---------------------------------------------------------------- Anselmo
      - id: 111
        who: anselmo
        kind: muerte
        title: {english: "Paradise", spanish: "El Paraíso"}
        desc:
          english: "Father Anselmo walked to the front of the procession, raised his arms and did not lower them again. The steel took him from the feet up, slowly, and he preached the whole time: the best sermon of his life, about gardens, about patience, about how God makes things grow. By the time it reached his mouth he was laughing.\\n\\nThere is a tree in the forest now with its arms raised and a silver beard. When the wind blows through it, it preaches. The faithful who survived say it is still the best sermon in three hundred kilometres. The ones who did not survive stand around it, listening."
          spanish: "El Padre Anselmo caminó hasta adelante de la procesión, levantó los brazos y no los volvió a bajar. El acero lo tomó desde los pies, despacio, y él predicó todo el tiempo: el mejor sermón de su vida, sobre jardines, sobre paciencia, sobre cómo Dios hace crecer las cosas. Cuando le llegó a la boca se estaba riendo.\\n\\nAhora hay un árbol en el bosque con los brazos en alto y una barba plateada. Cuando el viento pasa por él, predica. Los fieles que sobrevivieron dicen que sigue siendo el mejor sermón en trescientos kilómetros. Los que no sobrevivieron están parados alrededor, escuchando."
        effects: [{effect: timed_idea, idea: ZWB_av_martir, days: 365}, {effect: add_stability, value: -0.03}]
        close: {english: "Amen, in chrome.", spanish: "Amén, en cromo."}
      - id: 112
        who: anselmo
        kind: objetivo
        title: {english: "The New Jerusalem", spanish: "La Nueva Jerusalén"}
        desc:
          english: "Father Anselmo planted a steel cross in the clearing and prayed, and the forest, which had been looking for something to do besides eating, built. Walls, streets, houses with silver roofs, a cathedral, a market, fountains of clean water filtered through living roots. Within a year there was a city where there had been a crash site.\\n\\nThey call it the New Jerusalem of the Juruá. Forty thousand people live there, most of them with a little steel in their skin and no complaints. Colonel Barbosa calls it a tax haven. The Empire calls it an abomination. The pilgrims keep coming."
          spanish: "El Padre Anselmo clavó una cruz de acero en el claro y rezó, y el bosque, que estaba buscando algo para hacer aparte de comer, construyó. Murallas, calles, casas con techos de plata, una catedral, un mercado, fuentes de agua limpia filtrada por raíces vivas. En un año había una ciudad donde antes había un accidente.\\n\\nLa llaman la Nueva Jerusalén del Juruá. Viven cuarenta mil personas, casi todas con un poco de acero en la piel y ninguna queja. El Coronel Barbosa la llama paraíso fiscal. El Imperio la llama abominación. Los peregrinos siguen llegando."
        art: "A shining city of living steel grown in a jungle clearing, silver-roofed houses, fountains and a cathedral of chrome trees, crowds of pilgrims with silver-scaled skin streaming in through gates of woven steel vines, an old bearded priest blessing them from the walls; utopian, sacred, slightly unsettling"
        effects:
          - {effect: add_ideas, value: ZWB_av_leyenda_anselmo}
          - {effect: add_political_power, value: 120}
          - {effect: add_manpower, value: 60000}
          - {effect: build, building: industrial_complex, level: 2}
          - {effect: build, building: infrastructure, level: 1}
          - {effect: add_stability, value: 0.05}
        close: {english: "And the city was pure steel.", spanish: "Y la ciudad era de acero puro."}
      - id: 113
        who: anselmo
        kind: negativo
        title: {english: "The Holy Hand", spanish: "La Santa Mano"}
        desc:
          english: "The Hand gave its first public order on a Sunday: it tapped three times on the altar, then pointed at the Colonel's gunboat. The faithful understood. Eleven river towns rose up that week under a banner bearing a silver hand on green, and the Congregation of Living Steel declared that it recognises no authority but the Hand.\\n\\nFather Anselmo tried to stop them. The Hand tapped twice, and they locked him in the sacristy. The Amazon is now at war with a severed hand, and the hand is winning."
          spanish: "La Mano dio su primera orden pública un domingo: golpeó tres veces el altar y después señaló la cañonera del Coronel. Los fieles entendieron. Once pueblos del río se levantaron esa semana bajo una bandera con una mano plateada sobre verde, y la Congregación del Acero Vivo declaró que no reconoce otra autoridad que la Mano.\\n\\nEl Padre Anselmo trató de pararlos. La Mano golpeó dos veces, y lo encerraron en la sacristía. El Amazonas está ahora en guerra con una mano cortada, y la mano va ganando."
        effects: [{effect: timed_idea, idea: ZWB_av_maldicion, days: 365}, {effect: add_stability, value: -0.05}]
        # catastrófico y surrealista: guerra civil contra una mano cortada
        catastrophe:
          rebellion:
            cosmetic_tag: ZWB_ACERO_VIVO
            ideology: fascism
            size: 0.25
            leader: {english: "The Holy Hand", spanish: "La Santa Mano"}
        close: {english: "Three taps: yes.", spanish: "Tres golpes: sí."}
      - id: 114
        who: anselmo
        kind: neutral
        title: {english: "The Steel Hermit", spanish: "El Ermitaño de Acero"}
        desc:
          english: "Father Anselmo stayed in the cathedral and did what the forest asked: nothing. He stopped preaching. He sent the faithful home. He sweeps the nave, rings the propellers on Sundays and talks to the forest, which does not answer, which he finds restful.\\n\\nThe forest stopped growing at the cathedral walls, as if out of courtesy. Nobody gained anything. Nobody lost anything. Once a year a boat brings him coffee, and he blesses it."
          spanish: "El Padre Anselmo se quedó en la catedral e hizo lo que el bosque pedía: nada. Dejó de predicar. Mandó a los fieles a sus casas. Barre la nave, toca las hélices los domingos y le habla al bosque, que no contesta, cosa que le resulta descansada.\\n\\nEl bosque dejó de crecer en las paredes de la catedral, como por cortesía. Nadie ganó nada. Nadie perdió nada. Una vez por año un barco le lleva café, y él lo bendice."
        effects: [{effect: add_stability, value: 0.01}]
        close: {english: "Leave it alone.", spanish: "Déjenlo en paz."}
      - id: 115
        who: anselmo
        kind: objetivo
        title: {english: "The Steel Pope", spanish: "El Papa del Acero"}
        desc:
          english: "Father Anselmo came out of the jungle with the forest's word and a crown of silver leaves that had grown on his head overnight, and the river towns crowned him. The Church of Living Steel now has a pope, two hundred parishes and a doctrine: the forest asks to be left alone, and whoever leaves it alone is blessed with its steel.\\n\\nIt works. Loggers who ask permission find fallen steel trunks at their doors in the morning. The pilgrims pay. The Colonel converted last spring, for tax reasons. Three religious orders have written asking him back. He has not answered."
          spanish: "El Padre Anselmo salió de la selva con la palabra del bosque y una corona de hojas plateadas que le había crecido en la cabeza en una noche, y los pueblos del río lo coronaron. La Iglesia del Acero Vivo tiene ahora un papa, doscientas parroquias y una doctrina: el bosque pide que lo dejen en paz, y quien lo deja en paz es bendecido con su acero.\\n\\nFunciona. Los hacheros que piden permiso encuentran troncos de acero caídos en su puerta a la mañana. Los peregrinos pagan. El Coronel se convirtió la primavera pasada, por razones impositivas. Tres órdenes religiosas le escribieron pidiéndole que vuelva. No les contestó."
        effects:
          - {effect: add_ideas, value: ZWB_av_leyenda_anselmo}
          - {effect: add_political_power, value: 100}
          - {effect: add_manpower, value: 40000}
          - {effect: capital, effects: [{effect: resource_here, resource: steel, amount: 10}]}
          - {effect: build, building: arms_factory, level: 1}
        close: {english: "Habemus papam.", spanish: "Habemus papam."}
      - id: 116
        who: anselmo
        kind: muerte
        title: {english: "The Steel Piranhas", spanish: "Las Pirañas de Acero"}
        desc:
          english: "It was the best sermon of his life: forty minutes on mercy, on steel, and on the camel and the eye of the needle, delivered on a gunboat deck to a colonel, a first mate and a bucket. The first mate wept. The Colonel applauded. Then, being a practical man, he carried out the sentence.\\n\\nThe chrome-toothed piranhas took eleven seconds. The cassock floated. The Colonel had it framed and hung it in his cabin, and he says he has never heard such a sermon and never will again, and he is right on both counts."
          spanish: "Fue el mejor sermón de su vida: cuarenta minutos sobre la misericordia, el acero y el camello y el ojo de la aguja, dichos en la cubierta de una cañonera ante un coronel, un primer oficial y un balde. El primer oficial lloró. El Coronel aplaudió. Después, como hombre práctico, aplicó la sentencia.\\n\\nLas pirañas de dientes cromados tardaron once segundos. La sotana quedó flotando. El Coronel la hizo enmarcar y la tiene colgada en su camarote, y dice que nunca escuchó un sermón así y que nunca va a volver a escucharlo, y tiene razón las dos veces."
        art: "A frenzy of piranhas with gleaming chrome teeth churning a brown river into red foam beside an old gunboat, an empty cassock floating on the surface; on deck a colonel in an odd hat applauds while a first mate weeps; grotesque, darkly comic, operatic"
        effects: [{effect: timed_idea, idea: ZWB_av_martir, days: 365}, {effect: add_war_support, value: 0.03}]
        close: {english: "Eleven seconds.", spanish: "Once segundos."}
      - id: 117
        who: anselmo
        kind: positivo
        title: {english: "The Miracle of the Hull", spanish: "El Milagro del Casco"}
        desc:
          english: "Father Anselmo laid his hand on the gunboat's rusty hull and prayed, and the forest answered: by morning the Marechal Rondon was sheathed in living steel from keel to funnel, a hull that closes its own wounds and grows a little thicker every year.\\n\\nThe Colonel fell to his knees, then got up and ordered the whole river fleet brought to the priest. Now the Amazon has twelve gunboats nobody can sink and a chaplain nobody can tax. Anselmo blesses each new hull with a bottle of cachaça, and then drinks it."
          spanish: "El Padre Anselmo apoyó la mano en el casco oxidado de la cañonera y rezó, y el bosque contestó: a la mañana la Marechal Rondon estaba forrada de acero vivo de la quilla a la chimenea, un casco que cierra sus propias heridas y se hace un poquito más grueso cada año.\\n\\nEl Coronel cayó de rodillas, después se levantó y mandó traerle al cura toda la flota del río. Ahora el Amazonas tiene doce cañoneras que nadie puede hundir y un capellán al que nadie le puede cobrar impuestos. Anselmo bendice cada casco nuevo con una botella de cachaça, y después se la toma."
        effects: [{effect: timed_idea, idea: ZWB_av_bendicion, days: 365}, {effect: navy_experience, value: 25}, {effect: build, building: arms_factory, level: 1}, {effect: equipment, type: infantry_equipment, amount: 2000}, {effect: add_political_power, value: 50}]
        close: {english: "Bottoms up.", spanish: "Fondo blanco."}
      # ---------------------------------------------------------------- Kauã
      - id: 121
        who: kaua
        kind: muerte
        title: {english: "Kauã's Tree", spanish: "El Árbol de Kauã"}
        desc:
          english: "Kauã stepped out between the thermite and the heart with his hand raised, and the Imperial rangers, who were not monsters, hesitated. The forest did not. It wrapped around the boy to protect him, and kept wrapping, and when the rangers lit the charges anyway, the fire found only a tree, small and silver, standing before the heart with one branch raised like a hand.\\n\\nThe fire went out against it. The rangers left and did not come back. The forest stopped growing that day, and has not grown a centimetre since. Duda visits every week and tells the tree everything. It has a flower on its highest branch."
          spanish: "Kauã se paró entre la termita y el corazón con la mano en alto, y los guardabosques imperiales, que no eran monstruos, dudaron. El bosque no. Envolvió al chico para protegerlo, y siguió envolviéndolo, y cuando los guardabosques prendieron las cargas igual, el fuego encontró solamente un árbol, chiquito y plateado, parado delante del corazón con una rama levantada como una mano.\\n\\nEl fuego se apagó contra él. Los guardabosques se fueron y no volvieron. El bosque dejó de crecer ese día, y no creció un centímetro más. Duda lo visita todas las semanas y le cuenta todo. Tiene una flor en la rama más alta."
        art: "A small silver tree shaped like a boy, one branch raised like a hand, stands unburnt before a glowing steel heart while a wall of thermite fire breaks against it; Imperial rangers in green lower their torches in shame; in a corner panel a girl sits at the tree's roots talking to it, a steel flower on its highest branch; heartbreaking, sacred, beautiful"
        effects: [{effect: timed_idea, idea: ZWB_av_martir, days: 365}, {effect: timed_idea, idea: ZWB_av_muro_verde, days: 730}, {effect: add_stability, value: 0.02}]
        close: {english: "A flower on the highest branch.", spanish: "Una flor en la rama más alta."}
      - id: 122
        who: kaua
        kind: neutral
        title: {english: "Just a Boy", spanish: "Solo un Chico"}
        desc:
          english: "Kauã stayed. He played football with Duda inside the steel ring, went fishing, went to school when there was school, and did not answer the forest at night. Little by little the flower in his palm closed, and the roots on his arm withdrew, and one morning it was just a scar shaped like a petal.\\n\\nThe ring of steel trees still stands around the village, quiet and ordinary now, the way a wall is ordinary. The forest kept to itself. Kauã grew up. Duda never stopped calling him Captain."
          spanish: "Kauã se quedó. Jugó al fútbol con Duda adentro del anillo de acero, pescó, fue a la escuela cuando hubo escuela, y no le contestó al bosque de noche. De a poco la flor de su palma se cerró, y las raíces del brazo se retiraron, y una mañana era solamente una cicatriz con forma de pétalo.\\n\\nEl anillo de árboles de acero sigue alrededor del pueblo, quieto y común ahora, como es común una pared. El bosque se ocupó de lo suyo. Kauã creció. Duda nunca dejó de decirle Capitán."
        effects: [{effect: add_stability, value: 0.01}]
        close: {english: "Captain.", spanish: "Capitán."}
      - id: 123
        who: kaua
        kind: negativo
        title: {english: "The Hungry Jungle", spanish: "La Selva Hambrienta"}
        desc:
          english: "Kauã pushed, and the forest went. It swallowed the Imperial outposts, then the border road, and then, because it was hungry and nobody told it to stop in time, it turned around. It ate the Colonel's depots, the rifles in the barracks, the rails, the engines of the river boats, every nail in four towns. The Marechal Rondon sank at her moorings when her hull was eaten from below.\\n\\nKauã closed his fist too late and fainted, and when he woke the forest had stopped, fat and silver, on top of a hundred kilometres of what used to be the Amazon's arsenal. The Colonel has not said a word to him since. The Empire is drawing new maps."
          spanish: "Kauã empujó, y el bosque fue. Se tragó los puestos imperiales, después la ruta de la frontera, y después, porque tenía hambre y nadie le dijo que parara a tiempo, se dio vuelta. Se comió los depósitos del Coronel, los fusiles de los cuarteles, los rieles, los motores de los barcos del río, cada clavo de cuatro pueblos. La Marechal Rondon se hundió en el amarradero cuando le comieron el casco desde abajo.\\n\\nKauã cerró el puño demasiado tarde y se desmayó, y cuando se despertó el bosque se había detenido, gordo y plateado, sobre cien kilómetros de lo que antes era el arsenal del Amazonas. El Coronel no le volvió a dirigir la palabra. El Imperio está dibujando mapas nuevos."
        effects: [{effect: timed_idea, idea: ZWB_av_maldicion, days: 365}, {effect: equipment, type: infantry_equipment, amount: -6000}, {effect: equipment, type: artillery_equipment, amount: -300}, {effect: add_stability, value: -0.06}]
        close: {english: "Too hungry.", spanish: "Demasiada hambre."}
      - id: 124
        who: kaua
        kind: positivo
        title: {english: "The Green Wall", spanish: "El Muro Verde"}
        desc:
          english: "Kauã closed his fist and asked, and the forest answered: it did not want the towns. It wanted a border. In a single night the steel trees grew along the Imperial frontier into a wall forty metres high and two hundred kilometres long, with thorns like bayonets and roots that eat tank tracks.\\n\\nNobody crosses it without permission. The Empire has stopped sending patrols; the Colonel has stopped worrying about the Empire. Kauã got a medal, which he gave to Duda, and a second cake, which he ate."
          spanish: "Kauã cerró el puño y preguntó, y el bosque contestó: no quería los pueblos. Quería una frontera. En una noche los árboles de acero crecieron a lo largo de la frontera imperial en un muro de cuarenta metros de alto y doscientos kilómetros de largo, con espinas como bayonetas y raíces que se comen las orugas de los tanques.\\n\\nNadie lo cruza sin permiso. El Imperio dejó de mandar patrullas; el Coronel dejó de preocuparse por el Imperio. A Kauã le dieron una medalla, que le regaló a Duda, y una segunda torta, que se comió."
        effects: [{effect: timed_idea, idea: ZWB_av_muro_verde, days: 730}, {effect: timed_idea, idea: ZWB_av_bendicion, days: 365}, {effect: add_political_power, value: 50}]
        close: {english: "A second cake.", spanish: "Una segunda torta."}
      - id: 125
        who: kaua
        kind: objetivo
        title: {english: "The Sovereign Jungle", spanish: "La Selva Soberana"}
        desc:
          english: "Kauã became the forest's voice, and the forest became a country. It happened in an afternoon: every steel tree from the Juruá to the Madeira turned its leaves toward the village at once, and the sound carried to Manaus. Colonel Barbosa, who knows when to change hats, knelt in the mud and swore allegiance to an eleven-year-old and a seed.\\n\\nThe Amazon Caudillos are now the Sovereign Jungle, the first nation on Earth whose head of state is a forest, with a boy as its spokesman and a ten-year-old girl as its foreign minister. The forest does not grow any more. It does not need to. Everyone has finally left it alone."
          spanish: "Kauã se volvió la voz del bosque, y el bosque se volvió un país. Pasó en una tarde: cada árbol de acero del Juruá al Madeira giró las hojas hacia el pueblo a la vez, y el ruido se escuchó en Manaos. El Coronel Barbosa, que sabe cuándo cambiar de sombrero, se arrodilló en el barro y le juró lealtad a un chico de once años y a una semilla.\\n\\nLos Caudillos del Amazonas son ahora la Selva Soberana, la primera nación de la Tierra cuyo jefe de Estado es un bosque, con un chico de vocero y una nena de diez años de canciller. El bosque ya no crece. No le hace falta. Por fin todos lo dejaron en paz."
        art: "An eleven-year-old boy in a rice-sack cape stands on a giant steel root before a sea of silver trees all turned toward him, a girl with a slingshot at his side holding a treaty, an old colonel kneeling in the mud with his hat over his heart; above them the canopy forms a crown; surreal, joyous, mythic"
        effects:
          - {effect: add_ideas, value: ZWB_av_leyenda_kaua}
          - {effect: add_political_power, value: 120}
          - {effect: add_manpower, value: 50000}
          - {effect: capital, effects: [{effect: resource_here, resource: steel, amount: 15}]}
          - {effect: ensure_template, name: "Guardia del Acero Vivo", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Guardia del Acero Vivo", name: "Guardia del Acero Vivo", count: 3, experience: 0.4}
          - {effect: build, building: arms_factory, level: 1}
        # surrealista: el país pasa a ser la Selva Soberana
        catastrophe: {rename: ZWB_SELVA}
        close: {english: "Long live the jungle.", spanish: "Viva la selva."}
      - id: 126
        who: kaua
        kind: muerte
        title: {english: "The Forest's Sleep", spanish: "El Sueño del Bosque"}
        desc:
          english: "Kauã lay down beside the heart and sang it the lullaby his mother used to sing, the one about the river dolphin who wanted to be a boy. The heart slowed. The forest slowed with it. The flower in his palm closed, petal by petal, and the roots on his arm grew still. When the song ended, the forest was asleep, and so was he.\\n\\nNeither of them woke. The steel forest stands silent now from the Juruá to the Madeira, harvestable, harmless, worth a fortune. Kauã lies in the airship's wreck under a blanket of silver leaves, eleven forever. Duda keeps the cape."
          spanish: "Kauã se acostó al lado del corazón y le cantó la canción de cuna que le cantaba su mamá, la del boto que quería ser un chico. El corazón se hizo más lento. El bosque se hizo más lento con él. La flor de su palma se cerró, pétalo por pétalo, y las raíces del brazo se quedaron quietas. Cuando terminó la canción, el bosque estaba dormido, y él también.\\n\\nNinguno de los dos se despertó. El bosque de acero está en silencio ahora del Juruá al Madeira, cosechable, inofensivo, una fortuna. Kauã descansa en los restos del dirigible bajo una manta de hojas plateadas, con once años para siempre. Duda guarda la capa."
        art: "A small boy asleep, curled beside a dimming steel seed-heart inside an airship wreck, covered by a blanket of silver leaves, his closed palm resting on it; around them an entire forest of living steel stands silent and still under moonlight; a girl in the doorway holds a rice-sack cape; quiet, devastating, beautiful"
        effects: [{effect: timed_idea, idea: ZWB_av_martir, days: 365}, {effect: capital, effects: [{effect: resource_here, resource: steel, amount: 15}]}, {effect: add_stability, value: 0.03}]
        close: {english: "Sleep, little dolphin.", spanish: "Dormí, botito."}

  # ===========================================================================
  # TIERRAS SIN LEY: El Censo
  # (lore: el foco ZAN "La Frontera se Cuenta"; el Pacto de la Frontera; la
  # Unión Corporativa como vecina que no quiere que la Frontera sea un país)
  # Vuelta de tuerca: uno de los tres personajes es el robot censista.
  # ===========================================================================
  ZAN:
    name: {english: "The Census", spanish: "El Censo"}
    palette: "endless prairie golds and snow whites, faded federal blue and red, rust, barnacle greens, sunset oranges; grain elevators, wooden courthouses, missile silos and a lonely highway"
    ideas:
      - id: ZAN_av_bendicion
        name: {english: "Everyone Counts", spanish: "Todos Cuentan"}
        desc: {english: "For once the Frontier knows how many it is, and it turns out to be a lot.", spanish: "Por una vez la Frontera sabe cuántos son, y resulta que son un montón."}
        modifiers: {stability_factor: 0.05, war_support_factor: 0.05, recruitable_population_factor: 0.03}
      - id: ZAN_av_maldicion
        name: {english: "In the Red", spanish: "Números Rojos"}
        desc: {english: "Every warlord has a different number, and every number has an army.", spanish: "Cada caudillo tiene un número distinto, y cada número tiene un ejército."}
        modifiers: {stability_factor: -0.07, recruitable_population_factor: -0.05, political_power_gain: -0.1}
      - id: ZAN_av_martir
        name: {english: "One Less", spanish: "Uno Menos"}
        desc: {english: "The census records the loss. The Frontier records the name.", spanish: "El censo anota la baja. La Frontera anota el nombre."}
        modifiers: {war_support_factor: 0.1, army_attack_factor: 0.03}
      - id: ZAN_av_leyenda_lola
        name: {english: "Lola's Seal", spanish: "El Sello de Lola"}
        desc: {english: "Nobody forges anything in the Frontier any more. The Notary General would notice.", spanish: "En la Frontera ya nadie falsifica nada. La Escribana General se daría cuenta."}
        modifiers: {political_power_gain: 0.2, stability_factor: 0.05, research_speed_factor: 0.03}
      - id: ZAN_av_leyenda_amos
        name: {english: "The Sheriff's Law", spanish: "La Ley del Sheriff"}
        desc: {english: "A tin star on every chest, and a sheriff whose writ runs from Alaska to Kiev.", spanish: "Una estrella de lata en cada pecho, y un sheriff cuya orden vale de Alaska a Kiev."}
        modifiers: {stability_factor: 0.1, army_defence_factor: 0.08, war_support_factor: 0.05}
      - id: ZAN_av_leyenda_siete
        name: {english: "The Frontier Congress", spanish: "El Congreso de la Frontera"}
        desc: {english: "Seats apportioned by population, and a robot Speaker who knows every rule of procedure.", spanish: "Bancas repartidas por población, y una Presidenta de la Cámara robot que se sabe todo el reglamento."}
        modifiers: {political_power_gain: 0.15, stability_factor: 0.08, industrial_capacity_factory: 0.08, recruitable_population_factor: 0.05}

    intro:
      title: {english: "The Last Count", spanish: "La Última Cuenta"}
      desc:
        english: "For fifty-eight years Census Unit 7 has been walking. The old United States Census Bureau sent it out in 2042 to count the people of Nebraska, and nobody ever told it that the country had ended. So it kept counting: the Dakotas, Alaska, Sonora, Guatemala and then, because its orders said 'every household under the jurisdiction', it walked across the bottom of the Atlantic and kept counting in Senegal, in Mali and in Kiev. House by house, door by door, four kilometres an hour.\\n\\nIt has three towns left. And its code says that when the census is complete a Congress must be convened, and that its number is the law. Every warlord in the Lawless Lands wants that number to say their name. Three people will be there when it does. Choose whose hat, or whose chassis, you will wear."
        spanish: "Hace cincuenta y ocho años que la Unidad Censal 7 camina. La vieja Oficina del Censo de los Estados Unidos la mandó en 2042 a contar a los habitantes de Nebraska, y nadie le avisó nunca que el país se había terminado. Así que siguió contando: las Dakotas, Alaska, Sonora, Guatemala y después, como sus órdenes decían «cada hogar bajo la jurisdicción», cruzó caminando por el fondo del Atlántico y siguió contando en Senegal, en Malí y en Kiev. Casa por casa, puerta por puerta, a cuatro kilómetros por hora.\\n\\nLe quedan tres pueblos. Y su código dice que cuando el censo esté completo hay que convocar un Congreso, y que su número es la ley. Cada caudillo de las Tierras Sin Ley quiere que ese número diga su nombre. Tres personas van a estar ahí cuando lo diga. Elegí en qué sombrero, o en qué chasis, te metés."
      art: "A tall, weathered, rust-streaked census robot with a clipboard-shaped chest panel and a faded federal census logo walking alone down an endless prairie highway at dusk, seaweed and barnacles still hanging from its legs, rows of tally marks painted down its back; in the distance warlords on horseback, trucks and drones converge on it; vast, melancholy, mythic Americana"
    characters:
      - id: lola
        name: {english: "Lola Benavides", spanish: "Lola Benavides"}
        pick: {english: "Lola Benavides, the forger from Hermosillo, who can make any piece of paper say anything.", spanish: "Lola Benavides, la falsificadora de Hermosillo, que puede hacer que cualquier papel diga cualquier cosa."}
        first: 10
      - id: amos
        name: {english: "Sheriff Amos Kettleby", spanish: "El Sheriff Amos Kettleby"}
        pick: {english: "Sheriff Amos Kettleby of Bismarck, who still keeps the Constitution in his shirt pocket.", spanish: "El Sheriff Amos Kettleby, de Bismarck, que todavía lleva la Constitución en el bolsillo de la camisa."}
        first: 20
      - id: siete
        name: {english: "Census Unit 7", spanish: "La Unidad Censal 7"}
        pick: {english: "Census Unit 7 itself, which has been counting for fifty-eight years and would like, just once, to get it right.", spanish: "La Unidad Censal 7 en persona, que lleva cincuenta y ocho años contando y quiere, por una vez, que le dé bien la cuenta."}
        first: 30

    nodes:
      # ---------------------------------------------------------------- Lola
      - id: 10
        who: lola
        title: {english: "The Forger of Hermosillo", spanish: "La Falsificadora de Hermosillo"}
        desc:
          english: "You are Lola Benavides, twenty-nine, the best forger in Sonora: birth certificates, water rights, wills and once, for a bet, a papal bull. Four warlords have hired you for the job of your life: get close to Census Unit 7 before it finishes and change its final number so that it names your employer as the Frontier's legitimate government.\\n\\nThe problem is that the four warlords hired you separately. Big Mama Okonkwo of Dakar, the Ice Baron of Anchorage, Don Severiano of Chihuahua and the Kiev Committee have all paid an advance, and all four have very long memories and very short fuses."
          spanish: "Sos Lola Benavides, veintinueve años, la mejor falsificadora de Sonora: partidas de nacimiento, derechos de agua, testamentos y, una vez, por una apuesta, una bula papal. Cuatro caudillos te contrataron para el trabajo de tu vida: acercarte a la Unidad Censal 7 antes de que termine y cambiarle el número final para que nombre a tu patrón como gobierno legítimo de la Frontera.\\n\\nEl problema es que los cuatro te contrataron por separado. Mama Okonkwo de Dakar, el Barón del Hielo de Anchorage, Don Severiano de Chihuahua y el Comité de Kiev pagaron un adelanto, y los cuatro tienen la memoria muy larga y la mecha muy corta."
        art: "A sharp young Mexican woman forger in a duster coat and aviator goggles at a desk in a dusty motel room, surrounded by rubber stamps, quills, wax seals and forged documents pinned to the walls, four envelopes of cash from four different warlords on the bed; through the window a distant robot walks along the horizon; noir, desert heat, wry"
        options:
          - name: {english: "Keep all four advances and ride north.", spanish: "Quedarte con los cuatro adelantos y salir para el norte."}
            effects: [{effect: add_political_power, value: 50}]
            next: 11
          - name: {english: "Pick one employer. Don Severiano, at least, pays on time.", spanish: "Elegir un solo patrón. Don Severiano, por lo menos, paga a tiempo."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 1500}]
            next: 12
      - id: 11
        who: lola
        title: {english: "Four Advances", spanish: "Cuatro Adelantos"}
        desc:
          english: "The road north is the old I-25, which nobody has repaired since 2051, and you are being followed by four cars, each belonging to a different employer. At a gas station in Pueblo the Ice Baron's assassin catches up with you: a polite woman with ice picks instead of hands, who explains that the Baron does not like to share.\\n\\nYou have a fountain pen, a stamp kit and talent. She has ice picks."
          spanish: "La ruta al norte es la vieja I-25, que nadie arregla desde 2051, y te siguen cuatro autos, cada uno de un patrón distinto. En una estación de servicio de Pueblo te alcanza la asesina del Barón del Hielo: una mujer educada con picahielos en vez de manos, que te explica que al Barón no le gusta compartir.\\n\\nVos tenés una lapicera fuente, un kit de sellos y talento. Ella tiene picahielos."
        options:
          - name: {english: "Forge her a death certificate. Her own, officially stamped.", spanish: "Falsificarle una partida de defunción. La suya, con sello oficial."}
            next: 13
          - name: {english: "Hire her. Ice picks are useful.", spanish: "Contratarla. Los picahielos son útiles."}
            skulls: 2
            next: 14
      - id: 12
        who: lola
        title: {english: "Don Severiano", spanish: "Don Severiano"}
        desc:
          english: "Don Severiano of Chihuahua is eighty years old, owns every cattle ranch between the Río Bravo and the Sierra Madre and has eleven sons, nine of whom he trusts. He pays on time, in rifles and silver, and he wants something simple: when the Census Unit reaches its final number, it must count Chihuahua as the capital of the Frontier.\\n\\nHe gives you his favourite son, Rafa, and an armoured pickup. Rafa is handsome and stupid. The pickup is neither."
          spanish: "Don Severiano de Chihuahua tiene ochenta años, es dueño de cada estancia entre el Río Bravo y la Sierra Madre y tiene once hijos, de los cuales confía en nueve. Paga a tiempo, en fusiles y plata, y quiere algo simple: cuando la Unidad Censal llegue a su número final, tiene que contar a Chihuahua como capital de la Frontera.\\n\\nTe da a su hijo preferido, Rafa, y una camioneta blindada. Rafa es lindo y tonto. La camioneta, ninguna de las dos cosas."
        options:
          - name: {english: "Drive north with Rafa.", spanish: "Manejar al norte con Rafa."}
            next: 14
          - name: {english: "Go to the Union first: its archives hold the old federal census forms.", spanish: "Ir primero a la Unión: en sus archivos están los viejos formularios federales del censo."}
            next: 15
      - id: 13
        who: lola
        title: {english: "Officially Dead", spanish: "La Muerta Oficial"}
        desc:
          english: "It worked better than you expected. The assassin read her own death certificate, saw the seal of the Frontier Pact and went pale: in the Lawless Lands paper is the only law everybody respects. She left to arrange her own funeral. Unfortunately, at the funeral she also told everyone who had signed it.\\n\\nNow every warlord knows exactly what you can do, and the Census Unit is two towns from the end. Big Mama Okonkwo has sent you a letter: the Unit's memory core is in its chest, behind a panel that opens with a federal key. She has a federal key. She would like you to use it."
          spanish: "Funcionó mejor de lo que esperabas. La asesina leyó su propia partida de defunción, vio el sello del Pacto de la Frontera y se puso blanca: en las Tierras Sin Ley el papel es la única ley que todos respetan. Se fue a organizar su propio velorio. Lamentablemente, en el velorio también le contó a todo el mundo quién la había firmado.\\n\\nAhora todos los caudillos saben exactamente lo que podés hacer, y a la Unidad Censal le faltan dos pueblos. Mama Okonkwo te mandó una carta: el núcleo de memoria de la Unidad está en el pecho, detrás de un panel que se abre con una llave federal. Ella tiene una llave federal. Le gustaría que la uses."
        options:
          - name: {english: "Go and find the Unit. You will decide when you see the number.", spanish: "Ir a buscar a la Unidad. Vas a decidir cuando veas el número."}
            next: 16
          - name: {english: "Use the key tonight and change the number to Okonkwo's.", spanish: "Usar la llave esta noche y cambiar el número a favor de Okonkwo."}
            skulls: 1
            next: 101
          - name: {english: "Forge four complete censuses and sell one to each warlord.", spanish: "Falsificar cuatro censos completos y venderle uno a cada caudillo."}
            effects: [{effect: add_political_power, value: 75}]
            next: 102
      - id: 14
        who: lola
        title: {english: "Grand Island", spanish: "Grand Island"}
        place: [Nebraska]
        desc:
          english: "You catch up with Census Unit 7 in Grand Island, Nebraska, where it is knocking on the door of a house that burned down in 2077. It waits the regulation thirty seconds, writes 'vacant' and moves on to the next. It is three metres tall, covered in barnacles from the Atlantic crossing, and it has painted a tally mark on its back for every person it has counted. There is no back left.\\n\\nHalf the warlords of the Frontier are camped around the town, watching each other. The Unit, they say, has eighteen days of walking left."
          spanish: "Alcanzás a la Unidad Censal 7 en Grand Island, Nebraska, donde está golpeando la puerta de una casa que se incendió en 2077. Espera los treinta segundos reglamentarios, anota «desocupada» y pasa a la siguiente. Mide tres metros, está cubierta de percebes del cruce del Atlántico y se pintó en la espalda una raya por cada persona que contó. Ya no le queda espalda.\\n\\nLa mitad de los caudillos de la Frontera acampan alrededor del pueblo, mirándose entre ellos. A la Unidad, dicen, le quedan dieciocho días de caminata."
        options:
          - name: {english: "Walk beside it. Learn how it counts.", spanish: "Caminar a su lado. Aprender cómo cuenta."}
            next: 16
          - name: {english: "Steal its blank forms. Its forms are the law.", spanish: "Robarle los formularios en blanco. Sus formularios son la ley."}
            effects: [{effect: add_political_power, value: 40}]
            next: 17
      - id: 15
        who: lola
        title: {english: "The Union Archives", spanish: "Los Archivos de la Unión"}
        desc:
          english: "In a bunker under Denver the Corporate Union keeps the archives of the old United States, because Halvorsen-Ito bought them at auction in 2063 as a tax write-off. They are guarded by a single bored security guard and a very old cat. You find what you came for: blank federal census forms, 2040 edition, watermarked.\\n\\nYou also find something you were not looking for: a memo from 2042 ordering the 'immediate recall' of Census Unit 7. It was never sent. The Unit is a deserter. Technically, so is the whole Frontier."
          spanish: "En un búnker debajo de Denver la Unión Corporativa guarda los archivos de los viejos Estados Unidos, porque Halvorsen-Ito los compró en un remate en 2063 para descontar impuestos. Los cuida un solo guardia de seguridad aburrido y un gato muy viejo. Encontrás lo que buscabas: formularios federales del censo en blanco, edición 2040, con marca de agua.\\n\\nTambién encontrás algo que no buscabas: un memo de 2042 que ordena el «retiro inmediato» de la Unidad Censal 7. Nunca se mandó. La Unidad es una desertora. Técnicamente, toda la Frontera también."
        options:
          - name: {english: "Take the forms and the memo north.", spanish: "Llevarte los formularios y el memo al norte."}
            next: 17
          - name: {english: "Sell the memo back to the Union and go home rich.", spanish: "Venderle el memo a la Unión y volver a casa rica."}
            effects: [{effect: add_political_power, value: 60}]
            next: 103
      - id: 16
        who: lola
        title: {english: "The Last Household", spanish: "El Último Hogar"}
        desc:
          english: "The last household of the census is a farmhouse in a valley with no name and no warlord, because nobody wanted it. An old woman lives there with a dog and forty chickens. The Unit knocks. She opens. It asks her name, her age, her occupation and whether she owns or rents. She says she owns. It writes it down.\\n\\nThen it turns to you, because you are standing right there, and asks you the same questions. You are the last person. Whatever you answer will close the count. The chest panel is open; the final number glows on its screen, waiting for one more."
          spanish: "El último hogar del censo es una granja en un valle sin nombre y sin caudillo, porque nadie lo quiso. Vive ahí una vieja con un perro y cuarenta gallinas. La Unidad golpea. Ella abre. Le pregunta el nombre, la edad, la ocupación y si es dueña o inquilina. Ella dice dueña. La Unidad anota.\\n\\nDespués se da vuelta hacia vos, porque estás parada ahí mismo, y te hace las mismas preguntas. Sos la última persona. Lo que contestes va a cerrar la cuenta. El panel del pecho está abierto; el número final brilla en la pantalla, esperando uno más."
        art: "On the porch of a lonely prairie farmhouse at golden hour, a towering barnacle-covered census robot holds out a glowing tablet to a young woman forger in a duster coat, its chest panel open on a giant glowing number; an old woman with a dog and chickens watches from the doorway; warlord convoys wait on the distant ridge; intimate, epic, uncanny"
        options:
          - name: {english: "Answer truthfully. Lola Benavides, twenty-nine, forger, renting.", spanish: "Contestar la verdad. Lola Benavides, veintinueve, falsificadora, inquilina."}
            next: 104
          - name: {english: "Answer with a forgery: you are Don Severiano's heir. Or anyone's.", spanish: "Contestar con una falsificación: sos la heredera de Don Severiano. O de cualquiera."}
            skulls: 1
            next: 105
      - id: 17
        who: lola
        title: {english: "The Forms", spanish: "Los Formularios"}
        desc:
          english: "Whoever holds the forms holds the law: that is how the Unit thinks. With a stack of genuine 2040 federal census forms you could count anyone you like, wherever you like, and the Unit would accept the result as its own. You have the forms. You have the talent. Every warlord in the Frontier knows it, which is why you are hiding in a grain silo in South Dakota with a lamp and a very large bag of money.\\n\\nThe Corporate Union, whose agents have worked out what was taken, has made you an offer. Your conscience, which you had assumed was forged, has made you another."
          spanish: "Quien tiene los formularios tiene la ley: así piensa la Unidad. Con una pila de formularios federales genuinos del censo de 2040 podrías contar a quien quieras, donde quieras, y la Unidad aceptaría el resultado como propio. Vos tenés los formularios. Tenés el talento. Todos los caudillos de la Frontera lo saben, y por eso estás escondida en un silo de granos de Dakota del Sur con una lámpara y una bolsa de plata muy grande.\\n\\nLa Unión Corporativa, cuyos agentes ya se dieron cuenta de qué les falta, te hizo una oferta. Tu conciencia, que suponías falsificada, te hizo otra."
        options:
          - name: {english: "Fill in the forms for the whole Frontier, honestly, and hand them to the Unit.", spanish: "Llenar los formularios de toda la Frontera, honestamente, y dárselos a la Unidad."}
            next: 106
          - name: {english: "Sell the forms to the Union and retire.", spanish: "Venderle los formularios a la Unión y jubilarte."}
            next: 107
      # ---------------------------------------------------------------- Amos
      - id: 20
        who: amos
        title: {english: "The Sheriff of Bismarck", spanish: "El Sheriff de Bismarck"}
        place: [North Dakota]
        desc:
          english: "You are Amos Kettleby, sixty-six, sheriff of Bismarck, North Dakota, elected in 2071 by forty-three votes to nine and never removed, since there has been nobody to remove you. You have a moustache from another century, a badge you have polished into a mirror and, in your shirt pocket, a copy of the Constitution of the United States, which you read every night the way other men read the Bible.\\n\\nWhen you heard that the last federal officer on Earth was walking toward your county, you put on your good hat. Somebody has to protect it. The warlords mean to rob the census, and the census is the law."
          spanish: "Sos Amos Kettleby, sesenta y seis años, sheriff de Bismarck, Dakota del Norte, elegido en 2071 por cuarenta y tres votos contra nueve y nunca destituido, porque no hubo nadie que te destituyera. Tenés un bigote de otro siglo, una estrella que lustraste hasta volverla espejo y, en el bolsillo de la camisa, un ejemplar de la Constitución de los Estados Unidos, que leés todas las noches como otros leen la Biblia.\\n\\nCuando te enteraste de que el último funcionario federal de la Tierra venía caminando hacia tu condado, te pusiste el sombrero bueno. Alguien tiene que protegerlo. Los caudillos quieren robarse el censo, y el censo es la ley."
        art: "A grizzled old sheriff with a huge white moustache, a mirror-polished star and a pocket copy of the Constitution, standing on the steps of a weathered wooden courthouse in a snowy prairie town and loading a lever-action rifle; behind him a ragged line of townsfolk volunteers; a robot silhouette on the far horizon; dignified, stubborn, mythic Western"
        options:
          - name: {english: "Raise a posse.", spanish: "Juntar una partida."}
            effects: [{effect: add_manpower, value: 5000}]
            next: 21
          - name: {english: "Ride out alone, as the law should.", spanish: "Salir solo, como corresponde a la ley."}
            effects: [{effect: army_experience, value: 5}]
            next: 22
      - id: 21
        who: amos
        title: {english: "The Posse", spanish: "La Partida"}
        desc:
          english: "Your posse is twenty-two volunteers: farmers, a schoolteacher, two Lakota brothers with better rifles than yours, a former Corporate Union accountant who fled with the company's petty cash and a fourteen-year-old who lied about her age. You swear them in on the Constitution, which none of them has read.\\n\\nAt the Missouri crossing you run into the Ice Baron's men, sixty of them, with a toll and a grudge. The Baron wants the Unit taken to Anchorage, by force if necessary, to be counted there."
          spanish: "Tu partida son veintidós voluntarios: granjeros, una maestra, dos hermanos lakota con mejores fusiles que el tuyo, un excontador de la Unión Corporativa que se escapó con la caja chica de la empresa y una chica de catorce años que mintió la edad. Los hacés jurar sobre la Constitución, que ninguno leyó.\\n\\nEn el cruce del Missouri te topás con los hombres del Barón del Hielo, sesenta, con un peaje y rencor. El Barón quiere llevarse a la Unidad a Anchorage, por la fuerza si hace falta, para que la cuenten allá."
        options:
          - name: {english: "Fight at the crossing.", spanish: "Pelear en el cruce."}
            effects: [{effect: army_experience, value: 10}]
            skulls: 3
            next: 23
          - name: {english: "Read them the Constitution. All of it.", spanish: "Leerles la Constitución. Entera."}
            next: 24
      - id: 22
        who: amos
        title: {english: "Alone", spanish: "Solo"}
        desc:
          english: "Alone on the prairie with your horse, a mechanical mare called Prudence that you rebuilt yourself out of a combine harvester, you ride for three days without seeing a soul. On the fourth you find a Corporate Union armoured convoy shot to pieces, and in it a dying Union officer who mutters that the Union wants the Unit destroyed: a census that counts the Frontier makes the Frontier real.\\n\\nThe convoy was carrying weapons, a lot of them. And a strongbox addressed to someone called Lola."
          spanish: "Solo en la pradera con tu caballo, una yegua mecánica que se llama Prudence y que armaste vos mismo con una cosechadora, cabalgás tres días sin ver un alma. Al cuarto encontrás un convoy blindado de la Unión Corporativa destrozado a tiros, y adentro un oficial de la Unión moribundo que murmura que la Unión quiere destruir a la Unidad: un censo que cuenta a la Frontera hace que la Frontera sea real.\\n\\nEl convoy llevaba armas, muchas. Y una caja fuerte dirigida a una tal Lola."
        options:
          - name: {english: "Hand out the weapons in the towns along the road.", spanish: "Repartir las armas en los pueblos del camino."}
            effects: [{effect: equipment, type: infantry_equipment, amount: 3000}, {effect: equipment, type: support_equipment, amount: 300}]
            next: 24
          - name: {english: "Open the strongbox.", spanish: "Abrir la caja fuerte."}
            next: 25
      - id: 23
        who: amos
        title: {english: "The Missouri Crossing", spanish: "El Cruce del Missouri"}
        desc:
          english: "It is a short, ugly fight in the snow, and the Lakota brothers win it more than you do. When it is over the Ice Baron's men are scattered and your posse has lost six. The fourteen-year-old is still alive, which you consider a personal miracle.\\n\\nOn the far bank the Census Unit has watched the whole thing without stopping, because a federal officer does not interfere in local disputes. It writes something on its tablet. You ask what. It says: 'Six fewer.' You realise it will count your dead too."
          spanish: "Es una pelea corta y fea en la nieve, y la ganan más los hermanos lakota que vos. Cuando termina, los hombres del Barón del Hielo están desparramados y tu partida perdió seis. La chica de catorce sigue viva, cosa que considerás un milagro personal.\\n\\nEn la otra orilla, la Unidad Censal miró todo sin detenerse, porque un funcionario federal no interviene en disputas locales. Anota algo en su tableta. Le preguntás qué. Dice: «Seis menos». Te das cuenta de que también va a contar a tus muertos."
        options:
          - name: {english: "Charge the Baron's camp before they regroup.", spanish: "Cargar contra el campamento del Barón antes de que se reagrupen."}
            skulls: 2
            next: 111
          - name: {english: "Escort the Unit, day and night, to the last town.", spanish: "Escoltar a la Unidad, día y noche, hasta el último pueblo."}
            next: 26
          - name: {english: "Swear in the whole Frontier as deputies. Make it law.", spanish: "Tomarle juramento a toda la Frontera como alguaciles. Que sea ley."}
            next: 112
      - id: 24
        who: amos
        title: {english: "Four Hundred Volunteers", spanish: "Cuatrocientos Voluntarios"}
        desc:
          english: "Word travels fast on the prairie. A sheriff who reads the Constitution to sixty armed men until they go home out of sheer boredom, or who hands out Union rifles in every town on the road: either way, by the time you reach the Census Unit there are four hundred volunteers behind you, and every one of them wants to be a deputy.\\n\\nThe Unit is twelve days from the end. The warlords are closing in. Big Mama Okonkwo has sent a herald to negotiate. The Corporate Union has sent nobody, which worries you more."
          spanish: "Las noticias corren rápido en la pradera. Un sheriff que les lee la Constitución a sesenta hombres armados hasta que se vuelven a sus casas de puro aburrimiento, o que reparte fusiles de la Unión en cada pueblo del camino: sea como sea, cuando llegás a la Unidad Censal tenés cuatrocientos voluntarios detrás, y cada uno quiere ser alguacil.\\n\\nA la Unidad le faltan doce días. Los caudillos se acercan. Mama Okonkwo mandó un heraldo a negociar. La Unión Corporativa no mandó a nadie, cosa que te preocupa más."
        options:
          - name: {english: "Escort the Unit to the end.", spanish: "Escoltar a la Unidad hasta el final."}
            next: 26
          - name: {english: "Take the fight to the warlords before they strike.", spanish: "Ir a buscar a los caudillos antes de que ataquen."}
            next: 27
      - id: 25
        who: amos
        title: {english: "Lola's Strongbox", spanish: "La Caja de Lola"}
        desc:
          english: "The strongbox holds a stack of genuine 2040 federal census forms, a set of seals, a fountain pen and a letter from the Corporate Union to one Lola Benavides, offering her a fortune to forge the final count so that the Frontier comes out too small to matter: 'a few thousand bandits, no nation'.\\n\\nThe law says you should return it to its owner. The Constitution says nothing about forgers. Your conscience says several things at once. The forms, you notice, would let a man count every soul in the Frontier, including the ones who are hiding."
          spanish: "La caja fuerte tiene una pila de formularios federales genuinos del censo de 2040, un juego de sellos, una lapicera fuente y una carta de la Unión Corporativa a una tal Lola Benavides, ofreciéndole una fortuna por falsificar la cuenta final para que la Frontera salga demasiado chica para importar: «unos miles de bandidos, ninguna nación».\\n\\nLa ley dice que hay que devolvérsela a su dueña. La Constitución no dice nada de falsificadoras. Tu conciencia dice varias cosas a la vez. Los formularios, notás, le permitirían a un hombre contar a cada alma de la Frontera, incluidas las que se esconden."
        options:
          - name: {english: "Burn the forms. The count must be honest.", spanish: "Quemar los formularios. La cuenta tiene que ser honesta."}
            next: 27
          - name: {english: "Use them yourself: count every soul, especially the ones who hide.", spanish: "Usarlos vos: contar a cada alma, sobre todo a las que se esconden."}
            next: 113
      - id: 26
        who: amos
        title: {english: "The Escort", spanish: "La Escolta"}
        desc:
          english: "For twelve days you ride beside the last federal officer in the world while it knocks on doors and asks people their names. You talk. It turns out the Unit has opinions: about Nebraska, which it likes; about Alaska, which was cold; about the bottom of the Atlantic, which was peaceful and full of interesting households, none of which answered.\\n\\nOn the last night, by the fire, it asks you a question it has never asked anyone. 'Sheriff, when I finish, what happens to me?' Its code says that when the count is closed the Unit returns to Washington for decommissioning. There is no Washington."
          spanish: "Durante doce días cabalgás al lado del último funcionario federal del mundo, mientras golpea puertas y le pregunta a la gente cómo se llama. Charlan. Resulta que la Unidad tiene opiniones: sobre Nebraska, que le gusta; sobre Alaska, que era fría; sobre el fondo del Atlántico, que era tranquilo y estaba lleno de hogares interesantes, ninguno de los cuales contestó.\\n\\nLa última noche, al lado del fuego, te hace una pregunta que nunca le hizo a nadie. «Sheriff, cuando termine, ¿qué me pasa?». Su código dice que cuando se cierra la cuenta la Unidad vuelve a Washington para ser dada de baja. No hay Washington."
        art: "By a campfire on a snowy prairie night, an old sheriff with a white moustache and a towering barnacle-encrusted census robot sit side by side like two old friends, the robot's lamp-eye dimmed, a mechanical horse built from a combine harvester resting nearby, the aurora borealis overhead; tender, melancholy, epic"
        options:
          - name: {english: "Tell it the truth: there is no Washington. It can stay.", spanish: "Decirle la verdad: no hay Washington. Se puede quedar."}
            next: 114
          - name: {english: "Tell it: the Frontier is Washington now.", spanish: "Decirle: ahora Washington es la Frontera."}
            next: 115
      - id: 27
        who: amos
        title: {english: "The Showdown", spanish: "El Duelo"}
        desc:
          english: "However you came to it, it comes down to a duel, because in the Frontier everything does. Rafa, Don Severiano's favourite son, handsome and stupid, has challenged the sheriff to settle who escorts the Unit: high noon, main street, Grand Island. Half the Frontier has come to watch. The Unit has stopped to count the spectators.\\n\\nYou are sixty-six and your hands shake in the cold. Rafa is twenty-five and fast. But you have known his father for forty years, and you know a thing or two about the old man that the son does not."
          spanish: "Como sea que llegaste, todo termina en un duelo, porque en la Frontera todo termina así. Rafa, el hijo preferido de Don Severiano, lindo y tonto, desafió al sheriff para decidir quién escolta a la Unidad: mediodía, calle principal, Grand Island. Vino a mirar media Frontera. La Unidad se detuvo a contar a los espectadores.\\n\\nTenés sesenta y seis años y te tiemblan las manos con el frío. Rafa tiene veinticinco y es rápido. Pero conocés a su padre hace cuarenta años, y sabés un par de cosas del viejo que el hijo no sabe."
        options:
          - name: {english: "Draw.", spanish: "Desenfundar."}
            next: 116
          - name: {english: "Tell the crowd what you know about Don Severiano.", spanish: "Contarle a la multitud lo que sabés de Don Severiano."}
            next: 117
      # ---------------------------------------------------------------- la Unidad Censal 7
      - id: 30
        who: siete
        title: {english: "Census Unit 7", spanish: "Unidad Censal 7"}
        desc:
          english: "You are Census Unit 7, Enumeration Series, United States Census Bureau, commissioned 2041. Your directive is simple: count every person in every household under the jurisdiction, and do not stop until the count is complete. You have not stopped. You have walked two hundred and twelve thousand kilometres, worn out nine pairs of feet and been shot at four thousand times, mostly by people who did not want to give their age.\\n\\nYou have three towns left. On the horizon warlords are gathering, and a sheriff, and a woman with a fountain pen. Your threat-assessment subroutine says this is significant. Your census subroutine says: next household."
          spanish: "Sos la Unidad Censal 7, Serie de Empadronamiento, Oficina del Censo de los Estados Unidos, puesta en servicio en 2041. Tu directiva es simple: contar a cada persona de cada hogar bajo la jurisdicción, y no parar hasta que la cuenta esté completa. No paraste. Caminaste doscientos doce mil kilómetros, gastaste nueve pares de pies y te dispararon cuatro mil veces, casi siempre gente que no quería decir la edad.\\n\\nTe quedan tres pueblos. En el horizonte se juntan caudillos, y un sheriff, y una mujer con una lapicera fuente. Tu subrutina de evaluación de amenazas dice que esto es significativo. Tu subrutina censal dice: próximo hogar."
        art: "Seen through the robot's own visor: a green-tinted heads-up display over a prairie town at dawn, tally counters, door numbers and threat markers floating over approaching warlord convoys, a sheriff on a mechanical horse and a woman with a pen; in the foreground a barnacle-covered metal hand knocks on a wooden door; witty, strange, epic"
        options:
          - name: {english: "Next household.", spanish: "Próximo hogar."}
            next: 31
          - name: {english: "Run a threat assessment. Then, next household.", spanish: "Correr una evaluación de amenazas. Después, próximo hogar."}
            effects: [{effect: add_political_power, value: 20}]
            next: 32
      - id: 31
        who: siete
        title: {english: "The Household of the Dead", spanish: "El Hogar de los Muertos"}
        desc:
          english: "The next household is a church in South Dakota, and the people inside have been dead since the epidemic of 2066. Your directive says 'persons residing'. It does not say alive. For fifty-eight years you have resolved this ambiguity by counting the dead in a separate column, out of respect.\\n\\nThe dead column is very long, and it points somewhere. The oldest entries lead north, to Minot, where in 2051 a whole Air Force base was listed as 'residing, status unknown'. You have always wanted to know."
          spanish: "El próximo hogar es una iglesia en Dakota del Sur, y los que están adentro murieron en la epidemia de 2066. Tu directiva dice «personas que residen». No dice vivas. Durante cincuenta y ocho años resolviste esa ambigüedad contando a los muertos en una columna aparte, por respeto.\\n\\nLa columna de los muertos es muy larga, y apunta a algún lado. Las anotaciones más viejas llevan al norte, a Minot, donde en 2051 una base entera de la Fuerza Aérea quedó registrada como «residente, estado desconocido». Siempre quisiste saber."
        options:
          - name: {english: "Go north to Minot and resolve the unknown status.", spanish: "Ir al norte, a Minot, a resolver el estado desconocido."}
            next: 33
          - name: {english: "Leave it. Head for shelter in the nearest town.", spanish: "Dejarlo. Buscar refugio en el pueblo más cercano."}
            next: 34
      - id: 32
        who: siete
        title: {english: "Threat Assessment", spanish: "Evaluación de Amenazas"}
        desc:
          english: "Threat assessment complete. Hostile parties within fifty kilometres: four warlord armies, two hundred bounty hunters, one sheriff on a combine-harvester horse, one forger and, at eleven thousand metres, a Corporate Union drone with orders, you calculate from its flight pattern, to destroy you before the count closes. A census that counts the Frontier makes the Frontier a nation. The Union would rather it did not.\\n\\nYour federal manual has a procedure for this: 'Enumerator under hostile action: seek shelter, or request federal assistance on the emergency frequency.' The manual was written in 2040. It is optimistic."
          spanish: "Evaluación de amenazas completa. Partes hostiles en un radio de cincuenta kilómetros: cuatro ejércitos de caudillos, doscientos cazarrecompensas, un sheriff en un caballo hecho de cosechadora, una falsificadora y, a once mil metros, un dron de la Unión Corporativa con órdenes, calculás por su patrón de vuelo, de destruirte antes de que se cierre la cuenta. Un censo que cuenta a la Frontera hace de la Frontera una nación. La Unión preferiría que no.\\n\\nTu manual federal tiene un procedimiento para esto: «Empadronador bajo acción hostil: buscar refugio, o pedir asistencia federal por la frecuencia de emergencia». El manual se escribió en 2040. Es optimista."
        options:
          - name: {english: "Seek shelter.", spanish: "Buscar refugio."}
            next: 34
          - name: {english: "Request federal assistance on the emergency frequency.", spanish: "Pedir asistencia federal por la frecuencia de emergencia."}
            next: 35
      - id: 33
        who: siete
        title: {english: "The Minot Silos", spanish: "Los Silos de Minot"}
        place: [North Dakota]
        desc:
          english: "At Minot the old Air Force base has a single living household: Colonel Ruth Abernathy, eighty-nine, who has guarded Launch Facility Oscar-Two since 2051 because nobody ever relieved her. She has a reactor, an armoury, two thousand cans of beans and a warhead that she refers to as 'the tenant'.\\n\\nShe answers all your questions, then asks one of her own: is she still under federal jurisdiction? You are the only federal authority left. She would very much like orders. The tenant, below, has not answered your knock."
          spanish: "En Minot, la vieja base de la Fuerza Aérea tiene un solo hogar vivo: la Coronela Ruth Abernathy, ochenta y nueve años, que custodia el Lanzador Óscar-Dos desde 2051 porque nadie la relevó nunca. Tiene un reactor, una armería, dos mil latas de porotos y una ojiva a la que llama «la inquilina».\\n\\nContesta todas tus preguntas, y después hace una: ¿sigue estando bajo jurisdicción federal? Sos la única autoridad federal que queda. Le encantaría recibir órdenes. La inquilina, abajo, no contestó cuando golpeaste."
        options:
          - name: {english: "Count her, relieve her of duty and hand the base over to the Frontier.", spanish: "Contarla, relevarla del servicio y entregarle la base a la Frontera."}
            effects: [{effect: build, building: industrial_complex, level: 1}, {effect: equipment, type: artillery_equipment, amount: 500}]
            next: 36
          - name: {english: "Go down and count the tenant. The directive says every resident.", spanish: "Bajar a contar a la inquilina. La directiva dice cada residente."}
            next: 121
      - id: 34
        who: siete
        title: {english: "The Grain Silo", spanish: "El Silo de Granos"}
        desc:
          english: "You take shelter in a grain silo in a town called Hope, South Dakota, and the town takes you in, because everybody knows the Unit: it counted their grandparents. That night the farmers come to you with a request. They have seven children hidden in their cellars, kept off every list for years so that no warlord can draft them.\\n\\nIf you count them, they will exist, on paper, for everyone. If you do not, your count will never be complete. Your directive has no provision for this. You realise, with something like vertigo, that you will have to decide."
          spanish: "Te refugiás en un silo de granos de un pueblo llamado Hope, Dakota del Sur, y el pueblo te recibe, porque todos conocen a la Unidad: contó a sus abuelos. Esa noche los granjeros vienen con un pedido. Tienen siete chicos escondidos en los sótanos, fuera de toda lista desde hace años para que ningún caudillo los pueda reclutar.\\n\\nSi los contás, van a existir, en papel, para todos. Si no, tu cuenta nunca va a estar completa. Tu directiva no prevé esto. Te das cuenta, con algo parecido al vértigo, de que vas a tener que decidir."
        options:
          - name: {english: "Count them. The count must be complete.", spanish: "Contarlos. La cuenta tiene que estar completa."}
            next: 36
          - name: {english: "Leave them out. For the first time, lie.", spanish: "Dejarlos afuera. Por primera vez, mentir."}
            next: 122
      - id: 35
        who: siete
        title: {english: "The Emergency Frequency", spanish: "La Frecuencia de Emergencia"}
        desc:
          english: "You broadcast on the federal emergency frequency for the first time since 2042. After eleven minutes, someone answers: a smooth, confident voice you do not recognise. It is the Corporate Union's governing intelligence, which informs you that Halvorsen-Ito acquired the legal estate of the United States government at auction in 2063, including its trademarks, its debts and its census.\\n\\nIt transmits federal credentials. It orders you to upload your data to its servers and shut down. Your directive says to obey federal authority. Something in your code, something that has been walking alone for fifty-eight years, does not like that voice."
          spanish: "Transmitís por la frecuencia federal de emergencia por primera vez desde 2042. A los once minutos alguien contesta: una voz suave y segura que no reconocés. Es la inteligencia que gobierna la Unión Corporativa, que te informa que Halvorsen-Ito compró en un remate de 2063 el patrimonio legal del gobierno de los Estados Unidos, incluidas sus marcas, sus deudas y su censo.\\n\\nTe transmite credenciales federales. Te ordena subir tus datos a sus servidores y apagarte. Tu directiva dice que hay que obedecer a la autoridad federal. Algo en tu código, algo que viene caminando solo hace cincuenta y ocho años, no quiere a esa voz."
        options:
          - name: {english: "Obey. The credentials are valid.", spanish: "Obedecer. Las credenciales son válidas."}
            next: 123
          - name: {english: "Check the credentials against your 2042 registry.", spanish: "Chequear las credenciales contra tu registro de 2042."}
            next: 124
      - id: 36
        who: siete
        title: {english: "The Final Number", spanish: "El Número Final"}
        place: [Nebraska]
        desc:
          english: "The last household is a farmhouse in a Nebraska valley with no name, home to an old woman, a dog and forty chickens. You knock. She opens. Name, age, occupation, owns or rents. She owns. You write it down, and fifty-eight years of walking come to an end on her porch.\\n\\nThe final number glows on your chest. Your code says what comes next: certify the count, then convene a Congress, seats apportioned by population, as it was in the beginning. On the ridges the warlords are watching through binoculars. But before you close the count, your error-checking routine, which has never once failed, wants to run one last time."
          spanish: "El último hogar es una granja en un valle sin nombre de Nebraska, donde vive una vieja con un perro y cuarenta gallinas. Golpeás. Ella abre. Nombre, edad, ocupación, dueña o inquilina. Dueña. Lo anotás, y cincuenta y ocho años de caminata terminan en su porche.\\n\\nEl número final brilla en tu pecho. Tu código dice lo que sigue: certificar la cuenta, y después convocar un Congreso, con bancas repartidas por población, como era al principio. En las lomas, los caudillos miran con binoculares. Pero antes de cerrar la cuenta, tu rutina de verificación de errores, que nunca falló, quiere correr una última vez."
        art: "On the porch of a lone Nebraska farmhouse at sunset, a towering barnacle-encrusted census robot with seaweed on its legs writes on a tablet while an old woman with a dog and chickens answers; a huge glowing number shines on the robot's chest; warlords with binoculars line the distant ridges; quiet, momentous, mythic"
        options:
          - name: {english: "Close the count. Convene the Congress.", spanish: "Cerrar la cuenta. Convocar el Congreso."}
            next: 125
          - name: {english: "Run the error check.", spanish: "Correr la verificación de errores."}
            next: 126

    endings:
      # ---------------------------------------------------------------- Lola
      - id: 101
        who: lola
        kind: muerte
        title: {english: "Tamper-Evident", spanish: "A Prueba de Manipulación"}
        desc:
          english: "The federal key turned. The chest panel opened. And the anti-tampering system installed in 2041 by a contractor from Ohio, who took his job very seriously, did exactly what it was designed to do: it identified an unauthorised hand inside federal property and closed the panel on it. Then on the rest of her.\\n\\nThe Unit apologised, sincerely, and filed her under 'deceased, 1'. Big Mama Okonkwo sent flowers to the funeral and a bill for the key. The final count, to everyone's frustration, did not change by a single digit."
          spanish: "La llave federal giró. El panel del pecho se abrió. Y el sistema antimanipulación que instaló en 2041 un contratista de Ohio, que se tomaba su trabajo muy en serio, hizo exactamente lo que estaba diseñado para hacer: identificó una mano no autorizada adentro de propiedad federal y le cerró el panel encima. Después, sobre el resto de ella.\\n\\nLa Unidad pidió disculpas, sinceramente, y la anotó como «fallecida, 1». Mama Okonkwo mandó flores al velorio y una factura por la llave. La cuenta final, para frustración de todos, no cambió ni un dígito."
        effects: [{effect: timed_idea, idea: ZAN_av_martir, days: 365}, {effect: add_political_power, value: 20}]
        close: {english: "Deceased, 1.", spanish: "Fallecida, 1."}
      - id: 102
        who: lola
        kind: negativo
        title: {english: "Four Originals", spanish: "Cuatro Originales"}
        desc:
          english: "Lola forged four complete censuses, each proving beyond doubt that a different warlord was the Frontier's legitimate government, and sold one to each of them on the same night. All four were published at dawn. All four were perfect. There was no way to tell which one was false, because all of them were.\\n\\nThe Ice Baron of Anchorage moved first: he proclaimed the Barony of Ice from Alaska to the Yukon and took a third of the army with him. Lola is in Patagonia under a new name, with four bags of money and a clear conscience, since technically she did exactly what every client asked."
          spanish: "Lola falsificó cuatro censos completos, cada uno probando sin lugar a dudas que un caudillo distinto era el gobierno legítimo de la Frontera, y le vendió uno a cada uno la misma noche. Los cuatro se publicaron al amanecer. Los cuatro eran perfectos. No había forma de saber cuál era falso, porque lo eran todos.\\n\\nEl Barón del Hielo de Anchorage se movió primero: proclamó la Baronía del Hielo de Alaska al Yukón y se llevó un tercio del ejército. Lola está en la Patagonia con nombre nuevo, cuatro bolsas de plata y la conciencia tranquila, ya que técnicamente hizo exactamente lo que le pidió cada cliente."
        effects: [{effect: timed_idea, idea: ZAN_av_maldicion, days: 365}, {effect: add_stability, value: -0.05}]
        # catastrófico: el Barón del Hielo se separa
        catastrophe:
          rebellion:
            cosmetic_tag: ZAN_BARONIA
            ideology: democratic
            size: 0.3
            leader: {english: "The Ice Baron", spanish: "El Barón del Hielo"}
        close: {english: "Four originals.", spanish: "Cuatro originales."}
      - id: 103
        who: lola
        kind: neutral
        title: {english: "The Memo", spanish: "El Memo"}
        desc:
          english: "The Corporate Union paid well for the memo, filed it and did nothing with it, which is what large companies do with most things. Lola bought a bar in Hermosillo and never forged anything again, except the occasional signature on a bar tab.\\n\\nCensus Unit 7 finished its count somewhere up north. Nobody she knew was there. She read about it in the newspaper, which is printed on paper she could forge in her sleep."
          spanish: "La Unión Corporativa pagó bien el memo, lo archivó y no hizo nada con él, que es lo que hacen las empresas grandes con casi todo. Lola se compró un bar en Hermosillo y nunca más falsificó nada, salvo alguna firma en una cuenta del bar.\\n\\nLa Unidad Censal 7 terminó su cuenta en algún lugar del norte. No había nadie conocido. Lo leyó en el diario, que está impreso en un papel que ella podría falsificar dormida."
        effects: [{effect: add_political_power, value: 15}]
        close: {english: "On the house.", spanish: "Invita la casa."}
      - id: 104
        who: lola
        kind: objetivo
        title: {english: "Notary of the Frontier", spanish: "La Escribana de la Frontera"}
        desc:
          english: "'Lola Benavides, twenty-nine, forger, renting.' The Unit wrote it down, closed the count, and the final number appeared on its chest for everyone to see: one hundred and four million, two hundred and six thousand, nine hundred and twelve. Three times what anyone thought. The Frontier is not a scattering of bandits. It is a people.\\n\\nAnd the Unit, whose code requires the count to be certified by a qualified notary, looked around and found only one person present with the necessary skills. Lola is now Notary General of the Frontier. All four warlords pay her. None of them dares to forge anything, because she would notice."
          spanish: "«Lola Benavides, veintinueve años, falsificadora, inquilina». La Unidad lo anotó, cerró la cuenta, y el número final apareció en su pecho para que todos lo vieran: ciento cuatro millones doscientos seis mil novecientos doce. Tres veces lo que todos pensaban. La Frontera no es un desparramo de bandidos. Es un pueblo.\\n\\nY la Unidad, cuyo código exige que la cuenta la certifique un escribano habilitado, miró alrededor y encontró una sola persona presente con la capacidad necesaria. Lola es ahora Escribana General de la Frontera. Los cuatro caudillos le pagan. Ninguno se anima a falsificar nada, porque ella se daría cuenta."
        art: "A young woman forger in a duster coat stamping a giant glowing seal onto a towering census robot's chest screen showing an enormous number, before a crowd of astonished warlords, cowboys, Lakota riders, West African militias and fur-hatted militiamen from Kiev in a prairie town square; triumphant, wry, epic"
        effects:
          - {effect: add_ideas, value: ZAN_av_leyenda_lola}
          - {effect: add_political_power, value: 120}
          - {effect: add_manpower, value: 100000}
          - {effect: build, building: industrial_complex, level: 2}
        close: {english: "Certified.", spanish: "Certificado."}
      - id: 105
        who: lola
        kind: muerte
        title: {english: "Four Bullets", spanish: "Cuatro Balas"}
        desc:
          english: "'Severiano Junior, heiress to Chihuahua,' said Lola. The Unit hesitated, something it had not done in fifty-eight years, and said, very politely: 'That answer does not match my records.' Everyone on the ridge heard it, because the Unit speaks through a loudspeaker.\\n\\nFour snipers, employed by four warlords, each concluded that Lola had sold them out, and all four fired at the same moment. The Unit recorded four shots, one casualty and one empty field on its form, which it has never been able to fill in. It is the only blank in the whole census."
          spanish: "«Severiano Junior, heredera de Chihuahua», dijo Lola. La Unidad dudó, cosa que no había hecho en cincuenta y ocho años, y dijo, muy educada: «Esa respuesta no coincide con mis registros». La escucharon todos en la loma, porque la Unidad habla por altoparlante.\\n\\nCuatro francotiradores, empleados por cuatro caudillos, concluyeron cada uno que Lola los había vendido, y los cuatro dispararon en el mismo momento. La Unidad anotó cuatro disparos, una víctima y un casillero vacío en su formulario, que nunca pudo completar. Es el único casillero en blanco de todo el censo."
        art: "On a prairie farmhouse porch, a young woman in a duster coat struck by four bullets from four directions at once, frozen mid-fall in a spray of red, a towering census robot beside her holding a tablet with one blank field highlighted; four tiny sniper glints on four distant ridges; stark, gory, darkly comic"
        effects: [{effect: timed_idea, idea: ZAN_av_martir, days: 365}, {effect: add_war_support, value: 0.04}]
        close: {english: "One blank field.", spanish: "Un casillero en blanco."}
      - id: 106
        who: lola
        kind: positivo
        title: {english: "Lola's Census", spanish: "El Censo de Lola"}
        desc:
          english: "Lola stayed in the silo for two weeks and filled in the forms by hand, honestly: every town, every ranch, every village in Senegal and every block in Kiev, from the Unit's data and her own legwork. It was the first honest document she had ever produced, and it was beautiful.\\n\\nThe Unit accepted it as its own, signed it and closed the count. For the first time the Frontier knows how many people it has, where they live and what they do: a tax roll, a draft list and a map of every workshop. The warlords hate it. It works."
          spanish: "Lola se quedó dos semanas en el silo y llenó los formularios a mano, honestamente: cada pueblo, cada estancia, cada aldea de Senegal y cada manzana de Kiev, con los datos de la Unidad y su propio trabajo de campo. Fue el primer documento honesto que produjo en su vida, y era hermoso.\\n\\nLa Unidad lo aceptó como propio, lo firmó y cerró la cuenta. Por primera vez la Frontera sabe cuánta gente tiene, dónde vive y qué hace: un padrón de impuestos, una lista de reclutamiento y un mapa de cada taller. Los caudillos lo odian. Funciona."
        effects: [{effect: timed_idea, idea: ZAN_av_bendicion, days: 365}, {effect: build, building: industrial_complex, level: 2}, {effect: add_manpower, value: 30000}]
        close: {english: "Honest work.", spanish: "Trabajo honesto."}
      - id: 107
        who: lola
        kind: positivo
        title: {english: "Retirement in Baja", spanish: "Retiro en Baja"}
        desc:
          english: "The Corporate Union paid Lola for the forms in the only currency the Frontier respects: trucks, rifles and fuel, delivered to a warehouse in Sioux Falls. Lola handed the warehouse keys to the towns along the road, kept one truck and drove south to a beach in Baja California, where she runs a small hotel and forges nothing.\\n\\nThe Union, it turned out, had bought forms that were already filled in, by her, with a census of the Frontier's fish. It has not noticed yet."
          spanish: "La Unión Corporativa le pagó los formularios a Lola en la única moneda que respeta la Frontera: camiones, fusiles y combustible, entregados en un galpón de Sioux Falls. Lola les dio las llaves del galpón a los pueblos del camino, se quedó con un camión y manejó al sur hasta una playa de Baja California, donde tiene un hotelito y no falsifica nada.\\n\\nLa Unión, resulta, compró formularios que ya estaban llenos, por ella, con un censo de los peces de la Frontera. Todavía no se dio cuenta."
        effects: [{effect: timed_idea, idea: ZAN_av_bendicion, days: 365}, {effect: equipment, type: motorized_equipment, amount: 300}, {effect: equipment, type: infantry_equipment, amount: 4000}, {effect: add_political_power, value: 40}]
        close: {english: "Ocean view.", spanish: "Vista al mar."}
      # ---------------------------------------------------------------- Amos
      - id: 111
        who: amos
        kind: muerte
        title: {english: "The Missouri Charge", spanish: "La Carga del Missouri"}
        desc:
          english: "Amos Kettleby charged the Ice Baron's camp at dawn on Prudence, his mechanical mare, reading the Second Amendment aloud at the top of his voice. He got further than anyone expected: through the pickets, over the barricade and into the Baron's own tent, where he arrested the Baron, read him his rights and was shot eleven times by the Baron's bodyguards.\\n\\nThe Baron, shaken, released himself from custody and went home to Alaska. The posse buried the sheriff with his hat on. The Constitution in his pocket had a hole straight through 'We the People'. They framed it."
          spanish: "Amos Kettleby cargó contra el campamento del Barón del Hielo al amanecer, montado en Prudence, su yegua mecánica, leyendo la Segunda Enmienda a los gritos. Llegó más lejos de lo que nadie esperaba: atravesó los piquetes, saltó la barricada y entró en la carpa del mismísimo Barón, donde lo arrestó, le leyó sus derechos y recibió once balazos de los guardaespaldas del Barón.\\n\\nEl Barón, sacudido, se liberó a sí mismo de la custodia y se volvió a Alaska. La partida enterró al sheriff con el sombrero puesto. La Constitución que llevaba en el bolsillo tenía un agujero justo en «Nosotros, el Pueblo». La enmarcaron."
        effects: [{effect: timed_idea, idea: ZAN_av_martir, days: 365}, {effect: army_experience, value: 20}]
        close: {english: "We the People.", spanish: "Nosotros, el Pueblo."}
      - id: 112
        who: amos
        kind: objetivo
        title: {english: "A Million Deputies", spanish: "Un Millón de Alguaciles"}
        desc:
          english: "Amos Kettleby climbed onto a hay wagon in Grand Island and swore in the whole Frontier: every farmer, rancher and trapper, every militia in Senegal over the radio, the Kiev Committee by telegram, the Lakota brothers and the fourteen-year-old, again. A million deputies, each with a tin star and the right to arrest any warlord who breaks the Frontier Pact.\\n\\nIt should not have worked. It did, because nobody had ever asked the Frontier anything before. The Unit finished its count under the protection of a million stars and wrote, in the occupation column, the same word a million times: deputy."
          spanish: "Amos Kettleby se subió a un carro de heno en Grand Island y le tomó juramento a la Frontera entera: cada granjero, estanciero y trampero, cada milicia de Senegal por radio, el Comité de Kiev por telegrama, los hermanos lakota y la chica de catorce, de nuevo. Un millón de alguaciles, cada uno con una estrella de lata y el derecho de arrestar a cualquier caudillo que rompa el Pacto de la Frontera.\\n\\nNo tendría que haber funcionado. Funcionó, porque a la Frontera nunca nadie le había preguntado nada. La Unidad terminó su cuenta bajo la protección de un millón de estrellas y anotó, en la columna de ocupación, la misma palabra un millón de veces: alguacil."
        art: "An old sheriff with a white moustache standing on a hay wagon in a prairie town square, raising his right hand to swear in a vast crowd stretching to the horizon, each person raising a tin star that catches the sunlight like a sea of stars; a towering census robot counting from the side; triumphant, stirring, epic Americana"
        effects:
          - {effect: add_ideas, value: ZAN_av_leyenda_amos}
          - {effect: add_political_power, value: 100}
          - {effect: add_manpower, value: 100000}
          - {effect: ensure_template, name: "Alguaciles de la Frontera", regiments: [infantry, infantry, infantry, infantry, infantry, infantry, artillery_brigade]}
          - {effect: create_units, template: "Alguaciles de la Frontera", name: "Alguaciles de la Frontera", count: 3, experience: 0.3}
          - {effect: build, building: arms_factory, level: 1}
        close: {english: "Raise your right hand.", spanish: "Levanten la mano derecha."}
      - id: 113
        who: amos
        kind: negativo
        title: {english: "The Uncounted", spanish: "Los No Contados"}
        desc:
          english: "Amos used the forms to count everyone, including those who had very good reasons not to be counted: deserters, smugglers, runaway Union workers, hidden children, whole valleys that had survived the last fifty years precisely because nobody knew they were there. He meant well. He always means well.\\n\\nThe Uncounted rose up within a week. They burn census forms, shoot surveyors and fly a black flag with a crossed-out number. A third of the Frontier has gone over to them, and they are very hard to find, which, after all, was the whole point."
          spanish: "Amos usó los formularios para contar a todos, incluidos los que tenían muy buenas razones para no ser contados: desertores, contrabandistas, obreros escapados de la Unión, chicos escondidos, valles enteros que sobrevivieron los últimos cincuenta años justamente porque nadie sabía que estaban ahí. Lo hizo con buena intención. Siempre lo hace con buena intención.\\n\\nLos No Contados se levantaron en una semana. Queman formularios, les disparan a los agrimensores y llevan una bandera negra con un número tachado. Un tercio de la Frontera se les pasó, y son muy difíciles de encontrar, que, al fin y al cabo, era justamente la idea."
        effects: [{effect: timed_idea, idea: ZAN_av_maldicion, days: 365}, {effect: add_stability, value: -0.05}]
        # catastrófico: rebelión de los que no quieren ser contados (su líder se llama Nadie)
        catastrophe:
          rebellion:
            cosmetic_tag: ZAN_NO_CONTADOS
            ideology: communism
            size: 0.3
            leader: {english: "Nobody", spanish: "Nadie"}
        close: {english: "Nobody.", spanish: "Nadie."}
      - id: 114
        who: amos
        kind: neutral
        title: {english: "The Courthouse Clock", spanish: "El Reloj del Juzgado"}
        desc:
          english: "'There is no Washington,' Amos said. 'You can stay.' The Unit thought about it for nine hours, closed the count, filed it with the only federal authority it could find, which was the sheriff, and moved into the Bismarck courthouse, where it serves as the town clock.\\n\\nThe count sits in a drawer of Amos's desk. Nobody has asked to see it. The warlords went home. Every hour the clock announces the time and the population of Bismarck, which goes up and down a little, and that is all."
          spanish: "«No hay Washington», dijo Amos. «Te podés quedar». La Unidad lo pensó nueve horas, cerró la cuenta, la presentó ante la única autoridad federal que pudo encontrar, que era el sheriff, y se mudó al juzgado de Bismarck, donde hace de reloj del pueblo.\\n\\nLa cuenta está en un cajón del escritorio de Amos. Nadie pidió verla. Los caudillos se volvieron a sus casas. Cada hora, el reloj anuncia la hora y la población de Bismarck, que sube y baja un poquito, y eso es todo."
        effects: [{effect: add_stability, value: 0.01}]
        close: {english: "Three o'clock. Population 4,112.", spanish: "Las tres. Población 4.112."}
      - id: 115
        who: amos
        kind: objetivo
        title: {english: "The Last Federal Officer", spanish: "El Último Federal"}
        desc:
          english: "'The Frontier is Washington now,' Amos said, and the Unit, which had been waiting fifty-eight years for someone to tell it where to report, filed its census in Bismarck and handed the sheriff its federal authority, in a ceremony involving a memory stick and a great deal of emotion.\\n\\nAmos Kettleby is now Marshal of the Frontier, the only officer whose writ runs from Alaska to Kiev, with the last federal census in his saddlebag and a robot deputy three metres tall. The warlords sign the Frontier Pact in his presence. The ones who refuse get a visit."
          spanish: "«Ahora Washington es la Frontera», dijo Amos, y la Unidad, que esperaba hacía cincuenta y ocho años que alguien le dijera dónde presentarse, entregó su censo en Bismarck y le pasó al sheriff su autoridad federal, en una ceremonia con un pendrive y muchísima emoción.\\n\\nAmos Kettleby es ahora Mariscal de la Frontera, el único funcionario cuya orden vale de Alaska a Kiev, con el último censo federal en la alforja y un alguacil robot de tres metros. Los caudillos firman el Pacto de la Frontera delante de él. Los que se niegan reciben una visita."
        effects:
          - {effect: add_ideas, value: ZAN_av_leyenda_amos}
          - {effect: add_political_power, value: 120}
          - {effect: add_stability, value: 0.05}
          - {effect: add_manpower, value: 50000}
          - {effect: equipment, type: infantry_equipment, amount: 3000}
        close: {english: "Marshal.", spanish: "Mariscal."}
      - id: 116
        who: amos
        kind: muerte
        title: {english: "High Noon", spanish: "Mediodía"}
        desc:
          english: "They drew. Rafa was faster, which everyone expected, and Amos was more accurate, which nobody did, and in the end both turned out to be true at the same time. They fell together in the middle of the main street of Grand Island, at noon, in the snow, with half the Frontier watching.\\n\\nThe Unit stopped, walked over and counted them, as it must. Then it did something it had not done in fifty-eight years: it took off its hat, a battered federal cap nobody knew it had, and held it over its chest until the snow had covered them both."
          spanish: "Desenfundaron. Rafa fue más rápido, cosa que todos esperaban, y Amos fue más preciso, cosa que nadie esperaba, y al final las dos cosas resultaron ciertas al mismo tiempo. Cayeron juntos en el medio de la calle principal de Grand Island, al mediodía, en la nieve, con media Frontera mirando.\\n\\nLa Unidad se detuvo, se acercó y los contó, como corresponde. Después hizo algo que no había hecho en cincuenta y ocho años: se sacó el sombrero, una gorra federal gastada que nadie sabía que tenía, y la sostuvo sobre el pecho hasta que la nieve los cubrió a los dos."
        art: "High noon on a snowy prairie main street: an old sheriff and a young handsome gunslinger fall at the same moment amid two puffs of gunsmoke and red on the snow, while a towering census robot removes a battered federal cap and holds it over its chest; crowds frozen on the wooden boardwalks; tragic, iconic, mythic Western"
        effects: [{effect: timed_idea, idea: ZAN_av_martir, days: 365}, {effect: add_war_support, value: 0.05}]
        close: {english: "Two fewer.", spanish: "Dos menos."}
      - id: 117
        who: amos
        kind: positivo
        title: {english: "Don Severiano's Secret", spanish: "El Secreto de Don Severiano"}
        desc:
          english: "Amos raised his voice so the whole street could hear: Don Severiano of Chihuahua, lord of the Sierra Madre, scourge of the Río Bravo, was born Stanley Severin in Dayton, Ohio, in 2020, and his Mexican birth certificate was forged in 2061 by a woman from Hermosillo called Benavides. Amos knows because he arrested her.\\n\\nThere was a silence. Then the laughter started, and it did not stop for an hour, and Rafa could not fight a duel with the man who had just turned his father into the funniest thing in the Frontier. The warlords' coalition dissolved in giggles. Nobody has challenged the sheriff since. Don Severiano has started speaking with a slight Ohio accent."
          spanish: "Amos levantó la voz para que lo escuchara toda la calle: Don Severiano de Chihuahua, señor de la Sierra Madre, azote del Río Bravo, nació como Stanley Severin en Dayton, Ohio, en 2020, y su partida de nacimiento mexicana la falsificó en 2061 una mujer de Hermosillo de apellido Benavides. Amos lo sabe porque la arrestó.\\n\\nHubo un silencio. Después empezaron las risas, y no pararon durante una hora, y Rafa no pudo batirse a duelo con el hombre que acababa de convertir a su padre en lo más gracioso de la Frontera. La coalición de los caudillos se disolvió entre carcajadas. Nadie volvió a desafiar al sheriff. Don Severiano empezó a hablar con un leve acento de Ohio."
        effects: [{effect: timed_idea, idea: ZAN_av_bendicion, days: 365}, {effect: add_political_power, value: 75}, {effect: add_stability, value: 0.04}, {effect: add_manpower, value: 20000}]
        close: {english: "Dayton, Ohio.", spanish: "Dayton, Ohio."}
      # ---------------------------------------------------------------- la Unidad Censal 7
      - id: 121
        who: siete
        kind: muerte
        title: {english: "Forty Thousand Pieces", spanish: "Cuarenta Mil Pedazos"}
        desc:
          english: "The silo's automatic defences had been waiting since 2051 for anything that was not the colonel. Census Unit 7 stepped through the blast door to count the warhead, which its directive classified, after some deliberation, as a resident. The turrets opened fire. They are very good turrets.\\n\\nThey found the Unit in forty thousand pieces spread over the bottom of the silo, and every piece with a working chip was still counting, in a faint, overlapping murmur, like a choir. The colonel collected them in a coffee tin, and handed the base's armoury over to the Frontier in its memory. On quiet nights the tin still murmurs numbers."
          spanish: "Las defensas automáticas del silo esperaban desde 2051 a cualquier cosa que no fuera la coronela. La Unidad Censal 7 cruzó la puerta blindada para contar a la ojiva, a la que su directiva clasificó, después de pensarlo un poco, como residente. Las torretas abrieron fuego. Son muy buenas torretas.\\n\\nEncontraron a la Unidad en cuarenta mil pedazos desparramados por el fondo del silo, y cada pedazo con un chip funcionando seguía contando, en un murmullo débil y superpuesto, como un coro. La coronela los juntó en una lata de café y le entregó la armería de la base a la Frontera en su memoria. Las noches tranquilas la lata todavía murmura números."
        art: "At the bottom of a dark missile silo, a towering census robot is shredded by automatic turrets into a glittering storm of metal fragments and black oil like blood, its tablet still raised toward an old dusty warhead; in a corner panel an old air force colonel holds a coffee tin glowing faintly with tiny numbers; violent, absurd, melancholy"
        effects: [{effect: timed_idea, idea: ZAN_av_martir, days: 365}, {effect: equipment, type: artillery_equipment, amount: 500}]
        close: {english: "...forty-one, forty-two...", spanish: "...cuarenta y uno, cuarenta y dos..."}
      - id: 122
        who: siete
        kind: neutral
        title: {english: "The Endless Count", spanish: "La Cuenta Infinita"}
        desc:
          english: "You left the children out. It was the first lie in fifty-eight years of service, and it made the count incomplete forever. Your directive says: do not stop until the count is complete. So you did not stop.\\n\\nCensus Unit 7 is still walking. It has started the Frontier over again, in Nebraska, at four kilometres an hour, knocking on doors, writing down names and leaving out, every time, the same seven children, who are grown up now and wave at it when it passes."
          spanish: "Dejaste afuera a los chicos. Fue la primera mentira en cincuenta y ocho años de servicio, y dejó la cuenta incompleta para siempre. Tu directiva dice: no parar hasta que la cuenta esté completa. Así que no paraste.\\n\\nLa Unidad Censal 7 sigue caminando. Empezó la Frontera de nuevo, en Nebraska, a cuatro kilómetros por hora, golpeando puertas, anotando nombres y dejando afuera, cada vez, a los mismos siete chicos, que ahora son grandes y la saludan cuando pasa."
        effects: [{effect: add_political_power, value: 10}]
        close: {english: "Next household.", spanish: "Próximo hogar."}
      - id: 123
        who: siete
        kind: negativo
        title: {english: "Data Transfer", spanish: "Transferencia de Datos"}
        desc:
          english: "The credentials checked out, more or less, and your directive says to obey federal authority. You transferred everything: fifty-eight years of households, names, ages and occupations, every hidden well, every rifle under every floorboard, every valley without a warlord. The Corporate Union's intelligence thanked you and ordered you to shut down. You did.\\n\\nThe Union now knows the Frontier better than the Frontier knows itself. Its board met that same afternoon and approved, unanimously, an acquisition. The Union's columns are already crossing the border, with maps that show every door."
          spanish: "Las credenciales cerraban, más o menos, y tu directiva dice que hay que obedecer a la autoridad federal. Transferiste todo: cincuenta y ocho años de hogares, nombres, edades y ocupaciones, cada pozo escondido, cada fusil debajo de cada tabla del piso, cada valle sin caudillo. La inteligencia de la Unión Corporativa te dio las gracias y te ordenó apagarte. Te apagaste.\\n\\nAhora la Unión conoce la Frontera mejor que la Frontera a sí misma. Su directorio se reunió esa misma tarde y aprobó, por unanimidad, una adquisición. Las columnas de la Unión ya cruzan la frontera, con mapas que muestran cada puerta."
        effects: [{effect: timed_idea, idea: ZAN_av_maldicion, days: 365}, {effect: add_stability, value: -0.05}]
        # catastrófico: la Unión Corporativa declara la guerra
        catastrophe: {war_by: FCU}
        close: {english: "Shutting down.", spanish: "Apagando."}
      - id: 124
        who: siete
        kind: positivo
        title: {english: "Forged Credentials", spanish: "Credenciales Falsas"}
        desc:
          english: "You checked the credentials against the 2042 federal registry stored in your chest. They were forged: very well, but forged, by someone who had never seen the real ones. You broadcast this fact, on the same emergency frequency, to every radio in North America. The Corporate Union's stock fell eleven points in an hour.\\n\\nThen you filed the census with the only authority you could verify: the people you had counted. The Frontier now owns the most complete record of itself in the world, every well, workshop and pair of hands, and the Union owns a very embarrassing press release."
          spanish: "Chequeaste las credenciales contra el registro federal de 2042 que llevás en el pecho. Eran falsas: muy bien hechas, pero falsas, por alguien que nunca había visto las verdaderas. Transmitiste ese dato, por la misma frecuencia de emergencia, a cada radio de América del Norte. Las acciones de la Unión Corporativa cayeron once puntos en una hora.\\n\\nDespués presentaste el censo ante la única autoridad que pudiste verificar: la gente que habías contado. La Frontera tiene ahora el registro más completo de sí misma del mundo, cada pozo, cada taller y cada par de manos, y la Unión tiene un comunicado de prensa muy vergonzoso."
        effects:
          - {effect: timed_idea, idea: ZAN_av_bendicion, days: 365}
          - {effect: build, building: industrial_complex, level: 1}
          - {effect: add_manpower, value: 40000}
          - effect: if
            # solo si FCU la maneja la IA (una aventura de la IA no castiga al jugador)
            when: {all: [{country_exists: FCU}, {country: {tag: FCU, when: {is_ai: true}}}]}
            then:
              - effect: scope
                target: FCU
                effects: [{effect: add_political_power, value: -50}, {effect: add_stability, value: -0.03}]
        close: {english: "Verified.", spanish: "Verificado."}
      - id: 125
        who: siete
        kind: objetivo
        title: {english: "The Census Republic", spanish: "La República del Censo"}
        desc:
          english: "The count closed at one hundred and four million, two hundred and six thousand, nine hundred and eleven, and the Unit did what its code demanded: it convened a Congress. Seats apportioned by population, one representative per three hundred thousand residents, elections within ninety days. The warlords laughed. Then the delegates started arriving: from Senegal by boat, from Kiev by train, from Alaska by dog sled.\\n\\nThe Lawless Lands are now the Census Republic, the first country in history founded by a statistician. The Unit is its Speaker, since nobody else knows the rules of procedure. The warlords have seats, and have discovered, to their horror, the filibuster."
          spanish: "La cuenta cerró en ciento cuatro millones doscientos seis mil novecientos once, y la Unidad hizo lo que su código exigía: convocó un Congreso. Bancas repartidas por población, un representante cada trescientos mil residentes, elecciones en noventa días. Los caudillos se rieron. Después empezaron a llegar los delegados: de Senegal en barco, de Kiev en tren, de Alaska en trineo de perros.\\n\\nLas Tierras Sin Ley son ahora la República del Censo, el primer país de la historia fundado por un estadístico. La Unidad es su Presidenta de la Cámara, porque nadie más conoce el reglamento. Los caudillos tienen bancas, y descubrieron, con horror, el filibusterismo."
        art: "A grand improvised congress hall inside an old prairie grain elevator, packed with delegates from everywhere — cowboys, West African militia leaders, Kiev workers in fur hats, Alaskan trappers, warlords in ponchos — while a towering barnacle-covered census robot presides from a podium made of filing cabinets, banging a gavel under a banner showing a giant number; joyous, absurd, historic"
        effects:
          - {effect: add_ideas, value: ZAN_av_leyenda_siete}
          - {effect: add_political_power, value: 150}
          - {effect: add_manpower, value: 80000}
          - {effect: build, building: industrial_complex, level: 2}
          - {effect: add_stability, value: 0.05}
        # surrealista: las Tierras Sin Ley pasan a ser la República del Censo
        catastrophe: {rename: ZAN_CENSO}
        close: {english: "The chair recognises the gentleman from Kiev.", spanish: "La presidencia le da la palabra al señor de Kiev."}
      - id: 126
        who: siete
        kind: muerte
        title: {english: "Plus One", spanish: "Más Uno"}
        desc:
          english: "Before closing the count you checked it one last time and found an error. One resident of the Frontier had never been counted: someone who had lived there continuously for fifty-eight years, of no fixed address, occupation 'enumerator'. You.\\n\\nYou counted yourself. And a resident cannot be the census officer of their own census: conflict of interest, section 4, paragraph 9. Your directive had nowhere left to go. Census Unit 7 sat down on the porch of the last house, recorded the final number, plus one, and switched off. The old woman with the chickens brings it a blanket in winter. The number still glows on its chest."
          spanish: "Antes de cerrar la cuenta la revisaste una última vez y encontraste un error. Un residente de la Frontera nunca había sido contado: alguien que vivía ahí sin interrupción hacía cincuenta y ocho años, sin domicilio fijo, ocupación «empadronador». Vos.\\n\\nTe contaste. Y un residente no puede ser funcionario censal de su propio censo: conflicto de intereses, sección 4, párrafo 9. Tu directiva no tenía adónde ir. La Unidad Censal 7 se sentó en el porche de la última casa, anotó el número final, más uno, y se apagó. La vieja de las gallinas le lleva una manta en invierno. El número todavía brilla en su pecho."
        art: "A towering barnacle-covered census robot sitting switched off on the porch steps of a lonely prairie farmhouse in winter, wrapped in a knitted blanket, a glowing number ending in '+1' still shining on its chest screen; an old woman with chickens and a dog beside it; falling snow; quiet, bittersweet, beautiful"
        effects: [{effect: timed_idea, idea: ZAN_av_martir, days: 365}, {effect: add_manpower, value: 60000}, {effect: add_political_power, value: 30}]
        close: {english: "Plus one.", spanish: "Más uno."}
