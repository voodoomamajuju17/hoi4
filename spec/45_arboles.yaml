# =============================================================================
# Rediseño de los árboles de foco (2026-11-18)
#
# Pedido: el documento "Rediseño de los árboles de foco" ("Implementar ese proyecto, al 100%. Sin
# Prototipo"). Los ocho árboles de las potencias pasan de una plantilla común a ocho formas propias, y
# la economía de cada uno pasa a nacer de su política. Ningún foco cambia (nombre, días, recompensa):
# solo de qué foco cuelga (`conexiones`) y dónde se dibuja (`forma`, tools/gen/emitters/focus_trees.py
# -> _layout_forma). Ninguna ruta cambia de duración (tools/arboles.py lo verifica; test_arboles).
#
#   conexiones: {foco: {prerequisites: [todos], prerequisites_any: [cualquiera]}} (reemplazan los de antes)
#     - economía atada: el Consejo Económico pide cualquiera de los dos lados políticos y cada economía
#       pide además su lado (la otra se apaga); en la Unión, con desvío; en la Comuna, del cómputo;
#     - dos puertas: una rama que se abre desde cualquiera de los dos lados políticos;
#     - vueltas: un foco tardío que pide además un foco de otra rama.
#   forma: raíz, grupos (rama, ramas juntas o lista de focos) con su columna y dirección (abajo, o en
#     escalera a la derecha o a la izquierda): todo cuelga hacia abajo. Japón, Gran Bretaña, las
#     anarquías y la Junta no tienen forma: se dibujan como siempre.
# =============================================================================

arboles:
  EFE:
    conexiones:
      EFE_ministerio_de_restauracion: {prerequisites: [], prerequisites_any: [EFE_el_mandato_renovado, EFE_los_incendios_de_gaia]}
      EFE_autarquia_del_bioacero: {prerequisites: [EFE_ministerio_de_restauracion, EFE_el_mandato_renovado]}
      EFE_diplomacia_del_agua: {prerequisites: [EFE_ministerio_de_restauracion, EFE_los_incendios_de_gaia]}
      EFE_guardia_verde_movilizada: {prerequisites: [], prerequisites_any: [EFE_el_mandato_renovado, EFE_los_incendios_de_gaia]}
      EFE_cultivar_la_armadura: {prerequisites: [EFE_el_mariscal_etchegaray, EFE_biosteel_umbral_2]}
      EFE_laboratorio_de_gaia: {prerequisites: [EFE_energia_de_biomasa, EFE_cubas_de_contencion]}
    # El Árbol (2026-11-18, segunda versión: el juego solo dibuja bien las líneas que bajan): el foco de 2100
    # es el tronco arriba; la política y la economía bajan por el centro, la Guardia Verde y los Cóndores se
    # abren en escalera a los costados y las tres ramas del Bioacero son las raíces de afuera
    forma:
      raiz: 20
      at: {EFE_la_hora_de_gaia: 20}
      grupos:
      - {ramas: [dinastia_verde, el_monte], origen: 20}
      - {focos: [EFE_ministerio_de_restauracion], origen: 20}
      - {ramas: [autarquia, diplomacia_agua], origen: 20}
      - {rama: destino, origen: 20}
      - {rama: guardia_verde, origen: 12, dir: izquierda}
      - {rama: condores, origen: 28, dir: derecha}
      - {rama: ciclo_bioacero, origen: 2}
      - {rama: cubas, origen: 38}
      - {rama: cubas_sanas, origen: 44}
  ASC:
    conexiones:
      ASC_el_consejo_economico: {prerequisites: [ASC_datacenter_de_brandeburgo]}
      ASC_torres_de_enfriamiento: {prerequisites: [ASC_enfriamiento_del_rin]}
      ASC_mando_por_red: {prerequisites: [ASC_drones_de_infanteria, ASC_red_de_fibra_baltica]}
      ASC_supercomputadora_de_planificacion: {prerequisites: [ASC_robotica_de_ensamble, ASC_reserva_de_computo]}
      ASC_portadrones: {prerequisites: [ASC_patrulla_del_baltico, ASC_enjambres_aereos, ASC_mando_por_red]}
    # La Placa (segunda versión): el Poder de Cómputo baja en escalera hacia la derecha como una pista; la
    # política en el centro, la economía a la derecha y las ramas militares a los costados
    forma:
      raiz: 6
      grupos:
      - {rama: poder_de_computo, origen: 8, dir: derecha}
      - {ramas: [consejo_sorteado, plan_41], origen: 0}
      - {rama: destino, origen: 0}
      - {ramas: [plan_total, mercado_computo], origen: 22}
      - {rama: fabricas_a_oscuras, origen: -8}
      - {rama: enjambres, origen: -14}
      - {rama: flota_del_norte, origen: 32}
      - {rama: red_fria, origen: 38}
  FCU:
    conexiones:
      FCU_consejo_economico: {prerequisites: [], prerequisites_any: [FCU_reparto_de_carteras, FCU_junta_de_emergencia]}
      FCU_el_dividendo: {prerequisites: [FCU_consejo_economico], prerequisites_any: [FCU_comida_para_todos, FCU_absorber_a_halvorsen]}
      FCU_monopolio_del_agua: {prerequisites: [FCU_consejo_economico], prerequisites_any: [FCU_grifos_de_la_union, FCU_castellane_firma]}
      FCU_fuerza_contratada: {prerequisites: [], prerequisites_any: [FCU_contratos_de_defensa, FCU_junta_de_emergencia]}
      FCU_oficina_de_cumplimiento: {prerequisites: [], prerequisites_any: [FCU_el_libro_mayor, FCU_liquidar_obsidian]}
    # La Mesa Redonda (segunda versión): la Junta y el Consejo en el centro; cada corporación con su rama hacia
    # un lado: el Dividendo y Cumplimiento a la izquierda, el Agua y la Fuerza a la derecha
    forma:
      raiz: 21
      at: {FCU_junta_anual: 21}
      grupos:
      - {ramas: [politica_castellane, politica_rourke], origen: 21}
      - {focos: [FCU_consejo_economico], origen: 21}
      - {ramas: [economia_dividendo, economia_agua], origen: 21}
      - {rama: destino, origen: 21}
      - {rama: casa_de_cristal, origen: 9, dir: izquierda}
      - {rama: ejercito, origen: 33, dir: derecha}
      - {rama: industria, origen: 3}
      - {rama: mar_aire, origen: 39}
      - {rama: directorio, origen: 45}
  HSN:
    conexiones:
      HSN_el_consejo_mercantil: {prerequisites: [], prerequisites_any: [HSN_el_libro_de_fletes, HSN_el_motin_de_kanto]}
      HSN_el_puerto_libre: {prerequisites: [HSN_el_consejo_mercantil, HSN_el_libro_de_fletes]}
      HSN_el_peaje_de_los_estrechos: {prerequisites: [HSN_el_consejo_mercantil, HSN_el_motin_de_kanto]}
      HSN_astilleros_flotantes: {prerequisites: [HSN_malaca]}
      HSN_marines_de_alta_mar: {prerequisites: [HSN_nodo_manila]}
      HSN_consulados_navales: {prerequisites: [HSN_nodo_taiwan]}
      HSN_la_red_de_alta_mar: {prerequisites: [HSN_nodo_okinawa, HSN_grupos_de_portaaviones]}
    # La Ruta (segunda versión): los Nodos bajan en escalera hacia la derecha, en el orden del mar, y de cada
    # puerto cuelga su rama; Aldana y Tavake, lado a lado, a la izquierda
    forma:
      raiz: 4
      at: {HSN_la_junta_de_capitanes: 4}
      grupos:
      - {focos: [HSN_malaca, HSN_nodo_sunda, HSN_nodo_manila, HSN_nodo_taiwan, HSN_nodo_hong_kong, HSN_nodo_okinawa, HSN_la_red_de_alta_mar], origen: 12, dir: derecha}
      - {ramas: [aldana, tavake], origen: 2}
      - {rama: destino, origen: 2}
      - {ramas: [puerto_libre, peaje], origen: 2}
      - {rama: astilleros, origen: 14}
      - {rama: cubierta, origen: 18}
      - {focos: [HSN_consulados_navales, HSN_seguros_para_las_potencias, HSN_la_flota_de_escolta, HSN_el_tratado_de_libre_paso, HSN_el_arbitro_de_los_mares, HSN_la_talasocracia], origen: 22}
      - {rama: armada, origen: 30}
  NAS:
    conexiones:
      NAS_el_consejo_del_campo: {prerequisites: [], prerequisites_any: [NAS_la_coronacion_renovada, NAS_el_inca_rompe_el_silencio]}
      NAS_las_terrazas: {prerequisites: [NAS_el_consejo_del_campo, NAS_la_coronacion_renovada]}
      NAS_la_mineria_del_cielo: {prerequisites: [NAS_el_consejo_del_campo, NAS_el_inca_rompe_el_silencio]}
      NAS_granjas_del_sol: {prerequisites: [], prerequisites_any: [NAS_los_sacerdotes_del_sol, NAS_mita_de_guerra]}
      NAS_observatorio_del_sol: {prerequisites: [NAS_las_minas_de_potosi, NAS_templos_eficientes]}
    # El Sol de los Cuatro Suyus (segunda versión): el Sol de 2100 arriba al centro y las ramas abiertas como
    # rayos: la Corte y el Inca en el centro, el Inti-Soma y el Calendario en escalera a la derecha, las Alas y
    # los Guerreros en escalera a la izquierda, Talleres, Terrazas y Minería abajo
    forma:
      raiz: 18
      at: {NAS_el_consejo_de_cusco: 18}
      grupos:
      - {ramas: [corte_del_sol, tawantinsuyu], origen: 18}
      - {rama: destino, origen: 18}
      - {ramas: [terrazas, mineria], origen: 18}
      - {rama: talleres, origen: 18}
      - {rama: inti_soma, origen: 24, dir: derecha}
      - {rama: calendario_solar, origen: 30, dir: derecha}
      - {rama: alas_del_sol, origen: 12, dir: izquierda}
      - {rama: guerreros, origen: 6, dir: izquierda}
  SHD:
    conexiones:
      SHD_el_consejo_economico: {prerequisites: [], prerequisites_any: [SHD_ajuste_tecnico_n_1, SHD_abrir_las_compuertas]}
      SHD_la_economia_de_precision: {prerequisites: [SHD_el_consejo_economico, SHD_ajuste_tecnico_n_1]}
      SHD_las_grandes_obras: {prerequisites: [SHD_el_consejo_economico, SHD_abrir_las_compuertas]}
      SHD_infanteria_de_masa: {prerequisites: [], prerequisites_any: [SHD_ajuste_tecnico_n_1, SHD_abrir_las_compuertas]}
      SHD_el_modelo_del_rio: {prerequisites: [SHD_sensores_del_caudal, SHD_diques_de_contencion, SHD_las_tres_gargantas]}
      SHD_valvula_de_produccion: {prerequisites: [SHD_los_tres_caudales, SHD_la_red_electrica_nacional]}
    # El Río (segunda versión): el Directorio de 2100 es la naciente, arriba a la izquierda; el Caudal
    # Corregido baja en escalera hacia la derecha como un cauce hasta el Destino; las demás ramas son afluentes
    forma:
      raiz: 0
      at: {SHD_la_sesion_tecnica: 0}
      grupos:
      - {ramas: [caudal_corregido, gran_crecida], origen: 2, dir: derecha}
      - {rama: destino, origen: 20, dir: derecha}
      - {ramas: [precision, grandes_obras], origen: 8}
      - {rama: represas, origen: -6}
      - {rama: armonia, origen: -12}
      - {rama: sala_de_control, origen: 30}
      - {rama: cielo, origen: 36}
      - {rama: ejercito_del_caudal, origen: 42}
  APF:
    conexiones:
      APF_el_consejo_economico: {prerequisites: [], prerequisites_any: [APF_mil_consejos, APF_los_consejos_se_arman]}
      APF_la_aldea_autosuficiente: {prerequisites: [APF_el_consejo_economico, APF_mil_consejos]}
      APF_el_corredor_continental: {prerequisites: [APF_el_consejo_economico, APF_los_consejos_se_arman]}
      APF_milicias_regulares: {prerequisites: [], prerequisites_any: [APF_consejos_locales, APF_los_consejos_se_arman]}
      APF_un_solo_pueblo: {prerequisites: [APF_la_red_de_consejos, APF_el_parlamento_de_los_pueblos]}
    # El Hemiciclo (segunda versión): el Congreso de 2100 arriba al centro y las ramas abiertas en abanico como
    # las bancas: la política al centro, lo militar a la izquierda, la economía y la integración a la derecha
    forma:
      raiz: 22
      at: {APF_la_asamblea_de_lagos: 22}
      grupos:
      - {ramas: [congreso, marcha], origen: 22}
      - {rama: destino, origen: 22}
      - {ramas: [aldea, corredor], origen: 22}
      - {rama: milicias, origen: 14, dir: izquierda}
      - {rama: alas, origen: 6, dir: izquierda}
      - {rama: polos, origen: 30, dir: derecha}
      - {rama: integracion, origen: 36, dir: derecha}
      - {rama: voz_de_los_consejos, origen: 42, dir: derecha}
  NRE:
    conexiones:
      NRE_el_erario: {prerequisites: [], prerequisites_any: [NRE_el_senado_restaurado, NRE_la_legion_decide]}
      NRE_la_annona: {prerequisites: [NRE_el_erario, NRE_el_senado_restaurado]}
      NRE_el_tributo: {prerequisites: [NRE_el_erario, NRE_la_legion_decide]}
      NRE_el_limes: {prerequisites: [], prerequisites_any: [NRE_las_vias_imperiales, NRE_la_legion_decide]}
      NRE_roma_aeterna: {prerequisites: [NRE_la_disciplina_del_limes, NRE_el_triunfo]}
    # Todos los Caminos (segunda versión): la Aclamación arriba al centro, como Roma, y las ramas salen como
    # vías: la política al centro, el Erario en escalera al oeste, las Forjas al este, las legiones, la flota
    # y los oficiales abajo; el Limes, afuera
    forma:
      raiz: 20
      at: {NRE_el_consilium: 20}
      grupos:
      - {ramas: [principado, cuatro_imperatores], origen: 20}
      - {rama: destino, origen: 20}
      - {rama: erario, origen: 12, dir: izquierda}
      - {rama: forjas, origen: 28, dir: derecha}
      - {rama: legiones, origen: 6}
      - {rama: mare_nostrum, origen: 34}
      - {rama: oficiales, origen: 40}
      - {rama: el_limes, origen: 0}
