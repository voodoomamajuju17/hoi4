# =============================================================================
# 2100 Meganations — IA de las potencias (2026-09-24)
# =============================================================================
# Cada plan se vuelve un bloque de common/ai_strategy/. Tipos validados contra
# los que usa el juego instalado; uno desconocido se descarta con aviso.
#
# defaults.satellites: cada señor protege a sus satélites y ellos lo apoyan.
# defaults.rivals: las rivalidades de 04_diplomacy se antagonizan.
# plans: a quién conquistar, cuándo prepararse y cuándo declarar.
# =============================================================================
defaults:
  satellites: {protect: 150, befriend: 100, support: 100}
  rivals: {antagonize: 30}
  anarchy_pariah: {alliance: -500, protect: -500}
  # 2026-10-11 (game.log a 2103): NAS, la Comuna y la APF garantizaban al SHD y
  # la guerra HSN-SHD metió a cuatro potencias; la Unión siguió el efecto
  # dominó. Nadie se alía ni garantiza fuera de su bloque (potencia + satélites).
  great_powers: {alliance: -300, protect: -200}
# -----------------------------------------------------------------------------
# IA militar (2026-09-27). Todos arrancan con 2 divisiones y sin investigar:
# la IA del juego base no sabe qué hacer en ese mundo. Acá se le dice qué
# tropas armar según la especialidad de cada potencia (13_military), qué
# investigar (las tecnologías que siguen en su especialidad) y cuánta
# industria poner en armas. Los tipos y los ids (infantry, armor...) se
# validan contra los que usa el juego instalado; los que no existen se omiten
# con aviso en el reporte.
# -----------------------------------------------------------------------------
military:
  src: user_decision
  research_value: 60
  peace:
  # 2026-10-03: con 25 la industria militar no alcanzaba para equipar lo que entrenaba
  # 2026-10-11 ("mejor preparada"): 50 en paz y 90 en guerra
  - {type: added_military_to_civilian_factory_ratio, value: 50}
  war:
  - {type: added_military_to_civilian_factory_ratio, value: 90}
  # 2026-10-11 ("hacela mucho más competente"): la IA del juego descuida la
  # industria, la electrónica y los cazas en un mundo que arranca sin
  # investigar. Pesos extra para todas; la especialidad de cada una, más.
  industry_research:
    value: 80
    by_country: {FCU: 140, ASC: 140, SHD: 120}
    techs: [construction1, construction2, construction3, construction4, construction5,
            basic_machine_tools, improved_machine_tools, advanced_machine_tools,
            assembly_line_production, flexible_line, streamlined_line,
            concentrated_industry, concentrated_industry2, concentrated_industry3, concentrated_industry4,
            concentrated_industry5, dispersed_industry, dispersed_industry2, dispersed_industry3,
            dispersed_industry4, dispersed_industry5, excavation1, excavation2, excavation3,
            fuel_silos, fuel_refining, fuel_refining2, fuel_refining3, synth_oil_experiments,
            oil_processing, improved_oil_processing, advanced_oil_processing,
            rubber_processing, improved_rubber_processing, advanced_rubber_processing,
            improved_equipment_conversion, advanced_equipment_conversion]
  electronics_research:
    value: 60
    by_country: {SHD: 140, ASC: 120, FCU: 100}
    techs: [electronic_mechanical_engineering, radio, improved_radio, advanced_radio,
            mechanical_computing, computing_machine, improved_computing_machine, advanced_computing_machine,
            basic_encryption, basic_decryption, improved_encryption, improved_decryption,
            advanced_encryption, advanced_decryption, cavity_magnatron, centimetric_radar]
  air_research:
    value: 50
    by_country: {NAS: 220, FCU: 100, HSN: 80, SHD: 70}
    techs: [aircraft_construction, engines_1, engines_2, engines_3, engines_4,
            iw_small_airframe, basic_small_airframe, improved_small_airframe, advanced_small_airframe,
            modern_small_airframe, aa_lmg, aa_hmg, aa_cannon_1, aa_cannon_2, aa_cannon_3,
            basic_medium_airframe, improved_medium_airframe, survivability_studies, range_improvements]
  # 2026-09-27: "nadie investiga barcos". Todas investigan lo básico naval; la
  # HSN mucho más.
  naval_research:
    # 2026-09-30 (partida a 2107: "la HSN no investiga barcos"): la lista era
    # solo lo del arranque. Todos los cascos, del I al IV; la HSN x16.
    value: 40
    by_country: {HSN: 300, FCU: 100, NRE: 80, SHD: 60, ASC: 60}
    techs: [early_ship_hull_light, basic_ship_hull_light, improved_ship_hull_light, advanced_ship_hull_light,
            early_ship_hull_cruiser, basic_ship_hull_cruiser, improved_ship_hull_cruiser, advanced_ship_hull_cruiser,
            early_ship_hull_heavy, basic_ship_hull_heavy, improved_ship_hull_heavy, advanced_ship_hull_heavy,
            early_ship_hull_carrier, basic_ship_hull_carrier, improved_ship_hull_carrier, advanced_ship_hull_carrier,
            early_ship_hull_submarine, basic_ship_hull_submarine, improved_ship_hull_submarine, advanced_ship_hull_submarine,
            # 2026-10-01 (reporte 1.19.3): improved_battery, basic_medium_battery e
            # improved_airplane_launcher no existen; las baterías son light/heavy
            basic_battery, basic_light_battery, improved_light_battery, basic_heavy_battery, improved_heavy_battery,
            basic_torpedo, improved_ship_torpedo_launcher, basic_depth_charges, improved_depth_charges,
            basic_naval_mines, basic_fire_control_system, improved_fire_control_system, fire_control_methods_1,
            basic_heavy_armor_scheme, basic_cruiser_armor_scheme, basic_dp_light_battery]
  # 2026-09-30: "nadie está construyendo tanques". Todas arrancan con el
  # tanque básico e investigan los blindados; el EFE mucho más. Los ids que
  # no existen en el juego se ignoran (con y sin No Step Back).
  armor_research:
    # 2026-09-30 (partida a 2104: "tampoco investigan la rama de blindados"):
    # factor x4 para todas, x11 el EFE, x7 ASC/FCU/NRE (factor = 1 + valor/20)
    value: 60
    by_country: {EFE: 200, ASC: 120, FCU: 120, NRE: 120}
    techs: [gwtank_chassis, basic_light_tank_chassis, improved_light_tank_chassis, advanced_light_tank_chassis,
            basic_medium_tank_chassis, improved_medium_tank_chassis, basic_heavy_tank_chassis,
            gwtank, basic_light_tank, improved_light_tank, basic_medium_tank, improved_medium_tank,
            motorised_infantry, mechanised_infantry]
  # 2026-10-21 (pedido del usuario: "que la HSN tenga más polenta en marines y mejore
  # las invasiones navales"): lo que agranda y acelera los desembarcos (las lanchas
  # suben cuántos planes de invasión y cuántas divisiones por plan) y los marines.
  invasion_research:
    value: 0
    by_country: {HSN: 250}
    techs: [marines, marines2, marines3, tech_marines, mtg_transport, mtg_landing_craft, mtg_tank_landing_craft,
            improved_special_forces, advanced_special_forces, survival_training,
            amphibious_mechanized_infantry, amphibious_mechanized_infantry_2, amphibious_drive]
  by_country:
    EFE:    # blindados de Bioacero
    - {type: role_ratio, id: armor, value: 25}
    - {type: equipment_production_factor, id: armor, value: 25}
    - {type: equipment_production_factor, id: fighter, value: 10}
    NRE:    # legiones de infantería con artillería
    - {type: equipment_production_factor, id: armor, value: 10}
    - {type: equipment_production_factor, id: fighter, value: 10}
    - {type: role_ratio, id: armor, value: 10}
    - {type: role_ratio, id: infantry, value: 60}
    - {type: equipment_production_factor, id: artillery, value: 20}
    SHD:    # la masa y la artillería del río
    - {type: equipment_production_factor, id: fighter, value: 15}
    - {type: role_ratio, id: armor, value: 10}
    - {type: role_ratio, id: infantry, value: 65}
    - {type: equipment_production_factor, id: artillery, value: 30}
    HSN:    # infantería de marina y flota
    - {type: equipment_production_factor, id: fighter, value: 15}
    - {type: role_ratio, id: armor, value: 5}
    # 2026-10-21 (pedido del usuario: "más polenta en marines"): 25 -> 35
    - {type: role_ratio, id: marines, value: 35}
    - {type: equipment_production_factor, id: convoy, value: 20}
    - {type: dockyard_to_military_factory_ratio, value: 60}
    NAS:    # montaña y cóndores
    - {type: role_ratio, id: armor, value: 8}
    - {type: role_ratio, id: mountaineers, value: 25}
    # 2026-10-11: los cóndores son lo suyo (más combate aéreo y ases)
    - {type: equipment_production_factor, id: fighter, value: 35}
    ASC:    # ejército móvil del Plan
    - {type: equipment_production_factor, id: armor, value: 15}
    - {type: role_ratio, id: armor, value: 15}
    - {type: role_ratio, id: mobile, value: 25}
    - {type: equipment_production_factor, id: motorized, value: 20}
    - {type: equipment_production_factor, id: fighter, value: 10}
    FCU:    # contratistas motorizados
    - {type: equipment_production_factor, id: armor, value: 15}
    - {type: role_ratio, id: armor, value: 15}
    - {type: role_ratio, id: mobile, value: 20}
    - {type: equipment_production_factor, id: motorized, value: 20}
    - {type: equipment_production_factor, id: fighter, value: 15}
    APF:    # milicias populares
    - {type: equipment_production_factor, id: motorized, value: 10}
    - {type: role_ratio, id: armor, value: 8}
    - {type: role_ratio, id: infantry, value: 70}
    - {type: equipment_production_factor, id: fighter, value: 10}

# -----------------------------------------------------------------------------
# Desembarcos (2026-10-21, pedido del usuario: "que la HSN mejore la calidad de
# las invasiones navales, la frecuencia y la lógica"). Cada plan de guerra del
# país (conquistar, prepararse o declarar contra X) suma un `invade` contra X:
# la IA del juego busca el desembarco contra quien ya quiere atacar, en vez de
# esperar a tener frontera. Si el juego no conoce el tipo, se omite con aviso.
# -----------------------------------------------------------------------------
invasions:
  src: user_request
  by_country: {HSN: 150, ZJP: 120}   # 2026-10-28: el Shogunato también desembarca
  from_types: [conquer, prepare_for_war, declare_war]

# -----------------------------------------------------------------------------
# Tope de flota de la IA (2026-10-02, partida a 2106: "esta cantidad de barcos
# construidos es ridícula"; el EFE tenía 710 y el SHD 678, casi todos
# destructores). La IA del juego llena todos los astilleros que tiene (el
# mínimo de 15_balance les da 10) y nunca para. Cuando una IA pasa su tope de
# barcos, sus astilleros pierden casi toda la producción hasta que baje.
# El jugador no tiene tope.
# -----------------------------------------------------------------------------
naval_cap:
  src: user_request
  default: 25
  by_country: {HSN: 120, FCU: 60, NRE: 50, ASC: 50, ZJP: 50}
  # -2 y no -1: las ideas y la industria les suman bonos de astillero
  modifiers: {industrial_capacity_dockyard: -2.0}
  name: {english: "Fleet at Capacity", spanish: "Flota completa"}

# -----------------------------------------------------------------------------
# Mando preparado (2026-10-11, pedido del usuario: "hacela mucho más competente,
# más desafiante y mejor preparada"). Solo para las ocho potencias y solo
# mientras las maneja la IA (el jugador no lo tiene): lo que a la IA del juego
# más le cuesta en 2100, sostener la producción, construir y abastecer
# ejércitos grandes. Se suma a la dificultad que elija el jugador.
# -----------------------------------------------------------------------------
ai_edge:
  src: user_request
  modifiers:
    production_factory_efficiency_gain_factor: 0.15
    production_factory_max_efficiency_factor: 0.05
    production_speed_buildings_factor: 0.10
    supply_consumption_factor: -0.10
    army_org_factor: 0.05
  name: {english: "Prepared Command", spanish: "Mando preparado"}

# -----------------------------------------------------------------------------
# Guerras contra la Anarquía vecina (2026-09-28: "todos comienzan en paz" y
# "más conflicto, sin battle royale en un año"). Cada meganación que toca una
# anarquía la quiere conquistar y se prepara desde el día uno; declara desde su
# fecha, con 12 divisiones o más y sin otra guerra abierta. Las fechas van
# escalonadas: primero las que ya peleaban (Roma, la Comuna), al final la FCU.
# -----------------------------------------------------------------------------
anarchy_wars:
  src: user_request
  conquer: 150
  prepare: 120
  antagonize: 60
  declare: 120
  divisions: 12
  declare_after:
    NRE: 2100.2.1
    ASC: 2100.3.1
    EFE: 2100.8.1
    APF: 2101.1.1
    SHD: 2101.4.1
    HSN: 2101.8.1
    NAS: 2102.1.1
    FCU: 2102.6.1
  # 2026-10-16 (pedido del usuario: "Roma y la ASC declaran SIEMPRE la guerra a
  # Emiratos y a Eurasia y siempre demasiado temprano; algún requisito previo
  # mayor"). Para la IA, además de la fecha: un ejército de verdad y el foco de
  # esa guerra terminado (o, si nunca lo toma, una fecha mucho más tarde). Sin
  # esto la IA no recibe el casus belli permanente ni el plan de conquistar y
  # declarar. El jugador sigue teniendo el casus belli desde el primer día.
  requires:
    NRE:
      ZWM:
        all:
        - {date_after: 2101.1.1}
        - {divisions_at_least: 24}
        - any:
          - {focus: NRE_el_ejercito_de_las_provincias}
          - {date_after: 2102.6.1}
      ZWE:
        all:
        - {date_after: 2102.1.1}
        - {divisions_at_least: 30}
        - any:
          - {focus: NRE_la_marcha_al_norte}
          - {not: {country_exists: ZWM}}
          - {date_after: 2103.6.1}
    ASC:
      ZWE:
        all:
        - {date_after: 2101.1.1}
        - {divisions_at_least: 24}
        - any:
          - {focus: ASC_la_liberacion_del_este}
          - {date_after: 2102.6.1}

# -----------------------------------------------------------------------------
# Guerras del destino (2026-10-10, pedido del usuario: "que la IA persiga más
# agresivamente sus objetivos finales"). Con el destino abierto y hasta
# proclamar la forma final: +50 de fábricas militares sobre civiles, y contra
# cada dueño de arranque de las regiones que pide la forma final (las de
# <TAG>_reclamar_el_destino): prepararse, conquistar, hostigar y declarar con
# 30 divisiones o más (sin otra guerra abierta, o con 50 o más).
# -----------------------------------------------------------------------------
destiny_wars:
  src: user_request
  military_ratio: 50
  prepare: 150
  conquer: 250
  antagonize: 60
  declare: 200
  divisions: 30
  divisions_two_fronts: 50

born_later: [ZSG, ZJP]   # nacen en la partida: sus planes se escriben igual

plans:
