# =============================================================================
# 2100 Meganations — IA de las potencias (2026-09-24)
# =============================================================================
# Cada plan se vuelve un bloque de common/ai_strategy/. Tipos validados contra
# los que usa el juego instalado; uno desconocido se descarta con aviso.
#
# defaults.satellites: cada señor protege a sus satélites y ellos lo apoyan.
# defaults.rivals: las rivalidades de 04_diplomacy se antagonizan.
# plans: a quién conquistar, cuándo prepararse y cuándo declarar.
# =============================================================================
defaults:
  satellites: {protect: 150, befriend: 100, support: 100}
  rivals: {antagonize: 30}
# -----------------------------------------------------------------------------
# IA militar (2026-09-27). Todos arrancan con 2 divisiones y sin investigar:
# la IA del juego base no sabe qué hacer en ese mundo. Acá se le dice qué
# tropas armar según la especialidad de cada potencia (13_military), qué
# investigar (las tecnologías que siguen en su especialidad) y cuánta
# industria poner en armas. Los tipos y los ids (infantry, armor...) se
# validan contra los que usa el juego instalado; los que no existen se omiten
# con aviso en el reporte.
# -----------------------------------------------------------------------------
military:
  src: user_decision
  research_value: 60
  peace:
  - {type: added_military_to_civilian_factory_ratio, value: 25}
  war:
  - {type: added_military_to_civilian_factory_ratio, value: 75}
  # 2026-09-27: "nadie investiga barcos". Todas investigan lo básico naval; la
  # HSN mucho más.
  naval_research:
    value: 25
    by_country: {HSN: 80, FCU: 40, NRE: 35}
    techs: [early_ship_hull_light, basic_ship_hull_light, basic_battery, basic_torpedo, improved_ship_hull_light,
            basic_ship_hull_submarine, basic_ship_hull_cruiser, basic_light_battery]
  by_country:
    EFE:    # blindados de Bioacero
    - {type: role_ratio, id: armor, value: 25}
    - {type: equipment_production_factor, id: armor, value: 25}
    NRE:    # legiones de infantería con artillería
    - {type: role_ratio, id: infantry, value: 60}
    - {type: equipment_production_factor, id: artillery, value: 20}
    SHD:    # la masa y la artillería del río
    - {type: role_ratio, id: infantry, value: 65}
    - {type: equipment_production_factor, id: artillery, value: 30}
    HSN:    # infantería de marina y flota
    - {type: role_ratio, id: marines, value: 25}
    - {type: dockyard_to_military_factory_ratio, value: 60}
    NAS:    # montaña y cóndores
    - {type: role_ratio, id: mountaineers, value: 25}
    - {type: equipment_production_factor, id: fighter, value: 20}
    ASC:    # ejército móvil del Plan
    - {type: role_ratio, id: mobile, value: 25}
    - {type: equipment_production_factor, id: motorized, value: 20}
    FCU:    # contratistas motorizados
    - {type: role_ratio, id: mobile, value: 20}
    - {type: equipment_production_factor, id: motorized, value: 20}
    APF:    # milicias populares
    - {type: role_ratio, id: infantry, value: 70}

plans:
- id: EFE_el_amazonas
  country: EFE
  lore: 'Tiene la justificación desde el primer día: prepara la guerra y declara cuando esté listo.'
  strategies:
  - {type: conquer, target: ZWB, value: 200}
  - {type: prepare_for_war, target: ZWB, value: 100}
- id: EFE_el_amazonas_declarar
  country: EFE
  lore: 'Declara solo con un ejército de verdad (2026-09-27): con 2 divisiones no se invade el Amazonas.'
  enable: {divisions_at_least: 12}
  strategies:
  - {type: declare_war, target: ZWB, value: 100}
- id: ASC_la_guerra_del_este
  country: ASC
  lore: 'Ya en guerra con Eurasia: empujar hasta el final.'
  strategies:
  - {type: conquer, target: ZWE, value: 200}
- id: NRE_la_reconquista_de_oriente
  country: NRE
  lore: Ya en guerra con los Emiratos.
  strategies:
  - {type: conquer, target: ZWM, value: 200}
- id: NRE_la_marcha_al_norte
  country: NRE
  lore: Terminado Oriente (o con el foco), las legiones miran a Eurasia.
  enable:
    any:
    - {focus: NRE_la_marcha_al_norte}
    - not: {country_exists: ZWM}
  strategies:
  - {type: conquer, target: ZWE, value: 150}
  - {type: prepare_for_war, target: ZWE, value: 100}
- id: SHD_el_indostan
  country: SHD
  lore: El Directorio quiere el Indostán; con Zhou lo quiere ya.
  strategies:
  - {type: conquer, target: ZWI, value: 100}
  - {type: prepare_for_war, target: ZWI, value: 50}
- id: SHD_la_crecida_hacia_el_sur
  country: SHD
  enable: {flag: SHD_zhou}
  strategies:
  - {type: conquer, target: ZWI, value: 200}
  - {type: prepare_for_war, target: ZWI, value: 100}
- id: SHD_la_crecida_declarar
  country: SHD
  enable: {flag: SHD_zhou, divisions_at_least: 16}
  strategies:
  - {type: declare_war, target: ZWI, value: 100}
- id: APF_los_emiratos
  country: APF
  lore: 'Del Sahel al Golfo: compite con Roma por los Emiratos.'
  strategies:
  - {type: conquer, target: ZWM, value: 75}
- id: APF_la_marcha_de_los_consejos
  country: APF
  enable: {flag: APF_diallo}
  strategies:
  - {type: conquer, target: ZWM, value: 200}
  - {type: prepare_for_war, target: ZWM, value: 100}
- id: APF_la_marcha_declarar
  country: APF
  enable: {flag: APF_diallo, divisions_at_least: 12}
  strategies:
  - {type: declare_war, target: ZWM, value: 100}
- id: NAS_la_selva_del_sol
  country: NAS
  lore: 'El Sol también quiere el Amazonas: compite con el EFE.'
  strategies:
  - {type: conquer, target: ZWB, value: 75}
- id: FCU_el_canal
  country: FCU
  lore: El Canal de Panamá está en manos de caudillos. Mal negocio.
  strategies:
  - {type: conquer, target: ZWB, value: 60}
- id: HSN_las_costas_del_indostan
  country: HSN
