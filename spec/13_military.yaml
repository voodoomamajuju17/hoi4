# =============================================================================
# 13_military.yaml — Arranque militar: tecnologías, ejército y equipo
# =============================================================================
# Pedido del usuario (2026-09-23): nadie arrancaba con ejército, equipo ni
# tecnologías. Todo lo de este archivo es INVENTADO para balance. Nada se
# escribe de memoria: los nombres de tecnologías, equipos y regimientos salen
# de la instalación del juego y el generador falla si alguno no existe.
#
# =============================================================================

# Investigación de arranque (pedido del usuario, 2026-09-25): nadie tiene
# nada investigado, salvo una especialidad por meganación: las primeras
# `techs_per_specialty` tecnologías de esa pestaña del árbol, en orden (padres
# primero, por año y posición; de un par excluyente, la primera). Satélites y
# Anarquía: nada. "Investigación naval" y "apoyo naval" cuentan como una sola
# (todas las pestañas que empiezan con "naval").
research:
  src: user_decision
  techs_per_specialty: 5
  # Lo mínimo para todos (meganaciones, satélites y Anarquía): fabricar
  # equipo de infantería y de apoyo. Se validan contra el árbol del juego.
  # 2026-09-29 (pedido del usuario): todos arrancan con trenes y camiones
  # (basic_train: equipo de tren 1; tech_trucks: camiones).
  base_techs: [infantry_weapons, tech_support, basic_train, tech_trucks]
  # Las meganaciones además pueden botar un destructor básico (se validan
  # contra el árbol; las que no existen en este juego se ignoran).
  meganation_techs: [early_ship_hull_light, basic_ship_hull_light, basic_battery,
                     # 2026-09-30: "nadie construye tanques": el tanque básico (con y sin No Step Back)
                     gwtank_chassis, gwtank,
                     # y el vehículo motorizado y el caza básico (sin BBA / con BBA)
                     motorised_infantry, early_fighter, iw_small_airframe]
  # 2026-09-30 ("que investiguen, fabriquen y creen unidades según su
  # individualidad"): lo que cada una necesita para armar SUS tropas. La IA
  # pide infantería de marina a la HSN y montaña al NAS (16_ai.yaml); sin la
  # tecnología no las podía crear. Ids con y sin DLC; los que no existen se
  # ignoran.
  country_techs:
    HSN: [marines, tech_marines, marines2]
    NAS: [tech_mountaineers, mountaineers, tech_mountaineers2]
    NRE: [tech_engineers, tech_recon, gw_artillery, interwar_artillery]
    SHD: [gw_artillery, interwar_artillery, interwar_antiair, interwar_antitank]
    APF: [tech_engineers, tech_military_police, tech_recon]
    EFE: [basic_light_tank_chassis, armor_tech_1, engine_tech_1]
    ASC: [mechanised_infantry, tech_signal_company, tech_recon]
    FCU: [tech_field_hospital, tech_logistics_company, mechanised_infantry]
  # especialidad -> alternativas de prefijos de pestaña; gana la primera que
  # exista. Las de los DLC primero (el reporte 2026-09-25 mostró que las
  # pestañas viejas armour_folder, air_techs_folder y naval_folder siguen en
  # los archivos pero no se ven con No Step Back, By Blood Alone y Man the Guns).
  folders:
    infantry: [[infantry]]
    support: [[support]]
    armor: [[nsb_armour], [armour, armor]]
    artillery: [[artillery]]
    naval: [[mtgnaval], [naval]]
    air: [[bba_air], [air]]
    engineering: [[electronics, engineering]]
    industry: [[industry]]
  specialty:
    NRE: infantry      # las legiones
    APF: support       # milicias, ingenieros, logística del corredor
    EFE: armor         # el Bioacero y la armadura viviente
    SHD: artillery     # la artillería del río, la masa
    HSN: naval         # la flota de alta mar
    NAS: air           # las alas del Sol, el cóndor
    ASC: engineering   # el cómputo
    FCU: industry      # las corporaciones

# Año de referencia del EQUIPO en depósito (no de la investigación): la mejor
# variante vanilla hasta ese año.
stockpile_year:
  src: invented
  meganation: 1942
  satellite: 1940
  anarchy: 1936

# Pedido del usuario (2026-09-25): se borran TODAS las unidades. Queda una
# guarnición de infantería básica en la capital: 2 divisiones por meganación
# (1 la HSN, que además tiene 3 destructores), 1 por satélite. La Anarquía
# tiene 3 milicias por país (militia.per_country). Nada de motorizados ni blindados:
# nadie tiene esas tecnologías.
army:
  src: user_decision
  garrison:
    template: basic_infantry
    meganation: 2
    satellite: 1
    overrides: { HSN: 1, YYG: 4, PTA: 3 }   # 2026-09-29: satélites del EFE más fuertes
  templates:
    basic_infantry:
      name: { english: "Basic Infantry", spanish: "Infantería Básica" }
      regiments: [infantry, infantry, infantry, infantry, infantry, infantry]
      support: []

# Milicias de la Anarquía: una cada `states_per_division` states de cada
# territorio contiguo, mínimo una por territorio (balance 2026-09-23: con una
# por territorio eran 29 para 233 states).
militia:
  states_per_division: 3.5
  per_country: 3      # 2026-09-26: 3 milicias por país de la Anarquía (con 1 los Emiratos caían en semanas)
  per_country_overrides:
    ZWM: 7            # 2026-09-27: los Emiratos seguían siendo fáciles; son la puerta de tres potencias
    ZWE: 7            # 2026-09-28: anarquías más fuertes; 2026-09-29: Eurasia un poco más (5 -> 7)
    ZWI: 5
    ZWB: 5            # 2026-09-29: Amazonas un poco más fuerte (3 -> 5)
    ZAN: 4            # (ya no se usa: ver per_territory_overrides)
  # 2026-09-29 (pedido del usuario): las Tierras Sin Ley están repartidas en
  # varios continentes y las 4 milicias quedaban todas en Costa de Marfil. Con
  # esto cada territorio contiguo tiene al menos `min`, y una más cada
  # `states_per_division` regiones.
  per_territory_overrides:
    ZAN: {min: 2, states_per_division: 2}

# -----------------------------------------------------------------------------
# Armada y aviación de arranque (pedido del usuario, 2026-09-23): se heredan
# las flotas y alas de 1936 según quién tenga la base, pero se borra el 90%.
#   - keep: fracción que sobrevive (barcos: uno de cada diez, repartido para
#     mantener la mezcla de tipos; aviones: 10% de cada ala).
#   - navies: SOLO estas facciones tienen flota. Las cuatro con más sentido
#     marítimo: la HSN (la Alta Mar, potencia naval), la FCU (dos océanos),
#     el NRE (el Mediterráneo) y la ASC (el Mar del Norte y el Báltico).
#     Satélites y Anarquía: sin flota.
#   - Aviones: todas las meganaciones y satélites que heredan alguno se
#     quedan con al menos min_planes. La Anarquía: cero.
# -----------------------------------------------------------------------------
forces:
  src: user_decision   # 2026-09-25: sin aviones; la HSN, 3 destructores heredados
  keep: 1.0
  # 2026-09-27: "nadie tiene marina". Destructores heredados para las potencias
  # con costa y flota en 1936; la HSN, la potencia naval, más que nadie.
  navies: [HSN, FCU, NRE, ASC, EFE, SHD, APF]
  ship_definition: destroyer
  max_ships: {HSN: 6, default: 2}
  air: false

stockpile:
  src: invented
  # Equipo en depósito por tipo de país (variante más nueva del arquetipo
  # hasta stockpile_year). No se puede fabricar sin la tecnología, pero sirve.
  per_kind:
    # 2026-10-03: con 4000 la IA ponía divisiones a entrenar sin equipo y las cancelaba
    meganation: { infantry_equipment: 10000, support_equipment: 800, artillery_equipment: 600 }
    satellite:  { infantry_equipment: 1200, support_equipment: 100 }
  # Convoyes: base + por IC, para que el comercio funcione desde el día uno.
  convoys: { equipment: convoy, base: 20, per_ic: 1.0 }

# -----------------------------------------------------------------------------
# Compensación industrial. El reporte de balance de 1.19.3 mostró al EFE con
# 2,9% de la industria del mundo contra 12,3% de la FCU, su enemigo natural.
# Se compensa con una idea nacional de arranque (ver 05_ideas.yaml:
# EFE_cubas_de_la_pampa), no con fábricas regaladas: las fábricas extra no
# entran en los slots de los states.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Doctrinas de arranque (2026-09-29, pedido del usuario): cada meganación
# arranca con una gran doctrina y una subdoctrina ya activas y algo de
# maestría; sus satélites comparten la del señor; la Anarquía comparte una.
# Sistema de doctrinas de 1.17+: los nombres se buscan en common/doctrines/
# del juego instalado. Para cada bloque se prueba `grand` y después las
# palabras de `grand_kw` dentro de `folder`; la subdoctrina sale de `sub`, o
# del track que contenga `track` y las palabras de `sub_kw`. El reporte lista
# las doctrinas del juego y cuál quedó para cada uno.
# -----------------------------------------------------------------------------
doctrines:
  src: user_request
  mastery: 100          # "ya iniciada": maestría de arranque en su subdoctrina
  blocs:
    # El Imperio Verde: guerra de movimiento con blindados (su especialidad)
    EFE: {folder: land, grand: [mobile_warfare], grand_kw: [mobile], track: armor, sub_kw: [blitz, armor, armour, tank]}
    # Roma: las legiones, infantería de choque en masa
    NRE: {folder: land, grand: [mass_assault], grand_kw: [mass], track: infantry, sub_kw: [shock, assault, legion]}
    # El Directorio: la artillería del río, fuego medido
    SHD: {folder: land, grand: [superior_firepower], grand_kw: [firepower], track: artillery, sub_kw: [siege, artillery, gun]}
    # La FCU: potencia de fuego comprada, apoyo motorizado
    FCU: {folder: land, grand: [superior_firepower], grand_kw: [firepower], track: support, sub_kw: [self_propelled, motor, support]}
    # La Comuna: el plan calculado por la red
    ASC: {folder: land, grand: [grand_battleplan, grand_battle_plan], grand_kw: [battle, plan], track: operation, sub_kw: [recon, plan, operation]}
    # La Federación: defensa en profundidad del continente
    APF: {folder: land, grand: [grand_battleplan, grand_battle_plan], grand_kw: [battle, plan], track: artillery, sub_kw: [anti_tank, defen, trench]}
    # La HSN: corsarios y cazadores de convoyes
    HSN: {folder: naval, grand: [trade_interdiction], grand_kw: [trade, interdiction, raid], track: screen, sub_kw: [raid, hunter, destroyer, screen]}
    # El Sol: el cielo de los Andes (aviación, su especialidad)
    NAS: {folder: air, grand: [battlefield_support], grand_kw: [battlefield, support], track: support, sub_kw: [close_air, ground, cas]}
    # La Anarquía: bandas, infiltración y oleadas
    anarchy: {folder: land, grand: [mass_assault], grand_kw: [mass], track: infantry, sub_kw: [infiltration, guerrilla, human_wave, wave]}

# -----------------------------------------------------------------------------
# Líneas de fuertes de arranque (2026-09-29): "fuertes en el NRE tipo línea
# Maginot con la ASC, pero solo una parte (lo más cercano a Italia)". Búnker
# en cada provincia de `owner` que toca a `facing`, solo en las regiones que
# en el juego eran de `near` y en las propias que las tocan (los Alpes: de
# Saboya a Eslovenia; la frontera con Alemania y Bélgica queda sin fuertes).
# -----------------------------------------------------------------------------
fort_lines:
  - {owner: NRE, facing: ASC, near: ITA, level: 5, src: user_request}

# -----------------------------------------------------------------------------
# Organizaciones industriales militares (OIM) propias (2026-09-30, pedido del
# usuario: "personalizalas"). tools/gen/emitters/mio.py copia cada OIM
# genérica del juego (tanques, artillería, infantería, vehículos, barcos,
# aviones) con el nombre de la potencia y la saca de las genéricas para las 8
# meganaciones: mismos rasgos, otro nombre. La categoría se reconoce por el id
# de la OIM genérica; las que no encajan quedan genéricas.
# Los 4 puntos de arranque: el reporte lista de dónde salen (diagnóstico).
# -----------------------------------------------------------------------------
mio:
  src: user_request
  categories:            # palabra en el id de la OIM genérica -> categoría
    tank: [tank, armor]
    artillery: [artillery]
    infantry: [infantry, small_arms, weapon]
    motorized: [motor, vehicle, truck, mechanized]
    submarine: [submarine]
    capital: [capital, heavy_ship, battleship, carrier]
    escort: [escort, screen, destroyer, light_ship, ship]
    heavy_air: [heavy_air, heavy_aircraft, bomber, heavy]
    light_air: [light_air, fighter, aircraft, air]
  names:
    EFE: {tank: Bioforjas de la Pampa, artillery: Cañones del Monte, infantry: Arsenal Verde de Gaia, motorized: Rodados Pampeanos, escort: Astilleros del Plata, capital: Astilleros Imperiales de Bahía Blanca, submarine: Sumergibles del Atlántico Sur, light_air: Aeroforjas Cóndor, heavy_air: Bombarderos del Chaco}
    FCU: {tank: Meridian Armor Systems, artillery: Meridian Ordnance, infantry: Halvorsen-Ito Small Arms, motorized: Castellane Mobility, escort: Obsidian Coastal Yards, capital: Great Lakes Capital Yards, submarine: Deepwater Contractors, light_air: Skyline Aerospace, heavy_air: Obsidian Heavy Aero}
    ASC: {tank: Kombinat Panzerwerk 7, artillery: Kombinat de Artillería del Ruhr, infantry: Arsenal Colectivo de Lieja, motorized: Autofabrik Kollektiv, escort: Astillero Popular de Gdansk, capital: Astilleros del Báltico Rojo, submarine: Sumergibles del Mar del Norte, light_air: Aerokombinat Automático, heavy_air: Bombarderos del Plan}
    HSN: {tank: Kaiyo Armor Works, artillery: Straits Ordnance, infantry: Harbor Arms, motorized: Port Logistics Vehicles, escort: Singapore Escort Yards, capital: Yokosuka Capital Yards, submarine: Malacca Deepworks, light_air: Pacific Wing, heavy_air: Typhoon Heavy Aero}
    NAS: {tank: Forjas del Inti, artillery: Cañones de la Cordillera, infantry: Armería de Cusco, motorized: Rodados del Altiplano, escort: Astillero del Callao, capital: Astilleros de Guayaquil, submarine: Sumergibles del Pacífico Sur, light_air: Cóndores del Sol, heavy_air: Aeronaves del Titicaca}
    SHD: {tank: Talleres del Río Amarillo, artillery: Artillería de las Compuertas, infantry: Armería del Directorio, motorized: Vehículos del Gran Canal, escort: Astilleros de Shanghái, capital: Astilleros de Dalian, submarine: Sumergibles del Mar de China, light_air: Alas de Jade, heavy_air: Bombarderos del Yangtsé}
    APF: {tank: Blindados de Katanga, artillery: Artillería del Sahel, infantry: Armería de los Consejos, motorized: Vehículos Transafricanos, escort: Astilleros de Dakar, capital: Astilleros de Durban, submarine: Sumergibles del Golfo de Guinea, light_air: Cazas del Sahel, heavy_air: Aeronaves del Rift}
    NRE: {tank: Blindados Legio, artillery: Tormenta de Marte, infantry: Armería Pretoriana, motorized: Carros de Vulcano, escort: Astilleros de Ostia, capital: Astilleros de Tarento, submarine: Sumergibles de Neptuno, light_air: Águilas de Júpiter, heavy_air: Rayos de Júpiter}
