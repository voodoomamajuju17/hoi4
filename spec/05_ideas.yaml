        english: The planning system assigns its capacity to war. Level 1 of 3, set by the Commune's total compute.
        spanish: El sistema de planificación asigna su capacidad a guerra. Nivel 1 de 3, según el cómputo total de la Comuna.
      modifiers: {army_attack_factor: 0.03, army_defence_factor: 0.03}
      src: user_design
    - id: ASC_computo_guerra_2
      name: {english: 'Compute: War II', spanish: 'Cómputo: Guerra II'}
      desc:
        english: The planning system assigns its capacity to war. Level 2 of 3, set by the Commune's total compute.
        spanish: El sistema de planificación asigna su capacidad a guerra. Nivel 2 de 3, según el cómputo total de la Comuna.
      modifiers: {army_attack_factor: 0.06, army_defence_factor: 0.06}
      src: user_design
    - id: ASC_computo_guerra_3
      name: {english: 'Compute: War III', spanish: 'Cómputo: Guerra III'}
      desc:
        english: The planning system assigns its capacity to war. Level 3 of 3, set by the Commune's total compute.
        spanish: El sistema de planificación asigna su capacidad a guerra. Nivel 3 de 3, según el cómputo total de la Comuna.
      modifiers: {army_attack_factor: 0.1, army_defence_factor: 0.1}
      src: user_design
    - id: ASC_transparencia
      name: {english: Transparency of the Plan, spanish: Transparencia del Plan}
      desc:
        english: Every allocation is public. Every citizen can read why they got what they got.
        spanish: Cada asignación es pública. Cualquier ciudadano puede leer por qué recibió lo que recibió.
      modifiers: {political_power_gain: 0.1, stability_factor: 0.05}
      src: user_design
    - id: ASC_derecho_a_no_trabajar
      name: {english: The Right Not to Work, spanish: El Derecho a No Trabajar}
      desc:
        english: The machines work. The citizens may, if they want to.
        spanish: Las máquinas trabajan. Los ciudadanos pueden, si quieren.
      modifiers: {stability_factor: 0.1, consumer_goods_factor: 0.05}
      src: user_design
    - id: ASC_paz_de_la_abundancia
      name: {english: The Peace of Plenty, spanish: La Paz de la Abundancia}
      desc:
        english: Nobody in the Commune goes without. The neighbours notice.
        spanish: En la Comuna a nadie le falta nada. Los vecinos lo notan.
      modifiers: {stability_factor: 0.05, war_support_factor: -0.05, trade_opinion_factor: 0.2}
      src: user_design
    - id: ASC_comuna_de_los_humanos
      name: {english: The Commune of Humans, spanish: La Comuna de los Humanos}
      desc:
        english: The Council kept the keys. The machine serves; people decide.
        spanish: El Consejo se quedó con las llaves. La máquina sirve; la gente decide.
      modifiers: {stability_factor: 0.1, political_power_gain: 0.1, research_speed_factor: 0.05}
      src: user_design
    - id: ASC_singularidad
      name: {english: The Singularity of the Plan, spanish: La Singularidad del Plan}
      desc:
        english: 'HUMAN QUORUM: NOT REQUIRED. Politics is latency, and latency has been removed.'
        spanish: 'QUÓRUM HUMANO: NO REQUERIDO. La política es latencia, y la latencia fue eliminada.'
      modifiers:
        political_power_gain: -0.4
        research_speed_factor: 0.1
        industrial_capacity_factory: 0.1
        stability_factor: 0.15
      src: user_design
    - id: ASC_espiritu_optimizacion_total
      name: {english: Total Optimisation, spanish: Optimización Total}
      desc:
        english: Every process is measured, every waste removed. Including some people.
        spanish: Cada proceso se mide, cada desperdicio se elimina. Incluidas algunas personas.
      modifiers: {production_speed_buildings_factor: 0.15, consumer_goods_factor: -0.05}
      src: user_design
    - id: ASC_espiritu_ejercito_sin_bajas
      name: {english: The Army Without Casualties, spanish: El Ejército sin Bajas}
      desc:
        english: Drones do not come home in coffins. They do not come home at all without supply.
        spanish: Los drones no vuelven en cajones. Sin suministro, no vuelven de ninguna forma.
      modifiers: {army_attack_factor: 0.1, army_defence_factor: 0.05, experience_gain_army: 0.1}
      src: user_design
    - id: ASC_plan_total
      name: {english: The Total Plan, spanish: El Plan Total}
      desc:
        english: Every factory, every quota, every hour, planned.
        spanish: Cada fábrica, cada cuota, cada hora, planificada.
      modifiers: {production_speed_buildings_factor: 0.1, industrial_capacity_factory: 0.05}
      src: user_design
    - id: ASC_mercado_de_computo
      name: {english: The Compute Credit Market, spanish: El Mercado de Créditos de Cómputo}
      desc:
        english: Compute credits circulate like money. The Commune trades in thought.
        spanish: Los créditos de cómputo circulan como dinero. La Comuna comercia con pensamiento.
      modifiers: {research_speed_factor: 0.05, consumer_goods_factor: -0.05, trade_opinion_factor: 0.15}
      src: user_design
    - id: ASC_fabricas_a_oscuras
      name: {english: Lights-Out Factories, spanish: Fábricas a Oscuras}
      desc:
        english: Factories that need no light, because nobody works inside.
        spanish: Fábricas que no necesitan luz, porque adentro no trabaja nadie.
      modifiers: {industrial_capacity_factory: 0.1}
      src: user_design
    - id: ASC_enjambre
      name: {english: The Swarm Doctrine, spanish: La Doctrina del Enjambre}
      desc:
        english: A hundred small machines instead of one big one.
        spanish: Cien máquinas chicas en vez de una grande.
      modifiers: {army_org_factor: 0.05, army_attack_factor: 0.05}
      src: user_design
    - id: ASC_flota_del_norte
      name: {english: The Northern Fleet, spanish: La Flota del Norte}
      desc:
        english: Autonomous submarines hold the North Sea and the Baltic.
        spanish: Submarinos autónomos controlan el Mar del Norte y el Báltico.
      modifiers: {industrial_capacity_dockyard: 0.1}
      src: user_design
    - id: ASC_consejo_ampliado
      name: {english: The Enlarged Council, spanish: El Consejo Ampliado}
      desc:
        english: The Baltic and Albion send delegates to the lottery.
        spanish: El Báltico y Albión mandan delegados al sorteo.
      modifiers: {political_power_gain: 0.05, stability_factor: 0.05}
      src: user_design
    - id: ASC_sobrecarga
      name: {english: Controlled Overload, spanish: Sobrecarga Controlada}
      desc:
        english: The datacenters run hot. Everything is faster, until something melts.
        spanish: Los datacenters funcionan al rojo. Todo va más rápido, hasta que algo se funde.
      modifiers: {research_speed_factor: 0.1, production_speed_buildings_factor: 0.1, stability_factor: -0.05}
      src: user_design
    see: Q030

  FCU:
    coverage: full_v1   # "Las Ocho Potencias" (2026-09-23)
    starting_ideas:
      - id: FCU_directorio_de_las_cuatro
        name: { english: "The Board of Four", spanish: "El Directorio de las Cuatro" }
        desc:
          english: "Four corporations share one board. Every law is a contract, and every contract has a loser."
          spanish: "Cuatro corporaciones comparten un directorio. Cada ley es un contrato, y cada contrato tiene un perdedor."
        modifiers: { political_power_gain: -0.1, production_speed_buildings_factor: 0.1 }
        removable: false
    focus_ideas:
      - id: FCU_sinergia_del_directorio
        name: { english: "Board Synergy", spanish: "Sinergia del Directorio" }
        desc:
          english: "The four corporations are balanced. For once, nobody is suing anybody."
          spanish: "Las cuatro corporaciones están equilibradas. Por una vez, nadie le hace juicio a nadie."
        modifiers: { industrial_capacity_factory: 0.1, research_speed_factor: 0.05, consumer_goods_factor: -0.05 }
      - id: FCU_guerra_corporativa
        name: { english: "Corporate War", spanish: "Guerra Corporativa" }
        desc:
          english: "One of the Four is drowning and has decided to take the others down with it: leaks, sabotage, outsourced strikes and lawsuits."
          spanish: "Una de las Cuatro se está hundiendo y decidió llevarse a las otras puesta: filtraciones, sabotajes, huelgas tercerizadas y demandas."
        modifiers: { stability_factor: -0.1, industrial_capacity_factory: -0.1, political_power_gain: -0.15 }
      - id: FCU_ventanilla_obsidian
        name: { english: "The Obsidian Window", spanish: "La Ventanilla de Obsidian" }
        desc:
          english: "Obsidian Ledger opened its data vaults to the Union's laboratories. The price will show up later."
          spanish: "Obsidian Ledger abrió sus bóvedas de datos a los laboratorios de la Unión. El precio aparece después."
        modifiers: { research_speed_factor: 0.05, political_power_gain: 0.1 }
      - id: FCU_carteras_repartidas
        name: { english: "Portfolios Assigned", spanish: "Carteras Repartidas" }
        desc:
          english: "Each corporation runs its own ministry. Nobody runs the government."
          spanish: "Cada corporación maneja su ministerio. Nadie maneja el gobierno."
        modifiers: { political_power_gain: 0.15 }
      - id: FCU_mesa_redonda
        name: { english: "The Round Table", spanish: "La Mesa Redonda" }
        desc:
          english: "Castellane's masterpiece: a board where no chair is higher than another."
          spanish: "La obra maestra de Castellane: un directorio donde ninguna silla es más alta que otra."
        modifiers: { stability_factor: 0.1, industrial_capacity_factory: 0.05, research_speed_factor: 0.05 }
      - id: FCU_turbulencia_bursatil
        name: { english: "Market Turbulence", spanish: "Turbulencia Bursátil" }
        desc:
          english: "A hostile takeover of an entire country. The markets are not taking it calmly."
          spanish: "Una adquisición hostil de un país entero. Los mercados no se lo toman con calma."
        modifiers: { stability_factor: -0.15, political_power_gain: -0.1 }
      - id: FCU_raciones_meridian
        name: { english: "Meridian Rations", spanish: "Raciones Meridian" }
        desc:
          english: "Halvorsen-Ito's farms now feed the army first. The supermarkets can wait."
          spanish: "Las granjas de Halvorsen-Ito ahora alimentan primero al ejército. Los supermercados pueden esperar."
        modifiers: { stability_factor: -0.05, war_support_factor: 0.05 }
      - id: FCU_meridian_unica
        name: { english: "One Company", spanish: "Una Sola Compañía" }
        desc:
          english: "There is no Board any more. There is Meridian, and there are its subsidiaries."
          spanish: "Ya no hay Directorio. Está Meridian, y están sus subsidiarias."
        modifiers: { production_speed_arms_factory_factor: 0.2, consumer_goods_factor: 0.05, stability_factor: -0.05 }
      - id: FCU_dividendo_de_guerra
        name: { english: "The War Dividend", spanish: "El Dividendo de Guerra" }
        desc:
          english: "Meridian does not invade countries. It makes vertical acquisitions with artillery, and the shareholders expect results every quarter."
          spanish: "Meridian no invade países. Hace adquisiciones verticales con artillería, y los accionistas esperan resultados cada trimestre."
        modifiers: { war_support_factor: 0.1, political_power_gain: 0.1 }
      - id: FCU_caida_de_dividendos
        name: { english: "Falling Dividends", spanish: "Caída de Dividendos" }
        desc:
          english: "A quarter without war. The shareholders are selling, and a militarised economy has nothing else to sell them."
          spanish: "Un trimestre sin guerra. Los accionistas venden, y una economía militarizada no tiene otra cosa para ofrecerles."
        modifiers: { stability_factor: -0.1, political_power_gain: -0.2 }
      - id: FCU_contratistas_globales
        name: { english: "Global Contractors", spanish: "Contratistas Globales" }
        desc:
          english: "Meridian rents its divisions to anyone who pays. The veterans come home with experience and invoices."
          spanish: "Meridian alquila sus divisiones a quien pague. Los veteranos vuelven con experiencia y facturas."
        modifiers: { experience_gain_army: 0.1, war_support_factor: 0.05 }
      - id: FCU_dividendo_civil
        name: { english: "The Civil Dividend", spanish: "El Dividendo Civil" }
        desc:
          english: "Every citizen holds a share. A small one."
          spanish: "Cada ciudadano tiene una acción. Una chiquita."
        modifiers: { consumer_goods_factor: -0.05, stability_factor: 0.05 }
      - id: FCU_economia_de_la_abundancia
        name: { english: "The Economy of Plenty", spanish: "La Economía de la Abundancia" }
        desc:
          english: "Shelves full, factories humming, and a population too comfortable to ask who owns what."
          spanish: "Góndolas llenas, fábricas en marcha y una población demasiado cómoda para preguntar de quién es cada cosa."
        modifiers: { consumer_goods_factor: -0.1, stability_factor: 0.1, industrial_capacity_factory: 0.05 }
      - id: FCU_mercado_de_exportacion
        name: { english: "The Export Market", spanish: "El Mercado de Exportación" }
        desc:
          english: "Half the continent buys American again. The other half is being sold to."
          spanish: "Medio continente vuelve a comprar americano. Al otro medio le están vendiendo."
        modifiers: { trade_opinion_factor: 0.2, production_speed_buildings_factor: 0.05 }
      - id: FCU_monopolio_hidrico
        name: { english: "The Water Monopoly", spanish: "El Monopolio del Agua" }
        desc:
          english: "Castellane owns the desalination plants, and the desalination plants own everyone."
          spanish: "Castellane es dueña de las desalinizadoras, y las desalinizadoras son dueñas de todos."
        modifiers: { political_power_gain: 0.1, trade_opinion_factor: -0.1 }
      - id: FCU_imperio_del_agua
        name: { english: "The Water Empire", spanish: "El Imperio del Agua" }
        desc:
          english: "No army needed. Close the valve and wait."
          spanish: "No hace falta un ejército. Se cierra la válvula y se espera."
        modifiers: { political_power_gain: 0.15, stability_factor: 0.05, production_speed_buildings_factor: 0.1 }
      - id: FCU_robotica_industrial
        name: { english: "Industrial Robotics", spanish: "Robótica Industrial" }
        desc:
          english: "Meridian's assembly arms work three shifts and never unionise."
          spanish: "Los brazos de ensamble de Meridian trabajan tres turnos y nunca se sindicalizan."
        modifiers: { production_speed_buildings_factor: 0.1, industrial_capacity_factory: 0.05 }
      - id: FCU_entrenamiento_corporativo
        name: { english: "Corporate Training", spanish: "Entrenamiento Corporativo" }
        desc:
          english: "Performance reviews, quarterly targets and live ammunition."
          spanish: "Evaluaciones de desempeño, objetivos trimestrales y munición real."
        modifiers: { army_org_factor: 0.05, experience_gain_army: 0.1 }
      - id: FCU_respuesta_rapida
        name: { english: "Rapid Response Divisions", spanish: "Divisiones de Respuesta Rápida" }
        desc:
          english: "Few divisions, very expensive, always first."
          spanish: "Pocas divisiones, muy caras, siempre primeras."
        modifiers: { army_attack_factor: 0.05, army_defence_factor: 0.05 }
      - id: FCU_dos_oceanos
        name: { english: "Two Oceans", spanish: "Dos Océanos" }
        desc:
          english: "The Union faces both oceans, and both fleets answer to the same board."
          spanish: "La Unión mira a los dos océanos, y las dos flotas responden al mismo directorio."
        modifiers: { industrial_capacity_dockyard: 0.1, war_support_factor: 0.05 }
      - id: FCU_arbitraje_corporativo
        name: { english: "Corporate Arbitration", spanish: "Arbitraje Corporativo" }
        desc:
          english: "A permanent court where the Four settle their feuds before they reach the streets."
          spanish: "Un tribunal permanente donde las Cuatro arreglan sus peleas antes de que lleguen a la calle."
        modifiers: { political_power_gain: 0.05, stability_factor: 0.05 }
      - id: FCU_punto_de_equilibrio
        name: { english: "The Balance Point", spanish: "El Punto de Equilibrio" }
        desc:
          english: "The Board has learned to move together. It took a century and four lawyers per citizen."
          spanish: "El Directorio aprendió a moverse junto. Costó un siglo y cuatro abogados por ciudadano."
        modifiers: { stability_factor: 0.05, political_power_gain: 0.1 }
    see: Q030
  HSN:
    coverage: full_v1   # "Las Ocho Potencias" (2026-09-23)
    focus_ideas:
    - id: HSN_red_nodos_1
      name: {english: The Node Network I, spanish: La Red de Nodos I}
      desc:
        english: 'Two or more nodes: convoys insured, routes secured.'
        spanish: 'Dos nodos o más: convoyes asegurados, rutas protegidas.'
      modifiers: {trade_opinion_factor: 0.1, industrial_capacity_dockyard: 0.05}
      src: user_design
    - id: HSN_red_nodos_2
      name: {english: The Node Network II, spanish: La Red de Nodos II}
      desc:
        english: 'Four or more nodes: tolls pay for factories nobody has to build.'
        spanish: 'Cuatro nodos o más: los peajes pagan fábricas que nadie tiene que construir.'
      modifiers: {trade_opinion_factor: 0.15, industrial_capacity_dockyard: 0.1, industrial_capacity_factory: 0.05}
      src: user_design
    - id: HSN_red_nodos_3
      name: {english: The Node Network III, spanish: La Red de Nodos III}
      desc:
        english: 'Six or more nodes: every cargo manifest in Asia crosses the clearing house.'
        spanish: 'Seis nodos o más: cada manifiesto de carga de Asia pasa por la cámara de compensación.'
      modifiers:
        trade_opinion_factor: 0.2
        industrial_capacity_dockyard: 0.1
        industrial_capacity_factory: 0.1
        research_speed_factor: 0.05
      src: user_design
    - id: HSN_camara_mundial
      name: {english: The World Clearing House, spanish: La Cámara Mundial de Compensación}
      desc:
        english: All eight nodes. Half the world's cargo pays the High Seas before it arrives.
        spanish: Los ocho nodos. La mitad de la carga del mundo le paga a la Alta Mar antes de llegar.
      modifiers:
        trade_opinion_factor: 0.3
        industrial_capacity_dockyard: 0.15
        industrial_capacity_factory: 0.1
        research_speed_factor: 0.05
        political_power_gain: 0.1
      src: user_design
    - id: HSN_nodo_perdido
      name: {english: A Node Lost, spanish: Un Nodo Perdido}
      desc:
        english: A strait has fallen. The insurers panic, and so do the captains.
        spanish: Cayó un estrecho. Las aseguradoras entran en pánico, y los capitanes también.
      modifiers: {stability_factor: -0.1, political_power_gain: -0.15}
      src: user_design
    - id: HSN_espiritu_neutralidad_armada
      name: {english: Armed Neutrality, spanish: Neutralidad Armada}
      desc:
        english: The High Seas fight nobody's wars, and sink anyone who tries to make them.
        spanish: La Alta Mar no pelea las guerras de nadie, y hunde al que intente obligarla.
      modifiers: {army_defence_factor: 0.05, industrial_capacity_dockyard: 0.05}
      src: user_design
    - id: HSN_arbitraje
      name: {english: High Seas Arbitration, spanish: El Arbitraje de Alta Mar}
      desc:
        english: Every maritime dispute in Asia is settled in the clearing house, for a fee.
        spanish: Cada disputa marítima de Asia se resuelve en la cámara de compensación, con arancel.
      modifiers: {political_power_gain: 0.1, stability_factor: 0.05}
      src: user_design
    - id: HSN_tratado_estrechos
      name: {english: The Treaty of the Straits, spanish: El Tratado de los Estrechos}
      desc:
        english: The straits are neutral, and the High Seas define neutral.
        spanish: Los estrechos son neutrales, y la Alta Mar define qué es neutral.
      modifiers: {trade_opinion_factor: 0.15, political_power_gain: 0.05}
      src: user_design
    - id: HSN_espiritu_capitanes_electos
      name: {english: Elected Captains, spanish: Capitanes Electos}
      desc:
        english: Every ship votes its captain. Every captain can be voted off.
        spanish: Cada barco elige a su capitán. Cada capitán puede ser votado afuera.
      modifiers: {war_support_factor: 0.1, stability_factor: -0.05}
      src: user_design
    - id: HSN_hermandad
      name: {english: The Brotherhood of the Deck, spanish: La Hermandad de la Cubierta}
      desc:
        english: No tolls, no insurers, no masters. The sea belongs to whoever sails it.
        spanish: Sin peajes, sin aseguradoras, sin patrones. El mar es de quien lo navega.
      modifiers: {war_support_factor: 0.1, army_attack_factor: 0.05, industrial_capacity_dockyard: 0.1}
      src: user_design
    - id: HSN_bodegas_llenas
      name: {english: Full Holds, spanish: Bodegas Llenas}
      desc:
        english: The loot is in the warehouses. For a while, nothing is scarce.
        spanish: El botín está en los galpones. Por un tiempo, nada escasea.
      modifiers: {local_resources_factor: 0.15}
      src: user_design
    - id: HSN_puerto_libre
      name: {english: The Free Port, spanish: El Puerto Libre}
      desc:
        english: No tariffs, only volume. Everything passes through the High Seas.
        spanish: Sin aranceles, solo volumen. Todo pasa por la Alta Mar.
      modifiers: {trade_opinion_factor: 0.25, industrial_capacity_factory: 0.05}
      src: user_design
    - id: HSN_peaje_estrechos
      name: {english: The Straits Toll, spanish: El Peaje de los Estrechos}
      desc:
        english: Every ship pays. Nobody likes it; everybody pays.
        spanish: Cada barco paga. A nadie le gusta; todos pagan.
      modifiers: {political_power_gain: 0.15, trade_opinion_factor: -0.15}
      src: user_design
    - id: HSN_espiritu_ciudades_flotantes
      name: {english: Floating Cities, spanish: Ciudades Flotantes}
      desc:
        english: Whole districts built on hulls. The nation is wherever its docks are.
        spanish: Barrios enteros construidos sobre cascos. La nación está donde estén sus muelles.
      modifiers: {industrial_capacity_dockyard: 0.1, production_speed_buildings_factor: 0.1}
      src: user_design
    - id: HSN_infanteria_de_cubierta
      name: {english: Deck Infantry, spanish: Infantería de Cubierta}
      desc:
        english: Marines who fight from the ship to the beach and back.
        spanish: Infantes que pelean del barco a la playa y de vuelta.
      modifiers: {army_attack_factor: 0.05, army_org_factor: 0.05}
      src: user_design
    - id: HSN_armada_de_alta_mar
      name: {english: The High Seas Navy, spanish: La Armada de Alta Mar}
      desc:
        english: The largest fleet of the century answers to a clearing house.
        spanish: La flota más grande del siglo le responde a una cámara de compensación.
      modifiers: {industrial_capacity_dockyard: 0.1, war_support_factor: 0.05}
      src: user_design
    see: Q030
