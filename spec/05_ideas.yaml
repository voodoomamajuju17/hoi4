# =============================================================================
# 05_ideas.yaml — Ideas nacionales (national spirits)
# =============================================================================
# El documento NO contiene ninguna idea nacional en términos de HOI4: no hay
# nombres de spirits, ni modificadores, ni valores.
#
# Lo que sí hay es prosa de régimen bastante densa para el EFE (§3.2) y para la
# ASC (§4). De ahí derivé las ideas del EFE, que son las que necesita la
# vertical slice.
#
# TODOS los valores numéricos de este archivo son INVENTADOS. El doc no da ni
# uno. Son puntos de partida para balancear, no diseño recuperado.
# =============================================================================

value_policy:
  all_modifier_values_are: invented
  why: "HOI4 no acepta una idea sin modificadores. El doc no aporta números."
  status: "Placeholder de balance. Esperá tocarlos todos."
  see: Q029

# =============================================================================
countries:

  # ---------------------------------------------------------------------------
  EFE:
    coverage: derived_from_prose
    starting_ideas:

      - id: EFE_mandato_verde
        name:
          english: "The Green Mandate"
          spanish: "El Mandato Verde"
        name_src: invented
        concept_src: canon
        doc_basis: >
          §3.2 — "La legitimidad del régimen proviene de presentar la
          supervivencia ecológica como un mandato superior a los derechos
          individuales y a la política convencional."
        desc:
          english: >
            Ecological survival is proclaimed above individual rights and
            conventional politics. Obedience is not asked for; it is assumed.
          spanish: >
            La supervivencia ecológica se proclama por encima de los derechos
            individuales y de la política convencional. La obediencia no se
            pide; se da por supuesta.
        modifiers:
          political_power_gain: 0.10
          stability_factor: 0.05
          democratic_drift: -0.02
        modifiers_src: invented
        removable: false

      - id: EFE_cubas_de_la_pampa
        name:
          english: "The Vats of the Pampas"
          spanish: "Las Cubas de la Pampa"
        name_src: invented
        desc:
          english: "The Empire is small next to the Union or the Commune. What it lacks in factories it makes up with the vats: every workshop grows its own tools, every depot its own walls."
          spanish: "El Imperio es chico al lado de la Unión o de la Comuna. Lo que le falta en fábricas lo compensa con las cubas: cada taller cultiva sus propias herramientas, cada depósito sus propias paredes."
        modifiers:
          industrial_capacity_factory: 0.15
          production_speed_buildings_factor: 0.15
        modifiers_src: invented
        why: >
          Compensación industrial: en 1.19.3 el EFE arranca con 2,9% de la IC
          del mundo contra 12,3% de la FCU (balance.txt). Ver 13_military.yaml.
        removable: false

    # Las tres de abajo NO arrancan puestas: las dan los focos de Restauración
    # Total (cambio aprobado con Q031). Antes el foco "otorgaba" una idea que el
    # país ya tenía desde el día uno.
    focus_ideas:

      - id: EFE_conservacion_coercitiva
        granted_by: EFE_reforestacion_obligatoria
        name:
          english: "Coercive Conservation"
          spanish: "Conservación Coercitiva"
        name_src: inferred
        name_note: "'conservación coercitiva' es literal del doc; el título es mío."
        concept_src: canon
        doc_basis: >
          §3.2 — "Reforestación y restauración ambiental aplicadas de forma
          obligatoria" + "Militarización de la protección de recursos y
          territorios."
        desc:
          english: >
            Reforestation and ecological restoration are compulsory labour.
            The Green Guard enforces the treeline as it would a border.
          spanish: >
            La reforestación y la restauración ecológica son trabajo obligatorio.
            La Guardia Verde custodia la línea de árboles como si fuera una frontera.
        modifiers:
          production_speed_infrastructure_factor: 0.10
          consumer_goods_factor: 0.05
        modifiers_src: invented
        removable: false
        note: >
          El coste en bienes de consumo es intencional: el doc insiste en que
          cada sistema debe crear "ventajas claras y también cuellos de botella
          propios" (§1).

      - id: EFE_autarquia_estrategica
        granted_by: EFE_autosuficiencia
        name:
          english: "Strategic Autarky"
          spanish: "Autarquía Estratégica"
        name_src: inferred
        concept_src: canon
        doc_basis: >
          §3.2 — "Tendencia a la autosuficiencia y a tratar la dependencia
          económica como vulnerabilidad estratégica."
        desc:
          english: >
            Economic dependence is treated as a strategic vulnerability.
            The Empire would rather build it badly than buy it well.
          spanish: >
            La dependencia económica se trata como una vulnerabilidad estratégica.
            El Imperio prefiere fabricarlo mal antes que comprarlo bien.
        modifiers:
          trade_opinion_factor: -0.25
          local_resources_factor: 0.10
        modifiers_src: invented
        removable: false

      - id: EFE_control_poblacional
        granted_by: EFE_cuotas_de_consumo
        name:
          english: "Population and Consumption Control"
          spanish: "Control de Población y Consumo"
        name_src: inferred
        concept_src: canon
        doc_basis: "§3.2 — 'Control de población y consumo como parte del proyecto estatal.'"
        desc:
          english: >
            Births, calories and kilometres are all allocated by the same
            ministry. The population is a variable to be managed.
          spanish: >
            Los nacimientos, las calorías y los kilómetros los asigna el mismo
            ministerio. La población es una variable a administrar.
        modifiers:
          consumer_goods_factor: -0.10
          monthly_population: -0.15
        modifiers_src: invented
        removable: false
        note: >
          Trade-off deliberado: menos bienes de consumo (bueno) a cambio de
          menos crecimiento poblacional (malo a largo plazo).

    # Ideas de las rutas políticas, económica y militar (2026-09-23).
      - id: EFE_trono_del_bosque
        granted_by: EFE_dinastia_verde
        name:
          english: "The Throne of the Forest"
          spanish: "El Trono del Bosque"
        name_src: invented
        desc:
          english: "The crown is hereditary now. The Empire will outlive its Emperor, and everyone knows who comes next."
          spanish: "La corona ahora es hereditaria. El Imperio va a sobrevivir a su Emperador, y todos saben quién sigue."
        modifiers:
          political_power_gain: 0.1
          stability_factor: 0.05
        modifiers_src: invented
        removable: false

      - id: EFE_trono_eterno
        granted_by: EFE_emperador_de_la_tierra
        name:
          english: "The Eternal Throne"
          spanish: "El Trono Eterno"
        name_src: invented
        desc:
          english: "Aurelio IV is no longer a ruler but a symbol: the Earth given a face and a crown."
          spanish: "Aurelio IV ya no es un gobernante sino un símbolo: la Tierra con cara y corona."
        modifiers:
          political_power_gain: 0.15
          stability_factor: 0.1
          war_support_factor: 0.05
        modifiers_src: invented
        removable: false

      - id: EFE_estado_guarnicion
        granted_by: EFE_la_guardia_manda
        name:
          english: "The Garrison State"
          spanish: "El Estado Guarnición"
        name_src: invented
        desc:
          english: "The Green Guard sits at every ministry table. Orders come faster; arguments come never."
          spanish: "La Guardia Verde se sienta en la mesa de cada ministerio. Las órdenes llegan más rápido; las discusiones, nunca."
        modifiers:
          army_org_factor: 0.05
          war_support_factor: 0.05
          political_power_gain: -0.05
        modifiers_src: invented
        removable: false

      - id: EFE_junta_de_la_tierra
        granted_by: EFE_la_junta_de_la_tierra
        name:
          english: "The Junta of the Earth"
          spanish: "La Junta de la Tierra"
        name_src: invented
        desc:
          english: "The Emperor reigns; the Marshal governs. The Empire has become an army with a country attached."
          spanish: "El Emperador reina; el Mariscal gobierna. El Imperio se volvió un ejército con un país adentro."
        modifiers:
          army_org_factor: 0.1
          war_support_factor: 0.1
          research_speed_factor: 0.05
        modifiers_src: invented
        removable: false

      - id: EFE_consejo_tecnico
        granted_by: EFE_consejo_de_custodios
        name:
          english: "The Council of Custodians"
          spanish: "El Consejo de Custodios"
        name_src: invented
        desc:
          english: "Glaciologists, hydrologists and agronomists in uniform. The Guard gives the orders; the Council tells it which ones will work."
          spanish: "Glaciólogos, hidrólogos y agrónomos de uniforme. La Guardia da las órdenes; el Consejo le dice cuáles van a funcionar."
        modifiers:
          research_speed_factor: 0.05
        modifiers_src: invented
        removable: false

      - id: EFE_red_hidrica
        granted_by: EFE_red_hidrica_guarani
        name:
          english: "The Guaraní Water Grid"
          spanish: "La Red Hídrica Guaraní"
        name_src: invented
        desc:
          english: "The aquifer feeds the factories now: pumped, filtered and rationed by the Ministry of Restoration."
          spanish: "El acuífero ahora alimenta a las fábricas: bombeado, filtrado y racionado por el Ministerio de Restauración."
        modifiers:
          industrial_capacity_factory: 0.05
          production_speed_buildings_factor: 0.1
        modifiers_src: invented
        removable: false

      - id: EFE_guardia_movilizada
        granted_by: EFE_guardia_verde_movilizada
        name:
          english: "The Mobilised Guard"
          spanish: "La Guardia Movilizada"
        name_src: invented
        desc:
          english: "Every forest ranger is a reservist and every reservist is a forest ranger."
          spanish: "Todo guardabosques es reservista y todo reservista es guardabosques."
        modifiers:
          war_support_factor: 0.05
          army_org_factor: 0.05
        modifiers_src: invented
        removable: false

      - id: EFE_defensa_acuifero
        granted_by: EFE_defensa_del_acuifero
        name:
          english: "Defence of the Aquifer"
          spanish: "Defensa del Acuífero"
        name_src: invented
        desc:
          english: "Bunkers under the soy fields, mines along the rivers. Whoever wants the water will have to drink it through a trench."
          spanish: "Búnkers bajo los campos de soja, minas a lo largo de los ríos. El que quiera el agua va a tener que tomarla desde una trinchera."
        modifiers:
          army_defence_factor: 0.1
        modifiers_src: invented
        removable: false

    # -------------------------------------------------------------------------
    # Ideas escalonadas de BioSteel — ver 06_mechanics.yaml#biosteel
    # -------------------------------------------------------------------------
      - id: EFE_mandato_del_monte
        name: { english: "The Mandate of the Forest", spanish: "El Mandato del Monte" }
        desc:
          english: "The forest governs now. The cities are only tolerated."
          spanish: "Ahora gobierna el monte. Las ciudades apenas se toleran."
        modifiers: { political_power_gain: 0.05, war_support_factor: 0.1, stability_factor: -0.05 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_crisis_del_monte
        name: { english: "The Forest Crisis", spanish: "La Crisis del Monte" }
        desc:
          english: "Rangers against courtiers, reserves against cities. The Empire is choosing a side."
          spanish: "Guardaparques contra cortesanos, reservas contra ciudades. El Imperio está eligiendo un bando."
        modifiers: { stability_factor: -0.15, political_power_gain: -0.1 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_muralla_verde
        name: { english: "The Great Green Wall", spanish: "La Gran Muralla Verde" }
        desc:
          english: "A belt of forest, bunkers and anti-air along the northern border."
          spanish: "Un cinturón de bosque, búnkeres y antiaéreos sobre la frontera norte."
        modifiers: { army_defence_factor: 0.1, production_speed_buildings_factor: 0.05 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_desurbanizacion
        name: { english: "Deurbanisation", spanish: "Desurbanización" }
        desc:
          english: "The cities are emptied into the countryside. Fewer factories, more hands for the forest."
          spanish: "Las ciudades se vacían hacia el campo. Menos fábricas, más manos para el bosque."
        modifiers: { industrial_capacity_factory: -0.1, consumer_goods_factor: -0.05, stability_factor: 0.05 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_bosque_armado
        name: { english: "The Forest Is the Army", spanish: "El Bosque es el Ejército" }
        desc:
          english: "Every ranger is a soldier and every tree is cover."
          spanish: "Cada guardaparques es un soldado y cada árbol es una trinchera."
        modifiers: { army_defence_factor: 0.15, army_org_factor: 0.05 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_tierra_arrasada
        name: { english: "Scorched Earth", spanish: "Tierra Arrasada" }
        desc:
          english: "Whoever invades the Empire finds nothing to eat, nothing to repair and nobody to rule."
          spanish: "El que invade el Imperio no encuentra nada que comer, nada que reparar y nadie a quien gobernar."
        modifiers: { war_support_factor: 0.1, army_defence_factor: 0.05 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_la_selva_avanza
        name: { english: "The Jungle Advances", spanish: "La Selva Avanza" }
        desc:
          english: "The offensive moves at the speed of the forest: slowly, and it never goes back."
          spanish: "La ofensiva avanza a la velocidad del bosque: despacio, y nunca retrocede."
        modifiers: { army_attack_factor: 0.1, experience_gain_army: 0.1 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_continente_vivo
        name: { english: "A Living Continent", spanish: "Un Continente Vivo" }
        desc:
          english: "Every reforested region is one more wall and one more factory that grows by itself."
          spanish: "Cada región reforestada es un muro más y una fábrica más que crece sola."
        modifiers: { army_defence_factor: 0.1, army_attack_factor: 0.05, stability_factor: 0.1 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_diplomacia_hidrica
        name: { english: "Water Diplomacy", spanish: "Diplomacia del Agua" }
        desc:
          english: "The Guaraní Aquifer as an embassy: fresh water in exchange for factories and friends."
          spanish: "El Acuífero Guaraní como embajada: agua dulce a cambio de fábricas y amigos."
        modifiers: { trade_opinion_factor: 0.25, political_power_gain: 0.05 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_potencia_hidrica
        name: { english: "The Water Power", spanish: "La Potencia Hídrica" }
        desc:
          english: "Half the world's thirst passes through the Southern Cone."
          spanish: "La mitad de la sed del mundo pasa por el Cono Sur."
        modifiers: { trade_opinion_factor: 0.3, political_power_gain: 0.1, industrial_capacity_factory: 0.05 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_autarquia_total
        name: { english: "Total Autarky", spanish: "Autarquía Total" }
        desc:
          english: "Nothing comes in, nothing goes out. The vats feed the Empire."
          spanish: "No entra nada, no sale nada. Las cubas alimentan al Imperio."
        modifiers: { industrial_capacity_factory: 0.1, local_resources_factor: 0.15, trade_opinion_factor: -0.25 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_montana_y_selva
        name: { english: "Mountain and Jungle", spanish: "Montaña y Selva" }
        desc:
          english: "The Guard trains where the maps end."
          spanish: "La Guardia se entrena donde terminan los mapas."
        modifiers: { army_defence_factor: 0.05, army_org_factor: 0.05 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
      - id: EFE_armadura_viviente
        name: { english: "Living Armour", spanish: "Armadura Viviente" }
        desc:
          english: "BioSteel plates that close their own wounds."
          spanish: "Placas de Bioacero que cierran sus propias heridas."
        modifiers: { army_armor_attack_factor: 0.1, army_armor_defence_factor: 0.1 }
        src: user_design   # "Las Ocho Potencias" (2026-09-23)
    biosteel_tiers:
      implementation: national_spirit_swap
      implementation_src: inferred
      note: >
        Un spirit por umbral. El foco de cada umbral pide la cantidad de
        BioSteel (recurso, Q021) y cambia el tier: el tier 1 se agrega, el 2 y
        el 3 reemplazan al anterior. Ver 06_mechanics.yaml#biosteel.
      tiers:
        - tier: 1
          threshold: 5
          threshold_src: canon
          id: EFE_biosteel_t1
          name:
            english: "BioSteel Foundries"
            spanish: "Fundiciones de Bioacero"
          name_src: invented
          desc:
            english: "The first vats of living alloy are running. The yield is poor; the promise is not."
            spanish: "Las primeras cubas de aleación viva ya funcionan. El rendimiento es pobre; la promesa, no."
          desc_src: invented
          modifiers:
            production_speed_arms_factory_factor: 0.05
          modifiers_src: invented
        - tier: 2
          threshold: 10
          threshold_src: canon
          id: EFE_biosteel_t2
          name:
            english: "BioSteel Industry"
            spanish: "Industria del Bioacero"
          name_src: invented
          desc:
            english: "BioSteel is no longer an experiment but a supply chain, grown by the tonne in the old pampas."
            spanish: "El Bioacero ya no es un experimento sino una cadena de suministro, cultivada por tonelada en la vieja pampa."
          desc_src: invented
          modifiers:
            production_speed_arms_factory_factor: 0.10
            army_armor_attack_factor: 0.05
          modifiers_src: invented
        - tier: 3
          threshold: 15
          threshold_src: canon
          id: EFE_biosteel_t3
          name:
            english: "Living Armour"
            spanish: "Armadura Viviente"
          name_src: invented
          desc:
            english: "Our armour heals, hardens and grows. The Empire no longer forges its weapons: it raises them."
            spanish: "Nuestro blindaje sana, se endurece y crece. El Imperio ya no forja sus armas: las cría."
          desc_src: invented
          modifiers:
            production_speed_arms_factory_factor: 0.15
            army_armor_attack_factor: 0.10
            army_armor_defence_factor: 0.10
          modifiers_src: invented
      resolved:
        - "Qué acumula el contador: la cantidad del recurso BioSteel (Q021)."
        - "Los tiers son excluyentes: cada uno reemplaza al anterior."

