# =============================================================================
technical_notes:
  - id: TN006
    text: >
      Cada clave de modificador usada acá tiene que existir en el juego. Están
      elegidas del set vanilla común (production_speed_*, consumer_goods_factor,
      stability_factor, etc.), pero `monthly_population` y `local_resources_factor`
      son las dos que quiero verificar contra tu versión antes de generar,
      porque son las que más han cambiado de nombre entre parches. Ver Q004.

  - id: TN007
    text: >
      Toda idea necesita clave de nombre Y de descripción en localisation
      (`<id>` y `<id>_desc`). El generador emite ambas en EN y ES o falla.
      Esto cumple la regla de cero claves huérfanas.
    enforce_in_generator: true
