# =============================================================================
# 11_scenario.yaml — Escenario de arranque (bookmark) y fecha del juego
# =============================================================================
# El mod arranca en 2100. Para eso hacen falta tres cosas:
#
#   1. Un bookmark propio (common/bookmarks/): es lo que muestra la pantalla de
#      selección, con los países destacados arriba.
#   2. Mover la fecha de inicio y de fin del juego (common/defines/). Con la
#      fecha vanilla (1936) el juego no acepta un bookmark en 2100.
#   3. Sacar los bookmarks vanilla de 1936 y 1939 (replace_path de
#      common/bookmarks en el descriptor): con la fecha nueva quedarían
#      apuntando a antes del inicio.
#
# Consecuencia a tener en cuenta: arrancando en 2100, el juego aplica TODA la
# historia vanilla con fecha anterior (las entradas de 1939, 1940...). El
# resto del mundo, que todavía es vanilla, arranca como en 1939 o más. Se
# arregla cuando se reemplace la historia mundial (Q042, fase 5).
# =============================================================================

bookmark:
  id: MEGANATIONS_2100
  src: inferred
  date: "2100.1.1.12"          # Q003: 1 de enero de 2100, mediodía (formato HOI4)
  date_src: inferred
  name:
    english: "The Age of Meganations"
    spanish: "La Era de las Meganaciones"
  name_src: invented
  desc:
    english: "2100. The old nation-states are gone. Eight meganations divide what is left of the planet, each built around the one resource, balance or system it cannot live without."
    spanish: "2100. Los viejos Estados nacionales ya no existen. Ocho meganaciones se reparten lo que queda del planeta, cada una construida alrededor del recurso, equilibrio o sistema sin el que no puede vivir."
  desc_src: inferred
  desc_basis: "§1 — 'cada mega-nación gira alrededor de un recurso, equilibrio o sistema exclusivo'."
  default_country: EFE

  # Países destacados arriba en la pantalla de selección: las 8 meganaciones
  # (2026-09-23). Uno sin states no se destaca (no se puede jugar).
  featured:
    - tag: EFE
      history:
        english: 'Aurelio IV rules the Southern Cone in the name of the Earth: the forest is the nation, and the nation obeys. Born from the militias that saved the Guaraní Aquifer at Iguazú, the Empire grows a living metal, BioSteel, and its court is split between the crown and the rangers.'
        spanish: 'Aurelio IV gobierna el Cono Sur en nombre de la Tierra: el bosque es la nación, y la nación obedece. Nacido de las milicias que salvaron el Acuífero Guaraní en Iguazú, el Imperio cultiva un metal vivo, el Bioacero, y su corte está partida entre la corona y los guardaparques.'
      history_src: invented
      history_basis: "§3.2 y §3.3."

    - tag: ASC
      history:
        english: 'Born when the workers of Brandenburg seized the automated factories instead of smashing them, the Commune lets machines do the work while a Council drawn by lot, and the planning system PLAN-41, share out the output. Nobody is poor; nobody is free of the Plan.'
        spanish: 'Nacida cuando los obreros de Brandeburgo tomaron las fábricas automáticas en vez de romperlas, la Comuna deja que las máquinas trabajen mientras un Consejo sorteado y el sistema PLAN-41 reparten lo producido. Nadie es pobre; nadie está libre del Plan.'
      history_src: invented
    - tag: FCU
      history:
        english: 'When the United States defaulted, four corporations bought the republic and made every citizen a shareholder. Chairwoman Castellane holds the water and the balance of the Directorate; Rourke wants a hostile takeover and a company that lives off war.'
        spanish: 'Cuando los Estados Unidos quebraron, cuatro corporaciones compraron la república e hicieron accionista a cada ciudadano. La Presidenta Castellane controla el agua y el equilibrio del Directorio; Rourke quiere una OPA hostil y una empresa que viva de la guerra.'
      history_src: invented
    - tag: NRE
      history:
        english: 'An unpaid Mediterranean garrison organised itself into legions and raised Lucius Varro on a shield at Ostia. From Gaul to Anatolia, Rome has a Senate, consuls and roads again, and the old problem: the legions that make an emperor can make another.'
        spanish: 'Una guarnición del Mediterráneo sin sueldo se organizó en legiones y levantó a Lucius Varro sobre un escudo en Ostia. De la Galia a Anatolia, Roma vuelve a tener Senado, cónsules y caminos, y el problema de siempre: las legiones que hacen un emperador pueden hacer otro.'
      history_src: invented
    - tag: SHD
      history:
        english: 'When the provinces of China could not govern the rivers, the dam engineers began to govern through the water. The Directorate corrects three flows, Production, Order and the People, and Lin Wenzhao has never given a speech. Zhou wants to open the floodgates.'
        spanish: 'Cuando las provincias de China no podían gobernar los ríos, los ingenieros de las represas empezaron a gobernar a través del agua. El Directorio corrige tres caudales, la Producción, el Orden y el Pueblo, y Lin Wenzhao nunca dio un discurso. Zhou quiere abrir las compuertas.'
      history_src: invented
    - tag: HSN
      history:
        english: 'Born from the ports that survived the Ash Winter, the High Seas charge passage through the straits that carry half the world''s cargo. Aldana sells insurance to every war; Tavake wants to raise the fleet and board the world.'
        spanish: 'Nacida de los puertos que sobrevivieron al Invierno de Ceniza, la Alta Mar cobra el paso por los estrechos donde viaja la mitad de la carga del mundo. Aldana le vende seguros a cada guerra; Tavake quiere amotinar la flota y abordar el mundo.'
      history_src: invented
    - tag: NAS
      history:
        english: 'When the Ash Winter killed the harvests, a farmer fed Cusco from the old terraces and the sun broke through the clouds the day he was crowned. His son, the Sapa Inti, stores sunlight in temples and must choose between the priests'' court and the four suyus of the Inca.'
        spanish: 'Cuando el Invierno de Ceniza mató las cosechas, un campesino alimentó a Cusco con las viejas terrazas y el sol atravesó las nubes el día que lo coronaron. Su hijo, el Sapa Inti, guarda la luz en templos y debe elegir entre la corte de los sacerdotes y los cuatro suyus del Inca.'
      history_src: invented
    - tag: APF
      history:
        english: 'It began with a water rota written in chalk in a schoolhouse in Tillabéri. Now twelve hundred councils send their power up to the Congress in Lagos, never down. Amara coordinates; Diallo wants to arm the councils and march to Suez.'
        spanish: 'Empezó con un turno de agua escrito con tiza en una escuela de Tillabéri. Hoy mil doscientos consejos mandan su poder hacia arriba, al Congreso de Lagos, nunca hacia abajo. Amara coordina; Diallo quiere armar los consejos y marchar hasta Suez.'
      history_src: invented

  others_history:
    english: "The rest of the world. Not every nation survived the century; those that did must choose a side."
    spanish: "El resto del mundo. No todas las naciones sobrevivieron al siglo; las que lo hicieron tienen que elegir un bando."
  others_history_src: invented

game_dates:
  start: "2100.1.1.12"
  end: "2200.1.1.1"
  end_src: invented
  why: >
    HOI4 corta la partida en END_DATE. Un siglo de margen: no hay nada en el
    doc que diga cuándo termina el escenario.

# -----------------------------------------------------------------------------
# Menú principal (2026-09-23): arte del usuario. El generador busca en
# interface/*.gfx del juego los sprites de fondo del menú principal y escribe
# esta imagen en la MISMA ruta de textura, así la reemplaza sin tocar la
# interfaz. Si el juego usa otro tamaño, se reescala al del original.
# Fuente editable: assets/menu/meganations_menu_source.webp.
# -----------------------------------------------------------------------------
main_menu:
  background: assets/menu/meganations_menu_bg.dds
  # Pantallas de carga del usuario (2026-09-29): se reparten entre las del juego.
  loading_screens: assets/menu/loading
  src: user_art

# -----------------------------------------------------------------------------
# Fondos de las pestañas (2026-09-30, pedido del usuario: "cómo hacemos para ir
# cambiando los fondos de todas las pestañas"). Igual que el menú: nuestra
# imagen se escribe en la MISMA ruta de textura del juego (reescalada a su
# tamaño), sin tocar la interfaz.
#   textures: ruta de la textura del juego -> imagen nuestra (.dds en assets/)
# Mientras esté vacío, el generador solo anota en el reporte qué fondos usa
# cada pestaña (política, investigación, producción, inteligencia...), con su
# tamaño, para pedir las imágenes con el tamaño justo.
# -----------------------------------------------------------------------------
tab_backgrounds:
  src: user_request
  # 2026-09-30, del reporte de 1.19.3: casi todas las pestañas usan los mismos
  # mosaicos (tiled_*), que el juego repite; cambiarlos cambia el estilo de
  # todas las ventanas. Algunas tienen fondo propio. `seamless`: el dibujo se
  # repite en mosaico, los bordes tienen que empalmar.
  # El dibujo llega por arte/pedidos (7_fondos) a assets/ui/<id>.dds y el
  # generador lo escribe sobre la textura del juego, a su tamaño.
  items:
    - {id: fondo_focos, texture: gfx/interface/tiles/tiled_focus_bg.dds, size: [998, 1031], seamless: false, where: "árbol de focos nacionales", art: "a vast dark blueprint of a 2100 continent-spanning state, faint circuit lines, map grid and laurels, very dark and low contrast so focus icons stay readable"}
    - {id: fondo_investigacion, texture: gfx/interface/tiles/tiled_research_bg.dds, size: [94, 94], seamless: true, where: "árbol de investigación", art: "dark teal technical grid with faint schematic lines, seamless tile, very low contrast"}
    - {id: fondo_ventanas, texture: gfx/interface/tiles/tiled_bg.dds, size: [192, 192], seamless: true, where: "fondo de 23 ventanas (diplomacia, facciones, comercio, inteligencia, ejército...)", art: "dark graphite brushed metal with a faint hexagonal pattern, seamless tile, very low contrast"}
    - {id: fondo_liso, texture: gfx/interface/tiles/tiled_plain_bg.dds, size: [190, 190], seamless: true, where: "fondo liso de 42 ventanas (política, producción, investigación...)", art: "very dark slate with subtle noise and faint scanlines, seamless tile, almost flat"}
    - {id: fondo_liso_2, texture: gfx/interface/tiles/tiled_plain_bg2.dds, size: [182, 186], seamless: true, where: "fondo de focos e investigación", art: "very dark slate blue with subtle noise, seamless tile, almost flat"}
    # 2026-09-30: tiled_paper_bg también es el papel de las fichas de
    # tecnología, con texto oscuro encima; el papel oscuro lo volvía ilegible.
    # Pedido de nuevo en tono claro (el anterior, fondo_papel_agencia, se borró).
    - {id: fondo_papel_claro, texture: gfx/interface/tiles/tiled_paper_bg.dds, size: [192, 192], seamless: true, where: "papel de la agencia de inteligencia y de las fichas de tecnología: lleva texto oscuro encima", art: "light aged parchment, pale beige-grey with a faint technical grid and very subtle redaction marks, LIGHT enough for dark text to stay readable, seamless tile"}
    - {id: fondo_superpuesto, texture: gfx/interface/tiles/tiled_generic_overlay_bg1.dds, size: [549, 600], seamless: false, where: "fondo de logística, producción, despliegue y oficiales", art: "faint holographic overlay of a world map with data lines, dark and transparent-looking"}
    - {id: fondo_superpuesto_chico, texture: gfx/interface/tiles/tiled_generic_overlay_bg1_small.dds, size: [290, 310], seamless: false, where: "fondo de construcción, comercio, mercado y facciones", art: "faint holographic overlay of a world map with data lines, dark"}
    - {id: cabecera_produccion, texture: gfx/interface/production_win_top.dds, size: [550, 253], seamless: false, where: "cabecera de la pestaña de producción", art: "automated 2100 factory floor with robotic arms and drones, dark industrial palette"}
    - {id: cabecera_oficiales, texture: gfx/interface/officer_corp/officer_corp_bg_army.dds, size: [516, 242], seamless: false, where: "cuerpo de oficiales (ejército)", art: "a 2100 command room with a holographic battle map and officers in silhouette"}
    - {id: cabecera_agencia, texture: gfx/interface/operatives/intelligence_agency_header4.dds, size: [519, 109], seamless: false, where: "cabecera de la agencia de inteligencia", art: "a dark operations room with screens of surveillance feeds, wide banner"}

# -----------------------------------------------------------------------------
# Fondos de cada rama de investigación (2026-09-30, pedido del usuario: "faltan
# las imágenes para cada fondo de investigación, cada rama"). Cada pestaña del
# árbol dibuja GFX_<rama>_techtree_bg; el generador busca su textura y tamaño en
# el juego instalado y pone encima assets/ui/investigacion/<id>.dds, recortada
# para cubrirla. El reporte lista las ramas del juego que no tienen imagen.
# El vanilla es una foto en blanco y negro que se funde a negro a la derecha y
# abajo, donde van los íconos: las nuestras siguen esa regla.
# -----------------------------------------------------------------------------
research_backgrounds:
  src: user_request
  items:
    - {id: investigacion_infanteria, sprite: GFX_infantry_techtree_bg, where: "rama de infantería", art: "2100 infantry in powered exoskeletons and smart rifles marching through a ruined megacity"}
    - {id: investigacion_apoyo, sprite: GFX_support_techtree_bg, where: "rama de equipos de apoyo", art: "combat engineers, field hospital drones and recon robots supporting a 2100 frontline"}
    - {id: investigacion_blindados, sprite: GFX_armor_techtree_bg, search: [armor, armour, tank], where: "rama de blindados", art: "a column of hover tanks and railgun armored vehicles on a dusty plain, 2100"}
    - {id: investigacion_artilleria, sprite: GFX_artillery_techtree_bg, where: "rama de artillería", art: "a battery of electromagnetic railgun artillery firing at night, 2100"}
    - {id: investigacion_naval, sprite: GFX_naval_techtree_bg, where: "rama naval", art: "a 2100 drydock with a stealth destroyer and autonomous submarines under construction"}
    - {id: investigacion_aerea, sprite: GFX_air_techtree_bg, where: "rama aérea", art: "a hangar of 2100 scramjet fighters and drone swarms on an airbase at dawn"}
    - {id: investigacion_industria, sprite: GFX_industry_techtree_bg, where: "rama de industria y construcción", art: "an automated 2100 megafactory with robotic arms, fusion reactors and synthetic fuel towers"}
    - {id: investigacion_electronica, sprite: GFX_engineering_techtree_bg, where: "rama de electrónica e ingeniería", art: "a 2100 quantum computing lab with engineers in front of holographic circuit boards"}
