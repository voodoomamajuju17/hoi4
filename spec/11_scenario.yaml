# =============================================================================
# 11_scenario.yaml — Escenario de arranque (bookmark) y fecha del juego
# =============================================================================
# El mod arranca en 2100. Para eso hacen falta tres cosas:
#
#   1. Un bookmark propio (common/bookmarks/): es lo que muestra la pantalla de
#      selección, con los países destacados arriba.
#   2. Mover la fecha de inicio y de fin del juego (common/defines/). Con la
#      fecha vanilla (1936) el juego no acepta un bookmark en 2100.
#   3. Sacar los bookmarks vanilla de 1936 y 1939 (replace_path de
#      common/bookmarks en el descriptor): con la fecha nueva quedarían
#      apuntando a antes del inicio.
#
# Consecuencia a tener en cuenta: arrancando en 2100, el juego aplica TODA la
# historia vanilla con fecha anterior (las entradas de 1939, 1940...). El
# resto del mundo, que todavía es vanilla, arranca como en 1939 o más. Se
# arregla cuando se reemplace la historia mundial (Q042, fase 5).
# =============================================================================

bookmark:
  id: MEGANATIONS_2100
  src: inferred
  date: "2100.1.1.12"          # Q003: 1 de enero de 2100, mediodía (formato HOI4)
  date_src: inferred
  name:
    english: "The Age of Meganations"
    spanish: "La Era de las Meganaciones"
  name_src: invented
  desc:
    english: "2100. The old nation-states are gone. Eight meganations divide what is left of the planet, each built around the one resource, balance or system it cannot live without."
    spanish: "2100. Los viejos Estados nacionales ya no existen. Ocho meganaciones se reparten lo que queda del planeta, cada una construida alrededor del recurso, equilibrio o sistema sin el que no puede vivir."
  desc_src: inferred
  desc_basis: "§1 — 'cada mega-nación gira alrededor de un recurso, equilibrio o sistema exclusivo'."
  # Sin país preseleccionado, como el juego base ("---"). Reporte 2026-10-11:
  # con EFE preseleccionado, la pestaña de investigación mostraba los nombres
  # y las imágenes del EFE a cualquier país (el árbol se arma con el país que
  # está elegido al cargar la partida y no se actualiza al cambiar).
  default_country: "---"

  # Países destacados arriba en la pantalla de selección: las 8 meganaciones
  # (2026-09-23). Uno sin states no se destaca (no se puede jugar).
  featured:
    - tag: EFE
      history:
        english: 'Aurelio IV rules the Southern Cone in the name of the Earth: the forest is the nation, and the nation obeys. Born from the militias that saved the Guaraní Aquifer at Iguazú, the Empire grows a living metal, BioSteel, and its court is split between the crown and the rangers.'
        spanish: 'Aurelio IV gobierna el Cono Sur en nombre de la Tierra: el bosque es la nación, y la nación obedece. Nacido de las milicias que salvaron el Acuífero Guaraní en Iguazú, el Imperio cultiva un metal vivo, el Bioacero, y su corte está partida entre la corona y los guardaparques.'
      history_src: invented
      history_basis: "§3.2 y §3.3."

    - tag: ASC
      history:
        english: 'Born when the workers of Brandenburg seized the automated factories instead of smashing them, the Commune lets machines do the work while a Council drawn by lot, and the planning system PLAN-41, share out the output. Nobody is poor; nobody is free of the Plan.'
        spanish: 'Nacida cuando los obreros de Brandeburgo tomaron las fábricas automáticas en vez de romperlas, la Comuna deja que las máquinas trabajen mientras un Consejo sorteado y el sistema PLAN-41 reparten lo producido. Nadie es pobre; nadie está libre del Plan.'
      history_src: invented
    - tag: FCU
      history:
        english: 'When the United States defaulted, four corporations bought the republic and made every citizen a shareholder. Chairwoman Castellane holds the water and the balance of the Directorate; Rourke wants a hostile takeover and a company that lives off war.'
        spanish: 'Cuando los Estados Unidos quebraron, cuatro corporaciones compraron la república e hicieron accionista a cada ciudadano. La Presidenta Castellane controla el agua y el equilibrio del Directorio; Rourke quiere una OPA hostil y una empresa que viva de la guerra.'
      history_src: invented
    - tag: NRE
      history:
        english: 'An unpaid Mediterranean garrison organised itself into legions and raised Lucius Varro on a shield at Ostia. From Gaul to Anatolia, Rome has a Senate, consuls and roads again, and the old problem: the legions that make an emperor can make another.'
        spanish: 'Una guarnición del Mediterráneo sin sueldo se organizó en legiones y levantó a Lucius Varro sobre un escudo en Ostia. De la Galia a Anatolia, Roma vuelve a tener Senado, cónsules y caminos, y el problema de siempre: las legiones que hacen un emperador pueden hacer otro.'
      history_src: invented
    - tag: SHD
      history:
        english: 'When the provinces of China could not govern the rivers, the dam engineers began to govern through the water. The Directorate corrects three flows, Production, Order and the People, and Lin Wenzhao has never given a speech. Zhou wants to open the floodgates.'
        spanish: 'Cuando las provincias de China no podían gobernar los ríos, los ingenieros de las represas empezaron a gobernar a través del agua. El Directorio corrige tres caudales, la Producción, el Orden y el Pueblo, y Lin Wenzhao nunca dio un discurso. Zhou quiere abrir las compuertas.'
      history_src: invented
    - tag: HSN
      history:
        english: 'Born from the ports that survived the Ash Winter, the High Seas charge passage through the straits that carry half the world''s cargo. Aldana sells insurance to every war; Tavake wants to raise the fleet and board the world.'
        spanish: 'Nacida de los puertos que sobrevivieron al Invierno de Ceniza, la Alta Mar cobra el paso por los estrechos donde viaja la mitad de la carga del mundo. Aldana le vende seguros a cada guerra; Tavake quiere amotinar la flota y abordar el mundo.'
      history_src: invented
    - tag: NAS
      history:
        english: 'When the Ash Winter killed the harvests, a farmer fed Cusco from the old terraces and the sun broke through the clouds the day he was crowned. His son, the Sapa Inti, stores sunlight in temples and must choose between the priests'' court and the four suyus of the Inca.'
        spanish: 'Cuando el Invierno de Ceniza mató las cosechas, un campesino alimentó a Cusco con las viejas terrazas y el sol atravesó las nubes el día que lo coronaron. Su hijo, el Sapa Inti, guarda la luz en templos y debe elegir entre la corte de los sacerdotes y los cuatro suyus del Inca.'
      history_src: invented
    - tag: APF
      history:
        english: 'It began with a water rota written in chalk in a schoolhouse in Tillabéri. Now twelve hundred councils send their power up to the Congress in Lagos, never down. Amara coordinates; Diallo wants to arm the councils and march to Suez.'
        spanish: 'Empezó con un turno de agua escrito con tiza en una escuela de Tillabéri. Hoy mil doscientos consejos mandan su poder hacia arriba, al Congreso de Lagos, nunca hacia abajo. Amara coordina; Diallo quiere armar los consejos y marchar hasta Suez.'
      history_src: invented

  others_history:
    english: "The rest of the world. Not every nation survived the century; those that did must choose a side."
    spanish: "El resto del mundo. No todas las naciones sobrevivieron al siglo; las que lo hicieron tienen que elegir un bando."
  others_history_src: invented

game_dates:
  start: "2100.1.1.12"
  end: "2200.1.1.1"
  end_src: invented
  why: >
    HOI4 corta la partida en END_DATE. Un siglo de margen: no hay nada en el
    doc que diga cuándo termina el escenario.

# -----------------------------------------------------------------------------
# Menú principal (2026-09-23): arte del usuario. El generador busca en
# interface/*.gfx del juego los sprites de fondo del menú principal y escribe
# esta imagen en la MISMA ruta de textura, así la reemplaza sin tocar la
# interfaz. Si el juego usa otro tamaño, se reescala al del original.
# Fuente editable: assets/menu/meganations_menu_source.webp.
# -----------------------------------------------------------------------------
main_menu:
  background: assets/menu/meganations_menu_bg.dds
  # Pantallas de carga del usuario (2026-09-29): se reparten entre las del juego.
  loading_screens: assets/menu/loading
  src: user_art

# -----------------------------------------------------------------------------
# Fondos de las pestañas (2026-09-30, pedido del usuario: "cómo hacemos para ir
# cambiando los fondos de todas las pestañas"). Igual que el menú: nuestra
# imagen se escribe en la MISMA ruta de textura del juego (reescalada a su
# tamaño), sin tocar la interfaz.
#   textures: ruta de la textura del juego -> imagen nuestra (.dds en assets/)
# Mientras esté vacío, el generador solo anota en el reporte qué fondos usa
# cada pestaña (política, investigación, producción, inteligencia...), con su
# tamaño, para pedir las imágenes con el tamaño justo.
# -----------------------------------------------------------------------------
tab_backgrounds:
  src: user_request
  # 2026-09-30, del reporte de 1.19.3: casi todas las pestañas usan los mismos
  # mosaicos (tiled_*), que el juego repite; cambiarlos cambia el estilo de
  # todas las ventanas. Algunas tienen fondo propio. `seamless`: el dibujo se
  # repite en mosaico, los bordes tienen que empalmar.
  # El dibujo llega por arte/pedidos (7_fondos) a assets/ui/<id>.dds y el
  # generador lo escribe sobre la textura del juego, a su tamaño.
  items:
    - {id: fondo_focos, texture: gfx/interface/tiles/tiled_focus_bg.dds, size: [998, 1031], seamless: false, where: "árbol de focos nacionales", art: "a vast dark blueprint of a 2100 continent-spanning state, faint circuit lines, map grid and laurels, very dark and low contrast so focus icons stay readable"}
    - {id: fondo_investigacion, texture: gfx/interface/tiles/tiled_research_bg.dds, size: [94, 94], seamless: true, where: "árbol de investigación", art: "dark teal technical grid with faint schematic lines, seamless tile, very low contrast"}
    - {id: fondo_ventanas, texture: gfx/interface/tiles/tiled_bg.dds, size: [192, 192], seamless: true, where: "fondo de 23 ventanas (diplomacia, facciones, comercio, inteligencia, ejército...)", art: "dark graphite brushed metal with a faint hexagonal pattern, seamless tile, very low contrast"}
    - {id: fondo_liso, texture: gfx/interface/tiles/tiled_plain_bg.dds, size: [190, 190], seamless: true, where: "fondo liso de 42 ventanas (política, producción, investigación...)", art: "very dark slate with subtle noise and faint scanlines, seamless tile, almost flat"}
    - {id: fondo_liso_2, texture: gfx/interface/tiles/tiled_plain_bg2.dds, size: [182, 186], seamless: true, where: "fondo de focos e investigación", art: "very dark slate blue with subtle noise, seamless tile, almost flat"}
    # 2026-09-30: tiled_paper_bg también es el papel de las fichas de
    # tecnología, con texto oscuro encima; el papel oscuro lo volvía ilegible.
    # Pedido de nuevo en tono claro (el anterior, fondo_papel_agencia, se borró).
    - {id: fondo_papel_claro, texture: gfx/interface/tiles/tiled_paper_bg.dds, size: [192, 192], seamless: true, where: "papel de la agencia de inteligencia y de las fichas de tecnología: lleva texto oscuro encima", art: "light aged parchment, pale beige-grey with a faint technical grid and very subtle redaction marks, LIGHT enough for dark text to stay readable, seamless tile"}
    - {id: fondo_superpuesto, texture: gfx/interface/tiles/tiled_generic_overlay_bg1.dds, size: [549, 600], seamless: false, where: "fondo de logística, producción, despliegue y oficiales", art: "faint holographic overlay of a world map with data lines, dark and transparent-looking"}
    - {id: fondo_superpuesto_chico, texture: gfx/interface/tiles/tiled_generic_overlay_bg1_small.dds, size: [290, 310], seamless: false, where: "fondo de construcción, comercio, mercado y facciones", art: "faint holographic overlay of a world map with data lines, dark"}
    - {id: cabecera_produccion, texture: gfx/interface/production_win_top.dds, size: [550, 253], seamless: false, where: "cabecera de la pestaña de producción", art: "automated 2100 factory floor with robotic arms and drones, dark industrial palette"}
    - {id: cabecera_oficiales, texture: gfx/interface/officer_corp/officer_corp_bg_army.dds, size: [516, 242], seamless: false, where: "cuerpo de oficiales (ejército)", art: "a 2100 command room with a holographic battle map and officers in silhouette"}
    - {id: cabecera_agencia, texture: gfx/interface/operatives/intelligence_agency_header4.dds, size: [519, 109], seamless: false, where: "cabecera de la agencia de inteligencia", art: "a dark operations room with screens of surveillance feeds, wide banner"}

# -----------------------------------------------------------------------------
# Fondos de cada rama de investigación (2026-09-30, pedido del usuario: "faltan
# las imágenes para cada fondo de investigación, cada rama"). Cada pestaña del
# árbol dibuja GFX_<rama>_techtree_bg; el generador busca su textura y tamaño en
# el juego instalado y pone encima assets/ui/investigacion/<id>.dds, recortada
# para cubrirla. El reporte lista las ramas del juego que no tienen imagen.
# El vanilla es una foto en blanco y negro que se funde a negro a la derecha y
# abajo, donde van los íconos: las nuestras siguen esa regla.
# -----------------------------------------------------------------------------
research_backgrounds:
  src: user_request
  items:
    - {id: investigacion_infanteria, sprite: GFX_infantry_techtree_bg, where: "rama de infantería", art: "2100 infantry in powered exoskeletons and smart rifles marching through a ruined megacity"}
    - {id: investigacion_apoyo, sprite: GFX_support_techtree_bg, where: "rama de equipos de apoyo", art: "combat engineers, field hospital drones and recon robots supporting a 2100 frontline"}
    - {id: investigacion_blindados, sprite: GFX_armor_techtree_bg, search: [armor, armour, tank], where: "rama de blindados", art: "a column of hover tanks and railgun armored vehicles on a dusty plain, 2100"}
    - {id: investigacion_artilleria, sprite: GFX_artillery_techtree_bg, where: "rama de artillería", art: "a battery of electromagnetic railgun artillery firing at night, 2100"}
    - {id: investigacion_naval, sprite: GFX_naval_techtree_bg, where: "rama naval", art: "a 2100 drydock with a stealth destroyer and autonomous submarines under construction"}
    - {id: investigacion_aerea, sprite: GFX_air_techtree_bg, where: "rama aérea", art: "a hangar of 2100 scramjet fighters and drone swarms on an airbase at dawn"}
    - {id: investigacion_industria, sprite: GFX_industry_techtree_bg, where: "rama de industria y construcción", art: "an automated 2100 megafactory with robotic arms, fusion reactors and synthetic fuel towers"}
    - {id: investigacion_electronica, sprite: GFX_engineering_techtree_bg, where: "rama de electrónica e ingeniería", art: "a 2100 quantum computing lab with engineers in front of holographic circuit boards"}

# -----------------------------------------------------------------------------
# Frases de la pantalla de carga (2026-10-07, pedido del usuario: "en la
# pantalla de carga aparecen estas frases, ¿las podemos cambiar?"). Reemplazan
# las citas del juego (Patton, Churchill...) por voces de 2100. El generador
# busca las claves de las citas en el juego instalado y las pisa todas,
# repitiendo esta lista en orden.
# -----------------------------------------------------------------------------
loading_quotes:
  src: user_request
  # autor en inglés cuando cambia
  authors_en:
    Emperador Aurelio IV: Emperor Aurelio IV
    El Consejo de Asignación: The Allocation Council
    Presidenta Valeria Castellane: President Valeria Castellane
    Sapa Inti Amaru Quispe II: Sapa Inti Amaru Quispe II
    Imperator Lucius Varro: Imperator Lucius Varro
    Legado Flavius Arbogast: Legate Flavius Arbogast
    Legada Irina Vasilescu: Legate Irina Vasilescu
    Atamán Oleksandr Grigorenko: Ataman Oleksandr Grigorenko
    Coronel Tiago Barbosa: Colonel Tiago Barbosa
    Los Señores de la Guerra: The Warlords
    Crónicas del Gran Desarme: Chronicles of the Great Disarmament
    Manual del Soldado de 2100: Soldier's Handbook, 2100
    Proverbio de la Frontera: Frontier proverb
    Proverbio de los puertos: Harbour proverb
    Proverbio de las anarquías: Proverb of the anarchies
  # 2026-10-07: también fragmentos, curiosidades y citas del "Archivo del
  # Gran Desarme" (los ocho documentos de cada meganación).
  quotes:
  - {author: Emperador Aurelio IV, es: "El bosque no pide permiso para crecer. Nosotros tampoco.", en: "The forest does not ask permission to grow. Neither do we."}
  - {author: Emperador Aurelio IV, es: "Cada árbol que plantamos es un soldado que nunca deserta.", en: "Every tree we plant is a soldier that never deserts."}
  - {author: Anahí Quiroga, es: "El Monte no se conquista. Se pide prestado, y se devuelve con intereses.", en: "The Forest is not conquered. It is borrowed, and repaid with interest."}
  - {author: El Consejo de Asignación, es: "Ningún error humano fue registrado este año. Ningún humano fue consultado.", en: "No human error was recorded this year. No human was consulted."}
  - {author: PLAN-41, es: "La abundancia es una ecuación resuelta. La guerra es un redondeo.", en: "Abundance is a solved equation. War is a rounding error."}
  - {author: El Consejo de Asignación, es: "Una fábrica que espera a un operario ya llegó tarde.", en: "A factory that waits for a worker is already late."}
  - {author: Presidenta Valeria Castellane, es: "La libertad tiene precio. Por suerte, nosotros fijamos los precios.", en: "Freedom has a price. Fortunately, we set the prices."}
  - {author: Marcus Rourke, es: "No hacemos la guerra. Facturamos la paz por adelantado.", en: "We do not wage war. We invoice peace in advance."}
  - {author: Presidenta Valeria Castellane, es: "Un contrato bien escrito vale más que diez divisiones.", en: "A well-written contract is worth ten divisions."}
  - {author: Kofi Aldana, es: "El mar no tiene dueño. Tiene peaje.", en: "The sea has no owner. It has a toll."}
  - {author: Inés Tavake, es: "Quien controla los estrechos no necesita controlar las capitales.", en: "Whoever holds the straits does not need to hold the capitals."}
  - {author: Kofi Aldana, es: "Todo barco que pasa paga, en carga o en silencio.", en: "Every ship that passes pays, in cargo or in silence."}
  - {author: Sapa Inti Amaru Quispe II, es: "El sol sale para todos. Pero amanece primero en los Andes.", en: "The sun rises for everyone. But it dawns first in the Andes."}
  - {author: Sapa Inti Amaru Quispe II, es: "Los cóndores no pelean en el valle. Esperan a que el valle suba.", en: "Condors do not fight in the valley. They wait for the valley to climb."}
  - {author: Lin Wenzhao, es: "El río no discute con la piedra. La rodea, y un día la piedra ya no está.", en: "The river does not argue with the stone. It goes around it, and one day the stone is gone."}
  - {author: Lin Wenzhao, es: "La armonía no es la ausencia de conflicto. Es el conflicto bien administrado.", en: "Harmony is not the absence of conflict. It is conflict well managed."}
  - {author: Zhou Mingyuan, es: "Las compuertas se abren una sola vez. Elegí bien hacia dónde.", en: "The floodgates open only once. Choose well where they point."}
  - {author: Amara Nwosu-Keïta, es: "Una aldea sola es una presa. Mil aldeas juntas son un continente.", en: "One village alone is prey. A thousand villages together are a continent."}
  - {author: Kwame Diallo, es: "Nos dejaron los mapas viejos. Nosotros dibujamos rutas nuevas.", en: "They left us the old maps. We draw new roads."}
  - {author: Amara Nwosu-Keïta, es: "El consejo habla despacio, pero cuando decide, decide para siempre.", en: "The council speaks slowly, but when it decides, it decides forever."}
  - {author: Imperator Lucius Varro, es: "Roma no cayó. Se tomó dos mil años de descanso.", en: "Rome did not fall. It took a two-thousand-year rest."}
  - {author: Legado Flavius Arbogast, es: "La legión no cuenta enemigos. Cuenta pasos hasta la próxima frontera.", en: "The legion does not count enemies. It counts steps to the next frontier."}
  - {author: Legada Irina Vasilescu, es: "Toda provincia empieza como una conquista y termina como una costumbre.", en: "Every province begins as a conquest and ends as a habit."}
  - {author: Atamán Oleksandr Grigorenko, es: "Nadie se lleva la estepa. La estepa se lleva a todos.", en: "Nobody takes the steppe. The steppe takes everyone."}
  - {author: Rani Devika Rathore, es: "Mil reyes no hacen un imperio. Pero mil reyes no se rinden juntos.", en: "A thousand kings do not make an empire. But a thousand kings do not surrender together."}
  - {author: Emir Khalid al-Rashid, es: "El petróleo se acabó. La arena no.", en: "The oil ran out. The sand did not."}
  - {author: Coronel Tiago Barbosa, es: "En la selva no hay frentes. Hay árboles, y detrás de cada árbol, uno de los nuestros.", en: "In the jungle there are no fronts. There are trees, and behind every tree, one of ours."}
  - {author: Los Señores de la Guerra, es: "La ley llegó hasta acá una vez. Todavía estamos buscando su cuerpo.", en: "The law came out here once. We are still looking for the body."}
  - {author: Crónicas del Gran Desarme, es: "Los Estados no cayeron en una guerra. Se deshicieron, porque dejaron de poder alimentar a su gente.", en: "The states did not fall in a war. They came apart, because they could no longer feed their people."}
  - {author: Crónicas del Gran Desarme, es: "En 2100 la pregunta ya no es quién gobierna, sino de dónde saca el derecho a mandar.", en: "In 2100 the question is no longer who governs, but where the right to rule comes from."}
  - {author: Crónicas del Gran Desarme, es: "Ocho potencias, una sola certeza cada una, y ninguna dispuesta a compartirla.", en: "Eight powers, one certainty each, and none willing to share it."}
  - {author: Manual del Soldado de 2100, es: "El dron ve primero. El soldado decide. El que dude, pierde las dos cosas.", en: "The drone sees first. The soldier decides. Whoever hesitates loses both."}
  - {author: Manual del Soldado de 2100, es: "Un ejército sin suministro es una idea con botas.", en: "An army without supply is an idea in boots."}
  - {author: Proverbio de la Frontera, es: "Un mapa dice dónde termina un país. El hambre dice dónde empieza la guerra.", en: "A map tells you where a country ends. Hunger tells you where the war begins."}
  - {author: Proverbio de los puertos, es: "La paz es el tiempo que tarda en cargarse un barco.", en: "Peace is the time it takes to load a ship."}
  - {author: Proverbio de las anarquías, es: "Las potencias tienen planes. Nosotros tenemos tiempo.", en: "The powers have plans. We have time."}
  - {author: "Memorándum sobre los tres caudales, Wuhan, 2074", author_en: "Memorandum on the Three Currents, Wuhan, 2074", es: "El que decide quién riega gobierna, aunque lo llame mantenimiento.", en: "Whoever decides who gets water governs, even if he calls it maintenance."}
  - {author: "Memorándum sobre los tres caudales, Wuhan, 2074", author_en: "Memorandum on the Three Currents, Wuhan, 2074", es: "Un exceso de Orden es una presa sin aliviadero. No es más segura. Solo es más alta.", en: "Too much Order is a dam without a spillway. It is not safer. It is only taller."}
  - {author: "Memorándum sobre los tres caudales, Wuhan, 2074", author_en: "Memorandum on the Three Currents, Wuhan, 2074", es: "Toda represión es un cierre brusco. Por eso el Pueblo no se cierra: se regula, de a poco, antes de que haga falta.", en: "Every crackdown is a sudden shut-off. That is why the People are not shut off: they are regulated, little by little, before it is needed."}
  - {author: "Memorándum sobre los tres caudales, Wuhan, 2074", author_en: "Memorandum on the Three Currents, Wuhan, 2074", es: "La gente no tiene que enterarse de que hubo una crecida. Tiene que enterarse de que no se inundó.", en: "People should not learn that there was a flood. They should learn that nothing drowned."}
  - {author: "Memorándum sobre los tres caudales, Wuhan, 2074", author_en: "Memorandum on the Three Currents, Wuhan, 2074", es: "Una ley firmada la tiene que defender su autor, y un autor que defiende su ley ya no está mirando el río.", en: "A signed law must be defended by its author, and an author defending his law is no longer watching the river."}
  - {author: "Nota a lápiz en la copia 9 del Memorándum", author_en: "Pencil note on copy 9 of the Memorandum", es: "¿Y quién decide cuándo hace falta?", en: "And who decides when it is needed?"}
  - {author: "Instrucciones para plantar en un agujero, 2081", author_en: "Instructions for Planting in a Hole, 2081", es: "Elegí el agujero. No hace falta buscarlo: el siglo dejó de sobra.", en: "Choose the hole. No need to look for one: the century left plenty."}
  - {author: "Instrucciones para plantar en un agujero, 2081", author_en: "Instructions for Planting in a Hole, 2081", es: "Apretá la tierra con los dedos, no con la pala. La pala no sabe cuánto es demasiado.", en: "Press the soil with your fingers, not the shovel. The shovel does not know how much is too much."}
  - {author: "Instrucciones para plantar en un agujero, 2081", author_en: "Instructions for Planting in a Hole, 2081", es: "Regá una sola vez. Lo que necesita que lo rieguen todos los días no es de acá.", en: "Water it only once. Whatever needs watering every day does not belong here."}
  - {author: "Instrucciones para plantar en un agujero, 2081", author_en: "Instructions for Planting in a Hole, 2081", es: "El monte no discute: espera, y un día crece encima de todos los que tenían razón.", en: "The forest does not argue: it waits, and one day it grows over everyone who was right."}
  - {author: "Discurso de Ostia, Lucius Varro, 2084", author_en: "The Ostia Speech, Lucius Varro, 2084", es: "Con este escudo no empezó ningún imperio. Con este escudo se terminaron varios.", en: "No empire ever began on this shield. Several ended on it."}
  - {author: "Discurso de Ostia, Lucius Varro, 2084", author_en: "The Ostia Speech, Lucius Varro, 2084", es: "Un ejército con hambre no es un ejército: es una multitud con armas.", en: "A hungry army is not an army: it is a crowd with weapons."}
  - {author: "Discurso de Ostia, Lucius Varro, 2084", author_en: "The Ostia Speech, Lucius Varro, 2084", es: "No les prometo nada que no se pueda contar.", en: "I promise you nothing that cannot be counted."}
  - {author: "Discurso de Ostia, Lucius Varro, 2084", author_en: "The Ostia Speech, Lucius Varro, 2084", es: "La piedra del molino no tiene que llegar a ningún lado. Tiene que dar vueltas con trigo en el medio.", en: "The millstone does not have to get anywhere. It has to turn with grain in between."}
  - {author: "Discurso de Ostia, Lucius Varro, 2084", author_en: "The Ostia Speech, Lucius Varro, 2084", es: "Ustedes me hicieron. Ustedes me pueden deshacer.", en: "You made me. You can unmake me."}
  - {author: "Archivo del Gran Desarme", author_en: "Archive of the Great Disarmament", es: "¿Sabías que...? La voz joven que pregunta «¿Y después?» en el Discurso de Ostia es la de Flavius Arbogast, entonces centurión de veintitrés años.", en: "Did you know? The young voice asking \"And then?\" in the Ostia Speech belongs to Flavius Arbogast, then a 23-year-old centurion."}
  - {author: "La pared oeste, Tillabéri, 2086", author_en: "The West Wall, Tillabéri, 2086", es: "El pozo es de los que toman de él.", en: "The well belongs to those who drink from it."}
  - {author: "La pared oeste, Tillabéri, 2086", author_en: "The West Wall, Tillabéri, 2086", es: "Nadie vende un balde.", en: "Nobody sells a bucket."}
  - {author: "La pared oeste, Tillabéri, 2086", author_en: "The West Wall, Tillabéri, 2086", es: "El que venga de afuera a cambiarlo, primero viene un viernes y habla.", en: "Whoever comes from outside to change it first comes on a Friday and speaks."}
  - {author: "La pared oeste, letra de un chico", author_en: "The West Wall, a child's handwriting", es: "los chicos tambien ablamos", en: "kids talk to"}
  - {author: "La pared oeste, en fulfulde", author_en: "The West Wall, in Fulfulde", es: "Las vacas no saben cuándo es lunes.", en: "The cows do not know when it is Monday."}
  - {author: "Archivo del Gran Desarme", author_en: "Archive of the Great Disarmament", es: "¿Sabías que...? El primer artículo de la Constitución Continental de la Federación sale de una pared de escuela en Tillabéri, escrita con tiza.", en: "Did you know? The first article of the Federation's Continental Constitution comes from a chalk-written school wall in Tillabéri."}
  - {author: "Póliza del Hotu Matu'a, cláusula 1", author_en: "Hotu Matu'a Policy, clause 1", es: "El mar no es de nadie. Lo que pasa encima del mar está asegurado o no está asegurado.", en: "The sea belongs to no one. What happens on it is either insured or not insured."}
  - {author: "Póliza del Hotu Matu'a, cláusula 7", author_en: "Hotu Matu'a Policy, clause 7", es: "Mientras la Cámara no la reconozca, ninguna guerra existe para esta póliza.", en: "Until the Chamber recognises it, no war exists for this policy."}
  - {author: "Póliza del Hotu Matu'a, cláusula 9", author_en: "Hotu Matu'a Policy, clause 9", es: "La Nación no tiene enemigos; tiene asegurados.", en: "The Nation has no enemies; it has policyholders."}
  - {author: "Inés Tavake, al pie de su póliza", author_en: "Inés Tavake, at the foot of her policy", es: "Cuarenta minutos para contestar. El Hotu Matu'a tardó siete en darse vuelta. Sacamos a los veintidós.", en: "Forty minutes to reply. The Hotu Matu'a took seven to capsize. We got all twenty-two out."}
  - {author: "Póliza del Hotu Matu'a, cláusula 20", author_en: "Hotu Matu'a Policy, clause 20", es: "Contra lo que resuelva la Cámara no hay recurso, porque no hay nada por encima del mar.", en: "There is no appeal against the Chamber, because there is nothing above the sea."}
  - {author: "Factores de riesgo, informe anual de la FCU, 2099", author_en: "Risk Factors, FCU annual report, 2099", es: "Nuestros ciudadanos son accionistas, y los accionistas pueden vender.", en: "Our citizens are shareholders, and shareholders can sell."}
  - {author: "Factores de riesgo, informe anual de la FCU, 2099", author_en: "Risk Factors, FCU annual report, 2099", es: "Nuestras fuerzas armadas son un contrato. Un contrato puede no renovarse.", en: "Our armed forces are a contract. A contract may not be renewed."}
  - {author: "Factores de riesgo, informe anual de la FCU, 2099", author_en: "Risk Factors, FCU annual report, 2099", es: "El mar sube, y no logramos ponerle precio.", en: "The sea is rising, and we cannot put a price on it."}
  - {author: "Factores de riesgo, informe anual de la FCU, 2099", author_en: "Risk Factors, FCU annual report, 2099", es: "Tenemos un enemigo que no acepta precio.", en: "We have an enemy that does not accept a price."}
  - {author: "Factores de riesgo, informe anual de la FCU, 2099", author_en: "Risk Factors, FCU annual report, 2099", es: "Hay un escándalo en curso. Casi siempre lo hay.", en: "There is a scandal under way. There almost always is."}
  - {author: "Archivo del Gran Desarme", author_en: "Archive of the Great Disarmament", es: "¿Sabías que...? En 2098, un millón cien mil ciudadanos de la Unión vendieron su acción y se fueron a vivir a las Tierras Sin Ley.", en: "Did you know? In 2098, 1.1 million Union citizens sold their share and moved to the Lawless Lands."}
  - {author: "Archivo del Gran Desarme", author_en: "Archive of the Great Disarmament", es: "¿Sabías que...? El 71% del agua potable de la Unión sale de catorce desalinizadoras de una sola empresa.", en: "Did you know? 71% of the Union's drinking water comes from fourteen desalination plants run by a single company."}
  - {author: "Lectura de un quipu, Cusco, 2099", author_en: "Reading of a Quipu, Cusco, 2099", es: "En el código de los chasquis, una cuerda torcida al revés no cuenta cosas. Cuenta gente.", en: "In the chasqui code, a cord twisted backwards does not count things. It counts people."}
  - {author: "Lectura de un quipu, Cusco, 2099", author_en: "Reading of a Quipu, Cusco, 2099", es: "Una cuerda sola al final del quipu es una pregunta. Si vuelve con el nudo, es sí. Si vuelve desatada, es no.", en: "A lone cord at the end of a quipu is a question. If it returns knotted, it is yes. If it returns untied, it is no."}
  - {author: "El Sapa Inti, ante el quipu", author_en: "The Sapa Inti, before the quipu", es: "Mi padre contaba papas.", en: "My father counted potatoes."}
  - {author: "Lectura de un quipu, Cusco, 2099", author_en: "Reading of a Quipu, Cusco, 2099", es: "Antisuyu, 96 kilómetros: la selva se come lo que se le pone encima.", en: "Antisuyu, 96 kilometres: the jungle eats whatever is laid on it."}
  - {author: "Asignación individual, Plan 2100", author_en: "Individual Allocation, Plan 2100", es: "Ocupación: ninguna requerida.", en: "Occupation: none required."}
  - {author: "Asignación individual, Plan 2100", author_en: "Individual Allocation, Plan 2100", es: "Para calcular el costo de un desacuerdo hacen falta desacuerdos, y la Comuna produce muy pocos.", en: "To measure the cost of a disagreement you need disagreements, and the Commune produces very few."}
  - {author: "Asignación individual, Plan 2100", author_en: "Individual Allocation, Plan 2100", es: "El Plan le recomienda que siga votando según su criterio. El Plan no puede recomendarle cuál es su criterio.", en: "The Plan recommends that you keep voting by your own judgement. The Plan cannot recommend what your judgement is."}
  - {author: "Anneliese Brandt, a lápiz", author_en: "Anneliese Brandt, in pencil", es: "Diez horas. Lo que tardo en leer una novela. Me cobran una novela por año.", en: "Ten hours. As long as it takes me to read a novel. They charge me a novel a year."}
  - {author: "Anneliese Brandt, a lápiz", author_en: "Anneliese Brandt, in pencil", es: "Voté que no dos veces. En la segunda no estuve sola.", en: "I voted no twice. The second time I was not alone."}
