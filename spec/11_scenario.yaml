# =============================================================================
# 11_scenario.yaml — Escenario de arranque (bookmark) y fecha del juego
# =============================================================================
# El mod arranca en 2100. Para eso hacen falta tres cosas:
#
#   1. Un bookmark propio (common/bookmarks/): es lo que muestra la pantalla de
#      selección, con los países destacados arriba.
#   2. Mover la fecha de inicio y de fin del juego (common/defines/). Con la
#      fecha vanilla (1936) el juego no acepta un bookmark en 2100.
#   3. Sacar los bookmarks vanilla de 1936 y 1939 (replace_path de
#      common/bookmarks en el descriptor): con la fecha nueva quedarían
#      apuntando a antes del inicio.
#
# Consecuencia a tener en cuenta: arrancando en 2100, el juego aplica TODA la
# historia vanilla con fecha anterior (las entradas de 1939, 1940...). El
# resto del mundo, que todavía es vanilla, arranca como en 1939 o más. Se
# arregla cuando se reemplace la historia mundial (Q042, fase 5).
# =============================================================================

bookmark:
  id: MEGANATIONS_2100
  src: inferred
  date: "2100.1.1.12"          # Q003: 1 de enero de 2100, mediodía (formato HOI4)
  date_src: inferred
  name:
    english: "The Age of Meganations"
    spanish: "La Era de las Meganaciones"
  name_src: invented
  desc:
    english: "2100. The old nation-states are gone. Eight meganations divide what is left of the planet, each built around the one resource, balance or system it cannot live without."
    spanish: "2100. Los viejos Estados nacionales ya no existen. Ocho meganaciones se reparten lo que queda del planeta, cada una construida alrededor del recurso, equilibrio o sistema sin el que no puede vivir."
  desc_src: inferred
  desc_basis: "§1 — 'cada mega-nación gira alrededor de un recurso, equilibrio o sistema exclusivo'."
  default_country: EFE

  # Países destacados arriba en la pantalla de selección: las 8 meganaciones
  # (2026-09-23). Uno sin states no se destaca (no se puede jugar).
  featured:
    - tag: EFE
      history:
        english: "Aurelio IV rules the Southern Cone in the name of the Earth. The forests are growing back; the people are not asked. Somewhere in the pampas, the first vats of BioSteel are waiting."
        spanish: "Aurelio IV gobierna el Cono Sur en nombre de la Tierra. Los bosques vuelven a crecer; a la gente no se le pregunta. En algún lugar de la pampa, las primeras cubas de Bioacero esperan."
      history_src: invented
      history_basis: "§3.2 y §3.3."

    - tag: ASC
      history:
        english: "The machines do the work and the Allocation Council shares out the output. Nobody is poor in the Commune; nobody is free of the plan either."
        spanish: "Las máquinas trabajan y el Consejo de Asignación reparte lo producido. En la Comuna nadie es pobre; nadie está libre del plan tampoco."
      history_src: invented
    - tag: FCU
      history:
        english: "Four corporations, one board, a continent for sale. Chairwoman Castellane controls the water, and water is the only currency that never falls."
        spanish: "Cuatro corporaciones, un directorio, un continente en venta. La Presidenta Castellane controla el agua, y el agua es la única moneda que nunca cae."
      history_src: invented
    - tag: NRE
      history:
        english: "The legions acclaimed Lucius Varro Imperator. From Gaul to Anatolia, Rome is rebuilding its roads, and its enemies."
        spanish: "Las legiones aclamaron Imperator a Lucius Varro. De la Galia a Anatolia, Roma reconstruye sus caminos, y a sus enemigos."
      history_src: invented
    - tag: SHD
      history:
        english: "Society is a hydraulic system and the Directorate corrects the flow. Four hundred million people, one silent director."
        spanish: "La sociedad es un sistema hidráulico y el Directorio corrige el caudal. Cuatrocientos millones de personas, un director silencioso."
      history_src: invented
    - tag: HSN
      history:
        english: "Half the world's cargo sails through the straits of the High Seas. Whoever holds the lanes holds everyone else."
        spanish: "La mitad de la carga del mundo pasa por los estrechos de la Alta Mar. El que controla las rutas controla a todos los demás."
      history_src: invented
    - tag: NAS
      history:
        english: "The Sun rose again over Cusco after the Ash Winter, and the Sapa Inti was crowned under it. The Andes answer to the Sun now."
        spanish: "El Sol volvió a salir sobre Cusco después del Invierno de Ceniza, y el Sapa Inti fue coronado bajo él. Los Andes le responden al Sol."
      history_src: invented
    - tag: APF
      history:
        english: "A thousand councils, one federation, a whole continent. The Federation has people and land; what it lacks is factories."
        spanish: "Mil consejos, una federación, un continente entero. A la Federación le sobran gente y tierra; le faltan fábricas."
      history_src: invented

  others_history:
    english: "The rest of the world. Not every nation survived the century; those that did must choose a side."
    spanish: "El resto del mundo. No todas las naciones sobrevivieron al siglo; las que lo hicieron tienen que elegir un bando."
  others_history_src: invented

game_dates:
  start: "2100.1.1.12"
  end: "2200.1.1.1"
  end_src: invented
  why: >
    HOI4 corta la partida en END_DATE. Un siglo de margen: no hay nada en el
    doc que diga cuándo termina el escenario.

# -----------------------------------------------------------------------------
# Menú principal (2026-09-23): arte del usuario. El generador busca en
# interface/*.gfx del juego los sprites de fondo del menú principal y escribe
# esta imagen en la MISMA ruta de textura, así la reemplaza sin tocar la
# interfaz. Si el juego usa otro tamaño, se reescala al del original.
# Fuente editable: assets/menu/meganations_menu_source.webp.
# -----------------------------------------------------------------------------
main_menu:
  background: assets/menu/meganations_menu_bg.dds
  src: user_art
