# =============================================================================
technical_notes:
  - id: TN003
    text: >
      HOI4 moderno usa common/characters/*.txt con bloques `advisor`,
      `country_leader`, `corps_commander`, `field_marshal` dentro de un mismo
      personaje, y `recruit_character` en history. La sintaxis vieja de
      create_country_leader en history sigue funcionando pero está deprecada.
      Voy a usar common/characters/, pero quiero confirmarlo contra tu versión
      del juego antes de generar. Ver Q004.

  - id: TN004
    text: >
      Los traits de country_leader deben existir en
      common/country_leader/*.txt. Un trait inexistente rompe la carga.
      Como el doc no da traits para Aurelio IV, la Fase 3 sale sin traits
      salvo que definamos los propios. Ver Q015.
