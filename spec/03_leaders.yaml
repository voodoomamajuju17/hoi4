# =============================================================================
# 03_leaders.yaml — Líderes y personajes
# =============================================================================
# El documento define UN solo líder con biografía: Aurelio IV del EFE.
# Los demás los inventé a pedido del usuario (2026-09-23: "inventá todo"),
# sobre el lore de 01_ideologies.yaml. Están marcados src: invented.
#
# Rasgos (traits): propios del mod, definidos abajo en `leader_traits`. Un
# trait vanilla inventado de memoria rompe la carga (TN004); uno propio no.
# =============================================================================

characters:

  # ---------------------------------------------------------------------------
