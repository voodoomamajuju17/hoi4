      civil: "Ingrid Paillacar Möller"
      regnal:
        english: "Custodian Ingrid Paillacar"
        spanish: "Custodia Ingrid Paillacar"
    born: 2051
    lore: >
      Glacióloga de Punta Arenas, de madre germano-chilena y padre mapuche.
      Pasó veinte años midiendo cómo se morían los hielos de Magallanes antes
      de que el Imperio le diera un uniforme y el título de Custodia Austral.
      Gobierna el sur como un laboratorio: nadie entra ni sale del hielo sin
      su firma. Es leal a Aurelio IV mientras el Imperio siga financiando los
      glaciares.
    roles:
      country_leader:
        ideology: ecofascism
        traits: [pta_glacier_keeper]
    portrait:
      status: placeholder
      path: "gfx/leaders/PTA/ingrid_paillacar.dds"

