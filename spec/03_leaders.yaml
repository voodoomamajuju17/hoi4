      regnal:
        english: "Anahí Quiroga, Voice of the Forest"
        spanish: "Anahí Quiroga, la Voz del Monte"
    born: 2068
    lore: >
      Guardaparques de las Yungas, hija de los comuneros que replantaron el
      Chaco con las manos. Nunca creyó en la corte de Buenos Aires: para ella
      el Imperio traicionó al bosque el día que puso cubas donde había
      árboles. Cuando el monte se levanta, ella habla por él.
    roles:
      country_leader:
        ideology: ecofascism
        traits: [efe_voz_del_monte]
    portrait:
      status: user_art        # retratos alternativos del usuario, 2026-09-23
