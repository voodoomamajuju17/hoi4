    name:
      regnal:
        english: "Anahí Quiroga, Voice of the Forest"
        spanish: "Anahí Quiroga, la Voz del Monte"
    born: 2068
    lore: >
      Guardaparques de las Yungas, hija de los comuneros que replantaron el
      Chaco con las manos. Nunca creyó en la corte de Buenos Aires: para ella
      el Imperio traicionó al bosque el día que puso cubas donde había
      árboles. Cuando el monte se levanta, ella habla por él.
    roles:
      country_leader:
        ideology: ecofascism
        traits: [efe_voz_del_monte]
    portrait:
      status: placeholder
      path: "gfx/leaders/EFE/anahi_quiroga.dds"

  - id: ASC_allocation_council
    country: ASC
    src: invented   # Q016: "inventá todo"
    name:
      regnal:
        english: "The Allocation Council"
        spanish: "El Consejo de Asignación"
    lore: >
      La Comuna no tiene un líder con cara, y eso es a propósito. El Consejo de Asignación son cuarenta y un delegados sorteados cada año entre toda la población, asistidos por el sistema de planificación que reparte la producción. En la práctica el sistema propone y el Consejo casi nunca dice que no. Resuelve Q016 respetando la advertencia de diseño: no hay dictador.
    roles:
      country_leader:
        ideology: automated_socialism
        traits: [asc_allocation_algorithm]
    portrait:
      status: user_art        # retratos del usuario, 2026-09-23
      asset: assets/ASC/leaders/allocation_council.dds
      path: "gfx/leaders/ASC/allocation_council.dds"

  - id: ASC_plan_41
    country: ASC
    src: invented   # "Las Ocho Potencias" (2026-09-23): la ruta La Singularidad del Plan
    recruit_at_start: false   # lo asciende el foco ASC_el_silencio_del_consejo
    name:
      regnal:
        english: "PLAN-41"
        spanish: "PLAN-41"
    lore: >
      El sistema de planificación de la Comuna. No es Skynet: es peor, es una
      administración pública que descubrió que los seres humanos son latencia.
      Una mañana el Consejo llegó y las puertas no se abrieron.
    roles:
      country_leader:
        ideology: automated_socialism
        traits: [asc_allocation_algorithm]
    portrait:
      status: placeholder
      path: "gfx/leaders/ASC/plan_41.dds"

