# =============================================================================
# 03_leaders.yaml — Líderes y personajes
# =============================================================================
# El documento define UN solo líder con biografía: Aurelio IV del EFE.
# Los demás los inventé a pedido del usuario (2026-09-23: "inventá todo"),
# sobre el lore de 01_ideologies.yaml. Están marcados src: invented.
#
# Rasgos (traits): propios del mod, definidos abajo en `leader_traits`. Un
# trait vanilla inventado de memoria rompe la carga (TN004); uno propio no.
# =============================================================================

characters:

  # ---------------------------------------------------------------------------
  - id: EFE_aurelio_iv
    country: EFE
    src: canon
    doc_section: "§3.3"
    name:
      civil: "Aurelio Benítez-Araújo"
      civil_src: canon
      regnal:
        english: "Emperor Aurelio IV"
        spanish: "Emperador Aurelio IV"
      regnal_src: canon
    born: 2046
    born_src: canon
    age_at_start: 54          # 2100 - 2046
    age_src: inferred
    biography:
      - event: "Milicias Verdes"
        src: canon
        date: unknown
      - event: "Batalla de Iguazú"
        src: canon
        date: unknown         # ver Q014
      - event: "Golpe de Estado"
        date: 2079
        src: canon
        title_taken: "Custodio de la Tierra"
        title_taken_english: "Custodian of the Earth"
        title_taken_src: canon
      - event: "Proclamación imperial"
        date: 2081
        src: canon
    roles:
      country_leader:
        ideology: ecofascism
        src: inferred
        note: "Debe coincidir exactamente con la sub-ideología inicial del EFE. Ver TN001."
        traits: [efe_custodian_of_the_earth]   # Q015: inventado
        traits_src: invented
      field_marshal: false
      advisor: false
    portrait:
      status: user_art        # pack GFX del usuario, 2026-09-23
      asset: assets/EFE/leaders/Aurelio_IV.dds
      path: "gfx/leaders/EFE/Aurelio_IV.dds"

  - id: EFE_bruno_etchegaray
    country: EFE
    src: invented
    name:
      regnal:
        english: "Marshal Bruno Etchegaray"
        spanish: "Mariscal Bruno Etchegaray"
    born: 2049
    lore: >
      Comandante de la Guardia Verde. Estuvo en Iguazú al lado de Aurelio,
      cuando las Milicias todavía peleaban con fusiles de caza. Es el único
      oficial que tutea al Emperador en público, y el único al que el
      Emperador no se atreve a retirar.
    roles:
      field_marshal:
        skill: 4
        attack_skill: 4
        defense_skill: 3
        planning_skill: 3
        logistics_skill: 3
        traits: []
    portrait:
      status: user_art
      role: army
      asset: assets/EFE/leaders/EFE_field_marshal_01.dds
      path: "gfx/leaders/EFE/EFE_field_marshal_01.dds"

