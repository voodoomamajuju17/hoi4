      path: "gfx/leaders/EFE/anahi_quiroga.dds"

  - id: ASC_allocation_council
    country: ASC
    src: invented   # Q016: "inventá todo"
    name:
      regnal:
        english: "The Allocation Council"
        spanish: "El Consejo de Asignación"
    lore: >
      La Comuna no tiene un líder con cara, y eso es a propósito. El Consejo de Asignación son cuarenta y un delegados sorteados cada año entre toda la población, asistidos por el sistema de planificación que reparte la producción. En la práctica el sistema propone y el Consejo casi nunca dice que no. Resuelve Q016 respetando la advertencia de diseño: no hay dictador.
    roles:
      country_leader:
        ideology: automated_socialism
        traits: [asc_allocation_algorithm]
    portrait:
      status: user_art        # retratos del usuario, 2026-09-23
      asset: assets/ASC/leaders/allocation_council.dds
      path: "gfx/leaders/ASC/allocation_council.dds"

  - id: ASC_plan_41
