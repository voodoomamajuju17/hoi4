    country: EFE
    src: canon
    doc_section: "§3.3"
    name:
      civil: "Aurelio Benítez-Araújo"
      civil_src: canon
      regnal:
        english: "Emperor Aurelio IV"
        spanish: "Emperador Aurelio IV"
      regnal_src: canon
    born: 2046
    born_src: canon
    age_at_start: 54          # 2100 - 2046
    age_src: inferred
    biography:
      - event: "Milicias Verdes"
        src: canon
        date: unknown
      - event: "Batalla de Iguazú"
        src: canon
        date: unknown         # ver Q014
      - event: "Golpe de Estado"
        date: 2079
        src: canon
