# =============================================================================
# 40_medallas.yaml — Medallas de la Ficha del Líder (2026-11-12)
# =============================================================================
# Pedido del usuario: "para no desperdiciar tanto tile hermoso: en la pantalla del líder
# 3 slots para poner esos tiles, de toda una pila para elegir. Son medallas, bonus para el
# líder o la facción, se desbloquean con decisiones, eventos, focos y tecnología. También
# uno reservado a cada vez que se conquista una capital (solo de meganaciones)".
# Respuestas: bonus del 2% al 6%; los trofeos se acumulan y se elige cuál mostrar, con un
# azulejo de la nación conquistada; cambiar una medalla cuesta 25 de poder político y 30
# días de espera; como máximo 10 medallas por nación (sin contar trofeos).
#
# Cada medalla: n (su número, 1 a 10), tile (el azulejo: assets/<TAG>/ideas/<tile>.dds; el
# nombre de la medalla es el del espíritu), unlock (foco / decision / evento: el que da ese
# espíritu; tecnologia: una lista de alternativas, vale la primera que exista en el juego) y
# bonus (un modificador, del 2% al 6%). Armado con un script a partir de los azulejos y de
# quién da cada espíritu; se puede editar a mano.
# Trofeos: el azulejo y el bonus de cada meganación; se gana al tomar su capital de arranque
# en guerra (la misma marca que el bonus de capital tomada, MEGANATIONS_absorbido_<TAG>).
src: user_request
cambio: {costo: 25, dias: 30}
