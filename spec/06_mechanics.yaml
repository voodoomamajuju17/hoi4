# =============================================================================
# 06_mechanics.yaml — Sistemas nacionales asimétricos
# =============================================================================
# Este es el corazón del diseño según §1: "cada mega-nación gira alrededor de un
# recurso, equilibrio o sistema exclusivo" y "el poder militar no debería poder
# separarse de la infraestructura o del modelo económico que lo sostiene".
#
# El campo `definition_status` es el dato más importante de cada entrada:
#   implementable  — hay loop suficiente para codificarlo
#   partial        — hay loop parcial, faltan números
#   name_only      — solo se recuperó el nombre del sistema
# =============================================================================

mechanics:

  # ===========================================================================
  - id: biosteel
    country: EFE
    definition_status: implementable
    src: canon
    doc_section: "§3.4"
    name:
      english: "BioSteel"
      spanish: "Bioacero"
    name_src: canon
    model: tiered_progression
    model_src: canon
    doc_quote: >
      "funciona como una progresión por niveles. Se recuperó una lógica de
      umbrales —por ejemplo 5 / 10 / 15— que desbloquean mejoras sucesivas.
      Esto lo convierte en una carrera nacional de desarrollo material."
    thresholds: [5, 10, 15]
    thresholds_src: canon
    thresholds_caveat: >
      El doc dice "por ejemplo", o sea que los cita como ilustración, no como
      valores cerrados. Tratarlos como provisionales. Ver Q043 -> unit_caveat.

    # -- Rediseño final (2026-09-23): contador nacional + minijuego ---------------
    # 1ra versión: carbón reskineado -> déficit energético mundial.
    # 2da versión: recurso nuevo -> la interfaz de HOI4 tiene casilleros fijos
    #   por recurso (error.log: "biosteel_checkbox") y no tenía ícono propio:
    #   existía pero no se veía.
    # Versión actual (elegida por el usuario, "B, totalmente"): una VARIABLE
    # del EFE que se muestra en su propio panel de decisiones y se gana o se
    # gasta con decisiones (spec/14_decisions.yaml). No toca la interfaz
    # vanilla ni los recursos del mapa.
    variable:
      name: EFE_biosteel
      country: EFE
      start: 5
      start_src: invented
      start_why: "Con 5 el tier 1 está disponible desde el arranque."
    exclusive_to: EFE
    exclusive_src: user_decision
    counter: variable
    counter_src: canon
    counter_note: >
      Cada umbral (5/10/15) es condición de un foco de La Carrera del
      Bioacero: check_variable sobre EFE_biosteel.
    tiers_mode: exclusive
    tiers_mode_note: "Cada tier reemplaza al anterior (swap_ideas); no se acumulan."
    unknown:
      - "Si se puede perder / decaer."
    see: [Q021, Q043]

  # ===========================================================================
  - id: epi
    country: EFE
    definition_status: name_only
    src: canon
    doc_section: "§3.4"
    name:
      english: "EPI"
      spanish: "EPI"
    acronym_meaning: unknown
    doc_quote: >
      "EPI aparece asociado al EFE como segundo eje mecánico confirmado por
      nombre. No se recuperó de forma fiable su fórmula ni sus efectos exactos,
      así que debe considerarse un sistema pendiente de documentar antes de
      codificarlo de nuevo."
    unknown:
      - "Qué significa la sigla EPI."
      - "Fórmula."
      - "Efectos."
      - "Cómo interactúa con BioSteel."
    see: Q022
    phase3_decision: excluded
    phase3_rationale: >
      El propio doc dice que hay que documentarlo ANTES de codificarlo.
      La vertical slice del EFE sale con BioSteel y sin EPI. Cuando definas EPI
      se agrega al spec y se regenera; no hay que tocar output.

  # ===========================================================================
  - id: compute_power
    country: ASC
    definition_status: implementable
    src: canon
    doc_section: "§4.1"
    name:
      english: "Compute Power"
      spanish: "Poder de Cómputo"
    name_src: canon
    model: capacity_vs_consumption
    loop:
      - "Los datacenters aportan slots/capacidad de red."
      - "Los ejércitos o sistemas autónomos consumen esa capacidad."
      - "Si el consumo supera la capacidad, penalizaciones de organización y suministro."
    loop_src: canon
    design_note_from_doc: >
      "Esta mecánica es una de las más claras del conjunto porque convierte una
      fantasía tecnológica —el ejército autónomo— en un problema logístico y de
      planificación."
    unknown:
      - "Escalas numéricas exactas (cuánta capacidad da un datacenter)."
      - "Fuentes de capacidad además de datacenters."
      - "Magnitud de las penalizaciones de overload."
      - "¿Los datacenters son un building nuevo o un state modifier?"
    see: Q023
    design_v1: >
      "Las Ocho Potencias" (2026-09-23). ASC_computo es la capacidad (0-150,
      arranca en 30): la suben los datacenters (focos y decisiones). Se
      asigna a UNA prioridad: Economía, Investigación, Logística o Guerra;
      cambiarla deja 30 días de espera. La fuerza de la prioridad depende
      del nivel de capacidad: <40, 40-79, 80+. Nunca se maximiza todo.
    variables:
      - { name: ASC_computo, start: 30 }
    note: >
      Es la mecánica mejor definida del documento después de BioSteel: tiene un
      loop cerrado (produce -> consume -> penaliza) y no solo un nombre.
      Candidata natural a segunda facción implementada.

  # ===========================================================================
  - id: efe_monte_e_integracion
    country: EFE
    definition_status: implementable
    src: user_design   # "Las Ocho Potencias" (2026-09-23)
    name: { english: "The Forest and the Integration", spanish: "El Monte y la Integración" }
    design: >
      EFE_control_del_monte: oculto, sube o baja con las decisiones de la
      crisis del Monte; en 60 habilita el golpe de Anahí Quiroga.
      EFE_integracion_yyg / EFE_integracion_pta: etapas 0-3 de la
      integración de los satélites; en 3 se anexan con núcleos.
    variables:
      - { name: EFE_control_del_monte, start: 0 }
      - { name: EFE_integracion_yyg, start: 0 }
      - { name: EFE_integracion_pta, start: 0 }

  # ===========================================================================
  - id: hsn_red_de_nodos
    country: HSN
    definition_status: implementable
    src: user_design
    name: {english: The Node Network, spanish: La Red de Nodos}
    design: 'Ocho nodos físicos (regiones reales del mapa). Un evento oculto mensual cuenta los que la HSN controla: 2+, 4+, 6+ y los 8 dan ideas
      crecientes (con los 8: Cámara Mundial de Compensación). Perder un nodo da una idea de crisis por 180 días. Con Tavake no hay peajes: los nodos
      y la guerra generan Botín.'
    nodes:
    - id: malaca
      names:
      - Singapore
      - Straits Settlements
      - Malaya
      - Kuala Lumpur
    - id: sunda
      names:
      - West Java
      - Banten
      - Batavia
    - id: kanto
      names:
      - Kanto
    - id: manila
      names:
      - Manila
      - Luzon
    - id: taiwan
      names:
      - Taiwan
    - id: hong_kong
      names:
      - Hong Kong
    - id: okinawa
      names:
      - Okinawa
      - Ryukyu
    - id: kyushu
      names:
      - Kitakyūshū
      - Kitakyushu
      - Kyushu
      - Fukuoka
    variables:
    - {name: HSN_nodos, start: 0}
    - {name: HSN_nodos_prev, start: 0}
    - {name: HSN_botin, start: 0}

  # ===========================================================================
  - id: nas_qhapaq_nan_e_inti_soma
    country: NAS
    definition_status: implementable
    src: user_design
    name: {english: Qhapaq Ñan and Inti-Soma, spanish: Qhapaq Ñan e Inti-Soma}
    design: 'Inti-Soma: la luz sagrada, 0 a NAS_inti_max (100, 150 o 200 con los Templos-Batería). Las Granjas del Sol suman NAS_granjas por mes
      (evento oculto). Se gasta en ceremonias. Con la sobrecarga se puede pasar el máximo, con riesgo de La Noche del Sol. Qhapaq Ñan: el camino
      sale de la capital y se extiende a regiones vecinas ya conectadas; las regiones conectadas se integran más fácil. Los cuatro Suyus son misiones
      geográficas: controlar sus regiones las completa.'
    suyus:
      cuntisuyu:
      - - Lima
      - - Arequipa
      - - Tacna-Moquegua
        - Tacna
      chinchaysuyu:
      - - Ecuador
      - - La Libertad
      - - Cundinamarca
      antisuyu:
      - - Loreto
      - - Ucayali
      - - Amazonas
      collasuyu:
      - - La Paz
      - - Santa Cruz
      - - Antofagasta
    variables:
    - {name: NAS_inti, start: 20}
    - {name: NAS_inti_max, start: 100}
    - {name: NAS_granjas, start: 1}
    - {name: NAS_integracion_zng, start: 0}
    - {name: NAS_integracion_zll, start: 0}

  # ===========================================================================
  - id: apf_integracion_federal
    country: APF
    definition_status: implementable
    src: user_design
    name: {english: Federal Integration, spanish: La Integración Federal}
    design: Cada miembro (Tierras Altas, Cabo) tiene Desarrollo e Integración de 0 a 100. Invertir sube el Desarrollo y construye en el miembro;
      integrar sube la Integración, que con Amara no puede pasar al Desarrollo (+10 por paso) y con Diallo sí (+25). En 100 se anexa con núcleos;
      con Diallo, con territorios difíciles. El Plan de Desarrollo Regional desarrolla regiones propias una por una en el mapa.
    variables:
    - {name: APF_desarrollo_zet, start: 20}
    - {name: APF_integracion_zet, start: 10}
    - {name: APF_desarrollo_zsa, start: 20}
    - {name: APF_integracion_zsa, start: 10}

  # ===========================================================================
  - id: shd_tres_caudales
    country: SHD
    definition_status: implementable
    src: user_design
    name: {english: The Three Flows, spanish: Los Tres Caudales}
    design: 'Producción, Orden y Pueblo (0-100; arrancan 60/55/40). Cada decisión sube uno y baja otros. Los tres entre 45 y 55: Armonía Perfecta;
      entre 35 y 65: Armonía Parcial; alguno por debajo de 20: Desborde. Con Zhou (La Gran Crecida) el Pueblo puede llegar a 130 y sube solo cada
      mes: 80/100/120 dan la Crecida I/II/III (ejército más brutal, producción más baja) y con Orden bajo hay huelgas.'
    variables:
    - {name: SHD_produccion, start: 60}
    - {name: SHD_orden, start: 55}
    - {name: SHD_pueblo, start: 40}
    - {name: SHD_integracion_zkr, start: 0}
    - {name: SHD_integracion_zst, start: 0}

  # ===========================================================================
  - id: civil_military_balance
    country: FCU
    definition_status: partial
    src: canon
    doc_section: "§5"
    name:
      english: "Civil-Military Balance"
      spanish: "Equilibrio Civil-Militar"
    model: two_pole_balance
    model_src: canon
    doc_quote: >
      "El sistema debería hacer que militarizarse tenga un coste real sobre la
      economía civil, y viceversa."
    hoi4_implementation_candidates:
      - approach: power_balance
        note: >
          HOI4 tiene un sistema nativo de "power balance" (barra de dos polos
          con rangos que aplican modificadores). Encaja casi exactamente con lo
          que describe el doc. Necesito confirmar que tu versión del juego lo
          soporta antes de comprometerlo. Ver Q004.
    unknown:
      - "Rango de la barra y qué la mueve."
      - "Modificadores en cada extremo."
    see: Q024

  # ===========================================================================
  - id: four_corporations
    country: FCU
    definition_status: implementable
    src: user_design   # "Las Ocho Potencias" (2026-09-23)
    doc_section: "§5"
    name:
      english: "The Board of Four"
      spanish: "El Directorio de las Cuatro"
    count: 4
    model: influence_actors
    doc_quote: "Cuatro corporaciones con influencia propia."
    design: >
      Cuatro influencias de 0 a 100 que arrancan en 50. Los contratos
      (14_decisions.yaml -> FCU_directorio_category) benefician a una o dos y
      perjudican a las otras. Las cuatro entre 40 y 60 -> Sinergia del
      Directorio. Alguna por debajo de 15 -> Guerra Corporativa (sabotajes,
      filtraciones, demandas). Meridian por encima de 70 con dos rivales por
      debajo de 25 -> se habilita La OPA Hostil (ruta de Rourke).
      Versión 1 sin interfaz propia: variables + decisiones + ideas.
    variables:
      - { name: FCU_castellane, start: 50 }   # Castellane Water Trust: agua, desalinizadoras
      - { name: FCU_halvorsen, start: 50 }    # Halvorsen-Ito Agrosystems: comida
      - { name: FCU_meridian, start: 50 }     # Meridian Kinetics: armas y robótica
      - { name: FCU_obsidian, start: 50 }     # Obsidian Ledger: finanzas y datos
    thresholds: { synergy_min: 40, synergy_max: 60, crisis_below: 15, opa_meridian: 70, opa_rivals_below: 25 }
    see: Q017

