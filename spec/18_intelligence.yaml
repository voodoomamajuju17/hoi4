# =============================================================================
# 2100 Meganations — Inteligencia
# =============================================================================
# La Guerra en las Sombras (operaciones propias contra cada potencia,
# contrainteligencia y puntaje de infiltración) se sacó el 2026-10-04 a pedido
# del usuario: "abortar" (siempre en 0, no se entendía y no era divertida).
# Queda el espionaje del juego base, con las mejoras de la agencia renombradas.
# =============================================================================

# Mejoras de la agencia (2026-09-30, "cambiá las mejoras de inteligencia"):
# nombres de 2100 en lugar de los de los años 40. Se buscan por el texto que
# el juego muestra hoy en español (`was`), así no se adivina ninguna clave.
# El ícono: arte/pedidos (agency_upgrade_icon) -> assets/agency/<id>.dds; el
# generador lo escribe sobre la textura que usa esa mejora.
