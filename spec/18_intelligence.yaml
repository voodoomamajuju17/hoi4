  - {id: agencia_criptoanalisis_cuantico, was: "Decodificación asistida", english: "Quantum Cryptanalysis", spanish: "Criptoanálisis Cuántico", art: "a quantum processor with a cracked padlock"}
  - {id: agencia_academia_de_criptografia, was: "Escuela de cifrado del gobierno", english: "Cryptography Academy", spanish: "Academia de Criptografía", art: "a lecture hall with equations on a holographic board"}
  - {id: agencia_cifrado_poscuantico, was: "Codificación asistida", english: "Post-quantum Encryption", spanish: "Cifrado Poscuántico", art: "a lattice-shaped shield around a key"}
