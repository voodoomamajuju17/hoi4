  - {id: agencia_interrogatorio_ia, was: "Técnicas de interrogatorio", english: "AI-Assisted Interrogation", spanish: "Interrogatorio Asistido por IA", art: "an interrogation table with a floating AI waveform"}
  - {id: agencia_ingenieria_social, was: "Entrenamiento diplomático", english: "Social Engineering", spanish: "Ingeniería Social", art: "two masks, one smiling, in front of a network graph"}
