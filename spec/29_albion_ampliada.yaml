      todavía le zumba cuando llueve.
    roles:
      advisor: {slot: political_advisor, cost: 150, traits: [zal_fut_min_ingeniero_de_encaje]}
    portrait: {path: gfx/leaders/ZAL/ZAL_fut_min_mcallister.dds, role: civilian, placeholder: false}
  - id: ZAL_fut_min_byrne
    country: ZAL
    src: user_request
    recruit_in_history: false
    name: {regnal: {english: Advocate Niamh Byrne, spanish: Defensora Niamh Byrne}}
    born: 2059
    lore: Abogada de Galway, la única ministra que no tiene encaje. Representa a los Desconectados en el consejo y
      toma notas en un cuaderno de papel que la red no puede leer.
    roles:
      advisor: {slot: political_advisor, cost: 150, traits: [zal_fut_min_defensora_desconectados]}
    portrait: {path: gfx/leaders/ZAL/ZAL_fut_min_byrne.dds, role: civilian, placeholder: false}
  - id: ZAL_fut_min_penhallow
    country: ZAL
    src: user_request
    recruit_in_history: false
    name: {regnal: {english: Doctor Rhys Penhallow, spanish: Doctor Rhys Penhallow}}
    born: 2064
    lore: Neurocientífico de Cornualles. Estudia los sueños compartidos de la red y anota cada mañana el sueño de
      treinta millones de personas, que es siempre el mismo.
    roles:
      advisor: {slot: theorist, cost: 100, traits: [zal_fut_min_neurocientifico]}
    portrait: {path: gfx/leaders/ZAL/ZAL_fut_min_penhallow.dds, role: civilian, placeholder: false}
  - id: ZAL_fut_mando_achebe
    country: ZAL
    src: user_request
    recruit_in_history: false
    name: {regnal: {english: General Marcus Achebe-Lowe, spanish: General Marcus Achebe-Lowe}}
    born: 2062
    lore: El primer general con un puerto detrás de la oreja. Manda el ejército desde adentro de la cabeza de cada
      soldado, y dice que es como mandar a un solo hombre muy grande.
    roles:
      advisor: {slot: army_chief, ledger: army, cost: 100, traits: [mn_mando_organizacion]}
    portrait: {path: gfx/leaders/ZAL/ZAL_fut_mando_achebe.dds, role: army, placeholder: false}
  - id: ZAL_fut_mando_strachan
    country: ZAL
    src: user_request
    recruit_in_history: false
    name: {regnal: {english: Admiral Fiona Strachan, spanish: Almirante Fiona Strachan}}
    born: 2060
    lore: Capitana de un pesquero de Aberdeen hasta los cuarenta. Ahora sus escoltas navegan en formación perfecta sin
      una sola orden por radio.
    roles:
      advisor: {slot: navy_chief, ledger: navy, cost: 100, traits: [mn_mando_armada_escolta]}
    portrait: {path: gfx/leaders/ZAL/ZAL_fut_mando_strachan.dds, role: navy, placeholder: false}
  - id: ZAL_fut_mando_malhotra
    country: ZAL
    src: user_request
    recruit_in_history: false
    name: {regnal: {english: Air Marshal Dev Malhotra, spanish: Mariscal del Aire Dev Malhotra}}
    born: 2067
    lore: Piloto de drones de Leicester que vuela cuarenta máquinas a la vez con los ojos cerrados. Dice que el cielo
      se siente como una bandada.
    roles:
      advisor: {slot: air_chief, ledger: air, cost: 100, traits: [mn_mando_aire_seguridad]}
    portrait: {path: gfx/leaders/ZAL/ZAL_fut_mando_malhotra.dds, role: army, placeholder: false}
  - id: ZAL_fut_mando_munro
    country: ZAL
    src: user_request
    recruit_in_history: false
    name: {regnal: {english: General Eilidh Munro, spanish: General Eilidh Munro}}
    born: 2068
    lore: Planificadora del Estado Mayor de Inverness. Sus planes los piensa el país entero durante una noche, y ella
      solo los firma a la mañana.
    roles:
