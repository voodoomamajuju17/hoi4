# =============================================================================
# 29_albion_ampliada.yaml — Gran Bretaña (ZAL), segunda parte (2026-11-01)
# =============================================================================
# Pedido del usuario: "Crear contenido para Japón y GB hasta que sean, al menos,
# 65% del promedio de una meganación. No tocar focos. [...] Crear ministros,
# generales. [...] En GB los que existen para neovictorian no existen para
# trans-humanist."
#
# Tres épocas, una sola variable que las separa:
#   ZAL_ruta: 0 la República Obrera ludita (satélite de la Comuna o recién
#   suelta), 1 Hacia el Futuro (transhumanista), 2 Hacia el Pasado
#   (neovictoriana). La fija el primer foco raíz que termina
#   (ZAL_hacia_el_futuro o ZAL_hacia_el_pasado) y no cambia más.
# Personajes: los 13 de cada camino no se reclutan al empezar
# (recruit_in_history: false). Los recluta ZAL_pulso cuando se fija la ruta, y
# solo los de esa ruta: los neovictorianos no existen en la Albión transhumanista
# y al revés. Ashworth, Kelly y Pritchard (luditas) siguen en las dos.
# Sincronía (ruta 1, 0-100): cuánta gente vive conectada a la red de Londres.
#   Sube con los focos y las decisiones; cada tramo trae su espíritu y cada
#   umbral (25, 50, 75, 100) un evento.
# Pompa (ruta 2, 0-100): cuánto se cree la nación su propio Imperio. Baja 2 por
#   mes (el espectáculo hay que alimentarlo); 70 o más, "¡Reina, Britannia!";
#   30 o menos, "Se Cae el Telón"; 10 o menos, la conspiración republicana.
# Pulso: el pulso mundial arranca meganations_albion.30 (oculto, mensual) en
#   cuanto existe ZAL; el evento se vuelve a disparar solo cada 30 días. La marca
#   ZAL_pulso_vivo (45 días, la renueva cada pulso) evita pulsos repetidos.
# Eventos sueltos: ZAL_eventos_pulso tira uno por vez (después, 60 días de
#   espera), cada uno una sola vez y solo si se cumple su condición.
# =============================================================================

extend_scripted_effects:
  MEGANATIONS_eventos_mundiales:
  - effect: if
    when:
      all:
      - {country_exists: ZAL}
      - country: {tag: ZAL, when: {not_flag: ZAL_pulso_vivo}}
    then:
    - effect: scope
      target: ZAL
      effects:
      - {effect: flag, value: ZAL_pulso_vivo, days: 45}
    - {effect: event, id: meganations_albion.30, days: 2, target: ZAL}

decisions:
  variable_names:
    ZAL_ruta: {english: Road of Albion, spanish: Camino de Albión}
    ZAL_sincronia: {english: Synchrony, spanish: Sincronía}
    ZAL_pompa: {english: Pomp, spanish: Pompa}

  scripted_effects:
  # ---------------------------------------------------------------------------
  # El pulso de Albión
  # ---------------------------------------------------------------------------
  - id: ZAL_pulso
    effects:
    - effect: if
      when: {not_flag: ZAL_lista}
      then:
      - {effect: flag, value: ZAL_lista}
      - {effect: set_variable, var: ZAL_ruta, value: 0}
      - {effect: event, id: meganations_albion.31, days: 5}
    # el camino: lo fija el primer foco raíz y recluta solo a los suyos
    - effect: if
      when: {all: [{variable_is: {var: ZAL_ruta, value: 0}}, {focus: ZAL_hacia_el_futuro}]}
      then:
      - {effect: set_variable, var: ZAL_ruta, value: 1}
      - {effect: set_variable, var: ZAL_sincronia, value: 10}
      - {effect: run, value: ZAL_reclutar_futuro}
      - {effect: event, id: meganations_albion.60, days: 2}
    - effect: if
      when: {all: [{variable_is: {var: ZAL_ruta, value: 0}}, {focus: ZAL_hacia_el_pasado}]}
      then:
      - {effect: set_variable, var: ZAL_ruta, value: 2}
      - {effect: set_variable, var: ZAL_pompa, value: 40}
      - {effect: run, value: ZAL_reclutar_pasado}
      - {effect: event, id: meganations_albion.80, days: 2}
    - effect: if
      when: {variable_is: {var: ZAL_ruta, value: 1}}
      then:
      - {effect: run, value: ZAL_sincronia_pulso}
    - effect: if
      when: {variable_is: {var: ZAL_ruta, value: 2}}
      then:
      - {effect: run, value: ZAL_pompa_pulso}
    - {effect: run, value: ZAL_eventos_pulso}

  - id: ZAL_reclutar_futuro
    effects:
    - {effect: recruit, character: ZAL_fut_min_harrow}
    - {effect: recruit, character: ZAL_fut_min_nwosu}
    - {effect: recruit, character: ZAL_fut_min_mcallister}
    - {effect: recruit, character: ZAL_fut_min_byrne}
    - {effect: recruit, character: ZAL_fut_min_penhallow}
    - {effect: recruit, character: ZAL_fut_mando_achebe}
    - {effect: recruit, character: ZAL_fut_mando_strachan}
    - {effect: recruit, character: ZAL_fut_mando_malhotra}
    - {effect: recruit, character: ZAL_fut_mando_munro}
    - {effect: recruit, character: ZAL_fut_mariscal_grant}
    - {effect: recruit, character: ZAL_fut_gen_rook}
    - {effect: recruit, character: ZAL_fut_gen_chandran}
    - {effect: recruit, character: ZAL_fut_alm_calder}

  - id: ZAL_reclutar_pasado
    effects:
    - {effect: recruit, character: ZAL_vic_min_fenwick}
    - {effect: recruit, character: ZAL_vic_min_ravensworth}
    - {effect: recruit, character: ZAL_vic_min_kettering}
    - {effect: recruit, character: ZAL_vic_min_thorne}
    - {effect: recruit, character: ZAL_vic_min_wexley}
    - {effect: recruit, character: ZAL_vic_mando_pembroke}
    - {effect: recruit, character: ZAL_vic_mando_halloway}
    - {effect: recruit, character: ZAL_vic_mando_ashby}
    - {effect: recruit, character: ZAL_vic_mando_hartigan}
    - {effect: recruit, character: ZAL_vic_mariscal_wrexham}
    - {effect: recruit, character: ZAL_vic_gen_montague}
    - {effect: recruit, character: ZAL_vic_gen_carrow}
    - {effect: recruit, character: ZAL_vic_alm_ormsby}

  # ---------------------------------------------------------------------------
  # Sincronía: la red de Londres (Hacia el Futuro)
  # ---------------------------------------------------------------------------
  - id: ZAL_sincronia_pulso
    effects:
    - effect: if
      when: {focus: ZAL_londres_reconectada}
      then:
      - {effect: add_variable, var: ZAL_sincronia, value: 1}
    - effect: if
      when: {focus: ZAL_los_implantes_de_manchester}
      then:
      - {effect: add_variable, var: ZAL_sincronia, value: 1}
    - effect: if
      when: {focus: ZAL_la_mente_colmena}
      then:
      - {effect: add_variable, var: ZAL_sincronia, value: 1}
    - {effect: clamp, var: ZAL_sincronia, min: 0, max: 100}
    # un espíritu por tramo
    - {effect: remove_dynamic_modifier, id: ZAL_media_conexion}
    - {effect: remove_dynamic_modifier, id: ZAL_red_despierta}
    - {effect: remove_dynamic_modifier, id: ZAL_un_solo_pulso}
    - effect: if
      when: {variable_between: {var: ZAL_sincronia, min: 25, max: 59}}
      then:
      - {effect: dynamic_modifier, id: ZAL_media_conexion}
    - effect: if
      when: {variable_between: {var: ZAL_sincronia, min: 60, max: 89}}
      then:
      - {effect: dynamic_modifier, id: ZAL_red_despierta}
    - effect: if
      when: {variable_at_least: {var: ZAL_sincronia, value: 90}}
      then:
      - {effect: dynamic_modifier, id: ZAL_un_solo_pulso}
    # los umbrales, una vez cada uno
    - effect: if
      when: {all: [{variable_at_least: {var: ZAL_sincronia, value: 25}}, {not_flag: ZAL_sinc_25}]}
      then:
      - {effect: flag, value: ZAL_sinc_25}
      - {effect: event, id: meganations_albion.62, days: 3}
    - effect: if
      when: {all: [{variable_at_least: {var: ZAL_sincronia, value: 50}}, {not_flag: ZAL_sinc_50}]}
      then:
      - {effect: flag, value: ZAL_sinc_50}
      - {effect: event, id: meganations_albion.63, days: 3}
    - effect: if
      when: {all: [{variable_at_least: {var: ZAL_sincronia, value: 75}}, {not_flag: ZAL_sinc_75}]}
      then:
      - {effect: flag, value: ZAL_sinc_75}
      - {effect: event, id: meganations_albion.64, days: 3}
    - effect: if
      when: {all: [{variable_at_least: {var: ZAL_sincronia, value: 100}}, {not_flag: ZAL_sinc_100}]}
      then:
      - {effect: flag, value: ZAL_sinc_100}
      - {effect: event, id: meganations_albion.65, days: 3}

  # ---------------------------------------------------------------------------
  # Pompa: el teatro del Imperio (Hacia el Pasado)
  # ---------------------------------------------------------------------------
  - id: ZAL_pompa_pulso
    effects:
    - {effect: add_variable, var: ZAL_pompa, value: -2}
    - effect: if
      when: {focus: ZAL_la_camara_de_los_lores}
      then:
      - {effect: add_variable, var: ZAL_pompa, value: 1}
    - {effect: clamp, var: ZAL_pompa, min: 0, max: 100}
    - effect: if
      when: {variable_at_least: {var: ZAL_pompa, value: 70}}
      then:
      - {effect: dynamic_modifier, id: ZAL_reina_britannia}
      - effect: if
        when: {not_flag: ZAL_pompa_70}
        then:
        - {effect: flag, value: ZAL_pompa_70}
        - {effect: event, id: meganations_albion.82, days: 3}
      else:
      - {effect: remove_dynamic_modifier, id: ZAL_reina_britannia}
    - effect: if
      when: {variable_below: {var: ZAL_pompa, value: 31}}
      then:
      - {effect: dynamic_modifier, id: ZAL_telon_cae}
      - effect: if
        when: {not_flag: ZAL_pompa_30}
        then:
        - {effect: flag, value: ZAL_pompa_30}
        - {effect: event, id: meganations_albion.83, days: 3}
      else:
      - {effect: remove_dynamic_modifier, id: ZAL_telon_cae}
    - effect: if
      when: {all: [{variable_below: {var: ZAL_pompa, value: 11}}, {not_flag: ZAL_pompa_10}]}
      then:
      - {effect: flag, value: ZAL_pompa_10}
      - {effect: event, id: meganations_albion.84, days: 3}

  # ---------------------------------------------------------------------------
  # Los eventos sueltos: uno por vez, cada uno una sola vez
