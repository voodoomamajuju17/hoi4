# =============================================================================
# Cronología antigua del EFE — doc §12
# =============================================================================
efe_old_chronology:
  status: NOT_CANON
  written_for: "una versión situada alrededor de 2080"
  events:
    - { year: 2041, event: "Era del Colapso" }
    - { year: 2048, event: "Desastre de Atacama" }
    - { year: 2052, event: "Revolución de la Tierra Viva / fundación (versión antigua)" }
    - { year: 2054, event: "Restauración Total / Guardia Verde" }
    - { year: 2056, event: "Bloqueo de Valparaíso" }
    - { year: 2060, event: "Reforma Cultural Verde" }
    - { year: 2064, event: "Purificación Continental / protectorados" }
    - { year: 2067, event: "Operación Raíz Profunda" }
    - { year: 2070, event: "Crisis del Litoral" }
    - { year: 2072, event: "Pacto de Bosques Eternos con el Neo Andean Sky Kingdom" }
    - { year: 2080, event: "Guerra fría verde; capital llamada Gaia; reeducación ambiental" }
  main_incompatibility:
    src: canon
    text: >
      La versión posterior fija el golpe de Aurelio IV en 2079 y su coronación
      en 2081. La "fundación" de 2052 no puede trasladarse sin decidir si fue un
      precursor, un primer régimen, o una cronología descartada.
  additional_incompatibility_detected_by_me:
    src: inferred
    text: >
      La cronología vieja dice que en 2080 la capital se llamaba "Gaia".
      El canon actual dice que la capital es Buenos Aires (§3.3 / §16).
      Si el mod arranca en 2100, o hubo un renombre entre 2080 y 2100, o la
      capital "Gaia" pertenece a la línea descartada. No lo resolví.
    see: Q040
  usage_in_spec:
    - >
      "Restauración Total" (2054) se reutilizó SOLO como nombre de rama de focos
      del EFE en 07_focus_trees.yaml. Es el único préstamo. Ver Q020.
    - >
      "Guardia Verde" (2054) aparece en una descripción de idea. Ojo: el canon
      actual dice "Milicias Verdes" (§3.3), no "Guardia Verde". Pueden ser la
      misma organización en dos momentos, o dos cosas distintas. Ver Q041.
  salvageable_ideas:
    - "Desastre de Atacama (2048) — evento fundacional de trauma ecológico."
    - "Bloqueo de Valparaíso (2056) — encaja con la autarquía canon."
    - "Pacto de Bosques Eternos (2072) — único vínculo bilateral EFE-NASK del doc."
    - "Operación Raíz Profunda (2067) — buen nombre para una decisión militar."
