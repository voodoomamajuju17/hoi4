# =============================================================================
# 10_legacy_lore.yaml — Material histórico / NO CANON
# =============================================================================
# Nada de este archivo se genera. Es un banco de ideas.
#
# El generador de la Fase 2 debe IGNORAR este archivo por completo. Existe para
# que el material viejo no se pierda y para que quede explícito qué NO hay que
# importar por accidente.
#
# El documento es muy insistente en esto (§11, §12, §10.1): hay dos rosters
# previos con mapas incompatibles, y mezclarlos rompe el canon actual.
# =============================================================================

status: NOT_CANON
generator_must_ignore: true

# =============================================================================
# Genealogía del roster (doc §11)
# =============================================================================
roster_evolution:
  src: canon   # la tabla de correspondencias sí es canon; las entidades viejas no
  mappings:
    - old: "Ecofascist Empire"
      new: EFE
      relation: "Continuidad directa"
    - old: "Fully Automated Socialist Kingdom"
      new: ASC
      relation: "Linaje conceptual claro; nombre/forma política revisados"
    - old: "Ultracapitalistic Republic"
      new: FCU
      relation: "Linaje conceptual probable"
    - old: "Andean Consortium"
      new: NAS
      relation: "Precursor temático; equivalencia NO formalmente recuperada"
    - old: "Oceanic Cooperative"
      new: HSN
      relation: "Precursor temático; equivalencia NO formalmente recuperada"
    - old: "Pan-African Alliance"
      new: APF
      relation: "Precursor temático claro"
    - old: "New Roman Axis"
      new: NRE
      relation: "Linaje romano claro; MAPA VIEJO DESCARTADO"
    - old: "Seleucid Restart"
      new: SHD
      relation: "NO hay continuidad recuperada; el roster cambió"

# =============================================================================
# New Roman Axis (2023) — doc §10.1
# =============================================================================
new_roman_axis:
  status: NOT_CANON
  capital: "Roma"
  leader: "Grand Imperator Augustus Valerius"
  ideology: "fascista"
  territory: ["Italia", "España", "Grecia", "sur de Francia", "Hungría",
              "Argentina", "Uruguay", "Japón", "Corea"]
  units: ["Imperial Legionnaire"]
  technologies: ["Architectural Marvels", "Refined Propaganda"]
  focuses: ["Path of Conquest", "Cultural Hegemony"]
  incompatibility: >
    Incluye Argentina y Uruguay, que en el canon actual son núcleo del EFE.
    El doc dice textualmente que "debe tratarse como borrador histórico, no
    como canon de NRE".
  salvageable_ideas:
    - "Nombre de unidad 'Imperial Legionnaire' — encaja con la mecánica Legiones."
    - "Tecnologías 'Architectural Marvels' y 'Refined Propaganda'."
    - "Focos 'Path of Conquest' / 'Cultural Hegemony'."
  do_not_salvage:
    - "El mapa entero."
    - "Augustus Valerius como líder (ver 03_leaders.yaml)."

