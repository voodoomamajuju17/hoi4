# =============================================================================
# 08_territory.yaml — Reparto territorial sobre el mapa vanilla
# =============================================================================
# Estrategia: reskin del mapa vanilla. Mismos states y provincias, reasignados
# y renombrados. NO se generan bitmaps.
#
# RESOLUCIÓN (Q007, Q035 — 2026-09-23): el generador lee history/states/ de la
# instalación y resuelve cada territorio en tiempo de build con el bloque
# `resolve`. Nunca se escribe un state ID a mano.
#
#   { owner: ARG }             todos los states que ARG tiene en vanilla
#   { state: [nombre, ...] }   el state cuyo nombre en inglés es alguno de esos
#                              (sin distinguir mayúsculas ni tildes)
#
# Prioridad: un `state` explícito le gana a un `owner`. Así las exclusiones
# salen solas: el EFE toma todo ARG, pero "Formosa" la pide YYG por nombre y
# se la queda YYG. Dos `state` explícitos sobre el mismo state = error.
#
# Un nombre que no aparece en el juego NO frena el build: se avisa con los
# nombres parecidos que sí existen, para corregir el spec con el reporte.
# =============================================================================

strategy: vanilla_reskin
resolution_method: vanilla_lookup_at_build
see: [Q007, Q035]

# =============================================================================
territories:

  # ---------------------------------------------------------------------------
  EFE:
    src: canon
    doc_section: "§3.1"
    doc_quote: >
      "Núcleo confirmado en la revisión más reciente: Argentina, Uruguay, Chile
      —sin Tierra del Fuego ni Magallanes— y Rio Grande do Sul."
    capital: "Buenos Aires"
    capital_src: canon
    core_regions:
      - name: "Argentina"
        exclusions: ["Tierra del Fuego (parte argentina)", "Misiones", "Formosa"]
        exclusions_src: inferred
        exclusions_note: >
          Misiones y Formosa se excluyen porque el doc las asigna explícitamente
          al satélite YYG. Tierra del Fuego va a PTA. La exclusión es deducción
          mía a partir de las listas de los satélites, no está dicha así.
        state_ids: unknown
      - name: "Uruguay"
        state_ids: unknown
      - name: "Chile"
        exclusions: ["Magallanes", "Tierra del Fuego (parte chilena)"]
        exclusions_src: canon
        exclusions_note: "El doc dice literalmente '—sin Tierra del Fuego ni Magallanes—'."
        state_ids: unknown
      - name: "Rio Grande do Sul"
        state_ids: unknown
    resolve:
      - { owner: ARG }
      - { owner: URG }
      - { owner: CHL }
      - { state: ["Rio Grande do Sul"] }
    resolve_src: inferred
    resolve_note: >
      ARG, URG y CHL son los TAG vanilla de Argentina, Uruguay y Chile. Las
      exclusiones (Tierra del Fuego, Magallanes, Misiones, Formosa) salen solas
      porque las piden los satélites por nombre.
    capital_state: ["Buenos Aires"]
    cores: all_core_regions
    cores_src: inferred
    cores_note: "El doc dice 'núcleo territorial'; lo interpreto como cores del EFE."

  # ---------------------------------------------------------------------------
  PTA:
    src: canon
    doc_section: "§3.1"
    doc_quote: 'Satélite "Patagonia Austral": Tierra del Fuego, Magallanes y Malvinas.'
    core_regions:
      - name: "Tierra del Fuego"
        state_ids: unknown
        note: >
          En HOI4 vanilla Tierra del Fuego puede estar repartida entre states
          argentinos y chilenos, o ser un solo state. Hay que verificarlo contra
          los archivos reales antes de partirla.
      - name: "Magallanes"
        state_ids: unknown
      - name: "Malvinas / Falkland Islands"
        state_ids: unknown
    resolve:
      - { state: ["Tierra del Fuego"] }
      - { state: ["Magallanes"] }
      - { state: ["Falkland Islands", "Malvinas", "Islas Malvinas"] }
    resolve_src: inferred
    capital: "Punta Arenas"
    capital_state: ["Magallanes"]
    capital_src: invented   # Q012: "elegí las capitales como se te cante"
    capital_why: "Punta Arenas es la ciudad más grande del extremo sur y mira a los dos océanos."
    canon_note: >
      Malvinas estaba en territorio directo del EFE en una versión anterior.
      La revisión posterior la mueve acá. Prevalece esta. (§3.1)

  # ---------------------------------------------------------------------------
  YYG:
    src: canon
    doc_section: "§3.1"
    doc_quote: >
      'Satélite "Yvytu Ykua Guasu": Paraguay, Mato Grosso, Paraná, Santa
      Catarina, Misiones y Formosa.'
    core_regions:
      - name: "Paraguay"
        state_ids: unknown
      - name: "Mato Grosso"
        state_ids: unknown
        ambiguity: >
          En Brasil moderno existen Mato Grosso y Mato Grosso do Sul. El doc
          dice solo "Mato Grosso". No sé si incluye ambos. Ver Q036.
      - name: "Paraná"
        state_ids: unknown
      - name: "Santa Catarina"
        state_ids: unknown
      - name: "Misiones"
        state_ids: unknown
      - name: "Formosa"
        state_ids: unknown
    resolve:
      - { owner: PAR }
      - { state: ["Mato Grosso"] }
      # Q036: "sí, los dos". En 1.19.3 no existe un state "Mato Grosso do Sul";
      # el usuario pidió Ponta Porã (2026-09-23) para dar continuidad
      # territorial entre Paraguay y el resto del satélite.
      - { state: ["Ponta Porã", "Ponta Pora", "Punta Pora", "Punta Porá", "Mato Grosso do Sul"] }
      - { state: ["Parana", "Paraná"] }
      - { state: ["Santa Catarina"] }
      - { state: ["Misiones", "Región Mesopotámica", "Region Mesopotamica"] }   # 1.19.3: Misiones está dentro de la Mesopotamia
      - { state: ["Formosa"] }
    resolve_src: inferred
    capital: "Asunción"
    capital_state: ["Paraguay", "Central Paraguay"]
    capital_src: invented   # Q012
    capital_why: "Asunción: la única capital histórica dentro del satélite."

  # ---------------------------------------------------------------------------
  # ===========================================================================
  # Reparto del mundo — inventado a pedido del usuario (2026-09-23), Q010.
  # Selectores por TAG de 1936 y por continente del mapa; ver cabecera.
  # Lo que no pide nadie queda vanilla: son los países libres (Francia,
  # la URSS, Japón, India, Medio Oriente...).
  # ===========================================================================
  NAS:
    src: invented
    lore: >
      Los Andes centrales: el imperio del Sol volvió donde estuvo el Tahuantinsuyo.
    resolve:
      - { owner: PRU }
      - { owner: BOL }
      - { owner: ECU }
    capital_state: ["Cusco", "Cuzco", "Lima"]

  ZNG:
    src: invented
    lore: >
      Colombia y Panamá: el canal y las lluvias.
    resolve:
      - { owner: COL }
      - { owner: PAN }

  ZLL:
    src: invented
    lore: >
      Venezuela.
    resolve:
      - { owner: ENG, continent: south_america } # las Guayanas
      - { owner: FRA, continent: south_america }
      - { owner: HOL, continent: south_america }
      - { owner: VEN }

  FCU:
    src: invented
    lore: >
      Los Estados Unidos continentales: las cuatro corporaciones se repartieron los restos de la república.
    resolve:
      - { owner: USA, continent: north_america }
    capital_state: ["New York"]

  ZNR:
    src: invented
    lore: >
      Canadá.
    resolve:
      - { owner: CAN }

  ZSE:
    src: invented
    lore: >
      México y Centroamérica.
    resolve:
      - { owner: MEX }
      - { owner: GUA }
      - { owner: HON }
      - { owner: ELS }
      - { owner: NIC }
      - { owner: COS }

  HSN:
    src: invented
    lore: >
      El archipiélago del sudeste asiático: los estrechos por donde pasa la mitad de la carga del mundo.
    resolve:
      - { owner: SIA }
      - { owner: FRA, continent: asia }          # Indochina
      - { owner: JAP }                           # los puertos de Japón
      - { owner: HOL, continent: asia }
      - { owner: INS }                           # 1.19.3: las Indias Orientales son su propio TAG
      - { core: INS }
      - { owner: PHI }
      - { state: ["Singapore", "Straits Settlements"] }
      - { state: ["Malaya", "Federated Malay States"] }
      - { state: ["Johor", "Unfederated Malay States"] }
      - { state: ["Sarawak"] }
      - { state: ["North Borneo", "Sabah"] }
      - { state: ["Brunei"] }
    capital_state: ["Singapore", "Straits Settlements", "Java", "West Java"]

  ZAF:
    src: invented
    lore: >
      Las Antillas mayores.
    resolve:
      - { owner: ENG, continent: north_america } # colonias del Caribe
      - { owner: FRA, continent: north_america }
      - { owner: CUB }
      - { owner: HAI }
      - { owner: DOM }

  ZAS:
    src: invented
    lore: >
      Australia y Nueva Zelanda.
    resolve:
      - { continent: australia }                 # el resto del Pacífico
      - { owner: AST }
      - { owner: NZL }

  ASC:
    src: invented
    lore: >
      El norte industrial de Europa, del Rin al Vístula y a Escandinavia.
    resolve:
      - { owner: CZE }
      - { owner: AUS }
      - { owner: SWI }
      - { owner: GER }
      - { owner: DEN }
      - { owner: NOR }
      - { owner: SWE }
      - { owner: POL }
      - { owner: LUX }
      - { owner: HOL, continent: europe }
      - { owner: BEL, continent: europe }
    capital_state: ["Berlin", "Brandenburg"]

  ZBC:
    src: invented
    lore: >
      Finlandia y los países bálticos.
    resolve:
      - { owner: FIN }
      - { owner: EST }
      - { owner: LAT }
      - { owner: LIT }

  ZAL:
    src: invented
    lore: >
      Gran Bretaña e Irlanda.
    resolve:
      - { owner: ENG, continent: europe }
      - { owner: IRE }

  SHD:
    src: invented
    lore: >
      China, reunificada por el Directorio sobre los restos de todos los gobiernos que se la disputaron.
    resolve:
      - { owner: CHI }
      - { owner: PRC }
      - { owner: SHX }
      - { owner: XSM }
      - { owner: GXC }
      - { owner: YUN }
      - { owner: SIK }
      - { owner: MAN }
      - { owner: TIB }
    capital_state: ["Beijing", "Peking", "Hebei"]

  ZKR:
    src: invented
    lore: >
      La península de Corea.
    resolve:
      - { core: KOR }

  ZST:
    src: invented
    lore: >
      Mongolia, Mengjiang y Tuvá.
    resolve:
      - { owner: SOV, continent: asia }          # Siberia y Asia Central
      - { owner: MON }
      - { owner: MEN }
      - { owner: TAN }

  APF:
    src: invented
    lore: >
      África entera, salvo la meseta etíope y el Cabo.
    resolve:
      - { continent: africa }
    capital_state: ["Lagos", "Nigeria", "Southern Nigeria", "Leopoldville"]

  ZET:
    src: invented
    lore: >
      Etiopía.
    resolve:
      - { owner: ETH }

  ZSA:
    src: invented
    lore: >
      Sudáfrica.
    resolve:
      - { owner: SAF }

  NRE:
    src: invented
    lore: >
      Italia, los Balcanes y Anatolia: el Imperio de Oriente y de Occidente, otra vez uno.
    resolve:
      - { owner: FRA, continent: europe }        # Galia (2026-09-23: 50% del mundo libre)
      - { owner: ITA, continent: europe }
      - { owner: GRE }
      - { owner: ALB }
      - { owner: YUG }
      - { owner: TUR }
    capital_state: ["Rome", "Lazio"]

  ZHI:
    src: invented
    lore: >
      La península ibérica.
    resolve:
      - { owner: SPR, continent: europe }
      - { owner: POR, continent: europe }

  ZDA:
    src: invented
    lore: >
      Rumania, Bulgaria y Hungría.
    resolve:
      - { owner: ROM }
      - { owner: BUL }
      - { owner: HUN }

  # ===========================================================================
  # La Anarquía: todo lo que no reclama nadie (decisión del usuario,
  # 2026-09-23). Con el reparto de arriba queda aprox. la mitad del mundo
  # que era libre: la URSS europea, India, Medio Oriente, el resto de Brasil.
  # ===========================================================================
  ZAN:
    src: user_decision
    resolve:
      - { remainder: true }
    militia:
      one_division_per: contiguous_territory
      template_name:
        english: "Militia"
        spanish: "Milicia"
      regiments: [infantry, infantry]
      src: invented

# =============================================================================
conflicts_detected:
  - id: C001
    severity: blocking_for_full_map
    text: >
      El doc reparte territorio SOLO para el EFE y sus dos satélites. Las otras
      siete potencias no tienen ni una región asignada. Con el mapa vanilla,
      eso deja el 95% del planeta sin dueño definido. La Fase 3 (solo EFE) puede
      avanzar igual, pero la Fase 5 no.
    see: Q010

  - id: C002
    severity: informational
    text: >
      El EFE ocupa el Cono Sur casi completo. Cualquier asignación futura del
      NRE o de la NASK tiene que respetarlo. La NASK es "neoandina" y el EFE
      tiene todo Chile: hay una frontera andina que va a haber que negociar.
    see: Q037

# =============================================================================
state_renaming:
  policy: required
  policy_src: inferred
  note: >
    El reskin exige renombrar states: dejar "Buenos Aires" con su nombre vanilla
    es aceptable, pero el mapa entero con nombres de 1936 rompe la ambientación.
    El doc no da ni un solo nombre nuevo de state.
  scope_phase3: "Solo los states del EFE + satélites."
  decision_2026_09_23: "Nombres vanilla por ahora. Se renombra después (Q038)."
  see: Q038

# =============================================================================
# Nombres de 2100 (Q038, "hacé todo", 2026-09-23). Se buscan por el nombre
# vanilla en inglés y se pisan en localisation/<idioma>/replace/. Solo EFE y
# satélites por ahora; el resto del mundo conserva los nombres del juego.
# Gaia: la cronología vieja decía que la capital se llamaba Gaia (Q040). Se
# reconcilia con el canon: Aurelio IV rebautizó Buenos Aires al coronarse.
# =============================================================================
state_names:
  src: invented
  renames:
    - { state: ["Buenos Aires"], name: { english: "Gaia", spanish: "Gaia" } }
    - { state: ["Santiago"], name: { english: "Santiago of the Forest", spanish: "Santiago del Bosque" } }
    - { state: ["Montevideo"], name: { english: "Custodian's Harbour", spanish: "Puerto Custodio" } }
    - { state: ["Santa Fe"], name: { english: "Plain of the Vats", spanish: "Llanura de las Cubas" } }
    - { state: ["Mendoza"], name: { english: "Reforested Cuyo", spanish: "Cuyo Reforestado" } }
    - { state: ["Tucumán"], name: { english: "Yungas Forest", spanish: "Selva de las Yungas" } }
    - { state: ["Chaco Austral"], name: { english: "Restored Chaco", spanish: "Gran Chaco Restaurado" } }
    - { state: ["Río Negro"], name: { english: "Río Negro Frontier", spanish: "Frontera del Río Negro" } }
    - { state: ["Rio Grande do Sul"], name: { english: "Gaucho Pampa", spanish: "Pampa Gaúcha" } }
    - { state: ["Antofagasta"], name: { english: "Salt Flats of Antofagasta", spanish: "Salares de Antofagasta" } }
    - { state: ["Magallanes"], name: { english: "Southern Custody", spanish: "Custodia Austral" } }
    - { state: ["Tierra del Fuego"], name: { english: "Land of Glaciers", spanish: "Tierra de los Glaciares" } }
    - { state: ["Falkland Islands"], name: { english: "Malvinas", spanish: "Malvinas" } }
    - { state: ["Paraguay"], name: { english: "Asunción of the Waters", spanish: "Asunción de las Aguas" } }
    - { state: ["Paraná"], name: { english: "Dams of the Paraná", spanish: "Represas del Paraná" } }
    - { state: ["Mato Grosso"], name: { english: "Pantanal", spanish: "Pantanal" } }
    - { state: ["Santa Catarina"], name: { english: "Guaraní Coast", spanish: "Costa Guaraní" } }
    - { state: ["Región Mesopotámica"], name: { english: "Misiones and Mesopotamia", spanish: "Misiones y Mesopotamia" } }
    - { state: ["Formosa"], name: { english: "Green Formosa", spanish: "Formosa Verde" } }

# =============================================================================
capital_fallback:
  rule: "Si el país no tiene capital en el spec, el state propio con más manpower."
  src: invented
  why: "HOI4 necesita una capital. PTA e YYG no tienen una canon (Q012)."

# BioSteel ya no toca el carbón de nadie: es un recurso propio (06_mechanics).
