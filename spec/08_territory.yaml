      - { state: ["North Dakota"] }
      - { state: ["South Dakota"] }
      - { state: ["Nebraska"] }
      - { state: ["Kansas"] }
      - { state: ["Iowa"] }
      - { state: ["Minnesota"] }
      # noroeste de México
      - { state: ["Baja California"] }
      - { state: ["Sonora"] }
      - { state: ["Chihuahua"] }
      - { state: ["Sinaloa"] }
      # Centroamérica
      - { state: ["Guatemala"] }
      - { state: ["Nicaragua"] }
      # oeste de África
      - { state: ["Senegal", "Dakar"] }
      - { state: ["Gambia"] }
      - { state: ["Guinea", "French Guinea"] }
      - { state: ["Portuguese Guinea"] }
      - { state: ["Sierra Leone"] }
      - { state: ["Liberia"] }
      - { state: ["Ivory Coast", "Cote d'Ivoire"] }
      - { state: ["French Sudan", "Mali"] }
      - { state: ["Mauritania"] }
      - { state: ["Upper Volta"] }
      # Kiev
      - { state: ["Kiev", "Kyiv"] }
      - { remainder: true }
    militia:
      one_division_per: contiguous_territory
      template_name:
        english: "Militia"
        spanish: "Milicia"
      regiments: [infantry, infantry]
      src: invented

# =============================================================================
conflicts_detected:
  - id: C001
    severity: blocking_for_full_map
    text: >
      El doc reparte territorio SOLO para el EFE y sus dos satélites. Las otras
      siete potencias no tienen ni una región asignada. Con el mapa vanilla,
      eso deja el 95% del planeta sin dueño definido. La Fase 3 (solo EFE) puede
      avanzar igual, pero la Fase 5 no.
    see: Q010

  - id: C002
    severity: informational
    text: >
      El EFE ocupa el Cono Sur casi completo. Cualquier asignación futura del
      NRE o de la NASK tiene que respetarlo. La NASK es "neoandina" y el EFE
      tiene todo Chile: hay una frontera andina que va a haber que negociar.
    see: Q037

# =============================================================================
state_renaming:
  policy: required
  policy_src: inferred
  note: >
    El reskin exige renombrar states: dejar "Buenos Aires" con su nombre vanilla
    es aceptable, pero el mapa entero con nombres de 1936 rompe la ambientación.
    El doc no da ni un solo nombre nuevo de state.
  scope_phase3: "Solo los states del EFE + satélites."
  decision_2026_09_23: "Nombres vanilla por ahora. Se renombra después (Q038)."
  see: Q038

# =============================================================================
# Nombres de 2100 (Q038, "hacé todo", 2026-09-23). Se buscan por el nombre
# vanilla en inglés y se pisan en localisation/<idioma>/replace/. EFE y sus
# satélites, y desde 2026-09-29 seis regiones clave de cada potencia.
# Gaia: la cronología vieja decía que la capital se llamaba Gaia (Q040). Se
# reconcilia con el canon: Aurelio IV rebautizó Buenos Aires al coronarse.
# =============================================================================
