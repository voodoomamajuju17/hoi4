# =============================================================================
# 08_territory.yaml — Reparto territorial sobre el mapa vanilla
# =============================================================================
# Estrategia: reskin del mapa vanilla. Mismos states y provincias, reasignados
# y renombrados. NO se generan bitmaps.
#
# RESOLUCIÓN (Q007, Q035 — 2026-09-23): el generador lee history/states/ de la
# instalación y resuelve cada territorio en tiempo de build con el bloque
# `resolve`. Nunca se escribe un state ID a mano.
#
#   { owner: ARG }             todos los states que ARG tiene en vanilla
#   { state: [nombre, ...] }   el state cuyo nombre en inglés es alguno de esos
#                              (sin distinguir mayúsculas ni tildes)
#
# Prioridad: un `state` explícito le gana a un `owner`. Así las exclusiones
# salen solas: el EFE toma todo ARG, pero "Tierra del Fuego" la pide PTA por
# nombre y se la queda PTA. Dos `state` explícitos sobre el mismo state = error.
#
# Un nombre que no aparece en el juego NO frena el build: se avisa con los
# nombres parecidos que sí existen, para corregir el spec con el reporte.
# =============================================================================

strategy: vanilla_reskin
resolution_method: vanilla_lookup_at_build
see: [Q007, Q035]

# =============================================================================
territories:

  # ---------------------------------------------------------------------------
  EFE:
    src: canon
    doc_section: "§3.1"
    doc_quote: >
      "Núcleo confirmado en la revisión más reciente: Argentina, Uruguay, Chile
      —sin Tierra del Fuego ni Magallanes— y Rio Grande do Sul."
    capital: "Buenos Aires"
    capital_src: canon
    core_regions:
      - name: "Argentina"
        exclusions: ["Tierra del Fuego (parte argentina)"]
        exclusions_src: inferred
        exclusions_note: >
          Misiones y Formosa se excluyen porque el doc las asigna explícitamente
          al satélite YYG. Tierra del Fuego va a PTA. La exclusión es deducción
          mía a partir de las listas de los satélites, no está dicha así.
        state_ids: unknown
      - name: "Uruguay"
        state_ids: unknown
      - name: "Chile"
        exclusions: ["Magallanes", "Tierra del Fuego (parte chilena)"]
        exclusions_src: canon
        exclusions_note: "El doc dice literalmente '—sin Tierra del Fuego ni Magallanes—'."
        state_ids: unknown
      - name: "Rio Grande do Sul"
        state_ids: unknown
    resolve:
      - { owner: ARG }
      - { owner: URG }
      - { owner: CHL }
      - { state: ["Rio Grande do Sul"] }
    resolve_src: inferred
    resolve_note: >
      ARG, URG y CHL son los TAG vanilla de Argentina, Uruguay y Chile. Las
      exclusiones (Tierra del Fuego, Magallanes) salen solas porque las pide
      PTA por nombre. Misiones y Formosa quedan en el EFE por decisión del
      usuario (2026-09-23), aunque el doc las daba a YYG.
    capital_state: ["Buenos Aires"]
    cores: all_core_regions
    cores_src: inferred
    cores_note: "El doc dice 'núcleo territorial'; lo interpreto como cores del EFE."

  # ---------------------------------------------------------------------------
  PTA:
    src: canon
    doc_section: "§3.1"
    doc_quote: 'Satélite "Patagonia Austral": Tierra del Fuego, Magallanes y Malvinas.'
    core_regions:
      - name: "Tierra del Fuego"
        state_ids: unknown
        note: >
          En HOI4 vanilla Tierra del Fuego puede estar repartida entre states
          argentinos y chilenos, o ser un solo state. Hay que verificarlo contra
          los archivos reales antes de partirla.
      - name: "Magallanes"
        state_ids: unknown
      - name: "Malvinas / Falkland Islands"
        state_ids: unknown
    resolve:
      - { state: ["Tierra del Fuego"] }
      - { state: ["Magallanes"] }
      - { state: ["Falkland Islands", "Malvinas", "Islas Malvinas"] }
    resolve_src: inferred
    capital: "Punta Arenas"
    capital_state: ["Magallanes"]
    capital_src: invented   # Q012: "elegí las capitales como se te cante"
    capital_why: "Punta Arenas es la ciudad más grande del extremo sur y mira a los dos océanos."
    canon_note: >
      Malvinas estaba en territorio directo del EFE en una versión anterior.
      La revisión posterior la mueve acá. Prevalece esta. (§3.1)

  # ---------------------------------------------------------------------------
  YYG:
    src: canon
    doc_section: "§3.1"
    doc_quote: >
      'Satélite "Yvytu Ykua Guasu": Paraguay, Mato Grosso, Paraná, Santa
      Catarina, Misiones y Formosa.'
    core_regions:
      - name: "Paraguay"
        state_ids: unknown
      - name: "Mato Grosso"
        state_ids: unknown
        ambiguity: >
          En Brasil moderno existen Mato Grosso y Mato Grosso do Sul. El doc
          dice solo "Mato Grosso". No sé si incluye ambos. Ver Q036.
      - name: "Paraná"
        state_ids: unknown
      - name: "Santa Catarina"
        state_ids: unknown
      - name: "Misiones"
        state_ids: unknown
      - name: "Formosa"
        state_ids: unknown
    resolve:
      - { owner: PAR }
      - { state: ["Mato Grosso"] }
      # Q036: "sí, los dos". En 1.19.3 no existe un state "Mato Grosso do Sul";
      # el usuario pidió Ponta Porã (2026-09-23) para dar continuidad
      # territorial entre Paraguay y el resto del satélite.
      - { state: ["Ponta Porã", "Ponta Pora", "Punta Pora", "Punta Porá", "Mato Grosso do Sul"] }
      - { state: ["Parana", "Paraná"] }
      - { state: ["Santa Catarina"] }
      # Misiones está dentro de la Región Mesopotámica en 1.19.3, y el usuario
      # decidió (2026-09-23) que la Mesopotamia es del EFE: YYG no la toma.
      # Formosa también queda en el EFE (pedido del usuario, 2026-09-23):
      # sale de Argentina, así que la toma el { owner: ARG } del EFE.
    resolve_src: inferred
    capital: "Asunción"
    capital_state: ["Paraguay", "Central Paraguay"]
    capital_src: invented   # Q012
    capital_why: "Asunción: la única capital histórica dentro del satélite."

  # ---------------------------------------------------------------------------
  # ===========================================================================
  # Reparto del mundo — inventado a pedido del usuario (2026-09-23), Q010.
  # Selectores por TAG de 1936 y por continente del mapa; ver cabecera.
  # Lo que no pide nadie queda vanilla: son los países libres (Francia,
  # la URSS, Japón, India, Medio Oriente...).
  # ===========================================================================
  NAS:
    src: invented
    lore: >
      Los Andes centrales: el imperio del Sol volvió donde estuvo el Tahuantinsuyo.
    resolve:
      - { owner: PRU }
      - { owner: BOL }
      - { owner: ECU }
    capital_state: ["Cusco", "Cuzco", "Lima"]

  ZNG:
    src: invented
    lore: >
      Colombia y Panamá: el canal y las lluvias.
    resolve:
      - { owner: COL }
      - { owner: PAN }

  ZLL:
    src: invented
    lore: >
      Venezuela.
    resolve:
      - { owner: ENG, continent: south_america } # las Guayanas
      - { owner: FRA, continent: south_america }
      - { owner: HOL, continent: south_america }
      - { owner: VEN }

  FCU:
    src: invented
    lore: >
      Los Estados Unidos continentales: las cuatro corporaciones se repartieron los restos de la república.
    resolve:
