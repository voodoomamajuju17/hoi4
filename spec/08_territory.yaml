  ZSE:
    src: invented
    lore: >
      México y Centroamérica.
    resolve:
      - { owner: MEX }
      - { owner: GUA }
      - { owner: HON }
      - { owner: ELS }
      - { owner: NIC }
      - { owner: COS }

  HSN:
    src: invented
    lore: >
      El archipiélago del sudeste asiático: los estrechos por donde pasa la mitad de la carga del mundo.
    resolve:
      - { owner: SIA }
      - { owner: FRA, continent: asia }          # Indochina
      - { owner: JAP }                           # los puertos de Japón
      - { owner: HOL, continent: asia }
      - { owner: INS }                           # 1.19.3: las Indias Orientales son su propio TAG
