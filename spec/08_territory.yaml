      # 2026-09-29 (pedido del usuario): el canal de Panamá y Puerto Rico son de la FCU.
      # Un nombre explícito le gana al reparto por dueño (Panamá era de ZNG).
      - { state: ["Panama Canal", "Canal Zone", "Panamá", "Panama"] }
      - { state: ["Puerto Rico"] }
