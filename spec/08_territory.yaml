  ASC:
    src: invented
    lore: >
      El norte industrial de Europa, del Rin a Escandinavia. (Balance 2026-09-23: Polonia y Checoslovaquia pasan a la Comuna Báltica.)
    resolve:
      - { owner: AUS }
      - { owner: SWI }
      - { owner: GER }
      - { owner: DEN }
      - { owner: NOR }
      - { owner: SWE }
      - { owner: LUX }
      - { owner: HOL, continent: europe }
      - { owner: BEL, continent: europe }
