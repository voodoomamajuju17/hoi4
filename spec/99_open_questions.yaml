- id: Q001
  status: ANSWERED
  answer: "8 facciones. Manda el documento."
  answered_on: "2026-08-02"
  priority: critical
  blocking_phase: 2
  topic: "¿'Seven Dominions' o '2100 Meganations'?"
  question: >
    Tu pedido dice que el mod se llama "Seven Dominions" y que tiene SIETE
    facciones. El documento que me pasaste se titula "2100 Meganations" y define
    OCHO mega-naciones con TAG, nombre y mecánica. No son la misma cosa y no
    puedo deducir cuál manda.
  what_i_did: >
    Armé el spec siguiendo al DOCUMENTO (ocho, "2100 Meganations"), porque es la
    única fuente con contenido verificable. Aislé el nombre, el año y el conteo
    en 00_project.yaml para que corregirlo sean tres líneas.
  options:
    - "El doc manda: son 8 y el mod es 2100 Meganations. (spec actual, no toco nada)"
    - "El prompt manda: son 7 y el mod es Seven Dominions. Decime CUÁL de las ocho se cae y por qué."
    - "Son 7 porque dos se fusionaron. Decime cuáles y cómo queda la mecánica resultante."
    - "Seven Dominions es un rename y siguen siendo 8. (el '7' era un desliz)"
  why_it_matters: >
    Es el único dato del que dependen todos los demás archivos. Si son siete,
    hay una facción entera de spec que sobra, y probablemente un reparto
    territorial distinto.

