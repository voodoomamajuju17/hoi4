- id: Q042
  priority: high
  blocking_phase: 3
  topic: "replace_path: ¿el mod reemplaza history/ y common/ vanilla?"
  question: >
    descriptor.mod puede declarar `replace_path` para que una carpeta vanilla se
    ignore por completo en vez de fusionarse con la del mod. Un total conversion
    lo necesita: sin replace_path de history/countries y history/states, la
    partida arranca con los ~200 países de 1936 vanilla conviviendo con nuestras
    ocho potencias.
  why_not_yet: >
    Declararlo ANTES de generar el contenido que lo reemplaza es peor que no
    declararlo: el mundo queda literalmente vacío y el juego no arranca partida.
    Hoy `replace_paths` está vacío a propósito en 00_project.yaml.
  decision_needed_at: "Fase 3, junto con el primer history/ generado."
  candidates:
    - history/countries
    - history/states
    - common/national_focus
    - common/ideas
  note: >
    Esto interactúa con Q039 (los 30 países libres). Si los países libres van a
    ser TAGs vanilla reciclados, reemplazar history/countries entero significa
    que hay que generar historia para los 30 también, no solo para las ocho.

- id: Q043
  status: ANSWERED
  answer: >
    Carbón (coal). Y BioSteel es exclusivo del EFE: "a los demás les sacás el
    biosteel".
  answered_on: "2026-09-23"
  exclusivity: efe_only
  exclusivity_implementation: >
    Al generar history/states/, todo state que no sea del EFE sale con su
    carbón en 0. Queda pendiente hasta que el territorio esté resuelto (Q007):
    sin leer los states vanilla no se sabe cuáles tienen carbón.
  priority: high
  blocking_phase: 3
  topic: "¿Qué recurso vanilla se convierte en BioSteel?"
  question: "¿Qué recurso vanilla se reskinea como BioSteel?"
  consequence: >
    El recurso se renombra en TODO el mundo, no solo para el EFE: cualquier
    país con carbón pasa a tener BioSteel, y todo lo que en vanilla consume
    carbón pasa a consumir BioSteel. Si querés que sea exclusivo del EFE, hace
    falta sacarle ese recurso a los states de los demás. Eso se hace en
    history/states/, que depende de Q007.
  unit_caveat: >
    Los umbrales 5/10/15 del doc son chicos comparados con lo que produce un
    state vanilla con carbón (decenas de unidades). Quedan en 5/10/15 hasta
    que veamos en partida cuánto BioSteel tiene el EFE de verdad.
