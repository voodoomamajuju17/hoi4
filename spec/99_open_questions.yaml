- id: Q006
  status: ANSWERED
  answer: "Reskin. Implementado: el generador fusiona sobre el archivo vanilla."
  answered_on: "2026-08-02"
  priority: critical
  blocking_phase: 2
  topic: "¿Reemplazar las ideologías vanilla o reskinearlas?"
  question: "Ver AD002 en 00_project.yaml para el detalle completo."
  my_recommendation: >
    reskin_groups: mantener las 4 claves internas vanilla (democratic, fascism,
    communism, neutrality) y meter las ideologías del mod como sub-ideologías,
    renombrando todo por localisation.
  why: >
    Es lo que hacen los TC grandes, y evita exactamente el error que reporta la
    §14 del doc sobre la build anterior ("algunos líderes apuntaban a
    ideologías vanilla que no se encontraban correctamente"). Borrar las
    ideologías vanilla obliga a sobreescribir montañas de contenido base.
  cost_if_wrong: "Alto. Cambiar de estrategia después toca todos los archivos de país."

