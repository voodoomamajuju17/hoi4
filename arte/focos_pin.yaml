# Íconos de foco en estilo "pin" (2026-11-05).
# Pedido: "rehacé los pedidos faltantes de focos para encajar con el nuevo estilo.
# Mega foco en el realismo, tienen que parecer fotos de pines posta. Materiales
# verdaderos. Los de neovictoria bordados, con telas y metal; los de Albión
# transhumana en una placa, tarjeta o PCB azul y metal; ónix, hierro y esmeralda
# para los Zaibatsu, y así. Sencillo, poco elemento y bien claro. Como los del EFE."
# El modelo son los 70 del Imperio Ecofascista (bronce envejecido y esmalte verde).
# Los pide tools/arte/focos_pin.py (arte/pedidos/20_focos_pin_<TAG>.txt); cada pedido
# lleva el ícono viejo como referencia del motivo (arte/referencias_focos/).

# 2026-11-12 (los de la rama ludita salieron "horribles, ya no parecen fotos de un objeto real":
# íconos 3D lisos tipo juego): se refuerza que es una FOTO de un objeto físico y se dice qué no hacer
estilo: >-
  a REAL PHOTOGRAPH, not an illustration: macro product photo of ONE real, physical collectible pin
  badge lying flat, taken with a 100 mm macro lens on a professional camera, the way a jeweller or a
  militaria collector photographs a real enamel pin or regimental badge for a catalogue. Made of true
  materials (see MATERIAL) with their real physical behaviour: metal shows real specular highlights,
  micro-scratches, slightly uneven polishing and darker patina in the recesses; enamel shows glossy
  reflections, tiny bubbles and a raised metal line (cloisonne wire) between colours; wood shows real
  grain and pores; fabric shows real threads. Real thickness: the edge of the badge is visible as a
  few millimetres of solid metal, with bevels catching the light. Shot straight-on from the front,
  soft studio light from the top left, everything in sharp focus. The badge carries ONE simple, bold
  emblem (at most two or three elements) that stands for the focus; its outline is one clear die-cut
  shape (round, shield, hexagon, gear, or the silhouette of the emblem itself). Big shapes and strong
  contrast between metal and enamel: it must read clearly at 95x85 pixels, nothing tiny or fussy. It
  is a PIN, not a coin or a medal: the outline follows the emblem (a die-cut silhouette) and is a
  plain round disc only when the emblem itself is round; no border ring full of extra symbols, no
  second emblem, no background pattern. Badge centred, filling about 85% of the canvas, same camera,
  light and scale for the whole set. Isolated on a fully transparent background: no table, no backing
  card, no pin clasp visible, no cast shadow beyond a faint contact shadow. No text, no letters, no
  numbers, no watermark. AVOID: 3D render look, game icon, app icon, clay or plastic look, cartoon,
  vector art, smooth airbrushed gradients, perfectly clean uniform surfaces, toy-like proportions,
  soft rounded "inflated" shapes. If in doubt, make it look MORE like a photo of a real old object.

# MATERIAL de cada nación; "ramas" lo cambia para una rama del árbol (id de la rama)
materiales:
  # 2026-11-05 ("hay que rehacer estos del EFE... igual están bellísimos"): la primera tanda
  # salió con discos redondos y mucho detalle; se piden de nuevo con el estilo ajustado
  EFE:
    base: >-
      aged bronze with deep forest-green vitreous enamel and one thin line of old gold, the green
      like moss and jungle leaves
    ramas:
      guardia_verde: &efe_militar dark gunmetal bronze with deep forest-green enamel, military insignia
      condores: *efe_militar
      dinastia_verde: aged bronze and old gold with deep forest-green enamel, a crowned imperial badge
  ASC:
    base: >-
      brushed stainless steel with glossy signal-red hard enamel and small snow-white enamel fields,
      like a Soviet award badge machined in 2100
    ramas:
      # 2026-11-05: sin la placa verde (se iba de paleta); el circuito grabado en el acero
      poder_de_computo: &asc_chip >-
        brushed stainless steel and signal-red hard enamel, with a few circuit lines engraved into the
        steel itself (no other colour)
      red_fria: *asc_chip
      mercado_computo: *asc_chip
  FCU:
    base: >-
      polished chrome and platinum with cobalt-blue glass enamel, sharp bevels, an expensive corporate
      executive lapel pin
    ramas:
      directorio: &fcu_onix polished black onyx set in mirror chrome, one thin cobalt-blue enamel line
      casa_de_cristal: *fcu_onix
  HSN:
    base: >-
      sea-worn solid brass with deep teal cloisonné enamel and a small mother-of-pearl inlay, like a
      naval officer's insignia
  NAS:
    base: >-
      hammered high-karat gold with turquoise and red spondylus-shell inlays, Andean goldsmith work
    ramas:
      mineria: hammered silver with turquoise inlay and a thin gold rim, Andean silversmith work
  SHD:
    base: >-
      carved imperial-green jade set in gilt bronze with fine gold cloisonné wires
    ramas:
      precision: &shd_acero carved imperial-green jade set in brushed steel, precise machined edges
      sala_de_control: *shd_acero
  APF:
    base: >-
      lost-wax cast brass with ochre and terracotta enamel and a few real glass trade beads set in
      the metal
    ramas:
      milicias: dark oxidised cast brass with earth-red enamel and a few real glass beads
  NRE:
    base: >-
      gilded bronze in the style of a Roman phalera military decoration, imperial-purple enamel and a
      small polished white marble inlay
  # 2026-11-07 ("rehacé los de Japón, están bien pero no excelente"): materiales de
  # joyería japonesa de verdad, uno por Casa, más ricos y con más contraste
  ZJP:
    base: >-
      shakudo (blue-black Japanese copper-gold alloy) with polished gold edges, deep crimson
      cloisonne enamel and one faceted emerald; fine Japanese metalwork, museum-grade
    ramas:
      ruta_zaibatsu: >-
        a slab of polished black onyx set in blackened hand-forged iron, crisp mirror-chrome bevelled
        edges and one faceted emerald; cold, luxurious, like a Tokyo boardroom lapel pin
      ruta_yakuza: >-
        glossy black urushi lacquer with raised real gold-leaf maki-e and deep crimson cloisonne
        enamel, like an old yakuza family crest (mon) pin, hand-made and precious
      ruta_srs: >-
        white medical ceramic and brushed titanium with one glowing hot-pink glass inlay (#ff2d78),
        laboratory-clean and precise, like a biotech company's award pin
    # un foco con su propio material (el final común de las tres Casas)
    focos:
      ZJP_cybershogun: >-
        shakudo (blue-black Japanese copper-gold alloy) with polished gold edges, deep crimson
        cloisonne enamel and one faceted emerald; fine Japanese metalwork, museum-grade, the most
        precious badge of the set
  ZAL:
    base: >-
      enamelled pewter with navy, red and white enamel, like a traditional British regimental badge
    ramas:
      hacia_el_pasado: >-
        an embroidered badge, not metal-only: wine-red velvet and wool felt base with raised gold and
        silver bullion-wire embroidery, a few small polished brass parts sewn on, real visible
        stitches and fabric texture, neo-Victorian
      hacia_el_futuro: >-
        a small rigid plate cut from a deep-blue printed circuit board (real PCB: gold traces, solder
        pads, tiny vias) framed in brushed aluminium, one small cyan glowing inlay, transhumanist
      # 2026-11-12 (los 7 focos de Quedarse Luditas no tenían pin): hecho a mano, sin nada electrónico
      quedarse_luditas: >-
        a real blacksmith-made badge: dark hand-forged iron with visible hammer facets, scale and
        uneven edges, the raised parts rubbed bright by use, set with one small inlay of real oiled oak
        (visible wood grain) and fixed with one dull brass rivet; heavy, old and honest, like a
        nineteenth-century trade-guild badge photographed in a museum; deliberately no electronics,
        no glass, no glow, no smooth polished surfaces
  JUNTA:
    base: >-
      blackened iron with bone-white enamel and a single eclipse-orange enamel ring
  ZWB: &anarquia
    base: >-
      an improvised badge hand-cut from scrap tin and rusted steel, hand-painted chipped enamel in two
      colours, visible rivets and file marks, made by survivors
  ZWE: *anarquia
  ZWI: *anarquia
  ZWM: *anarquia
  ZAN: *anarquia

# Naciones que ya están en el estilo nuevo (no se piden)
hechas: []
# Naciones que se vuelven a pedir enteras aunque ya hayan llegado (2026-11-07: Japón,
