# Banderas de país que faltan (2026-10-19, pedido del usuario: "los retratos y
# banderas que falten"). Lo usa tools/arte (pedidos tipo country_flag): cada
# país del mod sin assets/<TAG>/flags/<TAG>.tga pide la suya con este dibujo.
banderas:
  ZCO: 'three horizontal bands, deep green, sky blue and green, with a winding blue river crossing diagonally and a small golden star in the upper hoist; a member of the African Peoples Federation'
  ZAO: 'two horizontal bands, red over black, with a golden oil drop and a half cog wheel in the centre; proud and industrial'
  ZMZ: 'Indian-Ocean blue field with a white wavy band across the middle and a golden open book over a hoe at the hoist; a coastal people of ports and fields'
  ZMG: 'vertical white band at the hoist and two horizontal bands, deep red over green, with a small silhouette of a baobab tree in the white band'
  ZKE: 'three horizontal bands, black, red and green, separated by thin white lines, with a stylised Rift valley escarpment in white in the centre'
  ZSG: 'deep forest green field with a great tree whose roots form a circle, in gold, and a thin earth-brown band at the bottom; a sanctuary of the Amazon'
