# Pantallas de carga nuevas (2026-10-24, pedido del usuario: "que más que nada muestren
# la vida diaria en cada una de las meganaciones y anarquías, una imagen por cada una").
# Van a assets/menu/loading/ y el generador las reparte entre las pantallas del juego.
# `escena`: qué dibujar (en inglés, para el generador). Gente común, no batallas.
pantallas:
  EFE:
    titulo: "Una mañana en Buenos Aires"
    escena: >-
      Morning street life in Buenos Aires in 2100 under the Ecofascist Empire: old Parisian-style facades
      overgrown with living green bio-steel vines, citizens in simple green and khaki clothes queueing
      at a ration-and-seed kiosk, a gardener-soldier pruning a tree on the boulevard, children walking to
      school past a huge banner with a laurel and a tree, mate cups, a tram covered in moss, golden morning light.
  FCU:
    titulo: "Hora pico en Nueva York"
    escena: >-
      Rush hour in New York in 2100 under the corporate union: commuters in identical company uniforms with
      glowing ID badges flowing out of a chrome subway, giant glass towers with corporate holograms (no
      readable text), food carts run by delivery drones, a private security guard checking badges, a homeless
      man under a stock-ticker screen showing only arrows and numbers-like shapes, cold blue evening light.
  ASC:
    titulo: "Turno de noche en el Ruhr"
    escena: >-
      Daily life in an automated commune town in the Ruhr in 2100: robots carrying crates through a clean
      constructivist square, workers in red overalls eating together at a long canteen table, a public screen
      showing a production chart (shapes only), bicycles, a child talking to a small maintenance robot,
      white and red concrete buildings, soft night lighting.
  HSN:
    titulo: "El mercado flotante de Singapur"
    escena: >-
      A floating market in the Singapore strait in 2100: hundreds of boats and floating platforms tied together,
      merchants trading spices, electronics and fish under teal awnings, container ships towering in the
      background, insurers with brass tablets haggling, children diving from a pier, lanterns and string lights,
      humid golden sunset over the water.
  NAS:
    titulo: "Fiesta del Sol en Cusco"
    escena: >-
      Daily life in Cusco in 2100 in the neo-Andean sun kingdom: Inca stone walls with solar panels shaped like
      golden sun disks, people in modern ponchos and turquoise jewellery carrying baskets of quinoa and maize,
      llamas beside an electric cable car, a small solar temple with priests, condor-shaped drones in the sky,
      snowy mountains behind, crisp high-altitude sunlight.
  SHD:
    titulo: "La esclusa del Yangtsé"
    escena: >-
      Ordinary life by a giant dam lock on the Yangtze in 2100 under the harmonious directorate: barges waiting
      in neat rows, engineers in jade-green uniforms checking water gauges, families doing tai chi on the
      embankment at dawn, a tea house with hydraulic diagrams on the walls (no readable text), bureaucrats with
      tablets, misty river and steel-grey sky.
  APF:
    titulo: "Consejo de aldea en el Sahel"
    escena: >-
      Daily life in a growing Sahel town in 2100 in the African peoples' federation: an open-air village council
      under a big baobab, people in bright patterned clothing debating, women selling produce, a new solar
      factory and a railway in the background, kids playing football on red earth, motorbikes and a water tower,
      warm late-afternoon light.
  NRE:
    titulo: "El foro de la nueva Roma"
    escena: >-
      Everyday life in the forum of Rome in 2100 in the neo-Roman empire: restored marble temples beside glass
      buildings, citizens in modern clothes with crimson sashes, a public bread distribution, a legionary patrol
      with eagle standards walking past a café, a big screen showing an eagle, scooters on cobblestones,
      warm Mediterranean evening light.
  ZWE:
    titulo: "Mercado de chatarra en Moscú"
    escena: >-
      Daily life among the Eurasian warlords in 2100: a scrap market in the ruins of Moscow, people bartering
      canned food, batteries and old rifles, a warlord's armoured truck painted with faded red stars parked
      nearby, babushkas selling soup from a pot, smoke from oil-drum fires, snow and rusted Soviet buildings,
      grey winter light.
  ZWI:
    titulo: "Monzón en el bazar"
    escena: >-
      Daily life in the Hindustan warlord realms in 2100: a crowded bazaar during the monsoon, saffron and crimson
      tarps, people with umbrellas, a temple behind, militiamen with ornate brass-plated armour buying tea,
      cows and rickshaws in muddy streets, scooters and tangled wires, warm rain and neon reflections.
  ZWM:
    titulo: "Caravana en los Emiratos"
    escena: >-
      Daily life in the desert emirates in 2100: a caravan of old trucks and camels arriving at an oasis town
      beside a rusty oil derrick, men in robes trading water and fuel, a falconer, women in black and gold,
      a small mosque and sandbagged walls, dunes and heat haze, ochre sunset.
  ZWB:
    titulo: "El aserradero del río"
    escena: >-
      Daily life among the Amazon warlords in 2100: a wooden riverside settlement on stilts, an illegal sawmill
      and a gold-mining barge, workers covered in mud, boats loaded with logs and rubber, a warlord's guard with
      an orange bandana, hammocks, generators and satellite dishes on tin roofs, steamy green jungle and orange light.
  ZAN:
    titulo: "Pueblo fantasma del Midwest"
    escena: >-
      Daily life in the lawless lands in 2100: a half-abandoned Midwest town, raiders in welded scrap armour
      trading at a fortified gas station, a family repairing a pickup with scavenged parts, cornfields gone wild,
      a water tower painted with raider symbols (no letters), dust storm on the horizon, rust, black and hazard yellow.
