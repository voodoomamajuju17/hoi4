# =============================================================================
# Noticias del mapa: una imagen propia por país (2026-10-29).
#
# Pedido del usuario: "Todos estos eventos de nuevas naciones o naciones que
# dejan de existir necesitan su propia imagen, pero todas tienen que ser
# completamente originales. Estamos repitiendo el mismo formato en todo: siempre
# hay un primer plano con 2 o 3 figuras en la izquierda, desde la espalda, un
# segundo plano con un actor secundario y el fondo a la derecha. Muy aburrido."
#
# Cada pedido tiene su propia toma (cámara, técnica, encuadre) y ninguno repite
# la de otro. Prohibido: grupo de espaldas en primer plano a la izquierda.
#   mapa_ido_<TAG>    la noticia de que <TAG> desaparece   (meganations_mapa.1)
#   mapa_nace_<TAG>   la noticia de que <TAG> nace         (meganations_mapa.2)
#   mapa_forma_<TAG>  la potencia proclama su Forma Final  (meganations_mapa.3)
#   mapa_civil_<TAG>  la potencia se parte en guerra civil (meganations_mapa.4)
# tools/gen/emitters/mapa.py usa cada imagen apenas está en assets/events/.
# =============================================================================

composicion: >-
  FORMAT: event illustration, about 6:5 (shown at 210x176 in game, so the main shape must read when tiny). The
  camera, framing and technique written above are MANDATORY: follow them exactly and do not "fix" the composition
  into a standard scene. Do NOT add a group of people seen from behind in the foreground, do NOT add onlookers that
  were not asked for. NO text, NO letters, NO numbers, NO real country flags, NO watermark, NO border.

imagenes:

  # ---------------------------------------------------------------------------
  # Desaparecen (mapa_ido_*)
  # ---------------------------------------------------------------------------
  mapa_ido_EFE: >-
    The Ecofascist Empire is gone. TECHNIQUE: dark oil painting, Dutch still life. TOP-DOWN view straight onto a
    rough wooden table: a crown woven from lapacho wood and dried leaves lies split in two, one half already
    sprouting pale mushrooms; beside it an empty glass vat-jar of living green bio-steel that has turned grey and
    cracked; scattered laurel leaves curling brown; a single green candle just snuffed, its smoke curling up. No
    people. LIGHT: one cold shaft from the upper right, deep black background.
  mapa_ido_ASC: >-
    The Automated Socialist Commune is gone. TECHNIQUE: constructivist photomontage in red, white and black. CAMERA:
    low, centred, perfectly symmetrical: a long corridor of a server hall stretching to a vanishing point, every
    rack dark; the only light is a single red standby LED per rack, a perspective of dots. In the exact centre a
    tall white industrial robot stands switched off, head bowed, a strip of red cloth tied around its arm hanging
    still. Dust in the air.
  mapa_ido_FCU: >-
    The Corporate Union is gone. TECHNIQUE: glossy 1980s financial-magazine photo, cold blue. CAMERA: extreme
    close-up, shallow depth of field: a corporate glass office tower reflected upside down in a puddle on a
    pavement, the reflection broken by falling shredded paper strips drifting down like snow. In sharp focus in
    the puddle: one silver executive pen and a shattered smartwatch face showing only red bars. Navy and silver
    palette.
  mapa_ido_HSN: >-
    The High-Seas Market Nation is gone. TECHNIQUE: wide aerial drone photograph, slightly hazy. CAMERA: straight
    down from very high over a vast container port at dawn: hundreds of containers in teal and brass colours
    abandoned in neat stacks, all the cranes frozen at different angles, and in the water an enormous ring of
    empty anchored cargo ships forming a circle with nothing in the middle. Long morning shadows, no movement.
  mapa_ido_NAS: >-
    The Neo-Andean Sun Kingdom is gone. TECHNIQUE: painterly, warm then cold. CAMERA: worm's-eye view from the
    ground of an Inca stone temple stairway rising into a grey sky; at the top, a huge gold sun disc has fallen
    from its frame and lies tilted, half sunk in the steps, its rays bent. A single condor feather is caught in a
    crack in the first stone, filling the bottom of the frame. Snowflakes falling on gold.
  mapa_ido_SHD: >-
    The Sino-Harmonious Directorate is gone. TECHNIQUE: traditional Chinese ink wash (shan shui) on silk, with
    small modern details. Vertical landscape: a great concrete dam in the mountains with all its floodgates open,
    white water pouring out freely into the valley below; tiny abandoned control towers on the dam crest; a row of
    jade-green banners lying in the water downstream. Mist hides the top half of the mountains. No people.
  mapa_ido_APF: >-
    The African Peoples' Federation is gone. TECHNIQUE: bold linocut print in earth red, yellow, green and black.
    CAMERA: front view of a great circle of empty carved council stools under a baobab tree at dusk; one stool in
    the circle is knocked over; a long woven kente-like sash lies across the empty circle on the red earth. A
    single hornbill sits on the baobab branch. Strong graphic shapes, no people.
  mapa_ido_NRE: >-
    The Neo-Roman Empire is gone. TECHNIQUE: Roman floor mosaic of small stone tesserae, seen from directly above,
    partly broken. The mosaic shows a crimson-and-gold eagle standard; tesserae have come loose and lie scattered
    across the eagle's wings, a crack runs through it, and weeds push up through the gaps. A bronze legion helmet
    lies upside down on the mosaic, filled with rainwater reflecting the sky.
  mapa_ido_PTA: >-
    Southern Patagonia is gone as a state. TECHNIQUE: wide windswept landscape painting, pale and cold. CAMERA:
    extremely wide, very low horizon: endless grey-gold steppe under an enormous cloudy sky; in the lower right
    third a tiny lonely border post, its barrier pole raised and broken, a wind-shredded small flag of plain light
    blue and white bands snapping at the very top of its pole. Wind lines in the grass. The sky takes 80% of the frame.
  mapa_ido_YYG: >-
    Yvytu Ykua Guasu (the old Paraguay, Guarani country) is gone. TECHNIQUE: soft watercolour. CAMERA: close-up of
    a riverbank at the Paraná: a hand-carved wooden signpost with a painted jaguar emblem (no letters) lies in the
    shallow brown water, half submerged, water hyacinths drifting over it; a small clay pot of yerba with its metal
    straw stands forgotten on the bank. Humid green-gold light, a heron taking off in the corner.
  mapa_ido_ZNG: >-
    New Granada (Colombia and Panama) is gone. TECHNIQUE: magical-realist oil painting. CAMERA: inside an empty
    colonial church in the Chocó rain forest, looking up at a broken stained-glass rose window (abstract colours,
    no figures); heavy rain falls straight through the hole onto an altar covered with climate instruments: old
    rain gauges, barometers and a priest's stole soaked through. Yellow butterflies in the shaft of light.
  mapa_ido_ZLL: >-
    The Free Plains of the Orinoco (Venezuela) are gone. TECHNIQUE: flat poster art in burnt orange and black. A
    silhouette of a lone pumpjack of a dead oil well against a gigantic setting sun on the flat llanos, its head
    frozen mid-motion; a herd of horses running across the frame in silhouette, away from it; heat haze. Very
    graphic, three colours only.
  mapa_ido_ZNR: >-
    The Boreal Resource Zone (Canada) is gone. TECHNIQUE: crisp winter photograph. CAMERA: close, from a low
    angle in snow: an old parliament-style wooden chair with a red leather seat sitting alone in the middle of a
    frozen lake, snow piled on its seat, a price tag on a string hanging from one arm and twisting in the wind;
    endless pine forest on the far shore. Blue-white palette, one red accent.
  mapa_ido_ZSE: >-
    The Southern Economic Zone (Mexico and Central America) is gone. TECHNIQUE: neon-noir illustration. CAMERA:
    looking through a chain-link fence at night at an automated maquila factory; the fence gate is wide open and
    torn from one hinge, the factory floor beyond is dark with only conveyor belts still running, empty; in the
    sky above, a corporate security drone falls trailing smoke. Magenta and cyan light on wet ground.
  mapa_ido_ZAF: >-
    The Antillean Free Ports (Cuba, Haiti, Dominican Republic) are gone. TECHNIQUE: vivid Caribbean naive painting
    in the Haitian tradition, flat bright colours. Bird's-eye view of a small harbour: shipping containers opened
    like flowers spilling out their goods into turquoise water, fishermen's boats pulling them in, palm trees
    bending, colourful houses with shuttered windows. Joyful colours, melancholy subject.
  mapa_ido_ZAS: >-
    The Southern Sea Pact (Australia and New Zealand) is gone. TECHNIQUE: hyperreal photo. CAMERA: from inside a
    huge desalination plant tank, looking up through the open hatch at a circle of hard blue sky; the tank is dry,
    cracked white salt crust in the foreground, a single dead pipe valve wheel resting on the salt. Glaring
    Australian light, very high contrast.
  mapa_ido_ZBC: >-
    The Baltic Commune is gone. TECHNIQUE: woodcut print in black and pale wheat yellow. Close-up of a rye field at
    harvest where a combine harvester stands abandoned, its door open, a cooperative's straw cap left on the seat;
    behind it, a wooden windmill with one sail missing. Storm clouds of carved wood lines. No people.
  mapa_ido_ZAL: >-
    The Workers' Republic of Albion (Britain and Ireland) is gone. TECHNIQUE: Victorian steel engraving, sepia.
    CAMERA: interior of a brick workshop: a smashed industrial loom (Luddite style) and a steam engine stand
    silent; a sledgehammer leans against them; through a tall arched window, a grey sea and seagulls. Dust motes,
    a teapot gone cold on the workbench.
  mapa_ido_ZKR: >-
    The Harmonious Protectorate of Korea is gone. TECHNIQUE: minimalist Korean ink painting with one digital
    element. A single pine tree on a granite cliff above a sea of cloud; hanging from its lowest branch, a
    surveillance camera on a cable swinging loose, its lens cracked. Huge empty space of white mist. Very sparse.
  mapa_ido_ZST: >-
    The Steppe Directorate (Mongolia and Tuva) is gone. TECHNIQUE: wide painterly landscape. CAMERA: from very
    high, a vast golden steppe with a single white ger (yurt) far below, its door open, and next to it a toppled
    weather-station mast with its solar panel; a herd of horses grazing freely. A shaman's drum lies in the grass
    near the ger. Golden afternoon light, huge shadows of clouds moving over the land.
  mapa_ido_ZET: >-
    The Federation of the Highlands (Ethiopia) is gone. TECHNIQUE: Ethiopian church-painting style (flat colours,
    large expressive eyes, strong outlines). Interior of a rock-hewn seed vault: shelves of glass seed jars, many
    empty, one shattered on the floor with seeds spilling like gold coins; an old guardian in white cotton
    shawl sitting asleep against the shelf with a key on a cord. Warm candle light.
  mapa_ido_ZSA: >-
    The Cape Federation (South Africa) is gone. TECHNIQUE: dramatic seascape oil painting. CAMERA: from the sea
    looking at the Cape cliffs in a storm; an old lighthouse on the point has gone dark for the first time, enormous
    waves break white on the rocks, a single small fishing boat is heading out to sea away from shore. Stormy green
    water, purple clouds, no lights anywhere on land.
  mapa_ido_ZCO: >-
    The Congo Confederation is gone. TECHNIQUE: lush painting in deep greens. CAMERA: drone view low over the
    great Congo river: six long wooden pirogues tied together in a ring (the six councils) drift loose apart on the
    brown current, each now going its own way, empty; the rainforest presses on both banks. Mist on the water.
  mapa_ido_ZAO: >-
    The Union of Angola is gone. TECHNIQUE: industrial photograph at night, sodium orange. CAMERA: a burning gas
    flare tower at an offshore oil platform off Cabinda reflected in black sea; the platform's helipad is empty,
    a single orange life ring floating in the foreground water. The flame is the only light. Strong orange/black.
  mapa_ido_ZMZ: >-
    The League of Mozambique is gone. TECHNIQUE: watercolour and ink. CAMERA: from the top of the Cahora Bassa dam
    looking down its curved concrete face; one turbine-hall door is open and empty, and on the parapet a
    fisherman's net hangs drying with shells in it; the Zambezi below flows wide and brown into a hazy distance.
  mapa_ido_ZMG: >-
    The Assembly of the Red Island (Madagascar) is gone. TECHNIQUE: bright gouache. A single great baobab avenue
    seen straight down its centre at sunset, the red dirt road empty, and on the road a lone zebu cart with no
    driver, its cargo of rolled maps spilling off the back. Lemurs watching from a branch. Red, orange and violet.
  mapa_ido_ZKE: >-
    The Rift Federation (Kenya) is gone. TECHNIQUE: wildlife photography style. CAMERA: long telephoto, eye level
    with the grass: a lion resting on the steps of an empty open-air council amphitheatre in the Rift Valley, the
    stone seats around it covered in dust; a dropped ceremonial staff lies by the lion's paw. Golden light, very
    shallow depth of field.
  mapa_ido_ZHI: >-
    The Province of Hispania (Spain and Portugal) is gone. TECHNIQUE: Spanish baroque chiaroscuro painting
    (Zurbarán style). Still life on a dark ledge: a folded flag of plain unmarked red and yellow bands tied with a
    black ribbon, an old brass military bugle, a Roman provincial seal broken in half, and a guitar with snapped
    strings. Pure black background, one candle.
  mapa_ido_ZDA: >-
    The Province of Dacia (Romania, Bulgaria, Hungary) is gone. TECHNIQUE: eerie Carpathian night painting. CAMERA:
    from inside a concrete military bunker looking out through its narrow firing slit at a snowy mountain forest
    under a full moon; on the slit's ledge, a military junta officer's cap and a pair of gloves left neatly folded.
    The frame is mostly black concrete with a horizontal window of blue moonlight.
  mapa_ido_ZWE: >-
    The Warlords of Eurasia are gone. TECHNIQUE: gritty war photograph, desaturated. CAMERA: a frozen highway on
    the steppe seen from the cab of a truck through a cracked windshield: in the road ahead, a column of looted
    armoured vehicles abandoned in a line, painted with crude warlord skull emblems (no letters), snow drifting
    over them. Grey, olive and faded red.
  mapa_ido_ZWI: >-
    The Warlords of Hindustan are gone. TECHNIQUE: Mughal miniature painting with modern subjects, rich colours,
    flat perspective. A courtyard of a warlord palace: improvised armoured jeeps decorated with brass parked under
    arches, garlands of marigold wilting on them, monsoon rain drawn as fine lines, a peacock walking alone on the
    wet marble. No people.
  mapa_ido_ZWM: >-
    The Desert Emirates are gone. TECHNIQUE: epic desert painting. CAMERA: extreme long shot, tiny subject: a
    single falcon flying over endless dunes toward an oil well fire on the horizon; in the lower foreground sand, a
    golden curved dagger half buried, only the hilt showing. Ochre, black smoke, gold.
  mapa_ido_ZWB: >-
    The Amazon Warlords are gone. TECHNIQUE: lush, dark painting. CAMERA: underwater in a muddy jungle river,
    looking up at the surface: a sunken gold-dredge barge resting on its side, fish swimming through its machinery,
    gold pans settled in the silt; light rays falling through the brown water. Dark green, brown and orange.
  mapa_ido_ZAN: >-
    The Lawless Lands are gone: the last warlord fell. TECHNIQUE: post-apocalyptic comic art. CAMERA: an enormous
    junkyard throne made of welded car doors, road signs (blank) and scrap, seen frontally and empty; vines already
    climbing it, hazard-yellow paint peeling; a dog asleep on the seat. Rust, black and yellow.
  mapa_ido_ZSG: >-
    The Sanctuary of Gaia is gone: someone finally touched it. TECHNIQUE: sad, lyrical painting. CAMERA: inside
    the rainforest at the height of the canopy, a ranger's wooden lookout platform is empty and a green ranger's
    hat hangs on a nail; through a gap in the leaves, a straight scar of cut forest runs to the horizon with
    bulldozer tracks. Sunlight still gentle on the leaves.
  mapa_ido_ZJP: >-
    The Shogunate of the Shipyards is gone. TECHNIQUE: ukiyo-e woodblock print (Hokusai/Hiroshige style). A huge
    dry dock in Kanto with an unfinished giant samurai mecha lying on its back in the dock like a fallen statue,
    rain falling in straight lines, a great wave curling in the background over the harbour mouth, cherry blossom
    petals floating in the flooded dock.

  # ---------------------------------------------------------------------------
  # Nacen (mapa_nace_*)
  # ---------------------------------------------------------------------------
  mapa_nace_EFE: >-
    The Ecofascist Empire is born again. TECHNIQUE: heroic painting with art-nouveau curves. CAMERA: worm's-eye
    view from the forest floor looking straight up a giant tree trunk: the bark is grown through with living
    green bio-steel veins glowing faintly, and at the very top, through the canopy, a green and gold banner with a
    tree emblem unfurls in sunlight. Seedlings sprouting from the ground at the bottom edge.
  mapa_nace_ASC: >-
    The Automated Commune is reborn. TECHNIQUE: crisp constructivist poster, red and white. CAMERA: close-up of
    a single robotic hand flicking a large industrial switch from down to up; behind it, out of focus, rows of
    lights coming on one after another in a factory hall in a perfect diagonal. Strong geometric diagonal
    composition.
  mapa_nace_FCU: >-
    The Corporate Union is born. TECHNIQUE: glossy advertising art. CAMERA: macro shot of a stock-exchange bell
    being struck by a silver hammer, sparks of light flying, the bell polished chrome reflecting a skyline of glass
    towers; confetti of shredded old contracts in the air. Navy blue and silver, very clean.
  mapa_nace_HSN: >-
    The High-Seas Market Nation is born. TECHNIQUE: maritime oil painting, golden hour. CAMERA: from the waterline,
    the prow of a colossal new container ship sliding down a launch ramp, a bottle bursting on its hull, its teal
    and brass flag (compass emblem) raised on the mast; tugboats spraying water arches. Water at eye level.
  mapa_nace_NAS: >-
    The Neo-Andean Sun Kingdom is born. TECHNIQUE: radiant painting, gold and turquoise. CAMERA: from behind and
    above a single condor in flight (not people) over the Andes at sunrise; the first ray of sun hits a great gold
    disc on a mountain-top temple, which flashes like a second sun. Snow peaks glowing pink.
  mapa_nace_SHD: >-
    The Sino-Harmonious Directorate is born. TECHNIQUE: modern technical blueprint merged with ink painting. Top-down
    view of a river delta where gleaming new canals are being drawn in a perfect grid, half the image still a
    blueprint (white lines on blue), half already real water reflecting jade sky; tiny barges entering the first
    finished canal.
  mapa_nace_APF: >-
    The African Peoples' Federation is born. TECHNIQUE: joyful vibrant mural painting. CAMERA: looking straight up
    from the ground at a sky full of hundreds of hand-made kites in earth red, yellow and green, all flying from
    different villages and joining in one great spiral pattern; the tops of baobab trees at the edges of the frame.
  mapa_nace_NRE: >-
    The Neo-Roman Empire is born. TECHNIQUE: classical marble relief carving, freshly cut, white with gold leaf.
    A sculptor's chisel striking the final stroke on a new marble eagle with spread wings; chips of marble flying,
    gold leaf being laid on the laurel wreath. Extremely close, the eagle's eye fills the right side.
  mapa_nace_PTA: >-
    Southern Patagonia is born as a free state. TECHNIQUE: fresh, airy watercolour. CAMERA: from the deck of a small
    boat in the Beagle Channel: a brand new wooden pier with a pale blue-and-white flag of plain bands flying, a
    sheepdog running along it, snowy mountains behind. Penguins on the rocks. Clean cold light, hopeful.
  mapa_nace_YYG: >-
    Yvytu Ykua Guasu (Guarani Paraguay) is born. TECHNIQUE: Guarani-inspired folk art, flat, warm colours. A huge
    ceiba tree in flower in the middle of a red-earth plaza, and from its branches people have hung many small
    hand-painted jaguar flags (no letters); a harp leans against the trunk. Seen frontally, centred and symmetrical.
  mapa_nace_ZNG: >-
    New Granada is born. TECHNIQUE: magical realism, bright. CAMERA: looking down into the Panama canal locks from a
    bridge: the lock gates are opening and the water rushing in is full of yellow flowers instead of foam, a single
    small ship with a new flag (plain yellow, blue, red bands, no emblem) waiting to pass. Lush tropical green.
  mapa_nace_ZLL: >-
    The Free Plains of the Orinoco are born. TECHNIQUE: dynamic painting in motion blur. CAMERA: low and fast,
    alongside a galloping llanero horse at full speed across the flooded plains, water splashing in glittering arcs,
    a new flag tied to the rider's lance streaming behind; only the horse and lance are sharp, the rest motion lines.
  mapa_nace_ZNR: >-
    The Boreal Resource Zone is born. TECHNIQUE: northern-lights night photograph, long exposure. CAMERA: a frozen
    lake at night under a green aurora, a brand-new log assembly hall on the shore with all its windows lit warm;
    a single canoe pulled up on the snow with a fresh red and white flag on a paddle stuck in the snow.
  mapa_nace_ZSE: >-
    The Southern Economic Zone is born. TECHNIQUE: festive Mexican papel-picado-inspired art (abstract cut paper,
    no letters). CAMERA: straight up at strings of cut-paper banners crossing a narrow street between pastel
    houses, sun shining through them throwing coloured patterns of light on the walls; a single new flag hanging
    from a balcony. No people visible.
  mapa_nace_ZAF: >-
    The Antillean Free Ports are born. TECHNIQUE: Caribbean carnival poster art. CAMERA: from the sea, a fishing
    harbour at night where every boat has lit a lantern and fireworks burst over a small fortress; the reflections
    in the water break into coloured ripples. Bright, celebratory, no readable signs.
  mapa_nace_ZAS: >-
    The Southern Sea Pact is born. TECHNIQUE: clean modern travel-poster style. CAMERA: from underwater just below
    the surface (split view, half above, half below the waterline): above, a new sailing yacht with a flag of plain
    blue and white bands; below, a coral reef and a sea turtle. Bright turquoise.
  mapa_nace_ZBC: >-
    The Baltic Commune is born. TECHNIQUE: Scandinavian folk embroidery pattern come to life. A meadow on midsummer
    night: a tall maypole of birch decorated with wheat sheaves and ribbons in the centre, a bonfire beside it,
    and around it in a circle the silhouettes of dancers drawn as embroidery stitches. White night sky.
  mapa_nace_ZAL: >-
    The Workers' Republic of Albion is born. TECHNIQUE: British trade-union banner painting (painted silk with gold
    rope border shown as part of the picture, no text). Centre: a smith's hammer and a broken cog crossed over a
    green island, surrounded by roses and shamrocks; rays of sun behind. Rich crimson, green and gold.
  mapa_nace_ZKR: >-
    The Harmonious Protectorate of Korea is born. TECHNIQUE: minimalist digital art. CAMERA: from a high window of
    a Seoul skyscraper at night looking down: the whole city's street grid lighting up in sequence from one end to
    the other in a single line of white light, like a fuse being lit. Deep blue night, one bright line.
  mapa_nace_ZST: >-
    The Steppe Directorate is born. TECHNIQUE: Mongolian zurag painting style, flat bright colours, many small
    details. A naadam-like festival on the steppe seen from above: horse races in a spiral, wrestlers, archers,
    white gers in a circle and a new weather station mast at the centre decorated with blue khata scarves.
  mapa_nace_ZET: >-
    The Federation of the Highlands is born. TECHNIQUE: luminous painting. CAMERA: inside the dark seed vault, a
    heavy carved stone door swinging open toward the camera, highland sunlight pouring in on rows of glass seed
    jars that glow like lanterns; dust dancing in the beam. No people, only the door and the light.
  mapa_nace_ZSA: >-
    The Cape Federation is born. TECHNIQUE: sweeping aerial painting. CAMERA: from very high over Table Mountain at
    dawn, the famous "tablecloth" cloud pouring over its edge like a waterfall; below, a thousand small council
    fires lit along the coastline in a curving line. Pink and gold sky.
  mapa_nace_ZCO: >-
    The Congo Confederation is born. TECHNIQUE: Congolese popular painting (Chéri Samba-like naive realism, no
    text). Six long pirogues meeting in the middle of the great river, their prows touching in a star shape, seen
    from straight above; the water around them shines copper from Katanga sunset. Bold colours.
  mapa_nace_ZAO: >-
    The Union of Angola is born. TECHNIQUE: sunlit photograph. CAMERA: from the top of a lighthouse on the Luanda
    bay looking down at the long curving waterfront where a new flag is being hoisted on the old fortress walls;
    palm trees, a container ship turning in the bay. Bright midday colours, sharp shadows.
  mapa_nace_ZMZ: >-
    The League of Mozambique is born. TECHNIQUE: watercolour. CAMERA: from a dhow sailing on the Indian Ocean,
    looking up at its great triangular sail which has a new emblem painted on it (plain shapes, a star and a wave);
    the coast of Ilha de Moçambique on the horizon, flying fish leaping.
  mapa_nace_ZMG: >-
    The Assembly of the Red Island is born. TECHNIQUE: dreamy illustration. CAMERA: at eye level with a lemur
    sitting on a branch in the foreground right (the only living creature), watching a huge paper lantern in red
    and white rise from the island into a violet evening sky, other lanterns following from the hills below.
  mapa_nace_ZKE: >-
    The Rift Federation is born. TECHNIQUE: wildlife art. CAMERA: from the air, a vast migration of wildebeest
    crossing the Rift Valley in a single curving line that forms the shape of a river; at the edge of the frame, an
    open-air council amphitheatre carved in rock with a new banner. Golden dust.
  mapa_nace_ZHI: >-
    The Province of Hispania breaks free. TECHNIQUE: expressive Spanish painting (Sorolla light). CAMERA: on a
    beach at noon, the sea wind snapping an old banner of plain red and yellow bands hung between two fishing boat
    masts; a Roman eagle standard lies face down on the sand, washed by a wave. Blinding Mediterranean light.
  mapa_nace_ZDA: >-
    The Province of Dacia breaks free. TECHNIQUE: folk painting on glass (Romanian icon-on-glass style), bright
    and naive. A bunker door in a Carpathian hillside thrown open, and from it flows a river of red poppies down the
    mountain toward painted villages with church towers; a wolf sitting watching on a rock.
  mapa_nace_ZWE: >-
    A Eurasian warlord state rises. TECHNIQUE: heavy socialist-realist mural style turned grim. CAMERA: low angle on
    a giant scrapyard statue being welded together from tank parts by sparks, half-finished, a horse head made of
    steel plates; welding sparks fall like stars. Grey, rust and red.
  mapa_nace_ZWI: >-
    A Hindustan warlord realm rises. TECHNIQUE: vivid Indian truck-art painting (decorated panels, no letters).
    The front of an armoured truck painted in saffron and crimson with eyes, peacocks and lotus flowers, garlands
    over the bumper, seen straight on, centred, filling the frame. Monsoon sky behind.
  mapa_nace_ZWM: >-
    A Desert Emirate rises. TECHNIQUE: elegant Islamic geometric art with realism. CAMERA: inside a tent at night,
    looking up at the tent roof embroidered with geometric stars, a hooded falcon on its perch in the centre, a
    brass lantern throwing star-shaped shadows. Gold and black.
  mapa_nace_ZWB: >-
    An Amazon warlord state rises. TECHNIQUE: dark jungle painting. CAMERA: from the river surface at water level,
    a jungle sawmill with its saws spinning and orange sparks, logs floating toward the camera; a new crude flag
    nailed to the tallest tree stump. Fog, brown water, orange light.
  mapa_nace_ZAN: >-
    The Lawless Lands get a new boss. TECHNIQUE: punk comic art. CAMERA: top-down on a scrap metal map of the world
    welded on a garage floor, with a single fist-sized iron crown placed on it; paint cans and spray bottles around
    it, hazard yellow streaks. No people.
  mapa_nace_ZSG: >-
    The Sanctuary of Gaia is born. TECHNIQUE: luminous fantasy-realism. CAMERA: inside the rainforest at night, a
    clearing lit by thousands of fireflies forming a vast glowing circle; in the centre a ranger's carved wooden
    totem with a leaf emblem; jaguar eyes reflecting from the dark leaves.
  mapa_nace_ZJP: >-
    The Shogunate of the Shipyards is born. TECHNIQUE: modern anime key art, dramatic. CAMERA: extreme low angle
    from the floor of a dry dock up at a giant samurai mecha's helmet as its eyes ignite crimson; cherry blossom
    petals and sparks mixed in the air; a rising sun of neon behind its head.

  # ---------------------------------------------------------------------------
  # Formas Finales (mapa_forma_*): lo que ven los países chicos
  # ---------------------------------------------------------------------------
  mapa_forma_EFE: >-
    The Dominion of Gaia is proclaimed. TECHNIQUE: epic map painting. CAMERA: from orbit over South America at
    night: the continent is outlined by a continuous glowing green line of forest from the Caribbean to Cape Horn,
    and the cities are dark; a single golden crown of light hovering over Buenos Aires. Black space, green glow.
  mapa_forma_ASC: >-
    The Automated Commune's Final Form is proclaimed. TECHNIQUE: constructivist red-and-white geometry. A gigantic
    robotic fist made of thousands of smaller factory robots rising from a gridded plain of server buildings into a
    red sky, seen from extremely far away so the factories are tiny. Clean diagonal shapes.
  mapa_forma_FCU: >-
    The Corporate Union's Final Form is proclaimed. TECHNIQUE: hyper-glossy corporate render. A colossal chrome
    tower piercing clouds, with a golden contract scroll unrolling from its top all the way down to the ground and
    across a continent below seen through the clouds. Navy, silver and gold.
  mapa_forma_HSN: >-
    The Thalassocracy of the Seven Seas is proclaimed. TECHNIQUE: antique nautical chart come to life. Top-down: an
    old sea chart of the whole world where seven straits are marked with brass compass roses that glow, and real
    tiny ships sail across the parchment between them, leaving wakes of ink.
  mapa_forma_NAS: >-
    The Empire of the Eternal Sun is proclaimed. TECHNIQUE: radiant golden painting. A gigantic golden sun disc
    rising behind the whole spine of the Andes, so big it fills the sky, its rays laying gold paths across every
    valley and city of the continent; condors circling. Gold and turquoise.
  mapa_forma_SHD: >-
    The Directorate's Final Form is proclaimed. TECHNIQUE: shan-shui ink painting on a huge horizontal scroll, shown
    partly unrolled on a table seen from above: the painting shows rivers of all Asia joined into one harmonious
    canal network in jade and silver ink, the final brushstroke still wet. A jade seal beside it.
  mapa_forma_APF: >-
    The Federation's Final Form is proclaimed. TECHNIQUE: majestic mural. CAMERA: a great baobab whose roots spread
    across a map of the whole African continent drawn on red earth, its branches full of thousands of hanging
    lanterns, one for each village council; sunset sky in red, yellow and green bands.
  mapa_forma_NRE: >-
    The Eternal Empire is proclaimed. TECHNIQUE: Roman triumphal relief in gold and marble. CAMERA: worm's-eye view
    up through a colossal new triumphal arch at a sky full of gilded eagle standards held aloft (no people visible,
    just the standards rising into frame from below); laurel leaves falling.

  # ---------------------------------------------------------------------------
  # Guerras civiles de las potencias (mapa_civil_*)
  # ---------------------------------------------------------------------------
  mapa_civil_EFE: >-
    The Green Empire splits: Emperor against the Forest. TECHNIQUE: dramatic diptych painting split down the
    middle by a vertical tree trunk: left half a disciplined bio-steel army in green and gold under an imperial
    crown banner; right half wild forest militias emerging from the jungle with hunting rifles under a leaf banner.
    The trunk in the centre is cracked from top to bottom.
  mapa_civil_ASC: >-
    The Commune splits: machines against people. TECHNIQUE: stark black, white and red graphic. A chessboard seen
    from above where white pieces are small robots and red pieces are human workers with hammers, the board cracked
    in half down the middle and the halves drifting apart.
  mapa_civil_FCU: >-
    The Corporate Union splits. TECHNIQUE: noir photograph. CAMERA: from directly above a long boardroom table at
    night, cut in two by a sawn gap; the chairs on each side turned away from each other; scattered documents and
    two security guards' rifles lying crossed on the table. Navy blue and silver.
  mapa_civil_HSN: >-
    The High-Seas Market Nation splits. TECHNIQUE: storm-at-sea painting. Two great container ships sailing side by
    side, their mooring cables between them snapping and whipping in the wind, one flying the teal compass flag and
    the other a black privateer flag (plain shapes), lightning splitting the sky between them.
  mapa_civil_NAS: >-
    The Sun Kingdom splits. TECHNIQUE: Andean textile weaving shown in close-up. A woven tapestry of a golden sun
    being torn apart thread by thread down the middle, the two halves of the sun pulling in opposite directions;
    loose gold and turquoise threads hanging in the gap.
  mapa_civil_SHD: >-
    The Directorate splits. TECHNIQUE: ink painting. A great river splitting into two around a mountain island at a
    sharp fork, one branch of clear jade water, the other muddy and wild; a broken bamboo measuring rod floating at
    the fork. Seen from high above.
  mapa_civil_APF: >-
    The Federation splits. TECHNIQUE: linocut in earth colours. A council drum split in two lying on the ground,
    each half being carried away by a different procession of figures drawn as small silhouettes walking in
    opposite directions toward different villages on the horizon.
  mapa_civil_NRE: >-
    The Empire splits. TECHNIQUE: classical painting in the style of a Roman fresco, cracked plaster. Two legions
    in identical crimson armour facing each other across the river Rubicon at dawn, both with eagle standards, the
    river a bright line between them. Seen from high on a hill.
