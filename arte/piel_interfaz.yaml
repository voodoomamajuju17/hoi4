# Piel de la interfaz (2026-10-16): qué texturas del juego se cambian y cómo.
# Lo aplica `python3 -m tools.arte.arte piel` (tools/arte/piel.py) con las
# texturas originales del zip ui_para_claude.zip que arma empezar.bat; el
# resultado queda en assets/ui/piel/ y el build lo copia (ui_skin.py).
#
# retexturar: misma forma, relieve y transparencia que el original, con el
#   material del mod; los dorados pasan al acento verde azulado y los demás
#   colores (rojo, verde, azul: significan algo) quedan.
# iconos: dibujo nuevo pedido a ChatGPT (tipo ui_icon, archivo ui_<id>.png).
#   uso barra: va sobre la placa del botón de la barra, cuadro 2 más claro
#   uso directo: reemplaza el ícono entero; resaltado: cuadro 2 con contorno
#   uso combustible: cuadro 2 con flechas verdes (sube), 3 rojas (baja)
#   uso foto: llena el cuadro entero (sin transparencia)
# Fuera a propósito: máscaras, brillos y animaciones, banderas, tiras de
# íconos distintos (tensión mundial, categorías, políticas de ocupación),
# barras de progreso (sus colores dicen algo) y los fondos que ya cambia
# 11_scenario.yaml -> tab_backgrounds (tiled_plain_bg, tiled_generic_overlay_bg1).

material: assets/ui/fondo_ventanas.dds

