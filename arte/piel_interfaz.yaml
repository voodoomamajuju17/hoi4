  - id: estabilidad
    textura: gfx/interface/stability_icon.dds
    uso: directo
    donde: estabilidad (barra superior y todo el juego)
    dibujo: >-
      a balance scale in front view: a vertical post in the centre on a small base, a level horizontal
      beam at the top with a ring (like a gyroscope) where it meets the post, and two shallow pans
      hanging from the ends on three thin lines each. Both pans at exactly the same height.
  - id: apoyo_guerra
    textura: gfx/interface/war_support_icon.dds
    uso: directo
    donde: apoyo a la guerra (barra superior y todo el juego)
    dibujo: >-
      a raised clenched fist in an armoured gauntlet, front view, knuckles facing the viewer, the
      forearm going straight down to the bottom edge. Three plates on the back of the hand and two
      segmented rings around the wrist.
  - id: fabricas
    textura: gfx/interface/industrial_capacity_icon.dds
    uso: resaltado
    cuadros: 2
    donde: fábricas (barra superior)
    dibujo: >-
      a factory in front view: a wide block with a saw-tooth roof of three teeth, two tall smokestacks
      rising at the left, and a small robot arm folded on the right part of the roof. Two rows of
      square windows on the front. Square composition.
  - id: equipo
    textura: gfx/interface/equipment_icon.dds
    uso: directo
    donde: equipo (barra superior y listas de equipo)
    dibujo: >-
      a military supply crate in three-quarter view from slightly above, longer than tall, with two
      reinforcing bands around it and a small hexagon stencilled on its front face. Wider than tall
      (about 5:4).
  - id: convoyes
    textura: gfx/interface/topbar/topbar_convoys.dds
    uso: directo
    donde: convoyes (barra superior)
    dibujo: >-
      an autonomous cargo ship in exact side view, bow to the right, a low flat hull loaded with a stack
      of containers in the middle and a small slim bridge tower at the stern on the left, no funnel
      smoke. Two wavy lines under the hull. Much wider than tall (about 3:2).
  - id: bombas_nucleares
    textura: gfx/interface/topbar/nuke_icon.dds
    uso: directo
    donde: bombas nucleares (barra superior)
    dibujo: >-
      a radiation trefoil (three blades around a centre dot) on a round disc. Here, as an exception, the
      disc is filled with a dull warning amber and the trefoil is dark graphite; the steel and teal
      bevel go on the disc rim only. Round, filling 95% of the canvas.
