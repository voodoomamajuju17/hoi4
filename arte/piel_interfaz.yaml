    textura: gfx/texticons/command_power.dds
    uso: directo
    donde: poder de mando (barra superior y oficiales)
    dibujo: >-
      a military field headset in front view: a headband arc across the top, an ear cup on each side,
      and a microphone boom curving from the left ear cup to in front of where the mouth would be,
      ending in a small round microphone. Slightly wider than tall.
