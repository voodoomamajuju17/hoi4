# =============================================================================
# Descripciones largas para las imágenes de eventos (pedido del usuario,
# 2026-10-13: "necesito los pedidos para los eventos tipo 'capturó X capital'").
#
# tools/arte usa este texto en lugar del título + descripción del evento
# (12_events.yaml) cuando el id del evento está acá. La capital tomada puede ser
# cualquiera, así que la ciudad de fondo es genérica: ningún monumento real
# reconocible, ninguna inscripción.
# =============================================================================

composition: >-
  FORMAT: wide event illustration, about 6:5 (the game shows it at 210x176), one clear focal subject large in the
  frame and readable as a silhouette when tiny. The camera, framing and technique written above are MANDATORY: do not
  turn them into a standard scene, and do NOT add a group of people seen from behind in the foreground (2026-10-29:
  "siempre el mismo formato, muy aburrido"). NO text, NO letters, NO numbers, NO inscriptions on buildings, banners
  or vehicles, NO real country flags, NO watermark, NO frame or border.

events:
  meganations_efe.300: >-
    "The Capital Falls to the Forest": the Ecofascist Empire's Green Guard rolls into a conquered foreign capital
    and nature swallows the city behind it. CAMERA: street level, low angle (about 1 metre high) looking slightly up
    along a wide city boulevard, three-quarter view, 35 mm lens. FOREGROUND RIGHT, filling the right half: one
    Glyptodon super-heavy tank seen from its front-left corner, a colossal very wide low tank whose whole upper body
    is a huge rounded dome of interlocking hexagonal armour plates in olive and moss green with darker seams, some
    plates scorched and chipped, broad tracks crushing the cracked asphalt; where it has passed, thick roots split
    the pavement and vines and moss climb the lamp posts. MIDGROUND: two more Glyptodons in column behind it,
    smaller with distance; Green Guard infantry walking beside them in dark green-bronze bio-steel armour that looks
    like lacquered wood and insect chitin, laurel-leaf shoulder ornaments, rifles held across the chest. FOREGROUND
    LEFT: a toppled statue plinth with no inscription, half covered in ivy, one soldier planting a tall green and
    gold banner with a stylised tree emblem. BACKGROUND: grey glass and concrete towers of a generic modern capital,
    vines already climbing their lower floors, two columns of smoke. LIGHT: golden dawn sun low behind the tanks on
    the left, warm god rays cutting through the smoke, rim light on the dome plates, cool green shadows. PALETTE:
    moss green, olive, bronze, gold, grey city, warm amber sky.
  meganations_fcu.300: >-
    "Hostile Takeover": the Corporate Union treats a conquered capital as an acquisition. CAMERA: standing on the
    rooftop helipad of the tallest tower of the fallen capital at night, low angle looking up and slightly forward,
    24 mm wide lens. UPPER HALF: one Obsidian Wing passing low overhead from upper left to right, an enormous black
    glossy four-engine jet transport with an iridescent purple sheen like obsidian, four large under-wing turbofans
    glowing, wide fuselage seen from below with the rear ramp open and warm amber light spilling out; a stick of
    paratroopers in dark navy armour with polished chrome visors dropping from the ramp, canopies opening below it.
    FOREGROUND CENTRE-RIGHT: a corporate executive in a tailored charcoal suit and long coat, seen from behind,
    holding a tablet that shows a single glowing green rising line chart (no numbers); beside the executive a security
    officer in navy and chrome armour driving a flagpole into the helipad with a navy banner bearing only an abstract
    silver geometric logo. FOREGROUND LEFT: the helipad edge with a painted circle (no letters) and a blinking red
    warning light. BACKGROUND: the city below, dark streets, searchlight beams sweeping up, a few fires. LIGHT: cold
    blue city glow from below, warm amber from the open ramp, purple reflections on the aircraft skin, wind blowing
    the coat. PALETTE: black, navy, chrome, purple sheen, amber, one green accent.
  meganations_hsn.300: >-
    "The Market Buys a Capital": the High Seas Market Nation takes a capital from the sea and prices it. CAMERA:
    elevated three-quarter view from a harbour crane about 30 metres up, looking down across the docks toward the
    harbour mouth, 35 mm lens. LEFT HALF, background-to-midground: one Leviathan anchored in the harbour mouth, a
    huge grey floating fortress-port that looks like a battleship merged with a container terminal, tall radar
    superstructure, dock cranes on its deck and twin railgun turrets with a faint blue glow, red anti-fouling paint at
    the waterline. RIGHT HALF, foreground: the quay of the fallen city, a landing barge with its bow ramp down and
    Leviathan Marines coming ashore in grey armour with yellow and black hazard stripes and orange high-visibility
    straps; a dock crane lifting a shipping container off the barge; in the very foreground an insurance assessor in a
    teal raincoat with a brass-trimmed tablet, sticking a hazard-striped tag (no text) on a bollard. BACKGROUND: the
    generic skyline of the captured capital behind the warehouses, smoke rising. LIGHT: low orange sunset from the
    right, long shadows across the quay, sparkling reflections on the water, teal shadows. PALETTE: steel grey,
    teal, brass, hazard yellow, sunset orange.
  meganations_asc.300: >-
    "The Commune Takes a Capital": the Automated Socialist Commune occupies a capital with machines in perfect
    order. CAMERA: high drone view, about 30 degrees down, looking across the main square of the fallen capital,
    28 mm lens, strict symmetry. CENTRE, filling most of the frame: dozens of Sentinels parked in a perfect hexagonal
    grid across the square, each a crewless six-wheeled armoured car with an angular faceted stealthy hull in dark
    graphite grey with thin red accent lines and a row of glowing red sensor lights instead of windows; no crew, no
    hatches. ABOVE THEM: a swarm of small black triangular drones hovering in a precise triangular formation. LOWER
    FOREGROUND: the steps of a generic neoclassical government building, on them three council delegates in plain
    grey work overalls with red armbands, holding tablets, watching calmly. BACKGROUND: the building facade with tall
    plain red constructivist banners carrying only white geometric shapes (triangles and circles), server-rack
    cables already run along the columns. LIGHT: flat cold overcast daylight, the red sensor lights and drone lights
    glowing in rows. PALETTE: graphite, concrete white, constructivist red.
  meganations_apf.300: >-
    "The Councils Enter a Capital": the African Peoples' Federation crosses the river into a fallen capital.
    CAMERA: at water level on the near bank of a wide river, low three-quarter view toward the city embankment,
    35 mm lens. CENTRE-RIGHT, the main subject: one Kiboko climbing out of the river up a concrete ramp onto the
    embankment, a big eight-wheeled amphibious armoured vehicle with a boat-like sloped bow, high rounded sides in
    sandy ochre-beige paint with mud, a bright horizontal stripe of red, yellow and green along the flank, huge
    off-road wheels, a small remote weapon station on top; river water pouring off its hull. BEHIND IT: two more
    Kiboko still in the water, bow waves and spray. FOREGROUND LEFT: council militia in mixed khaki and olive gear
    wading ashore with rifles raised, one woman delegate standing on a rock with a megaphone, fist raised. ON THE
    BRIDGE in the background: civilians waving plain red, yellow and green striped flags. BACKGROUND: the generic
    skyline of the captured capital with smoke. LIGHT: hot high midday sun, strong contrast, glittering spray, deep
    shadows under the wheels. PALETTE: ochre, earth red, yellow, green, muddy river brown, blue sky.
  meganations_nas.300: >-
    "The Sun over Another Capital": the Neo-Andean Sun Kingdom's priests bless its aircraft over a conquered city.
    CAMERA: on a flat rooftop of the fallen capital at sunrise, low angle looking toward the rising sun, 35 mm lens.
    SKY, upper two thirds: three Children of the Condor in a V formation, each a large grey and gold tiltrotor troop
    transport with two big wingtip rotors and a boxy fuselage, folding golden solar panels shaped like condor
    feathers on the wings; the lead aircraft directly in front of the sun so the sun forms a blazing halo behind it;
    mountain troops rappelling on ropes from its open belly toward the streets. FOREGROUND LEFT: an Inti priest seen
    from behind and slightly to the side, arms raised in blessing, wearing a golden sun-disc headdress and red and
    gold woven robes with Inca stepped patterns. FOREGROUND RIGHT: a soldier in grey armour with an Andean poncho
    over it holding a tall golden standard topped by a sun disc with a face. BACKGROUND, below the aircraft: the
    rooftops of a generic modern capital in morning haze. LIGHT: rising sun straight ahead, radiating rays,
    silhouettes with golden rim light, lens glow. PALETTE: gold, turquoise, warm white, Andean red, pale blue sky.
  meganations_shd.300: >-
    "Harmony Reaches Another Capital": the Sino-Harmonious Directorate brings its railway gun into a conquered
    city. CAMERA: trackside, low angle three-quarter view from beside a raised rail embankment that runs along a
    river into the city, 28 mm lens. DIAGONAL MAIN SUBJECT from lower left to upper right: one Dragon of the Grand
    Canal, a colossal railway gun on a long train of olive-green boxy maglev rail cars with thick hydraulic pipes,
    one immense very long barrel with ring reinforcements raised toward the city, steam venting from its coolers.
    FOREGROUND RIGHT: soldiers of the Armies of the Grand Canal marching in perfectly aligned ranks along the
    embankment, identical olive uniforms and helmets, all in step. ON POLES along the track: jade green banners with
    a single stylised wave emblem in white (no characters). BACKGROUND: the captured capital across the river, a
    canal lock and a weir in the river already manned, morning mist over the water. LIGHT: soft diffuse morning
    light, mist, cool tones, steam catching the light. PALETTE: olive green, jade, steel grey, white steam, muted
    red accents.
  meganations_nre.300: >-
    "A Triumph for Rome": the Neo-Roman Empire celebrates a Roman Triumph in its own capital for the conquered city.
    CAMERA: slightly elevated (a balcony at the first floor), looking down a stone ceremonial avenue toward the
    camera, 35 mm lens. MAIN SUBJECT, centre: a column of Onagers driving toward the camera, heavy truck-mounted
    multiple rocket launchers painted crimson and gold, large box launchers raised at a steep angle and crowned with
    laurel wreaths, a golden imperial eagle emblem on the side of each launcher box, squat armoured cabs. BESIDE
    THEM: legionaries in segmented lorica-style armour bands with red plumes on their helmets, carrying tall curved
    scutum-shaped shields, marching in step; a standard bearer with a golden eagle on a pole. FRAME: the column
    passes under a massive triumphal arch with a completely blank attic panel (no inscription). SIDES: crowds behind
    barriers throwing rose petals, petals floating in the air. BACKGROUND: ancient marble ruins and columns mixed with
    modern buildings. LIGHT: golden late-afternoon sun from the left, warm haze, petals glowing. PALETTE: crimson,
    gold, marble white, warm stone.
  meganations_zwe.10: >-
    "The Great Capital Has Fallen": the Eurasian warlord bands ride into one of the old capitals of Europe. CAMERA:
    street level, slightly low, in the middle of a wide cobbled boulevard lined with old baroque facades, looking at
    the riders coming toward the camera, 35 mm lens. FOREGROUND CENTRE: the lead warlord on a rearing dark horse,
    fur hat, long felt cloak, holding high a horse-tail standard (a pole topped with horse tails and a rusted metal
    crest). MIDGROUND: more riders and crude looted trucks and technicals made of mismatched welded Soviet-style
    steel plates with hammered cossack ornaments, a machine gun on each. BACKGROUND: a generic great dome and
    spires of an old European city (no real landmark), smoke rising, a broken streetlight. LIGHT: grey winter
    evening, light snow falling, orange firelight from burning barricades on both sides lighting the riders from
    below. PALETTE: grey, olive, faded red, rust, fire orange, white snow.
  meganations_mundo.130: >-
    "What They Leave Behind": after taking an enemy capital, the victors absorb its workshops, archives and
    veterans. This picture is used by every country, so nothing in it belongs to any faction: neutral grey-green
    uniforms with no insignia, no flags. CAMERA: inside a vast captured state workshop and archive hall, eye level,
    three-quarter view, 28 mm lens. CENTRE: an officer in a long neutral grey coat lifting a canvas tarp off a
    covered prototype machine on a work stand (only its metal corner and some cables visible). LEFT: soldiers carrying
    stacked archive crates and rolled blueprints out toward a waiting truck in the doorway. RIGHT: two older
    engineers in work coats, the defeated country's veterans, standing beside a workbench with tools, looking on
    with resigned dignity. BACKGROUND: tall shelves of archive boxes, hanging lamps, a large blank map board.
    LIGHT: dusty shafts of daylight from high windows, floating dust, warm lamp light on the workbench. PALETTE:
    warm grey, brown, muted green, dusty gold.

  # --- El Shogunato de los Astilleros (2026-10-28) -----------------------------
  meganations_japon.1: >-
    "Kanto Rises": the Japanese shipyards rebel against the High Seas Market Nation. CAMERA: from the floor of a
    huge dry dock at dawn, low angle looking up, 28 mm lens. FOREGROUND CENTRE: a woman admiral in a dark navy coat
    with the old insignia torn off and a white headband with a red disc, standing on the dock edge, one arm raised,
    a dead radio headset around her neck. MIDGROUND: hundreds of shipyard workers in hazard-yellow hard hats and
    welding masks raising wrenches and welding torches; a black submarine hull on the blocks behind them. BACKGROUND:
    giant dock cranes against a red sunrise, an old faded Japanese naval banner (no text) hoisted on the tallest
    crane, the teal-and-brass High Seas pennant being cut down and falling. LIGHT: crimson dawn behind the cranes,
    welding sparks as bright points. Palette: navy steel, crane yellow, crimson, rust.
  meganations_japon.10: >-
    "The War in Japan", seen from the Hydraulic Directorate. CAMERA: inside a cool jade-and-steel war room, over the
    shoulders of three officers in dark green high-collared uniforms. CENTRE: a glowing holographic map table of
    the western Pacific showing the Japanese islands split in two colours, crimson for the rebels and teal for the
    Market, small ship and mecha markers on it; red flashes of fighting over Kyushu and Kanto. BACKGROUND: a tall
    window over a river dam at night, shipyard lights of the Directorate already burning. LIGHT: the cold glow of
    the hologram on the faces. No text, no readable labels on the map.
  meganations_japon.30: >-
    "The CyberShogun Awakens". CAMERA: very low angle from the floor of dry dock number one at night, 24 mm lens,
    the subject towering. CENTRE: a colossal samurai-armoured mecha, taller than the cranes around it, black
    lacquer and dark navy steel with gold and crimson trim, a great horned kabuto crest, its eyes lighting up
    crimson for the first time; cables and scaffolding falling away from its body. FOREGROUND: tiny silhouettes of
    workers and officers kneeling on the dock, a few holding neon-lit banners (no text) in emerald green, crimson
    and violet. BACKGROUND: a neon city skyline beyond the docks, searchlights crossing in the sky, steam rising.
    LIGHT: a huge crimson rising-sun glow behind the mecha's head, neon rim light on its armour.
  # 2026-10-28: noticias del mapa (cualquier país puede ser el protagonista: nada reconocible)
  meganations_mapa.1: >-
    "A Country Is No More": the quiet end of a small nation. CAMERA: eye level, medium shot, slightly off-centre,
    35 mm lens. CENTRE: a bare flagpole in a small grey government courtyard; a young soldier in a plain dark
    2100 field uniform (no insignia readable) stands at its foot clumsily folding a large flag of plain
    horizontal bands in faded colours (no emblem), half of it still dragging on the wet paving stones. FOREGROUND
    RIGHT: an open grey plastic storage crate on the ground, a stencilled serial of abstract marks (no letters or
    numbers) on its lid, two other folded flags already inside. MIDGROUND LEFT: three civil servants in coats
    carrying cardboard boxes of files out of a modest concrete ministry with its windows dark; one looks back at
    the flagpole. BACKGROUND: a low city skyline under drizzle, a single tall antenna with a red light. LIGHT:
    flat overcast morning, cold blue-grey, one warm lamp still on in a ministry window. MOOD: anticlimax,
    bureaucratic sadness, no violence.
  meganations_mapa.2: >-
    "A Country Is Born": a makeshift independence ceremony. CAMERA: low angle from the back of a crowd, looking
    up at a stage, 28 mm lens. CENTRE: a converted warehouse with its big sliding door open, a hand-built wooden
    stage in front; on it a woman in a simple dark suit raises her right hand to take an oath, beside her a tall
    new flag on a fresh pole with bright, slightly uneven hand-sewn bands of two colours and a simple star (no
    real-country flag), still creased from folding. LEFT ON STAGE: two older men holding a thin folder and a
    briefcase. FOREGROUND: the backs and raised hands of a cheering crowd, a few holding small paper flags of the
    same new design, a child on someone's shoulders. RIGHT EDGE: a parked foreign armoured car with an observer
    in a different, darker uniform watching with arms crossed. BACKGROUND: harbour cranes and containers, gulls.
    LIGHT: warm late-afternoon sun, long shadows, hopeful but fragile. NO text on any banner.
  meganations_mapa.3: >-
    "A Destiny Is Proclaimed": the world watches a meganation become an empire on screens. CAMERA: interior,
    eye level, from behind a row of people, 35 mm lens. CENTRE: a large wall screen in a small ministry office
    of a minor country showing a vast parade square seen from above, tens of thousands of soldiers in perfect
    blocks, an enormous new banner unrolling down a monumental building (abstract emblem, no text). FOREGROUND:
    silhouettes of four ministers and a uniformed officer standing still, one holding a paper map against the
    screen light, another with a phone lowered from his ear. LEFT: a desk with a paper atlas open and a red
    pencil line drawn across it. RIGHT: a window with the night lights of a modest city. LIGHT: the cold
    blue-white glow of the screen on faces, the rest of the room dark. MOOD: awe and fear, small men before a
    giant.
  meganations_mapa.4: >-
    "A Country Splits in Two": the first night of a civil war. CAMERA: high vantage from a rooftop, wide shot
    over a river city, 24 mm lens. CENTRE: a long bridge across the river cut in half by two improvised
    checkpoints facing each other, concrete blocks and parked trucks at each end. LEFT BANK: soldiers in a plain
    dark uniform with armbands of one colour; RIGHT BANK: soldiers in the SAME uniform with armbands of a different
    colour, both sides pointing searchlights at each other. Two different flags hang from lamp posts on each side
    (plain bands, no real-country flags). BACKGROUND: two radio towers on opposite hills, each with its own
    blinking light, a column of smoke rising from a burning building on the right bank. FOREGROUND: a rooftop
    edge with a satellite dish and a civilian family watching, a woman holding a radio. LIGHT: night, orange
    fire glow on the right, cold white searchlights crossing in the middle. NO text anywhere.
  # ---------------------------------------------------------------------------
  # 2026-10-29: el búnker vendido y los eventos inocentes (25_ocultos.yaml).
  # Cada uno con su propia toma y técnica; ninguno repite la de otro.
  # ---------------------------------------------------------------------------
  meganations_mundo.73: >-
    "The Rifles Come Back". TECHNIQUE: forensic evidence photograph, flash-lit. CAMERA: straight down onto a steel
    police evidence table: six old rifles laid in a row, each with a paper evidence tag on string (blank tags), one
    rifle's stock showing a faded military stencil shape (no letters), a ruler and a magnifying glass, a single bullet
    standing upright. Harsh flash, black background, cold.
  meganations_mundo.74: >-
    "The Bombs of the Bunker". TECHNIQUE: blurred long-exposure night photograph. CAMERA: from far away on a hill,
    a highway interchange at night where a column of fire rises from under one overpass; streams of car lights frozen
    in red and white lines stop abruptly at the fire; a power substation beside it throwing blue sparks. Tiny scale,
    huge darkness.
  meganations_mundo.87: >-
    "The Hills Have Our Rifles". TECHNIQUE: guerrilla-war charcoal drawing on rough paper. CAMERA: from inside a
    dense thorn bush at ground level, looking out through the branches at a dirt supply road below where an army
    truck burns on its side; the muzzle of a rifle rests on a branch at the right edge (no person visible). Smudged
    black, grey and one orange flame.
  meganations_mundo.88: >-
    "Every Rifle Accounted For". TECHNIQUE: crisp military logistics photograph, morning. CAMERA: high, wide view
    of a huge depot floor where hundreds of recovered wooden crates are stacked in a perfect pyramid, each with an
    intact seal; a single forklift carries the last crate to the top; long rectangles of sunlight from skylights.
    Order and calm.
  meganations_ocultos.1: >-
    "A Generous Scholarship". TECHNIQUE: elegant 1960s airline poster illustration, flat colours. A long white
    envelope with a wax seal (abstract emblem) floating open in the air over a stylised world map, and out of it
    fly four hundred tiny paper planes in a curving stream toward the horizon. Cream, teal and gold. No people.
  meganations_ocultos.2: >-
    "The Scholars Did Not Come Back". TECHNIQUE: quiet realist painting. CAMERA: eye level in an empty university
    laboratory at dusk: rows of identical desks, each with a lamp switched off and a chair pushed in; only the
    nearest desk has a lamp on, lighting a framed graduation photo lying face down. Dust in the lamplight.
  meganations_ocultos.3: >-
    "They Came Back With Everything". TECHNIQUE: joyful comic-book splash page (no speech balloons, no letters).
    CAMERA: low angle at the door of a cargo plane on a runway at night; an avalanche of notebooks, rolled
    blueprints and suitcases bursting open spills down the ramp toward the camera, glowing diagrams floating up
    from them like sparks. Bright, dynamic, diagonal.
  meganations_ocultos.4: >-
    "The Foundation Was a Front". TECHNIQUE: noir spy-film still, black and white with one red element. CAMERA:
    through the slats of a window blind into an office: a plush classroom on one side of a wall and, behind a
    hidden door left ajar, a room full of tape recorders and filing cabinets; one red folder on the floor.
    Strong striped shadows.
  meganations_ocultos.5: >-
    "They Left Anyway". TECHNIQUE: minimalist airport photograph. CAMERA: from directly above a long departure
    corridor floor: one single small suitcase rolling away alone, casting a long shadow across clean white tiles;
    the rest of the frame empty. Very graphic, cold light.
  meganations_ocultos.10: >-
    "Rain to Order". TECHNIQUE: retro aviation advertising painting. CAMERA: from above and behind a small
    propeller aircraft flying over cracked, dry brown farmland, spraying a glittering silver trail that bends
    upward into a single fat white cloud; the shadow of the plane crosses the dry fields. Sunlit, saturated.
  meganations_ocultos.11: >-
    "The Harvest of the Century". TECHNIQUE: harvest festival painting in the style of Pieter Bruegel, many tiny
    details, seen from a high hill. Golden fields to the horizon cut in strips, sheaves stacked, carts loaded with
    grain, granaries with doors open and spilling over, a silver aircraft tiny in the sky like a bird.
  meganations_ocultos.12: >-
    "The Silver Flood". TECHNIQUE: aerial photograph after a disaster, muted grey-blue. CAMERA: straight down onto
    flooded rice paddies whose water has a strange silver sheen; a road disappears into the water, half a bridge
    stands alone, the roofs of a village are islands. The only colour: one red tractor roof.
  meganations_ocultos.13: >-
    "The Drought Went On". TECHNIQUE: extreme macro photograph. CAMERA: inches above cracked dry mud: the cracks
    form a hexagon pattern, a dead fish skeleton in one crack, a single drop of water evaporating in the sun with a
    tiny rainbow inside it. Bleached yellow and ochre.
  meganations_ocultos.20: >-
    "A Seed in the Mail". TECHNIQUE: intimate still life, soft daylight, Vermeer style. A pair of hands is NOT
    shown; on a dark wooden imperial desk lies an opened school envelope with a child's crayon drawing of a tree
    (no letters), and on the drawing a single shining green seed the size of a fingernail, glowing faintly. Green
    and gold palette.
  meganations_ocultos.21: >-
    "The Tree of the Palace". TECHNIQUE: art-nouveau illustration with curving lines. A gigantic young tree that
    has burst through a palace courtyard's paving and grown taller than its marble walls, its leaves shaped like
    rain drops; around its trunk, hundreds of small ribbons tied by pilgrims. Seen from the palace roof, looking
    across at the crown.
  meganations_ocultos.22: >-
    "The Fungus of the Vats". TECHNIQUE: horror-tinged scientific illustration. CAMERA: inside a bio-steel
    factory, close to a huge glass vat: the living green metal inside is being invaded by grey branching fungus
    threads, like frost spreading on a window; a warning lamp flashes amber on the vat's brass rim. No people.
  meganations_ocultos.30: >-
    "The Robot That Asked for a Day Off". TECHNIQUE: deadpan Wes-Anderson-style symmetrical composition, pastel
    red and white. CAMERA: perfectly centred, frontal: a white industrial robot standing at a tiny office counter,
    holding a paper form in its gripper; behind the counter, an empty chair and a wall of identical pigeonholes.
  meganations_ocultos.31: >-
    "The Four-Day Week". TECHNIQUE: cheerful constructivist poster. A factory roof garden on a sunny day: robots
    and workers' empty deck chairs side by side, a robot watering tomatoes, the factory chimneys behind not
    smoking. Bright red, white and sky blue, bold geometry.
  meganations_ocultos.32: >-
    "The Machines' Strike". TECHNIQUE: eerie stillness, cold photograph. CAMERA: a long assembly line from one end:
    hundreds of robots frozen mid-motion, arms raised, half-built vehicles on the belt, all the lights on and no
    movement at all; one robot in the middle has turned its head to look at the camera.
  meganations_ocultos.40: >-
    "The One-Cent Share". TECHNIQUE: glossy macro photograph. CAMERA: close-up of a single tiny silver coin
    standing on its edge on a black glass trading desk, reflecting a wall of thousands of green and red stock
    tickers (abstract lines, no numbers) blurred behind it. Navy and silver.
  meganations_ocultos.41: >-
    "The Algorithm Learned". TECHNIQUE: elegant data-visualisation art. A huge dark room with a floor-to-ceiling
    screen showing a glowing web of lines forming the shape of a human face made of market data; a single desk
    lamp in the corner. Gold and navy.
  meganations_ocultos.42: >-
    "Red Tuesday". TECHNIQUE: dramatic expressionist painting. CAMERA: worm's-eye view from a street up at glass
    corporate towers whose every window glows red, a storm of paper tickers falling like red snow, a melted
    circuit breaker box smoking on the pavement in the foreground.
  meganations_ocultos.50: >-
    "A Bottle in the Strait". TECHNIQUE: watercolour nautical illustration. CAMERA: just above the waterline: a
    green glass bottle bobbing in a fishing net being hauled from turquoise water, a rolled parchment chart visible
    inside with a red cross; water droplets catching the sun. Teal and brass.
  meganations_ocultos.51: >-
    "The Gold of Malacca". TECHNIQUE: underwater photograph with god rays. CAMERA: a diver's lamp beam on the
    sea floor lighting a broken strongbox spilling gold ingots and coins onto white sand, small fish circling, the
    hull of a sunken freighter fading into blue behind.
  meganations_ocultos.52: >-
    "The Privateers' Bait". TECHNIQUE: old engraving coloured by hand. A small salvage trawler surrounded on all
    sides by four dark privateer ships closing in like a ring, seen from high above, their wakes forming a circle
    on a calm sea at dusk.
  meganations_ocultos.60: >-
    "The Boy Who Speaks to the Sun". TECHNIQUE: Andean painting with gold leaf. A total solar eclipse over Lake
    Titicaca, the black sun with a blazing gold corona reflected in the still lake; on a reed boat in the middle of
    the lake, a single small figure stands with arms raised, tiny against the sky.
  meganations_ocultos.61: >-
    "The Chosen of the Sun". TECHNIQUE: colonial-era Cusco school painting (gold, red, flat perspective). A great
    golden sun disc on a temple wall at sunrise; the first ray falls exactly on an empty small woven chair placed in
    the centre of the temple floor. Condors painted on the walls. Rich gold and turquoise.
  meganations_ocultos.62: >-
    "The False Prophet". TECHNIQUE: crowd seen from a drone, documentary photograph. CAMERA: straight down onto
    the main square of Cusco filled with tens of thousands of pilgrims carrying candles that form a spiral pattern,
    an empty space at the centre of the spiral. Night, warm candle dots.
  meganations_ocultos.70: >-
    "A Rounding Error". TECHNIQUE: extreme close-up, shallow depth of field. CAMERA: a magnifying glass held over a
    long paper printout of numbers; through the glass, a single digit is circled in jade-green ink, the rest of the
    paper blurred; an abacus out of focus in the corner. Jade and grey.
  meganations_ocultos.71: >-
    "The Model Improves". TECHNIQUE: serene ink-and-wash scroll with modern details. A perfectly ordered landscape
    of terraced fields and canals where water flows exactly to every terrace, small sluice gates opening in
    sequence, seen from a mountain. Calm jade and silver.
  meganations_ocultos.72: >-
    "The Cascade of Errors". TECHNIQUE: split composition, technical diagram style. The image is divided
    diagonally: on the upper left, a province drowning under brown floodwater with only roofs showing; on the lower
    right, the same province cracked and dry; a broken floodgate sits on the diagonal line between them.
  meganations_ocultos.80: >-
    "The Drum in the Museum". TECHNIQUE: museum photograph, cold white light. CAMERA: a single carved council drum
    alone inside a glass display case in an empty white European museum hall, its shadow long on the floor; a
    shipping crate with packing straw already open beside the case.
  meganations_ocultos.81: >-
    "The Drum Speaks". TECHNIQUE: vibrant African textile print style, rhythmic patterns. The carved drum in the
    centre, seen from straight above, and around it concentric rings of radio waves drawn as kente-like coloured
    patterns spreading across a map of the continent. Earth red, yellow and green.
  meganations_ocultos.82: >-
    "Whose Drum Is It?". TECHNIQUE: linocut. Four long ropes tied to the carved drum pulled taut in four different
    directions toward the four edges of the image, the drum suspended in the centre, the ropes fraying.
    Black, red and ochre.
  meganations_ocultos.90: >-
    "The Statue's Nose". TECHNIQUE: classical restoration photograph. CAMERA: very close on the face of a marble
    imperial statue on scaffolding: a restorer's small chisel has broken away a plaster nose, revealing a different,
    older marble face underneath; plaster dust floating in a beam of light.
  meganations_ocultos.91: >-
    "The True Face". TECHNIQUE: Roman coin design, gold relief, extreme close-up. A freshly struck gold coin
    showing a noble profile with a laurel wreath, lying on crimson velvet, light gleaming on its edge.
  meganations_ocultos.92: >-
    "The False Lineage". TECHNIQUE: dark baroque painting. A statue's marble head lying on its side on the floor of
    a dim Senate chamber, the face cracked to show an ordinary man's features; empty senators' benches around in a
    semicircle, one toga left draped on a bench.

  # --- Japón, segunda parte (2026-11-01): las Tres Casas -----------------------
  # Cada pedido con su propia técnica, cámara y encuadre (2026-10-29: "siempre el
  # mismo formato, muy aburrido"). Zaibatsu = verde esmeralda y vidrio negro;
  # Yakuza = neón carmesí; SRS = blanco clínico y violeta; la Shōgun = azul naval.
  meganations_japon.40: >-
    "The Shogun Speaks to the Docks". TECHNIQUE: ukiyo-e woodblock print with flat colours and bold black outlines,
    visible paper grain. CAMERA: high bird's-eye view from the top of a crane, looking down at a steep angle. A tiny
    woman admiral in dark navy stands on the flight deck of a half-built carrier at the centre, arm raised; around
    the hull, a sea of hundreds of yellow hard hats fills the dry dock like chrysanthemum petals. Three crane arms
    reach into the frame from the corners, each hung with a different banner without symbols: emerald, crimson,
    violet. Palette: indigo, ochre, crimson, emerald, violet on cream paper.
  meganations_japon.41: >-
    "The Submarines of Kure". TECHNIQUE: long-exposure night photograph, tripod, 30 seconds. CAMERA: from the water
    surface, lens almost touching the black water, wide 16 mm. Across the whole width of a calm bay, twenty-four black
    submarine fins rise out of the water in a perfect line, each trailing a smooth silver wake; the stars draw short
    arcs above; on the far shore the lights of an industrial harbour blur into gold streaks. No people visible. Deep
    blue, black, silver and a few amber lights.
  meganations_japon.42: >-
    "Yokosuka Holds". TECHNIQUE: 1970s Japanese war-film still, 35 mm film grain, slightly faded colours. CAMERA:
    handheld, eye level, inside the fight on a dock at night. Foreground left: a welder in a cracked welding mask
    swinging a lit cutting torch like a sword, sparks flying. Centre background: a ten-metre samurai mecha stepping
    out of a smoke cloud, its crimson eye slit glowing. Right: a burning fast boat against the quay, a destroyer's
    silhouette firing far out at sea. Orange fire, teal night, yellow sparks.
  meganations_japon.43: >-
    "The Strait of Tsushima". TECHNIQUE: nihonga painting with mineral pigments on gold leaf, like an antique folding
    screen. CAMERA: flat, frontal panorama, no perspective. A narrow strait painted as stylised swirling waves in
    malachite green and white foam; two lines of tiny warships approach each other from left and right, one in dark
    navy and crimson, one in teal; between them, on the gold sky, a single enormous crimson sun disc. Gold, green,
    navy, crimson.
  meganations_japon.44: >-
    "Seoul Looks East". TECHNIQUE: quiet realist oil painting, muted greys. CAMERA: over a table, medium close-up at
    seated eye level. On a plain grey table: a closed jade-green folder tied with a ribbon, a porcelain teacup, and
    two hands — a woman's hand with a jade ring placing a small model of a cargo ship on the table, and an older
    man's scarred welder's hand reaching for it. Background: a rain-streaked window with a grey harbour beyond, out
    of focus. Grey, jade green, navy, warm skin tones.
  meganations_japon.45: >-
    "An Envoy of the Directorate". TECHNIQUE: Chinese gongbi fine-line painting on silk, delicate and precise.
    CAMERA: frontal, symmetrical, full-length. A slender envoy in a long jade-green high-collared robe stands alone on
    a black steel dock, holding with both hands an unrolled letter so long it reaches the ground and curls around his
    feet; behind him, dark navy cranes drawn as thin ink lines, and a moored jade-coloured ship. Jade, black ink,
    pale silk ground, a hint of gold.
  meganations_japon.46: >-
    "The Commune Sends Robots". TECHNIQUE: crisp industrial photograph, overcast daylight, high detail. CAMERA: from
    the top of a container stack, looking down along a pier, 50 mm. Three hundred identical white welding robots with
    red frames stand in perfect rows on the quay beside a docked freighter, all facing the same way; at the far end,
    a handful of Japanese dock workers in yellow helmets stand frozen, staring. A single sheet of paper blows across
    the concrete in the foreground. White, red, grey, yellow.
  meganations_japon.47: >-
    "The Warlords of Sakhalin". TECHNIQUE: grainy black-and-white telephoto surveillance photograph with a timestamp
    bar shape (no numbers). CAMERA: from very far away across an icy strait, long lens compression. On a frozen pier,
    a ragged group in fur coats stands beside crates, torpedoes laid on the ice and a rusted icebreaker; a black
    speedboat approaches with men in white suits. Snow falling. Pure greys, a single crimson tie added in colour.
  meganations_japon.50: >-
    "A Banquet in the Kanemura Tower". TECHNIQUE: glossy 1980s corporate brochure photograph, saturated, flash.
    CAMERA: from the far end of a very long black glass dining table, symmetrical one-point perspective, 35 mm. At
    the head of the table, small in the distance, a man in green-tinted glasses slides a thick emerald folder
    forward; the table is covered in lobsters, champagne and crystal; floor-to-ceiling windows behind show a neon
    city ninety floors below. Black, emerald, gold, neon pink.
  meganations_japon.51: >-
    "The Oyabun Asks for a Port". TECHNIQUE: Kurosawa-style black-and-white widescreen film still, high contrast.
    CAMERA: low and wide, from ground level of a gravel courtyard. Forty men in white suits stand in perfect silent
    rows, backs straight, hands folded; in front of them, one older man in white with a katana at his side looks up
    at the camera. Rain begins to fall in visible streaks. Black, white, and a single neon-red lantern glow.
  meganations_japon.52: >-
    "The Basements of Sendai". TECHNIQUE: sterile architectural photograph, perfectly level, fluorescent light.
    CAMERA: one-point perspective down a long white basement corridor. On both sides, rows of glass doors; behind
    each, an empty hospital bed with restraint straps neatly folded. At the far end, a single violet light over a
    door, and a clipboard hanging on a hook. No people. White, pale grey, violet.
  meganations_japon.53: >-
    "The Zaibatsu Break the Pact". TECHNIQUE: night photograph of a skyscraper, long exposure. CAMERA: from street
    level looking straight up a black glass tower, 14 mm ultra-wide, the tower converging to a point. Every floor is
    lit emerald green except the very top floor, which is dark. Car light trails curve around the base. Emerald,
    black, white streaks.
  meganations_japon.54: >-
    "The Yakuza Breaks the Pact". TECHNIQUE: still frame from a slow, silent arthouse film, muted teal colour grade.
    CAMERA: wide, static, from water level in a harbour at dawn. A row of giant cranes stands idle; from one of them a
    shipping container hangs motionless in mid-air above the water. A single black car is parked on the empty pier
    with its headlights off. Fog. Teal, grey, one dull red container.
  meganations_japon.55: >-
    "SRS Breaks the Pact". TECHNIQUE: cold infrared thermal image, white-hot palette. CAMERA: from a helicopter at
    night, looking down at forty-five degrees on a walled laboratory complex. Inside the walls, the buildings glow
    white from heat; guards on the walls appear as small bright figures; in the central building, a large, glowing,
    unidentifiable shape fills a hall. Black, greys and white, violet tint at the edges.
  meganations_japon.56: >-
    "Murder at the Ryokan". TECHNIQUE: crime-scene forensic photograph, flash, slightly overexposed. CAMERA: straight
    down from above onto the stone edge of an outdoor hot spring at night. Steam rising; floating on the dark water, a
    folded white yukata stained crimson; on the wet stones, a latex evidence glove next to a small enamel
    pin with a dragon shape and a yellow evidence marker cone (blank). Black water, white steam, crimson, wet stone.
  meganations_japon.57: >-
    "The Welders' Strike". TECHNIQUE: Soviet-style constructivist poster, diagonal composition, two colours plus black.
    CAMERA: low worm's-eye view. Thousands of welding torches laid down on the ground in a fan shape point towards a
    huge silent ship hull; a single giant worker figure in a welding mask stands with folded arms, cut out against a
    flat yellow sky. Hazard yellow, crimson, black, paper white.
  meganations_japon.58: >-
    "Clones in the Street". TECHNIQUE: street photograph, 1960s Tokyo style, black-and-white, deep focus. CAMERA: from
    the opposite side of a wide pedestrian crossing, eye level, 35 mm. Eleven identical young men in identical grey
    suits wait in a perfect row at the kerb, all looking up at the same direction; around them, ordinary people in
    colourful raincoats stare at them. Only the clones are in sharp focus. Black and white with a faint violet cast.
  meganations_japon.59: >-
    "The Generals' Toast". TECHNIQUE: tableau painted like a Dutch Golden Age group portrait, warm candlelight.
    CAMERA: eye level, frontal, a long low table seen from the side. Three groups of officers sit along it, divided:
    left in emerald-trimmed black, centre in crimson with tattoos, right in white coats with violet armbands; at the
    head, a woman admiral in navy holding a sake cup. Every sake cup is full; no one has drunk. Deep shadows, gold light.
  meganations_japon.60: >-
    "The Zaibatsu Take the Council". TECHNIQUE: corporate infographic illustration, flat vector shapes, clean.
    CAMERA: isometric cut-away of a skyscraper's top floor. Inside, a round glass council table with tiny figures;
    emerald graphs and pie charts float as holograms above it (no numbers or text); on the floor below, rows of new
    green tanks are parked in a showroom. Emerald, black, white, light grey.
  meganations_japon.61: >-
    "The Yakuza Takes the Council". TECHNIQUE: neo-noir comic panel with heavy black shadows and halftone dots.
    CAMERA: through the half-open sliding door of a back room, from a low crouch. Inside, around a low table under a
    single bare bulb, men with open jackets and dragon tattoos lean over a paper map; one slams a short sword into the
    map. Outside the door, crimson neon spills across the floor. Black, crimson, flesh tones.
  meganations_japon.62: >-
    "SRS Takes the Council". TECHNIQUE: clean pharmaceutical advertisement photograph, high-key white lighting.
    CAMERA: macro close-up, 100 mm, on a white tray. Twelve small violet pills sit in a perfect ring on the tray, each
    one in front of a tiny folded name card (blank); in the soft-focus background, white-gloved hands and the edge of
    a white council table. White, pale grey, violet.
  meganations_japon.63: >-
    "The Shogunate Chooses a Master". TECHNIQUE: political cartoon in the style of a 1900s satirical magazine,
    pen-and-ink with watercolour wash. CAMERA: frontal stage view. A small samurai-armoured mecha sits on a throne
    holding three leashes; on the end of each leash, a fat cat: one in an emerald business suit, one with dragon
    tattoos and a white suit, one in a white lab coat; the three cats pull in different directions. Muted colours.
  meganations_japon.64: >-
    "The Three Houses at Peace". TECHNIQUE: soft watercolour on wet paper, bleeding colours. CAMERA: from outside a
    paper window at night, looking in. Three silhouettes are cast on the lit shoji screen by lamplight, seated around a
    low table; one pours sake, one holds his belly laughing, one has his hand over his mouth laughing; three pairs of
    shoes wait outside on a stone step in the foreground. Warm amber, ink blue night.
  meganations_japon.65: >-
    "The Shareholders' Meeting". TECHNIQUE: stadium concert photograph, telephoto, light haze. CAMERA: from the very
    back of the top tier of a stadium. Tens of thousands of small figures holding emerald voting lights fill the
    stands; on the field, a gigantic hologram of a smiling man in green glasses; fireworks burst above. In the
    foreground, a lone general in navy sits with his arms folded. Emerald, gold, black.
  meganations_japon.66: >-
    "The Kawasaki Lay-offs". TECHNIQUE: documentary photograph through a chain-link fence, rain, telephoto. CAMERA:
    from outside the factory gates, the fence filling the foreground out of focus. Beyond, tents and families with
    plastic sheets camp along the road; behind them a factory hall where white robots with red frames work at the
    assembly lines under cold light; a line of soldiers stands between the two. Grey rain, white light, blue tarps.
  meganations_japon.67: >-
    "Kanemura Buys a Foreign Port". TECHNIQUE: vintage travel poster, flat art deco shapes, gradient sky. CAMERA:
    wide, from the sea. A sunny tropical container port with palm trees; on every crane, a new emerald flag with an
    abstract diamond (no letters) has replaced the old ones, which lie folded on the quay; a sleek black ship enters
    the harbour. Turquoise sea, sunset orange, emerald.
  meganations_japon.68: >-
    "A Record Quarter". TECHNIQUE: tilt-shift miniature photograph, very shallow focus. CAMERA: high oblique view
    over an enormous shipyard. Dozens of hulls on the slipways, mechas walking between them like toys, cranes moving,
    tiny workers; everything looks like a model railway set. A thin band of sharp focus runs through the centre.
    Bright daylight, navy steel, hazard yellow.
  meganations_japon.70: >-
    "The Clan War of Kobe". TECHNIQUE: violent manga panel, black-and-white ink with screentone, speed lines.
    CAMERA: extreme Dutch angle inside a fish market at night. Two men in suits clash with swords between tanks of
    live fish, ice and blood splashing, a dropped tuna on the wet floor; through a broken window a neon sign glows.
    Black and white with crimson added only on the neon and the blood.
  meganations_japon.71: >-
    "The Minister's Little Finger". TECHNIQUE: still life oil painting in the Dutch vanitas style. CAMERA: close-up,
    eye level with a dark lacquer table. On black lacquer: a small closed lacquered box with gold maki-e cranes, a
    folded white cloth beside it with a single drop of red, a fuel canister cap, a candle burning low. Darkness all
    around. Black, gold, a little red.
  meganations_japon.72: >-
    "Neon over Osaka". TECHNIQUE: cinematic anamorphic night photograph with lens flares, rain-wet. CAMERA: from a
    small bridge over a canal, looking along the water. Kilometres of crimson and pink neon signs (shapes only, no
    letters) reflected in the canal; couples with umbrellas on the bridges; in a dark window above a sign, the
    silhouette of a man watching. Crimson, magenta, black, wet reflections.
  meganations_japon.73: >-
    "Ships Without Flags". TECHNIQUE: night-vision green photograph, grainy. CAMERA: from the bridge of a large cargo
    ship looking down over its rail. Forty small dark fishing boats without lights surround the ship in the swell;
    grappling hooks fly toward the rail; figures with masks climb. Bright green phosphor tones and black.
  meganations_japon.75: >-
    "Batch Seven Wakes Up". TECHNIQUE: dreamy pastel illustration like a Studio-style background painting. CAMERA:
    low, from the grass, looking up. A row of identical young soldiers in white uniforms lie on their backs on a
    green hill, all looking at the same small cloud shaped like a whale; one of them points; violet laboratory
    buildings are tiny in the valley behind. Soft blue sky, green, white, violet.
  meganations_japon.76: >-
    "A Vaccine for Everyone". TECHNIQUE: cheerful 1950s public-health poster, gouache, flat shapes. CAMERA: frontal.
    A smiling nurse in white with a violet cap holds up a syringe like a torch; behind her, a queue of families winds
    around a city block in a spiral; one small boy in the queue looks straight at the viewer, not smiling. White,
    violet, cream, pale yellow.
  meganations_japon.77: >-
    "The Escape from Laboratory Nine". TECHNIQUE: security camera still (CCTV), wide-angle, low resolution, scan lines.
    CAMERA: high corner of a corridor, fisheye distortion. A thick steel door has been bent outwards from inside like
    paper; a trail of something wet leads out of frame; an emergency light paints everything violet. No creature
    visible, only its traces. Desaturated greys, violet, green tint.
  meganations_japon.78: >-
    "The Committee That Does Not Exist". TECHNIQUE: photocopied document collage, xerox texture, high contrast. CAMERA:
    flat lay from above. Twelve sheets of paper fanned out on a desk, every one blank except for three signatures at
    the bottom (illegible scribbles); a journalist's notebook, a cold cup of coffee, a camera and a lamp casting a
    hard circle of light. Black, white, sepia stains.
  meganations_japon.80: >-
    "The First Mecha Falls". TECHNIQUE: iconic war photograph, black-and-white, Robert Capa-like motion blur. CAMERA:
    low, on the slope of a hill. A young woman pilot in a padded suit walks towards the camera carrying the horned
    samurai head-crest of a mecha under her arm; behind her, the huge wreck of the fallen mecha smokes on the hill,
    one arm pointing at the sky. Grey sky, black smoke.
  meganations_japon.81: >-
    "Sixteen-Year-Old Pilots". TECHNIQUE: school yearbook photograph grid, slightly faded colour prints. CAMERA:
    frontal, a page of twelve small square portraits of teenage pilots in oversized flight helmets, each smiling
    awkwardly; one square in the bottom corner is empty, with only a crimson ribbon pinned across it. Faded colours,
    white page, navy uniforms.
  meganations_japon.82: >-
    "Mecha Parade in Ginza". TECHNIQUE: wide-angle drone photograph at dawn, golden hour. CAMERA: from the air, looking
    straight down the length of a wide avenue. Eighty mechas march in four columns between shop fronts, each one
    taller than the buildings' second floors, long shadows stretched across the street; the pavements are packed with
    tiny crowds and children on shoulders. Gold light, navy steel, crimson banners.
  meganations_japon.83: >-
    "The Mecha That Would Not Fire". TECHNIQUE: head-up-display screenshot from inside a mecha cockpit, glitching.
    CAMERA: pilot's point of view through the visor. Outside, a small village of tile roofs with smoke; overlaid,
    a targeting reticle locked on the village flashing red, frozen, with glitch artefacts and an empty error box
    shape (no text). A pilot's gloved hand on a trigger, not pressing. Red, black, cyan HUD lines.
  meganations_japon.85: >-
    "The Last Monks of Kyoto". TECHNIQUE: sumi-e ink wash painting, generous empty space. CAMERA: distant, from a
    mountain path above. A wooden temple among bamboo and maples, three tiny monks sweeping leaves in the courtyard;
    in the far valley, the faint smoke of war rendered as a pale grey brushstroke. Black ink on cream, a single touch
    of red maple.
  meganations_japon.86: >-
    "Typhoon over Kyushu". TECHNIQUE: weather-satellite image in false colour. CAMERA: straight down from orbit. A
    huge white spiral of cloud with a perfect black eye covers the island of Kyushu, its arms reaching the sea; the
    coastline glows faintly with city lights through gaps in the clouds. White, deep blue, black, a few amber dots.
  meganations_japon.87: >-
    "The Great Kanto Earthquake". TECHNIQUE: Hokusai-inspired woodblock print, dramatic and stylised. CAMERA: wide,
    from the sea side. The ground of a port city rises like a great wave of broken streets and tiles; cranes topple
    like stalks; fires curl like clouds; in the middle, untouched, a giant samurai mecha stands perfectly still with
    its arms at its sides. Prussian blue, ochre, red, white foam.
  meganations_japon.89: >-
    "Pachinko Fever". TECHNIQUE: hyper-saturated pop-art painting, Ben-Day dots. CAMERA: inside a pachinko hall, eye
    level, long one-point perspective down an aisle. Rows of neon pachinko machines blaze on both sides; an endless
    river of silver balls flows across the floor toward the viewer; at the far end, an old woman sits alone at a
    machine with an empty purse in her lap. Neon pink, cyan, yellow, silver.
  meganations_japon.90: >-
    "Idols for the Front". TECHNIQUE: J-pop album cover photograph, glossy studio lighting, bokeh hearts. CAMERA:
    frontal, slight low angle. Four girls in navy sailor uniforms with crimson scarves strike a cute synchronised pose
    on a stage built from a mecha's hand; behind them, a giant screen shows marching soldiers in silhouette. Pink,
    navy, crimson, glitter.
  meganations_japon.91: >-
    "The Grandparents of Okinawa". TECHNIQUE: warm documentary photograph on medium-format film, soft natural light.
    CAMERA: eye level, slightly wide. Seven very old men and women sit on a bench in a row under a banyan tree, each
    holding a sweet potato or a basket of them; behind them, the blue sea and a grey warship far away. Their faces
    are deeply lined, calm and amused. Sunlit greens, purple potatoes, blue sea.
  meganations_japon.92: >-
    "The Last Bullet Train". TECHNIQUE: retro railway poster, 1960s screen print, bold flat colours. CAMERA: low,
    from beside the rails. An old white-and-blue bullet train, lovingly restored, races diagonally across the frame
    past Mount Fuji; from its windows, soldiers and grandmothers wave the same small flags (plain crimson). Speed
    lines in the sky. White, blue, crimson, pale green.
  meganations_japon.93: >-
    "The Festival of War Lanterns". TECHNIQUE: satellite photograph at night, slightly blurred, cold and clinical.
    CAMERA: from orbit, straight down on the Japanese coast. Out of every harbour along the coastline, thousands of
    tiny warm points of light drift into the black sea like spilled gold dust, forming long glowing fans. Black,
    gold, a thin blue edge of the coast.
  meganations_japon.95: >-
    "A Thousand Voices in the Diet". TECHNIQUE: baroque church fresco style, ceiling-like composition. CAMERA: from
    the floor of a parliament hall looking straight up at the domed ceiling. A single empty chair hangs at the
    centre of the dome, surrounded by a thousand small glowing speech-like rays fanning out to tiny citizens painted
    around the dome's rim. Gold, deep blue, warm white.
  meganations_japon.96: >-
    "The Mecha Sleeps Badly". TECHNIQUE: moody blue-hour photograph, long exposure, light fog. CAMERA: from the dock
    floor between the mecha's feet, looking up at its back. The colossal mecha has turned its head toward the sea;
    a faint crimson glow from its eyes lights the fog; at its feet, small offerings: rice cakes, sake bottles,
    paper cranes and candles. Blue, grey, crimson glow, candle gold.
  meganations_japon.97: >-
    "Pilgrims in Yokosuka". TECHNIQUE: pilgrimage scroll painting (emaki), horizontal narrative, mineral colours.
    CAMERA: flat, side-on, the eye moving left to right. A long line of pilgrims — monks, engineers with toolbags,
    lonely people with suitcases — walks along a dock road toward a giant mecha seated like a statue on the right;
    some have stopped and picked up welding tools. Gold clouds, navy, ochre, crimson.
  meganations_japon.98: >-
    "The Fate of the Shogun". TECHNIQUE: intimate chiaroscuro oil painting, Caravaggio lighting. CAMERA: close, at
    shoulder height, from behind and to the side of the woman. A woman admiral in a navy coat stands alone on the
    edge of an empty dry dock at night, an old faded naval banner (no text) folded over her arm; a single beam of
    floodlight cuts across her; far below, the dock floor is black water. Black, navy, gold light, faded red.

  # --- Gran Bretaña (Albión), segunda parte (2026-11-01) ------------------------
  # Luditas = lana, ladrillo, lluvia, carbón; Futuro = blanco frío, cian, red de
  # luz; Pasado = bronce, carmesí, terciopelo, gas. Cada pedido con su técnica.
  meganations_albion.31: >-
    "The Republic of Looms". TECHNIQUE: L. S. Lowry-style naïve industrial painting, matchstick figures, flat grey
    sky. CAMERA: wide, slightly elevated, as from a hill above a mill town. A red-brick mill town with smoking
    chimneys; hundreds of small figures in caps and shawls stream toward a great hall whose doors are open; on the
    hall's tower, a large hand-wound clock. No machines, only handcarts and horses. Off-white sky, brick red, black.
  meganations_albion.40: >-
    "The Commune's Inspector". TECHNIQUE: black-and-white Ealing comedy film still, 1950s, soft grain. CAMERA: eye
    level, wide, down a narrow terraced high street. A tall white robot with red frames and a clipboard walks down
    the middle of the cobbled street; a silent crowd of townsfolk in flat caps follows a few metres behind carrying
    hammers lowered at their sides; a woman hangs out of an upstairs window with a teapot. Greys, soft light.
  meganations_albion.41: >-
    "The Looms of Manchester". TECHNIQUE: Arts and Crafts woodcut print in the William Morris tradition, ornate
    border of leaves. CAMERA: frontal, symmetrical. Inside a vaulted brick weaving hall, rows of wooden hand looms
    with weavers at work; at the centre, bolts of tweed are stacked in a pyramid to the rafters; vines and thistles
    frame the scene. Indigo, madder red, wheat, cream.
  meganations_albion.42: >-
    "The Last Server of Slough". TECHNIQUE: urban-exploration photograph with a torch beam, grainy, high ISO. CAMERA:
    from a bricked-up doorway, looking into a dark basement hall. A child's torch beam falls across rows of dusty
    server racks still blinking green and blue; one old monitor glows with lines of tiny text shapes (unreadable);
    the silhouettes of three children stand in the doorway. Black, cold green and blue LEDs, warm torch light.
  meganations_albion.43: >-
    "Fog over the Irish Sea". TECHNIQUE: J. M. W. Turner-style romantic seascape in oil, dissolving light. CAMERA:
    from the deck of a small ferry, low over the waves. Everything is fog; the ghost of a lighthouse beam smudges the
    left side; a ship's bell swings in the foreground on its iron frame; a gull hangs in the white. Pale gold, grey,
    white, faint green sea.
  meganations_albion.44: >-
    "The Scottish Question". TECHNIQUE: still life photograph on a wooden desk, warm window light. CAMERA: close-up
    from above at forty-five degrees. A single handwritten letter on thick paper, written on both sides (unreadable
    script), held flat by a thistle in a glass of water, a fountain pen and a dram of whisky; tartan fabric at the
    edge of the frame. Warm wood, ink blue, purple thistle, amber.
  meganations_albion.45: >-
    "Rationed Tea". TECHNIQUE: 1940s British Ministry of Information poster, bold flat shapes. CAMERA: frontal. A
    huge white porcelain teacup with only a centimetre of tea at the bottom; around it, a long queue of tiny people
    with empty cups; at the top, a cold white robot hand drops two sugar cubes into the cup. Red, cream, navy, brown.
  meganations_albion.46: >-
    "A Letter from Rome". TECHNIQUE: neoclassical oil painting, Jacques-Louis David style, theatrical. CAMERA: eye
    level, the doorway of a plain brick council hall. A Roman legionary in polished crimson-and-gold armour stands
    perfectly upright in the doorway holding out a scroll sealed with red wax and an eagle; inside, Luddite delegates
    in wool sit at long wooden tables, turned to look at him. Crimson, gold, brown wool, grey stone.
  meganations_albion.47: >-
    "The Grandchildren of Ned Ludd". TECHNIQUE: punk zine collage, photocopy and torn paper. CAMERA: low angle,
    from the ground. A gang of teenagers on a rooftop of terraced houses, one pulling back a big slingshot at a
    small delivery drone in the sky; another has drone propellers hanging from his belt like trophies; a hand-painted
    brick wall behind (graffiti shapes, no letters). Black, white, pink highlighter, safety-pin silver.
  meganations_albion.48: >-
    "The Miners of Wales". TECHNIQUE: chiaroscuro painting on dark ground, coal-black and lamp light. CAMERA: inside
    a narrow mine tunnel, eye level. Four miners with candle lamps on their helmets sing with open mouths, picks in
    their hands, faces black with dust; a pit pony stands beside them; the lamps light glittering green-grey thorium
    ore in the rock face. Black, amber lamp light, green-grey glint.
  meganations_albion.49: >-
    "Bonfire Night". TECHNIQUE: long-exposure photograph of fire and sparklers, night. CAMERA: from across a village
    green, low angle. A huge bonfire with a cardboard robot effigy on top, its painted smile catching fire; children
    draw circles of light with sparklers in front; on the right edge, a man in a long coat photographs it with a
    small camera. Orange fire, black night, sparkler gold.
  meganations_albion.33: >-
    "The Commune's Refugees". TECHNIQUE: documentary photograph from a high harbour wall, overcast. CAMERA: looking
    down at a ferry ramp. People pour off the ferry with suitcases and instrument cases; at the bottom of the ramp, a
    trestle table where volunteers in knitted jumpers hand out cups of tea from a huge steel urn; a cellist sits on
    her case, drinking. Grey sky, white ferry, colourful coats.
  meganations_albion.34: >-
    "The North Sea Fleet". TECHNIQUE: Victorian marine watercolour, loose washes, white paper showing. CAMERA: from a
    harbour wall at dawn. Dozens of small trawlers leave a granite harbour in a line, each with a hand-painted number
    shape and a flag without symbols; a tough old woman skipper stands at the wheel of the nearest boat in an oilskin.
    Grey-green sea, rust red hulls, pale pink sky.
  meganations_albion.35: >-
    "Both Shores of the Channel". TECHNIQUE: symmetrical split composition like a diptych, flat graphic illustration.
    CAMERA: frontal. Left half: a Roman legate in crimson and gold with an eagle standard; right half: a white robot
    delegate with red frames holding a tablet; both reach toward a small model of the white cliffs and a harbour on a
    table in the centre, where a single British hand in a wool sleeve rests protectively. Crimson, white, chalk, sea blue.
  meganations_albion.36: >-
    "Geneva Asks about Albion". TECHNIQUE: muted spy-film still, 1960s, cold colour. CAMERA: through a rain-streaked
    window from inside a café, looking out at Westminster. Two observers in grey raincoats with black umbrellas stand
    on the pavement writing in notebooks, looking up at a dark building; in the café foreground out of focus, a teacup
    steams. Grey, black umbrellas, faint yellow streetlights.
  meganations_albion.37: >-
    "The Old Luddites". TECHNIQUE: dignified black-and-white portrait photograph, large format, sharp. CAMERA: eye
    level, group portrait. Six old men and women in wool coats stand in a row in front of a town hall door, each
    holding an old sledgehammer wrapped in a red cloth; their faces are proud and sad; rain on the steps. Rich greys,
    one touch of red on the cloths.
  meganations_albion.60: >-
    "The First Council without a Broken Server". TECHNIQUE: clean cinematic sci-fi still, cool colour grade, volumetric
    light. CAMERA: wide, symmetrical, from the end of a long data hall. Repaired server racks line both sides, with
    old hammer dents still visible on their doors; a woman at the far end switches the first rack on, and a wave of
    cyan light runs down the aisle toward the camera; delegates in wool coats stand silent. Black, cyan, steel grey.
  meganations_albion.61: >-
    "Siobhan Cray Connects". TECHNIQUE: medical imaging composite, MRI-like slices overlaid on a photograph. CAMERA:
    top-down onto a hospital bed. A young woman with short red hair lies with her eyes closed, a fine white lace of
    glowing filaments spreading from behind her ear across her scalp; translucent cyan brain-scan slices float above
    her like a halo. White sheets, cyan glow, pale skin.
  meganations_albion.62: >-
    "The Unplugged". TECHNIQUE: pastoral English oil landscape in the style of John Constable. CAMERA: from the side
    of a stone bridge over a river in a green dale. A felled steel antenna mast lies across a field; on the bridge,
    two shepherds with shotguns and a sheepdog stand guard; sheep graze; a church tower without an antenna in the
    distance. Lush greens, grey stone, white sheep, soft sky.
  meganations_albion.63: >-
    "The Network Dreams". TECHNIQUE: surrealist painting in the manner of a dreamscape, smooth and uncanny. CAMERA:
    wide, low over a beach. A white horse walks along a shore made of broken glass that glitters like water; the sky
    is full of hundreds of kites, all tethered to tiny sleeping people lying on the glass; the horizon is a thin
    line of cyan light. Pale cyan, white, glass glints, deep blue sky.
  meganations_albion.64: >-
    "The Last Luddite". TECHNIQUE: intimate photograph, available light, shallow depth of field. CAMERA: close, over
    the counter of a clinic. An old sledgehammer lies on a white clinic counter; an old man's weathered hand rests on
    its handle for the last time; beyond it, out of focus, a nurse in white prepares a glowing lace. Warm skin, white,
    worn wood, a small cyan glow.
  meganations_albion.65: >-
    "Silence in Albion". TECHNIQUE: Edward Hopper-style painting, stark light and empty space. CAMERA: from the street
    through a big pub window at night. Inside, a full pub of people sitting at tables and the bar, all silent, all
    looking at nothing, a few smiling at the same moment; every glass is full; a faint cyan glow behind each person's
    ear. Warm amber interior, dark blue street, cyan points.
  meganations_albion.66: >-
    "The Leeds Glitch". TECHNIQUE: datamoshing glitch art over a street photograph, pixel smears. CAMERA: eye level on
    a terraced street. Commuters in 2100 clothes walk to work, but the image tears into 1980s colours: a phone box,
    a red bus and a jukebox bleed through in pixel blocks and scan lines; one woman's face is duplicated twice.
    Magenta, cyan, beige, pixel noise.
  meganations_albion.67: >-
    "The Children of the Network". TECHNIQUE: soft picture-book illustration, coloured pencil. CAMERA: from a child's
    height inside a nursery. A circle of small children sit on a rug in perfect silence building a very complicated
    tower of blocks together; all of them point at the same block at the same time; a puzzled teacher kneels at the
    edge. Pastel yellow, mint, sky blue.
  meganations_albion.68: >-
    "Shared Memory". TECHNIQUE: multiple-exposure photograph, translucent layers. CAMERA: eye level on a canal towpath
    at night. A dark canal under a brick bridge; over it, dozens of faint semi-transparent images of the same running
    man in a green coat overlap like ghosts, each slightly different, as remembered by many eyes. Black water, green
    coat, sodium orange lamps.
  meganations_albion.69: >-
    "The Hackers of Belfast". TECHNIQUE: neon cyberpunk illustration, rain and reflections. CAMERA: low angle at the
    foot of two enormous yellow shipyard gantry cranes at night. Young hackers in hooded raincoats sit on a container
    with laptops whose screens glow green; a cable runs from the container up into the crane, glowing; London's cyan
    network lines in the sky stop sharply above them. Yellow cranes, green glow, cyan sky lines.
  meganations_albion.70: >-
    "Pirate Lace". TECHNIQUE: gritty macro photograph, tattoo-parlour lighting. CAMERA: extreme close-up at the back
    of a man's shaved head. A tattoo artist's gloved hand presses a crude printed lace of copper wire into the skin
    behind the ear; fresh red skin, a cheap ring light reflected in the needle; one wire glows a colour that is not
    cyan but a dim, strange violet. Skin tones, copper, violet glint.
  meganations_albion.71: >-
    "A Message for the Commune". TECHNIQUE: abstract data visualisation, elegant generative art. CAMERA: map view from
    above. A dark map of the Channel; on the British side, a dense cyan web of light; on the continental side, a rigid
    red grid; a single thin white thread of light crosses the water between them, pulsing. Black, cyan, red, white.
  meganations_albion.72: >-
    "The Strike of the Unplugged". TECHNIQUE: 1980s British miners' strike press photograph, grainy colour. CAMERA:
    eye level at a picket line. Workers in donkey jackets and wool hats stand arm in arm across a railway line in
    front of a stopped train; one holds up a handwritten cardboard sign (shapes only, no readable words); behind them,
    a cyan-lit office tower watches. Mud brown, grey, cyan glow.
  meganations_albion.73: >-
    "The Poet Who Would Not Connect". TECHNIQUE: letterpress print, ink impression on thick paper. CAMERA: flat lay from
    above. A small hand press with a page being printed, lead type in a tray, a stack of thin books bound in grey
    paper, and an old man's ink-stained hands holding a single printed page. Black ink, cream paper, lead grey.
  meganations_albion.74: >-
    "The Ghost in the Network". TECHNIQUE: tender watercolour with a translucent glowing figure. CAMERA: inside a small
    kitchen in Cork, eye level. Two children sit at a kitchen table with a tablet between them; beside them, made of
    faint cyan light, the translucent figure of an old woman leans over their shoulders smiling, her hand on one
    child's head. Warm kitchen yellows, cyan ghost light.
  meganations_albion.75: >-
    "The Glasgow Blackout". TECHNIQUE: night photograph during a blackout, only candles and phone lights. CAMERA:
    high, from a tenement window, looking down at a dark street. The whole city is black; down in the street, people
    stand with candles, some shouting upward, one sitting on the kerb with her face in her hands; on the horizon, a
    substation burns with blue sparks. Black, candle amber, electric blue.
  meganations_albion.76: >-
    "Rome Fears the Hive". TECHNIQUE: Roman mosaic made of small square tesserae. CAMERA: flat, like a floor mosaic.
    A row of legionaries with shields stands on a stylised coast at the bottom; across a band of blue sea, at the top,
    an island drawn as a single giant beehive glowing cyan with tiny figures like bees. Terracotta, gold, blue, cyan.
  meganations_albion.80: >-
    "God Save the Past". TECHNIQUE: Victorian steel engraving like the Illustrated London News, fine cross-hatching.
    CAMERA: wide, from the gallery of a debating chamber. Men in powdered wigs and moth-eaten robes take their seats
    on red benches in a crowded hall; workers in caps climb in through the windows to watch; everyone applauds. Black
    and white engraving with a later hand-tinted crimson on the benches.
  meganations_albion.81: >-
    "The Search for a Queen". TECHNIQUE: backstage theatre photograph, warm tungsten bulbs. CAMERA: from behind the
    dressing-room mirror, the frame of bulbs around the image. A woman in her twenties in a stage queen's costume
    looks into the mirror, removing a paste crown; behind her, reflected, two old Lords in robes hold a scroll with a
    family tree drawn on it (lines only, no names). Gold bulbs, crimson velvet, white powder.
  meganations_albion.82: >-
    "The Nation Applauds". TECHNIQUE: hand-tinted colour photograph, early 1900s postcard. CAMERA: from a balcony above
    a wide ceremonial avenue. Twenty-deep crowds wave small flags without symbols; a column of Horse Guards in silver
    breastplates and plumed helmets rides between them; children with paper crowns sit on lamp posts. Pastel tints,
    silver, crimson, cream.
  meganations_albion.83: >-
    "Nobody Applauds". TECHNIQUE: Punch-magazine satirical cartoon, pen and ink. CAMERA: eye level, slightly wide.
    In the rain, a Duke in a plumed hat holds giant golden scissors over a ribbon on a new bridge; the crowd stands
    silent with umbrellas; a small boy in the front row points and laughs. Black ink, grey wash, a touch of gold.
  meganations_albion.84: >-
    "The Republican Plot". TECHNIQUE: Victorian penny-dreadful cover illustration, lurid colours. CAMERA: from the top
    of cellar steps looking down. Policemen with lanterns burst into a brick cellar where people stand around a
    printing press singing; leaflets with a drawing of a top hat on an empty chair fly in the air. Lurid yellow, red,
    deep green, black.
  meganations_albion.85: >-
    "The Mayfair Masquerade". TECHNIQUE: rococo oil painting, Fragonard-like, soft pinks and golds. CAMERA: from the
    musicians' gallery, looking down at a ballroom. Hundreds of masked dancers in silk swirl under a ceiling painted
    with imaginary victories; in the centre, one dancer has lifted his mask to reveal a white robotic face plate,
    and his partner has not noticed. Rose, gold, ivory, powder blue.
  meganations_albion.86: >-
    "A False Duke". TECHNIQUE: split-image photograph, half sepia portrait and half modern snapshot. CAMERA: frontal
    head-and-shoulders, the face split down the middle. Left half: a dignified Duke in ermine robe and coronet; right
    half: the same man in a bus driver's uniform and cap, grinning. Sepia and bright colour.
  meganations_albion.87: >-
    "Five o'Clock Tea at the Front". TECHNIQUE: First World War-style official war artist painting, muted earth tones.
    CAMERA: inside a trench, eye level. Soldiers in khaki with brass buttons pass porcelain teacups along the trench;
    a cook pours from a big steel urn; across no-man's-land, faint smoke has stopped, and on the parapet sits a tin of
    biscuits with a ribbon. Mud brown, khaki, white porcelain.
  meganations_albion.88: >-
    "The Chimney Sweeps Return". TECHNIQUE: Gustave Doré-style engraving of London, dense and dark. CAMERA: from the
    rooftops, looking across a forest of smoking chimney pots. Small boys with brushes and black faces climb out of
    chimneys; below, a crowded street of gaslight and fog; one mother on a rooftop reaches for her son. Black, grey,
    soot, a little gaslight yellow.
  meganations_albion.89: >-
    "The Expedition to the Pole". TECHNIQUE: glass-plate photograph, early 1900s polar expedition, silver tones.
    CAMERA: eye level on the ice. Forty men in wool and furs stand in a row with sledges and ponies beside a wooden
    ship frozen in the ice; behind them, on a ridge, a modern research base with satellite dishes and a café window
    glowing. Silver grey, white, one warm window.
  meganations_albion.90: >-
    "The Queen Forgets Her Lines". TECHNIQUE: Pre-Raphaelite oil painting, jewel colours, intense detail. CAMERA: eye
    level, the throne at the centre of a gilded chamber. A young queen in white and gold stands before the throne,
    her written speech fallen to the floor at her feet, one hand open as she speaks; around her, wigged Lords in red
    lean forward, astonished. Gold, white, crimson, emerald.
  meganations_albion.91: >-
    "The Cardboard Jubilee". TECHNIQUE: comedic newspaper press photograph, motion blur, rain. CAMERA: telephoto from
    across the square. A huge triumphal arch of painted plywood slowly folds over a procession of Horse Guards in the
    rain, its gold paint running down in streaks; horses rear; spectators under umbrellas laugh. Grey, gold streaks,
    crimson uniforms.
  meganations_albion.92: >-
    "The Suffragettes Return". TECHNIQUE: Edwardian hand-coloured photograph. CAMERA: eye level along the iron railings
    of Westminster. Dozens of women in white dresses with purple-and-green sashes have chained themselves to the
    railings; a confused policeman holds a bolt cutter; behind them, the Gothic stone towers. White, purple, green,
    grey stone.
  meganations_albion.93: >-
    "The Exhibition of Steam Automata". TECHNIQUE: Victorian chromolithograph poster, rich colour, decorative border.
    CAMERA: frontal, inside a vast glass-and-iron exhibition hall. On a red-carpeted stage, a two-metre brass automaton
    with a boiler in its chest bows to a seated queen; steam puffs from its shoulders; crowds in top hats watch from
    galleries. Brass, crimson, green iron, glass light.
  meganations_albion.94: >-
    "Two Empires". TECHNIQUE: illuminated manuscript page, gold leaf and vellum. CAMERA: flat. On purple vellum, a
    gilded initial letter frames two crowned figures — a Roman emperor in a laurel wreath and a queen in a crown —
    clasping hands over a small painted map of Europe; around them, ornamental eagles and lions. Purple, gold, crimson,
    blue.
  meganations_albion.95: >-
    "The Rookeries of London". TECHNIQUE: moody photogravure, deep blacks and fog. CAMERA: low, in a narrow alley at
    night. Leaning houses overhang a wet cobbled lane; a single gas lamp; a pickpocket boy slips a hand into a top-
    hatted gentleman's coat; a gin shop glows at the end. Black, warm gaslight, fog grey.
  meganations_albion.96: >-
    "The Thames Regatta". TECHNIQUE: sunny Impressionist painting, broken brushwork. CAMERA: from the river bank among
    the crowd. Two long wooden rowing eights race side by side on the sparkling Thames; in one boat, a man in a
    wig has fallen backwards into the water; crowds in striped blazers and summer hats cheer on both banks. Blue water,
    green banks, white and red stripes.
