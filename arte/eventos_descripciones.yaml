# =============================================================================
# Descripciones largas para las imágenes de eventos (pedido del usuario,
# 2026-10-13: "necesito los pedidos para los eventos tipo 'capturó X capital'").
#
# tools/arte usa este texto en lugar del título + descripción del evento
# (12_events.yaml) cuando el id del evento está acá. La capital tomada puede ser
# cualquiera, así que la ciudad de fondo es genérica: ningún monumento real
# reconocible, ninguna inscripción.
# =============================================================================

composition: >-
  FORMAT: wide event illustration, about 6:5 (the game shows it at 210x176), one clear focal subject large in the
  frame and readable as a silhouette when tiny. The camera, framing and technique written above are MANDATORY: do not
  turn them into a standard scene, and do NOT add a group of people seen from behind in the foreground (2026-10-29:
  "siempre el mismo formato, muy aburrido"). NO text, NO letters, NO numbers, NO inscriptions on buildings, banners
  or vehicles, NO real country flags, NO watermark, NO frame or border.

events:
  meganations_efe.300: >-
    "The Capital Falls to the Forest": the Ecofascist Empire's Green Guard rolls into a conquered foreign capital
    and nature swallows the city behind it. CAMERA: street level, low angle (about 1 metre high) looking slightly up
    along a wide city boulevard, three-quarter view, 35 mm lens. FOREGROUND RIGHT, filling the right half: one
    Glyptodon super-heavy tank seen from its front-left corner, a colossal very wide low tank whose whole upper body
    is a huge rounded dome of interlocking hexagonal armour plates in olive and moss green with darker seams, some
    plates scorched and chipped, broad tracks crushing the cracked asphalt; where it has passed, thick roots split
    the pavement and vines and moss climb the lamp posts. MIDGROUND: two more Glyptodons in column behind it,
    smaller with distance; Green Guard infantry walking beside them in dark green-bronze bio-steel armour that looks
    like lacquered wood and insect chitin, laurel-leaf shoulder ornaments, rifles held across the chest. FOREGROUND
    LEFT: a toppled statue plinth with no inscription, half covered in ivy, one soldier planting a tall green and
    gold banner with a stylised tree emblem. BACKGROUND: grey glass and concrete towers of a generic modern capital,
    vines already climbing their lower floors, two columns of smoke. LIGHT: golden dawn sun low behind the tanks on
    the left, warm god rays cutting through the smoke, rim light on the dome plates, cool green shadows. PALETTE:
    moss green, olive, bronze, gold, grey city, warm amber sky.
  meganations_fcu.300: >-
    "Hostile Takeover": the Corporate Union treats a conquered capital as an acquisition. CAMERA: standing on the
    rooftop helipad of the tallest tower of the fallen capital at night, low angle looking up and slightly forward,
    24 mm wide lens. UPPER HALF: one Obsidian Wing passing low overhead from upper left to right, an enormous black
    glossy four-engine jet transport with an iridescent purple sheen like obsidian, four large under-wing turbofans
    glowing, wide fuselage seen from below with the rear ramp open and warm amber light spilling out; a stick of
    paratroopers in dark navy armour with polished chrome visors dropping from the ramp, canopies opening below it.
    FOREGROUND CENTRE-RIGHT: a corporate executive in a tailored charcoal suit and long coat, seen from behind,
    holding a tablet that shows a single glowing green rising line chart (no numbers); beside the executive a security
    officer in navy and chrome armour driving a flagpole into the helipad with a navy banner bearing only an abstract
    silver geometric logo. FOREGROUND LEFT: the helipad edge with a painted circle (no letters) and a blinking red
    warning light. BACKGROUND: the city below, dark streets, searchlight beams sweeping up, a few fires. LIGHT: cold
    blue city glow from below, warm amber from the open ramp, purple reflections on the aircraft skin, wind blowing
    the coat. PALETTE: black, navy, chrome, purple sheen, amber, one green accent.
  meganations_hsn.300: >-
    "The Market Buys a Capital": the High Seas Market Nation takes a capital from the sea and prices it. CAMERA:
    elevated three-quarter view from a harbour crane about 30 metres up, looking down across the docks toward the
    harbour mouth, 35 mm lens. LEFT HALF, background-to-midground: one Leviathan anchored in the harbour mouth, a
    huge grey floating fortress-port that looks like a battleship merged with a container terminal, tall radar
    superstructure, dock cranes on its deck and twin railgun turrets with a faint blue glow, red anti-fouling paint at
    the waterline. RIGHT HALF, foreground: the quay of the fallen city, a landing barge with its bow ramp down and
    Leviathan Marines coming ashore in grey armour with yellow and black hazard stripes and orange high-visibility
    straps; a dock crane lifting a shipping container off the barge; in the very foreground an insurance assessor in a
    teal raincoat with a brass-trimmed tablet, sticking a hazard-striped tag (no text) on a bollard. BACKGROUND: the
    generic skyline of the captured capital behind the warehouses, smoke rising. LIGHT: low orange sunset from the
    right, long shadows across the quay, sparkling reflections on the water, teal shadows. PALETTE: steel grey,
    teal, brass, hazard yellow, sunset orange.
  meganations_asc.300: >-
    "The Commune Takes a Capital": the Automated Socialist Commune occupies a capital with machines in perfect
    order. CAMERA: high drone view, about 30 degrees down, looking across the main square of the fallen capital,
    28 mm lens, strict symmetry. CENTRE, filling most of the frame: dozens of Sentinels parked in a perfect hexagonal
    grid across the square, each a crewless six-wheeled armoured car with an angular faceted stealthy hull in dark
    graphite grey with thin red accent lines and a row of glowing red sensor lights instead of windows; no crew, no
    hatches. ABOVE THEM: a swarm of small black triangular drones hovering in a precise triangular formation. LOWER
    FOREGROUND: the steps of a generic neoclassical government building, on them three council delegates in plain
    grey work overalls with red armbands, holding tablets, watching calmly. BACKGROUND: the building facade with tall
    plain red constructivist banners carrying only white geometric shapes (triangles and circles), server-rack
    cables already run along the columns. LIGHT: flat cold overcast daylight, the red sensor lights and drone lights
    glowing in rows. PALETTE: graphite, concrete white, constructivist red.
  meganations_apf.300: >-
    "The Councils Enter a Capital": the African Peoples' Federation crosses the river into a fallen capital.
    CAMERA: at water level on the near bank of a wide river, low three-quarter view toward the city embankment,
    35 mm lens. CENTRE-RIGHT, the main subject: one Kiboko climbing out of the river up a concrete ramp onto the
    embankment, a big eight-wheeled amphibious armoured vehicle with a boat-like sloped bow, high rounded sides in
    sandy ochre-beige paint with mud, a bright horizontal stripe of red, yellow and green along the flank, huge
    off-road wheels, a small remote weapon station on top; river water pouring off its hull. BEHIND IT: two more
    Kiboko still in the water, bow waves and spray. FOREGROUND LEFT: council militia in mixed khaki and olive gear
    wading ashore with rifles raised, one woman delegate standing on a rock with a megaphone, fist raised. ON THE
    BRIDGE in the background: civilians waving plain red, yellow and green striped flags. BACKGROUND: the generic
    skyline of the captured capital with smoke. LIGHT: hot high midday sun, strong contrast, glittering spray, deep
    shadows under the wheels. PALETTE: ochre, earth red, yellow, green, muddy river brown, blue sky.
  meganations_nas.300: >-
    "The Sun over Another Capital": the Neo-Andean Sun Kingdom's priests bless its aircraft over a conquered city.
    CAMERA: on a flat rooftop of the fallen capital at sunrise, low angle looking toward the rising sun, 35 mm lens.
    SKY, upper two thirds: three Children of the Condor in a V formation, each a large grey and gold tiltrotor troop
    transport with two big wingtip rotors and a boxy fuselage, folding golden solar panels shaped like condor
    feathers on the wings; the lead aircraft directly in front of the sun so the sun forms a blazing halo behind it;
    mountain troops rappelling on ropes from its open belly toward the streets. FOREGROUND LEFT: an Inti priest seen
    from behind and slightly to the side, arms raised in blessing, wearing a golden sun-disc headdress and red and
    gold woven robes with Inca stepped patterns. FOREGROUND RIGHT: a soldier in grey armour with an Andean poncho
    over it holding a tall golden standard topped by a sun disc with a face. BACKGROUND, below the aircraft: the
    rooftops of a generic modern capital in morning haze. LIGHT: rising sun straight ahead, radiating rays,
    silhouettes with golden rim light, lens glow. PALETTE: gold, turquoise, warm white, Andean red, pale blue sky.
  meganations_shd.300: >-
    "Harmony Reaches Another Capital": the Sino-Harmonious Directorate brings its railway gun into a conquered
    city. CAMERA: trackside, low angle three-quarter view from beside a raised rail embankment that runs along a
    river into the city, 28 mm lens. DIAGONAL MAIN SUBJECT from lower left to upper right: one Dragon of the Grand
    Canal, a colossal railway gun on a long train of olive-green boxy maglev rail cars with thick hydraulic pipes,
    one immense very long barrel with ring reinforcements raised toward the city, steam venting from its coolers.
    FOREGROUND RIGHT: soldiers of the Armies of the Grand Canal marching in perfectly aligned ranks along the
    embankment, identical olive uniforms and helmets, all in step. ON POLES along the track: jade green banners with
    a single stylised wave emblem in white (no characters). BACKGROUND: the captured capital across the river, a
    canal lock and a weir in the river already manned, morning mist over the water. LIGHT: soft diffuse morning
    light, mist, cool tones, steam catching the light. PALETTE: olive green, jade, steel grey, white steam, muted
    red accents.
  meganations_nre.300: >-
    "A Triumph for Rome": the Neo-Roman Empire celebrates a Roman Triumph in its own capital for the conquered city.
    CAMERA: slightly elevated (a balcony at the first floor), looking down a stone ceremonial avenue toward the
    camera, 35 mm lens. MAIN SUBJECT, centre: a column of Onagers driving toward the camera, heavy truck-mounted
    multiple rocket launchers painted crimson and gold, large box launchers raised at a steep angle and crowned with
    laurel wreaths, a golden imperial eagle emblem on the side of each launcher box, squat armoured cabs. BESIDE
    THEM: legionaries in segmented lorica-style armour bands with red plumes on their helmets, carrying tall curved
    scutum-shaped shields, marching in step; a standard bearer with a golden eagle on a pole. FRAME: the column
    passes under a massive triumphal arch with a completely blank attic panel (no inscription). SIDES: crowds behind
    barriers throwing rose petals, petals floating in the air. BACKGROUND: ancient marble ruins and columns mixed with
    modern buildings. LIGHT: golden late-afternoon sun from the left, warm haze, petals glowing. PALETTE: crimson,
    gold, marble white, warm stone.
  meganations_zwe.10: >-
    "The Great Capital Has Fallen": the Eurasian warlord bands ride into one of the old capitals of Europe. CAMERA:
    street level, slightly low, in the middle of a wide cobbled boulevard lined with old baroque facades, looking at
    the riders coming toward the camera, 35 mm lens. FOREGROUND CENTRE: the lead warlord on a rearing dark horse,
    fur hat, long felt cloak, holding high a horse-tail standard (a pole topped with horse tails and a rusted metal
    crest). MIDGROUND: more riders and crude looted trucks and technicals made of mismatched welded Soviet-style
    steel plates with hammered cossack ornaments, a machine gun on each. BACKGROUND: a generic great dome and
    spires of an old European city (no real landmark), smoke rising, a broken streetlight. LIGHT: grey winter
    evening, light snow falling, orange firelight from burning barricades on both sides lighting the riders from
    below. PALETTE: grey, olive, faded red, rust, fire orange, white snow.
  meganations_mundo.130: >-
    "What They Leave Behind": after taking an enemy capital, the victors absorb its workshops, archives and
    veterans. This picture is used by every country, so nothing in it belongs to any faction: neutral grey-green
    uniforms with no insignia, no flags. CAMERA: inside a vast captured state workshop and archive hall, eye level,
    three-quarter view, 28 mm lens. CENTRE: an officer in a long neutral grey coat lifting a canvas tarp off a
    covered prototype machine on a work stand (only its metal corner and some cables visible). LEFT: soldiers carrying
    stacked archive crates and rolled blueprints out toward a waiting truck in the doorway. RIGHT: two older
    engineers in work coats, the defeated country's veterans, standing beside a workbench with tools, looking on
    with resigned dignity. BACKGROUND: tall shelves of archive boxes, hanging lamps, a large blank map board.
    LIGHT: dusty shafts of daylight from high windows, floating dust, warm lamp light on the workbench. PALETTE:
    warm grey, brown, muted green, dusty gold.

  # --- El Shogunato de los Astilleros (2026-10-28) -----------------------------
  meganations_japon.1: >-
    "Kanto Rises": the Japanese shipyards rebel against the High Seas Market Nation. CAMERA: from the floor of a
    huge dry dock at dawn, low angle looking up, 28 mm lens. FOREGROUND CENTRE: a woman admiral in a dark navy coat
    with the old insignia torn off and a white headband with a red disc, standing on the dock edge, one arm raised,
    a dead radio headset around her neck. MIDGROUND: hundreds of shipyard workers in hazard-yellow hard hats and
    welding masks raising wrenches and welding torches; a black submarine hull on the blocks behind them. BACKGROUND:
    giant dock cranes against a red sunrise, an old faded Japanese naval banner (no text) hoisted on the tallest
    crane, the teal-and-brass High Seas pennant being cut down and falling. LIGHT: crimson dawn behind the cranes,
    welding sparks as bright points. Palette: navy steel, crane yellow, crimson, rust.
  meganations_japon.10: >-
    "The War in Japan", seen from the Hydraulic Directorate. CAMERA: inside a cool jade-and-steel war room, over the
    shoulders of three officers in dark green high-collared uniforms. CENTRE: a glowing holographic map table of
    the western Pacific showing the Japanese islands split in two colours, crimson for the rebels and teal for the
    Market, small ship and mecha markers on it; red flashes of fighting over Kyushu and Kanto. BACKGROUND: a tall
    window over a river dam at night, shipyard lights of the Directorate already burning. LIGHT: the cold glow of
    the hologram on the faces. No text, no readable labels on the map.
  meganations_japon.30: >-
    "The CyberShogun Awakens". CAMERA: very low angle from the floor of dry dock number one at night, 24 mm lens,
    the subject towering. CENTRE: a colossal samurai-armoured mecha, taller than the cranes around it, black
    lacquer and dark navy steel with gold and crimson trim, a great horned kabuto crest, its eyes lighting up
    crimson for the first time; cables and scaffolding falling away from its body. FOREGROUND: tiny silhouettes of
    workers and officers kneeling on the dock, a few holding neon-lit banners (no text) in emerald green, crimson
    and violet. BACKGROUND: a neon city skyline beyond the docks, searchlights crossing in the sky, steam rising.
    LIGHT: a huge crimson rising-sun glow behind the mecha's head, neon rim light on its armour.
  # 2026-10-28: noticias del mapa (cualquier país puede ser el protagonista: nada reconocible)
  meganations_mapa.1: >-
    "A Country Is No More": the quiet end of a small nation. CAMERA: eye level, medium shot, slightly off-centre,
    35 mm lens. CENTRE: a bare flagpole in a small grey government courtyard; a young soldier in a plain dark
    2100 field uniform (no insignia readable) stands at its foot clumsily folding a large flag of plain
    horizontal bands in faded colours (no emblem), half of it still dragging on the wet paving stones. FOREGROUND
    RIGHT: an open grey plastic storage crate on the ground, a stencilled serial of abstract marks (no letters or
    numbers) on its lid, two other folded flags already inside. MIDGROUND LEFT: three civil servants in coats
    carrying cardboard boxes of files out of a modest concrete ministry with its windows dark; one looks back at
    the flagpole. BACKGROUND: a low city skyline under drizzle, a single tall antenna with a red light. LIGHT:
    flat overcast morning, cold blue-grey, one warm lamp still on in a ministry window. MOOD: anticlimax,
    bureaucratic sadness, no violence.
  meganations_mapa.2: >-
    "A Country Is Born": a makeshift independence ceremony. CAMERA: low angle from the back of a crowd, looking
    up at a stage, 28 mm lens. CENTRE: a converted warehouse with its big sliding door open, a hand-built wooden
    stage in front; on it a woman in a simple dark suit raises her right hand to take an oath, beside her a tall
    new flag on a fresh pole with bright, slightly uneven hand-sewn bands of two colours and a simple star (no
    real-country flag), still creased from folding. LEFT ON STAGE: two older men holding a thin folder and a
    briefcase. FOREGROUND: the backs and raised hands of a cheering crowd, a few holding small paper flags of the
    same new design, a child on someone's shoulders. RIGHT EDGE: a parked foreign armoured car with an observer
    in a different, darker uniform watching with arms crossed. BACKGROUND: harbour cranes and containers, gulls.
    LIGHT: warm late-afternoon sun, long shadows, hopeful but fragile. NO text on any banner.
  meganations_mapa.3: >-
    "A Destiny Is Proclaimed": the world watches a meganation become an empire on screens. CAMERA: interior,
    eye level, from behind a row of people, 35 mm lens. CENTRE: a large wall screen in a small ministry office
    of a minor country showing a vast parade square seen from above, tens of thousands of soldiers in perfect
    blocks, an enormous new banner unrolling down a monumental building (abstract emblem, no text). FOREGROUND:
    silhouettes of four ministers and a uniformed officer standing still, one holding a paper map against the
    screen light, another with a phone lowered from his ear. LEFT: a desk with a paper atlas open and a red
    pencil line drawn across it. RIGHT: a window with the night lights of a modest city. LIGHT: the cold
    blue-white glow of the screen on faces, the rest of the room dark. MOOD: awe and fear, small men before a
    giant.
  meganations_mapa.4: >-
    "A Country Splits in Two": the first night of a civil war. CAMERA: high vantage from a rooftop, wide shot
    over a river city, 24 mm lens. CENTRE: a long bridge across the river cut in half by two improvised
    checkpoints facing each other, concrete blocks and parked trucks at each end. LEFT BANK: soldiers in a plain
    dark uniform with armbands of one colour; RIGHT BANK: soldiers in the SAME uniform with armbands of a different
    colour, both sides pointing searchlights at each other. Two different flags hang from lamp posts on each side
    (plain bands, no real-country flags). BACKGROUND: two radio towers on opposite hills, each with its own
    blinking light, a column of smoke rising from a burning building on the right bank. FOREGROUND: a rooftop
    edge with a satellite dish and a civilian family watching, a woman holding a radio. LIGHT: night, orange
    fire glow on the right, cold white searchlights crossing in the middle. NO text anywhere.
  # ---------------------------------------------------------------------------
  # 2026-10-29: el búnker vendido y los eventos inocentes (25_ocultos.yaml).
  # Cada uno con su propia toma y técnica; ninguno repite la de otro.
  # ---------------------------------------------------------------------------
  meganations_mundo.73: >-
    "The Rifles Come Back". TECHNIQUE: forensic evidence photograph, flash-lit. CAMERA: straight down onto a steel
    police evidence table: six old rifles laid in a row, each with a paper evidence tag on string (blank tags), one
    rifle's stock showing a faded military stencil shape (no letters), a ruler and a magnifying glass, a single bullet
    standing upright. Harsh flash, black background, cold.
  meganations_mundo.74: >-
    "The Bombs of the Bunker". TECHNIQUE: blurred long-exposure night photograph. CAMERA: from far away on a hill,
    a highway interchange at night where a column of fire rises from under one overpass; streams of car lights frozen
    in red and white lines stop abruptly at the fire; a power substation beside it throwing blue sparks. Tiny scale,
    huge darkness.
  meganations_mundo.87: >-
    "The Hills Have Our Rifles". TECHNIQUE: guerrilla-war charcoal drawing on rough paper. CAMERA: from inside a
    dense thorn bush at ground level, looking out through the branches at a dirt supply road below where an army
    truck burns on its side; the muzzle of a rifle rests on a branch at the right edge (no person visible). Smudged
    black, grey and one orange flame.
  meganations_mundo.88: >-
    "Every Rifle Accounted For". TECHNIQUE: crisp military logistics photograph, morning. CAMERA: high, wide view
    of a huge depot floor where hundreds of recovered wooden crates are stacked in a perfect pyramid, each with an
    intact seal; a single forklift carries the last crate to the top; long rectangles of sunlight from skylights.
    Order and calm.
  meganations_ocultos.1: >-
    "A Generous Scholarship". TECHNIQUE: elegant 1960s airline poster illustration, flat colours. A long white
    envelope with a wax seal (abstract emblem) floating open in the air over a stylised world map, and out of it
    fly four hundred tiny paper planes in a curving stream toward the horizon. Cream, teal and gold. No people.
  meganations_ocultos.2: >-
    "The Scholars Did Not Come Back". TECHNIQUE: quiet realist painting. CAMERA: eye level in an empty university
    laboratory at dusk: rows of identical desks, each with a lamp switched off and a chair pushed in; only the
    nearest desk has a lamp on, lighting a framed graduation photo lying face down. Dust in the lamplight.
  meganations_ocultos.3: >-
    "They Came Back With Everything". TECHNIQUE: joyful comic-book splash page (no speech balloons, no letters).
    CAMERA: low angle at the door of a cargo plane on a runway at night; an avalanche of notebooks, rolled
    blueprints and suitcases bursting open spills down the ramp toward the camera, glowing diagrams floating up
    from them like sparks. Bright, dynamic, diagonal.
  meganations_ocultos.4: >-
    "The Foundation Was a Front". TECHNIQUE: noir spy-film still, black and white with one red element. CAMERA:
    through the slats of a window blind into an office: a plush classroom on one side of a wall and, behind a
    hidden door left ajar, a room full of tape recorders and filing cabinets; one red folder on the floor.
    Strong striped shadows.
  meganations_ocultos.5: >-
    "They Left Anyway". TECHNIQUE: minimalist airport photograph. CAMERA: from directly above a long departure
    corridor floor: one single small suitcase rolling away alone, casting a long shadow across clean white tiles;
    the rest of the frame empty. Very graphic, cold light.
  meganations_ocultos.10: >-
    "Rain to Order". TECHNIQUE: retro aviation advertising painting. CAMERA: from above and behind a small
    propeller aircraft flying over cracked, dry brown farmland, spraying a glittering silver trail that bends
    upward into a single fat white cloud; the shadow of the plane crosses the dry fields. Sunlit, saturated.
  meganations_ocultos.11: >-
    "The Harvest of the Century". TECHNIQUE: harvest festival painting in the style of Pieter Bruegel, many tiny
    details, seen from a high hill. Golden fields to the horizon cut in strips, sheaves stacked, carts loaded with
    grain, granaries with doors open and spilling over, a silver aircraft tiny in the sky like a bird.
  meganations_ocultos.12: >-
    "The Silver Flood". TECHNIQUE: aerial photograph after a disaster, muted grey-blue. CAMERA: straight down onto
    flooded rice paddies whose water has a strange silver sheen; a road disappears into the water, half a bridge
    stands alone, the roofs of a village are islands. The only colour: one red tractor roof.
  meganations_ocultos.13: >-
    "The Drought Went On". TECHNIQUE: extreme macro photograph. CAMERA: inches above cracked dry mud: the cracks
    form a hexagon pattern, a dead fish skeleton in one crack, a single drop of water evaporating in the sun with a
    tiny rainbow inside it. Bleached yellow and ochre.
  meganations_ocultos.20: >-
    "A Seed in the Mail". TECHNIQUE: intimate still life, soft daylight, Vermeer style. A pair of hands is NOT
    shown; on a dark wooden imperial desk lies an opened school envelope with a child's crayon drawing of a tree
    (no letters), and on the drawing a single shining green seed the size of a fingernail, glowing faintly. Green
    and gold palette.
  meganations_ocultos.21: >-
    "The Tree of the Palace". TECHNIQUE: art-nouveau illustration with curving lines. A gigantic young tree that
    has burst through a palace courtyard's paving and grown taller than its marble walls, its leaves shaped like
    rain drops; around its trunk, hundreds of small ribbons tied by pilgrims. Seen from the palace roof, looking
    across at the crown.
  meganations_ocultos.22: >-
    "The Fungus of the Vats". TECHNIQUE: horror-tinged scientific illustration. CAMERA: inside a bio-steel
    factory, close to a huge glass vat: the living green metal inside is being invaded by grey branching fungus
    threads, like frost spreading on a window; a warning lamp flashes amber on the vat's brass rim. No people.
  meganations_ocultos.30: >-
    "The Robot That Asked for a Day Off". TECHNIQUE: deadpan Wes-Anderson-style symmetrical composition, pastel
    red and white. CAMERA: perfectly centred, frontal: a white industrial robot standing at a tiny office counter,
    holding a paper form in its gripper; behind the counter, an empty chair and a wall of identical pigeonholes.
  meganations_ocultos.31: >-
    "The Four-Day Week". TECHNIQUE: cheerful constructivist poster. A factory roof garden on a sunny day: robots
    and workers' empty deck chairs side by side, a robot watering tomatoes, the factory chimneys behind not
    smoking. Bright red, white and sky blue, bold geometry.
  meganations_ocultos.32: >-
    "The Machines' Strike". TECHNIQUE: eerie stillness, cold photograph. CAMERA: a long assembly line from one end:
    hundreds of robots frozen mid-motion, arms raised, half-built vehicles on the belt, all the lights on and no
    movement at all; one robot in the middle has turned its head to look at the camera.
  meganations_ocultos.40: >-
    "The One-Cent Share". TECHNIQUE: glossy macro photograph. CAMERA: close-up of a single tiny silver coin
    standing on its edge on a black glass trading desk, reflecting a wall of thousands of green and red stock
    tickers (abstract lines, no numbers) blurred behind it. Navy and silver.
  meganations_ocultos.41: >-
    "The Algorithm Learned". TECHNIQUE: elegant data-visualisation art. A huge dark room with a floor-to-ceiling
    screen showing a glowing web of lines forming the shape of a human face made of market data; a single desk
    lamp in the corner. Gold and navy.
  meganations_ocultos.42: >-
    "Red Tuesday". TECHNIQUE: dramatic expressionist painting. CAMERA: worm's-eye view from a street up at glass
    corporate towers whose every window glows red, a storm of paper tickers falling like red snow, a melted
    circuit breaker box smoking on the pavement in the foreground.
  meganations_ocultos.50: >-
    "A Bottle in the Strait". TECHNIQUE: watercolour nautical illustration. CAMERA: just above the waterline: a
    green glass bottle bobbing in a fishing net being hauled from turquoise water, a rolled parchment chart visible
    inside with a red cross; water droplets catching the sun. Teal and brass.
  meganations_ocultos.51: >-
    "The Gold of Malacca". TECHNIQUE: underwater photograph with god rays. CAMERA: a diver's lamp beam on the
    sea floor lighting a broken strongbox spilling gold ingots and coins onto white sand, small fish circling, the
    hull of a sunken freighter fading into blue behind.
  meganations_ocultos.52: >-
    "The Privateers' Bait". TECHNIQUE: old engraving coloured by hand. A small salvage trawler surrounded on all
    sides by four dark privateer ships closing in like a ring, seen from high above, their wakes forming a circle
    on a calm sea at dusk.
  meganations_ocultos.60: >-
    "The Boy Who Speaks to the Sun". TECHNIQUE: Andean painting with gold leaf. A total solar eclipse over Lake
    Titicaca, the black sun with a blazing gold corona reflected in the still lake; on a reed boat in the middle of
    the lake, a single small figure stands with arms raised, tiny against the sky.
  meganations_ocultos.61: >-
    "The Chosen of the Sun". TECHNIQUE: colonial-era Cusco school painting (gold, red, flat perspective). A great
    golden sun disc on a temple wall at sunrise; the first ray falls exactly on an empty small woven chair placed in
    the centre of the temple floor. Condors painted on the walls. Rich gold and turquoise.
  meganations_ocultos.62: >-
    "The False Prophet". TECHNIQUE: crowd seen from a drone, documentary photograph. CAMERA: straight down onto
    the main square of Cusco filled with tens of thousands of pilgrims carrying candles that form a spiral pattern,
    an empty space at the centre of the spiral. Night, warm candle dots.
  meganations_ocultos.70: >-
    "A Rounding Error". TECHNIQUE: extreme close-up, shallow depth of field. CAMERA: a magnifying glass held over a
    long paper printout of numbers; through the glass, a single digit is circled in jade-green ink, the rest of the
    paper blurred; an abacus out of focus in the corner. Jade and grey.
  meganations_ocultos.71: >-
    "The Model Improves". TECHNIQUE: serene ink-and-wash scroll with modern details. A perfectly ordered landscape
    of terraced fields and canals where water flows exactly to every terrace, small sluice gates opening in
    sequence, seen from a mountain. Calm jade and silver.
  meganations_ocultos.72: >-
    "The Cascade of Errors". TECHNIQUE: split composition, technical diagram style. The image is divided
    diagonally: on the upper left, a province drowning under brown floodwater with only roofs showing; on the lower
    right, the same province cracked and dry; a broken floodgate sits on the diagonal line between them.
  meganations_ocultos.80: >-
    "The Drum in the Museum". TECHNIQUE: museum photograph, cold white light. CAMERA: a single carved council drum
    alone inside a glass display case in an empty white European museum hall, its shadow long on the floor; a
    shipping crate with packing straw already open beside the case.
  meganations_ocultos.81: >-
    "The Drum Speaks". TECHNIQUE: vibrant African textile print style, rhythmic patterns. The carved drum in the
    centre, seen from straight above, and around it concentric rings of radio waves drawn as kente-like coloured
    patterns spreading across a map of the continent. Earth red, yellow and green.
  meganations_ocultos.82: >-
    "Whose Drum Is It?". TECHNIQUE: linocut. Four long ropes tied to the carved drum pulled taut in four different
    directions toward the four edges of the image, the drum suspended in the centre, the ropes fraying.
    Black, red and ochre.
  meganations_ocultos.90: >-
    "The Statue's Nose". TECHNIQUE: classical restoration photograph. CAMERA: very close on the face of a marble
    imperial statue on scaffolding: a restorer's small chisel has broken away a plaster nose, revealing a different,
    older marble face underneath; plaster dust floating in a beam of light.
  meganations_ocultos.91: >-
    "The True Face". TECHNIQUE: Roman coin design, gold relief, extreme close-up. A freshly struck gold coin
    showing a noble profile with a laurel wreath, lying on crimson velvet, light gleaming on its edge.
  meganations_ocultos.92: >-
    "The False Lineage". TECHNIQUE: dark baroque painting. A statue's marble head lying on its side on the floor of
    a dim Senate chamber, the face cracked to show an ordinary man's features; empty senators' benches around in a
    semicircle, one toga left draped on a bench.
