# Logos de las industrias (organizaciones militares-industriales, OIM) de las 8 meganaciones
# (2026-11-15: "Pedidos para los logos de las industrias tmb"). Hoy las 72 empresas muestran el
# ícono genérico del juego (los fusiles cruzados). Los pide tools/arte/arte.py; llegan a
# assets/<TAG>/industrias/<rubro>.dds y tools/gen/emitters/mio.py los conecta.

estilo: >-
  corporate emblem of a weapons manufacturer in a grand strategy game set in the year 2100, shown at 64x64
  pixels in the industry window and tooltips. A badge or logo-mark you could stamp on a crate or a factory
  gate: ONE bold silhouette, flat colours with a slight enamel/metal relief, solid dark outline about 3% of
  the canvas so it reads on any background. Centred, filling about 85% of the square. Transparent
  background, no text, no letters, no numbers, no real company logos, no real flags.

rubros:   # qué fabrica cada una (motivo central)
  tank: a main battle tank seen from the front, or its track wheel and turret ring
  artillery: a heavy gun barrel with a muzzle brake, or a shell crossed with a rangefinder
  infantry: a rifle and a helmet, or a soldier's ammunition cartridge
  motorized: a heavy wheel with a drive gear, or a truck seen from the front
  escort: a sleek destroyer bow cutting a wave
  capital: a battleship or carrier silhouette seen from the side with a crown of radar masts
  submarine: a submarine fin breaking the surface, or a periscope eye
  light_air: a fighter jet seen from above, swept wings
  heavy_air: a heavy bomber or transport seen from below, four engines

naciones:  # el lenguaje de diseño de cada potencia
  EFE: living bio-steel and laurels, green and old gold; shapes grown like wood and leaves, an imperial wreath around the motif
  FCU: glossy corporate chrome and navy blue, a sharp modern tech-company logo-mark, minimal geometric, a single chrome-blue accent
  ASC: Soviet-constructivist red and white with circuit lines, a gear or a star framing the motif, clean diagonal geometry
  HSN: maritime brass and deep sea teal, a ship-company house flag or a compass rose behind the motif, nautical rope border
  NAS: Inca gold and turquoise stone, a stepped Andean frame (chakana) or sun rays around the motif
  SHD: jade green and steel grey, a round hydraulic-engineering seal with water lines, measured symmetry
  APF: earth red, ochre and green with kente-like woven bands framing the motif, bold and hand-carved
  NRE: Roman imperial purple, gold and marble, a legion shield or an eagle wing framing the motif, SPQR-like gravitas without letters
  ZJP: Japanese shipyard shogunate of 2100, black lacquer, crimson and gold with one hot neon-pink accent; kamon-like geometry, katakana-free
  ZAL: neo-Victorian Britain, wine red, gilt and mahogany; engraved Victorian trade-mark style, enamel badge plates
