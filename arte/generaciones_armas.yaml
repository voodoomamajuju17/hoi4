# Cuántas generaciones tiene cada familia de armas en el juego instalado (2026-10-24,
# contado de common/units/equipment que mandó el usuario; con las expansiones: chasis,
# cascos y fuselajes). La generación 1 es la imagen de la familia que ya está; se piden
# de la 2 en adelante (pedido del usuario: "que cada nivel se note en una mejora
# tecnológica del equipo, como Infantry Equipment I, II, III del juego").
generaciones:
  rifle: 4
  support: 1
  artillery: 3
  anti_air: 3
  anti_tank: 3
  rocket: 2
  motorized: 2
  mechanized: 3
  amphibious: 2
  armored_car: 3
  light_tank: 4
  medium_tank: 4
  heavy_tank: 4
  modern_tank: 1
  super_heavy: 1
  destroyer: 4
  cruiser: 4
  capital: 4
  carrier: 4
  submarine: 4
  light_plane: 6
  medium_plane: 5
  carrier_plane: 5
# Qué cambia de una generación a la siguiente, por tipo (en inglés, para el generador)
mejoras:
  rifle: "first a better optic and rail accessories, then an underbarrel launcher and a bullpup or modular body, finally a smart-weapon with an integrated targeting computer and drone link"
  artillery: "first a longer barrel and a better carriage, then self-loading and a fire-control box, finally a fully automated gun with a radar dish and guided shells"
  anti_air: "first more barrels and a better sight, then a radar-guided mount, finally a missile and laser point-defence system"
  anti_tank: "first a heavier launcher with a bigger warhead, then a tripod-mounted guided missile, finally a top-attack smart missile system with a targeting screen"
  rocket: "the second generation carries more and longer guided missiles on a heavier armoured launcher"
  motorized: "the second generation is armoured, with a remote weapon turret and better tyres"
  mechanized: "first more armour and a bigger turret gun, then active protection launchers and sensors"
  amphibious: "the second generation is bigger and better armoured, with water jets and a missile turret"
  armored_car: "first a bigger armoured body and a turret, then a sleek scout car with sensors and a missile pod"
  tank: "each generation is longer, lower and better armoured, with a bigger gun, more angled armour plates, then reactive armour and active-protection launchers, finally sleek composite armour with sensors and a remote turret"
  ship: "each generation is longer and sleeker, with more missile cells and radar masts, then stealth angled hull shapes, finally railguns and laser turrets"
  plane: "each generation goes from propellers to early jets, swept wings, then stealthy delta shapes and finally an unmanned drone-like airframe"
