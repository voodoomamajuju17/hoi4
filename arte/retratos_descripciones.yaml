# =============================================================================
# Descripciones de los retratos de personajes (pedido del usuario, 2026-10-06:
# "pasame un txt con pedidos de retratos de generales, mariscales, ministros").
#
# Los pedidos tienen que ser muy detallados (encuadre, ángulo, luz, ropa,
# fondo), como los de las pantallas de carga. Cada nación tiene su vestuario
# por tipo de cargo (civil, ejército, marina, aviación), su fondo y su luz,
# sacados de los retratos que ya están en el juego, para que los nuevos se
# vean de la misma serie. Cada personaje suma su cara, edad, gesto, un detalle
# propio y lo que se ve detrás.
# Lo usa tools/arte (pedidos tipo leader_portrait). Un personaje que no está
# acá recibe el pedido corto de siempre.
# =============================================================================

looks:
  EFE:
    nation: Ecofascist Empire (South America, capital Buenos Aires), year 2100
    faces: Latin American (Argentine, Brazilian, Andean mestizo)
    civil: >-
      tailored high-collared jacket in deep forest green, gold thread embroidery of laurel leaves running along the
      collar and cuffs, a small gold seedling pin on the left chest
    army: >-
      deep forest-green high-collared field tunic with gold oak-and-laurel embroidery on the collar tabs, a bark-brown
      leather cross-strap over the right shoulder, rank shown as small gold leaves on the shoulder boards, a small
      insignia of dark green-bronze bio-steel shaped like a leaf with a faint amber glow in its veins
    navy: >-
      green-black double-breasted naval coat with gold buttons shaped like seeds, gold laurel embroidery on the shoulder
      boards and cuffs, white shirt and dark green tie
    air: >-
      olive-green flight jacket with a brown leather collar, a gold badge of wings made of leaves on the chest, flight
      gloves tucked in the epaulette
    background: >-
      the overgrown imperial capital: glass greenhouse domes and towers wrapped in jungle vines and hanging gardens,
      palm crowns and banners in green and gold
    light: warm humid daylight filtered green through leaves, soft and golden on the face
  FCU:
    nation: Free Corporative Capital Union (North America, a state run by four corporations), year 2100
    faces: North American, of any origin
    civil: >-
      impeccably tailored navy-blue three-piece suit, crisp white shirt, silver silk tie, an abstract silver corporate
      lapel pin (a simple geometric shape, no letters), an expensive steel watch visible at the cuff
    army: >-
      navy-blue dress uniform of a private military contractor, silver piping on the lapels, minimalist silver rank
      chevrons on the collar, a small corporate shoulder patch (abstract shape, no letters), white shirt and navy tie
    navy: >-
      white-and-navy naval dress uniform with silver braid on the cuffs, an abstract silver corporate crest on the cap
      badge (cap held under the arm or out of frame), white shirt and navy tie
    air: >-
      navy leather flight jacket with silver zips and a sheepskin collar, a silver wing badge, mirrored aviator glasses
      folded in the chest pocket
    background: >-
      a corporate tower interior: floor-to-ceiling glass walls overlooking a skyline of glass skyscrapers, soft blue
      holographic market charts floating in the air (no readable text)
    light: cool clean daylight through glass, slight blue tint, glossy reflections on fabric and skin
  ASC:
    nation: Automated Socialist Commune (Europe, an economy run by planning algorithms and robots), year 2100
    faces: European (Central, Northern and Eastern European)
    civil: >-
      charcoal-grey high-collared work jacket with a single vertical red stripe down the left side and a white chest
      panel, a small red geometric pin (a triangle inside a hexagon)
    army: >-
      charcoal-grey field uniform with white shoulder panels and red constructivist chevrons, high mandarin collar,
      a red triangle rank badge on the collar
    navy: >-
      dark grey naval tunic with red piping, high collar, a white geometric anchor badge made of straight lines
    air: >-
      grey flight suit with a high collar, a red badge of two triangles forming wings, a white harness strap across
      the chest
    background: >-
      a white automated hall: rows of white robot arms on assembly lines, red indicator lights, a wall of abstract
      graphs and node networks (no readable text)
    light: even, cool white overhead light with clean soft shadows and small red accent lights
  HSN:
    nation: High Seas Market Nation (Asia-Pacific, a trading league of ports and islands), year 2100
    faces: Asia-Pacific (Southeast Asian, Pacific Islander, East Asian, South Asian)
    civil: >-
      dark teal double-breasted coat with brass buttons, cut like a modern merchant captain's coat, over a white
      high-collared shirt, a small brass compass-rose pin
    army: >-
      dark teal marine-infantry tunic with brass buttons, braided rope cords on the right shoulder, a brass anchor
      badge on the collar
    navy: >-
      dark teal double-breasted naval officer's coat with gold anchor-and-compass buttons, gold braid on the cuffs and
      shoulder boards, white shirt and black tie
    air: >-
      teal flight jacket with a brass compass-rose badge, a white silk scarf, a headset resting around the neck
    background: >-
      a vast megaport: container cranes, stacks of coloured containers, merchant ships and grey warships at anchor on
      calm water
    light: golden sunset over the sea, warm side light, light sea haze
  NAS:
    nation: Neo-Andean Sun Empire (Andes, a restored Inca empire, Tawantinsuyu), year 2100
