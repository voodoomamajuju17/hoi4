# Cada personaje: g (hombre/mujer), age, face (rasgos), expr (gesto), detail
# (algo propio que se ve en el cuadro), bg (lo que se ve detrás; si falta, el
# fondo de la nación). kind fuerza el vestuario (civil/army/navy/air).
characters:
  # --- EFE ------------------------------------------------------------------
  EFE_min_pereira_3:
    g: woman
    age: 48
    face: sun-tanned skin, dark hair in a thick practical braid, small scar on the chin, strong cheekbones
    expr: calm, watchful, the half-smile of someone who lives outdoors
    kind: civil
    detail: >-
      instead of the jacket she wears the ranger's field version, a green canvas coat with the gold laurel
      embroidery, a pair of old binoculars hanging on a leather strap at her chest
    bg: a ranger watchtower above the canopy, morning mist over the jungle
  EFE_min_lujan_4:
    g: man
    age: 63
    face: silver hair combed back, trimmed grey beard, deep lines, heavy-lidded eyes
    expr: composed, diplomatic, slightly superior
    detail: a heavy gold chain of office with a laurel medallion over the green jacket, a folded document in one hand
    bg: a grand chancellery hall with green marble columns wrapped in living vines
  EFE_min_kaltenbach_5:
