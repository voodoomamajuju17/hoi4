      a red triangle rank badge on the collar
    navy: >-
      dark grey naval tunic with red piping, high collar, a white geometric anchor badge made of straight lines
    air: >-
      grey flight suit with a high collar, a red badge of two triangles forming wings, a white harness strap across
      the chest
    background: >-
      a white automated hall: rows of white robot arms on assembly lines, red indicator lights, a wall of abstract
      graphs and node networks (no readable text)
    light: even, cool white overhead light with clean soft shadows and small red accent lights
  HSN:
