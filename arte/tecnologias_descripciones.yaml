        blue light.
      improved_radio: >-
        mesh battle networks: four small portable relay nodes on tripods linked by glowing lines into a square mesh.
      advanced_radio: >-
        satellite battle networks: a small communications satellite with folded solar wings above a ground antenna dish,
        a beam of light linking them.
      radio_detection: >-
        plasma sensors: a sensor pod with a glowing plasma chamber in a glass window, three thin receiver spikes on top.
      decimetric_radar: >-
        AESA radar: a flat square radar panel made of hundreds of small tiles on a rotating pedestal, a few tiles lit.
      improved_decimetric_radar: >-
        improved AESA radar: three flat radar panels arranged as a triangular tower, each one sweeping a faint green
        fan of light.
      centimetric_radar: >-
        quantum radar: a cryogenic radar emitter with a frosted cylindrical core and a dish of gold mesh, cold vapour
        around it.
      improved_centimetric_radar: >-
        improved quantum radar: twin cryogenic emitters on a mobile trailer, a holographic return blip floating above.
      advanced_centimetric_radar: >-
        orbital sensor grid: a ring of small sensor satellites around a stylised blue globe segment, thin lines of light
        connecting them.
      cavity_magnatron: >-
        gallium nitride emitters: a close-up of a radar emitter chip of dark crystal on a heat sink, glowing pale blue,
        held in a small gold clamp.
      phased_array: >-
        conformal phased arrays: a curved radar skin wrapped around the nose of a drone, its tiles shimmering like
        scales.
      monopulse_radar: >-
        multistatic radar: three separate small radar towers forming a triangle, their beams meeting at one bright point
        above the centre.
      mechanical_computing: >-
        neuromorphic computing: a brain-shaped processor of layered silicon wafers in a transparent case, synapse-like
        light pulses running through it.
      computing_machine: >-
        quantum computers: a golden chandelier-shaped cryostat of a quantum computer hanging inside an open white
        cylinder, frost at the bottom.
      improved_computing_machine: >-
        fault-tolerant quantum computers: two golden cryostats side by side linked by thick cables, a stable steady glow
        at their cores.
      advanced_computing_machine: >-
        planetary compute grid: a tall black server monolith with rows of blue lights, glowing data lines leaving it in
        every direction.
      basic_encryption: >-
        post-quantum encryption: a heavy steel data vault door with a lattice-patterned lock glowing cyan.
      improved_encryption: >-
        lattice encryption: a cube made of a glowing three-dimensional lattice of lines, a small data crystal sealed in
        its centre.
      advanced_encryption: >-
        adaptive AI encryption: a black orb whose surface patterns constantly rearrange, half covered by moving hexagonal
        shields.
      basic_decryption: >-
        quantum cryptanalysis: a cracked steel padlock hovering over a quantum chip, its pieces separating in light.
      improved_decryption: >-
        AI cryptanalysis: a server rack whose front panel shows an eye made of lines of light, a key forming in front of
        it.
      advanced_decryption: >-
        total signals intelligence: a huge listening dish array of several dishes on one structure, all pointing at the
        same spot, waves of signals converging.
      atomic_research: >-
        experimental fusion: a small tokamak test chamber, a doughnut-shaped vessel with a violet plasma ring visible
        through a window.
      nuclear_reactor: >-
        fusion reactor: a full fusion reactor core, a large torus wrapped in superconducting magnets and pipes, the
        plasma ring glowing bright white-blue.
      nukes: >-
        fusion weapons: a sleek warhead casing of white ceramic on a cradle in a vault, yellow-and-black hazard bands and
        a single red status light.
      sp_shock_hardening_techniques: >-
        shock-hardened electronics: a circuit board in a rugged sealed casing being struck by a shock wave and an electric
        arc, completely unharmed.
