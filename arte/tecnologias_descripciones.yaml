# =============================================================================
# Íconos de las tecnologías comunes a todos los países (pedido del usuario,
# 2026-10-10, captura del árbol de industria: "hacé el pedido para las imágenes
# de todas las otras tecnologías que se comparten en común").
#
# Son las tecnologías que no tienen imagen por facción (las armas, los
# vehículos, los barcos y los aviones ya la tienen, y las de unidades únicas
# también). Una imagen por tecnología, la misma para todos los países, en
# assets/COMUN/tecnologias/<tecnología>.dds. Dentro de una rama los niveles son
# el MISMO tema que va evolucionando (nunca la misma imagen dos veces): cada
# pedido nombra a sus hermanos para que no salgan iguales.
#
# Lo usa tools/arte (pedidos tipo tech_icon, id tec_<tecnología>).
# `same_as`: la variante de otra expansión de la misma tecnología (en el juego
# se ve una sola) usa la misma imagen.
# =============================================================================

style: >-
  photorealistic 3D-rendered technology icon matching the weapon and equipment icons of this Hearts of Iron IV mod:
  realistic materials, weathering and reflections, crisp detail that still reads at 64x64 pixels, the near future of
  the year 2100 (not science-fantasy), neutral design that belongs to no nation (no flags, no national colours, no
  emblems), palette of steel, graphite, white ceramic and concrete with small accents of amber, cyan or green light,
  no text, no letters, no numbers, no watermark

composition: >-
  CAMERA AND COMPOSITION: a single compact subject (or a tight group that reads as one shape), three-quarter view from
  slightly above (about 20 degrees looking down), centred; the whole subject fits inside a roughly square area in the
  middle of the canvas, filling about 80% of its height, with a little empty space all around (the game shows it both
  in a square and in a wide slot). LIGHT: soft studio key light from the upper left, gentle fill from the right, thin
  rim light separating the silhouette. BACKGROUND: fully transparent PNG, no ground plane, no cast shadow on a floor,
  no scenery. Strong, simple silhouette that reads when tiny. No text, no letters, no numbers.

groups:
  INDUSTRIA:
    intro: industry and production of a nation in the year 2100
    techs:
      basic_machine_tools: >-
        an industrial 3D printer the size of a car: an open steel gantry frame with a single heavy print head on rails,
        laying down a half-finished engine block layer by layer, a faint orange glow at the nozzle.
      improved_machine_tools: >-
        additive manufacturing cell: three robotic arms around a round build platform printing a complex metal turbine
        part at the same time, cyan laser lines fusing powder, metal dust glittering.
      advanced_machine_tools: >-
        nanofabrication: a sealed glass sphere on a polished steel pedestal, inside it a shimmering cloud of tiny
        particles assembling a small perfect gear out of nothing, soft violet-blue glow.
      concentrated_industry: >-
        megafactories, first level: one huge windowless factory block of grey concrete with a sawtooth roof and two
        tall exhaust stacks, a single loading bay lit amber.
      concentrated_industry2: >-
        megafactories, second level: two massive factory blocks joined by an enclosed sky bridge, conveyor tubes
        running between them, rooftop cooling fans.
      concentrated_industry3: >-
        megafactories, third level: a stepped industrial ziggurat of stacked factory floors, each level with its own
        glowing production line visible through long window bands.
      concentrated_industry4: >-
        megafactories, fourth level: a circular arcology factory, a ring of production halls around a central tower
        with a crane on top, maglev freight lines entering at the base.
      concentrated_industry5: >-
        megafactories, fifth level: a colossal single-structure industrial city, a dark monolith several hundred metres
        tall covered in pipes and lights, tiny cargo drones swarming around it like insects.
      dispersed_industry: >-
        distributed microfactories, first level: one shipping-container-sized microfactory with its side panels open,
        showing a small robotic arm and a printer inside, solar panel on the roof.
      dispersed_industry2: >-
        distributed microfactories, second level: three container microfactories side by side connected by thin cables,
        each with a different machine visible through its open doors.
      dispersed_industry3: >-
        distributed microfactories, third level: a cluster of small hexagonal factory pods arranged like a honeycomb on
        a concrete pad, delivery drones landing on their roofs.
      dispersed_industry4: >-
        distributed microfactories, fourth level: microfactory pods mounted on autonomous trucks driving in a convoy,
        each one still producing parts as it moves.
      dispersed_industry5: >-
        distributed microfactories, fifth level: a floating holographic map of glowing nodes connecting dozens of tiny
        factory pods spread on a stylised landscape tile, like a living network.
      assembly_line_production: >-
        lights-out assembly: a dark factory aisle with a line of identical robot arms assembling vehicle chassis in
        perfect rhythm, only their status lights glowing, no humans at all.
      flexible_line: >-
        reconfigurable factories: a factory floor of modular square tiles, robotic workstations sliding on the tiles
        into a new layout, arrows of light on the floor showing the new paths.
      streamlined_line: >-
        streamlined robotic lines: a long sleek conveyor tunnel of white ceramic, parts flowing through it so fast they
        blur, a single robotic arm at the exit placing a finished drone on a stack.
      improved_equipment_conversion: >-
        modular retrofit lines: an older armoured vehicle on a lift with its turret removed, robotic arms fitting a new
        modular weapon module in its place.
      advanced_equipment_conversion: >-
        adaptive retrofit lines: a vehicle chassis inside a ring-shaped scanning gantry, a hologram of the upgraded
        design projected over it while arms swap whole sections at once.
  CONSTRUCCION:
    intro: construction, mining and resource extraction in the year 2100
    techs:
      construction1: >-
        robotic construction, first level: a single tracked construction robot laying prefabricated concrete blocks on
        a low wall, amber warning light on its mast.
      construction2: >-
        robotic construction, second level: a giant concrete 3D printer gantry printing the curved walls of a building,
        a fresh grey layer still wet at the top.
      construction3: >-
        robotic construction, third level: a mobile tower crane walking on four legs, lifting a whole prefabricated
        apartment module into place on a half-built tower.
      construction4: >-
        robotic construction, fourth level: a swarm of flying construction drones carrying steel beams and welding a
        bridge span in mid-air.
      construction5: >-
        robotic construction, fifth level: a self-assembling arcology block, structural modules unfolding and locking
        themselves together, cranes built into the building itself.
      excavation1: >-
        autonomous mining, first level: a single autonomous excavator digging into a rock face, a pile of ore beside it
        with a few metallic glints.
      excavation2: >-
        autonomous mining, second level: an autonomous drilling rig with a long diamond drill bit boring into the ground,
        rock chips flying, a small lamp mast.
      excavation3: >-
        autonomous mining, third level: a giant bucket-wheel excavator robot biting into a terraced open-pit wall,
        conveyor belt carrying ore away.
      excavation4: >-
        autonomous mining, fourth level: a tunnel boring machine with a rotating cutter head bursting out of rock, its
        segmented body glowing with service lights.
      excavation5: >-
        autonomous mining, fifth level: a deep-crust mining tower, a tall drill derrick of white ceramic over a glowing
        shaft, ore capsules rising in a vertical maglev tube.
      fuel_silos: >-
        hydrogen storage: three white spherical high-pressure tanks on steel legs connected by insulated pipes, frost on
        the valves, a blue hazard light.
      fuel_refining: >-
        biofuel refining, first level: a small refinery unit with one fermentation tank full of green liquid and a
        distillation column, a barrel of amber fuel in front.
      fuel_refining2: >-
        biofuel refining, second level: two tall distillation columns linked by catwalks, green bioreactor tubes coiled
        around their base.
      fuel_refining3: >-
        biofuel refining, third level: a refinery block of glass bioreactor panels glowing green, pipes leading to a
        golden-amber fuel storage tank.
      fuel_refining4: >-
        biofuel refining, fourth level: a compact modular refinery on a hovering platform, catalytic towers venting
        clean white steam.
      fuel_refining5: >-
        biofuel refining, fifth level: a fully automated bio-refinery dome, a transparent cupola full of green algae
        columns, robotic arms tending valves.
      synth_oil_experiments: >-
        synthetic fuels: a laboratory bench with a glass reactor vessel turning clear gas into dark fuel, a single drop
        falling from a nozzle into a beaker.
      oil_processing: >-
        hydrocarbon synthesis: a squat chemical reactor of steel with pressure gauges and a pipe dripping black synthetic
        oil into a steel drum.
      improved_oil_processing: >-
        improved hydrocarbon synthesis: a pair of tall reactor towers with heat exchangers, a pipeline leaving them with
        a flow meter glowing amber.
      advanced_oil_processing: >-
        carbon-capture fuels: a wall of large fans pulling air into a capture unit, a pipe carrying the captured carbon
        into a reactor that fills a fuel tank.
      modern_oil_processing: >-
        algae fuel synthesis: long transparent tubes full of bright green algae bundled into a reactor, a valve filling
        a canister with golden fuel.
      rubber_processing: >-
        synthetic elastomers, first level: a vat of white liquid polymer with a mixing paddle, a sheet of black rubber
        coming out of a roller.
      improved_rubber_processing: >-
        synthetic elastomers, second level: a rubber extrusion machine pushing out a long black profile, a stack of
        finished tyres beside it.
      advanced_rubber_processing: >-
        synthetic elastomers, third level: a robotic arm lifting a freshly moulded heavy vehicle tyre out of a glowing
        press.
      modern_rubber_processing: >-
        synthetic elastomers, fourth level: an airless honeycomb tyre of advanced polymer on a test rig, a laser
        scanning its tread.
  ELECTRONICA:
    intro: electronics, computing, sensors and nuclear technology in the year 2100
    techs:
      electronic_mechanical_engineering: >-
        photonic engineering: an open circuit module where beams of light run through glass channels instead of
        wires, tiny prisms splitting a cyan beam.
      radio: >-
