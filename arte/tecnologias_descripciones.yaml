      marines: >-
        autonomous littoral infantry, first level: an amphibious infantry robot with waterproof plating stepping out of
        shallow surf.
      marines2: >-
        autonomous littoral infantry, second level: two littoral robots carrying a heavy assault rifle each, climbing a
