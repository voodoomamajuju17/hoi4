# Generado por tools/arte/auditoria.py (2026-11-03): íconos del juego que siguen siendo
# los de 1936, con su imagen de referencia en arte/referencias/. No editar a mano.
estilo: 'game user-interface icon for a grand strategy game set in the year 2100, matching the existing ''2100 Meganations''
  icon set: aged bronze and warm copper metal (#c27a45 highlights #f0b585, shadows #6b3a1c), crisp art-deco engraving,
  at most one small coloured accent (teal #4fd6c8, or the colour the reference uses to mean something: red for danger,
  green for good). Solid dark outline about 3% of the canvas wide. Flat straight-on front view, light from the top
  left, no cast shadow. One bold simple silhouette with at most three inner details: it must read at 30 pixels.
  Transparent background, nothing around the subject: no plate, no circle, no frame. No text, no letters, no numbers,
  no watermark.'
