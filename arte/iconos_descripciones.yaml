# Qué dibujar en cada ícono de espíritu nacional y de foco (2026-10-19, pedido
# del usuario: "¿la descripción alcanza para que ChatGPT las haga bien?" -> no:
# era el texto del juego). Un solo objeto o símbolo concreto, nada de reglas.
# `dibujo`: el tema exacto (en inglés, para el generador).
# `paleta`: opcional; si falta, la de la potencia (o una neutra si es de todos).

paletas:
  JUNTA: "military junta of a cult of the Black Sun: black, bone white, gunmetal and a cold eclipse-orange rim light"
  MEGANATIONS: "neutral world-of-2100 palette that belongs to no nation: steel, graphite, concrete, muted ochre, one accent colour"
  ZSG: "jungle sanctuary: deep greens, moss, mist, warm amber light"
  PTA: "far south ice outpost: white, pale blue, slate grey, a touch of imperial green"
  YYG: "subtropical frontier province: red earth, green forest, river blue, a touch of imperial gold"
  ZAS: "pirate sea republic: deep navy, weathered teal, brass and sail-white"

  ZJP: "Shipyard Shogunate of Japan: navy steel, dock-crane yellow, rust red, crimson rising-sun accent, welding-spark white"
  # 2026-11-01: Albión ludita (los dos caminos llevan su paleta en cada ícono)
  ZAL: "Albion Workers' Republic, hand-made Luddite Britain: wet red brick, wool tweed, coal smoke grey, polished brass, oxblood red"

